<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="shortcuts-trigger-selection-title shortcuts-trigger-selection-description" viewBox="0 0 960 640" preserveAspectRatio="xMidYMid meet">
  <title id="shortcuts-trigger-selection-title">Illustration of choosing a Wallet transaction automation trigger</title>
  <desc id="shortcuts-trigger-selection-description">A schematic card shows a Wallet transaction automation trigger selected for any transaction, with merchant and card filters shown as optional choices.</desc>
  <defs>
    <linearGradient id="trigger-paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff8ed"/>
      <stop offset="1" stop-color="#f4eadc"/>
    </linearGradient>
    <linearGradient id="trigger-coral" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ff7c62"/>
      <stop offset="1" stop-color="#db4f45"/>
    </linearGradient>
    <linearGradient id="trigger-teal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#35b7ad"/>
      <stop offset="1" stop-color="#0e8e8d"/>
    </linearGradient>
    <filter id="trigger-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#092348" flood-opacity=".14"/>
    </filter>
    <pattern id="trigger-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d7c7b7" stroke-opacity=".35" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="960" height="640" rx="38" fill="url(#trigger-paper)"/>
  <rect width="960" height="640" rx="38" fill="url(#trigger-grid)" opacity=".45"/>
  <path d="M56 91C182 38 307 38 431 92c136 60 269 54 398-17" fill="none" stroke="#0e8e8d" stroke-opacity=".18" stroke-width="22" stroke-linecap="round"/>
  <path d="M95 544c128-53 251-51 369 8 127 63 254 62 380-4" fill="none" stroke="#db4f45" stroke-opacity=".16" stroke-width="18" stroke-linecap="round"/>
  <g transform="translate(58 48)">
    <circle cx="62" cy="62" r="46" fill="url(#trigger-coral)"/>
    <text x="62" y="79" text-anchor="middle" fill="#fff8ed" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700">1</text>
    <text x="138" y="49" fill="#092348" font-family="Georgia, 'Times New Roman', serif" font-size="39" font-weight="700">Choose a Wallet</text>
    <text x="138" y="92" fill="#092348" font-family="Georgia, 'Times New Roman', serif" font-size="39" font-weight="700">transaction trigger</text>
    <rect x="666" y="-1" width="166" height="46" rx="23" fill="#db4f45"/>
    <text x="749" y="29" text-anchor="middle" fill="#fff8ed" font-family="Verdana, Geneva, sans-serif" font-size="22" font-weight="700">Illustration</text>
  </g>
  <g filter="url(#trigger-shadow)">
    <rect x="108" y="176" width="744" height="337" rx="26" fill="#fffaf2" stroke="#d7c7b7" stroke-width="2"/>
    <rect x="136" y="204" width="386" height="78" rx="18" fill="#092348"/>
    <circle cx="178" cy="243" r="27" fill="url(#trigger-teal)"/>
    <path d="M162 239h32v18a8 8 0 0 1-8 8h-16a8 8 0 0 1-8-8v-18Z" fill="#fff8ed"/>
    <path d="M166 235h24l-4-8h-16l-4 8Z" fill="#fff8ed"/>
    <circle cx="187" cy="249" r="4" fill="#0e8e8d"/>
    <text x="224" y="236" fill="#35b7ad" font-family="Verdana, Geneva, sans-serif" font-size="21" font-weight="700">Trigger</text>
    <text x="224" y="264" fill="#fff8ed" font-family="Verdana, Geneva, sans-serif" font-size="25" font-weight="700">Wallet transaction</text>
    <text x="136" y="329" fill="#53606f" font-family="Verdana, Geneva, sans-serif" font-size="23">Start from a new card payment.</text>
    <g transform="translate(136 357)">
      <rect width="688" height="58" rx="17" fill="#e9f7f4" stroke="#35b7ad" stroke-width="2"/>
      <circle cx="33" cy="29" r="18" fill="#0e8e8d"/>
      <path d="M23 29h20M33 19v20" stroke="#fff8ed" stroke-width="4" stroke-linecap="round"/>
      <text x="75" y="38" fill="#092348" font-family="Verdana, Geneva, sans-serif" font-size="26" font-weight="700">Any transaction</text>
      <circle cx="640" cy="29" r="18" fill="#0e8e8d"/>
      <path d="m632 29 6 7 12-15" fill="none" stroke="#fff8ed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(136 429)">
      <rect width="328" height="58" rx="17" fill="#fffaf2" stroke="#d7c7b7" stroke-width="2"/>
      <circle cx="33" cy="29" r="18" fill="#fff1df" stroke="#d7c7b7" stroke-width="2"/>
      <path d="M24 37h18l-2-17H26l-2 17Z" fill="none" stroke="#092348" stroke-width="3" stroke-linejoin="round"/>
      <path d="M29 22a5 5 0 0 1 10 0" fill="none" stroke="#092348" stroke-width="3"/>
      <text x="75" y="37" fill="#092348" font-family="Verdana, Geneva, sans-serif" font-size="22" font-weight="700">Merchant</text>
    </g>
    <g transform="translate(496 429)">
      <rect width="328" height="58" rx="17" fill="#fffaf2" stroke="#d7c7b7" stroke-width="2"/>
      <circle cx="33" cy="29" r="18" fill="#eef2fb" stroke="#d7c7b7" stroke-width="2"/>
      <rect x="21" y="22" width="24" height="16" rx="3" fill="none" stroke="#092348" stroke-width="3"/>
      <path d="M23 28h20M27 34h7" stroke="#092348" stroke-width="3" stroke-linecap="round"/>
      <text x="75" y="37" fill="#092348" font-family="Verdana, Geneva, sans-serif" font-size="22" font-weight="700">Card</text>
    </g>
  </g>
  <g>
    <path d="M480 513v47" stroke="#0e8e8d" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 10"/>
    <circle cx="480" cy="576" r="25" fill="#0e8e8d"/>
    <path d="M469 576h22M480 565v22" stroke="#fff8ed" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(118 532)">
    <rect width="724" height="70" rx="22" fill="#fffaf2" stroke="#d7c7b7" stroke-width="2"/>
    <rect x="24" y="19" width="45" height="32" rx="7" fill="#0e8e8d"/>
    <rect x="35" y="12" width="45" height="32" rx="7" fill="#ff7c62" opacity=".9"/>
    <text x="111" y="45" fill="#092348" font-family="Verdana, Geneva, sans-serif" font-size="25" font-weight="700">Wallet transaction trigger</text>
  </g>
</svg>

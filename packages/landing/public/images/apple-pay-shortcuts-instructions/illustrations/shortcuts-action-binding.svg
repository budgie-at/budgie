<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="shortcuts-action-binding-title shortcuts-action-binding-description" viewBox="0 0 960 640" preserveAspectRatio="xMidYMid meet">
  <title id="shortcuts-action-binding-title">Illustration of binding Wallet transaction fields to a Budgie capture action</title>
  <desc id="shortcuts-action-binding-description">A schematic automation step shows a Budgie capture action using amount, merchant, required Budgie account, and optional card details.</desc>
  <defs>
    <linearGradient id="binding-paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff8ed"/>
      <stop offset="1" stop-color="#f4eadc"/>
    </linearGradient>
    <linearGradient id="binding-coral" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ff7c62"/>
      <stop offset="1" stop-color="#db4f45"/>
    </linearGradient>
    <linearGradient id="binding-teal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#35b7ad"/>
      <stop offset="1" stop-color="#0e8e8d"/>
    </linearGradient>
    <filter id="binding-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#092348" flood-opacity=".14"/>
    </filter>
    <pattern id="binding-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#d7c7b7" opacity=".6"/>
    </pattern>
  </defs>
  <rect width="960" height="640" rx="38" fill="url(#binding-paper)"/>
  <rect width="960" height="640" rx="38" fill="url(#binding-dots)" opacity=".5"/>
  <path d="M93 137c100 41 180 40 241-4 87-62 189-49 309 39 55 40 127 44 216 12" fill="none" stroke="#0e8e8d" stroke-opacity=".17" stroke-width="20" stroke-linecap="round"/>

    <text x="138" y="49" fill="#092348" font-family="Georgia, 'Times New Roman', serif" font-size="39" font-weight="700">Add Budgie capture</text>
    <text x="138" y="92" fill="#092348" font-family="Georgia, 'Times New Roman', serif" font-size="39" font-weight="700">and bind fields</text>

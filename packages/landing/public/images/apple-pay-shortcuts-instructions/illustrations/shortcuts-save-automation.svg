<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="shortcuts-save-automation-title shortcuts-save-automation-description" viewBox="0 0 960 640" preserveAspectRatio="xMidYMid meet">
  <title id="shortcuts-save-automation-title">Illustration of selecting Run Immediately and saving the automation</title>
  <desc id="shortcuts-save-automation-description">A schematic automation settings card shows Run Immediately selected, Ask Before Running left unselected, and a save action finishing the setup.</desc>
  <defs>
    <linearGradient id="save-paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff8ed"/>
      <stop offset="1" stop-color="#f4eadc"/>
    </linearGradient>
    <linearGradient id="save-coral" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ff7c62"/>
      <stop offset="1" stop-color="#db4f45"/>
    </linearGradient>
    <linearGradient id="save-teal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#35b7ad"/>
      <stop offset="1" stop-color="#0e8e8d"/>
    </linearGradient>
    <filter id="save-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#092348" flood-opacity=".14"/>
    </filter>
    <pattern id="save-stripes" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="44" fill="#d7c7b7" opacity=".18"/>
    </pattern>
  </defs>
  <rect width="960" height="640" rx="38" fill="url(#save-paper)"/>
  <rect width="960" height="640" rx="38" fill="url(#save-stripes)" opacity=".55"/>
  <path d="M68 165c126-68 260-75 400-23 139 51 282 46 429-17" fill="none" stroke="#0e8e8d" stroke-opacity=".16" stroke-width="20" stroke-linecap="round"/>
  <path d="M103 529c105-43 214-35 327 23 122 62 263 52 425-31" fill="none" stroke="#db4f45" stroke-opacity=".15" stroke-width="18" stroke-linecap="round"/>
  <g transform="translate(58 48)">
    <circle cx="62" cy="62" r="46" fill="url(#save-coral)"/>
    <text x="62" y="79" text-anchor="middle" fill="#fff8ed" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700">3</text>
    <text x="138" y="49" fill="#092348" font-family="Georgia, 'Times New Roman', serif" font-size="39" font-weight="700">Choose Run Immediately</text>
    <text x="138" y="92" fill="#092348" font-family="Georgia, 'Times New Roman', serif" font-size="39" font-weight="700">and save</text>
    <rect x="666" y="-1" width="166" height="46" rx="23" fill="#db4f45"/>
    <text x="749" y="29" text-anchor="middle" fill="#fff8ed" font-family="Verdana, Geneva, sans-serif" font-size="22" font-weight="700">Illustration</text>
  </g>
  <g filter="url(#save-shadow)">
    <rect x="125" y="176" width="710" height="291" rx="29" fill="#fffaf2" stroke="#d7c7b7" stroke-width="2"/>
    <text x="167" y="224" fill="#0e8e8d" font-family="Verdana, Geneva, sans-serif" font-size="22" font-weight="700">Execution</text>
    <g transform="translate(167 246)">
      <rect width="626" height="81" rx="22" fill="#e9f7f4" stroke="#35b7ad" stroke-width="2"/>
      <circle cx="41" cy="40.5" r="28" fill="url(#save-teal)"/>
      <path d="m44 20-20 27h17l-7 16 24-30H42l2-13Z" fill="#fff8ed"/>
      <text x="91" y="48" fill="#092348" font-family="Verdana, Geneva, sans-serif" font-size="29" font-weight="700">Run Immediately</text>
      <circle cx="579" cy="40.5" r="19" fill="#0e8e8d"/>
      <path d="m570 40 7 8 14-17" fill="none" stroke="#fff8ed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(167 347)">
      <rect width="626" height="81" rx="22" fill="#fffaf2" stroke="#d7c7b7" stroke-width="2"/>
      <circle cx="41" cy="40.5" r="28" fill="#fff1df" stroke="#d7c7b7" stroke-width="2"/>
      <circle cx="41" cy="40.5" r="15" fill="none" stroke="#092348" stroke-width="4"/>
      <path d="M41 29v13l11 8" fill="none" stroke="#092348" stroke-width="4" stroke-linecap="round"/>
      <text x="91" y="48" fill="#092348" font-family="Verdana, Geneva, sans-serif" font-size="29" font-weight="700">Ask Before Running</text>
      <circle cx="579" cy="40.5" r="18" fill="none" stroke="#8c98a5" stroke-width="3"/>
    </g>
  </g>
  <path d="M480 467v46" stroke="#0e8e8d" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 10"/>
  <g filter="url(#save-shadow)" transform="translate(292 511)">
    <rect width="376" height="64" rx="24" fill="url(#save-teal)"/>
    <rect x="31" y="17" width="31" height="31" rx="6" fill="#fff8ed"/>
    <path d="M38 24h17M38 33h17M38 42h17" stroke="#0e8e8d" stroke-width="4" stroke-linecap="round"/>
    <text x="193" y="42" text-anchor="middle" fill="#fff8ed" font-family="Verdana, Geneva, sans-serif" font-size="29" font-weight="700">Save Automation</text>
  </g>
  <g transform="translate(134 584)">
    <rect width="692" height="34" rx="17" fill="#092348"/>
    <path d="m29 16 8 8 17-18" fill="none" stroke="#35b7ad" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="74" y="24" fill="#fff8ed" font-family="Verdana, Geneva, sans-serif" font-size="22" font-weight="700">Automation is ready</text>
  </g>
  <g stroke="#db4f45" stroke-width="4" stroke-linecap="round" opacity=".75">
    <path d="M245 526h-28"/>
    <path d="M260 491l-18-22"/>
    <path d="M260 560l-18 22"/>
    <path d="M715 526h28"/>
    <path d="M700 491l18-22"/>
    <path d="M700 560l18 22"/>
  </g>
</svg>

steps:
  - launch: com.vitalyiegorov.budgie.e2e
  - tool: open-url
    args:
      url: budgie://settings?anchor=data
  - tap:
      text: Not Now
  - await:
      idle: true
  - when:
      hidden:
        id: SettingsPage.Container
    steps:
      - tool: open-url
        args:
          url: budgie://settings
      - await:
          idle: true
      - await:
          visible:
            id: SettingsPage.Container
          timeout: 15000
  - await:
      visible:
        id: SettingsPage.Container
      timeout: 15000
  - scroll-to:
      target:
        id: SettingsPage.ImportDatabaseCard
      direction: up
  - when:
      hidden:
        id: SettingsPage.ImportDatabaseCard
    steps:
      - scroll-to:
          target:
            id: SettingsPage.ImportDatabaseCard
          direction: down
      - await:
          idle: true
  - await:
      visible:
        id: SettingsPage.ImportDatabaseCard
      timeout: 5000
  - tap:
      id: SettingsPage.ImportDatabaseCard
  - await:
      idle: true
  - await:
      visible:
        text: Cancel
      timeout: 15000
  - when:
      visible:
        text: Apple Account Verification
    steps:
      - tap:
          text: Not Now
      - await:
          idle: true
  - when:
      visible:
        text: No Results for .*
    steps:
      - tap:
          text: Clear text
      - await:
          idle: true
  - when:
      hidden:
        id: 11.db(, db)?
    steps:
      - when:
          visible:
            id: E2EFixtures, Folder
        steps:
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          visible:
            text: budgie \(E2E\), Actions Menu
        steps:
          - await:
              visible:
                id: E2EFixtures, Folder
              timeout: 3000
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          hidden:
            text: E2EFixtures, Actions Menu
        steps:
          - when:
              hidden:
                text: budgie \(E2E\), Actions Menu
            steps:
              - tap:
                  id: BackButton
              - tap:
                  id: BackButton
              - tap:
                  id: BackButton
              - tap:
                  text: Browse
              - await:
                  idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - when:
                      visible:
                        text: On My iPhone
                    steps:
                      - tap:
                          text: On My iPhone
                      - await:
                          idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - scroll-to:
                      target:
                        text: budgie \(E2E\)
                      direction: down
              - await:
                  visible:
                    text: budgie \(E2E\)
                  timeout: 3000
              - tap:
                  text: budgie \(E2E\)
              - await:
                  idle: true
              - await:
                  visible:
                    id: E2EFixtures, Folder
                  timeout: 3000
              - tap:
                  id: E2EFixtures, Folder
              - await:
                  idle: true
  - scroll-to:
      target:
        id: 11.db(, db)?
      direction: down
  - when:
      hidden:
        id: 11.db(, db)?
    steps:
      - scroll-to:
          target:
            text: 11.db(, db)?
          direction: down
  - await:
      idle: true
  - when:
      visible:
        id: 11.db(, db)?
    steps:
      - tap:
          id: 11.db(, db)?
  - when:
      hidden:
        id: 11.db(, db)?
    steps:
      - tap:
          text: 11.db(, db)?
  - await:
      idle: true
  - when:
      visible:
        text: Continue
    steps:
      - tap:
          text: Continue
      - await:
          idle: true
      - when:
          visible:
            id: 11.db(, db)?
        steps:
          - tap:
              id: 11.db(, db)?
      - when:
          hidden:
            id: 11.db(, db)?
        steps:
          - tap:
              text: 11.db(, db)?
      - await:
          idle: true
  - when:
      visible:
        text: Open
    steps:
      - tap:
          text: Open
  - await:
      visible:
        text: Importing a database will replace all current data.*
      timeout: 3000
  - tap:
      text: Import Database
  - await:
      idle: true
  - await:
      visible:
        id: TabBar.Home
      timeout: 30000
  - tap:
      id: TabBar.Home
  - await:
      visible:
        id: HomePage.TotalBalance
      timeout: 30000
  - tool: open-url
    args:
      url: budgie://transactions
  - await:
      idle: true
  - await:
      visible:
        id: TransactionsPage.Container
      timeout: 10000
  - await:
      idle: true
  - echo: Native recovery attempt (migrated from retry, max 1)
  - when:
      hidden:
        id: ActionItem.Transfer.Label
    steps:
      - tap:
          id: ActionButton
  - await:
      visible:
        id: ActionItem.Transfer.Label
      timeout: 3000
  - await:
      idle: true
  - tap:
      id: ActionItem.Transfer.Label
  - await:
      visible:
        text: New Transfer
  - await:
      visible:
        id: TransactionKeypad.Digit.1
  - await:
      idle: true
  - tap:
      id: TransactionKeypad.Digit.7
  - tap:
      id: TransactionKeypad.Digit.5
  - tap:
      id: TransferForm.FromAccount
  - await:
      visible:
        id: AccountPickerBottomSheet.Input
  - tap:
      id: AccountPickerBottomSheet.Input
  - tool: keyboard
    args:
      text: E2E Txn Account
  - tap:
      text: Done
  - await:
      idle: true
  - await:
      visible:
        id: AccountPickerBottomSheet.Option.E2E Txn Account
  - tap:
      id: AccountPickerBottomSheet.Option.E2E Txn Account
  - await:
      hidden:
        id: AccountPickerBottomSheet.Input
  - tap:
      id: TransferForm.ToAccount
  - await:
      visible:
        id: AccountPickerBottomSheet.Input
  - tap:
      id: AccountPickerBottomSheet.Input
  - tool: keyboard
    args:
      text: E2E Foreign Account
  - tap:
      text: Done
  - await:
      idle: true
  - await:
      visible:
        id: AccountPickerBottomSheet.Option.E2E Foreign Account
  - tap:
      id: AccountPickerBottomSheet.Option.E2E Foreign Account
  - await:
      hidden:
        id: AccountPickerBottomSheet.Input
  - await:
      visible:
        id: TransferForm.ConversionRow
  - await:
      visible:
        id: TransactionForm.CommentInput
      timeout: 10000
  - tap:
      id: TransactionForm.CommentInput
  - await:
      visible:
        id: NoteInput.Input
      timeout: 5000
  - tap:
      id: NoteInput.Input
  - tool: keyboard
    args:
      text: E2E Cross Currency Transfer
  - tap:
      id: NoteInput.SubmitButton
  - await:
      hidden:
        id: NoteInput.Input
      timeout: 5000
  - await:
      idle: true
  - tap:
      id: TransactionForm.SubmitButton
  - await:
      visible:
        id: TransactionsPage.Container
      timeout: 60000
  - await:
      visible:
        id: TransactionCard.Label.E2E_Cross_Currency_Transfer
      timeout: 5000
  - tap:
      id: TabBar.Home
  - await:
      visible:
        id: HomePage.TotalBalance
  - assert:
      visible:
        id: AccountCard.Balance.E2E_Txn_Account.25
  - assert:
      visible:
        id: AccountCard.Balance.E2E_Foreign_Account.165
  - tap:
      id: TabBar.Transactions
  - await:
      idle: true
  - await:
      visible:
        id: TransactionsPage.Container
      timeout: 15000
  - tap:
      id: TransactionCard.Label.E2E_Cross_Currency_Transfer
  - await:
      visible:
        id: TransactionInfo.Page
      timeout: 5000
  - assert:
      visible:
        id: TransactionInfo.Row.FromAccount
  - assert:
      visible:
        id: TransactionInfo.Row.ToAccount
  - assert:
      visible:
        id: TransactionInfo.Row.ExchangeRate
  - tap:
      id: TransactionInfo.EditButton.Label
  - await:
      visible:
        id: TransferForm.ConversionRow
      timeout: 5000
  - long-press:
      id: TransactionKeypad.Backspace
  - tap:
      id: TransactionKeypad.Digit.5
  - tap:
      id: TransactionKeypad.Digit.0
  - tap:
      id: TransactionForm.SubmitButton
  - await:
      visible:
        id: TransactionInfo.Page
      timeout: 15000
  - assert:
      visible:
        id: TransactionInfo.Row.ExchangeRate
  - tap:
      id: PageHeader.BackButton
  - await:
      visible:
        id: TransactionCard.Label.E2E_Cross_Currency_Transfer
      timeout: 5000
  - tap:
      id: TabBar.Home
  - await:
      visible:
        id: HomePage.TotalBalance
  - assert:
      visible:
        id: AccountCard.Balance.E2E_Txn_Account.50
  - assert:
      visible:
        id: AccountCard.Balance.E2E_Foreign_Account.150
  - tap:
      id: TabBar.Transactions
  - await:
      idle: true
  - await:
      visible:
        id: TransactionsPage.Container
      timeout: 15000
  - tap:
      id: TransactionCard.Label.E2E_Cross_Currency_Transfer
  - await:
      visible:
        id: TransactionInfo.Page
      timeout: 5000
  - await:
      visible:
        id: TransactionInfo.Page
      timeout: 20000
  - await:
      visible:
        id: TransactionActionsMenu.TriggerButton
      timeout: 20000
  - tap:
      id: TransactionActionsMenu.TriggerButton
  - await:
      visible:
        id: TransactionActionsMenu.DeleteButton
  - tap:
      id: TransactionActionsMenu.DeleteButton
  - await:
      idle: true
  - await:
      idle: true
  - await:
      visible:
        text: Are you sure?
      timeout: 3000
  - tap:
      text: Delete
  - await:
      idle: true
  - await:
      hidden:
        text: Are you sure?
      timeout: 10000
  - tool: open-url
    args:
      url: budgie://transactions
  - await:
      idle: true
  - await:
      visible:
        id: TransactionsPage.Container
      timeout: 10000
  - assert:
      hidden:
        id: TransactionCard.Label.E2E_Cross_Currency_Transfer
  - await:
      visible:
        id: TabBar.Home
      timeout: 3000
  - tap:
      id: TabBar.Home
  - await:
      visible:
        id: HomePage.TotalBalance
  - assert:
      visible:
        id: AccountCard.Balance.E2E_Txn_Account.100
  - assert:
      visible:
        id: AccountCard.Balance.E2E_Foreign_Account.100

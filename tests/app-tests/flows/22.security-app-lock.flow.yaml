appId: ${APP_ID}
---
- launchApp:
    appId: ${APP_ID}
    clearState: false
    permissions:
      contacts: allow
      microphone: allow
    arguments:
      e2eReset: true
      e2eResetToken: 'security-app-lock'
- retry:
    maxRetries: 3
    commands:
      - runFlow: subflows/handle-dev-client-startup.flow.yaml
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: 'HomePage.TotalBalance'
          timeout: 30000

- tapOn:
    id: 'TabBar.Home'
- waitForAnimationToEnd
- tapOn:
    id: 'TabBar.Settings'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'SettingsPage.Container'
    timeout: 15000

- scrollUntilVisible:
    element:
      id: 'SettingsPage.AppLockCard'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'SettingsPage.AppLockCard'

- extendedWaitUntil:
    visible:
      id: 'PinPage.Container'
    timeout: 10000

- tapOn:
    id: 'PinPage.Digit.1'
- tapOn:
    id: 'PinPage.Digit.2'
- tapOn:
    id: 'PinPage.Digit.3'
- tapOn:
    id: 'PinPage.Digit.4'

- extendedWaitUntil:

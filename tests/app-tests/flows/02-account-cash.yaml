steps:
  - launch: com.vitalyiegorov.budgie.e2e
  - tool: open-url
    args:
      url: budgie://settings?anchor=data
  - when:
      visible:
        text: Open in .*
    steps:
      - tap:
          text: Open
      - await:
          idle: true
  - when:
      visible: &a1
        text: Not Now
    steps:
      - tap: *a1
  - await:
      idle: true
  - when:
      hidden:
        id: SettingsPage.Container
    steps:
      - tool: open-url
        args:
          url: budgie://settings
      - when:
          visible:
            text: Open in .*
        steps:
          - tap:
              text: Open
          - await:
              idle: true
      - await:
          idle: true
      - await:
          visible:
            id: SettingsPage.Container
          timeout: 15000
  - await:
      visible:
        id: SettingsPage.Container
      timeout: 15000
  - echo: Optional scroll probe for {"id":"SettingsPage.ImportDatabaseCard"}
  - when:
      hidden:
        id: SettingsPage.ImportDatabaseCard
    steps:
      - scroll-to:
          target:
            id: SettingsPage.ImportDatabaseCard
          direction: down
      - await:
          idle: true
  - await:
      visible:
        id: SettingsPage.ImportDatabaseCard
      timeout: 5000
  - tap:
      id: SettingsPage.ImportDatabaseCard
  - await:
      idle: true
  - await:
      visible:
        text: Cancel
      timeout: 15000
  - when:
      visible:
        text: Apple Account Verification
    steps:
      - tap:
          text: Not Now
      - await:
          idle: true
  - when:
      visible:
        text: No Results for .*
    steps:
      - when:
          visible: &a2
            text: Clear text
        steps:
          - tap: *a2
      - await:
          idle: true
  - when:
      hidden:
        id: 02.db(, db)?
    steps:
      - when:
          visible:
            id: E2EFixtures, Folder
        steps:
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          visible:
            text: budgie \(E2E\), Actions Menu
        steps:
          - await:
              visible:
                id: E2EFixtures, Folder
              timeout: 3000
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          hidden:
            text: E2EFixtures, Actions Menu
        steps:
          - when:
              hidden:
                text: budgie \(E2E\), Actions Menu
            steps:
              - when:
                  visible: &a3
                    id: BackButton
                steps:
                  - tap: *a3
              - when:
                  visible: &a4
                    id: BackButton
                steps:
                  - tap: *a4
              - when:
                  visible: &a5
                    id: BackButton
                steps:
                  - tap: *a5
              - when:
                  visible: &a6
                    text: Browse
                steps:
                  - tap: *a6
              - await:
                  idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - when:
                      visible:
                        text: On My iPhone
                    steps:
                      - tap:
                          text: On My iPhone
                      - await:
                          idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - scroll-to:
                      target:
                        text: budgie \(E2E\)
                      direction: down
              - await:
                  visible:
                    text: budgie \(E2E\)
                  timeout: 3000
              - tap:
                  text: budgie \(E2E\)
              - await:
                  idle: true
              - await:
                  visible:
                    id: E2EFixtures, Folder
                  timeout: 3000
              - tap:
                  id: E2EFixtures, Folder
              - await:
                  idle: true
  - echo: Optional scroll probe for {"id":"02.db(, db)?"}
  - when:
      hidden:
        id: 02.db(, db)?
    steps:
      - scroll-to:
          target:
            text: 02.db(, db)?
          direction: down
  - await:
      idle: true
  - when:
      visible:
        id: 02.db(, db)?
    steps:
      - tap:
          id: 02.db(, db)?
  - when:
      hidden:
        id: 02.db(, db)?
    steps:
      - when:
          visible: &a7
            text: 02.db(, db)?
        steps:
          - tap: *a7
  - await:
      idle: true
  - when:
      visible:
        text: Continue
    steps:
      - tap:
          text: Continue
      - await:
          idle: true
      - when:
          visible:
            id: 02.db(, db)?
        steps:
          - tap:
              id: 02.db(, db)?
      - when:
          hidden:
            id: 02.db(, db)?
        steps:
          - when:
              visible: &a8
                text: 02.db(, db)?
            steps:
              - tap: *a8
      - await:
          idle: true
  - when:
      visible:
        text: Open
    steps:
      - tap:
          text: Open
  - await:
      visible:
        text: Importing a database will replace all current data.*
      timeout: 3000
  - tap:
      text: Import Database
  - await:
      idle: true
  - await:
      visible:
        id: TabBar.Home
      timeout: 30000
  - tap:
      id: TabBar.Home
  - await:
      visible:
        id: HomePage.TotalBalance
      timeout: 30000
  - tap:
      id: TabBar.Home
  - await:
      idle: true
  - when:
      visible:
        text: No accounts yet
    steps:
      - tap:
          id: AccountsEmptyState.AddAccountButton
      - await:
          visible:
            id: CreateAccount.BANK
          timeout: 10000
  - when:
      hidden:
        id: CreateAccount.BANK
    steps:
      - when:
          visible:
            id: ActionButton
        steps:
          - tap:
              id: ActionButton
      - when:
          hidden:
            id: ActionButton
        steps:
          - await:
              visible:
                id: ActionButton
              timeout: 10000
          - tap:
              id: ActionButton
      - await:
          idle: true
      - await:
          visible:
            id: ActionItem.AddAccount.Label
          timeout: 10000
      - tap:
          id: ActionItem.AddAccount.Label
      - await:
          idle: true
  - await:
      visible:
        id: CreateAccount.BANK
      timeout: 10000
  - await:
      visible:
        id: CreateAccount.CASH
      timeout: 3000
  - tap:
      id: CreateAccount.CASH
  - await:
      idle: true
  - await:
      visible:
        id: AccountForm.NameInput
      timeout: 3000
  - tap:
      id: AccountForm.NameInput
  - tool: keyboard
    args:
      text: E2E Savings Account
  - tap:
      id: AccountForm.CurrencySelector
  - await:
      idle: true
  - await:
      visible:
        id: CurrencySelector.SearchInput
      timeout: 3000
  - tap:
      id: CurrencySelector.SearchInput
  - tool: keyboard
    args:
      text: CAD
  - await:
      visible:
        id: AccountForm.CurrencyOption.CAD
      timeout: 3000
  - tap:
      id: AccountForm.CurrencyOption.CAD
  - await:
      idle: true
  - await:
      hidden:
        id: CurrencySelector.SearchInput
      timeout: 3000
  - await:
      visible:
        id: CreateAccount.Amount
      timeout: 3000
  - tap:
      id: CreateAccount.Amount
  - tool: keyboard
    args:
      text: "250"
  - tap:
      text: ACCOUNT NAME & ICON
  - await:
      visible:
        id: AccountForm.SubmitButton
      timeout: 3000
  - tap:
      id: AccountForm.SubmitButton
  - await:
      visible:
        id: HomePage.TotalBalance
      timeout: 15000
  - await:
      visible:
        id: AccountCard.E2E Savings Account
      timeout: 20000
  - scroll-to:
      target:
        id: AccountCard.E2E Savings Account
      direction: down
  - await:
      idle: true
  - tap:
      id: AccountCard.E2E Savings Account
  - await:
      visible:
        id: AccountDetails.Page
      timeout: 10000
  - await:
      visible:
        id: TransactionCard.Badge.Adjustment
      timeout: 10000
  - assert:
      visible:
        id: TransactionCard.AdjustmentAmount.250
  - tap:
      id: PageHeader.BackButton
  - await:
      visible:
        id: HomePage.TotalBalance
      timeout: 10000
  - assert:
      visible:
        id: AccountCard.E2E Savings Account

appId: ${APP_ID}
env:
    FIRST_PDF_ROW_ID_MATCH: 'erste-statement-008, pdf'
    SECOND_PDF_ROW_ID_MATCH: 'erste-statement-009, pdf'
---
- runFlow:
      file: subflows/import/import-database-from-settings.flow.yaml
      env:
          FIXTURE_ROW_ID_MATCH: '16.db(, db)?'
          FILE_PICKER_SCROLL_SHIFT: 'DOWN'

- evalScript: ${output.phase = 'clear-state-import'}

- runFlow: subflows/accounts/open-new-account.flow.yaml

- scrollUntilVisible:
      element:
          text: '.*Erste Bank.*'
      direction: DOWN
      timeout: 10000
      visibilityPercentage: 50
      speed: 20

- tapOn:
      text: '.*Erste Bank.*'

- runFlow:
      file: subflows/import/import-erste-pdf-from-picker.flow.yaml
      env:
          PDF_ROW_ID_MATCH: ${FIRST_PDF_ROW_ID_MATCH}

- scrollUntilVisible:
      element:
          id: 'AccountCard.Erste EUR'
      direction: DOWN
      timeout: 10000

- assertVisible: 'Erste EUR, .*478'

- tapOn:
      id: 'AccountCard.Erste EUR'

- extendedWaitUntil:
      visible:
          id: 'AccountDetails.EditButton'
      timeout: 10000

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.Sample_Counterparty'
      timeout: 20000

- tapOn:
      id: 'PageHeader.BackButton'

- extendedWaitUntil:
      visible:
          id: 'AccountCard.Erste EUR'
      timeout: 10000

- evalScript: ${output.phase = 'existing-account-quick-import'}

- longPressOn:
      id: 'AccountCard.Erste EUR'

- runFlow:
      file: subflows/import/select-file-from-app-provider.flow.yaml
      env:
          FILE_ROW_ID_MATCH: ${SECOND_PDF_ROW_ID_MATCH}

- extendedWaitUntil:
      visible: 'Erste EUR, .*3,412'
      timeout: 3000

- tapOn:
      id: 'AccountCard.Erste EUR'

- extendedWaitUntil:
      visible:
          id: 'AccountDetails.EditButton'
      timeout: 10000

- scrollUntilVisible:
      element:
          id: 'TransactionCard.Label.AREALIS_GmbH'
      direction: DOWN
      timeout: 20000
      speed: 20
      visibilityPercentage: 30

- evalScript: ${output.phase = 'edit-then-reimport-no-duplicate'}

- runFlow:
      file: subflows/transactions/long-press-edit-transaction.flow.yaml
      env:
          TRANSACTION_CARD_ID: 'TransactionCard.Label.AREALIS_GmbH'

- extendedWaitUntil:
      visible: 'Edit Expense'
      timeout: 5000

- runFlow:
      file: subflows/categories/create-category-from-transaction.flow.yaml
      env:
          CATEGORY_NAME: 'E2E Erste Import Category'

- runFlow:
      file: subflows/transactions/edit-comment.flow.yaml
      env:
          COMMENT: 'EDITED FOR DEDUP TEST'

- tapOn:
      id: 'TransactionForm.SubmitButton'

- extendedWaitUntil:
      visible:
          id: 'AccountDetails.EditButton'
      timeout: 15000

- tapOn:
      id: 'PageHeader.BackButton'

- extendedWaitUntil:
      visible:
          id: 'AccountCard.Erste EUR'
      timeout: 10000

- assertVisible: 'Erste EUR, .*3,412'

- longPressOn:
      id: 'AccountCard.Erste EUR'

- runFlow:
      file: subflows/import/select-file-from-app-provider.flow.yaml
      env:
          FILE_ROW_ID_MATCH: ${SECOND_PDF_ROW_ID_MATCH}

- extendedWaitUntil:
      visible: 'Erste EUR, .*3,412'
      timeout: 5000

- tapOn:
      id: 'AccountCard.Erste EUR'

- scrollUntilVisible:
      element:
          id: 'TransactionCard.Label.AREALIS_GmbH'
      direction: DOWN
      timeout: 20000
      speed: 20
      visibilityPercentage: 30

- runFlow:
      file: subflows/transactions/long-press-edit-transaction.flow.yaml
      env:
          TRANSACTION_CARD_ID: 'TransactionCard.Label.AREALIS_GmbH'

- extendedWaitUntil:
      visible: 'Edit Expense'
      timeout: 5000

- tapOn:
      id: 'TransactionForm.CommentInput'

- extendedWaitUntil:
      visible:
          id: 'NoteInput.Input'
      timeout: 5000

- assertVisible: 'EDITED FOR DEDUP TEST'

- tapOn:
      id: 'NoteInput.SubmitButton'

- tapOn:
      id: 'PageHeader.BackButton'

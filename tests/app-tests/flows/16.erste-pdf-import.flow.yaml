appId: ${APP_ID}
---
- runFlow:
      file: subflows/import/import-database-from-settings.flow.yaml
      env:
          FIXTURE_ROW_ID_MATCH: '16.db'

- evalScript: ${output.phase = 'clear-state-import'}

- openLink: 'budgie://settings/import-bank-file?source=ERSTE&fileUri=${E2E_DB_FIXTURES_URI}/erste-statement-008.pdf&runId=${E2E_RUN_TOKEN}-first'

- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
      timeout: 60000

- scrollUntilVisible:
      element:
          id: 'AccountCard.Erste EUR'
      direction: DOWN
      timeout: 10000

- assertVisible:
      id: 'AccountCard.Balance.Erste_EUR._478'

- tapOn:
      id: 'AccountCard.Erste EUR'

- extendedWaitUntil:
      visible:
          id: 'AccountDetails.EditButton'
      timeout: 10000

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.Sample_Counterparty'
      timeout: 20000

- tapOn:
      id: 'PageHeader.BackButton'

- runFlow:
      file: subflows/navigation/relaunch-app-and-wait.flow.yaml
      env:
          DESTINATION_ID: 'AccountCard.Erste EUR'

- evalScript: ${output.phase = 'existing-account-quick-import'}

- openLink: 'budgie://settings/import-bank-file?source=ERSTE&fileUri=${E2E_DB_FIXTURES_URI}/erste-statement-009.pdf&runId=${E2E_RUN_TOKEN}-second'

- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
      timeout: 60000

- extendedWaitUntil:
      visible:
          id: 'AccountCard.Balance.Erste_EUR._3_412'
      timeout: 3000

- tapOn:
      id: 'AccountCard.Erste EUR'

- extendedWaitUntil:
      visible:
          id: 'AccountDetails.EditButton'
      timeout: 10000

- scrollUntilVisible:
      element:
          id: 'TransactionCard.Label.AREALIS_GmbH'
      direction: DOWN
      timeout: 20000
      speed: 20
      visibilityPercentage: 30

- evalScript: ${output.phase = 'edit-then-reimport-no-duplicate'}

- runFlow:
      file: subflows/transactions/long-press-edit-transaction.flow.yaml
      env:
          TRANSACTION_CARD_ID: 'TransactionCard.Label.AREALIS_GmbH'

- extendedWaitUntil:
      visible: 'Edit Expense'
      timeout: 5000

- runFlow:
      file: subflows/categories/select-category.flow.yaml
      env:
          CATEGORY_NAME: 'Groceries'

- runFlow:
      file: subflows/transactions/edit-comment.flow.yaml
      env:
          COMMENT: 'EDITED FOR DEDUP TEST'

- extendedWaitUntil:
      visible:
          id: 'TransactionForm.SubmitButton'
      timeout: 15000

- tapOn:
      id: 'TransactionForm.SubmitButton'

- extendedWaitUntil:
      visible:
          id: 'TransactionInfo.Page'
      timeout: 15000

- tapOn:
      id: 'PageHeader.BackButton'

- extendedWaitUntil:
      visible:
          id: 'AccountDetails.EditButton'
      timeout: 10000

- tapOn:
      id: 'PageHeader.BackButton'

- runFlow:
      file: subflows/navigation/relaunch-app-and-wait.flow.yaml
      env:
          DESTINATION_ID: 'AccountCard.Erste EUR'

- assertVisible:
      id: 'AccountCard.Balance.Erste_EUR._3_412'

- openLink: 'budgie://settings/import-bank-file?source=ERSTE&fileUri=${E2E_DB_FIXTURES_URI}/erste-statement-009.pdf&runId=${E2E_RUN_TOKEN}-third'

- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
      timeout: 60000

- extendedWaitUntil:
      visible:
          id: 'AccountCard.Balance.Erste_EUR._3_412'
      timeout: 5000

- tapOn:
      id: 'AccountCard.Erste EUR'

- scrollUntilVisible:
      element:
          id: 'TransactionCard.Label.AREALIS_GmbH'
      direction: DOWN
      timeout: 20000
      speed: 20
      visibilityPercentage: 30

- runFlow:
      file: subflows/transactions/long-press-edit-transaction.flow.yaml
      env:
          TRANSACTION_CARD_ID: 'TransactionCard.Label.AREALIS_GmbH'

- extendedWaitUntil:
      visible: 'Edit Expense'
      timeout: 5000

- tapOn:
      id: 'TransactionForm.CommentInput'

- extendedWaitUntil:
      visible:
          id: 'NoteInput.Input'
      timeout: 5000

- assertVisible: 'EDITED FOR DEDUP TEST'

- tapOn:
      id: 'NoteInput.SubmitButton'

- tapOn:
      id: 'PageHeader.BackButton'

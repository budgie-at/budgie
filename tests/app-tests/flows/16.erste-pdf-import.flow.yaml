appId: ${APP_ID}
---
- runFlow:
      file: subflows/import/import-database-from-settings.flow.yaml
      env:
          FIXTURE_ROW_ID_MATCH: '16.db'

- evalScript: ${output.phase = 'clear-state-import'}

- runFlow: subflows/accounts/open-new-account.flow.yaml

- scrollUntilVisible:
      element:
          id: 'CreateAccount.ERSTE'
      direction: DOWN
      timeout: 10000
      visibilityPercentage: 80
      centerElement: false
      speed: 20

- scroll

- waitForAnimationToEnd

- tapOn:
      id: 'CreateAccount.ERSTE'

- runFlow:
      file: subflows/import/import-erste-pdf-from-picker.flow.yaml
      env:
          PDF_ROW_ID_MATCH: 'erste-statement-008, pdf'

- scrollUntilVisible:
      element:
          id: 'AccountCard.Erste EUR'
      direction: DOWN
      timeout: 10000
      visibilityPercentage: 30

- assertVisible:
      id: 'AccountCard.Balance.Erste_EUR._478'

- tapOn:
      id: 'AccountCard.Erste EUR'

- extendedWaitUntil:
      visible:
          id: 'AccountDetails.EditButton'
      timeout: 10000

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.Sample_Counterparty'
      timeout: 20000

- tapOn:
      id: 'PageHeader.BackButton'

- waitForAnimationToEnd

- extendedWaitUntil:
      visible:
          id: 'AccountCard.Erste EUR'
      timeout: 10000

- evalScript: ${output.phase = 'existing-account-quick-import'}

- longPressOn:
      id: 'AccountCard.Erste EUR'

- runFlow:
      file: subflows/import/select-file-from-app-provider.flow.yaml
      env:
          FILE_ROW_ID_MATCH: 'erste-statement-009, pdf'

- extendedWaitUntil:
      visible:
          id: 'AccountCard.Balance.Erste_EUR._3_412'
      timeout: 60000

- tapOn:
      id: 'AccountCard.Erste EUR'

- extendedWaitUntil:
      visible:
          id: 'AccountDetails.EditButton'
      timeout: 10000

- scrollUntilVisible:
      element:
          id: 'TransactionCard.Label.AREALIS_GmbH'
      direction: DOWN
      timeout: 20000
      speed: 20
      visibilityPercentage: 30

- evalScript: ${output.phase = 'edit-then-reimport-no-duplicate'}

- runFlow:
      file: subflows/transactions/long-press-edit-transaction.flow.yaml
      env:
          TRANSACTION_CARD_ID: 'TransactionCard.Label.AREALIS_GmbH'

- extendedWaitUntil:
      visible: 'Edit Expense'
      timeout: 5000

- runFlow:
      file: subflows/categories/select-category.flow.yaml
      env:
          CATEGORY_NAME: 'Groceries'

- runFlow:
      file: subflows/transactions/edit-comment.flow.yaml
      env:
          COMMENT: 'EDITED FOR DEDUP TEST'

- extendedWaitUntil:
      visible:
          id: 'TransactionForm.SubmitButton'
      timeout: 15000

- tapOn:
      id: 'TransactionForm.SubmitButton'

- extendedWaitUntil:
      visible:
          id: 'TransactionInfo.Page'
      timeout: 15000

- tapOn:
      id: 'PageHeader.BackButton'

- extendedWaitUntil:
      visible:
          id: 'AccountDetails.EditButton'
      timeout: 10000

- tapOn:
      id: 'PageHeader.BackButton'

- waitForAnimationToEnd

- extendedWaitUntil:
      visible:
          id: 'AccountCard.Erste EUR'
      timeout: 10000

- assertVisible:
      id: 'AccountCard.Balance.Erste_EUR._3_412'

- longPressOn:
      id: 'AccountCard.Erste EUR'

- runFlow:
      file: subflows/import/select-file-from-app-provider.flow.yaml
      env:
          FILE_ROW_ID_MATCH: 'erste-statement-009, pdf'

- extendedWaitUntil:
      visible:
          id: 'AccountCard.Balance.Erste_EUR._3_412'
      timeout: 60000

- tapOn:
      id: 'AccountCard.Erste EUR'

- scrollUntilVisible:
      element:
          id: 'TransactionCard.Label.AREALIS_GmbH'
      direction: DOWN
      timeout: 20000
      speed: 20
      visibilityPercentage: 30

- runFlow:
      file: subflows/transactions/long-press-edit-transaction.flow.yaml
      env:
          TRANSACTION_CARD_ID: 'TransactionCard.Label.AREALIS_GmbH'

- extendedWaitUntil:
      visible: 'Edit Expense'
      timeout: 5000

- tapOn:
      id: 'TransactionForm.CommentInput'

- extendedWaitUntil:
      visible:
          id: 'NoteInput.Input'
      timeout: 5000

- assertVisible: 'EDITED FOR DEDUP TEST'

- tapOn:
      id: 'NoteInput.SubmitButton'

- tapOn:
      id: 'PageHeader.BackButton'

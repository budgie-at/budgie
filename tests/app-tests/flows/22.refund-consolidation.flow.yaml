appId: ${APP_ID}
---
- runFlow:
      file: subflows/import/import-database-from-settings.flow.yaml
      env:
          FIXTURE_ROW_ID_MATCH: '22.db'

- runFlow:
      file: subflows/navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://transactions/3/income'
- extendedWaitUntil:
      visible:
          id: 'TransactionActionsMenu.TriggerButton'
      timeout: 10000
- tapOn:
      id: 'TransactionActionsMenu.TriggerButton'
- extendedWaitUntil:
      visible:
          id: 'TransactionActionsMenu.ConvertToRefundButton'
      timeout: 3000
- tapOn:
      id: 'TransactionActionsMenu.ConvertToRefundButton'
- extendedWaitUntil:
      visible:
          id: 'ConvertToRefund.Page'
      timeout: 10000
- assertVisible:
      id: 'ConvertToRefund.CandidateRow.2'
- tapOn:
      id: 'ConvertToRefund.CandidateRow.2'
- tapOn:
      id: 'ConvertToRefund.ConvertButton'
- waitForAnimationToEnd
- tapOn:
      text: 'Convert'
      index: 0
- waitForAnimationToEnd
- extendedWaitUntil:
      visible:
          id: 'TransactionInfo.Row.Consolidation'
      timeout: 10000
- tapOn:
      id: 'TransactionInfo.Row.Consolidation'
- extendedWaitUntil:
      visible:
          id: 'ConsolidationSourceModal.Row.0'
      timeout: 10000
- assertVisible:
      text: 'E2E Refund Partial, .*\+₴40'
- tapOn:
      id: 'ConsolidationSourceModal.RevertButton'
- runFlow: subflows/transactions/confirm-revert-consolidation.flow.yaml
- runFlow:
      file: subflows/navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://transactions/3/income'
- extendedWaitUntil:
      visible:
          id: 'TransactionActionsMenu.TriggerButton'
      timeout: 10000
- extendedWaitUntil:
      notVisible:
          id: 'TransactionInfo.RefundedPill'
      timeout: 10000
- tapOn:
      id: 'TransactionActionsMenu.TriggerButton'
- extendedWaitUntil:
      visible:
          id: 'TransactionActionsMenu.ConvertToTransferButton'
      timeout: 3000
- assertVisible:
      id: 'TransactionActionsMenu.ConvertToRefundButton'
- tapOn:
      text: 'Close menu'
- runFlow:
      file: subflows/navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://transactions'
- extendedWaitUntil:
      visible:
          id: 'TransactionsPage.Container'
      timeout: 10000

- scrollUntilVisible:
      element:
          id: 'TransactionCard.Label.E2E_Refund_Localized'
      direction: DOWN
      visibilityPercentage: 30
      centerElement: true
- assertVisible:
      id: 'TransactionCard.Label.E2E_Refund_Localized'
- scrollUntilVisible:
      element:
          id: 'TransactionCard.Label.E2E_Refund_Partial'
      direction: DOWN
      visibilityPercentage: 30
      centerElement: true
- assertVisible:
      id: 'TransactionCard.Label.E2E_Refund_Partial'
- scrollUntilVisible:
      element:
          id: 'TransactionCard.Label.E2E_Refund_Full'
      direction: DOWN
      visibilityPercentage: 30
      centerElement: true
- assertVisible:
      id: 'TransactionCard.Label.E2E_Refund_Full'
- scrollUntilVisible:
      element:
          id: 'TransactionCard.Label.E2E_Refund_Ambiguous'
      direction: DOWN
      visibilityPercentage: 30
      centerElement: true
- assertVisible:
      id: 'TransactionCard.Label.E2E_Refund_Ambiguous'
- longPressOn:
      id: 'TransactionCard.Label.E2E_Refund_Ambiguous'
- extendedWaitUntil:
      visible:
          id: 'TransactionContextMenu.ConvertToRefundButton'
      timeout: 3000
- tapOn:
      text: 'Close menu'

- runFlow: subflows/settings/run-money-data-upgrade.flow.yaml

- runFlow: subflows/settings/consolidate-matches.flow.yaml

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- scrollUntilVisible:
      element:
          id: 'TransactionCard.Label.E2E_Refund_Localized'
      direction: UP
      visibilityPercentage: 30
      centerElement: true
- assertVisible:
      text: 'E2E Refund Localized, Refunded.*'
- assertNotVisible:
      id: 'TransactionCard.Amount.10'
- assertVisible:
      id: 'TransactionCard.Label.E2E_Refund_Localized'
- scrollUntilVisible:
      element:
          id: 'TransactionCard.RefundedPill.4'
      direction: DOWN
      visibilityPercentage: 30
      centerElement: true
- assertVisible:
      id: 'TransactionCard.RefundedPill.4'
- assertNotVisible:
      id: 'TransactionCard.Amount.3'
- assertNotVisible:
      id: 'TransactionCard.Amount.5'
- scrollUntilVisible:
      element:
          id: 'TransactionCard.Label.E2E_Refund_Ambiguous'
      direction: DOWN
      visibilityPercentage: 30
      centerElement: true
- assertVisible:
      id: 'TransactionCard.Amount.8'
- assertVisible:
      id: 'TransactionCard.Label.E2E_Refund_Ambiguous'

- runFlow:
      file: subflows/navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://transactions/4/expense'
- extendedWaitUntil:
      visible:
          id: 'TransactionInfo.Row.Consolidation'
      timeout: 10000
- tapOn:
      id: 'TransactionInfo.Row.Consolidation'
- extendedWaitUntil:
      visible:
          id: 'ConsolidationSourceModal.Row.0'
      timeout: 10000
- assertVisible:
      text: 'E2E Refund Full, .*\+₴55'
- tapOn:
      id: 'ConsolidationSourceModal.DoneButton'
- extendedWaitUntil:
      notVisible:
          id: 'ConsolidationSourceModal.Row.0'
      timeout: 5000

- runFlow:
      file: subflows/navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://transactions/9/expense'
- extendedWaitUntil:
      visible:
          id: 'TransactionInfo.Row.Consolidation'
      timeout: 10000
- tapOn:
      id: 'TransactionInfo.Row.Consolidation'
- extendedWaitUntil:
      visible:
          id: 'ConsolidationSourceModal.Row.0'
      timeout: 10000
- assertVisible:
      text: 'Скасування\. E2E Refund Localized, .*\+₴18'
- tapOn:
      id: 'ConsolidationSourceModal.DoneButton'
- extendedWaitUntil:
      notVisible:
          id: 'ConsolidationSourceModal.Row.0'
      timeout: 5000

- tapOn:
      id: 'PageHeader.BackButton'
- tapOn:
      id: 'PageHeader.BackButton'
- tapOn:
      id: 'TabBar.Analytics'
- extendedWaitUntil:
      visible:
          id: 'AnalyticsPage.Tab.Categories'
      timeout: 10000
- scrollUntilVisible:
      element:
          id: 'CategoryStatisticsCard.Amount.Restaurants_Cafes.80000000'
      direction: DOWN
- assertVisible:
      id: 'CategoryStatisticsCard.Amount.Restaurants_Cafes.80000000'

appId: ${APP_ID}
---

- runFlow:
    file: subflows/import/import-database-from-settings.flow.yaml
    env:
      FIXTURE_ROW_ID_MATCH: '22.db(, db)?'

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- scrollUntilVisible:
    element:
      id: 'TransactionCard.Label.E2E_Refund_Localized'
    direction: DOWN
- assertVisible:
    id: 'TransactionCard.Label.E2E_Refund_Localized'
- scrollUntilVisible:
    element:
      id: 'TransactionCard.Label.E2E_Refund_Partial'
    direction: DOWN
- assertVisible:
    id: 'TransactionCard.Label.E2E_Refund_Partial'
- scrollUntilVisible:
    element:
      id: 'TransactionCard.Label.E2E_Refund_Full'
    direction: DOWN
- assertVisible:
    id: 'TransactionCard.Label.E2E_Refund_Full'
- scrollUntilVisible:
    element:
      id: 'TransactionCard.Label.E2E_Refund_Ambiguous'
    direction: DOWN
- assertVisible:
    id: 'TransactionCard.Label.E2E_Refund_Ambiguous'

- runFlow: subflows/navigation/navigate-to-settings.flow.yaml
- scrollUntilVisible:
    element:
      id: 'SettingsPage.ConsolidateTransfersCard'
    direction: DOWN
- tapOn:
    id: 'SettingsPage.ConsolidateTransfersCard'
- extendedWaitUntil:
    visible: 'Consolidate Transfers'
    timeout: 10000
- tapOn: 'Consolidate'

- extendedWaitUntil:
    visible: 'Transfers consolidated'
    timeout: 10000

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- scrollUntilVisible:
    element:
      id: 'TransactionCard.RefundedPill.9'
    direction: DOWN
- assertVisible:
    id: 'TransactionCard.RefundedPill.9'
- assertNotVisible:
    id: 'TransactionCard.Amount.10'
- assertVisible:
    id: 'TransactionCard.Label.E2E_Refund_Localized'
- scrollUntilVisible:
    element:
      id: 'TransactionCard.RefundedPill.4'
    direction: DOWN
- assertVisible:
    id: 'TransactionCard.RefundedPill.4'
- assertNotVisible:
    id: 'TransactionCard.Amount.3'
- assertNotVisible:
    id: 'TransactionCard.Amount.5'
- scrollUntilVisible:
    element:
      id: 'TransactionCard.Label.E2E_Refund_Ambiguous'
    direction: DOWN
- assertVisible:
    id: 'TransactionCard.Amount.8'
- assertVisible:
    id: 'TransactionCard.Label.E2E_Refund_Ambiguous'
- scrollUntilVisible:
    element:
      id: 'TransactionCard.RefundedPill.4'
    direction: UP

- tapOn:
    id: 'TransactionCard.RefundedPill.4'
- extendedWaitUntil:
    visible:
      id: 'ConsolidationSourceModal.Row.0'
    timeout: 10000
- assertVisible:
    id: 'ConsolidationSourceModal.RowTitle.0.E2E_Refund_Full'
- assertVisible:
    id: 'ConsolidationSourceModal.RowAmount.0.DEBIT.55000000'
- tapOn:
    id: 'ConsolidationSourceModal.DoneButton'
- extendedWaitUntil:
    notVisible:
      id: 'ConsolidationSourceModal.Row.0'
    timeout: 5000

- scrollUntilVisible:
    element:
      id: 'TransactionCard.RefundedPill.9'
    direction: UP
- tapOn:
    id: 'TransactionCard.RefundedPill.9'
- extendedWaitUntil:
    visible:
      id: 'ConsolidationSourceModal.Row.0'
    timeout: 10000
- assertVisible:
    id: 'ConsolidationSourceModal.RowTitle.0._E2E_Refund_Localized'
- assertVisible:
    id: 'ConsolidationSourceModal.RowAmount.0.DEBIT.18000000'
- tapOn:
    id: 'ConsolidationSourceModal.DoneButton'
- extendedWaitUntil:
    notVisible:
      id: 'ConsolidationSourceModal.Row.0'
    timeout: 5000

- tapOn:
    id: 'TabBar.Analytics'
- extendedWaitUntil:
    visible:
      id: 'AnalyticsPage.Container'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'CategoryStatisticsCard.Amount.Restaurants_Cafes.80000000'
    direction: DOWN
- assertVisible:
    id: 'CategoryStatisticsCard.Amount.Restaurants_Cafes.80000000'

appId: ${APP_ID}
---

- runFlow: subflows/enter-app.flow.yaml

# ===========================
# SETUP: Create Entities
# ===========================

# --- Create two accounts ---

- runFlow:
    file: subflows/create-account.flow.yaml
    env:
      ACCOUNT_NAME: 'E2E Cash'

- runFlow:
    file: subflows/create-account.flow.yaml
    env:
      ACCOUNT_NAME: 'E2E Bank'

# --- Create category ---

- runFlow:
    file: subflows/create-category.flow.yaml
    env:
      CATEGORY_NAME: 'E2E Food'

# --- Create tag ---

- runFlow:
    file: subflows/create-tag.flow.yaml
    env:
      TAG_NAME: 'E2E Work'

# ===========================
# TRANSACTIONS
# ===========================

# --- Create Expense ---

- runFlow:
    file: subflows/create-expense.flow.yaml
    env:
      DIGIT_1: '4'
      DIGIT_2: '2'
      ACCOUNT_NAME: 'E2E Cash'
      CATEGORY_NAME: 'E2E Food'
      COMMENT: 'E2E Lunch'

# --- Create Income ---

- runFlow:
    file: subflows/create-income.flow.yaml
    env:
      DIGIT_1: '2'
      DIGIT_2: '5'
      DIGIT_3: '0'
      ACCOUNT_NAME: 'E2E Bank'
      CATEGORY_NAME: 'E2E Food'
      COMMENT: 'E2E Salary'

# --- Create Transfer ---

- runFlow:
    file: subflows/create-transfer.flow.yaml
    env:
      DIGIT_1: '3'
      DIGIT_2: '0'
      FROM_ACCOUNT: 'E2E Bank'
      TO_ACCOUNT: 'E2E Cash'
      COMMENT: 'E2E ATM Withdrawal'

# ===========================
# NAVIGATION: Verify all tabs
# ===========================

# --- Home Tab ---

- tapOn:
    id: 'TabBar.Home'
- extendedWaitUntil:
    visible: 'TOTAL BALANCE'

- assertVisible:
    id: 'HomePage.TotalBalance'
- assertVisible: 'E2E Cash.*'
- assertVisible: 'E2E Bank.*'

# --- Transactions Tab ---

- runFlow: subflows/navigate-to-transactions.flow.yaml

- assertVisible: 'E2E Lunch'
- assertVisible: 'E2E Salary'
- assertVisible: 'E2E ATM Withdrawal'

# --- Analytics Tab ---

- runFlow: subflows/navigate-to-analytics.flow.yaml

# --- Settings Tab ---

- runFlow: subflows/navigate-to-settings.flow.yaml

# ===========================
# EDIT: Modify a transaction
# ===========================

- runFlow: subflows/navigate-to-transactions.flow.yaml

- tapOn: 'E2E Lunch'
- waitForAnimationToEnd

- runFlow:
    file: subflows/edit-comment.flow.yaml
    env:
      COMMENT: 'E2E Dinner'

- tapOn:
    id: 'TransactionForm.SubmitButton'

- extendedWaitUntil:
    visible: 'Transactions'
    timeout: 15000

- assertVisible: 'E2E Dinner'
- assertNotVisible: 'E2E Lunch'

# ===========================
# DELETE: Remove a transaction
# ===========================

- tapOn: 'E2E Dinner'
- waitForAnimationToEnd

- runFlow: subflows/delete-transaction.flow.yaml

- extendedWaitUntil:
    visible: 'Transactions'
    timeout: 15000

- assertNotVisible: 'E2E Dinner'

# ===========================
# VERIFY: Balance after operations
# ===========================

- tapOn:
    id: 'TabBar.Home'
- extendedWaitUntil:
    visible: 'TOTAL BALANCE'

- assertVisible:
    id: 'HomePage.TotalBalance'

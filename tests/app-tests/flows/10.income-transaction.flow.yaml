appId: ${APP_ID}
---

- runFlow: subflows/relaunch-app.flow.yaml

- runFlow:
    file: subflows/import-database-fixture.flow.yaml
    env:
      FIXTURE_ID: '10-income-transaction'

# --- Create Income ---

- runFlow: subflows/navigate-to-transactions.flow.yaml

- runFlow:
    file: subflows/open-transaction-form.flow.yaml
    env:
      ACTION_ITEM_ID: 'ActionItem.Income'
      FORM_TITLE: 'New Income'

- tapOn:
    id: 'TransactionForm.SubmitButton'
- assertVisible: 'New Income'

- tapOn:
    id: 'TransactionForm.SubmitButton'
- assertVisible: 'New Income'

- tapOn: '1'
- tapOn: '0'
- tapOn: '0'

- runFlow:
    file: subflows/select-account.flow.yaml
    env:
      ACCOUNT_NAME: 'E2E Txn Account'

- runFlow:
    file: subflows/select-category.flow.yaml
    env:
      CATEGORY_NAME: 'E2E Txn Category'

- runFlow:
    file: subflows/enter-comment.flow.yaml
    env:
      COMMENT: 'E2E Test Income'

- runFlow: subflows/submit-transaction-and-wait.flow.yaml

- extendedWaitUntil:
    visible:
      id: 'TransactionCard.Label.E2E_Test_Income'
    timeout: 5000

- tapOn:
    id: 'TabBar.Home'
- extendedWaitUntil:
    visible:
      id: 'HomePage.TotalBalance'
- assertVisible:
    id: 'HomePage.NetWorthValue.200'
- assertVisible:
    id: 'AccountCard.Balance.E2E_Txn_Account.200'

- runFlow: subflows/navigate-to-transactions.flow.yaml

# --- Edit Income ---

- tapOn:
    id: 'TransactionCard.Label.E2E_Test_Income'

- runFlow:
    file: subflows/edit-comment.flow.yaml
    env:
      COMMENT: 'E2E Edited Income'

- runFlow: subflows/submit-transaction-and-wait.flow.yaml

- extendedWaitUntil:
    visible:
      id: 'TransactionCard.Label.E2E_Edited_Income'
    timeout: 5000

# --- Delete Income ---

- tapOn:
    id: 'TransactionCard.Label.E2E_Edited_Income'

- runFlow: subflows/delete-transaction.flow.yaml
- runFlow: subflows/navigate-to-transactions.flow.yaml

- extendedWaitUntil:
    notVisible:
      id: 'TransactionCard.Label.E2E_Edited_Income'
    timeout: 5000

- tapOn:
    id: 'TabBar.Home'
- extendedWaitUntil:
    visible:
      id: 'HomePage.TotalBalance'

- assertVisible:
    id: 'HomePage.NetWorthValue.100'
- assertVisible:
    id: 'AccountCard.Balance.E2E_Txn_Account.100'

appId: ${APP_ID}
env:
    HANDLE_DEV_CLIENT_STARTUP: ${HANDLE_DEV_CLIENT_STARTUP || 'false'}
    FIRST_PDF_NAME_MATCH: '.*erste-statement-008.*'
    SECOND_PDF_NAME_MATCH: '.*erste-statement-009.*'
---
- runFlow:
      file: subflows/relaunch-app.flow.yaml
      env:
          HANDLE_DEV_CLIENT_STARTUP: ${HANDLE_DEV_CLIENT_STARTUP}

- runFlow:
      file: subflows/clear-data-from-settings.flow.yaml
      env:
          HANDLE_DEV_CLIENT_STARTUP: ${HANDLE_DEV_CLIENT_STARTUP}

- evalScript: ${output.phase = 'clear-state-import'}

- runFlow: subflows/account/open-new-account.flow.yaml

- scrollUntilVisible:
      element:
          text: '.*Erste Bank.*'
      direction: DOWN
      timeout: 10000
      visibilityPercentage: 50
      speed: 20

- tapOn:
      text: '.*Erste Bank.*'

- runFlow:
      file: subflows/import-erste-pdf-from-picker.flow.yaml
      env:
          PDF_NAME_MATCH: ${FIRST_PDF_NAME_MATCH}

- scrollUntilVisible:
      element:
          id: 'AccountCard.Erste EUR'
      direction: DOWN
      timeout: 10000

- assertVisible:
      id: 'AccountCard.Balance.Erste_EUR._477_73'

- tapOn:
      id: 'AccountCard.Erste EUR'

- extendedWaitUntil:
      visible:
          id: 'AccountDetails.EditButton'
      timeout: 10000

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.Sample_Counterparty'
      timeout: 20000

- tapOn:
      id: 'PageHeader.BackButton'

- extendedWaitUntil:
      visible:
          id: 'AccountCard.Erste EUR'
      timeout: 10000

- evalScript: ${output.phase = 'existing-account-quick-import'}

- longPressOn:
      id: 'AccountCard.Erste EUR'

- runFlow:
      file: subflows/quick-import-erste-pdf-from-picker.flow.yaml
      env:
          PDF_NAME_MATCH: ${SECOND_PDF_NAME_MATCH}

- assertVisible:
      id: 'AccountCard.Balance.Erste_EUR._3412_05'

- tapOn:
      id: 'AccountCard.Erste EUR'

- extendedWaitUntil:
      visible:
          id: 'AccountDetails.EditButton'
      timeout: 10000

- scrollUntilVisible:
      element:
          id: 'TransactionCard.Label.AREALIS_GmbH'
      direction: DOWN
      timeout: 20000
      speed: 20
      visibilityPercentage: 30

steps:
  - launch: com.vitalyiegorov.budgie.e2e
  - tool: open-url
    args:
      url: budgie://settings?anchor=data
  - tap:
      text: Not Now
  - await:
      idle: true
  - when:
      hidden:
        id: SettingsPage.Container
    steps:
      - tool: open-url
        args:
          url: budgie://settings
      - await:
          idle: true
      - await:
          visible:
            id: SettingsPage.Container
          timeout: 15000
  - await:
      visible:
        id: SettingsPage.Container
      timeout: 15000
  - scroll-to:
      target:
        id: SettingsPage.ImportDatabaseCard
      direction: up
  - when:
      hidden:
        id: SettingsPage.ImportDatabaseCard
    steps:
      - scroll-to:
          target:
            id: SettingsPage.ImportDatabaseCard
          direction: down
      - await:
          idle: true
  - await:
      visible:
        id: SettingsPage.ImportDatabaseCard
      timeout: 5000
  - tap:
      id: SettingsPage.ImportDatabaseCard
  - await:
      idle: true
  - await:
      visible:
        text: Cancel
      timeout: 15000
  - when:
      visible:
        text: Apple Account Verification
    steps:
      - tap:
          text: Not Now
      - await:
          idle: true
  - when:
      visible:
        text: No Results for .*
    steps:
      - tap:
          text: Clear text
      - await:
          idle: true
  - when:
      hidden:
        id: 25.db
    steps:
      - when:
          visible:
            id: E2EFixtures, Folder
        steps:
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          visible:
            text: budgie \(E2E\), Actions Menu
        steps:
          - await:
              visible:
                id: E2EFixtures, Folder
              timeout: 3000
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          hidden:
            text: E2EFixtures, Actions Menu
        steps:
          - when:
              hidden:
                text: budgie \(E2E\), Actions Menu
            steps:
              - tap:
                  id: BackButton
              - tap:
                  id: BackButton
              - tap:
                  id: BackButton
              - tap:
                  text: Browse
              - await:
                  idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - when:
                      visible:
                        text: On My iPhone
                    steps:
                      - tap:
                          text: On My iPhone
                      - await:
                          idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - scroll-to:
                      target:
                        text: budgie \(E2E\)
                      direction: down
              - await:
                  visible:
                    text: budgie \(E2E\)
                  timeout: 3000
              - tap:
                  text: budgie \(E2E\)
              - await:
                  idle: true
              - await:
                  visible:
                    id: E2EFixtures, Folder
                  timeout: 3000
              - tap:
                  id: E2EFixtures, Folder
              - await:
                  idle: true
  - scroll-to:
      target:
        id: 25.db
      direction: down
  - when:
      hidden:
        id: 25.db
    steps:
      - scroll-to:
          target:
            text: 25.db
          direction: down
  - await:
      idle: true
  - when:
      visible:
        id: 25.db
    steps:
      - tap:
          id: 25.db
  - when:
      hidden:
        id: 25.db
    steps:
      - tap:
          text: 25.db
  - await:
      idle: true
  - when:
      visible:
        text: Continue
    steps:
      - tap:
          text: Continue
      - await:
          idle: true
      - when:
          visible:
            id: 25.db
        steps:
          - tap:
              id: 25.db
      - when:
          hidden:
            id: 25.db
        steps:
          - tap:
              text: 25.db
      - await:
          idle: true
  - when:
      visible:
        text: Open
    steps:
      - tap:
          text: Open
  - await:
      visible:
        text: Importing a database will replace all current data.*
      timeout: 3000
  - tap:
      text: Import Database
  - await:
      idle: true
  - await:
      visible:
        id: TabBar.Home
      timeout: 30000
  - tap:
      id: TabBar.Home
  - await:
      visible:
        id: HomePage.TotalBalance
      timeout: 30000
  - echo: App process stop requested; the following launch performs a clean restart.
  - launch: com.vitalyiegorov.budgie.e2e
  - await:
      visible:
        id: TabBar.Home
      timeout: 30000
  - tool: open-url
    args:
      url: budgie://settings/rules
  - await:
      idle: true
  - await:
      visible:
        id: RulesPage.Page
      timeout: 15000
  - tap:
      id: ActionButton
  - await:
      visible:
        id: RulesPage.CreateButton.Label
  - await:
      idle: true
  - tap:
      id: RulesPage.CreateButton.Label
  - await:
      visible:
        text: Create Rule
  - tap:
      id: RuleForm.Condition.0.FieldSelector.Value
  - await:
      idle: true
  - tap:
      id: RuleForm.SelectorCard.COMMENT
  - await:
      idle: true
  - tap:
      id: RuleForm.Condition.0.ValueInput
  - tool: keyboard
    args:
      text: E2E Pill Navigation
  - tap:
      text: Done
  - tap:
      id: RuleForm.Action.0.TypeSelector
  - tap:
      id: RuleForm.SelectorCard.SET_CATEGORY
  - await:
      idle: true
  - scroll-to:
      target:
        id: RuleForm.Action.0.CategorySelector
      direction: down
  - tap:
      id: RuleForm.Action.0.CategorySelector
  - await:
      idle: true
  - await:
      visible:
        id: CategoryPickerBottomSheet.Input
  - tap:
      id: CategoryPickerBottomSheet.Input
  - await:
      idle: true
  - tool: keyboard
    args:
      text: Groceries
  - tap:
      text: Done
  - await:
      visible:
        id: CategoryPickerBottomSheet.Card.Groceries.Label
  - await:
      idle: true
  - tap:
      id: CategoryPickerBottomSheet.Card.Groceries.Label
  - await:
      idle: true
  - await:
      hidden:
        id: CategoryPickerBottomSheet.Input
      timeout: 5000
  - tap:
      id: RuleForm.Footer.SubmitButton
  - when:
      visible:
        text: Apply to existing transactions?
    steps:
      - tap:
          text: Skip
  - await:
      visible:
        id: RulesPage.Page
      timeout: 10000
  - await:
      idle: true
  - assert:
      visible:
        id: RulesPage.RuleCard.0
  - tool: open-url
    args:
      url: budgie://transactions
  - await:
      idle: true
  - await:
      visible:
        id: TransactionsPage.Container
      timeout: 10000
  - await:
      idle: true
  - echo: Native recovery attempt (migrated from retry, max 1)
  - when:
      hidden:
        id: ActionItem.Expense.Label
    steps:
      - tap:
          id: ActionButton
  - await:
      visible:
        id: ActionItem.Expense.Label
      timeout: 3000
  - await:
      idle: true
  - tap:
      id: ActionItem.Expense.Label
  - await:
      visible:
        text: New Expense
  - await:
      visible:
        id: TransactionKeypad.Digit.1
  - await:
      idle: true
  - when:
      hidden:
        text: Rules Test Account
    steps:
      - echo: Native recovery attempt (migrated from retry, max 3)
      - tap:
          id: TransactionForm.AccountSelector
      - await:
          visible:
            id: AccountPickerBottomSheet.Input
          timeout: 3000
      - tap:
          id: AccountPickerBottomSheet.Input
      - tool: keyboard
        args:
          text: Rules Test Account
      - tap:
          text: Done
      - await:
          idle: true
      - await:
          visible:
            id: AccountPickerBottomSheet.Option.Rules Test Account
      - tap:
          id: AccountPickerBottomSheet.Option.Rules Test Account
      - await:
          idle: true
      - await:
          hidden:
            id: AccountPickerBottomSheet.Input
      - await:
          idle: true
  - echo: Native recovery attempt (migrated from retry, max 3)
  - tap:
      id: TransactionForm.CategorySelector
  - await:
      visible:
        id: CategoryPickerBottomSheet.Input
      timeout: 3000
  - await:
      idle: true
  - await:
      visible:
        id: CategoryPickerBottomSheet.Input
  - tap:
      id: CategoryPickerBottomSheet.Input
  - await:
      idle: true
  - tool: keyboard
    args:
      text: Rules Test Category
  - tap:
      text: Done
  - await:
      visible:
        id: CategoryPickerBottomSheet.Card.Rules Test Category.Label
  - await:
      idle: true
  - tap:
      id: CategoryPickerBottomSheet.Card.Rules Test Category.Label
  - await:
      idle: true
  - await:
      hidden:
        id: CategoryPickerBottomSheet.Input
      timeout: 5000
  - scroll-to:
      target:
        id: TransactionForm.CommentInput
      direction: down
  - await:
      visible:
        id: TransactionForm.CommentInput
      timeout: 10000
  - tap:
      id: TransactionForm.CommentInput
  - await:
      visible:
        id: NoteInput.Input
      timeout: 5000
  - tap:
      id: NoteInput.Input
  - tool: keyboard
    args:
      text: E2E Pill Navigation
  - tap:
      id: NoteInput.SubmitButton
  - await:
      hidden:
        id: NoteInput.Input
      timeout: 5000
  - await:
      idle: true
  - await:
      visible:
        id: TransactionKeypad.Digit.1
  - await:
      idle: true
  - echo: Native recovery attempt (migrated from retry, max 3)
  - long-press:
      id: TransactionKeypad.Backspace
  - tap:
      id: TransactionKeypad.Digit.2
  - tap:
      id: TransactionKeypad.Digit.5
  - await:
      visible:
        text: ^.* 25$
      timeout: 1000
  - tap:
      id: TransactionForm.SubmitButton
  - await:
      visible:
        id: TransactionsPage.Container
      timeout: 60000
  - tool: open-url
    args:
      url: budgie://transactions/9/expense
  - await:
      idle: true
  - await:
      visible:
        id: TransactionInfo.Page
      timeout: 10000
  - await:
      visible:
        id: MatchingRules.Pill
      timeout: 10000
  - tap:
      id: MatchingRules.Pill
  - await:
      idle: true
  - await:
      visible:
        text: Edit Rule
  - assert:
      visible:
        text: Edit Rule
  - tap:
      id: PageHeader.BackButton
  - await:
      idle: true
  - assert:
      visible:
        id: TransactionInfo.Page
  - tap:
      id: PageHeader.BackButton
  - await:
      idle: true
  - tool: open-url
    args:
      url: budgie://settings/rules
  - await:
      idle: true
  - await:
      visible:
        id: RulesPage.Page
      timeout: 15000
  - tap:
      id: ActionButton
  - await:
      visible:
        id: RulesPage.CreateButton.Label
  - await:
      idle: true
  - tap:
      id: RulesPage.CreateButton.Label
  - await:
      visible:
        text: Create Rule
  - tap:
      id: RuleForm.Condition.0.FieldSelector.Value
  - await:
      idle: true
  - tap:
      id: RuleForm.SelectorCard.COMMENT
  - await:
      idle: true
  - tap:
      id: RuleForm.Condition.0.ValueInput
  - tool: keyboard
    args:
      text: Pill Navigation
  - tap:
      text: Done
  - tap:
      id: RuleForm.Action.0.TypeSelector
  - tap:
      id: RuleForm.SelectorCard.ADD_TAG
  - await:
      idle: true
  - scroll-to:
      target:
        id: RuleForm.Action.0.TagSelector
      direction: down
  - tap:
      id: RuleForm.Action.0.TagSelector
  - await:
      idle: true
  - await:
      visible:
        id: TagPickerBottomSheet.Input
  - tap:
      id: TagPickerBottomSheet.Input
  - tool: keyboard
    args:
      text: Rules Test Tag
  - tap:
      text: Done
  - await:
      visible:
        id: TagPickerBottomSheet.Card.Rules Test Tag
      timeout: 15000
  - await:
      idle: true
  - tap:
      id: TagPickerBottomSheet.Card.Rules Test Tag
  - when:
      visible:
        id: TagPickerBottomSheet.Input
    steps:
      - await:
          idle: true
      - tap:
          id: TagPickerBottomSheet.Card.Rules Test Tag
  - await:
      hidden:
        id: TagPickerBottomSheet.Input
      timeout: 5000
  - tap:
      id: RuleForm.Footer.SubmitButton
  - when:
      visible:
        text: Apply to existing transactions?
    steps:
      - tap:
          text: Skip
  - await:
      visible:
        id: RulesPage.Page
      timeout: 10000
  - await:
      idle: true
  - assert:
      visible:
        id: RulesPage.RuleCard.0
  - assert:
      visible:
        id: RulesPage.RuleCard.1
  - tool: open-url
    args:
      url: budgie://transactions/9/expense
  - await:
      idle: true
  - await:
      visible:
        id: TransactionInfo.Page
      timeout: 10000
  - await:
      visible:
        id: MatchingRules.Pill
      timeout: 10000
  - tap:
      id: MatchingRules.Pill
  - await:
      idle: true
  - await:
      visible:
        id: RulesPage.MatchingRulesFilter
      timeout: 10000
  - assert:
      visible:
        text: 2 matching rules
  - assert:
      visible:
        id: RulesPage.RuleCard.0
  - assert:
      visible:
        id: RulesPage.RuleCard.1
  - tap:
      id: RulesPage.RuleCard.0
  - await:
      visible:
        text: Edit Rule
  - tap:
      id: PageHeader.BackButton
  - await:
      idle: true
  - assert:
      visible:
        id: RulesPage.MatchingRulesFilter
  - tap:
      id: PageHeader.BackButton
  - await:
      idle: true
  - assert:
      visible:
        id: TransactionInfo.Page

appId: ${APP_ID}
---
- runFlow:
      file: subflows/import/import-database-from-settings.flow.yaml
      env:
          FIXTURE_ROW_ID_MATCH: '31-transaction-info.db'

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- tapOn:
      id: 'TransactionCard.Label.E2E_Similar_Expense'
      index: 1
- extendedWaitUntil:
      visible:
          id: 'TransactionInfo.Page'
      timeout: 5000
- assertVisible:
      id: 'TransactionInfo.Row.Account'
- assertVisible:
      id: 'TransactionInfo.Row.Category'
- assertVisible:
      id: 'TransactionInfo.Row.Tags'
- assertNotVisible:
      id: 'TransactionInfo.Row.Source'
- assertNotVisible:
      id: 'TransactionInfo.SimilarCard'
- tapOn:
      id: 'PageHeader.BackButton'

- runFlow:
      file: subflows/transactions/create-expense.flow.yaml
      env:
          AMOUNT: '10'
          ACCOUNT_NAME: 'E2E Txn Account'
          CATEGORY_NAME: 'E2E Info Category'
          COMMENT: 'E2E Similar Expense'

- tapOn:
      id: 'TransactionCard.Label.E2E_Similar_Expense'
- extendedWaitUntil:
      visible:
          text: 'Similar transactions'
      timeout: 10000
- assertVisible: '2 similar transactions'
- assertVisible: 'Total'
- assertVisible: '$20'
- assertVisible: 'Average'
- assertVisible: '$10'

- scrollUntilVisible:
      element:
          id: 'TransactionInfo.SimilarBar.5'
      direction: DOWN
      centerElement: true

- assertVisible:
      id: 'TransactionInfo.SimilarBar.0'
- assertVisible:
      id: 'TransactionInfo.SimilarBar.1'
- assertVisible:
      id: 'TransactionInfo.SimilarBar.2'
- assertVisible:
      id: 'TransactionInfo.SimilarBar.3'
- assertVisible:
      id: 'TransactionInfo.SimilarBar.4'
- assertVisible:
      id: 'TransactionInfo.SimilarBar.5'
- assertNotVisible:
      id: 'TransactionInfo.Row.Source'

- runFlow:
      file: subflows/navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://transactions/5/expense/edit'
- extendedWaitUntil:
      visible: 'Edit Expense'
      timeout: 10000
- extendedWaitUntil:
      visible:
          id: 'TransactionKeypad.Digit.1'
- waitForAnimationToEnd
- longPressOn:
      id: 'TransactionKeypad.Backspace'
- tapOn:
      id: 'TransactionKeypad.Digit.2'
- tapOn:
      id: 'TransactionKeypad.Digit.0'
- tapOn:
      id: 'TransactionForm.SubmitButton'
- extendedWaitUntil:
      visible:
          id: 'TransactionInfo.Page'
      timeout: 15000
- assertVisible: '-$10'
- extendedWaitUntil:
      visible: '$30'
      timeout: 10000
- assertVisible: '2 similar transactions'
- assertVisible: '$15'

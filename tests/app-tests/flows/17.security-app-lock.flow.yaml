appId: ${APP_ID}
---
- runFlow:
    file: subflows/import/import-database-from-settings.flow.yaml
    env:
      FIXTURE_ROW_ID_MATCH: '17.db'

- runFlow: subflows/navigation/navigate-to-settings.flow.yaml

- extendedWaitUntil:
    visible:
      id: 'SettingsPage.DataEncryption.State.Off'
    timeout: 3000

- assertNotVisible:
    id: 'Icon.Fallback'

- runFlow:
    file: subflows/navigation/open-settings-card.flow.yaml
    env:
      CARD_ID: 'SettingsPage.AppLockCard'
      DESTINATION_ID: 'PinPage.Container'

- extendedWaitUntil:
    visible:
      id: 'PinPage.Container'
    timeout: 10000

- tapOn:
    id: 'PinPage.Digit.1'
- tapOn:
    id: 'PinPage.Digit.2'
- tapOn:
    id: 'PinPage.Digit.3'
- tapOn:
    id: 'PinPage.Digit.4'

- extendedWaitUntil:
    visible:
      id: 'PinPage.Container'
    timeout: 10000

- tapOn:
    id: 'PinPage.Digit.1'
- tapOn:
    id: 'PinPage.Digit.2'
- tapOn:
    id: 'PinPage.Digit.3'
- tapOn:
    id: 'PinPage.Digit.4'

- extendedWaitUntil:
    visible:
      text: 'Enter your PIN'
    timeout: 10000

- repeat:
    times: 4
    commands:
      - tapOn:
          id: 'PinPage.Digit.1'
      - tapOn:
          id: 'PinPage.Digit.1'
      - tapOn:
          id: 'PinPage.Digit.1'
      - tapOn:
          id: 'PinPage.Digit.1'
      - extendedWaitUntil:
          visible:
            text: 'Incorrect PIN'
          timeout: 10000

- tapOn:
    id: 'PinPage.Digit.1'
- tapOn:
    id: 'PinPage.Digit.1'
- tapOn:
    id: 'PinPage.Digit.1'
- tapOn:
    id: 'PinPage.Digit.1'

- extendedWaitUntil:
    visible:
      text: 'Too many attempts.*'
    timeout: 10000

- assertVisible:
    id: 'PinPage.Digit.1'
    enabled: false

- tapOn:
    id: 'PinPage.Digit.1'

- assertVisible:
    text: 'Too many attempts.*'

- extendedWaitUntil:
    notVisible:
      text: 'Too many attempts.*'
    timeout: 45000

- tapOn:
    id: 'PinPage.Digit.1'
- tapOn:
    id: 'PinPage.Digit.2'
- tapOn:
    id: 'PinPage.Digit.3'
- tapOn:
    id: 'PinPage.Digit.4'

- extendedWaitUntil:
    visible:
      id: 'TabBar.Settings'
    timeout: 10000

- runFlow: subflows/navigation/navigate-to-settings.flow.yaml

- extendedWaitUntil:
    visible:
      id: 'SettingsPage.DataEncryption.State.On'
    timeout: 3000

- runFlow: subflows/accounts/open-new-account.flow.yaml

- tapOn:
    id: 'CreateAccount.BANK'
- extendedWaitUntil:
    visible:
      id: 'AccountForm.NameInput'
    timeout: 3000
- tapOn:
    id: 'AccountForm.NameInput'
- inputText: 'Unfinished lock regression'

- runFlow:
    file: subflows/security/resume-after-pin-unlock.flow.yaml
    env:
      RESUMED_SCREEN_ID: 'AccountForm.NameInput'
- assertVisible: 'Unfinished lock regression'

- scrollUntilVisible:
    element:
      id: 'AccountForm.CurrencySelector'
    direction: DOWN
- tapOn:
    id: 'AccountForm.CurrencySelector'
- extendedWaitUntil:
    visible:
      id: 'CurrencySelector.SearchInput'
    timeout: 3000
- tapOn:
    id: 'CurrencySelector.SearchInput'
- inputText: 'EUR'
- runFlow:
    file: subflows/security/resume-after-pin-unlock.flow.yaml
    env:
      RESUMED_SCREEN_ID: 'CurrencySelector.SearchInput'
- assertVisible: 'EUR'
- tapOn:
    id: 'AccountForm.CurrencyOption.EUR'
- extendedWaitUntil:
    visible:
      id: 'AccountForm.NameInput'
    timeout: 3000
- assertVisible: 'Unfinished lock regression'

- tapOn:
    id: 'PageHeader.BackButton'
- runFlow: subflows/navigation/navigate-to-settings.flow.yaml

- runFlow:
    file: subflows/navigation/open-settings-card.flow.yaml
    env:
      CARD_ID: 'SettingsPage.AppLockChangePinButton'
      DESTINATION_ID: 'PinPage.Container'

- extendedWaitUntil:
    visible:
      id: 'PinPage.Container'
    timeout: 10000

- repeat:
    times: 4
    commands:
      - tapOn:
          id: 'PinPage.Digit.1'
      - tapOn:
          id: 'PinPage.Digit.1'
      - tapOn:
          id: 'PinPage.Digit.1'
      - tapOn:
          id: 'PinPage.Digit.1'
      - extendedWaitUntil:
          visible:
            text: 'Incorrect PIN'
          timeout: 10000

- tapOn:
    id: 'PinPage.Digit.1'
- tapOn:
    id: 'PinPage.Digit.1'
- tapOn:
    id: 'PinPage.Digit.1'
- tapOn:
    id: 'PinPage.Digit.1'

- extendedWaitUntil:
    visible:
      text: 'Too many attempts.*'
    timeout: 10000

- assertVisible:
    id: 'PinPage.Digit.1'
    enabled: false

- tapOn:
    id: 'PinPage.Digit.1'

- assertVisible:
    text: 'Too many attempts.*'

- extendedWaitUntil:
    notVisible:
      text: 'Too many attempts.*'
    timeout: 45000

- tapOn:
    id: 'PinPage.Digit.1'
- tapOn:
    id: 'PinPage.Digit.2'
- tapOn:
    id: 'PinPage.Digit.3'
- tapOn:
    id: 'PinPage.Digit.4'

- extendedWaitUntil:
    visible:
      id: 'PinPage.Container'
    timeout: 10000

- tapOn:
    id: 'PinPage.Digit.5'
- tapOn:
    id: 'PinPage.Digit.6'
- tapOn:
    id: 'PinPage.Digit.7'
- tapOn:
    id: 'PinPage.Digit.8'

- extendedWaitUntil:
    visible:
      id: 'PinPage.Container'
    timeout: 10000

- tapOn:
    id: 'PinPage.Digit.5'
- tapOn:
    id: 'PinPage.Digit.6'
- tapOn:
    id: 'PinPage.Digit.7'
- tapOn:
    id: 'PinPage.Digit.8'

- extendedWaitUntil:
    visible:
      text: 'Enter your PIN'
    timeout: 10000

- tapOn:
    id: 'PinPage.Digit.1'
- tapOn:
    id: 'PinPage.Digit.2'
- tapOn:
    id: 'PinPage.Digit.3'
- tapOn:
    id: 'PinPage.Digit.4'

- extendedWaitUntil:
    visible:
      id: 'PinPage.Error'
    timeout: 10000

- tapOn:
    id: 'PinPage.Digit.5'
- tapOn:
    id: 'PinPage.Digit.6'
- tapOn:
    id: 'PinPage.Digit.7'
- tapOn:
    id: 'PinPage.Digit.8'

- extendedWaitUntil:
    visible:
      id: 'TabBar.Settings'
    timeout: 10000

- runFlow: subflows/navigation/navigate-to-settings.flow.yaml

- runFlow:
    file: subflows/navigation/open-settings-card.flow.yaml
    env:
      CARD_ID: 'SettingsPage.AppLockDisableButton'
      DESTINATION_ID: 'PinPage.Container'

- extendedWaitUntil:
    visible:
      id: 'PinPage.Container'
    timeout: 10000

- tapOn:
    id: 'PinPage.Digit.5'
- tapOn:
    id: 'PinPage.Digit.6'
- tapOn:
    id: 'PinPage.Digit.7'
- tapOn:
    id: 'PinPage.Digit.8'

- extendedWaitUntil:
    visible:
      id: 'TabBar.Settings'
    timeout: 10000

- tapOn:
    id: 'TabBar.Home'

- extendedWaitUntil:
    visible:
      id: 'HomePage.TotalBalance'
    timeout: 10000

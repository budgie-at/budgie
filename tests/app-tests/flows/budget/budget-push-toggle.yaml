appId: ${APP_ID}
---

- runFlow:
    file: ../setup/setup-rules-test.flow.yaml

# --- Seed a budget from empty state ---

- openLink: 'budgie://budget'
- extendedWaitUntil:
    visible:
      id: 'BudgetWidget.EmptyState'
    timeout: 5000

- tapOn:
    id: 'BudgetWidget.EmptyState'
- extendedWaitUntil:
    visible: 'Create budget'
    timeout: 5000

- tapOn:
    id: 'BudgetSetup.OverallLimitInput'
- inputText: '1000'

# --- AC-1: Toggle ON persists ---

- tapOn:
    id: 'BudgetSetup.PushToggle'
- waitForAnimationToEnd

- tapOn:
    id: 'BudgetSetup.SaveButton'

- tapOn:
    id: 'BudgetWidget.Card'
- extendedWaitUntil:
    visible:
      id: 'BudgetDetail.EditButton'
    timeout: 5000

- tapOn:
    id: 'BudgetDetail.EditButton'
- extendedWaitUntil:
    visible: 'Edit budget'
    timeout: 5000

- assertVisible:
    id: 'BudgetSetup.PushToggle'

# --- AC-1: Toggle OFF persists ---

- tapOn:
    id: 'BudgetSetup.PushToggle'
- waitForAnimationToEnd

- tapOn:
    id: 'BudgetSetup.SaveButton'

- tapOn:
    id: 'BudgetWidget.Card'
- extendedWaitUntil:
    visible:
      id: 'BudgetDetail.EditButton'
    timeout: 5000

- tapOn:
    id: 'BudgetDetail.EditButton'
- extendedWaitUntil:
    visible: 'Edit budget'
    timeout: 5000

- assertVisible:
    id: 'BudgetSetup.PushToggle'

# --- Cleanup: delete budget ---

- tapOn: 'Cancel'
- extendedWaitUntil:
    visible:
      id: 'BudgetDetail.DeleteButton'
    timeout: 5000

- tapOn:
    id: 'BudgetDetail.DeleteButton'
- extendedWaitUntil:
    visible: 'Delete budget?'
    timeout: 5000
- tapOn: 'Delete'

- extendedWaitUntil:
    visible:
      id: 'BudgetWidget.EmptyState'
    timeout: 10000

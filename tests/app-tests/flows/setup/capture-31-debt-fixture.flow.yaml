appId: ${APP_ID}
---
# One-off fixture capture: seeds 09.db, creates the debt-settlement accounts through
# the real UI, then the runner snapshots the app database as fixtures/31-debt.db.
# Run via scripts/capture-fixture.sh; never part of the CI suite.

- runFlow:
      file: ../subflows/import/import-database-from-settings.flow.yaml
      env:
          FIXTURE_ROW_ID_MATCH: '09.db(, db)?'

- runFlow:
      file: ../subflows/accounts/create-liability-account.flow.yaml
      env:
          ACCOUNT_TYPE_ID: 'CreateAccount.CASH'
          ACCOUNT_SCREEN_TITLE: 'Cash Account'
          ACCOUNT_NAME: 'E2E EUR Debt Funding Account'
          CURRENCY_CODE: 'EUR'
          ACCOUNT_AMOUNT: '1000'

- runFlow:
      file: ../subflows/accounts/create-debt-account.flow.yaml
      env:
          ACCOUNT_NAME: 'E2E Lent Expense Debt'
          CURRENCY_CODE: 'EUR'
          CURRENT_BALANCE: '0'
          DEBT_TYPE: 'LENT'
          TARGET_BALANCE: '1000'

- runFlow:
      file: ../subflows/accounts/create-debt-account.flow.yaml
      env:
          ACCOUNT_NAME: 'E2E Lent Debt'
          CURRENCY_CODE: 'EUR'
          CURRENT_BALANCE: '2000'
          DEBT_TYPE: 'LENT'
          TARGET_BALANCE: '15000'

- runFlow:
      file: ../subflows/accounts/create-debt-account.flow.yaml
      env:
          ACCOUNT_NAME: 'E2E Borrowed Debt'
          CURRENCY_CODE: 'EUR'
          CURRENT_BALANCE: '15000'
          DEBT_TYPE: 'BORROW'
          TARGET_BALANCE: '15000'

- runFlow:
      file: ../subflows/accounts/create-debt-account.flow.yaml
      env:
          ACCOUNT_NAME: 'E2E Completed Debt'
          CURRENCY_CODE: 'EUR'
          CURRENT_BALANCE: '0'
          DEBT_TYPE: 'LENT'
          TARGET_BALANCE: '300'

appId: ${APP_ID}
---
# One-off fixture capture: seeds 02.db, creates the crypto/fiat accounts through
# the real UI, then the runner snapshots the app database as fixtures/29.db.
# Run via scripts/capture-fixture.sh; never part of the CI suite.

- runFlow:
      file: ../subflows/import/import-database-from-settings.flow.yaml
      env:
          FIXTURE_ROW_ID_MATCH: '02.db'

- runFlow:
      file: ../subflows/accounts/create-liability-account.flow.yaml
      env:
          ACCOUNT_TYPE_ID: 'CreateAccount.CASH'
          ACCOUNT_NAME: 'E2E Fiat Pocket'
          ACCOUNT_AMOUNT: '100'
          CURRENCY_CODE: 'EUR'

- runFlow:
      file: ../subflows/accounts/create-crypto-account.flow.yaml
      env:
          ACCOUNT_NAME: 'E2E Crypto Vault'
          ACCOUNT_AMOUNT: '2'
          CURRENCY_CODE: 'BTC'

- runFlow:
      file: ../subflows/accounts/create-crypto-account.flow.yaml
      env:
          ACCOUNT_NAME: 'E2E Binance BTC'
          ACCOUNT_AMOUNT: '2'
          CURRENCY_CODE: 'BTC'

- runFlow:
      file: ../subflows/accounts/create-crypto-account.flow.yaml
      env:
          ACCOUNT_NAME: 'E2E Ethereum Stack'
          ACCOUNT_AMOUNT: '1'
          CURRENCY_CODE: 'ETH'

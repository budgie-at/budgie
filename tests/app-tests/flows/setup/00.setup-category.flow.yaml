appId: ${APP_ID}
---
# Setup: Create a test category for rule testing
# This creates a "Test Category" for rule actions

# Navigate to Home first to reset Settings scroll position
- tapOn:
    id: 'TabBar.Home'
- extendedWaitUntil:
    visible: 'TOTAL BALANCE'
    timeout: 3000

# Navigate to Settings > Categories
- tapOn:
    id: 'TabBar.Settings'
- extendedWaitUntil:
    visible: 'Settings'
    timeout: 3000

# Find and tap Manage Categories (in Organization section)
- scrollUntilVisible:
    element:
      id: 'SettingsPage.ManageCategoriesCard'
    direction: DOWN
    timeout: 15000
    speed: 20
- tapOn:
    id: 'SettingsPage.ManageCategoriesCard'
- extendedWaitUntil:
    visible: 'Categories'
    timeout: 3000

# Tap the + FAB button to reveal create actions
- tapOn:
    id: 'CreateTransactionTrigger'
# Wait for the staggered menu animation
- extendedWaitUntil:
    visible:
      id: 'ActionItem.0'
    timeout: 3000
- waitForAnimationToEnd
# Tap the Category action item (index 0 as it's prepended to the menu)
- tapOn:
    id: 'ActionItem.0'
# Wait for the FAB menu to disappear first
- extendedWaitUntil:
    notVisible:
      id: 'ActionItem.0'
    timeout: 5000
# Add explicit delay for bottom sheet animation
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000
# Tap on the input field area (category name input)
- tapOn:
    point: 50%, 73%
- inputText: 'Test Category'
# Tap the Create button at bottom right
- tapOn:
    point: 75%, 95%
# Wait for bottom sheet to close and list to update
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000

# Go back to settings
- tapOn:
    id: 'TabBar.Settings'

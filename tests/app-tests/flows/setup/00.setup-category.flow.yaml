appId: ${APP_ID}
---
# Setup: Create a test category for rule testing
# This creates a "Test Category" for rule actions

# Navigate to Home first to reset Settings scroll position
- tapOn:
    id: 'TabBar.Home'
- extendedWaitUntil:
    visible: 'TOTAL BALANCE'
    timeout: 3000

# Navigate to Settings > Categories
- tapOn:
    id: 'TabBar.Settings'
- extendedWaitUntil:
    visible: 'Settings'
    timeout: 3000

# Find and tap Manage Categories (in Organization section)
- scrollUntilVisible:
    element:
      id: 'SettingsPage.ManageCategoriesCard'
    direction: DOWN
    timeout: 15000
    speed: 20
- tapOn:
    id: 'SettingsPage.ManageCategoriesCard'
- extendedWaitUntil:
    visible: 'Categories'
    timeout: 3000

# Tap the + FAB button to reveal create actions
- tapOn:
    id: 'CreateTransactionTrigger'
# Wait for the staggered menu animation
- extendedWaitUntil:
    visible:
      id: 'ActionItem.0'
    timeout: 2000
- waitForAnimationToEnd
# Tap the Category action item
- tapOn:
    text: 'Category'
# Give time for FAB menu to close and bottom sheet to start opening
- waitForAnimationToEnd
# Wait for the bottom sheet to open
- extendedWaitUntil:
    visible: 'Category Name'
    timeout: 5000

# Enter category name
- tapOn:
    text: 'Category Name'
- inputText: 'Test Category'

# Submit
- tapOn:
    text: 'Create'
- extendedWaitUntil:
    visible: 'Test Category'
    timeout: 5000

# Go back to settings
- tapOn:
    id: 'TabBar.Settings'

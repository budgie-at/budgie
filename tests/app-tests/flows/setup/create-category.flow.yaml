appId: ${APP_ID}
---
# Setup: Create a category with the given name
# Requires: CATEGORY_NAME env variable
# Assumes: App is launched

# Navigate to Home first to reset Settings scroll position
- tapOn:
    id: 'TabBar.Home'
- extendedWaitUntil:
    visible: 'TOTAL BALANCE'
    timeout: 3000

# Navigate to Settings > Categories
- tapOn:
    id: 'TabBar.Settings'
- extendedWaitUntil:
    visible: 'Settings'
    timeout: 3000

# Find and tap Manage Categories
- scrollUntilVisible:
    element:
      id: 'SettingsPage.ManageCategoriesCard'
    direction: DOWN
    timeout: 15000
    speed: 20
- tapOn:
    id: 'SettingsPage.ManageCategoriesCard'
- extendedWaitUntil:
    visible: 'Categories'
    timeout: 3000

# Tap the + FAB button to reveal create actions
- tapOn:
    id: 'CreateTransactionTrigger'
- extendedWaitUntil:
    visible:
      id: 'ActionItem.0'
    timeout: 3000
- waitForAnimationToEnd

# Tap the Category action item
- tapOn:
    id: 'ActionItem.0'
- extendedWaitUntil:
    notVisible:
      id: 'ActionItem.0'
    timeout: 5000

# Enter category name
- tapOn:
    point: 50%, 73%
- inputText: ${CATEGORY_NAME}

# Tap the Create button
- tapOn:
    point: 75%, 95%

# Wait for category list to show the new category
- extendedWaitUntil:
    visible: ${CATEGORY_NAME}
    timeout: 5000

# Go back to settings
- tapOn:
    id: 'TabBar.Settings'

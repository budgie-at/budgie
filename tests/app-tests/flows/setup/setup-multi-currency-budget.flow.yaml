appId: ${APP_ID}
---
- stopApp
- launchApp:
      permissions:
          contacts: allow
          microphone: allow
          notifications: allow

- runFlow:
      file: ../subflows/import/import-database-from-settings.flow.yaml
      env:
          FIXTURE_ROW_ID_MATCH: 'budget-multi-currency.db(, db)?'

- stopApp
- launchApp:
      permissions:
          contacts: allow
          microphone: allow
          notifications: allow
- extendedWaitUntil:
      visible:
          id: 'TabBar.Home'
      timeout: 30000

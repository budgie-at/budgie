appId: ${APP_ID}
---
- tapOn:
    id: 'TabBar.Home'
- extendedWaitUntil:
    visible: 'TOTAL BALANCE'

- tapOn:
    id: 'CreateTransactionTrigger'
- extendedWaitUntil:
    visible:
      id: 'ActionItem.0'
- waitForAnimationToEnd
- tapOn:
    text: 'Account'
- extendedWaitUntil:
    visible: 'New Account'
- tapOn:
    id: 'CreateAccount.CASH'
- extendedWaitUntil:
    visible: 'Account Name & Icon'
- tapOn:
    text: 'e.g. Savings Account'
- inputText: ${ACCOUNT_NAME}
- tapOn:
    text: 'Submit'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'TOTAL BALANCE'
    timeout: 10000

- assertVisible: ${ACCOUNT_NAME}, $0
- assertVisible: 'TOTAL BALANCE'

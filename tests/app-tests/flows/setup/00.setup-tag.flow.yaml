appId: ${APP_ID}
---
# Setup: Create a test tag for rule testing
# This creates a "Test Tag" for ADD_TAG rule actions

# Navigate to Home first to reset Settings scroll position
- tapOn:
    id: 'TabBar.Home'
- extendedWaitUntil:
    visible: 'TOTAL BALANCE'
    timeout: 3000

# Navigate to Settings > Tags
- tapOn:
    id: 'TabBar.Settings'
- extendedWaitUntil:
    visible: 'Settings'
    timeout: 3000

# Find and tap Manage Tags using testID
- scrollUntilVisible:
    element:
      id: 'SettingsPage.ManageTagsCard'
    direction: DOWN
    timeout: 15000
    speed: 20
- tapOn:
    id: 'SettingsPage.ManageTagsCard'
- extendedWaitUntil:
    visible: 'Tags'
    timeout: 3000

# Tap the + FAB button to reveal create actions
- tapOn:
    id: 'CreateTransactionTrigger'
# Wait for the staggered menu animation
- extendedWaitUntil:
    visible:
      id: 'ActionItem.0'
    timeout: 3000
- waitForAnimationToEnd
# Tap the Tag action item (index 0 as it's prepended to the menu)
- tapOn:
    id: 'ActionItem.0'
# Wait for the FAB menu to disappear first
- extendedWaitUntil:
    notVisible:
      id: 'ActionItem.0'
    timeout: 5000
# Add explicit delay for bottom sheet animation
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000
# Tap on the input field area (tag name input - higher than category since no icon selector)
- tapOn:
    point: 50%, 82%
- inputText: 'Test Tag'
# Tap the Create button at bottom right
- tapOn:
    point: 75%, 96%
# Wait for bottom sheet to close
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000

# Go back to settings
- tapOn:
    id: 'TabBar.Settings'

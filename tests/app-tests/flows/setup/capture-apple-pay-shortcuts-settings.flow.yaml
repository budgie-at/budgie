appId: ${APP_ID}
env:
    FIXTURE_ROW_ID_MATCH: 'apple-pay-shortcuts-guide.db'
---
- openLink: 'budgie://settings?anchor=general'
- waitForAnimationToEnd
- scrollUntilVisible:
      element:
          id: 'SettingsPage.ApplePayCaptureCard'
      direction: DOWN
      centerElement: true
- assertVisible:
      id: 'SettingsPage.ApplePayCaptureCard'

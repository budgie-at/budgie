appId: ${APP_ID}
---
# iOS shows an "Open in app?" confirmation for the first custom-scheme link on a
# fresh simulator. run-maestro-suite.sh nests this flow before the first business
# flow so both execute in one Maestro session without per-call Open probes.

- openLink: 'budgie://transactions'

- runFlow:
      when:
          visible: 'Open'
      commands:
          - tapOn: 'Open'
          - extendedWaitUntil:
                notVisible: 'Open in .*'
                timeout: 5000

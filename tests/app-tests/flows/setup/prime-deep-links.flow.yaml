appId: ${APP_ID}
---
# iOS shows an "Open in app?" confirmation for the first custom-scheme link on a
# fresh simulator. The probe is allowed to time out after presenting that alert;
# each bounded recovery attempt clears it before requiring a successful deep link.

- openLink:
      link: 'budgie://transactions'
      optional: true

- retry:
      maxRetries: 2
      commands:
          - runFlow:
                when:
                    visible: 'Open in .*'
                commands:
                    - retry:
                          maxRetries: 2
                          commands:
                              - tapOn:
                                    text: 'Open'
                              - extendedWaitUntil:
                                    notVisible: 'Open in .*'
                                    timeout: 3000

          - extendedWaitUntil:
                notVisible: 'Open in .*'
                timeout: 3000

          - openLink:
                link: 'budgie://transactions'

          - extendedWaitUntil:
                notVisible: 'Open in .*'
                timeout: 3000

          - extendedWaitUntil:
                visible:
                    id: 'TransactionsPage.Container'
                timeout: 10000

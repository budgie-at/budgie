- swipe:
    from:
      id: 'RulesPage.RuleCard.0'
    direction: LEFT
    duration: 300
- tapOn:
    id: DeletableRow.DeleteButton
- tapOn: Delete

- assertVisible:
    id: 'RulesPage.EmptyState'

# --- Apply to Existing Toggle (create rule, skip, re-save with apply) ---

- tapOn:
    id: 'ActionButton'
- extendedWaitUntil:
    visible:

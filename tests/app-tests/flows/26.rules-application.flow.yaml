- inputText: 'Auto Transfer'
- tapOn: Done
- waitForAnimationToEnd

# Convert to Transfer is selectable even without a Transaction Type condition
- tapOn:
      id: 'RuleForm.Action.0.TypeSelector.Value'
- extendedWaitUntil:

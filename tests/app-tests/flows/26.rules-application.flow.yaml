appId: ${APP_ID}
env:
    ACCOUNT_NAME: Rules Test Account
    CATEGORY_NAME: Rules Test Category
    TAG_NAME: Rules Test Tag
---
- runFlow:
      file: setup/setup-rules-test.flow.yaml

- runFlow:
      file: subflows/navigate-to-rules.flow.yaml

# --- Rule Applies Category (comment contains "Netflix" → set category) ---

- tapOn:
      id: 'ActionButton'
      retryTapIfNoChange: true
- extendedWaitUntil:
      visible:
          id: 'RulesPage.CreateButton.Label'
- waitForAnimationToEnd
- tapOn:
      id: 'RulesPage.CreateButton.Label'
- extendedWaitUntil:
      visible: 'Create Rule'

- runFlow:
      file: subflows/rules/select-comment-condition-field.flow.yaml
- tapOn:
      id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Netflix'
- tapOn: Done
- waitForAnimationToEnd

- runFlow:
      file: subflows/rules/open-action-category-selector.flow.yaml
      env:
          ACTION_INDEX: 0
- runFlow:
      file: subflows/shared/select-category-by-search.flow.yaml
      env:
          CATEGORY_NAME: ${CATEGORY_NAME}

- tapOn:
      id: 'RuleForm.Footer.SubmitButton.Label'
- extendedWaitUntil:
      visible: 'Apply to existing transactions?'
      timeout: 10000
- tapOn: 'Apply'
- waitForAnimationToEnd

- assertVisible:
      id: 'RulesPage.RuleCard.0'

- tapOn:
      id: 'TabBar.Transactions'
- waitForAnimationToEnd

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.Netflix_Subscription'
- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Category.Rules_Test_Category'

# Delete rule

- runFlow:
      file: subflows/navigate-to-rules.flow.yaml

- runFlow: subflows/rules/delete-first-rule-via-form.flow.yaml

- assertVisible:
      id: 'RulesPage.EmptyState'

# --- Rule Applies Tag (comment contains "Starbucks" → add tag) ---

- tapOn:
      id: 'ActionButton'
      retryTapIfNoChange: true
- extendedWaitUntil:
      visible:
          id: 'RulesPage.CreateButton.Label'
- waitForAnimationToEnd
- tapOn:
      id: 'RulesPage.CreateButton.Label'
- extendedWaitUntil:
      visible: 'Create Rule'

- tapOn:
      id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Starbucks'
- tapOn: Done
- waitForAnimationToEnd

- tapOn:
      id: 'RuleForm.Action.0.TypeSelector.Value'
- tapOn:
      id: 'RuleForm.SelectorCard.ADD_TAG.Label'
- waitForAnimationToEnd

- tapOn:
      id: 'RuleForm.Action.0.TagSelector'
- waitForAnimationToEnd
- tapOn:
      text: ${TAG_NAME}

- tapOn:
      id: 'RuleForm.Footer.SubmitButton.Label'
- extendedWaitUntil:
      visible: 'Apply to existing transactions?'
      timeout: 10000
- tapOn: 'Apply'
- waitForAnimationToEnd

- assertVisible:
      id: 'RulesPage.RuleCard.0'

- tapOn:
      id: 'TabBar.Transactions'
- waitForAnimationToEnd

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.Starbucks_Coffee'
          text: '.*Rules Test Tag.*'

# Delete rule

- runFlow:
      file: subflows/navigate-to-rules.flow.yaml

- runFlow: subflows/rules/delete-first-rule-via-form.flow.yaml

- assertVisible:
      id: 'RulesPage.EmptyState'

# --- Rule Applies Multiple Actions (comment contains "Amazon" → set category + add tag) ---

- tapOn:
      id: 'ActionButton'
      retryTapIfNoChange: true
- extendedWaitUntil:
      visible:
          id: 'RulesPage.CreateButton.Label'
- waitForAnimationToEnd
- tapOn:
      id: 'RulesPage.CreateButton.Label'
- extendedWaitUntil:
      visible: 'Create Rule'

- runFlow:
      file: subflows/rules/select-comment-condition-field.flow.yaml
- tapOn:
      id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Amazon'
- tapOn: Done
- waitForAnimationToEnd

- runFlow:
      file: subflows/rules/open-action-category-selector.flow.yaml
      env:
          ACTION_INDEX: 0
- runFlow:
      file: subflows/shared/select-category-by-search.flow.yaml
      env:
          CATEGORY_NAME: ${CATEGORY_NAME}

- tapOn:
      id: 'RuleForm.ActionSection.AddButton'

- tapOn:
      id: 'RuleForm.Action.1.TypeSelector.Value'
- tapOn:
      id: 'RuleForm.SelectorCard.ADD_TAG.Label'
- waitForAnimationToEnd

- scrollUntilVisible:
      element:
          id: 'RuleForm.Action.1.TagSelector'
      direction: DOWN
      centerElement: true

- tapOn:
      id: 'RuleForm.Action.1.TagSelector'
- waitForAnimationToEnd

- extendedWaitUntil:
      visible: ${TAG_NAME}
- tapOn: ${TAG_NAME}

- tapOn:
      id: 'RuleForm.Footer.SubmitButton.Label'
- extendedWaitUntil:
      visible: 'Apply to existing transactions?'
      timeout: 10000
- tapOn: 'Apply'
- waitForAnimationToEnd

- assertVisible:
      id: 'RulesPage.RuleCard.0'
      text: '.*Category → Rules Test Category.*'
- assertVisible:
      id: 'RulesPage.RuleCard.0'
      text: '.*Amazon.*'
- assertVisible:
      id: 'RulesPage.RuleCard.0'
      text: '.*Tag → Rules Test Tag.*'

- tapOn:
      id: 'TabBar.Transactions'
- waitForAnimationToEnd

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Category.Rules_Test_Category'
- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.Amazon_Purchase'
          text: '.*Rules Test Tag.*'

# Delete rule

- runFlow:
      file: subflows/navigate-to-rules.flow.yaml

- runFlow: subflows/rules/delete-first-rule-via-form.flow.yaml

- assertVisible:
      id: 'RulesPage.EmptyState'

# --- Apply to Existing Toggle (create rule, skip, re-save with apply) ---

- tapOn:
      id: 'ActionButton'
      retryTapIfNoChange: true
- extendedWaitUntil:
      visible:
          id: 'RulesPage.CreateButton.Label'
- waitForAnimationToEnd
- tapOn:
      id: 'RulesPage.CreateButton.Label'
- extendedWaitUntil:
      visible: 'Create Rule'

- runFlow:
      file: subflows/rules/enter-condition-value.flow.yaml
      env:
          VALUE: 'Spotify'

- runFlow:
      file: subflows/rules/open-action-category-selector.flow.yaml
      env:
          ACTION_INDEX: 0
- runFlow:
      file: subflows/shared/select-category-by-search.flow.yaml
      env:
          CATEGORY_NAME: ${CATEGORY_NAME}

- tapOn:
      id: 'RuleForm.Footer.SubmitButton.Label'
- runFlow:
      when:
          visible: 'Apply to existing transactions?'
      commands:
          - tapOn: 'Skip'
- waitForAnimationToEnd

- assertVisible:
      id: 'RulesPage.RuleCard.0'

- tapOn:
      id: 'TabBar.Transactions'
- waitForAnimationToEnd

- assertVisible:
      id: 'TransactionCard.Label.Spotify_Premium'

- runFlow:
      file: subflows/navigate-to-rules.flow.yaml

- tapOn:
      id: 'RulesPage.RuleCardActions.0'
- extendedWaitUntil:
      visible: 'Edit Rule'

- tapOn:
      id: 'RuleForm.Footer.SubmitButton.Label'
- extendedWaitUntil:
      visible: 'Apply to existing transactions?'
      timeout: 10000
- tapOn: 'Apply'
- waitForAnimationToEnd

- tapOn:
      id: 'TabBar.Transactions'
- waitForAnimationToEnd

- assertVisible:
      id: 'TransactionCard.Category.Rules_Test_Category'

# Delete rule

- runFlow:
      file: subflows/navigate-to-rules.flow.yaml

- runFlow: subflows/rules/delete-first-rule-via-form.flow.yaml

- assertVisible:
      id: 'RulesPage.EmptyState'

# --- Disabled Rule Not Applied (create rule, disable, create expense) ---

- tapOn:
      id: 'ActionButton'
      retryTapIfNoChange: true
- extendedWaitUntil:
      visible:
          id: 'RulesPage.CreateButton.Label'
- waitForAnimationToEnd
- tapOn:
      id: 'RulesPage.CreateButton.Label'
- extendedWaitUntil:
      visible: 'Create Rule'

- tapOn:

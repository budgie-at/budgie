- waitForAnimationToEnd
- extendedWaitUntil:
      visible:
          id: 'AccountPickerBottomSheet.Input'
- tapOn:
      id: 'AccountPickerBottomSheet.Input'
- inputText: 'Test22 Destination'
- tapOn: Done
- waitForAnimationToEnd
- extendedWaitUntil:
      visible:
          id: 'AccountPickerBottomSheet.Option.Test22 Destination'
- tapOn:
      id: 'AccountPickerBottomSheet.Option.Test22 Destination'
- waitForAnimationToEnd
- runFlow:
      when:
          visible:
              id: 'AccountPickerBottomSheet.Input'
      commands:
          - tapOn:
                id: 'AccountPickerBottomSheet.Option.Test22 Destination'
          - waitForAnimationToEnd
- extendedWaitUntil:
      notVisible:
          id: 'AccountPickerBottomSheet.Input'
- waitForAnimationToEnd

- tapOn:
      id: 'RuleForm.Footer.SubmitButton.Label'
- runFlow:
      when:
          visible: 'Apply to existing transactions?'
      commands:
          - tapOn: 'Apply'
- waitForAnimationToEnd
- extendedWaitUntil:
      visible:
          id: 'RulesPage.Page'

- assertVisible:
      id: 'RulesPage.RuleCard.0'
- assertVisible:
      id: 'RulesPage.RuleCard.0'
      text: '.*Transfer → Test22 Destination.*'

- tapOn:
      id: 'TabBar.Transactions'
- waitForAnimationToEnd

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.Auto_Transfer'
      timeout: 10000
- assertVisible:
      id: 'TransactionCard.FromAccount.Rules_Test_Account.Label'
- assertVisible:
      id: 'TransactionCard.ToAccount.Test22_Destination.Label'


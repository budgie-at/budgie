- extendedWaitUntil:
      visible:
          id: 'RulesPage.Page'

- assertVisible:
      id: 'RulesPage.RuleCard.0'

# Create second rule to trigger conflict warning
- tapOn:
      id: 'ActionButton'
      retryTapIfNoChange: true
- extendedWaitUntil:

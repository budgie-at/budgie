- waitForAnimationToEnd

- runFlow:
      file: subflows/transactions/create-expense.flow.yaml
      env:
          AMOUNT: '25'
          ACCOUNT_NAME: ${ACCOUNT_NAME}
          CATEGORY_NAME: ${CATEGORY_NAME}
          COMMENT: 'Uber Ride'

- assertVisible:
      id: 'TransactionCard.Label.Uber_Ride'

# Delete rule

- runFlow:
      file: subflows/navigate-to-rules.flow.yaml

- runFlow: subflows/rules/delete-first-rule-via-form.flow.yaml

- assertVisible:
      id: 'RulesPage.EmptyState'

# --- Rule Not Applied When Condition Doesn't Match ---

- tapOn:
      id: 'ActionButton'
      retryTapIfNoChange: true
- extendedWaitUntil:
      visible:
          id: 'RulesPage.CreateButton.Label'
      timeout: 3000
- waitForAnimationToEnd
- tapOn:
      id: 'RulesPage.CreateButton.Label'
- extendedWaitUntil:

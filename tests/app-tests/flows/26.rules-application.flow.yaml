          id: 'RuleForm.SelectorCard.CONVERT_TO_TRANSFER.Label'
- tapOn:
      id: 'RuleForm.SelectorCard.CONVERT_TO_TRANSFER.Label'
- waitForAnimationToEnd

- scrollUntilVisible:
      element:
          id: 'RuleForm.Action.0.AccountSelector'
      direction: DOWN
      centerElement: true

- tapOn:

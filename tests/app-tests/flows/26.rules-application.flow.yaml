- waitForAnimationToEnd

- runFlow:
      file: subflows/navigate-to-rules.flow.yaml

- extendedWaitUntil:
      visible:
          id: 'RulesPage.RuleCard.0'
      timeout: 10000

- tapOn:
      id: 'RulesPage.RuleCardActions.0'
- extendedWaitUntil:
      visible: 'Edit Rule'
- assertVisible:
      id: 'RuleForm.Condition.0.FieldSelector'
- assertVisible:
      id: 'RuleForm.Condition.1.FieldSelector'
- tapOn:
      id: 'PageHeader.BackButton'
- waitForAnimationToEnd

# Delete rule

- runFlow: subflows/rules/delete-first-rule-via-form.flow.yaml

- assertVisible:
      id: 'RulesPage.EmptyState'

# --- Matching Rules Pill (import → verify pill on transaction → open matching rule) ---

- tapOn:
      id: 'ActionButton'
      retryTapIfNoChange: true
- extendedWaitUntil:
      visible:
          id: 'RulesPage.CreateButton.Label'
- waitForAnimationToEnd

- tapOn:
      id: 'RulesPage.CreateButton.Label'
- extendedWaitUntil:
      visible: 'Create Rule'

- tapOn:
      id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Netflix'
- tapOn: Done
- waitForAnimationToEnd

- tapOn:
      id: 'RuleForm.Action.0.TypeSelector.Value'
- tapOn:
      id: 'RuleForm.SelectorCard.SET_CATEGORY.Label'
- waitForAnimationToEnd

- extendedWaitUntil:
      visible:
          id: 'RuleForm.Action.0.CategorySelector'

- runFlow:
      file: subflows/rules/open-action-category-selector.flow.yaml
      env:
          ACTION_INDEX: 0
- runFlow:
      file: subflows/shared/select-category-by-search.flow.yaml
      env:
          CATEGORY_NAME: Groceries

- tapOn:
      id: 'RuleForm.Footer.SubmitButton.Label'
- runFlow:
      when:
          visible: 'Apply to existing transactions?'
      commands:
          - tapOn: 'Skip'
- waitForAnimationToEnd

- assertVisible:
      id: 'RulesPage.RuleCard.0'

- runFlow:
      file: subflows/import/import-test-transactions.flow.yaml
      env:
          CSV_DISPLAY_NAME: test27-matching-rules-pill
          EXPECTED_TRANSACTION_LABEL_ID: TransactionCard.Label.Netflix_Premium

- tapOn:
      id: 'TabBar.Transactions'
- waitForAnimationToEnd

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.Netflix_Premium'
      timeout: 10000
- tapOn:
      id: 'TransactionCard.Label.Netflix_Premium'
- waitForAnimationToEnd

- extendedWaitUntil:
      visible:
          id: 'MatchingRules.Pill'
      timeout: 10000
- assertVisible:
      id: 'MatchingRules.Pill'

- tapOn:
      id: 'MatchingRules.Pill'
      retryTapIfNoChange: true
- waitForAnimationToEnd

- extendedWaitUntil:
      visible: 'Edit Rule'
      timeout: 10000
- assertVisible: 'Edit Rule'

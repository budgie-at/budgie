appId: ${APP_ID}
env:
    ACCOUNT_NAME: Rules Test Account
    CATEGORY_NAME: Rules Test Category
    TAG_NAME: Rules Test Tag
---
- runFlow:
      file: setup/setup-rules-test.flow.yaml

- runFlow:
      file: subflows/navigate-to-rules.flow.yaml

# --- Rule Applies Category (comment contains "Netflix" -> set category) ---

- runFlow:
      file: subflows/rules/open-create-rule-form.flow.yaml

- tapOn:
      id: 'RuleForm.Condition.0.FieldSelector.Value'
- waitForAnimationToEnd
- tapOn:
      id: 'RuleForm.SelectorCard.COMMENT'
- waitForAnimationToEnd
- tapOn:
      id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Netflix'

- tapOn: Done

- tapOn:
      id: 'RuleForm.Action.0.CategorySelector'
- runFlow:
      file: subflows/shared/select-category-by-search.flow.yaml
      env:
          CATEGORY_NAME: ${CATEGORY_NAME}

- runFlow:
      file: subflows/rules/submit-rule-apply-existing.flow.yaml

- assertVisible:
      id: 'RulesPage.RuleCard.0'

- runFlow:
      file: subflows/navigation/navigate-to-transactions.flow.yaml

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.Netflix_Subscription'
- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Category.Rules_Test_Category'

- runFlow:
      file: subflows/navigate-to-rules.flow.yaml

- runFlow:
      file: subflows/rules/delete-first-rule-via-form.flow.yaml

- assertVisible:
      id: 'RulesPage.EmptyState'

# --- Rule Applies Tag (comment contains "Starbucks" -> add tag) ---

- runFlow:
      file: subflows/rules/open-create-rule-form.flow.yaml

- tapOn:
      id: 'RuleForm.Condition.0.FieldSelector.Value'
- waitForAnimationToEnd
- tapOn:
      id: 'RuleForm.SelectorCard.COMMENT'
- waitForAnimationToEnd
- tapOn:
      id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Starbucks'

- tapOn: Done

- tapOn:
      id: 'RuleForm.Action.0.TypeSelector'
- tapOn:
      id: 'RuleForm.SelectorCard.ADD_TAG'
- waitForAnimationToEnd

- tapOn:
      id: 'RuleForm.Action.0.TagSelector'
- waitForAnimationToEnd
- runFlow:
      file: subflows/shared/select-tag-by-search.flow.yaml
      env:
          TAG_NAME: ${TAG_NAME}

- runFlow:
      file: subflows/rules/submit-rule-apply-existing.flow.yaml

- assertVisible:
      id: 'RulesPage.RuleCard.0'

- runFlow:
      file: subflows/navigation/navigate-to-transactions.flow.yaml

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Tag.Rules_Test_Tag'
- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.Starbucks_Coffee'

- runFlow:
      file: subflows/navigate-to-rules.flow.yaml

- runFlow:
      file: subflows/rules/delete-first-rule-via-form.flow.yaml

- assertVisible:
      id: 'RulesPage.EmptyState'

# --- Rule Applies Multiple Actions (comment contains "Amazon" -> set category + add tag) ---

- runFlow:
      file: subflows/rules/open-create-rule-form.flow.yaml

- tapOn:
      id: 'RuleForm.Condition.0.FieldSelector.Value'
- waitForAnimationToEnd
- tapOn:
      id: 'RuleForm.SelectorCard.COMMENT'
- waitForAnimationToEnd
- tapOn:
      id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Amazon'

- tapOn: Done

- tapOn:
      id: 'RuleForm.Action.0.CategorySelector'
- runFlow:
      file: subflows/shared/select-category-by-search.flow.yaml
      env:
          CATEGORY_NAME: ${CATEGORY_NAME}

- tapOn:
      id: 'RuleForm.ActionSection.AddButton'

- tapOn:
      id: 'RuleForm.Action.1.TypeSelector'
- tapOn:
      id: 'RuleForm.SelectorCard.ADD_TAG'
- waitForAnimationToEnd

- scrollUntilVisible:
      element:
          id: 'RuleForm.Action.1.TagSelector'
      direction: DOWN
      centerElement: true

- tapOn:
      id: 'RuleForm.Action.1.TagSelector'
- waitForAnimationToEnd
- runFlow:
      file: subflows/shared/select-tag-by-search.flow.yaml
      env:
          TAG_NAME: ${TAG_NAME}

- runFlow:
      file: subflows/rules/submit-rule-apply-existing.flow.yaml

- assertVisible:
      id: 'RulesPage.RuleCard.0'
- assertVisible:
      id: 'RulesPage.RuleCardConditions.0'
- assertVisible:
      id: 'RulesPage.RuleCardActions.0'

- runFlow:
      file: subflows/navigation/navigate-to-transactions.flow.yaml

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Category.Rules_Test_Category'
- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Tag.Rules_Test_Tag'

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.Amazon_Purchase'

- runFlow:
      file: subflows/navigate-to-rules.flow.yaml

- runFlow:
      file: subflows/rules/delete-first-rule-via-form.flow.yaml

- assertVisible:
      id: 'RulesPage.EmptyState'

# --- Apply to Existing Toggle (create rule, skip, re-save with apply) ---

- runFlow:
      file: subflows/rules/open-create-rule-form.flow.yaml

- tapOn:
      id: 'RuleForm.Condition.0.FieldSelector.Value'
- waitForAnimationToEnd
- tapOn:
      id: 'RuleForm.SelectorCard.COMMENT'
- waitForAnimationToEnd
- tapOn:
      id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Spotify'

- tapOn: Done

- tapOn:
      id: 'RuleForm.Action.0.CategorySelector'
- runFlow:
      file: subflows/shared/select-category-by-search.flow.yaml
      env:
          CATEGORY_NAME: ${CATEGORY_NAME}

- runFlow:
      file: subflows/rules/submit-rule-skip-existing.flow.yaml
- waitForAnimationToEnd

- assertVisible:
      id: 'RulesPage.RuleCard.0'

- runFlow:
      file: subflows/navigation/navigate-to-transactions.flow.yaml

- assertVisible:
      id: 'TransactionCard.Label.Spotify_Premium'

- runFlow:
      file: subflows/navigate-to-rules.flow.yaml

- tapOn:
      id: 'RulesPage.RuleCardActions.0'
- extendedWaitUntil:
      visible: 'Edit Rule'
- waitForAnimationToEnd
- extendedWaitUntil:
      visible:
          id: 'RuleForm.StatusBlock'
      timeout: 5000
- extendedWaitUntil:
      visible:
          id: 'RuleForm.Condition.0.ValueInput'
      timeout: 8000

- runFlow:
      file: subflows/rules/submit-rule-apply-existing.flow.yaml

- runFlow:
      file: subflows/navigation/navigate-to-transactions.flow.yaml

- assertVisible:
      id: 'TransactionCard.Category.Rules_Test_Category'

- runFlow:
      file: subflows/navigate-to-rules.flow.yaml

- runFlow:
      file: subflows/rules/delete-first-rule-via-form.flow.yaml

- assertVisible:
      id: 'RulesPage.EmptyState'

# --- Disabled Rule Not Applied (create rule, disable, create expense) ---

- runFlow:
      file: subflows/rules/open-create-rule-form.flow.yaml

- tapOn:
      id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Uber'

- tapOn: Done

- tapOn:
      id: 'RuleForm.Action.0.CategorySelector'
- runFlow:
      file: subflows/shared/select-category-by-search.flow.yaml
      env:
          CATEGORY_NAME: ${CATEGORY_NAME}

- tapOn:
      id: 'RuleForm.Footer.SubmitButton'
- waitForAnimationToEnd

- assertVisible:
      id: 'RulesPage.RuleCard.0'

- tapOn:
      id: 'RulesPage.RuleCardEnabledSwitch.0'
- waitForAnimationToEnd

- runFlow:
      file: subflows/transactions/create-expense.flow.yaml
      env:
          AMOUNT: '25'
          ACCOUNT_NAME: ${ACCOUNT_NAME}
          CATEGORY_NAME: Other
          COMMENT: 'Uber Ride'

- runFlow:
      file: subflows/navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: budgie://transactions/9/expense
- extendedWaitUntil:
      visible:
          id: 'TransactionInfo.Page'
      timeout: 10000
- assertVisible:
      id: 'TransactionInfo.Row.Note'
- assertVisible: 'Uber Ride'
- assertVisible:
      id: 'TransactionInfo.Row.Category'
- assertVisible: 'Other'

- runFlow:
      file: subflows/navigate-to-rules.flow.yaml

- runFlow:
      file: subflows/rules/delete-first-rule-via-form.flow.yaml

- assertVisible:
      id: 'RulesPage.EmptyState'

# --- Rule Not Applied When Condition Doesn't Match ---

- runFlow:
      file: subflows/rules/open-create-rule-form.flow.yaml

- tapOn:
      id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Netflix'

- tapOn: Done

- tapOn:
      id: 'RuleForm.Action.0.CategorySelector'
- runFlow:
      file: subflows/shared/select-category-by-search.flow.yaml
      env:
          CATEGORY_NAME: ${CATEGORY_NAME}

- runFlow:
      file: subflows/rules/submit-rule-skip-existing.flow.yaml
- waitForAnimationToEnd

- assertVisible:
      id: 'RulesPage.RuleCard.0'

- runFlow:
      file: subflows/transactions/create-expense.flow.yaml
      env:
          AMOUNT: '10'
          ACCOUNT_NAME: ${ACCOUNT_NAME}
          CATEGORY_NAME: Other
          COMMENT: 'Random Purchase'

- runFlow:
      file: subflows/navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: budgie://transactions/10/expense
- extendedWaitUntil:
      visible:
          id: 'TransactionInfo.Page'
      timeout: 10000
- assertVisible:
      id: 'TransactionInfo.Row.Note'
- assertVisible: 'Random Purchase'
- assertVisible:
      id: 'TransactionInfo.Row.Category'
- assertVisible: 'Other'

- runFlow:
      file: subflows/navigate-to-rules.flow.yaml

- runFlow:
      file: subflows/rules/delete-first-rule-via-form.flow.yaml

- assertVisible:
      id: 'RulesPage.EmptyState'

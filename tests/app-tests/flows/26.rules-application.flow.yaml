    id: 'ActionButton'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.CreateButton'
- waitForAnimationToEnd

- tapOn:
    id: 'RulesPage.CreateButton'
- extendedWaitUntil:
    visible: 'Create Rule'

- tapOn:
    id: 'RuleForm.Condition.0.FieldSelector'
- waitForAnimationToEnd
- tapOn: 'Comment'
- waitForAnimationToEnd
- tapOn:
    id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Netflix'

- tapOn: return

- tapOn:
    id: 'RuleForm.Action.0.TypeSelector'
- tapOn:
    id: 'RuleForm.SelectorCard.SET_CATEGORY'
- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      id: 'RuleForm.Action.0.CategorySelector'
    direction: DOWN
    centerElement: true

- tapOn:
    id: 'RuleForm.Action.0.CategorySelector'
- runFlow:
    file: subflows/shared/select-category-by-search.flow.yaml
    env:
      CATEGORY_NAME: Groceries

- tapOn:
    id: 'RuleForm.Footer.SubmitButton'
- runFlow:
    when:
      visible: 'Apply to existing transactions?'
    commands:
      - tapOn: 'Skip'
- waitForAnimationToEnd

- assertVisible:
    id: 'RulesPage.RuleCard.0'

- runFlow:
    file: subflows/import/import-test-transactions.flow.yaml
    env:
      CSV_DISPLAY_NAME: test27-matching-rules-pill

- tapOn:
    id: 'TabBar.Transactions'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'TransactionCard.Label.Netflix_Premium'
    timeout: 10000
- tapOn:
    id: 'TransactionCard.Label.Netflix_Premium'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'MatchingRules.Pill'
    timeout: 10000
- assertVisible:
    id: 'MatchingRules.Pill'

- tapOn:
    id: 'MatchingRules.Pill'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: 'Edit Rule'
- assertVisible: 'Edit Rule'

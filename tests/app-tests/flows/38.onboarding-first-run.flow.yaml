appId: ${APP_ID}
env:
    FIXTURE_ROW_ID_MATCH: '38-onboarding.db'
---
- launchApp:
      stopApp: true
      permissions:
          contacts: allow
          microphone: allow

- extendedWaitUntil:
      visible:
          id: 'OnboardingWelcome.StartButton'
      timeout: 30000

- tapOn:
      id: 'OnboardingWelcome.StartButton'

- extendedWaitUntil:
      visible:
          id: 'OnboardingKey.PhoneLockOption'
      timeout: 3000

- tapOn:
      id: 'OnboardingKey.PhoneLockOption'

- extendedWaitUntil:
      visible:
          id: 'OnboardingPhoneLock.ContinueButton'
      timeout: 3000

- tapOn:
      id: 'OnboardingPhoneLock.ContinueButton'

- extendedWaitUntil:
      visible:
          id: 'OnboardingAccounts.CASH'
      timeout: 3000

- tapOn:
      id: 'OnboardingAccounts.CASH'
- tapOn:
      id: 'OnboardingAccounts.BANK'

- tapOn:
      id: 'OnboardingAccounts.AddButton'

- extendedWaitUntil:
      visible:
          id: 'OnboardingBalances.LaterButton'
      timeout: 3000

- tapOn:
      id: 'OnboardingStepLayout.BackButton'

- extendedWaitUntil:
      visible:
          id: 'OnboardingAccounts.CASH'
      timeout: 3000

- tapOn:
      id: 'OnboardingAccounts.AddButton'

- extendedWaitUntil:
      visible:
          id: 'OnboardingBalances.LaterButton'
      timeout: 3000

- tapOn:
      id: 'OnboardingBalances.LaterButton'

- extendedWaitUntil:
      visible:
          id: 'OnboardingAi.NoThanksButton'
      timeout: 3000

- tapOn:
      id: 'OnboardingAi.NoThanksButton'

- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
      timeout: 30000

- assertVisible:
      id: 'SecurityLockButton.Root'

- assertNotVisible:
      id: 'AccountsEmptyState.AddAccountButton'

- runFlow:
      file: subflows/navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://onboarding'
- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
      timeout: 10000
- assertNotVisible:
      id: 'OnboardingKey.PhoneLockOption'

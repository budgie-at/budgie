appId: ${APP_ID}
---
- launchApp:
      clearState: true
      permissions:
          contacts: allow
          microphone: allow

- extendedWaitUntil:
      visible:
          id: 'OnboardingCurrencyStrip'
      timeout: 60000

- assertVisible: 'New Expense'

- tapOn:
      id: 'TransactionKeypad.Digit.5'
- tapOn:
      id: 'TransactionKeypad.Digit.0'

- tapOn:
      id: 'TransactionForm.SubmitButton'
      retryTapIfNoChange: true

- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
      timeout: 60000

- assertNotVisible:
      id: 'AccountsEmptyState.AddAccountButton'

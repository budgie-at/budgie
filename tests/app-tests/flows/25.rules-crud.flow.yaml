appId: ${APP_ID}
env:
  ACCOUNT_NAME: Rules Test Account
  CATEGORY_NAME: Rules Test Category
  TAG_NAME: Rules Test Tag
---
- runFlow:
    file: setup/setup-rules-test.flow.yaml

- runFlow:
    file: subflows/navigate-to-rules.flow.yaml

# --- Create Basic Rule (title contains "Netflix" → set category) ---

- tapOn:
    id: 'ActionButton'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.CreateButton'
- waitForAnimationToEnd

- tapOn:
    id: 'RulesPage.CreateButton'
- extendedWaitUntil:
    visible: 'Create Rule'

- tapOn:
    id: 'RuleForm.Condition.0.ValueInput'
- inputText: Netflix

- tapOn: return

- tapOn:
    id: 'RuleForm.Action.0.CategorySelector'

- runFlow:
    file: subflows/shared/select-category-by-search.flow.yaml
    env:
      CATEGORY_NAME: ${CATEGORY_NAME}

- tapOn:
    id: 'RuleForm.Footer.SubmitButton'
- runFlow:
    when:
      visible: 'Apply to existing transactions?'
    commands:
      - tapOn: 'Skip'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.Page'

- assertVisible:
    id: 'RulesPage.RuleCard.0'
- assertVisible:
    id: 'RulesPage.RuleCard.0.Conditions'
- assertVisible:
    id: 'RulesPage.RuleCard.0.Actions'

# --- Edit Rule (change condition value to "Netflix Updated") ---

- tapOn:
    id: 'RulesPage.RuleCard.0'
- extendedWaitUntil:
    visible: 'Edit Rule'

- tapOn:
    id: 'RuleForm.Condition.0.ValueInput'
- eraseText
- inputText: Netflix Updated

- tapOn: return

- tapOn:
    id: 'RuleForm.Footer.SubmitButton'

- extendedWaitUntil:
    visible:
      id: 'RulesPage.RuleCard.0'
    timeout: 5000
- assertVisible:
    id: 'RulesPage.RuleCard.0.Conditions'
- assertVisible:
    id: 'RulesPage.RuleCard.0.Actions'

# --- Toggle Enabled/Disabled ---

- tapOn:
    id: 'RulesPage.RuleCard.0.EnabledSwitch'
- waitForAnimationToEnd

- tapOn:
    id: 'RulesPage.RuleCard.0.EnabledSwitch'
- waitForAnimationToEnd

- runFlow:
    when:
      visible: 'Edit Rule'
    commands:
      - tapOn: 'Cancel'
      - waitForAnimationToEnd

- assertVisible:
    id: 'RulesPage.RuleCard.0'

# --- Delete Rule (swipe-to-delete, verify empty state) ---

- swipe:
    from:
      id: 'RulesPage.RuleCard.0'
    direction: LEFT
    duration: 300
- waitForAnimationToEnd

- tapOn:
    id: DeletableRow.DeleteButton

- tapOn: Delete

- assertVisible:
    id: 'RulesPage.EmptyState'
- assertVisible:
    text: 'No Rules Yet'
- assertVisible:
    text: 'Create rules to automatically categorize and tag your bank transactions'


appId: ${APP_ID}
---

- runFlow: subflows/enter-app.flow.yaml

- runFlow:
    file: subflows/create-account.flow.yaml
    env:
      ACCOUNT_NAME: 'E2E Txn Account'

- runFlow:
    file: subflows/create-account.flow.yaml
    env:
      ACCOUNT_NAME: 'E2E Transfer Account'

# --- Create Transfer ---

- runFlow: subflows/navigate-to-transactions.flow.yaml

- tapOn:
    id: 'ActionButton'
- extendedWaitUntil:
    visible:
      id: 'ActionItem.Transfer'
- waitForAnimationToEnd

- tapOn:
    id: 'ActionItem.Transfer'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'New Transfer'

- tapOn: '5'
- tapOn: '0'

- tapOn:
    id: 'TransferForm.FromAccount'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'AccountPickerBottomSheet.Input'
- tapOn:
    id: 'AccountPickerBottomSheet.Input'
- inputText: 'E2E Txn Account'
- extendedWaitUntil:
    visible:
      id: 'AccountPickerBottomSheet.Option.E2E Txn Account'
- tapOn:
    id: 'AccountPickerBottomSheet.Option.E2E Txn Account'
- extendedWaitUntil:
    notVisible:
      id: 'AccountPickerBottomSheet.Input'

- tapOn:
    id: 'TransferForm.ToAccount'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'AccountPickerBottomSheet.Input'
- tapOn:
    id: 'AccountPickerBottomSheet.Input'
- inputText: 'E2E Transfer Account'
- extendedWaitUntil:
    visible:
      id: 'AccountPickerBottomSheet.Option.E2E Transfer Account'
- tapOn:
    id: 'AccountPickerBottomSheet.Option.E2E Transfer Account'
- extendedWaitUntil:
    notVisible:
      id: 'AccountPickerBottomSheet.Input'

- runFlow:
    file: subflows/enter-comment.flow.yaml
    env:
      COMMENT: 'E2E Test Transfer'

- tapOn:
    id: 'TransactionForm.SubmitButton'

- extendedWaitUntil:
    visible: 'Transactions'

- assertVisible:
    id: 'TransactionCard.Label.E2E_Test_Transfer'

# --- Edit Transfer ---

- tapOn:
    id: 'TransactionCard.Label.E2E_Test_Transfer'
- waitForAnimationToEnd

- runFlow:
    file: subflows/edit-comment.flow.yaml
    env:
      COMMENT: 'E2E Edited Transfer'

- tapOn:
    id: 'TransactionForm.SubmitButton'

- extendedWaitUntil:
    visible: 'Transactions'

- assertVisible:
    id: 'TransactionCard.Label.E2E_Edited_Transfer'

# --- Delete Transfer ---

- tapOn:
    id: 'TransactionCard.Label.E2E_Edited_Transfer'
- waitForAnimationToEnd

- runFlow: subflows/delete-transaction.flow.yaml
- runFlow: subflows/navigate-to-transactions.flow.yaml

- assertNotVisible:
    id: 'TransactionCard.Label.E2E_Edited_Transfer'

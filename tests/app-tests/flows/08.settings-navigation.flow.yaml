appId: ${APP_ID}
---

- runFlow: subflows/enter-app.flow.yaml

- runFlow:
    file: subflows/account/create-basic-account.flow.yaml
    env:
      ACCOUNT_TYPE_ID: 'CreateAccount.BANK'
      ACCOUNT_SCREEN_TITLE: 'Checking Account'
      ACCOUNT_NAME: 'E2E Settings Bank'
      ACCOUNT_AMOUNT: '100'

- runFlow:
    file: subflows/account/create-basic-account.flow.yaml
    env:
      ACCOUNT_TYPE_ID: 'CreateAccount.CASH'
      ACCOUNT_SCREEN_TITLE: 'Savings Account'
      ACCOUNT_NAME: 'E2E Settings Cash'
      ACCOUNT_AMOUNT: '250'

- runFlow: subflows/navigate-to-settings.flow.yaml

- assertVisible:
    id: 'SettingsPage.LanguageValue.en'

- tapOn:
    id: 'SettingsPage.LanguageCard'
- extendedWaitUntil:
    visible:
      id: 'LanguageSelector.SearchInput'
    timeout: 10000
- tapOn:
    id: 'LanguageSelector.SearchInput'
- inputText: 'de'
- tapOn:
    id: 'LanguageSelector.Option.de'
- extendedWaitUntil:
    visible:
      id: 'SettingsPage.LanguageValue.de'
    timeout: 10000

- tapOn:
    id: 'SettingsPage.MainCurrencyCard'
- extendedWaitUntil:
    visible:
      id: 'CurrencySelector.SearchInput'
    timeout: 10000
- tapOn:
    id: 'CurrencySelector.SearchInput'
- inputText: 'GBP'
- tapOn:
    id: 'AccountForm.CurrencyOption.GBP'
- extendedWaitUntil:
    visible:
      id: 'SettingsPage.MainCurrencyValue.GBP'
    timeout: 10000

- scrollUntilVisible:
    element:
      id: 'SettingsPage.DefaultAccountCard'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- assertVisible:
    id: 'SettingsPage.DefaultAccountCard'
- tapOn:
    id: 'SettingsPage.DefaultAccountCard'
- extendedWaitUntil:
    visible:
      id: 'AccountPickerBottomSheet.Input'
    timeout: 10000
- tapOn:
    id: 'AccountPickerBottomSheet.Input'
- inputText: 'E2E Settings Cash'
- tapOn:
    id: 'AccountPickerBottomSheet.Option.E2E Settings Cash'
- extendedWaitUntil:
    visible:
      id: 'SettingsPage.DefaultAccountValue.E2E_Settings_Cash'
    timeout: 10000

- tapOn:
    id: 'TabBar.Transactions'
- extendedWaitUntil:
    visible:
      id: 'TransactionsPage.Container'
    timeout: 10000
- tapOn:
    id: 'ActionButton'
- extendedWaitUntil:
    visible:
      id: 'ActionItem.Expense'
    timeout: 10000
- tapOn:
    id: 'ActionItem.Expense'
- extendedWaitUntil:
    visible:
      id: 'TransactionForm.SelectedAccount.E2E_Settings_Cash'
    timeout: 10000
- assertVisible:
    id: 'TransactionForm.SelectedAccount.E2E_Settings_Cash'

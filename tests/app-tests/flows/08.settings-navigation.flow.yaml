appId: ${APP_ID}
---

- runFlow: subflows/enter-app.flow.yaml

- runFlow:
    file: subflows/import-database-fixture.flow.yaml
    env:
      FIXTURE_ID: '08-settings-navigation'

- runFlow: subflows/navigate-to-settings.flow.yaml

- assertVisible:
    id: 'SettingsPage.LanguageValue.en'

- tapOn:
    id: 'SettingsPage.LanguageCard'
- extendedWaitUntil:
    visible:
      id: 'LanguageSelector.SearchInput'
    timeout: 10000
- tapOn:
    id: 'LanguageSelector.SearchInput'
- inputText: 'de'
- tapOn:
    id: 'LanguageSelector.Option.de'
- extendedWaitUntil:
    visible:
      id: 'SettingsPage.LanguageValue.de'
    timeout: 10000

- tapOn:
    id: 'SettingsPage.MainCurrencyCard'
- extendedWaitUntil:
    visible:
      id: 'CurrencySelector.SearchInput'
    timeout: 10000
- tapOn:
    id: 'CurrencySelector.SearchInput'
- inputText: 'GBP'
- tapOn:
    id: 'AccountForm.CurrencyOption.GBP'
- extendedWaitUntil:
    visible:
      id: 'SettingsPage.MainCurrencyValue.GBP'
    timeout: 10000

- scrollUntilVisible:
    element:
      id: 'SettingsPage.DefaultAccountCard'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- assertVisible:
    id: 'SettingsPage.DefaultAccountCard'
- tapOn:
    id: 'SettingsPage.DefaultAccountCard'
- extendedWaitUntil:
    visible:
      id: 'AccountPickerBottomSheet.Input'
    timeout: 10000
- tapOn:
    id: 'AccountPickerBottomSheet.Input'
- inputText: 'E2E Settings Cash'
- tapOn:
    id: 'AccountPickerBottomSheet.Option.E2E Settings Cash'
- extendedWaitUntil:
    visible:
      id: 'SettingsPage.DefaultAccountValue.E2E_Settings_Cash'
    timeout: 10000

- runFlow: subflows/navigate-to-transactions.flow.yaml

- runFlow: subflows/open-action-menu.flow.yaml

- tapOn:
    id: 'ActionItem.Expense'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'TransactionForm.SelectedAccount.E2E_Settings_Cash'
    timeout: 10000
- assertVisible:
    id: 'TransactionForm.SelectedAccount.E2E_Settings_Cash'

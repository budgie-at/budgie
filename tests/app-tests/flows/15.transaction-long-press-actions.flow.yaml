appId: ${APP_ID}
---
- runFlow:
      file: subflows/import/import-database-from-settings.flow.yaml
      env:
          FIXTURE_ROW_ID_MATCH: '15.db(, db)?'

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.E2E_LongPress_Delete_Txn'
      timeout: 5000

# --- Long-Press Edit from List ---

- runFlow:
      file: subflows/transactions/long-press-edit-transaction.flow.yaml
      env:
          TRANSACTION_CARD_ID: 'TransactionCard.Label.E2E_LongPress_Delete_Txn'

- extendedWaitUntil:
      visible: 'Edit Expense'
      timeout: 5000

- tapOn:
      id: 'PageHeader.BackButton'
- extendedWaitUntil:
      visible:
          id: 'TransactionInfo.Page'
      timeout: 5000
- tapOn:
      id: 'PageHeader.BackButton'
- extendedWaitUntil:
      visible:
          id: 'TransactionsPage.Container'
      timeout: 5000

# --- Long-Press Delete from List ---

- runFlow:
      file: subflows/transactions/long-press-delete-transaction.flow.yaml
      env:
          TRANSACTION_CARD_ID: 'TransactionCard.Label.E2E_LongPress_Delete_Txn'

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- extendedWaitUntil:
      notVisible:
          id: 'TransactionCard.Label.E2E_LongPress_Delete_Txn'
      timeout: 10000

- extendedWaitUntil:
      visible:
          id: 'TabBar.Home'
      timeout: 10000

- tapOn:
      id: 'TabBar.Home'
- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
- assertVisible:
      id: 'HomePage.NetWorthValue.170'

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.E2E_LongPress_Convert_Txn'
      timeout: 5000

# --- Long-Press Convert to Transfer from List ---

- runFlow:
      file: subflows/transactions/long-press-convert-to-transfer.flow.yaml
      env:
          TRANSACTION_CARD_ID: 'TransactionCard.Label.E2E_LongPress_Convert_Txn'

- extendedWaitUntil:
      visible:
          id: 'ConvertToTransfer.Page'

- tapOn:
      id: 'TransferForm.ToAccount'
- extendedWaitUntil:
      visible:
          id: 'AccountPickerBottomSheet.Input'
- runFlow:
      file: subflows/shared/select-account-from-native-picker.flow.yaml
      env:
          ACCOUNT_OPTION_ID: 'AccountPickerBottomSheet.Option.E2E Expense Target'

- tapOn:
      id: 'TransactionForm.SubmitButton'
- runFlow: subflows/transactions/confirm-convert-to-transfer.flow.yaml

- extendedWaitUntil:
      visible:
          id: 'TransactionsPage.Container'
      timeout: 15000

# --- Verify Transfer Created and Balances ---

- assertVisible:
      id: 'TransactionCard.Label.E2E_LongPress_Convert_Txn'
- assertVisible:
      id: 'TransactionCard.FromAccount.E2E_Expense_Source.Label'
- assertVisible:
      id: 'TransactionCard.ToAccount.E2E_Expense_Target.Label'

- tapOn:
      id: 'TabBar.Home'
- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
- assertVisible:
      id: 'HomePage.NetWorthValue.200'
- assertVisible:
      id: 'AccountCard.Balance.E2E_Expense_Source.70'
- assertVisible:
      id: 'AccountCard.Balance.E2E_Expense_Target.130'

# --- Clean Up: Delete Transfer ---

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- tapOn:
      id: 'TransactionCard.Label.E2E_LongPress_Convert_Txn'

- runFlow: subflows/transactions/delete-transaction.flow.yaml
- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- extendedWaitUntil:
      notVisible:
          id: 'TransactionCard.Label.E2E_LongPress_Convert_Txn'
      timeout: 10000

- extendedWaitUntil:
      visible:
          id: 'TabBar.Home'
      timeout: 10000

- tapOn:
      id: 'TabBar.Home'
- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
- assertVisible:
      id: 'HomePage.NetWorthValue.200'
- assertVisible:
      id: 'AccountCard.Balance.E2E_Expense_Source.100'
- assertVisible:
      id: 'AccountCard.Balance.E2E_Expense_Target.100'

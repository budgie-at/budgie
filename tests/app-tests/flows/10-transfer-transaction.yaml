steps:
  - launch: com.vitalyiegorov.budgie.e2e
  - tool: open-url
    args:
      url: budgie://settings?anchor=data
  - tool: gesture-tap
    args:
      x: 0.684
      y: 0.542
  - when:
      visible: &a1
        text: Not Now
    steps:
      - tap: *a1
  - await:
      idle: true
  - when:
      hidden:
        id: SettingsPage.Container
    steps:
      - tool: open-url
        args:
          url: budgie://settings
      - tool: gesture-tap
        args:
          x: 0.684
          y: 0.542
      - await:
          idle: true
      - await:
          visible:
            id: SettingsPage.Container
          timeout: 15000
  - await:
      visible:
        id: SettingsPage.Container
      timeout: 15000
  - echo: Optional scroll probe for {"id":"SettingsPage.ImportDatabaseCard"}
  - when:
      hidden:
        id: SettingsPage.ImportDatabaseCard
    steps:
      - scroll-to:
          target:
            id: SettingsPage.ImportDatabaseCard
          direction: down
      - await:
          idle: true
  - await:
      visible:
        id: SettingsPage.ImportDatabaseCard
      timeout: 5000
  - tap:
      id: SettingsPage.ImportDatabaseCard
  - await:
      idle: true
  - await:
      visible:
        text: Cancel
      timeout: 15000
  - when:
      visible:
        text: Apple Account Verification
    steps:
      - tap:
          text: Not Now
      - await:
          idle: true
  - when:
      visible:
        text: No Results for .*
    steps:
      - when:
          visible: &a2
            text: Clear text
        steps:
          - tap: *a2
      - await:
          idle: true
  - when:
      hidden:
        id: 10.db(, db)?
    steps:
      - when:
          visible:
            id: E2EFixtures, Folder
        steps:
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          visible:
            text: budgie \(E2E\), Actions Menu
        steps:
          - await:
              visible:
                id: E2EFixtures, Folder
              timeout: 3000
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          hidden:
            text: E2EFixtures, Actions Menu
        steps:
          - when:
              hidden:
                text: budgie \(E2E\), Actions Menu
            steps:
              - when:
                  visible: &a3
                    id: BackButton
                steps:
                  - tap: *a3
              - when:
                  visible: &a4
                    id: BackButton
                steps:
                  - tap: *a4
              - when:
                  visible: &a5
                    id: BackButton
                steps:
                  - tap: *a5
              - when:
                  visible: &a6
                    text: Browse
                steps:
                  - tap: *a6
              - await:
                  idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - when:
                      visible:
                        text: On My iPhone
                    steps:
                      - tap:
                          text: On My iPhone
                      - await:
                          idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - scroll-to:
                      target:
                        text: budgie \(E2E\)
                      direction: down
              - await:
                  visible:
                    text: budgie \(E2E\)
                  timeout: 3000
              - tap:
                  text: budgie \(E2E\)
              - await:
                  idle: true
              - await:
                  visible:
                    id: E2EFixtures, Folder
                  timeout: 3000
              - tap:
                  id: E2EFixtures, Folder
              - await:
                  idle: true
  - echo: Optional scroll probe for {"id":"10.db(, db)?"}
  - when:
      hidden:
        id: 10.db(, db)?
    steps:
      - scroll-to:
          target:
            text: 10.db(, db)?
          direction: down
  - await:
      idle: true
  - when:
      visible:
        id: 10.db(, db)?
    steps:
      - tap:
          id: 10.db(, db)?
  - when:
      hidden:
        id: 10.db(, db)?
    steps:
      - when:
          visible: &a7
            text: 10.db(, db)?
        steps:
          - tap: *a7
  - await:
      idle: true
  - when:
      visible:
        text: Continue
    steps:
      - tap:
          text: Continue
      - await:
          idle: true
      - when:
          visible:
            id: 10.db(, db)?
        steps:
          - tap:
              id: 10.db(, db)?
      - when:
          hidden:
            id: 10.db(, db)?
        steps:
          - when:
              visible: &a8
                text: 10.db(, db)?
            steps:
              - tap: *a8
      - await:
          idle: true
  - when:
      visible:
        text: Open
    steps:
      - tap:
          text: Open
  - await:
      visible:
        text: Importing a database will replace all current data.*
      timeout: 3000
  - tap:
      text: Import Database
  - await:
      idle: true
  - await:
      visible:
        id: TabBar.Home
      timeout: 30000
  - tap:
      id: TabBar.Home
  - await:
      visible:
        id: HomePage.TotalBalance
      timeout: 30000
  - tool: open-url
    args:
      url: budgie://transactions
  - tool: gesture-tap
    args:
      x: 0.684
      y: 0.542
  - await:
      idle: true
  - await:
      visible:
        id: TransactionsPage.Container
      timeout: 10000
  - await:
      idle: true
  - echo: Native recovery attempt (migrated from retry, max 1)
  - when:
      hidden:
        id: ActionItem.Transfer.Label
    steps:
      - tap:
          id: ActionButton
  - await:
      visible:
        id: ActionItem.Transfer.Label
      timeout: 3000
  - await:
      idle: true
  - tap:
      id: ActionItem.Transfer.Label
  - await:
      visible:
        text: New Transfer
  - await:
      visible:
        id: TransactionKeypad.Digit.1
  - await:
      idle: true
  - tap:
      id: TransactionForm.SubmitButton
  - assert:
      visible:
        text: New Transfer
  - tap:
      id: TransactionForm.SubmitButton
  - assert:
      visible:
        text: New Transfer
  - tap:
      id: TransactionKeypad.Digit.5
  - tap:
      id: TransactionKeypad.Digit.0
  - tap:
      id: TransferForm.FromAccount
  - await:
      visible:
        id: AccountPickerBottomSheet.Input
  - tap:
      id: AccountPickerBottomSheet.Input
  - tool: keyboard
    args:
      text: E2E Txn Account
  - tap:
      text: Done
  - await:
      idle: true
  - await:
      visible:
        id: AccountPickerBottomSheet.Option.E2E Txn Account
  - tap:
      id: AccountPickerBottomSheet.Option.E2E Txn Account
  - await:
      hidden:
        id: AccountPickerBottomSheet.Input
  - tap:
      id: TransferForm.ToAccount
  - await:
      visible:
        id: AccountPickerBottomSheet.Input
  - tap:
      id: AccountPickerBottomSheet.Input
  - tool: keyboard
    args:
      text: E2E Transfer Account
  - tap:
      text: Done
  - await:
      idle: true
  - await:
      visible:
        id: AccountPickerBottomSheet.Option.E2E Transfer Account
  - tap:
      id: AccountPickerBottomSheet.Option.E2E Transfer Account
  - await:
      hidden:
        id: AccountPickerBottomSheet.Input
  - await:
      visible:
        id: TransactionForm.CommentInput
      timeout: 10000
  - tap:
      id: TransactionForm.CommentInput
  - await:
      visible:
        id: NoteInput.Input
      timeout: 5000
  - tap:
      id: NoteInput.Input
  - tool: keyboard
    args:
      text: E2E Test Transfer
  - tap:
      id: NoteInput.SubmitButton
  - await:
      hidden:
        id: NoteInput.Input
      timeout: 5000
  - await:
      idle: true
  - tap:
      id: TransactionForm.SubmitButton
  - await:
      visible:
        id: TransactionsPage.Container
      timeout: 60000
  - await:
      visible:
        id: TransactionCard.Label.E2E_Test_Transfer
      timeout: 5000
  - tap:
      id: TabBar.Home
  - await:
      visible:
        id: HomePage.TotalBalance
  - assert:
      visible:
        id: HomePage.NetWorthValue.200
  - assert:
      visible:
        id: AccountCard.Balance.E2E_Txn_Account.50
  - assert:
      visible:
        id: AccountCard.Balance.E2E_Transfer_Account.150
  - tool: open-url
    args:
      url: budgie://transactions
  - tool: gesture-tap
    args:
      x: 0.684
      y: 0.542
  - await:
      idle: true
  - await:
      visible:
        id: TransactionsPage.Container
      timeout: 10000
  - tap:
      id: TransactionCard.Label.E2E_Test_Transfer
  - await:
      visible:
        id: TransactionInfo.Page
      timeout: 5000
  - tap:
      id: TransactionInfo.EditButton.Label
  - assert:
      hidden:
        text: ^Set fee$
  - tap:
      id: TransactionActionsMenu.TriggerButton
  - await:
      visible:
        id: TransactionActionsMenu.FeeButton
  - assert:
      visible:
        id: TransactionActionsMenu.DeleteButton
  - tap:
      id: TransactionActionsMenu.FeeButton
  - await:
      visible:
        id: SplitEntryRow.Amount.0
  - assert:
      visible:
        text: Save fee
  - tool: gesture-swipe
    args:
      fromX: 0.5
      fromY: 0.25
      toX: 0.5
      toY: 0.78
      durationMs: 350
      settle: true
  - await:
      hidden:
        id: SplitEntryRow.Amount.0
  - assert:
      visible:
        id: TransferForm.SelectedFromAccount.E2E Txn Account
  - assert:
      visible:
        id: TransferForm.SelectedToAccount.E2E Transfer Account
  - tap:
      id: TransferForm.SwapAccounts
  - assert:
      visible:
        id: TransferForm.SelectedFromAccount.E2E Transfer Account
  - assert:
      visible:
        id: TransferForm.SelectedToAccount.E2E Txn Account
  - long-press:
      id: TransactionKeypad.Backspace
  - tap:
      id: TransactionKeypad.Digit.2
  - tap:
      id: TransactionKeypad.Digit.5
  - tap:
      id: TransactionForm.CommentInput
  - await:
      visible:
        id: NoteInput.Input
      timeout: 5000
  - tap:

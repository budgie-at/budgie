appId: ${APP_ID}
---
- runFlow:
      file: subflows/import/import-database-from-settings.flow.yaml
      env:
          FIXTURE_ROW_ID_MATCH: '19.db(, db)?'

- runFlow: subflows/navigation/navigate-to-settings.flow.yaml

- scrollUntilVisible:
      element:
          id: 'SettingsPage.AutoAssignMccCategorySwitch'
      direction: DOWN
      timeout: 10000

- waitForAnimationToEnd

- assertVisible:
      id: 'SettingsPage.AutoAssignMccCategorySwitch'

- scrollUntilVisible:
      element:
          id: 'CsvPage.ImportCard'
      direction: DOWN
      centerElement: true
      waitToSettleTimeoutMs: 500

- waitForAnimationToEnd

- tapOn:
      id: 'CsvPage.ImportCard'
      retryTapIfNoChange: true

- waitForAnimationToEnd

- runFlow:
      when:
          notVisible: 'Cancel'
      commands:
          - tapOn:
                id: 'CsvPage.ImportCard'
          - waitForAnimationToEnd

- runFlow:
      file: subflows/import/select-file-from-app-provider.flow.yaml
      env:
          FILE_ROW_ID_MATCH: 'e2e-mcc-default-category.*'

- extendedWaitUntil:
      visible:
          id: 'ImportScreen.PresetChip.Budgie'
      timeout: 15000

- tapOn:
      id: 'ImportScreen.PresetChip.Budgie'

- tapOn:
      id: 'CsvPage.StartImportButton'

- tapOn:
      id: 'TabBar.Home'

- extendedWaitUntil:
      visible:
          id: 'TabBar.Home'
      timeout: 10000

- runFlow:
      file: subflows/accounts/open-account-details.flow.yaml
      env:
          ACCOUNT_NAME: 'e2e csv wallet USD'

- scrollUntilVisible:
      element:
          id: 'TransactionCard.Label.E2E_MCC_No_Code'
      direction: DOWN
      timeout: 10000
      speed: 20
      visibilityPercentage: 30
      centerElement: true

- waitForAnimationToEnd

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Category.Other'
      timeout: 3000

- scrollUntilVisible:
      element:
          id: 'TransactionCard.Label.E2E_MCC_Pharmacy'
      direction: DOWN
      timeout: 10000
      speed: 20
      visibilityPercentage: 30
      centerElement: true

- waitForAnimationToEnd

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Category.Health_Medical'
      timeout: 3000

- scrollUntilVisible:
      element:
          id: 'TransactionCard.Label.E2E_MCC_Fuel'
      direction: DOWN
      timeout: 10000
      speed: 20
      visibilityPercentage: 30
      centerElement: true

- waitForAnimationToEnd

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Category.Car_Fuel'
      timeout: 3000

- scrollUntilVisible:
      element:
          id: 'TransactionCard.Label.E2E_MCC_Restaurant'
      direction: DOWN
      timeout: 10000
      speed: 20
      visibilityPercentage: 30
      centerElement: true

- waitForAnimationToEnd

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Category.Restaurants_Cafes'
      timeout: 3000

- scrollUntilVisible:
      element:
          id: 'TransactionCard.Label.E2E_MCC_Groceries'
      direction: DOWN
      timeout: 10000
      speed: 20
      visibilityPercentage: 30
      centerElement: true

- waitForAnimationToEnd

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Category.Groceries'
      timeout: 3000

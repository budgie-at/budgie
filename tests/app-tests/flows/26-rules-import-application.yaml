steps:
  - launch: com.vitalyiegorov.budgie.e2e
  - tool: open-url
    args:
      url: budgie://settings?anchor=data
  - tool: gesture-tap
    args:
      x: 0.684
      y: 0.542
  - when:
      visible: &a1
        text: Not Now
    steps:
      - tap: *a1
  - await:
      idle: true
  - when:
      hidden:
        id: SettingsPage.Container
    steps:
      - tool: open-url
        args:
          url: budgie://settings
      - tool: gesture-tap
        args:
          x: 0.684
          y: 0.542
      - await:
          idle: true
      - await:
          visible:
            id: SettingsPage.Container
          timeout: 15000
  - await:
      visible:
        id: SettingsPage.Container
      timeout: 15000
  - echo: Optional scroll probe for {"id":"SettingsPage.ImportDatabaseCard"}
  - when:
      hidden:
        id: SettingsPage.ImportDatabaseCard
    steps:
      - scroll-to:
          target:
            id: SettingsPage.ImportDatabaseCard
          direction: down
      - await:
          idle: true
  - await:
      visible:
        id: SettingsPage.ImportDatabaseCard
      timeout: 5000
  - tap:
      id: SettingsPage.ImportDatabaseCard
  - await:
      idle: true
  - await:
      visible:
        text: Cancel
      timeout: 15000
  - when:
      visible:
        text: Apple Account Verification
    steps:
      - tap:
          text: Not Now
      - await:
          idle: true
  - when:
      visible:
        text: No Results for .*
    steps:
      - when:
          visible: &a2
            text: Clear text
        steps:
          - tap: *a2
      - await:
          idle: true
  - when:
      hidden:
        id: 25.db
    steps:
      - when:
          visible:
            id: E2EFixtures, Folder
        steps:
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          visible:
            text: budgie \(E2E\), Actions Menu
        steps:
          - await:
              visible:
                id: E2EFixtures, Folder
              timeout: 3000
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          hidden:
            text: E2EFixtures, Actions Menu
        steps:
          - when:
              hidden:
                text: budgie \(E2E\), Actions Menu
            steps:
              - when:
                  visible: &a3
                    id: BackButton
                steps:
                  - tap: *a3
              - when:
                  visible: &a4
                    id: BackButton
                steps:
                  - tap: *a4
              - when:
                  visible: &a5
                    id: BackButton
                steps:
                  - tap: *a5
              - when:
                  visible: &a6
                    text: Browse
                steps:
                  - tap: *a6
              - await:
                  idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - when:
                      visible:
                        text: On My iPhone
                    steps:
                      - tap:
                          text: On My iPhone
                      - await:
                          idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - scroll-to:
                      target:
                        text: budgie \(E2E\)
                      direction: down
              - await:
                  visible:
                    text: budgie \(E2E\)
                  timeout: 3000
              - tap:
                  text: budgie \(E2E\)
              - await:
                  idle: true
              - await:
                  visible:
                    id: E2EFixtures, Folder
                  timeout: 3000
              - tap:
                  id: E2EFixtures, Folder
              - await:
                  idle: true
  - echo: Optional scroll probe for {"id":"25.db"}
  - when:
      hidden:
        id: 25.db
    steps:
      - scroll-to:
          target:
            text: 25.db
          direction: down
  - await:
      idle: true
  - when:
      visible:
        id: 25.db
    steps:
      - tap:
          id: 25.db
  - when:
      hidden:
        id: 25.db
    steps:
      - when:
          visible: &a7
            text: 25.db
        steps:
          - tap: *a7
  - await:
      idle: true
  - when:
      visible:
        text: Continue
    steps:
      - tap:
          text: Continue
      - await:
          idle: true
      - when:
          visible:
            id: 25.db
        steps:
          - tap:
              id: 25.db
      - when:
          hidden:
            id: 25.db
        steps:
          - when:
              visible: &a8
                text: 25.db
            steps:
              - tap: *a8
      - await:
          idle: true
  - when:
      visible:
        text: Open
    steps:
      - tap:
          text: Open
  - await:
      visible:
        text: Importing a database will replace all current data.*
      timeout: 3000
  - tap:
      text: Import Database
  - await:
      idle: true
  - await:
      visible:
        id: TabBar.Home
      timeout: 30000
  - tap:
      id: TabBar.Home
  - await:
      visible:
        id: HomePage.TotalBalance
      timeout: 30000
  - echo: App process stop requested; the following launch performs a clean restart.
  - launch: com.vitalyiegorov.budgie.e2e
  - await:
      visible:
        id: TabBar.Home
      timeout: 30000
  - tool: open-url
    args:
      url: budgie://settings/rules
  - tool: gesture-tap
    args:
      x: 0.684
      y: 0.542
  - await:
      idle: true
  - await:
      visible:
        id: RulesPage.Page
      timeout: 15000
  - tap:
      id: ActionButton
  - await:
      visible:
        id: RulesPage.CreateButton.Label
  - await:
      idle: true
  - tap:
      id: RulesPage.CreateButton.Label
  - await:
      visible:
        text: Create Rule
  - tap:
      id: RuleForm.Condition.0.FieldSelector.Value
  - await:
      idle: true
  - tap:
      id: RuleForm.SelectorCard.COMMENT
  - await:
      idle: true
  - tap:
      id: RuleForm.Condition.0.ValueInput
  - tool: keyboard
    args:
      text: Netflix
  - tap:
      text: Done
  - tap:
      id: RuleForm.Action.0.TypeSelector
  - tap:
      id: RuleForm.SelectorCard.SET_CATEGORY
  - await:
      idle: true
  - scroll-to:
      target:
        id: RuleForm.Action.0.CategorySelector
      direction: down
  - tap:
      id: RuleForm.Action.0.CategorySelector
  - await:
      idle: true
  - await:
      visible:
        id: CategoryPickerBottomSheet.Input
  - tap:
      id: CategoryPickerBottomSheet.Input
  - await:
      idle: true
  - tool: keyboard
    args:
      text: Groceries
  - tap:
      text: Done
  - await:
      visible:
        id: CategoryPickerBottomSheet.Card.Groceries.Label
  - await:
      idle: true
  - tap:
      id: CategoryPickerBottomSheet.Card.Groceries.Label
  - await:
      idle: true
  - await:
      hidden:
        id: CategoryPickerBottomSheet.Input
      timeout: 5000
  - tap:
      id: RuleForm.Footer.SubmitButton
  - when:
      visible:
        text: Apply to existing transactions?
    steps:
      - tap:
          text: Skip
  - await:
      visible:
        id: RulesPage.Page
      timeout: 10000
  - await:
      idle: true
  - assert:
      visible:
        id: RulesPage.RuleCard.0
  - tap:
      id: ActionButton
  - await:
      visible:
        id: RulesPage.CreateButton.Label
  - await:
      idle: true
  - tap:
      id: RulesPage.CreateButton.Label
  - await:
      visible:
        text: Create Rule
  - tap:
      id: RuleForm.Condition.0.FieldSelector.Value
  - await:
      idle: true
  - tap:
      id: RuleForm.SelectorCard.COMMENT
  - await:
      idle: true
  - tap:
      id: RuleForm.Condition.0.ValueInput
  - tool: keyboard
    args:
      text: Starbucks
  - tap:
      text: Done
  - tap:
      id: RuleForm.Action.0.TypeSelector
  - tap:
      id: RuleForm.SelectorCard.ADD_TAG
  - await:
      idle: true
  - tap:
      id: RuleForm.Action.0.TagSelector
  - await:
      idle: true
  - await:
      visible:
        id: TagPickerBottomSheet.Input
  - tap:
      id: TagPickerBottomSheet.Input
  - tool: keyboard
    args:
      text: Subscription
  - tap:
      text: Done
  - await:
      visible:
        id: TagPickerBottomSheet.Card.Subscription
      timeout: 15000
  - await:
      idle: true
  - tap:
      id: TagPickerBottomSheet.Card.Subscription
  - when:
      visible:
        id: TagPickerBottomSheet.Input
    steps:
      - await:
          idle: true
      - tap:
          id: TagPickerBottomSheet.Card.Subscription
  - await:
      hidden:
        id: TagPickerBottomSheet.Input
      timeout: 5000
  - tap:
      id: RuleForm.Footer.SubmitButton
  - when:
      visible:
        text: Apply to existing transactions?
    steps:
      - tap:
          text: Skip
  - await:
      visible:
        id: RulesPage.Page
      timeout: 10000
  - await:
      idle: true
  - assert:
      visible:
        id: RulesPage.RuleCard.1
  - tool: open-url
    args:
      url: budgie://settings/import?fileUri=file:///tmp/budgie-e2e-fixtures/test16-rules-import.csv
  - tool: gesture-tap
    args:
      x: 0.684
      y: 0.542
  - await:
      idle: true
  - await:
      visible:
        id: ImportScreen.PresetChip.Budgie
      timeout: 10000
  - tap:
      text: Budgie
  - await:
      visible:
        text: Preset applied. Adjust columns below if needed.
      timeout: 10000
  - await:
      visible:
        id: CsvPage.StartImportButton.Label
        text: Start Import
      timeout: 10000
  - tap:
      id: CsvPage.StartImportButton.Label
  - await:
      hidden:
        id: ImportScreen.PresetChip.Budgie
      timeout: 60000
  - tool: open-url
    args:
      url: budgie://transactions
  - tool: gesture-tap
    args:
      x: 0.684
      y: 0.542
  - await:
      idle: true
  - await:
      visible:
        id: TransactionsPage.Container
      timeout: 10000
  - tap:
      id: TabBar.Transactions
  - await:
      idle: true
  - await:
      visible:
        id: TransactionCard.Tag.Subscription
      timeout: 10000
  - await:
      visible:
        id: TransactionCard.Category.Groceries
      timeout: 10000
  - tool: open-url
    args:
      url: budgie://settings/rules
  - tool: gesture-tap
    args:
      x: 0.684
      y: 0.542
  - await:
      idle: true
  - await:
      visible:
        id: RulesPage.Page
      timeout: 15000
  - tool: gesture-swipe
    args:
      fromX: 0.82
      fromY: 0.5
      toX: 0.18
      toY: 0.5
      durationMs: 300
      settle: true
  - await:
      idle: true
  - tap:
      id: DeletableRow.DeleteButton
  - tap:
      text: Delete
  - await:
      idle: true
  - tool: gesture-swipe
    args:
      fromX: 0.82
      fromY: 0.5
      toX: 0.18
      toY: 0.5
      durationMs: 300
      settle: true
  - await:
      idle: true
  - tap:
      id: DeletableRow.DeleteButton
  - tap:
      text: Delete
  - assert:
      visible:
        id: RulesPage.EmptyState

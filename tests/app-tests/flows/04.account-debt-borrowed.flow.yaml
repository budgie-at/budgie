appId: ${APP_ID}
---

- runFlow:
    file: subflows/import/import-database-from-settings.flow.yaml
    env:
      FIXTURE_ROW_ID_MATCH: '04.db(, db)?'

- runFlow:
    file: subflows/accounts/create-debt-account.flow.yaml
    env:
      ACCOUNT_NAME: 'E2E Borrowed Account'
      CURRENCY_CODE: 'CHF'
      DEBT_TYPE: 'BORROW'
      TARGET_BALANCE: '800'

- extendedWaitUntil:
    visible: 'You owe'
    timeout: 10000

- assertVisible:
    id: 'AccountCard.E2E Borrowed Account'

- runFlow:
    file: subflows/accounts/open-account-details.flow.yaml
    env:
      ACCOUNT_NAME: 'E2E Borrowed Account'

- assertVisible:
    id: 'AccountDetails.EditButton'

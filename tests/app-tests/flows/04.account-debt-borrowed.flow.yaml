appId: ${APP_ID}
---
- runFlow:
      file: subflows/import/import-database-from-settings.flow.yaml
      env:
          FIXTURE_ROW_ID_MATCH: '04.db(, db)?'

- runFlow:
      file: subflows/accounts/create-debt-account.flow.yaml
      env:
          ACCOUNT_NAME: 'E2E Borrowed Account'
          CURRENCY_CODE: 'CHF'
          CURRENT_BALANCE: '0'
          DEBT_TYPE: 'BORROW'
          TARGET_BALANCE: '800'

- extendedWaitUntil:
      visible: 'You owe'
      timeout: 10000

- assertVisible:
      id: 'DebtAccountCardSummary.SettledLabel.E2E_Borrowed_Account'
- assertVisible:
      id: 'DebtAccountCardSummary.OutstandingAmount.E2E_Borrowed_Account.800'
- assertVisible:
      id: 'DebtAccountCardSummary.PaidAmount.E2E_Borrowed_Account.0'
- assertVisible:
      id: 'DebtAccountCardSummary.TotalAmount.E2E_Borrowed_Account.800'
- assertVisible:
      id: 'DebtAccountCardFooter.Percentage.E2E_Borrowed_Account.0'

- runFlow:
      file: subflows/accounts/exercise-debt-account.flow.yaml
      env:
          ACCOUNT_NAME: 'E2E Borrowed Account'
          CURRENCY_CODE: 'CHF'
          CONTACT_NAME: 'Maestro E2E Contact'
          CONTACT_NAME_ID: 'Maestro_E2E_Contact'
          UPDATED_ACCOUNT_NAME: 'E2E Borrowed CHF'
          RETURN_DAY: '18'
          RETURN_DATE_LABEL: '.*18,.*'
          INCREASE_TO: '300'
          INCREASE_OUTSTANDING: '500'
          DECREASE_TO: '175'
          DECREASE_OUTSTANDING: '625'
          NET_WORTH_WHEN_INCLUDED: '_625'

- runFlow:
      file: subflows/accounts/create-liability-account.flow.yaml
      env:
          ACCOUNT_TYPE_ID: 'CreateAccount.CASH'
          ACCOUNT_NAME: 'E2E Borrowed Funding'
          CURRENCY_CODE: 'CHF'
          ACCOUNT_AMOUNT: '300'

- assertVisible:
      id: 'AccountCard.Balance.E2E_Borrowed_Funding.300'

- runFlow:
      file: subflows/accounts/create-debt-account.flow.yaml
      env:
          ACCOUNT_NAME: 'E2E Borrowed To Cash'
          CURRENCY_CODE: 'CHF'
          CURRENT_BALANCE: '0'
          DEBT_TYPE: 'BORROW'
          TARGET_BALANCE: '200'
          FUNDING_ACCOUNT_NAME: 'E2E Borrowed Funding'
          FUNDING_ACCOUNT_NAME_ID: 'E2E_Borrowed_Funding'

- assertVisible:
      id: 'DebtAccountCardSummary.OutstandingAmount.E2E_Borrowed_To_Cash.200'
- assertVisible:
      id: 'DebtAccountCardSummary.PaidAmount.E2E_Borrowed_To_Cash.0'
- assertVisible:
      id: 'DebtAccountCardSummary.TotalAmount.E2E_Borrowed_To_Cash.200'

- scrollUntilVisible:
      element:
          id: 'AccountCard.Balance.E2E_Borrowed_Funding.500'
      direction: UP
- assertVisible:
      id: 'AccountCard.Balance.E2E_Borrowed_Funding.500'

- runFlow:
      file: subflows/accounts/open-account-details.flow.yaml
      env:
          ACCOUNT_NAME: 'E2E Borrowed Funding'

- assertVisible:
      id: 'TransactionCard.EntryCategoryAmount.Borrowing.200'

- runFlow: subflows/accounts/exit-account-details-to-home.flow.yaml

- runFlow:
      file: subflows/accounts/open-account-details.flow.yaml
      env:
          ACCOUNT_NAME: 'E2E Borrowed To Cash'

- assertVisible:
      id: 'DebtAccountBalance.OutstandingAmount.200'
- assertVisible:
      id: 'DebtAccountBalance.PaidAmount.0'
- assertVisible:
      id: 'DebtAccountBalance.TotalAmount.200'
- assertVisible:
      id: 'TransactionCard.EntryCategoryAmount.Borrowing.200'

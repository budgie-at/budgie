appId: ${APP_ID}
---
- runFlow:
    file: subflows/import/import-database-from-settings.flow.yaml
    env:
      FIXTURE_ROW_ID_MATCH: 'e2e-00-empty-state.db(, db)?'

- runFlow: subflows/navigation/navigate-to-settings.flow.yaml

- scrollUntilVisible:
    element:
      id: 'CsvPage.ImportCard'
    direction: DOWN
    centerElement: true
    waitToSettleTimeoutMs: 500

- waitForAnimationToEnd

- tapOn:
    id: 'CsvPage.ImportCard'

- runFlow:
    file: subflows/import/select-file-from-app-provider.flow.yaml
    env:
      FILE_ROW_ID_MATCH: 'e2e-budgie-import(, csv)?'

- extendedWaitUntil:
    visible:
      id: 'CsvPage.Preset.Budgie'
    timeout: 15000

- tapOn:
    id: 'CsvPage.Preset.Budgie'

- tapOn:
    id: 'CsvPage.StartImportButton'

- extendedWaitUntil:
    visible:
      id: 'HomePage.NetWorthValue.88'
    timeout: 3000

- runFlow: subflows/navigation/navigate-to-settings.flow.yaml

- scrollUntilVisible:
    element:
      id: 'CsvPage.ExportCard'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'CsvPage.ExportCard'

- extendedWaitUntil:
    visible: 'Done'
    timeout: 10000

- tapOn:
    text: 'Done'

- tapOn:
    id: 'TabBar.Home'

- assertVisible:
    id: 'HomePage.NetWorthValue.88'

appId: ${APP_ID}
---
- runFlow:
      file: subflows/import/import-database-from-settings.flow.yaml
      env:
          FIXTURE_ROW_ID_MATCH: '19.db'

- openLink: 'budgie://settings/import?fileUri=${E2E_DB_FIXTURES_URI}/e2e-budgie-import.csv'

- extendedWaitUntil:
      visible:
          id: 'ImportScreen.PresetChip.Budgie'
      timeout: 15000

- tapOn:
      id: 'ImportScreen.PresetChip.Budgie'

- tapOn:
      id: 'CsvPage.StartImportButton.Label'

- tapOn:
      id: 'TabBar.Home'

- extendedWaitUntil:
      visible:
          id: 'HomePage.NetWorthValue.77_5'
      timeout: 10000

- runFlow:
      file: subflows/accounts/open-account-details.flow.yaml
      env:
          ACCOUNT_NAME: 'e2e csv wallet USD'

- scrollUntilVisible:
      element:
          id: 'TransactionCard.Label.E2E_CSV_MCC_Grocery'
      direction: DOWN
      timeout: 10000
      speed: 20
      visibilityPercentage: 30
      centerElement: true

- waitForAnimationToEnd

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Category.Groceries'
      timeout: 3000

- tapOn:
      id: 'PageHeader.BackButton'

- extendedWaitUntil:
      visible:
          id: 'TabBar.Home'
      timeout: 10000

- runFlow: subflows/navigation/navigate-to-settings.flow.yaml

- scrollUntilVisible:
      element:
          id: 'CsvPage.ExportCard'
      direction: DOWN
      centerElement: true
- waitForAnimationToEnd
- tapOn:
      id: 'CsvPage.ExportCard'
      retryTapIfNoChange: true

- waitForAnimationToEnd

- runFlow:
      when:
          notVisible: 'Save to Files'
      commands:
          - tapOn:
                id: 'CsvPage.ExportCard'
          - waitForAnimationToEnd

- extendedWaitUntil:
      visible: 'Save to Files'
      timeout: 15000

- runFlow:
      file: subflows/navigation/relaunch-app-and-wait.flow.yaml
      env:
          DESTINATION_ID: 'TabBar.Home'

- tapOn:
      id: 'TabBar.Home'

- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
      timeout: 10000

# === Re-import with MCC default toggle OFF, assert fallback category ===

- openLink: 'budgie://settings/import?fileUri=${E2E_DB_FIXTURES_URI}/e2e-budgie-import.csv'

- extendedWaitUntil:
      visible:
          id: 'ImportScreen.PresetChip.Budgie'
      timeout: 15000

- tapOn:
      id: 'ImportScreen.PresetChip.Budgie'

- tapOn:
      id: 'CsvPage.StartImportButton.Label'

- tapOn:
      id: 'TabBar.Home'

- extendedWaitUntil:
      visible:
          id: 'HomePage.NetWorthValue.77_5'
      timeout: 10000

- runFlow:
      file: subflows/accounts/open-account-details.flow.yaml
      env:
          ACCOUNT_NAME: 'e2e csv wallet USD'

- assertVisible:
      id: 'UncategorizedTransactionsPill.Button'

- scrollUntilVisible:
      element:
          id: 'TransactionCard.Label.E2E_CSV_MCC_Grocery'
      direction: DOWN
      timeout: 10000
      speed: 20
      visibilityPercentage: 30
      centerElement: true

- waitForAnimationToEnd

- assertNotVisible:
      id: 'TransactionCard.Category.Other'

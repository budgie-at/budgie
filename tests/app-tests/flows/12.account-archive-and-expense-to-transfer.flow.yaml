appId: ${APP_ID}
---

- runFlow:
    file: subflows/import/import-database-from-settings.flow.yaml
    env:
      FIXTURE_ROW_ID_MATCH: 'e2e-17-expense-to-transfer.db(, db)?'

- extendedWaitUntil:
    visible:
      id: 'HomePage.TotalBalance'
    timeout: 10000

# --- Archive And Restore Existing Account ---

- tapOn:
    id: 'AccountCard.E2E Expense Target'
- extendedWaitUntil:
    visible:
      id: 'AccountDetails.EditButton'
    timeout: 10000

- tapOn:
    id: 'AccountDetails.EditButton'
- extendedWaitUntil:
    visible:
      id: 'AccountForm.NameInput'
    timeout: 10000

- scrollUntilVisible:
    element:
      id: 'AccountDetails.ArchiveButton'
    direction: DOWN

- tapOn:
    id: 'AccountDetails.ArchiveButton'
- extendedWaitUntil:
    visible: 'Archive Account?'
    timeout: 10000
- tapOn:
    point: '68%,58%'
- extendedWaitUntil:
    notVisible: 'Archive Account?'
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: 'AccountCard.E2E Expense Target'
    timeout: 10000

- runFlow: subflows/accounts/open-archived-accounts.flow.yaml

- extendedWaitUntil:
    visible:
      id: 'ArchivedAccountCard.RestoreButton.E2E Expense Target'
    timeout: 10000

- tapOn:
    id: 'ArchivedAccountCard.RestoreButton.E2E Expense Target'
- extendedWaitUntil:
    visible: 'Restore Account?'
    timeout: 10000
- tapOn:
    point: '68%,58%'
- extendedWaitUntil:
    notVisible: 'Restore Account?'
    timeout: 10000

- tapOn:
    id: 'TabBar.Home'
- extendedWaitUntil:
    visible:
      id: 'HomePage.TotalBalance'
    timeout: 10000
- assertVisible:
    id: 'AccountCard.E2E Expense Target'

# --- Convert Expense To Transfer ---

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- runFlow:
    file: subflows/transactions/open-transaction-form.flow.yaml
    env:
      ACTION_ITEM_ID: 'ActionItem.Expense'
      FORM_TITLE: 'New Expense'

- tapOn: '3'
- tapOn: '0'

- runFlow:
    file: subflows/transactions/select-account.flow.yaml
    env:
      ACCOUNT_NAME: 'E2E Expense Source'

- runFlow:
    file: subflows/categories/create-category-from-transaction.flow.yaml
    env:
      CATEGORY_NAME: 'E2E Convert Category'

- runFlow:
    file: subflows/transactions/enter-comment.flow.yaml
    env:
      COMMENT: 'E2E Convert Expense'

- runFlow: subflows/transactions/submit-transaction-and-wait.flow.yaml

- extendedWaitUntil:
    visible:
      id: 'TransactionCard.Label.E2E_Convert_Expense'
    timeout: 5000

- tapOn:
    id: 'TabBar.Home'
- extendedWaitUntil:
    visible:
      id: 'HomePage.TotalBalance'
- assertVisible:
    id: 'HomePage.NetWorthValue.170'
- assertVisible:
    id: 'AccountCard.Balance.E2E_Expense_Source.70'
- assertVisible:
    id: 'AccountCard.Balance.E2E_Expense_Target.100'

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- tapOn:
    id: 'TransactionCard.Label.E2E_Convert_Expense'

- tapOn:
    point: '80%,8%'
- extendedWaitUntil:
    visible:
      id: 'TransactionActionsMenu.ConvertToTransferButton'
- tapOn:
    id: 'TransactionActionsMenu.ConvertToTransferButton'

- extendedWaitUntil:
    visible:
      id: 'ConvertToTransfer.Page'

- tapOn:
    id: 'TransferForm.ToAccount'
- extendedWaitUntil:
    visible:
      id: 'AccountPickerBottomSheet.Input'
- tapOn:
    id: 'AccountPickerBottomSheet.Input'
- inputText: 'E2E Expense Target'
- extendedWaitUntil:
    visible:
      id: 'AccountPickerBottomSheet.Option.E2E Expense Target'
- tapOn:
    id: 'AccountPickerBottomSheet.Option.E2E Expense Target'
- extendedWaitUntil:
    notVisible:
      id: 'AccountPickerBottomSheet.Input'

- tapOn:
    id: 'TransactionForm.SubmitButton'
- runFlow: subflows/transactions/confirm-convert-to-transfer.flow.yaml

- extendedWaitUntil:
    visible: 'Edit Transfer'

- tapOn:
    id: 'PageHeader.BackButton'

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- assertVisible:
    id: 'TransactionCard.Label.E2E_Convert_Expense'
- assertVisible:
    id: 'TransactionCard.FromAccount.E2E_Expense_Source'
- assertVisible:
    id: 'TransactionCard.ToAccount.E2E_Expense_Target'

- tapOn:
    id: 'TabBar.Home'
- extendedWaitUntil:
    visible:
      id: 'HomePage.TotalBalance'
- assertVisible:
    id: 'HomePage.NetWorthValue.200'
- assertVisible:
    id: 'AccountCard.Balance.E2E_Expense_Source.70'
- assertVisible:
    id: 'AccountCard.Balance.E2E_Expense_Target.130'

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- tapOn:
    id: 'TransactionCard.Label.E2E_Convert_Expense'

- runFlow: subflows/transactions/delete-transaction.flow.yaml
- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- assertNotVisible:
    id: 'TransactionCard.Label.E2E_Convert_Expense'

- tapOn:
    id: 'TabBar.Home'
- extendedWaitUntil:
    visible:
      id: 'HomePage.TotalBalance'
- assertVisible:
    id: 'HomePage.NetWorthValue.200'
- assertVisible:
    id: 'AccountCard.Balance.E2E_Expense_Source.100'
- assertVisible:
    id: 'AccountCard.Balance.E2E_Expense_Target.100'

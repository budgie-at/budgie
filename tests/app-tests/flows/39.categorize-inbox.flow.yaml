appId: ${APP_ID}
---
- runFlow:
      file: subflows/import/import-database-from-settings.flow.yaml
      env:
          FIXTURE_ROW_ID_MATCH: 'uncategorized-inbox.db(, db)?'
          FILE_PICKER_SEARCH_TEXT: 'uncategorized-inbox'

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- extendedWaitUntil:
      visible:
          id: 'UncategorizedTransactionsPill.Button'
      timeout: 5000
- assertVisible: '3 missing categories'
- tapOn:
      id: 'UncategorizedTransactionsPill.Button'
- extendedWaitUntil:
      visible:
          id: 'CategorizeInboxPage.ShowListButton'
      timeout: 5000

- assertVisible: '3 left.*'
- assertVisible:
      id: 'CategorizeInboxPanel.Progress'
- assertVisible:
      id: 'CategorizeInboxClusterCard.EXPENSE\|confident coffee'
- assertVisible:
      id: 'CategorizeInboxAcceptAllButton.Button'

- tapOn:
      id: 'CategorizeInboxAcceptAllButton.Button'
- extendedWaitUntil:
      visible:
          id: 'CategorizeInboxUndoBar'
      timeout: 5000
- assertVisible: '1 left.*'
- assertVisible: '1 left · 2 done'
- assertNotVisible:
      id: 'CategorizeInboxClusterCard.EXPENSE\|confident coffee'

- tapOn:
      id: 'CategorizeInboxUndoBar.UndoButton'
- assertVisible: '3 left.*'
- assertVisible:
      id: 'CategorizeInboxClusterCard.EXPENSE\|confident coffee'
- assertVisible:
      id: 'CategorizeInboxAcceptAllButton.Button'

- tapOn:
      id: 'CategorizeInboxOneOffRow.Open.EXPENSE\|categorize filler'
- extendedWaitUntil:
      visible:
          id: 'TransactionInfo.Page'
      timeout: 5000
- tapOn:
      id: 'PageHeader.BackButton'
- extendedWaitUntil:
      visible:
          id: 'CategorizeInboxPage.ShowListButton'
      timeout: 5000

- tapOn:
      id: 'CategorizeInboxClusterCard.Toggle.EXPENSE\|confident coffee'
- extendedWaitUntil:
      visible:
          id: 'CategorizeInboxClusterRow.Open.3'
      timeout: 5000
- tapOn:
      id: 'CategorizeInboxClusterRow.Open.3'
- extendedWaitUntil:
      visible:
          id: 'TransactionInfo.Page'
      timeout: 5000
- tapOn:
      id: 'PageHeader.BackButton'
- extendedWaitUntil:
      visible:
          id: 'CategorizeInboxPage.ShowListButton'
      timeout: 5000

- tapOn:
      id: 'CategorizeInboxSuggestionChip.EXPENSE\|confident coffee.0'
- assertVisible: '1 left.*'
- assertNotVisible:
      id: 'CategorizeInboxClusterCard.EXPENSE\|confident coffee'

- tapOn:
      id: 'CategorizeInboxUndoBar.FollowUpButton'
- extendedWaitUntil:
      visible:
          id: 'TagPickerBottomSheet.Card.E2E Coffee Tag'
      timeout: 5000
- tapOn:
      id: 'tags-selector-modal-done-button'
- extendedWaitUntil:
      notVisible:
          id: 'TagPickerBottomSheet.Card.E2E Coffee Tag'
      timeout: 5000
- extendedWaitUntil:
      visible:
          id: 'CategorizeInboxUndoBar.FollowUpButton'
          enabled: false
      timeout: 5000

- tapOn:
      id: 'CategorizeInboxUndoBar.RuleButton'
- extendedWaitUntil:
      visible:
          id: 'RuleForm.Action.0.CategorySelector.Value'
          text: 'Restaurants & Cafes'
      timeout: 5000
- assertVisible:
      id: 'RuleForm.Action.1.TagSelector.Value'
      text: 'E2E Coffee Tag'
- tapOn:
      id: 'PageHeader.BackButton'
- extendedWaitUntil:
      notVisible:
          id: 'RuleForm.Footer.SubmitButton'
      timeout: 5000
- assertVisible:
      id: 'CategorizeInboxUndoBar'

- tapOn:
      id: 'CategorizeInboxPage.ShowListButton'
- extendedWaitUntil:
      visible: 'Missing categories'
      timeout: 5000
- assertVisible:
      id: 'TransactionCard.Label.E2E_Categorize_Filler'
- assertNotVisible:
      id: 'TransactionCard.Label.E2E_Confident_Coffee'

- tapOn:
      id: 'PageHeader.BackButton'
- extendedWaitUntil:
      visible:
          id: 'CategorizeInboxPage.ShowListButton'
      timeout: 5000
- assertVisible: '1 left.*'

- tapOn:
      id: 'PageHeader.BackButton'
- tapOn:
      id: 'TabBar.Analytics'
- extendedWaitUntil:
      visible:
          id: 'AnalyticsPage.Container'
      timeout: 5000
- tapOn:
      id: 'TransactionFilters.DateChipActive'
- tapOn:
      id: 'TransactionFilters.DatePeriod.ALL_TIME'
- tapOn:
      id: 'TransactionFilters.DateApplyButton'

- tapOn:
      id: 'CategoryStatisticsCard.Uncategorized'
- extendedWaitUntil:
      visible:
          id: 'CategorizeInboxPage.ShowListButton'
      timeout: 5000
- assertVisible: '1 left.*'
- tapOn:
      id: 'PageHeader.BackButton'
- extendedWaitUntil:
      visible:
          id: 'AnalyticsPage.Container'
      timeout: 5000

- tapOn:
      id: 'AnalyticsPage.Tab.Tags'
- tapOn:
      id: 'TagStatisticsCard.Untagged'
- extendedWaitUntil:
      visible:
          id: 'CategorizeInboxPage.ShowListButton'
      timeout: 5000
- assertVisible: '3 left.*'
- assertVisible:
      id: 'CategorizeInboxClusterCard.EXPENSE\|tagged grocer'
- assertNotVisible:
      id: 'CategorizeInboxClusterCard.EXPENSE\|confident coffee'

- tapOn:
      id: 'CategorizeInboxAcceptAllButton.Button'
- extendedWaitUntil:
      visible:
          id: 'CategorizeInboxUndoBar'
      timeout: 5000
- assertVisible: '1 left · 2 done'
- assertNotVisible:
      id: 'CategorizeInboxClusterCard.EXPENSE\|tagged grocer'

- tapOn:
      id: 'CategorizeInboxUndoBar.UndoButton'
- assertVisible: '3 left.*'
- tapOn:
      id: 'CategorizeInboxSuggestionChip.EXPENSE\|tagged grocer.0'
- assertVisible: '1 left.*'

- tapOn:
      id: 'CategorizeInboxUndoBar.RuleButton'
- extendedWaitUntil:
      visible:
          id: 'RuleForm.Action.0.CategorySelector.Value'
          text: 'Groceries'
      timeout: 5000
- assertVisible:
      id: 'RuleForm.Action.1.TagSelector.Value'
      text: 'E2E Grocer Tag'
- tapOn:
      id: 'PageHeader.BackButton'
- extendedWaitUntil:
      notVisible:
          id: 'RuleForm.Footer.SubmitButton'
      timeout: 5000
- assertVisible:
      id: 'CategorizeInboxUndoBar'

- tapOn:
      id: 'CategorizeInboxPage.ShowListButton'
- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.E2E_Categorize_Filler'
      timeout: 5000
- assertNotVisible:
      id: 'TransactionCard.Label.E2E_Tagged_Grocer'

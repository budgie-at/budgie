appId: ${APP_ID}
---
- runFlow:
      file: subflows/import/import-database-from-settings.flow.yaml
      env:
          FIXTURE_ROW_ID_MATCH: '10.db'

# --- Create Transfer ---

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- runFlow:
      file: subflows/transactions/open-transaction-form.flow.yaml
      env:
          ACTION_ITEM_ID: 'ActionItem.Transfer'
          FORM_TITLE: 'New Transfer'

- tapOn:
      id: 'TransactionForm.SubmitButton'
- assertVisible: 'New Transfer'

- tapOn:
      id: 'TransactionForm.SubmitButton'
- assertVisible: 'New Transfer'

- tapOn:
      id: 'TransactionKeypad.Digit.5'
- tapOn:
      id: 'TransactionKeypad.Digit.0'

- tapOn:
      id: 'TransferForm.FromAccount'
- extendedWaitUntil:
      visible:
          id: 'AccountPickerBottomSheet.Input'
- tapOn:
      id: 'AccountPickerBottomSheet.Input'
- inputText: 'E2E Txn Account'
- tapOn: Done
- waitForAnimationToEnd
- extendedWaitUntil:
      visible:
          id: 'AccountPickerBottomSheet.Option.E2E Txn Account'
- tapOn:
      id: 'AccountPickerBottomSheet.Option.E2E Txn Account'
- extendedWaitUntil:
      notVisible:
          id: 'AccountPickerBottomSheet.Input'

- tapOn:
      id: 'TransferForm.ToAccount'
- extendedWaitUntil:
      visible:
          id: 'AccountPickerBottomSheet.Input'
- tapOn:
      id: 'AccountPickerBottomSheet.Input'
- inputText: 'E2E Transfer Account'
- tapOn: Done
- waitForAnimationToEnd
- extendedWaitUntil:
      visible:
          id: 'AccountPickerBottomSheet.Option.E2E Transfer Account'
- tapOn:
      id: 'AccountPickerBottomSheet.Option.E2E Transfer Account'
- extendedWaitUntil:
      notVisible:
          id: 'AccountPickerBottomSheet.Input'

- runFlow:
      file: subflows/transactions/enter-comment.flow.yaml
      env:
          COMMENT: 'E2E Test Transfer'

- runFlow: subflows/transactions/submit-transaction-and-wait.flow.yaml

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.E2E_Test_Transfer'
      timeout: 5000

- tapOn:
      id: 'TabBar.Home'
- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
- assertVisible:
      id: 'HomePage.NetWorthValue.200'
- assertVisible:
      id: 'AccountCard.Balance.E2E_Txn_Account.50'
- assertVisible:
      id: 'AccountCard.Balance.E2E_Transfer_Account.150'

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

# --- Edit Transfer ---

- tapOn:
      id: 'TransactionCard.Label.E2E_Test_Transfer'
- extendedWaitUntil:
      visible:
          id: 'TransactionInfo.Page'
      timeout: 5000
- tapOn:
      id: 'TransactionInfo.EditButton.Label'

- assertVisible:
      id: 'TransferForm.SelectedFromAccount.E2E Txn Account'
- assertVisible:
      id: 'TransferForm.SelectedToAccount.E2E Transfer Account'
- tapOn:
      id: 'TransferForm.SwapAccounts'
- assertVisible:
      id: 'TransferForm.SelectedFromAccount.E2E Transfer Account'
- assertVisible:
      id: 'TransferForm.SelectedToAccount.E2E Txn Account'

- longPressOn:
      id: 'TransactionKeypad.Backspace'
- tapOn:
      id: 'TransactionKeypad.Digit.2'
- tapOn:
      id: 'TransactionKeypad.Digit.5'

- runFlow:
      file: subflows/transactions/edit-comment.flow.yaml
      env:
          COMMENT: 'E2E Edited Transfer'

- tapOn:
      id: 'TransactionForm.SubmitButton'
- extendedWaitUntil:
      visible:
          id: 'TransactionInfo.Page'
      timeout: 3000
- tapOn:
      id: 'PageHeader.BackButton'

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.E2E_Edited_Transfer'
      timeout: 5000
- assertVisible:
      id: 'TransactionCard.FromAccount.E2E_Transfer_Account.Label'
- assertVisible:
      id: 'TransactionCard.ToAccount.E2E_Txn_Account.Label'

- tapOn:
      id: 'TabBar.Home'
- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
- assertVisible:
      id: 'HomePage.NetWorthValue.200'
- assertVisible:
      id: 'AccountCard.Balance.E2E_Txn_Account.125'
- assertVisible:
      id: 'AccountCard.Balance.E2E_Transfer_Account.75'

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

# --- Delete Transfer ---

- tapOn:
      id: 'TransactionCard.Label.E2E_Edited_Transfer'
- extendedWaitUntil:
      visible:
          id: 'TransactionInfo.Page'
      timeout: 5000

- runFlow: subflows/transactions/delete-transaction.flow.yaml
- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- assertNotVisible:
      id: 'TransactionCard.Label.E2E_Edited_Transfer'

- tapOn:
      id: 'TabBar.Home'
- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
- assertVisible:
      id: 'HomePage.NetWorthValue.200'
- assertVisible:
      id: 'AccountCard.Balance.E2E_Txn_Account.100'
- assertVisible:
      id: 'AccountCard.Balance.E2E_Transfer_Account.100'

steps:
  - launch: com.vitalyiegorov.budgie.e2e
  - tool: open-url
    args:
      url: budgie://settings?anchor=data
  - tap:
      text: Not Now
  - await:
      idle: true
  - when:
      hidden:
        id: SettingsPage.Container
    steps:
      - tool: open-url
        args:
          url: budgie://settings
      - await:
          idle: true
      - await:
          visible:
            id: SettingsPage.Container
          timeout: 15000
  - await:
      visible:
        id: SettingsPage.Container
      timeout: 15000
  - scroll-to:
      target:
        id: SettingsPage.ImportDatabaseCard
      direction: up
  - when:
      hidden:
        id: SettingsPage.ImportDatabaseCard
    steps:
      - scroll-to:
          target:
            id: SettingsPage.ImportDatabaseCard
          direction: down
      - await:
          idle: true
  - await:
      visible:
        id: SettingsPage.ImportDatabaseCard
      timeout: 5000
  - tap:
      id: SettingsPage.ImportDatabaseCard
  - await:
      idle: true
  - await:
      visible:
        text: Cancel
      timeout: 15000
  - when:
      visible:
        text: Apple Account Verification
    steps:
      - tap:
          text: Not Now
      - await:
          idle: true
  - when:
      visible:
        text: No Results for .*
    steps:
      - tap:
          text: Clear text
      - await:
          idle: true
  - when:
      hidden:
        id: 06.db
    steps:
      - when:
          visible:
            id: E2EFixtures, Folder
        steps:
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          visible:
            text: budgie \(E2E\), Actions Menu
        steps:
          - await:
              visible:
                id: E2EFixtures, Folder
              timeout: 3000
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          hidden:
            text: E2EFixtures, Actions Menu
        steps:
          - when:
              hidden:
                text: budgie \(E2E\), Actions Menu
            steps:
              - tap:
                  id: BackButton
              - tap:
                  id: BackButton
              - tap:
                  id: BackButton
              - tap:
                  text: Browse
              - await:
                  idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - when:
                      visible:
                        text: On My iPhone
                    steps:
                      - tap:
                          text: On My iPhone
                      - await:
                          idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - scroll-to:
                      target:
                        text: budgie \(E2E\)
                      direction: down
              - await:
                  visible:
                    text: budgie \(E2E\)
                  timeout: 3000
              - tap:
                  text: budgie \(E2E\)
              - await:
                  idle: true
              - await:
                  visible:
                    id: E2EFixtures, Folder
                  timeout: 3000
              - tap:
                  id: E2EFixtures, Folder
              - await:
                  idle: true
  - scroll-to:
      target:
        id: 06.db
      direction: down
  - when:
      hidden:
        id: 06.db
    steps:
      - scroll-to:
          target:
            text: 06.db
          direction: down
  - await:
      idle: true
  - when:
      visible:
        id: 06.db
    steps:
      - tap:
          id: 06.db
  - when:
      hidden:
        id: 06.db
    steps:
      - tap:
          text: 06.db
  - await:
      idle: true
  - when:
      visible:
        text: Continue
    steps:
      - tap:
          text: Continue
      - await:
          idle: true
      - when:
          visible:
            id: 06.db
        steps:
          - tap:
              id: 06.db
      - when:
          hidden:
            id: 06.db
        steps:
          - tap:
              text: 06.db
      - await:
          idle: true
  - when:
      visible:
        text: Open
    steps:
      - tap:
          text: Open
  - await:
      visible:
        text: Importing a database will replace all current data.*
      timeout: 3000
  - tap:
      text: Import Database
  - await:
      idle: true
  - await:
      visible:
        id: TabBar.Home
      timeout: 30000
  - tap:
      id: TabBar.Home
  - await:
      visible:
        id: HomePage.TotalBalance
      timeout: 30000
  - tool: open-url
    args:
      url: budgie://settings
  - await:
      idle: true
  - await:
      visible:
        id: SettingsPage.Container
      timeout: 15000
  - scroll-to:
      target:
        id: SettingsPage.ManageTagsCard
      direction: up
  - when:
      hidden:
        id: SettingsPage.ManageTagsCard
    steps:
      - scroll-to:
          target:
            id: SettingsPage.ManageTagsCard
          direction: down
  - await:
      idle: true
  - await:
      visible:
        id: SettingsPage.ManageTagsCard
      timeout: 3000
  - tap:
      id: SettingsPage.ManageTagsCard
  - await:
      visible:
        id: TagPage.SearchInput
      timeout: 3000
  - tap:
      id: ActionButton
  - tap:
      text: Tag
  - tap:
      id: TagForm.Input
  - tool: keyboard
    args:
      text: E2E Tag Primary
  - tool: keyboard
    args:
      key: enter
  - await:
      idle: true
  - tap:
      id: TagForm.Submit
  - assert:
      visible:
        id: TagCard.E2E Tag Primary
  - tap:
      id: ActionButton
  - tap:
      text: Tag
  - tap:
      id: TagForm.Input
  - tool: keyboard
    args:
      text: E2E Tag Search
  - tool: keyboard
    args:
      key: enter
  - await:
      idle: true
  - tap:
      id: TagForm.Submit
  - assert:
      visible:
        id: TagCard.E2E Tag Search
  - tap:
      id: TagPage.SearchInput
  - tool: keyboard
    args:
      text: Search
  - assert:
      visible:
        id: TagCard.E2E Tag Search
  - assert:
      hidden:
        id: TagCard.E2E Tag Primary
  - tap:
      id: TagCard.E2E Tag Search
  - assert:
      visible:
        text: E2E Tag Search.*
  - tap:
      id: TagForm.Merge
  - tap:
      id: TagPickerBottomSheet.Input
  - tool: keyboard
    args:
      text: Primary
  - await:
      visible:
        id: TagPickerBottomSheet.Card.E2E Tag Primary
      timeout: 10000
  - tap:
      id: TagPickerBottomSheet.Card.E2E Tag Primary
  - assert:

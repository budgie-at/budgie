appId: ${APP_ID}
env:
    FIXTURE_ROW_ID_MATCH: '38-onboarding.db'
---
- launchApp:
      stopApp: true

- extendedWaitUntil:
      visible:
          id: 'OnboardingWelcome.StartButton'
      timeout: 30000

- tapOn:
      id: 'OnboardingWelcome.StartButton'

- extendedWaitUntil:
      visible:
          id: 'OnboardingKey.PinOption'
      timeout: 3000

- tapOn:
      id: 'OnboardingKey.PinOption'

- extendedWaitUntil:
      visible:
          id: 'PinPage.Digit.1'
      timeout: 3000

- tapOn:
      id: 'PinPage.Digit.1'
- tapOn:
      id: 'PinPage.Digit.2'
- tapOn:
      id: 'PinPage.Digit.3'
- tapOn:
      id: 'PinPage.Digit.4'
- tapOn:
      id: 'PinPage.Digit.1'
- tapOn:
      id: 'PinPage.Digit.2'
- tapOn:
      id: 'PinPage.Digit.3'
- tapOn:
      id: 'PinPage.Digit.4'

- extendedWaitUntil:
      visible:
          id: 'OnboardingSeal.HoldButton'
      timeout: 3000

- longPressOn:
      id: 'OnboardingSeal.HoldButton'

- extendedWaitUntil:
      visible:
          id: 'OnboardingSealedMoment.ContinueButton'
      timeout: 30000

- tapOn:
      id: 'OnboardingSealedMoment.ContinueButton'

- extendedWaitUntil:
      visible:
          id: 'OnboardingReceipt.GoToBudgieButton'
      timeout: 3000

- tapOn:
      id: 'OnboardingReceipt.GoToBudgieButton'

- extendedWaitUntil:
      visible:
          id: 'AccountsEmptyState.AddAccountButton'
      timeout: 30000

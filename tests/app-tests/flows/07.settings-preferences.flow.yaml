appId: ${APP_ID}
---

- runFlow:
      file: subflows/import/import-database-from-settings.flow.yaml
      env:
          FIXTURE_ROW_ID_MATCH: '07.db(, db)?'

- openLink: 'budgie://settings?anchor=general'

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'SettingsPage.LanguageCard'
    timeout: 10000

- assertVisible:
    id: 'SettingsPage.LanguageValue.en'

- runFlow:
    file: subflows/navigation/open-settings-card.flow.yaml
    env:
      CARD_ID: 'SettingsPage.LanguageCard'
      DESTINATION_ID: 'LanguageSelector.SearchInput'
- tapOn:
    id: 'LanguageSelector.SearchInput'
- inputText: 'de'
- tapOn:
    id: 'LanguageSelector.Option.de'
- extendedWaitUntil:
    visible:
      id: 'SettingsPage.LanguageValue.de'
    timeout: 10000

- runFlow:
    file: subflows/navigation/open-settings-card.flow.yaml
    env:
      CARD_ID: 'SettingsPage.LanguageCard'
      DESTINATION_ID: 'LanguageSelector.SearchInput'
- tapOn:
    id: 'LanguageSelector.SearchInput'
- inputText: 'en'
- tapOn:
    id: 'LanguageSelector.Option.en'
- extendedWaitUntil:
    visible:
      id: 'SettingsPage.LanguageValue.en'
    timeout: 10000

- runFlow:
    file: subflows/navigation/open-settings-card.flow.yaml
    env:
      CARD_ID: 'SettingsPage.MainCurrencyCard'
      DESTINATION_ID: 'CurrencySelector.SearchInput'
- tapOn:
    id: 'CurrencySelector.SearchInput'
- inputText: 'GBP'
- tapOn:
    id: 'AccountForm.CurrencyOption.GBP'
- extendedWaitUntil:
    notVisible:
      id: 'CurrencySelector.SearchInput'
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: 'SettingsPage.MainCurrencyValue.GBP'
    timeout: 3000

- runFlow:
    file: subflows/navigation/open-settings-card.flow.yaml
    env:
      CARD_ID: 'SettingsPage.DefaultAccountCard'
      DESTINATION_ID: 'AccountPickerBottomSheet.Input'
- tapOn:
    id: 'AccountPickerBottomSheet.Input'
- inputText: 'E2E Settings Cash'
- tapOn:
    id: 'AccountPickerBottomSheet.Option.E2E Settings Cash'
- extendedWaitUntil:
    visible:
      id: 'SettingsPage.DefaultAccountValue.E2E_Settings_Cash'
    timeout: 10000

- scrollUntilVisible:
    element:
      id: 'SettingsPage.DarkModeCard'
    direction: DOWN
    centerElement: true
- assertVisible:
    id: 'SettingsPage.DarkModeCard'
- tapOn:
    id: 'SettingsPage.DarkModeCard'
- waitForAnimationToEnd
- tapOn:
    id: 'SettingsPage.DarkModeCard'
- waitForAnimationToEnd

- assertVisible:
    id: 'SettingsPage.ShowCentsSwitch'
- tapOn:
    id: 'SettingsPage.ShowCentsSwitch'
- waitForAnimationToEnd

- tapOn:
    id: 'TabBar.Home'
- extendedWaitUntil:
    visible:
      id: 'AccountCard.Balance.E2E_Settings_Bank.100_00'
    timeout: 10000
- assertVisible:
    id: 'AccountCard.Balance.E2E_Settings_Cash.250_00'

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml
- assertVisible: '.*\$100\.00.*'
- assertVisible: '.*\$250\.00.*'

- openLink: 'budgie://settings?anchor=appearance'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'SettingsPage.ShowCentsSwitch'
    timeout: 10000
- tapOn:
    id: 'SettingsPage.ShowCentsSwitch'
- waitForAnimationToEnd

- tapOn:
    id: 'TabBar.Home'
- extendedWaitUntil:
    visible:
      id: 'AccountCard.Balance.E2E_Settings_Bank.100'
    timeout: 10000
- assertVisible:
    id: 'AccountCard.Balance.E2E_Settings_Cash.250'

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- runFlow: subflows/transactions/open-action-menu.flow.yaml

- tapOn:
    id: 'ActionItem.Expense'
- extendedWaitUntil:
    visible:
      id: 'TransactionForm.SelectedAccount.E2E_Settings_Cash'
    timeout: 10000

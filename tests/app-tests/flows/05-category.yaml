    args:
      text: Search
  - assert:
      visible:
        id: CategoryCard.E2E Category Search
  - assert:
      hidden:
        id: CategoryCard.E2E Category Primary
  - tap:
      id: CategoryCard.E2E Category Search
  - assert:
      visible:
        text: E2E Category Search.*
  - tap:
      id: CategoryForm.Merge
  - await:
      visible:
        id: CategoryPickerBottomSheet.Input
      timeout: 10000
  - tap:
      id: CategoryPickerBottomSheet.Input
  - tool: keyboard
    args:
      text: Primary
  - tool: keyboard
    args:
      key: enter
  - await:
      idle: true
  - tap:
      id: CategoryPickerBottomSheet.Card.E2E Category Primary.Label
  - await:
      hidden:
        id: CategoryPickerBottomSheet.Input
  - assert:
      hidden:
        id: CategoryCard.E2E Category Search
  - tap:
      id: CategoryPage.SearchInput

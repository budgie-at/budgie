- assertVisible:
      id: 'DebtAccountCardSummary.OutstandingAmount.E2E_Lent_Debt.13391'
- assertVisible:
      id: 'DebtAccountCardSummary.PaidAmount.E2E_Lent_Debt.2109'
- assertVisible:
      id: 'DebtAccountCardSummary.TotalAmount.E2E_Lent_Debt.15500'

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- runFlow:
      file: subflows/transactions/open-transaction-form.flow.yaml
      env:
          ACTION_ITEM_ID: 'ActionItem.Expense'
          FORM_TITLE: 'New Expense'

- tapOn:

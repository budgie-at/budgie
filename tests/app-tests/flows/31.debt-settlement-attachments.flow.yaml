      env:
          FIXTURE_ROW_ID_MATCH: '31-debt.db'

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.E2E_Debt_Attach_Expense'
      timeout: 5000

- longPressOn:
      id: 'TransactionCard.Label.E2E_Debt_Attach_Expense'
- extendedWaitUntil:
      visible:
          id: 'TransactionContextMenu.AttachDebtSettlementButton'
- tapOn:
      id: 'TransactionContextMenu.AttachDebtSettlementButton'
- extendedWaitUntil:
      visible:
          id: 'AccountPickerBottomSheet.Input'
      timeout: 10000
- runFlow:
      file: subflows/shared/select-account-by-search.flow.yaml
      env:
          ACCOUNT_NAME: 'E2E Lent Expense Debt'

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.E2E_Debt_Attach_Expense'
      timeout: 5000
- extendedWaitUntil:
      visible: 'Debt · E2E Lent Expense Debt'

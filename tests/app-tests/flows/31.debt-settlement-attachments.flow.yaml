appId: ${APP_ID}
---
- runFlow:
      file: subflows/import/import-database-from-settings.flow.yaml
      env:
          FIXTURE_ROW_ID_MATCH: '31-debt.db'

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- runFlow:
      file: subflows/transactions/open-transaction-form.flow.yaml
      env:
          ACTION_ITEM_ID: 'ActionItem.Expense'
          FORM_TITLE: 'New Expense'

- tapOn:
      id: 'TransactionKeypad.Digit.1'
- tapOn:
      id: 'TransactionKeypad.Digit.0'
- tapOn:
      id: 'TransactionKeypad.Digit.0'

- runFlow:
      file: subflows/transactions/select-account.flow.yaml
      env:
          ACCOUNT_NAME: 'E2E Txn Account'

- runFlow:
      file: subflows/categories/create-category-from-transaction.flow.yaml
      env:
          CATEGORY_NAME: 'E2E Debt Attachment Category'

- runFlow:
      file: subflows/transactions/enter-comment.flow.yaml
      env:
          COMMENT: 'E2E Debt Attach Expense'

- runFlow: subflows/transactions/submit-transaction-and-return-to-list.flow.yaml

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.E2E_Debt_Attach_Expense'
      timeout: 5000

- longPressOn:
      id: 'TransactionCard.Label.E2E_Debt_Attach_Expense'
- extendedWaitUntil:
      visible:
          id: 'TransactionContextMenu.AttachDebtSettlementButton'
- tapOn:
      id: 'TransactionContextMenu.AttachDebtSettlementButton'
- extendedWaitUntil:
      visible:
          id: 'AccountPickerBottomSheet.Input'
      timeout: 10000
- runFlow:
      file: subflows/shared/select-account-by-search.flow.yaml
      env:
          ACCOUNT_NAME: 'E2E Lent Expense Debt'

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.E2E_Debt_Attach_Expense'
      timeout: 5000
- extendedWaitUntil:
      visible: 'Debt · E2E Lent Expense Debt'
      timeout: 10000

- tapOn:
      id: 'TabBar.Home'
- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
      timeout: 10000

- runFlow:
      file: subflows/accounts/open-account-details.flow.yaml
      env:
          ACCOUNT_NAME: 'E2E Lent Debt'

- assertVisible:
      id: 'DebtAccountBalance.OutstandingAmount.13000'
- assertVisible:
      id: 'DebtAccountBalance.PaidAmount.2000'
- assertVisible:
      id: 'DebtAccountBalance.TotalAmount.15000'
- assertVisible:
      id: 'DebtAccountBalance.Percentage.13_33'

- runFlow: subflows/accounts/exit-account-details-to-home.flow.yaml

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- runFlow:
      file: subflows/transactions/open-transaction-form.flow.yaml
      env:
          ACTION_ITEM_ID: 'ActionItem.Income'
          FORM_TITLE: 'New Income'

- tapOn:
      id: 'TransactionKeypad.Digit.1'
- tapOn:
      id: 'TransactionKeypad.Digit.0'
- tapOn:
      id: 'TransactionKeypad.Digit.9'

- runFlow:
      file: subflows/transactions/select-account.flow.yaml
      env:
          ACCOUNT_NAME: 'E2E Txn Account'

- runFlow:
      file: subflows/categories/select-category.flow.yaml
      env:
          CATEGORY_NAME: 'E2E Debt Attachment Category'

- runFlow:
      file: subflows/transactions/enter-comment.flow.yaml
      env:
          COMMENT: 'E2E Debt Attach Income'

- runFlow: subflows/transactions/submit-transaction-and-return-to-list.flow.yaml

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.E2E_Debt_Attach_Income'
      timeout: 5000

- tapOn:
      id: 'TransactionCard.Label.E2E_Debt_Attach_Income'
- extendedWaitUntil:
      visible:
          id: 'TransactionInfo.Page'
      timeout: 10000
- waitForAnimationToEnd

- tapOn:
      id: 'TransactionActionsMenu.TriggerButton'
- extendedWaitUntil:
      visible:
          id: 'TransactionActionsMenu.AttachDebtSettlementButton'
- waitForAnimationToEnd
- tapOn:
      id: 'TransactionActionsMenu.AttachDebtSettlementButton'
- extendedWaitUntil:
      visible:
          id: 'AccountPickerBottomSheet.Input'
      timeout: 10000
- tapOn:
      id: 'AccountPickerBottomSheet.Input'
- inputText: 'E2E Lent Debt'
- extendedWaitUntil:
      visible:
          id: 'AccountPickerBottomSheet.Option.E2E Lent Debt'
- assertVisible:
      id: 'AccountPickerBottomSheet.DebtTotal.E2E Lent Debt.15000'
- tapOn:
      id: 'AccountPickerBottomSheet.Option.E2E Lent Debt'
- extendedWaitUntil:
      notVisible:
          id: 'AccountPickerBottomSheet.Input'
- waitForAnimationToEnd
- tapOn:
      id: 'TransactionActionsMenu.TriggerButton'
- extendedWaitUntil:
      visible:
          id: 'TransactionActionsMenu.DetachDebtSettlementButton'
- tapOn:
      id: 'TransactionActionsMenu.DetachDebtSettlementButton'
- waitForAnimationToEnd
- tapOn:
      id: 'TransactionActionsMenu.TriggerButton'
- extendedWaitUntil:
      visible:
          id: 'TransactionActionsMenu.AttachDebtSettlementButton'
- tapOn:
      id: 'TransactionActionsMenu.AttachDebtSettlementButton'
- extendedWaitUntil:
      visible:
          id: 'AccountPickerBottomSheet.Input'
      timeout: 10000
- runFlow:
      file: subflows/shared/select-account-by-search.flow.yaml
      env:
          ACCOUNT_NAME: 'E2E Lent Debt'
- tapOn:
      id: 'PageHeader.BackButton'

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.E2E_Debt_Attach_Income'
      timeout: 5000
- assertVisible: 'Debt · E2E Lent Debt'

- tapOn:
      id: 'TabBar.Home'
- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
      timeout: 10000

- runFlow:
      file: subflows/accounts/open-account-details.flow.yaml
      env:
          ACCOUNT_NAME: 'E2E Lent Debt'

- assertVisible:
      id: 'DebtAccountBalance.OutstandingAmount.12891'
- assertVisible:
      id: 'DebtAccountBalance.PaidAmount.2109'
- assertVisible:
      id: 'DebtAccountBalance.TotalAmount.15000'
- assertVisible:
      id: 'DebtAccountBalance.Percentage.14_06'

- scrollUntilVisible:
      element:
          id: 'TransactionCard.Label.E2E_Debt_Attach_Income'
      direction: DOWN

- assertVisible:
      id: 'TransactionCard.Label.E2E_Debt_Attach_Income'

- runFlow: subflows/accounts/exit-account-details-to-home.flow.yaml

- scrollUntilVisible:
      element:
          id: 'DebtAccountCardSummary.OutstandingAmount.E2E_Lent_Debt.12891'
      direction: DOWN

- assertVisible:
      id: 'DebtAccountCardSummary.OutstandingAmount.E2E_Lent_Debt.12891'
- assertVisible:
      id: 'DebtAccountCardSummary.PaidAmount.E2E_Lent_Debt.2109'
- assertVisible:
      id: 'DebtAccountCardSummary.TotalAmount.E2E_Lent_Debt.15000'

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- runFlow:
      file: subflows/transactions/open-transaction-form.flow.yaml
      env:
          ACTION_ITEM_ID: 'ActionItem.Transfer'
          FORM_TITLE: 'New Transfer'

- tapOn:
      id: 'TransactionKeypad.Digit.5'
- tapOn:
      id: 'TransactionKeypad.Digit.0'
- tapOn:
      id: 'TransactionKeypad.Digit.0'

- tapOn:
      id: 'TransferForm.FromAccount'
- extendedWaitUntil:
      visible:
          id: 'AccountPickerBottomSheet.Input'
- tapOn:
      id: 'AccountPickerBottomSheet.Input'
- inputText: 'E2E EUR Debt Funding Account'
- extendedWaitUntil:
      visible:
          id: 'AccountPickerBottomSheet.Option.E2E EUR Debt Funding Account'
- tapOn:
      id: 'AccountPickerBottomSheet.Option.E2E EUR Debt Funding Account'
- extendedWaitUntil:
      notVisible:
          id: 'AccountPickerBottomSheet.Input'

- tapOn:
      id: 'TransferForm.ToAccount'
- extendedWaitUntil:
      visible:
          id: 'AccountPickerBottomSheet.Input'
- tapOn:
      id: 'AccountPickerBottomSheet.Input'
- inputText: 'E2E Lent Debt'
- extendedWaitUntil:
      visible:
          id: 'AccountPickerBottomSheet.Option.E2E Lent Debt'
- tapOn:
      id: 'AccountPickerBottomSheet.Option.E2E Lent Debt'
- extendedWaitUntil:
      notVisible:
          id: 'AccountPickerBottomSheet.Input'

- runFlow:
      file: subflows/transactions/enter-comment.flow.yaml
      env:
          COMMENT: 'E2E Lent Debt Extra Transfer'

- runFlow: subflows/transactions/submit-transaction-and-return-to-list.flow.yaml

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.E2E_Lent_Debt_Extra_Transfer'
      timeout: 5000

- tapOn:
      id: 'TabBar.Home'
- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
      timeout: 10000

- runFlow:
      file: subflows/accounts/open-account-details.flow.yaml
      env:
          ACCOUNT_NAME: 'E2E Lent Debt'

- assertVisible:
      id: 'DebtAccountBalance.OutstandingAmount.13391'
- assertVisible:
      id: 'DebtAccountBalance.PaidAmount.2109'
- assertVisible:
      id: 'DebtAccountBalance.TotalAmount.15500'
- assertVisible:
      id: 'DebtAccountBalance.Percentage.13_61'

- runFlow: subflows/accounts/exit-account-details-to-home.flow.yaml

- scrollUntilVisible:

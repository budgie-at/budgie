appId: ${APP_ID}
---
- tapOn:
    id: 'TabBar.Transactions'
- extendedWaitUntil:
    visible: 'Transactions'
    timeout: 3000

- tapOn:
    id: 'CreateTransactionTrigger'
- extendedWaitUntil:
    visible:
      id: 'ActionItem.0'
    timeout: 2000
- waitForAnimationToEnd

- tapOn:
    text: 'Expense'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'New Expense'
    timeout: 5000

- tapOn:
    id: 'TransactionForm.AmountInput'
- inputText: ${AMOUNT}


- tapOn:
    id: TransactionForm.AccountSelector
- tapOn:
    id: TransactionForm.AccountSearchInput
- inputText: 'Test Account'
- tapOn:
    id: TransactionForm.Account

- tapOn:
    text: 'Select category'
- tapOn:
    text: 'Search categories...'
- inputText: 'Groceries'
- assertVisible:
    text: 'Groceries'
    index: 1
- tapOn:
    text: 'Groceries'
    index: 1

- swipe:
    from:
      id: TransactionForm.CategorySelector
    direction: UP
- assertVisible: Add a note...
- tapOn: 'Add a note...'
- inputText: ${INPUT}

- tapOn:
    id: TransactionForm.DatePicker
- tapOn:
    id: btn-month
- tapOn:
    text: January
    index: -1
- tapOn: "1"
- tapOn: Submit

- tapOn:
    id: 'TransactionForm.SubmitButton'

- extendedWaitUntil:
    visible: 'Transactions'
    timeout: 5000

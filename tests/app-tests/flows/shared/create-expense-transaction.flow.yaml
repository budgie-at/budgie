appId: ${APP_ID}
---
# Shared flow: Create an expense transaction
# Requires: TITLE and AMOUNT environment variables
# Example usage: runFlow with env: { TITLE: "Netflix", AMOUNT: "15" }

# Navigate to Transactions tab
- tapOn:
    id: 'TabBar.Transactions'
- extendedWaitUntil:
    visible: 'Transactions'
    timeout: 3000

# Tap the FAB to create transaction
- tapOn:
    id: 'CreateTransactionTrigger'
- extendedWaitUntil:
    visible:
      id: 'ActionItem.0'
    timeout: 2000
- waitForAnimationToEnd

# Select Expense type
- tapOn:
    text: 'Expense'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'New Expense'
    timeout: 5000

# Enter amount
- tapOn:
    id: 'TransactionForm.AmountInput'
- inputText: ${AMOUNT}

# Enter title in comment field
- scrollUntilVisible:
    element:
      id: 'TransactionForm.CommentInput'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'TransactionForm.CommentInput'
- inputText: ${TITLE}

# Submit the transaction
- tapOn:
    id: 'TransactionForm.SubmitButton'
- extendedWaitUntil:
    visible: 'Transactions'
    timeout: 5000

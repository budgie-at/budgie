appId: ${APP_ID}
---
# Select a category by searching in the bottom sheet
# Requires: CATEGORY_NAME env variable
# Assumes: Category selector bottom sheet is already open

- tapOn:
    id: 'CategoryPickerBottomSheet.Input'
- inputText: ${CATEGORY_NAME}
- extendedWaitUntil:
    visible: ${CATEGORY_NAME}
    timeout: 3000
- tapOn:
    text: ${CATEGORY_NAME}
    index: 1

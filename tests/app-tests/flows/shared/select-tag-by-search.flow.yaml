appId: ${APP_ID}
---
# Select a tag by searching in the bottom sheet
# Requires: TAG_NAME env variable
# Assumes: Tag selector bottom sheet is already open

- tapOn:
    id: 'TagPickerBottomSheet.Input'
- inputText: ${TAG_NAME}
- extendedWaitUntil:
    visible: ${TAG_NAME}
    timeout: 3000
- tapOn:
    text: ${TAG_NAME}
    index: 1

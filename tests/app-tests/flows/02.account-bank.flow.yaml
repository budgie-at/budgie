appId: ${APP_ID}
---

- runFlow: subflows/enter-app.flow.yaml

- runFlow:
    file: subflows/account/create-bank-account.flow.yaml
    env:
      ACCOUNT_NAME: 'E2E Checking Account'
      ACCOUNT_AMOUNT: '100'

- runFlow:
    file: subflows/account/verify-checking-adjustments.flow.yaml
    env:
      ACCOUNT_NAME: 'E2E Checking Account'
      INCREASE_TO: '175'
      INCREASE_DELTA: '75'
      DECREASE_TO: '125'
      DECREASE_DELTA: '50'

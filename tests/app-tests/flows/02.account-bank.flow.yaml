appId: ${APP_ID}
---

- runFlow: subflows/enter-app.flow.yaml

- runFlow:
    file: subflows/account/create-bank-account.flow.yaml
    env:
      ACCOUNT_NAME: 'E2E Checking Account'
      CURRENCY_CODE: 'EUR'
      ACCOUNT_AMOUNT: '100'

- runFlow:
    file: subflows/account/exercise-liability-account.flow.yaml
    env:
      ACCOUNT_NAME: 'E2E Checking Account'
      CURRENCY_CODE: 'EUR'
      UPDATED_ACCOUNT_NAME: 'E2E Checking Account EUR'
      INITIAL_AMOUNT: '100'
      INCREASE_TO: '175'
      INCREASE_DELTA: '75'
      DECREASE_TO: '125'
      DECREASE_DELTA: '50'

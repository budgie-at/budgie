appId: ${APP_ID}
---
- tapOn:
      id: 'TabBar.Transactions'
      retryTapIfNoChange: true
- waitForAnimationToEnd
- extendedWaitUntil:
      visible:
          id: 'TransactionsPage.Container'
      timeout: 15000
- tapOn:
      id: 'TransactionsPage.Tab.Transactions'
      retryTapIfNoChange: true
- waitForAnimationToEnd

appId: ${APP_ID}
---
- runFlow:
      when:
          visible:
              id: 'TransactionInfo.Page'
      commands:
          - tapOn:
                id: 'PageHeader.BackButton'
          - waitForAnimationToEnd
- extendedWaitUntil:
      visible:
          id: 'TabBar.Transactions'
      timeout: 15000
- retry:
      maxRetries: 3
      commands:
          - tapOn:
                id: 'TabBar.Transactions'
          - waitForAnimationToEnd
          - extendedWaitUntil:
                visible:
                    id: 'TransactionsPage.Container'
                timeout: 5000

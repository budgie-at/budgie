appId: ${APP_ID}
---
- runFlow:
      when:
          notVisible:
              id: 'TabBar.Transactions'
      commands:
          - openLink: 'budgie://transactions'
          - waitForAnimationToEnd
- tapOn:
      id: 'TabBar.Transactions'
- waitForAnimationToEnd
- extendedWaitUntil:
      visible:
          id: 'TransactionsPage.Container'
      timeout: 15000

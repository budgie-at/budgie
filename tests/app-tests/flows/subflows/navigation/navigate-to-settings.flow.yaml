appId: ${APP_ID}
---
- tapOn:
    id: 'PageHeader.BackButton'
    optional: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'TabBar.Home'
    timeout: 15000
- tapOn:
    id: 'TabBar.Home'
- tapOn:
    id: 'TabBar.Settings'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'SettingsPage.Container'
    timeout: 15000

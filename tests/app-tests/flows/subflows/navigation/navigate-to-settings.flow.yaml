appId: ${APP_ID}
---
- runFlow:
      when:
          visible:
              id: 'PageHeader.BackButton'
      commands:
          - tapOn:
                id: 'PageHeader.BackButton'
          - waitForAnimationToEnd
- extendedWaitUntil:
      visible:
          id: 'TabBar.Home'
      timeout: 15000
- tapOn:
      id: 'TabBar.Home'
- tapOn:
      id: 'TabBar.Settings'
- waitForAnimationToEnd
- extendedWaitUntil:
      visible:
          id: 'SettingsPage.Container'
      timeout: 15000

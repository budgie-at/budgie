appId: ${APP_ID}
env:
  CARD_ID: ${CARD_ID}
  DESTINATION_ID: ${DESTINATION_ID}
---
- scrollUntilVisible:
    element:
      id: '${CARD_ID}'
    direction: DOWN
    speed: 20
    centerElement: true
    waitToSettleTimeoutMs: 1000

- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: '${CARD_ID}'
    timeout: 3000

- tapOn:
    id: '${CARD_ID}'
    retryTapIfNoChange: true

- extendedWaitUntil:
    visible:
      id: '${DESTINATION_ID}'
    timeout: 15000

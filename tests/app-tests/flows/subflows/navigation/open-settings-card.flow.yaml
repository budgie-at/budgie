appId: ${APP_ID}
env:
    SETTINGS_ANCHOR: ${SETTINGS_ANCHOR}
    CARD_ID: ${CARD_ID}
    DESTINATION_ID: ${DESTINATION_ID}
---
- runFlow:
      file: open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://settings?anchor=${SETTINGS_ANCHOR}'

- extendedWaitUntil:
      visible:
          id: 'SettingsPage.Container'
      timeout: 15000

- scrollUntilVisible:
      element:
          id: '${CARD_ID}'
      direction: DOWN
      speed: 20
      centerElement: true
      waitToSettleTimeoutMs: 1000

- waitForAnimationToEnd

- tapOn:
      id: '${CARD_ID}'

- waitForAnimationToEnd

- extendedWaitUntil:
      visible:
          id: '${DESTINATION_ID}'
      timeout: 8000

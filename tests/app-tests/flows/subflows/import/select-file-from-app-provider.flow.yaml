appId: ${APP_ID}
env:
    FILE_ROW_ID_MATCH: ${FILE_ROW_ID_MATCH}
    FILE_ROW_TEXT_MATCH: ${FILE_ROW_TEXT_MATCH || FILE_ROW_ID_MATCH}
    FILE_PICKER_REPEAT_TAP: ${FILE_PICKER_REPEAT_TAP}
    FILE_PICKER_SEARCH_TEXT: ${FILE_PICKER_SEARCH_TEXT || ''}
---
- waitForAnimationToEnd

- extendedWaitUntil:
      visible: 'Cancel'
      timeout: 15000

- runFlow:
      when:
          visible: 'Apple Account Verification'
      commands:
          - tapOn:
                text: 'Not Now'
          - waitForAnimationToEnd

- runFlow:
      when:
          visible: 'No Results for .*'
      commands:
          - tapOn:
                text: 'Clear text'
                optional: true
          - waitForAnimationToEnd

- runFlow:
      when:
          notVisible:
              id: '${FILE_ROW_ID_MATCH}'
      commands:
          - runFlow:
                when:
                    visible: 'E2EFixtures, Actions Menu'
                commands: []

          - runFlow:
                when:
                    visible:
                        id: 'E2EFixtures, Folder'
                commands:
                    - tapOn:
                          id: 'E2EFixtures, Folder'
                          retryTapIfNoChange: true
                    - waitForAnimationToEnd

          - runFlow:
                when:
                    visible: 'budgie \(E2E\), Actions Menu'
                commands:
                    - extendedWaitUntil:
                          visible:
                              id: 'E2EFixtures, Folder'
                          timeout: 3000
                    - tapOn:
                          id: 'E2EFixtures, Folder'
                          retryTapIfNoChange: true
                    - waitForAnimationToEnd

          - runFlow:
                when:
                    notVisible: 'E2EFixtures, Actions Menu'
                commands:
                    - runFlow:
                          when:
                              notVisible: 'budgie \(E2E\), Actions Menu'
                          commands:
                              - runFlow:
                                    file: open-e2e-fixtures-full-path.flow.yaml

- runFlow:
      when:
          true: ${FILE_PICKER_SEARCH_TEXT != ''}
      commands:
          - runFlow:
                when:
                    notVisible: '${FILE_ROW_TEXT_MATCH}'
                commands:
                    - tapOn: 'Search'
                    - tapOn:
                          text: 'Clear text'
                          optional: true
                    - eraseText: 80
                    - inputText: ${FILE_PICKER_SEARCH_TEXT}
                    - waitForAnimationToEnd

- scrollUntilVisible:
      element:
          id: '${FILE_ROW_ID_MATCH}'
      direction: DOWN
      timeout: 15000
      speed: 20
      waitToSettleTimeoutMs: 2000
      optional: true

- runFlow:
      when:
          notVisible:
              id: '${FILE_ROW_ID_MATCH}'
      commands:
          - scrollUntilVisible:
                element: '${FILE_ROW_TEXT_MATCH}'
                direction: DOWN
                timeout: 15000
                speed: 20
                centerElement: true
                waitToSettleTimeoutMs: 2000
                optional: true

- runFlow:
      when:
          notVisible:
              id: '${FILE_ROW_ID_MATCH}'
      commands:
          - swipe:
                direction: UP
          - swipe:
                direction: UP
          - swipe:
                direction: UP
          - swipe:
                direction: UP
          - waitForAnimationToEnd
          - scrollUntilVisible:
                element: '${FILE_ROW_TEXT_MATCH}'
                direction: DOWN
                timeout: 15000
                speed: 20
                centerElement: true
                waitToSettleTimeoutMs: 2000

- waitForAnimationToEnd

- runFlow:
      when:
          visible:
              id: '${FILE_ROW_ID_MATCH}'
      commands:
          - tapOn:
                id: '${FILE_ROW_ID_MATCH}'
                retryTapIfNoChange: true

- runFlow:
      when:
          notVisible:
              id: '${FILE_ROW_ID_MATCH}'
      commands:
          - tapOn:
                text: '${FILE_ROW_TEXT_MATCH}'
                retryTapIfNoChange: true
                optional: true

- waitForAnimationToEnd

- runFlow:
      when:
          visible: 'Continue'
      commands:
          - tapOn: 'Continue'
          - waitForAnimationToEnd
          - runFlow:
                when:
                    visible:
                        id: '${FILE_ROW_ID_MATCH}'
                commands:
                    - tapOn:
                          id: '${FILE_ROW_ID_MATCH}'
                          retryTapIfNoChange: true
          - runFlow:
                when:
                    notVisible:
                        id: '${FILE_ROW_ID_MATCH}'
                commands:
                    - tapOn:
                          text: '${FILE_ROW_TEXT_MATCH}'
                          retryTapIfNoChange: true
                          optional: true
          - waitForAnimationToEnd

- runFlow:
      when:
          true: ${FILE_PICKER_REPEAT_TAP == 'true'}
      commands:
          - runFlow:
                when:
                    visible:
                        id: '${FILE_ROW_ID_MATCH}'
                commands:
                    - tapOn:
                          id: '${FILE_ROW_ID_MATCH}'
                          retryTapIfNoChange: true
          - runFlow:
                when:
                    notVisible:
                        id: '${FILE_ROW_ID_MATCH}'
                commands:
                    - tapOn:
                          text: '${FILE_ROW_TEXT_MATCH}'
                          retryTapIfNoChange: true
                          optional: true

- runFlow:
      when:
          visible: 'Open'
      commands:
          - tapOn:
                text: 'Open'

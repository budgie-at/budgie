appId: ${APP_ID}
env:
    FILE_ROW_ID_MATCH: ${FILE_ROW_ID_MATCH}
---
- waitForAnimationToEnd

- extendedWaitUntil:
      visible: 'Cancel'
      timeout: 15000

- runFlow:
      when:
          notVisible:
              id: '${FILE_ROW_ID_MATCH}'
      commands:
          - runFlow:
                when:
                    visible: 'E2EFixtures, Actions Menu'
                commands: []

          - runFlow:
                when:
                    visible: 'budgie \(E2E\), Actions Menu'
                commands:
                    - extendedWaitUntil:
                          visible:
                              id: 'E2EFixtures, Folder'
                          timeout: 3000
                    - tapOn:
                          id: 'E2EFixtures, Folder'
                          retryTapIfNoChange: true
                    - waitForAnimationToEnd

          - runFlow:
                when:
                    notVisible: 'E2EFixtures, Actions Menu'
                commands:
                    - runFlow:
                          when:
                              notVisible: 'budgie \(E2E\), Actions Menu'
                          commands:
                              - runFlow:
                                    file: open-e2e-fixtures-full-path.flow.yaml

- runFlow:
      when:
          notVisible:
              id: '${FILE_ROW_ID_MATCH}'
      commands:
          - scrollUntilVisible:
                element:
                    id: '${FILE_ROW_ID_MATCH}'
                direction: DOWN
                timeout: 15000
                speed: 20
                visibilityPercentage: 40
                centerElement: true
                waitToSettleTimeoutMs: 1000

- tapOn:
      id: '${FILE_ROW_ID_MATCH}'
      retryTapIfNoChange: true

- runFlow:
      when:
          visible: 'Open'
      commands:
          - tapOn:
                text: 'Open'

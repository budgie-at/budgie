appId: ${APP_ID}
env:
    FILE_ROW_ID_MATCH: ${FILE_ROW_ID_MATCH}
    FILE_PICKER_INITIAL_SCROLL_SHIFT: ${FILE_PICKER_INITIAL_SCROLL_SHIFT}
    FILE_PICKER_SCROLL_SHIFT: ${FILE_PICKER_SCROLL_SHIFT}
---
- waitForAnimationToEnd

- extendedWaitUntil:
      visible: 'Cancel'
      timeout: 15000

- runFlow:
      when:
          notVisible:
              id: '${FILE_ROW_ID_MATCH}'
      commands:
          - runFlow:
                when:
                    visible: 'E2EFixtures, Actions Menu'
                commands: []

          - runFlow:
                when:
                    visible: 'budgie \(E2E\), Actions Menu'
                commands:
                    - extendedWaitUntil:
                          visible:
                              id: 'E2EFixtures, Folder'
                          timeout: 3000
                    - tapOn:
                          id: 'E2EFixtures, Folder'
                          retryTapIfNoChange: true
                    - waitForAnimationToEnd

          - runFlow:
                when:
                    notVisible: 'E2EFixtures, Actions Menu'
                commands:
                    - runFlow:
                          when:
                              notVisible: 'budgie \(E2E\), Actions Menu'
                          commands:
                              - runFlow:
                                    file: open-e2e-fixtures-full-path.flow.yaml

- runFlow:
      when:
          true: ${FILE_PICKER_INITIAL_SCROLL_SHIFT == 'DOWN'}
      commands:
          - swipe:
                start: '50%,45%'
                end: '50%,65%'
          - waitForAnimationToEnd

- runFlow:
      when:
          true: ${FILE_PICKER_INITIAL_SCROLL_SHIFT == 'DOUBLE_DOWN'}
      commands:
          - swipe:
                start: '50%,45%'
                end: '50%,65%'
          - waitForAnimationToEnd
          - swipe:
                start: '50%,45%'
                end: '50%,65%'
          - waitForAnimationToEnd

- runFlow:
      when:
          true: ${FILE_PICKER_INITIAL_SCROLL_SHIFT == 'UP'}
      commands:
          - swipe:
                start: '50%,65%'
                end: '50%,45%'
          - waitForAnimationToEnd

- scrollUntilVisible:
      element:
          id: '${FILE_ROW_ID_MATCH}'
      direction: DOWN
      timeout: 15000
      speed: 20
      centerElement: true
      waitToSettleTimeoutMs: 2000

- waitForAnimationToEnd

- runFlow:
      when:
          true: ${FILE_PICKER_SCROLL_SHIFT == 'DOWN'}
      commands:
          - swipe:
                start: '50%,45%'
                end: '50%,65%'
          - waitForAnimationToEnd

- runFlow:
      when:
          true: ${FILE_PICKER_SCROLL_SHIFT == 'UP'}
      commands:
          - swipe:
                start: '50%,65%'
                end: '50%,45%'
          - waitForAnimationToEnd

- tapOn:
      id: '${FILE_ROW_ID_MATCH}'
      point: '30%,10%'
      retryTapIfNoChange: true

- runFlow:
      when:
          visible: 'Open'
      commands:
          - tapOn:
                text: 'Open'

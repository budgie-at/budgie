appId: ${APP_ID}
env:
    FILE_ROW_ID_MATCH: ${FILE_ROW_ID_MATCH}
---
- runFlow:
      when:
          visible:
              id: 'BackButton'
      commands:
          - tapOn:
                id: 'BackButton'

- runFlow:
      when:
          visible:
              id: 'BackButton'
      commands:
          - tapOn:
                id: 'BackButton'

- runFlow:
      when:
          visible:
              id: 'BackButton'
      commands:
          - tapOn:
                id: 'BackButton'

- runFlow:
      when:
          visible: 'Browse'
      commands:
          - tapOn:
                text: 'Browse'

- tapOn:
      text: 'On My iPhone'

- waitForAnimationToEnd

- extendedWaitUntil:
      visible:
          id: 'budgie \(E2E\), Container'
      timeout: 3000
- tapOn:
      id: 'budgie \(E2E\), Container'
      retryTapIfNoChange: true

- waitForAnimationToEnd

- extendedWaitUntil:
      visible:
          id: 'E2EFixtures, Folder'
      timeout: 3000
- tapOn:
      id: 'E2EFixtures, Folder'
      retryTapIfNoChange: true

- waitForAnimationToEnd

- runFlow:
      when:
          notVisible:
              id: '${FILE_ROW_ID_MATCH}'
      commands:
          - scrollUntilVisible:
                element:
                    id: '${FILE_ROW_ID_MATCH}'
                direction: DOWN
                timeout: 15000
                speed: 20
                visibilityPercentage: 40
                centerElement: true
                waitToSettleTimeoutMs: 1000

- tapOn:
      id: '${FILE_ROW_ID_MATCH}'
      retryTapIfNoChange: true

- runFlow:
      when:
          visible: 'Open'
      commands:
          - tapOn:
                text: 'Open'

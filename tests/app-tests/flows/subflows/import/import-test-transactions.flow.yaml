appId: ${APP_ID}
---

- openLink: 'budgie:///settings/import?e2eCsvFixture=${CSV_DISPLAY_NAME}'

- extendedWaitUntil:
    visible:
      id: 'ImportScreen.Page'
    timeout: 10000

- tapOn:
    id: 'ImportScreen.PresetChip.Budgie'

- tapOn:
    id: 'ImportScreen.SubmitButton'

- extendedWaitUntil:
    visible:
      id: 'TabBar.Transactions'
    timeout: 30000

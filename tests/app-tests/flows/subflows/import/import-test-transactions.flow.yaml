appId: ${APP_ID}
env:
    EXPECTED_TRANSACTION_LABEL_ID: ${EXPECTED_TRANSACTION_LABEL_ID || ''}
---
- runFlow:
      file: ../navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://import-csv?fileUri=${E2E_CSV_FIXTURES_URI}/${CSV_DISPLAY_NAME}.csv'

- extendedWaitUntil:
      visible:
          id: 'ImportScreen.PresetChip.Budgie'
      timeout: 10000

- extendedWaitUntil:
      visible:
          id: 'CsvPage.StartImportButton.Label'
      timeout: 10000

- assertVisible:
      text: 'Import [0-9]+ transactions?'

- tapOn:
      id: 'CsvPage.StartImportButton.Label'
      retryTapIfNoChange: true

- extendedWaitUntil:
      notVisible:
          id: 'ImportScreen.PresetChip.Budgie'
      timeout: 60000

- runFlow: ../navigation/navigate-to-transactions.flow.yaml

- runFlow:
      when:
          true: ${EXPECTED_TRANSACTION_LABEL_ID != ''}
      commands:
          - extendedWaitUntil:
                visible:
                    id: ${EXPECTED_TRANSACTION_LABEL_ID}
                timeout: 30000

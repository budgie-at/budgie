appId: ${APP_ID}
env:
    EXPECTED_TRANSACTION_LABEL_ID: ${EXPECTED_TRANSACTION_LABEL_ID || ''}
---
- openLink: 'budgie://settings/import?fileUri=${E2E_CSV_FIXTURES_URI}/${CSV_DISPLAY_NAME}.csv'

- extendedWaitUntil:
      visible:
          id: 'ImportScreen.PresetChip.Budgie'
      timeout: 10000

- tapOn:
      id: 'ImportScreen.PresetChip.Budgie'

- tapOn:
      id: 'CsvPage.StartImportButton.Label'

- runFlow: ../navigation/navigate-to-transactions.flow.yaml

- runFlow:
      when:
          true: ${EXPECTED_TRANSACTION_LABEL_ID != ''}
      commands:
          - extendedWaitUntil:
                visible:
                    id: ${EXPECTED_TRANSACTION_LABEL_ID}
                timeout: 30000

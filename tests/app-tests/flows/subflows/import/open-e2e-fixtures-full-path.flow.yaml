- waitForAnimationToEnd

- runFlow:
      when:
          visible: 'Réessayer|Retry|Wiederholen|Reintentar|Повторити'
      commands:
          - tapOn:
                text: 'Réessayer|Retry|Wiederholen|Reintentar|Повторити'
          - waitForAnimationToEnd

- extendedWaitUntil:
      visible:
          id: 'E2EFixtures, Folder'
      timeout: 20000

- tapOn:
      id: 'E2EFixtures, Folder'
      retryTapIfNoChange: true

- waitForAnimationToEnd

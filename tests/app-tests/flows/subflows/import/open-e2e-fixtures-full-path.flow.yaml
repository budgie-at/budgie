- tapOn:
      id: 'BackButton'
      optional: true

- tapOn:
      text: 'Browse|Explorer|Durchsuchen|Examinar|Огляд'
      optional: true

- waitForAnimationToEnd

- runFlow:
      when:
          notVisible:
              text: 'budgie \(E2E\)'
      commands:
          - tapOn:
                id: 'BackButton'
                optional: true
          - waitForAnimationToEnd
          - tapOn:

- runFlow:
      when:
          visible: 'Réessayer|Retry|Wiederholen|Reintentar|Повторити'
      commands:
          - tapOn:
                text: 'Réessayer|Retry|Wiederholen|Reintentar|Повторити'
          - waitForAnimationToEnd

- runFlow:
      when:
          notVisible:
              text: 'budgie \(E2E\)'
      commands:
          - runFlow:
                when:
                    visible: 'On My iPhone|Sur mon iPhone|Auf meinem iPhone|En mi iPhone|На iPhone'
                commands:
                    - tapOn:
                          text: 'On My iPhone|Sur mon iPhone|Auf meinem iPhone|En mi iPhone|На iPhone'
                    - waitForAnimationToEnd

- runFlow:
      when:
          notVisible:
              text: 'budgie \(E2E\)'
      commands:
          - scrollUntilVisible:
                element:
                    text: 'budgie \(E2E\)'
                direction: DOWN
                timeout: 20000
                speed: 20
                centerElement: true
                waitToSettleTimeoutMs: 1000

- extendedWaitUntil:
      visible:
          text: 'budgie \(E2E\)'
      timeout: 20000

- tapOn:
      text: 'budgie \(E2E\)'

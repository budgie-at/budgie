appId: ${APP_ID}
env:
    FIXTURE_ROW_ID_MATCH: ${FIXTURE_ROW_ID_MATCH}
    E2E_DB_FIXTURES_URI: ${E2E_DB_FIXTURES_URI}
---
- runFlow:
      file: ../navigation/relaunch-app-and-wait.flow.yaml
      env:
          DESTINATION_ID: 'TabBar.Home'

- openLink: 'budgie://settings/import-database?fileUri=${E2E_DB_FIXTURES_URI}/${FIXTURE_ROW_ID_MATCH}'
- waitForAnimationToEnd

- runFlow:
      file: ../navigation/relaunch-app-and-wait.flow.yaml
      env:
          DESTINATION_ID: 'TabBar.Home'

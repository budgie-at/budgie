appId: ${APP_ID}
env:
  FIXTURE_ROW_ID_MATCH: ${FIXTURE_ROW_ID_MATCH}
---
- runFlow:
    when:
      notVisible:
        id: 'TabBar.Home'
    commands:
      - launchApp

- extendedWaitUntil:
    visible:
      id: 'TabBar.Home'
    timeout: 30000

- retry:
    maxRetries: 1
    commands:
      - openLink: 'budgie://settings?anchor=data'
      - runFlow:
          when:
            visible: 'Open'
          commands:
            - tapOn: 'Open'
      - runFlow:
          when:
            notVisible:
              id: 'SettingsPage.ImportDatabaseCard'
          commands:
            - extendedWaitUntil:
                visible:
                  id: 'SettingsPage.Container'
                timeout: 15000
      - runFlow:
          when:
            notVisible:
              id: 'SettingsPage.ImportDatabaseCard'
          commands:
            - tapOn:
                id: 'TabBar.Settings'
            - tapOn:
                id: 'TabBar.Settings'
            - extendedWaitUntil:
                visible:
                  id: 'SettingsPage.Container'
                timeout: 10000
            - scrollUntilVisible:
                element:
                  id: 'SettingsPage.ImportDatabaseCard'
                direction: DOWN
                centerElement: true
      - extendedWaitUntil:
          visible:
            id: 'SettingsPage.ImportDatabaseCard'
          timeout: 15000

- tapOn:
    id: 'SettingsPage.ImportDatabaseCard'

- runFlow:
    file: select-file-from-app-provider.flow.yaml
    env:
      FILE_ROW_ID_MATCH: ${FIXTURE_ROW_ID_MATCH}

- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'

- runFlow:
    when:
      visible: 'Importing a database will replace all current data.*'
    commands:
      - retry:
          maxRetries: 1
          commands:
            - tapOn:
                text: 'Import Database'
                index: 1

# Import triggers app reload. When this subflow was entered via deep link, iOS can restore the app back to Settings after restart.
- runFlow:
    when:
      notVisible:
        id: 'HomePage.TotalBalance'
    commands:
      - extendedWaitUntil:
          visible:
            id: 'SettingsPage.Container'
          timeout: 30000
      - tapOn:
          id: 'TabBar.Home'

- extendedWaitUntil:
    visible:
      id: 'HomePage.TotalBalance'
    timeout: 30000

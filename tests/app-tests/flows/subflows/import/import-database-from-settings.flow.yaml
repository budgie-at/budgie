appId: ${APP_ID}
env:
    FIXTURE_ROW_ID_MATCH: ${FIXTURE_ROW_ID_MATCH}
    FILE_PICKER_INITIAL_SCROLL_SHIFT: ${FILE_PICKER_INITIAL_SCROLL_SHIFT}
    FILE_PICKER_SCROLL_SHIFT: ${FILE_PICKER_SCROLL_SHIFT}
    FILE_PICKER_REPEAT_TAP: ${FILE_PICKER_REPEAT_TAP}
    FILE_PICKER_SEARCH_TEXT: ${FILE_PICKER_SEARCH_TEXT || ''}
---
- openLink: 'budgie://settings?anchor=data'

- runFlow:
      when:
          visible: 'Open'
      commands:
          - tapOn: 'Open'

- scrollUntilVisible:
      element:
          id: 'SettingsPage.ImportDatabaseCard'
      direction: UP
      timeout: 5000
      centerElement: true
      waitToSettleTimeoutMs: 1000

- extendedWaitUntil:
      visible:
          id: 'SettingsPage.ImportDatabaseCard'
      timeout: 3000

- tapOn:
      id: 'SettingsPage.ImportDatabaseCard'
      retryTapIfNoChange: true

- runFlow:
      file: select-file-from-app-provider.flow.yaml
      env:
          FILE_ROW_ID_MATCH: ${FIXTURE_ROW_ID_MATCH}
          FILE_PICKER_INITIAL_SCROLL_SHIFT: ${FILE_PICKER_INITIAL_SCROLL_SHIFT}
          FILE_PICKER_SCROLL_SHIFT: ${FILE_PICKER_SCROLL_SHIFT}
          FILE_PICKER_REPEAT_TAP: ${FILE_PICKER_REPEAT_TAP}
          FILE_PICKER_SEARCH_TEXT: ${FILE_PICKER_SEARCH_TEXT}

- extendedWaitUntil:
      visible: 'Importing a database will replace all current data.*'
      timeout: 3000

- tapOn:
      text: 'Import Database'
      index: 1

- waitForAnimationToEnd

- runFlow:
      file: ../navigation/relaunch-app-and-wait.flow.yaml
      env:
          DESTINATION_ID: 'TabBar.Home'

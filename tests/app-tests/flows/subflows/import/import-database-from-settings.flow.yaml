appId: ${APP_ID}
env:
    FIXTURE_ROW_ID_MATCH: ${FIXTURE_ROW_ID_MATCH}
    FILE_PICKER_INITIAL_SCROLL_SHIFT: ${FILE_PICKER_INITIAL_SCROLL_SHIFT}
    FILE_PICKER_SCROLL_SHIFT: ${FILE_PICKER_SCROLL_SHIFT}
    FILE_PICKER_REPEAT_TAP: ${FILE_PICKER_REPEAT_TAP}
    FILE_PICKER_SEARCH_TEXT: ${FILE_PICKER_SEARCH_TEXT || ''}
    DATABASE_FIXTURE_SEEDED: ${DATABASE_FIXTURE_SEEDED || 'false'}
---
- runFlow:
      when:
          true: ${DATABASE_FIXTURE_SEEDED == 'true'}
      commands:
          - launchApp:
                stopApp: false
                permissions:
                    contacts: allow
                    microphone: allow
          - extendedWaitUntil:
                visible:
                    id: 'TabBar.Home'
                timeout: 30000
          - evalScript: ${output.homeBalanceVisible = false}
          - runFlow:
                when:
                    visible:
                        id: 'HomePage.TotalBalance'
                commands:
                    - evalScript: ${output.homeBalanceVisible = true}
          - runFlow:
                when:
                    true: ${!output.homeBalanceVisible}
                commands:
                    - tapOn:
                          id: 'TabBar.Home'
                    - waitForAnimationToEnd
          - extendedWaitUntil:
                visible:
                    id: 'HomePage.TotalBalance'
                timeout: 30000

- runFlow:
      when:
          true: ${DATABASE_FIXTURE_SEEDED != 'true'}
      commands:
          - openLink: 'budgie://settings'

          - tapOn:
                text: 'Not Now'
                optional: true
          - waitForAnimationToEnd

          - runFlow:
                file: open-import-database-card.flow.yaml

          - runFlow:
                file: select-file-from-app-provider.flow.yaml
                env:
                    FILE_ROW_ID_MATCH: ${FIXTURE_ROW_ID_MATCH}
                    FILE_PICKER_INITIAL_SCROLL_SHIFT: ${FILE_PICKER_INITIAL_SCROLL_SHIFT}
                    FILE_PICKER_SCROLL_SHIFT: ${FILE_PICKER_SCROLL_SHIFT}
                    FILE_PICKER_REPEAT_TAP: ${FILE_PICKER_REPEAT_TAP}
                    FILE_PICKER_SEARCH_TEXT: ${FILE_PICKER_SEARCH_TEXT}
                optional: true

          - extendedWaitUntil:
                visible: 'Restoring a backup replaces all current Budgie data.*'
                timeout: 3000
                optional: true

          - runFlow:
                when:
                    notVisible: 'Restoring a backup replaces all current Budgie data.*'
                commands:
                    - launchApp:
                          stopApp: true
                          permissions:
                              contacts: allow
                              microphone: allow
                    - extendedWaitUntil:
                          visible:
                              id: 'TabBar.Home'
                          timeout: 30000
                    - runFlow:
                          file: open-import-database-card.flow.yaml
                    - runFlow:
                          file: select-file-from-app-provider.flow.yaml
                          env:
                              FILE_ROW_ID_MATCH: ${FIXTURE_ROW_ID_MATCH}
                              FILE_PICKER_INITIAL_SCROLL_SHIFT: ${FILE_PICKER_INITIAL_SCROLL_SHIFT}
                              FILE_PICKER_SCROLL_SHIFT: ${FILE_PICKER_SCROLL_SHIFT}
                              FILE_PICKER_REPEAT_TAP: 'true'
                              FILE_PICKER_SEARCH_TEXT: ${FILE_PICKER_SEARCH_TEXT}
                    - extendedWaitUntil:
                          visible: 'Restoring a backup replaces all current Budgie data.*'
                          timeout: 5000

          - tapOn:
                text: '^Restore$'

          - waitForAnimationToEnd

          - extendedWaitUntil:
                visible:
                    id: 'TabBar.Home'
                timeout: 30000

          - tapOn:
                id: 'TabBar.Home'

          - extendedWaitUntil:
                visible:
                    id: 'HomePage.TotalBalance'
                timeout: 60000

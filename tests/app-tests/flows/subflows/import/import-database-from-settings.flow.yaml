appId: ${APP_ID}
env:
    FIXTURE_ROW_ID_MATCH: ${FIXTURE_ROW_ID_MATCH}
    FILE_PICKER_INITIAL_SCROLL_SHIFT: ${FILE_PICKER_INITIAL_SCROLL_SHIFT}
    FILE_PICKER_SCROLL_SHIFT: ${FILE_PICKER_SCROLL_SHIFT}
    FILE_PICKER_REPEAT_TAP: ${FILE_PICKER_REPEAT_TAP}
    FILE_PICKER_SEARCH_TEXT: ${FILE_PICKER_SEARCH_TEXT || ''}
    DATABASE_FIXTURE_SEEDED: ${DATABASE_FIXTURE_SEEDED || 'false'}
---
- runFlow:
      when:
          true: ${DATABASE_FIXTURE_SEEDED == 'true'}
      commands:
          - launchApp:
                stopApp: false
                permissions:
                    contacts: allow
                    microphone: allow
          - extendedWaitUntil:
                visible:
                    id: 'TabBar.Home'
                timeout: 30000
          - extendedWaitUntil:
                visible:
                    id: 'HomePage.TotalBalance'
                timeout: 5000
                optional: true
          - runFlow:
                when:
                    notVisible:
                        id: 'HomePage.TotalBalance'
                commands:
                    - tapOn:
                          id: 'TabBar.Home'
                    - waitForAnimationToEnd
          - extendedWaitUntil:
                visible:
                    id: 'HomePage.TotalBalance'
                timeout: 30000

- runFlow:
      when:
          true: ${DATABASE_FIXTURE_SEEDED != 'true'}
      commands:
          - openLink: 'budgie://settings?anchor=data'

          - tapOn:
                text: 'Not Now'
                optional: true
          - waitForAnimationToEnd

          - runFlow:
                when:
                    visible: 'Open'
                commands:
                    - tapOn: 'Open'

          - runFlow:
                when:
                    notVisible:
                        id: 'SettingsPage.Container'
                file: ../navigation/navigate-to-settings.flow.yaml

          - extendedWaitUntil:
                visible:
                    id: 'SettingsPage.Container'
                timeout: 15000

          - scrollUntilVisible:
                element:
                    id: 'SettingsPage.ImportDatabaseCard'
                direction: UP
                timeout: 10000
                centerElement: true
                waitToSettleTimeoutMs: 1000
                optional: true

          - runFlow:
                when:
                    notVisible:
                        id: 'SettingsPage.ImportDatabaseCard'
                commands:
                    - scrollUntilVisible:
                          element:
                              id: 'SettingsPage.ImportDatabaseCard'
                          direction: DOWN
                          timeout: 20000
                          centerElement: true
                          waitToSettleTimeoutMs: 1000
                    - waitForAnimationToEnd

          - extendedWaitUntil:
                visible:
                    id: 'SettingsPage.ImportDatabaseCard'
                timeout: 5000

          - tapOn:
                id: 'SettingsPage.ImportDatabaseCard'
                retryTapIfNoChange: true

          - runFlow:
                file: select-file-from-app-provider.flow.yaml
                env:
                    FILE_ROW_ID_MATCH: ${FIXTURE_ROW_ID_MATCH}
                    FILE_PICKER_INITIAL_SCROLL_SHIFT: ${FILE_PICKER_INITIAL_SCROLL_SHIFT}
                    FILE_PICKER_SCROLL_SHIFT: ${FILE_PICKER_SCROLL_SHIFT}
                    FILE_PICKER_REPEAT_TAP: ${FILE_PICKER_REPEAT_TAP}
                    FILE_PICKER_SEARCH_TEXT: ${FILE_PICKER_SEARCH_TEXT}

          - extendedWaitUntil:
                visible: 'Importing a database will replace all current data.*'
                timeout: 3000

          - tapOn:
                text: 'Import Database'
                index: 1

          - waitForAnimationToEnd

          - extendedWaitUntil:
                visible:
                    id: 'TabBar.Home'
                timeout: 30000

          - tapOn:
                id: 'TabBar.Home'

          - extendedWaitUntil:
                visible:
                    id: 'HomePage.TotalBalance'
                timeout: 30000

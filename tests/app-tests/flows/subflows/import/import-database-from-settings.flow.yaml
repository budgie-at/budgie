appId: ${APP_ID}
env:
    FIXTURE_ROW_ID_MATCH: ${FIXTURE_ROW_ID_MATCH}
    FILE_PICKER_INITIAL_SCROLL_SHIFT: ${FILE_PICKER_INITIAL_SCROLL_SHIFT}
    FILE_PICKER_SCROLL_SHIFT: ${FILE_PICKER_SCROLL_SHIFT}
    FILE_PICKER_REPEAT_TAP: ${FILE_PICKER_REPEAT_TAP}
    FILE_PICKER_SEARCH_TEXT: ${FILE_PICKER_SEARCH_TEXT || ''}
    DATABASE_FIXTURE_SEEDED: ${DATABASE_FIXTURE_SEEDED || 'false'}
---
- runFlow:
      when:
          true: ${DATABASE_FIXTURE_SEEDED == 'true'}
      commands:
          - launchApp:
                stopApp: false
                permissions:
                    contacts: allow
                    microphone: allow
          - extendedWaitUntil:
                visible:
                    id: 'TabBar.Home'
                timeout: 30000
          - extendedWaitUntil:
                visible:
                    id: 'HomePage.TotalBalance'
                timeout: 5000
                optional: true
          - runFlow:
                when:
                    notVisible:
                        id: 'HomePage.TotalBalance'
                commands:
                    - tapOn:
                          id: 'TabBar.Home'
                    - waitForAnimationToEnd
          - extendedWaitUntil:
                visible:
                    id: 'HomePage.TotalBalance'
                timeout: 30000

- runFlow:
      when:
          true: ${DATABASE_FIXTURE_SEEDED != 'true'}
      commands:
          - openLink: 'budgie://settings?anchor=data'

          - tapOn:
                text: 'Not Now'
                optional: true
          - waitForAnimationToEnd

          - runFlow:
                file: open-import-database-card.flow.yaml

          - runFlow:
                file: select-file-from-app-provider.flow.yaml
                env:
                    FILE_ROW_ID_MATCH: ${FIXTURE_ROW_ID_MATCH}
                    FILE_PICKER_INITIAL_SCROLL_SHIFT: ${FILE_PICKER_INITIAL_SCROLL_SHIFT}
                    FILE_PICKER_SCROLL_SHIFT: ${FILE_PICKER_SCROLL_SHIFT}
                    FILE_PICKER_REPEAT_TAP: ${FILE_PICKER_REPEAT_TAP}
                    FILE_PICKER_SEARCH_TEXT: ${FILE_PICKER_SEARCH_TEXT}

          - extendedWaitUntil:
                visible: 'Importing a database will replace all current data.*'
                timeout: 3000
                optional: true

          - runFlow:
                when:
                    notVisible: 'Importing a database will replace all current data.*'
                commands:
                    - tapOn:
                          id: 'TabBar.Home'
                          optional: true
                    - waitForAnimationToEnd
                    - runFlow:
                          file: open-import-database-card.flow.yaml
                    - runFlow:
                          file: select-file-from-app-provider.flow.yaml
                          env:
                              FILE_ROW_ID_MATCH: ${FIXTURE_ROW_ID_MATCH}
                              FILE_PICKER_INITIAL_SCROLL_SHIFT: ${FILE_PICKER_INITIAL_SCROLL_SHIFT}
                              FILE_PICKER_SCROLL_SHIFT: ${FILE_PICKER_SCROLL_SHIFT}
                              FILE_PICKER_REPEAT_TAP: ${FILE_PICKER_REPEAT_TAP}
                              FILE_PICKER_SEARCH_TEXT: ${FILE_PICKER_SEARCH_TEXT}
                    - extendedWaitUntil:
                          visible: 'Importing a database will replace all current data.*'
                          timeout: 5000

          - tapOn:
                text: 'Import Database'
                index: 1

          - waitForAnimationToEnd

          - extendedWaitUntil:
                visible:
                    id: 'TabBar.Home'
                timeout: 30000

          - tapOn:
                id: 'TabBar.Home'

          - extendedWaitUntil:
                visible:
                    id: 'HomePage.TotalBalance'
                timeout: 60000

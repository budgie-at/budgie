appId: ${APP_ID}
env:
    XLSX_ROW_ID_MATCH: ${XLSX_ROW_ID_MATCH}
---
- extendedWaitUntil:
      visible:
          id: 'CreateFileBankAccount.SelectFileButton'
      timeout: 10000

- tapOn:
      id: 'CreateFileBankAccount.SelectFileButton'
      retryTapIfNoChange: true

- runFlow:
      file: select-file-from-app-provider.flow.yaml
      env:
          FILE_ROW_ID_MATCH: ${XLSX_ROW_ID_MATCH}

- extendedWaitUntil:
      visible:
          id: 'SyncAccountSelection.Row.Privatbank_1234'
      timeout: 5000

# Nothing is pre-selected on a fresh import, so the bulk toggle starts as "Select all".
- assertVisible: 'Select all'

- tapOn:
      id: 'SyncAccountSelection.Row.Privatbank_1234'

# The only account is now selected, so every account is selected and the toggle flips.
- extendedWaitUntil:
      visible: 'Deselect all'
      timeout: 3000

# "Deselect all" clears the selection and the toggle returns to "Select all".
- tapOn:
      id: 'SyncAccountSelection.ToggleAll'

- extendedWaitUntil:
      visible: 'Select all'
      timeout: 3000

# "Select all" re-selects every account before continuing to sync.
- tapOn:
      id: 'SyncAccountSelection.ToggleAll'

- extendedWaitUntil:
      visible: 'Deselect all'
      timeout: 3000

- extendedWaitUntil:
      visible:
          id: 'CreateFileBankAccount.StartSyncButton'
      timeout: 15000

- tapOn:
      id: 'CreateFileBankAccount.StartSyncButton'
      retryTapIfNoChange: true

- runFlow:
      when:
          visible: 'Already syncing'
      commands:
          - tapOn:
                id: 'PageHeader.BackButton'

- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
      timeout: 60000

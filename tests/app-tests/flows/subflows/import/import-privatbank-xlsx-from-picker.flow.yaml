appId: ${APP_ID}
env:
    XLSX_ROW_ID_MATCH: ${XLSX_ROW_ID_MATCH}
    FILE_PICKER_INITIAL_SCROLL_SHIFT: ${FILE_PICKER_INITIAL_SCROLL_SHIFT}
    FILE_PICKER_SCROLL_SHIFT: ${FILE_PICKER_SCROLL_SHIFT}
---
- extendedWaitUntil:
      visible:
          text: 'Select File'
      timeout: 10000

- tapOn:
      text: 'Select File'

- runFlow:
      file: select-file-from-app-provider.flow.yaml
      env:
          FILE_ROW_ID_MATCH: ${XLSX_ROW_ID_MATCH}
          FILE_PICKER_INITIAL_SCROLL_SHIFT: ${FILE_PICKER_INITIAL_SCROLL_SHIFT}
          FILE_PICKER_SCROLL_SHIFT: ${FILE_PICKER_SCROLL_SHIFT}

- extendedWaitUntil:
      visible:
          id: 'SyncAccountSelection.Row.Privatbank_1234'
      timeout: 5000

- tapOn:
      id: 'SyncAccountSelection.Row.Privatbank_1234'

- extendedWaitUntil:
      visible:
          text: 'Start Sync'
      timeout: 15000

- tapOn:
      text: 'Start Sync'

- runFlow:
      when:
          visible: 'Already syncing'
      commands:
          - tapOn:
                id: 'PageHeader.BackButton'

- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
      timeout: 3000

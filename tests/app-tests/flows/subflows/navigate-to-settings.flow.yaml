appId: ${APP_ID}
---
# Navigate to Home first to avoid Maestro freeze with nested Stack
- tapOn:
    id: 'TabBar.Home'
- waitForAnimationToEnd
- tapOn:
    id: 'TabBar.Settings'
- waitForAnimationToEnd
- tapOn:
    id: 'TabBar.Settings'
- extendedWaitUntil:
    visible:
      id: 'SettingsPage.Container'
    timeout: 15000

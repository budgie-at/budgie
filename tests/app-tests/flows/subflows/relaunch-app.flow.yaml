appId: ${APP_ID}
env:
  HANDLE_DEV_CLIENT_STARTUP: ${HANDLE_DEV_CLIENT_STARTUP || 'false'}
---
# Relaunch app to recover from Maestro black screen after modal dismiss
- retry:
    maxRetries: 1
    commands:
      - stopApp
      - launchApp

      - runFlow:
          when:
            true: ${HANDLE_DEV_CLIENT_STARTUP === 'true'}
          file: handle-dev-client-startup.flow.yaml

      - extendedWaitUntil:
          visible:
            id: 'HomePage.TotalBalance'
          timeout: 30000

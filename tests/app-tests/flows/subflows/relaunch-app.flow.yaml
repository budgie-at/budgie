appId: ${APP_ID}
env:
  HANDLE_DEV_CLIENT_STARTUP: ${HANDLE_DEV_CLIENT_STARTUP || 'false'}
  USE_E2E_RESET_ROUTE: ${USE_E2E_RESET_ROUTE || 'false'}
---
# Relaunch app to recover from Maestro black screen after modal dismiss
- runFlow:
    when:
      true: ${USE_E2E_RESET_ROUTE === 'true'}
    commands:
      - stopApp
      - openLink: 'budgie://'
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible:
            id: 'HomePage.TotalBalance'
          timeout: 30000

- runFlow:
    when:
      true: ${USE_E2E_RESET_ROUTE !== 'true'}
    commands:
      - retry:
          maxRetries: 2
          commands:
            - stopApp
            - launchApp

            - runFlow:
                when:
                  true: ${HANDLE_DEV_CLIENT_STARTUP === 'true'}
                file: handle-dev-client-startup.flow.yaml

            - waitForAnimationToEnd

            - extendedWaitUntil:
                visible:
                  id: 'HomePage.TotalBalance'
                timeout: 30000

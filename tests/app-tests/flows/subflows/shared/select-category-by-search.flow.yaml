appId: ${APP_ID}
---

- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'CategoryPickerBottomSheet.Input'
- tapOn:
    id: 'CategoryPickerBottomSheet.Input'
- waitForAnimationToEnd
- inputText: ${CATEGORY_NAME}
- tapOn: Done
- extendedWaitUntil:
    visible:
      id: 'CategoryPickerBottomSheet.Card.${CATEGORY_NAME}.Label'
- waitForAnimationToEnd
- tapOn:
    id: 'CategoryPickerBottomSheet.Card.${CATEGORY_NAME}.Label'
    retryTapIfNoChange: true
- runFlow:
    when:
      visible:
        id: 'CategoryPickerBottomSheet.Input'
    commands:
      - waitForAnimationToEnd
      - tapOn:
          id: 'CategoryPickerBottomSheet.Card.${CATEGORY_NAME}.Label'
          retryTapIfNoChange: true
- extendedWaitUntil:
    notVisible:
      id: 'CategoryPickerBottomSheet.Input'
    timeout: 5000

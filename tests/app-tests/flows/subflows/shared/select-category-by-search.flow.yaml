appId: ${APP_ID}
---

- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'CategoryPickerBottomSheet.Input'
- tapOn:
    id: 'CategoryPickerBottomSheet.Input'
- waitForAnimationToEnd
- inputText: ${CATEGORY_NAME}
- hideKeyboard
- extendedWaitUntil:
    visible:
      text: '${CATEGORY_NAME}'
- tapOn:
    point: '18%,48%'

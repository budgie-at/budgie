appId: ${APP_ID}
---
- runFlow: open-new-account.flow.yaml

- extendedWaitUntil:
      visible:
          id: 'CreateAccount.CRYPTO'
      timeout: 3000
- tapOn:
      id: 'CreateAccount.CRYPTO'
      retryTapIfNoChange: true
- waitForAnimationToEnd
- extendedWaitUntil:
      visible:
          id: 'AccountForm.NameInput'
      timeout: 3000

- tapOn:
      id: 'AccountForm.NameInput'
- inputText: ${ACCOUNT_NAME}
- hideKeyboard

- tapOn:
      id: 'AccountForm.CurrencySelector'
      retryTapIfNoChange: true
- waitForAnimationToEnd
- runFlow:
      when:
          notVisible:
              id: 'CurrencySelector.SearchInput'
      commands:
          - tapOn:
                id: 'AccountForm.CurrencySelector'
                retryTapIfNoChange: true
          - waitForAnimationToEnd
- extendedWaitUntil:
      visible:
          id: 'CurrencySelector.SearchInput'
      timeout: 3000
- runFlow:
      when:
          notVisible:
              id: 'AccountForm.CurrencyOption.${CURRENCY_CODE}'
      commands:
          - tapOn:
                id: 'CurrencySelector.SearchInput'
          - inputText: ${CURRENCY_CODE}
- extendedWaitUntil:
      visible:
          id: 'AccountForm.CurrencyOption.${CURRENCY_CODE}'
      timeout: 3000
- tapOn:
      id: 'AccountForm.CurrencyOption.${CURRENCY_CODE}'
- waitForAnimationToEnd
- extendedWaitUntil:
      notVisible:
          id: 'CurrencySelector.SearchInput'
      timeout: 3000
- extendedWaitUntil:
      visible:
          id: 'AccountForm.SelectedCurrency.${CURRENCY_CODE}'
      timeout: 3000

- tapOn:
      id: 'CreateAccount.Amount'
      point: '95%,50%'
- eraseText: 100
- inputText: ${ACCOUNT_AMOUNT}
- tapOn:
      text: 'ACCOUNT NAME & ICON'
- extendedWaitUntil:
      visible:
          id: 'AccountForm.SelectedCurrency.${CURRENCY_CODE}'
      timeout: 3000

- extendedWaitUntil:
      visible:
          id: 'AccountForm.SubmitButton'
      timeout: 3000
- tapOn:
      id: 'AccountForm.SubmitButton'

- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
      timeout: 10000

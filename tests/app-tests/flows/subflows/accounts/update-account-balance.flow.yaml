appId: ${APP_ID}
---

- tapOn:
    id: 'CreateAccount.Amount'
- eraseText: 100
- inputText: ${NEW_BALANCE}
- tapOn:
    id: 'AccountForm.ScrollView'
- extendedWaitUntil:
    visible:
      id: 'AccountForm.SubmitButton'
    timeout: 3000
- scrollUntilVisible:
    element:
      id: 'AccountForm.SubmitButton'
    direction: DOWN
    centerElement: true
    waitToSettleTimeoutMs: 1000
- tapOn:
    id: 'AccountForm.SubmitButton'

- extendedWaitUntil:
    visible:
      id: 'AccountCard.${ACCOUNT_NAME}'
    timeout: 3000

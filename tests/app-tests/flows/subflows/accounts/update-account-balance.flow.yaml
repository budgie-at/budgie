appId: ${APP_ID}
---
- tapOn:
      id: 'CreateAccount.Amount'
- eraseText: 20
- inputText: ${NEW_BALANCE}
- extendedWaitUntil:
      visible: ${NEW_BALANCE}
      timeout: 3000
- tapOn:
      text: 'ACCOUNT NAME & ICON'
- scrollUntilVisible:
      element:
          id: 'AccountForm.SubmitButton'
      direction: DOWN
- extendedWaitUntil:
      visible:
          id: 'AccountForm.SubmitButton'
      timeout: 3000
- tapOn:
      id: 'AccountForm.SubmitButton'

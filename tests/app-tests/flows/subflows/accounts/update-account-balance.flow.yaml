appId: ${APP_ID}
---
- tapOn:
      id: 'CreateAccount.Amount'
      point: '95%,50%'
- eraseText: 100
- inputText: ${NEW_BALANCE}
- tapOn:
      id: 'AccountForm.ScrollView'
- extendedWaitUntil:
      visible:
          id: 'AccountForm.SubmitButton'
      timeout: 3000
- tapOn:
      id: 'AccountForm.SubmitButton'

- extendedWaitUntil:
      visible:
          id: 'AccountCard.${ACCOUNT_NAME}'
      timeout: 3000

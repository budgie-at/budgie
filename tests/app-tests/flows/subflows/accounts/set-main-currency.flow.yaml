appId: ${APP_ID}
---

- runFlow:
    file: ../navigation/navigate-to-settings.flow.yaml

- runFlow:
    file: ../navigation/open-settings-card.flow.yaml
    env:
      CARD_ID: 'SettingsPage.MainCurrencyCard'
      DESTINATION_ID: 'CurrencySelector.SearchInput'
- runFlow:
    when:
      notVisible:
        id: 'AccountForm.CurrencyOption.${CURRENCY_CODE}'
    commands:
      - tapOn:
          id: 'CurrencySelector.SearchInput'
      - inputText: ${CURRENCY_CODE}
- extendedWaitUntil:
    visible:
      id: 'AccountForm.CurrencyOption.${CURRENCY_CODE}'
    timeout: 3000
- tapOn:
    id: 'AccountForm.CurrencyOption.${CURRENCY_CODE}'
- extendedWaitUntil:
    notVisible:
      id: 'CurrencySelector.SearchInput'
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: 'SettingsPage.MainCurrencyValue.${CURRENCY_CODE}'
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: 'TabBar.Home'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'HomePage.TotalBalance'
    timeout: 30000

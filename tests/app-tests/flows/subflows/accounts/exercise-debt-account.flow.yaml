appId: ${APP_ID}
---

- runFlow:
    file: open-account-details.flow.yaml
    env:
      ACCOUNT_NAME: ${ACCOUNT_NAME}

- runFlow:
    file: open-visible-account-settings.flow.yaml
    env:
      ACCOUNT_NAME: ${ACCOUNT_NAME}

- runFlow:
    file: set-debt-return-date.flow.yaml
    env:
      RETURN_DAY: ${RETURN_DAY}
      RETURN_DATE_LABEL: ${RETURN_DATE_LABEL}

- runFlow:
    file: rename-account.flow.yaml
    env:
      UPDATED_ACCOUNT_NAME: ${UPDATED_ACCOUNT_NAME}

- runFlow:
    file: open-account-settings.flow.yaml
    env:
      ACCOUNT_NAME: ${UPDATED_ACCOUNT_NAME}

- assertVisible: '${RETURN_DATE_LABEL}'

- runFlow:
    file: update-account-balance.flow.yaml
    env:
      ACCOUNT_NAME: ${UPDATED_ACCOUNT_NAME}
      NEW_BALANCE: ${INCREASE_TO}

- runFlow:
    file: open-account-details.flow.yaml
    env:
      ACCOUNT_NAME: ${UPDATED_ACCOUNT_NAME}

- assertVisible:
    id: 'TransactionCard.Badge.Adjustment'
- assertVisible:
    id: 'TransactionCard.AdjustmentAmount.${INCREASE_DELTA}'

- runFlow:
    file: open-visible-account-settings.flow.yaml
    env:
      ACCOUNT_NAME: ${UPDATED_ACCOUNT_NAME}

- runFlow:
    file: update-account-balance.flow.yaml
    env:
      ACCOUNT_NAME: ${UPDATED_ACCOUNT_NAME}
      NEW_BALANCE: ${DECREASE_TO}

- runFlow:
    file: open-account-details.flow.yaml
    env:
      ACCOUNT_NAME: ${UPDATED_ACCOUNT_NAME}

- assertVisible:
    id: 'TransactionCard.Badge.Adjustment'
- assertVisible:
    id: 'TransactionCard.AdjustmentAmount.${INCREASE_DELTA}'
- assertVisible:
    id: 'TransactionCard.AdjustmentAmount.${DECREASE_DELTA}'

- runFlow: exit-account-details-to-home.flow.yaml

- runFlow:
    file: set-main-currency.flow.yaml
    env:
      CURRENCY_CODE: ${CURRENCY_CODE}

- assertVisible:
    id: 'HomePage.NetWorthValue.0'
- scrollUntilVisible:
    element:
      id: 'AccountCard.${UPDATED_ACCOUNT_NAME}'
    direction: DOWN
    timeout: 8000

- runFlow:
    file: open-account-settings.flow.yaml
    env:
      ACCOUNT_NAME: ${UPDATED_ACCOUNT_NAME}

- scrollUntilVisible:
    element:
      id: 'AccountForm.ActiveTitle'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'AccountForm.ActiveTitle'
- tapOn:
    id: 'AccountForm.SubmitButton'

- extendedWaitUntil:
    visible:
      id: 'HomePage.NetWorthValue.0'
    timeout: 10000

- assertNotVisible:
    id: 'AccountCard.${UPDATED_ACCOUNT_NAME}'

- runFlow:
    file: open-inactive-accounts.flow.yaml

- assertVisible:
    id: 'InactiveAccountCard.${UPDATED_ACCOUNT_NAME}'
- tapOn:
    id: 'InactiveAccountCard.ActivateButton.${UPDATED_ACCOUNT_NAME}'
- tapOn: 'Activate'
- tapOn:
    id: 'TabBar.Home'

- extendedWaitUntil:
    visible:
      id: 'HomePage.NetWorthValue.0'
    timeout: 10000

- scrollUntilVisible:
    element:
      id: 'AccountCard.${UPDATED_ACCOUNT_NAME}'
    direction: DOWN
    timeout: 8000

- runFlow:
    file: open-account-settings.flow.yaml
    env:
      ACCOUNT_NAME: ${UPDATED_ACCOUNT_NAME}

- scrollUntilVisible:
    element:
      id: 'AccountForm.IncludeInNetWorthTitle'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'AccountForm.IncludeInNetWorthTitle'
- tapOn:
    id: 'AccountForm.SubmitButton'

- extendedWaitUntil:
    visible:
      id: 'HomePage.NetWorthValue.${NET_WORTH_WHEN_INCLUDED}'
    timeout: 10000

- runFlow:
    file: open-account-settings.flow.yaml
    env:
      ACCOUNT_NAME: ${UPDATED_ACCOUNT_NAME}

- scrollUntilVisible:
    element:
      id: 'AccountForm.IncludeInNetWorthTitle'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'AccountForm.IncludeInNetWorthTitle'
- tapOn:
    id: 'AccountForm.SubmitButton'

- extendedWaitUntil:
    visible:
      id: 'HomePage.NetWorthValue.0'
    timeout: 10000

- runFlow:
    file: open-account-settings.flow.yaml
    env:
      ACCOUNT_NAME: ${UPDATED_ACCOUNT_NAME}

- tapOn:
    id: 'AccountDetails.ArchiveButton'
- tapOn: 'Archive'

- extendedWaitUntil:
    visible:
      id: 'HomePage.NetWorthValue.0'
    timeout: 10000

- assertNotVisible:
    id: 'AccountCard.${UPDATED_ACCOUNT_NAME}'

- runFlow:
    file: open-archived-accounts.flow.yaml

- assertVisible:
    id: 'ArchivedAccountCard.${UPDATED_ACCOUNT_NAME}'

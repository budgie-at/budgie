appId: ${APP_ID}
---

- scrollUntilVisible:
    element:
      id: 'AccountCard.${ACCOUNT_NAME}'
    direction: DOWN
    visibilityPercentage: 90
    centerElement: true
- waitForAnimationToEnd

- tapOn:
    id: 'AccountCard.${ACCOUNT_NAME}'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: 'AccountDetails.Page'
    timeout: 10000

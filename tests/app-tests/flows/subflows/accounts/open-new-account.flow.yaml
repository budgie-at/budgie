appId: ${APP_ID}
---

- tapOn:
    id: 'TabBar.Home'
- waitForAnimationToEnd

- evalScript: ${output.homeHasAccounts = true}
- runFlow:
    when:
      visible: 'No accounts yet'
    commands:
      - evalScript: ${output.homeHasAccounts = false}
      - tapOn:
          id: 'AccountsEmptyState.AddAccountButton'

- runFlow:
    when:
      true: ${output.homeHasAccounts}
    commands:
      - extendedWaitUntil:
          visible:
            id: 'ActionButton'
          timeout: 10000
      - tapOn:
          id: 'ActionButton'
      - extendedWaitUntil:
          visible:
            id: 'ActionItem.AddAccount.Label'
          timeout: 10000
      - waitForAnimationToEnd
      - tapOn:
          id: 'ActionItem.AddAccount.Label'
- extendedWaitUntil:
    visible:
      id: 'CreateAccount.BANK'
    timeout: 10000

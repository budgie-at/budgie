appId: ${APP_ID}
---

- tapOn:
    id: 'AccountForm.NameInput'
- eraseText: 60
- inputText: ${UPDATED_ACCOUNT_NAME}
- scrollUntilVisible:
    element:
      id: 'AccountForm.SubmitButton'
    direction: DOWN
    centerElement: true
    waitToSettleTimeoutMs: 1000
- tapOn:
    id: 'AccountForm.SubmitButton'

- extendedWaitUntil:
    visible:
      id: 'AccountCard.${UPDATED_ACCOUNT_NAME}'
    timeout: 3000

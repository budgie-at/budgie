appId: ${APP_ID}
---

- tapOn:
    id: 'AccountForm.NameInput'
- eraseText: 60
- inputText: ${UPDATED_ACCOUNT_NAME}
- tapOn:
    id: 'AccountForm.ScrollView'
- extendedWaitUntil:
    visible:
      id: 'AccountForm.SubmitButton'
    timeout: 3000
- tapOn:
    id: 'AccountForm.SubmitButton'

- extendedWaitUntil:
    visible:
      id: 'AccountCard.${UPDATED_ACCOUNT_NAME}'
    timeout: 3000

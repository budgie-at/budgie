appId: ${APP_ID}
---

- scrollUntilVisible:
    element:
      id: 'AccountForm.NameInput'
    direction: UP
- tapOn:
    id: 'AccountForm.NameInput'
- eraseText: 60
- inputText: ${UPDATED_ACCOUNT_NAME}
- tapOn:
    id: 'AccountForm.NameInput.Label'
- extendedWaitUntil:
    visible:
      id: 'AccountForm.SubmitButton'
    timeout: 3000
- tapOn:
    id: 'AccountForm.SubmitButton'

- extendedWaitUntil:
    visible:
      id: 'AccountCard.${UPDATED_ACCOUNT_NAME}'
    timeout: 10000

appId: ${APP_ID}
---

- runFlow: open-new-account.flow.yaml

- tapOn:
    id: 'CreateAccount.DEBT'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'AccountForm.NameInput'
    timeout: 3000

- tapOn:
    id: 'AccountForm.NameInput'
- inputText: ${ACCOUNT_NAME}
- tapOn:
    text: 'ACCOUNT NAME & ICON'

- extendedWaitUntil:
    visible:
      id: 'AccountForm.CurrencySelector'
    timeout: 3000
- tapOn:
    id: 'AccountForm.CurrencySelector'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'CurrencySelector.SearchInput'
    timeout: 3000
- tapOn:
    id: 'CurrencySelector.SearchInput'
- eraseText: 100
- inputText: ${CURRENCY_CODE}
- extendedWaitUntil:
    visible:
      id: 'AccountForm.CurrencyOption.${CURRENCY_CODE}'
    timeout: 3000
- tapOn:
    id: 'AccountForm.CurrencyOption.${CURRENCY_CODE}'
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible:
      id: 'CurrencySelector.SearchInput'
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: 'AccountForm.SelectedCurrency.${CURRENCY_CODE}'
    timeout: 3000

- scrollUntilVisible:
    element:
      id: 'AccountForm.TargetBalanceInput'
    direction: DOWN
- tapOn:
    id: 'AccountForm.TargetBalanceInput'
- eraseText: 100
- inputText: ${TARGET_BALANCE}
- tapOn:
    text: 'TARGET BALANCE'

- scrollUntilVisible:
    element:
      id: 'AccountForm.DebtType.${DEBT_TYPE}'
    direction: DOWN
- tapOn:
    id: 'AccountForm.DebtType.${DEBT_TYPE}'
- scrollUntilVisible:
    element:
      id: 'AccountForm.SubmitButton'
      enabled: true
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: 'AccountForm.SubmitButton'
      enabled: true
    timeout: 3000
- tapOn:
    id: 'AccountForm.SubmitButton'
    enabled: true
    retryTapIfNoChange: true

- extendedWaitUntil:
    visible:
      id: 'HomePage.TotalBalance'
    timeout: 15000

- scrollUntilVisible:
    element:
      id: 'AccountCard.${ACCOUNT_NAME}'
    direction: DOWN

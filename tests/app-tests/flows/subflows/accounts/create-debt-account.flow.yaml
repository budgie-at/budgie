appId: ${APP_ID}
---

- runFlow: open-new-account.flow.yaml

- tapOn:
      id: 'CreateAccount.DEBT'
- waitForAnimationToEnd
- extendedWaitUntil:
      visible:
          id: 'AccountForm.NameInput'
      timeout: 3000

- tapOn:
      id: 'CreateAccount.Amount'
- eraseText: 100
- inputText: ${CURRENT_BALANCE}
- tapOn:
      text: 'Debt Account'

- tapOn:
      id: 'AccountForm.NameInput'
- inputText: ${ACCOUNT_NAME}
- tapOn:
      text: 'ACCOUNT NAME & ICON'

- extendedWaitUntil:
      visible:
          id: 'AccountForm.CurrencySelector'
      timeout: 3000
- tapOn:
      id: 'AccountForm.CurrencySelector'
- waitForAnimationToEnd
- extendedWaitUntil:
      visible:
          id: 'CurrencySelector.SearchInput'
      timeout: 3000
- tapOn:
      id: 'CurrencySelector.SearchInput'
- eraseText: 100
- inputText: ${CURRENCY_CODE}
- extendedWaitUntil:
      visible:
          id: 'AccountForm.CurrencyOption.${CURRENCY_CODE}'
      timeout: 3000
- tapOn:
      id: 'AccountForm.CurrencyOption.${CURRENCY_CODE}'
- waitForAnimationToEnd
- extendedWaitUntil:
      notVisible:
          id: 'CurrencySelector.SearchInput'
      timeout: 3000
- extendedWaitUntil:
      visible:
          id: 'AccountForm.SelectedCurrency.${CURRENCY_CODE}'
      timeout: 3000

- runFlow:
      when:
          true: ${DEBT_TYPE == 'LENT'}
      commands:
          - retry:
                maxRetries: 3
                commands:
                    - scrollUntilVisible:
                          element:
                              id: 'AccountForm.DebtType.LENT'
                          direction: DOWN
                    - tapOn:
                          id: 'AccountForm.DebtType.LENT'
                          retryTapIfNoChange: true
                    - extendedWaitUntil:
                          visible:
                              id: 'AccountForm.DebtType.LENT.Selected'
                          timeout: 1000

- runFlow:
      when:
          true: ${DEBT_TYPE == 'BORROW'}
      commands:
          - retry:
                maxRetries: 3
                commands:
                    - scrollUntilVisible:
                          element:
                              id: 'AccountForm.DebtType.BORROW'
                          direction: DOWN
                    - tapOn:
                          id: 'AccountForm.DebtType.BORROW'
                          retryTapIfNoChange: true
                    - extendedWaitUntil:
                          visible:
                              id: 'AccountForm.DebtType.BORROW.Selected'
                          timeout: 1000

- scrollUntilVisible:
      element:
          id: 'AccountForm.TargetBalanceInput'
      direction: UP
- tapOn:
      id: 'AccountForm.TargetBalanceInput'
- eraseText: 100
- inputText: ${TARGET_BALANCE}
- tapOn:
      text: 'Debt Account'

- extendedWaitUntil:
      visible:
          id: 'AccountForm.SubmitButton'
          enabled: true
      timeout: 3000
- tapOn:
      id: 'AccountForm.SubmitButton'
      enabled: true
      retryTapIfNoChange: true

- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
      timeout: 15000

- scrollUntilVisible:
      element:
          id: 'AccountCard.${ACCOUNT_NAME}'
      direction: DOWN

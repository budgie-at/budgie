appId: ${APP_ID}
---

- runFlow: open-new-account.flow.yaml

- tapOn:
    id: ${ACCOUNT_TYPE_ID}
- extendedWaitUntil:
    visible: 'ACCOUNT NAME & ICON'

- tapOn:
    id: 'AccountForm.NameInput'
- inputText: ${ACCOUNT_NAME}
- hideKeyboard

- scrollUntilVisible:
    element:
      id: 'AccountForm.CurrencySelector'
    direction: DOWN
    centerElement: true
    waitToSettleTimeoutMs: 1000
- tapOn:
    id: 'AccountForm.CurrencySelector'
    retryTapIfNoChange: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'CurrencySelector.SearchInput'
- tapOn:
    id: 'CurrencySelector.SearchInput'
- inputText: ${CURRENCY_CODE}
- tapOn:
    id: 'AccountForm.CurrencyOption.${CURRENCY_CODE}'

- extendedWaitUntil:
    visible:
      id: 'CreateAccount.Amount'
    timeout: 3000
- tapOn:
    id: 'CreateAccount.Amount'
- inputText: ${ACCOUNT_AMOUNT}

- hideKeyboard
- tapOn:
    id: 'AccountForm.SubmitButton'

- extendedWaitUntil:
    visible:
      id: 'AccountCard.${ACCOUNT_NAME}'
    timeout: 3000

appId: ${APP_ID}
---
- tapOn:
    id: 'TransactionForm.TagsSelector'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'TagPickerBottomSheet.Input'
- tapOn:
    id: 'TagPickerBottomSheet.Input'
- inputText: ${TAG_NAME}
- tapOn:
    id: 'TagPickerBottomSheet.CreateButton'
- extendedWaitUntil:
    visible:
      id: 'TagForm.Input'
- tapOn:
    id: 'TagForm.Submit'
- extendedWaitUntil:
    notVisible:
      id: 'TagForm.Input'

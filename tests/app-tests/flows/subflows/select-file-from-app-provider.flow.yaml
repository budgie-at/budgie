appId: ${APP_ID}
env:
    FILE_NAME_MATCH: ${FILE_NAME_MATCH}
    FILE_ROW_ID_MATCH: ${FILE_ROW_ID_MATCH || ''}
    PROVIDER_NAME_MATCH: ${PROVIDER_NAME_MATCH || 'budgie( \\(.*\\))?'}
    PROVIDER_CONTAINER_ID_MATCH: ${PROVIDER_CONTAINER_ID_MATCH || 'budgie( \\(.*\\))?, Container'}
    FIXTURE_FOLDER_NAME_MATCH: ${FIXTURE_FOLDER_NAME_MATCH || 'E2EFixtures'}
    FIXTURE_FOLDER_ROW_MATCH: ${FIXTURE_FOLDER_ROW_MATCH || 'E2EFixtures([,\\n] .*items)?'}
    EXPECT_OPEN_AFTER_FILE_TAP: ${EXPECT_OPEN_AFTER_FILE_TAP || 'false'}
    BROWSE_BUTTON_MATCH: ${BROWSE_BUTTON_MATCH || 'Browse|Durchsuchen'}
    ON_MY_IPHONE_MATCH: ${ON_MY_IPHONE_MATCH || 'On My iPhone|Auf meinem iPhone'}
    OPEN_BUTTON_MATCH: ${OPEN_BUTTON_MATCH || 'Open|Öffnen'}
---
- runFlow:
      when:
          visible: '${BROWSE_BUTTON_MATCH}'
      commands:
          - tapOn:
                text: '${BROWSE_BUTTON_MATCH}'
          - waitForAnimationToEnd

- retry:
      maxRetries: 3
      commands:
          - runFlow:
                when:
                    visible:
                        id: 'BackButton'
                commands:
                    - tapOn:
                          id: 'BackButton'
                    - waitForAnimationToEnd
          - assertNotVisible:
                id: 'BackButton'

- extendedWaitUntil:
      visible: '${ON_MY_IPHONE_MATCH}'
      timeout: 10000

- tapOn:
      text: '${ON_MY_IPHONE_MATCH}'

- waitForAnimationToEnd

- extendedWaitUntil:
      visible:
          id: '${PROVIDER_CONTAINER_ID_MATCH}'
      timeout: 10000

- waitForAnimationToEnd

- scrollUntilVisible:
      element:
          id: '${PROVIDER_CONTAINER_ID_MATCH}'
      direction: DOWN
      timeout: 15000
      speed: 20
      visibilityPercentage: 40
      centerElement: true

- tapOn:
      id: '${PROVIDER_CONTAINER_ID_MATCH}'

- retry:
      maxRetries: 3
      commands:
          - waitForAnimationToEnd
          - runFlow:
                when:
                    visible:
                        id: '${PROVIDER_CONTAINER_ID_MATCH}'
                commands:
                    - tapOn:
                          id: '${PROVIDER_CONTAINER_ID_MATCH}'
                    - waitForAnimationToEnd
          - extendedWaitUntil:
                visible: '${FIXTURE_FOLDER_ROW_MATCH}|${FIXTURE_FOLDER_NAME_MATCH}'
                timeout: 5000

- waitForAnimationToEnd

- scrollUntilVisible:
      element:
          id: '${FIXTURE_FOLDER_NAME_MATCH}, Folder'
      direction: DOWN
      timeout: 15000
      speed: 20
      visibilityPercentage: 40
      centerElement: true

- tapOn:
      id: '${FIXTURE_FOLDER_NAME_MATCH}, Folder'

- retry:
      maxRetries: 3
      commands:
          - waitForAnimationToEnd
          - runFlow:
                when:
                    visible:
                        id: '${FIXTURE_FOLDER_NAME_MATCH}, Folder'
                commands:
                    - tapOn:
                          id: '${FIXTURE_FOLDER_NAME_MATCH}, Folder'
                    - waitForAnimationToEnd

- waitForAnimationToEnd

- runFlow:
      when:
          true: ${FILE_ROW_ID_MATCH !== ''}
      commands:
          - scrollUntilVisible:
                element:
                    id: '${FILE_ROW_ID_MATCH}'
                direction: DOWN
                timeout: 15000
                speed: 20
                visibilityPercentage: 10
                centerElement: false
                waitToSettleTimeoutMs: 500
          - tapOn:
                id: '${FILE_ROW_ID_MATCH}'

- runFlow:
      when:
          true: ${FILE_ROW_ID_MATCH === ''}
      commands:
          - scrollUntilVisible:
                element:
                    text: '${FILE_NAME_MATCH}([,\\n] .*)?'
                direction: DOWN
                timeout: 15000
                speed: 20
                visibilityPercentage: 10
                centerElement: false
                waitToSettleTimeoutMs: 500
          - tapOn:
                text: '${FILE_NAME_MATCH}([,\\n] .*)?'

- waitForAnimationToEnd

- runFlow:
      when:
          true: ${EXPECT_OPEN_AFTER_FILE_TAP === 'true'}
      commands:
          - extendedWaitUntil:
                visible: '${OPEN_BUTTON_MATCH}'
                timeout: 5000
          - tapOn:
                text: '${OPEN_BUTTON_MATCH}'

- runFlow:
      when:
          visible: '${OPEN_BUTTON_MATCH}'
      commands:
          - tapOn:
                text: '${OPEN_BUTTON_MATCH}'

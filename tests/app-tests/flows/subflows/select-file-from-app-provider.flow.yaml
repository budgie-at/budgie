appId: ${APP_ID}
env:
  FILE_NAME_MATCH: ${FILE_NAME_MATCH}
  FILE_ROW_ID_MATCH: ${FILE_ROW_ID_MATCH || ''}
  USE_FILE_ROW_ID_MATCH: ${USE_FILE_ROW_ID_MATCH || 'true'}
  FILE_SCROLL_UP: ${FILE_SCROLL_UP || 'false'}
  FILE_SCROLL_FROM_ID: ${FILE_SCROLL_FROM_ID || ''}
  FILES_GRID_PRIMARY_POINT: ${FILES_GRID_PRIMARY_POINT || '20%,28%'}
  PROVIDER_NAME_MATCH: ${PROVIDER_NAME_MATCH || 'budgie( \\(.*\\))?'}
  PROVIDER_ROW_MATCH: ${PROVIDER_ROW_MATCH || 'budgie( \\(.*\\))?([,\\n] .*items)?'}
  FIXTURE_FOLDER_NAME_MATCH: ${FIXTURE_FOLDER_NAME_MATCH || 'E2EFixtures'}
  FIXTURE_FOLDER_ROW_MATCH: ${FIXTURE_FOLDER_ROW_MATCH || 'E2EFixtures([,\\n] .*items)?'}
  EXPECT_OPEN_AFTER_FILE_TAP: ${EXPECT_OPEN_AFTER_FILE_TAP || 'false'}
---
- runFlow:
    when:
      visible: 'No Recents'
    commands:
      - tapOn: 'Browse'

- runFlow:
    when:
      visible: 'Browse'
    commands:
      - tapOn: 'Browse'

- runFlow:
    when:
      visible: 'On My iPhone'
    commands:
      - tapOn: 'On My iPhone'
      - extendedWaitUntil:
          visible:
            text: '${PROVIDER_NAME_MATCH}'
          timeout: 15000
      - retry:
          maxRetries: 3
          commands:
            - runFlow:
                when:
                  visible: '${PROVIDER_NAME_MATCH}'
                commands:
                  - tapOn:
                      point: '${FILES_GRID_PRIMARY_POINT}'
            - extendedWaitUntil:
                visible: '${FIXTURE_FOLDER_NAME_MATCH}|${FILE_NAME_MATCH}([,\\n] .*)?'
                timeout: 5000

- runFlow:
    when:
      visible: '${FIXTURE_FOLDER_NAME_MATCH}'
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn:
                point: '${FILES_GRID_PRIMARY_POINT}'
            - extendedWaitUntil:
                visible: '${FILE_NAME_MATCH}([,\\n] .*)?'
                timeout: 5000

- runFlow:
    when:
      true: ${FILE_SCROLL_UP === 'true'}
    commands:
      - runFlow:
          when:
            true: ${FILE_SCROLL_FROM_ID !== ''}
          commands:
            - swipe:
                from:
                  id: '${FILE_SCROLL_FROM_ID}'
                direction: UP
            - swipe:
                from:
                  id: '${FILE_SCROLL_FROM_ID}'
                direction: UP
      - runFlow:
          when:
            true: ${FILE_SCROLL_FROM_ID === ''}
          commands:
            - swipe:
                from:
                  point: '50%,75%'
                direction: UP
            - swipe:
                from:
                  point: '50%,75%'
                direction: UP

- runFlow:
    when:
      true: ${USE_FILE_ROW_ID_MATCH === 'true' && FILE_ROW_ID_MATCH !== ''}
    commands:
      - scrollUntilVisible:
          element:
            id: '${FILE_ROW_ID_MATCH}'
          direction: DOWN
          timeout: 15000
          speed: 20
          visibilityPercentage: 50
          centerElement: true
      - tapOn:
          id: '${FILE_ROW_ID_MATCH}'

- runFlow:
    when:
      true: ${USE_FILE_ROW_ID_MATCH !== 'true' || FILE_ROW_ID_MATCH === ''}
    commands:
      - scrollUntilVisible:
          element:
            text: '${FILE_NAME_MATCH}([,\\n] .*)?'
          direction: DOWN
          timeout: 15000
          speed: 20
          visibilityPercentage: 50
          centerElement: true
      - tapOn:
          text: '${FILE_NAME_MATCH}([,\\n] .*)?'

- runFlow:
    when:
      true: ${EXPECT_OPEN_AFTER_FILE_TAP === 'true'}
    commands:
      - extendedWaitUntil:
          visible: 'Open'
          timeout: 5000
      - tapOn: 'Open'

- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'

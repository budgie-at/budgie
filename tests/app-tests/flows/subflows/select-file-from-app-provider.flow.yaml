appId: ${APP_ID}
env:
  FILE_NAME_MATCH: ${FILE_NAME_MATCH}
  FILE_ROW_ID_MATCH: ${FILE_ROW_ID_MATCH || ''}
  FILE_PICK_POINT: ${FILE_PICK_POINT || ''}
  FILE_PICK_SCROLL_UP: ${FILE_PICK_SCROLL_UP || 'false'}
  FILE_PICK_SCROLL_FROM_ID: ${FILE_PICK_SCROLL_FROM_ID || ''}
  FILE_SEARCH_QUERY: ${FILE_SEARCH_QUERY || ''}
  PROVIDER_NAME_MATCH: ${PROVIDER_NAME_MATCH || 'budgie( \\(.*\\))?'}
  EXPECT_OPEN_AFTER_FILE_TAP: ${EXPECT_OPEN_AFTER_FILE_TAP || 'false'}
---
- runFlow:
    when:
      visible: 'No Recents'
    commands:
      - tapOn: 'Browse'

- runFlow:
    when:
      visible: 'Browse'
    commands:
      - tapOn: 'Browse'

- runFlow:
    when:
      visible: 'On My iPhone'
    commands:
      - tapOn: 'On My iPhone'
      - extendedWaitUntil:
          visible:
            text: '${PROVIDER_NAME_MATCH}'
          timeout: 15000
      - tapOn:
          text: '${PROVIDER_NAME_MATCH}'

- runFlow:
    when:
      visible: 'E2EFixtures'
    commands:
      - tapOn:
          text: 'E2EFixtures, .*items'

- runFlow:
    when:
      true: ${FILE_SEARCH_QUERY !== ''}
    commands:
      - tapOn: 'Search'
      - inputText: '${FILE_SEARCH_QUERY}'
      - pressKey: Enter
      - waitForAnimationToEnd
      - tapOn:
          point: '21%,37%'

- runFlow:
    when:
      true: ${FILE_PICK_POINT !== ''}
    commands:
      - runFlow:
          when:
            true: ${FILE_PICK_SCROLL_UP === 'true'}
          commands:
            - runFlow:
                when:
                  true: ${FILE_PICK_SCROLL_FROM_ID !== ''}
                commands:
                  - swipe:
                      from:
                        id: '${FILE_PICK_SCROLL_FROM_ID}'
                      direction: UP
                  - swipe:
                      from:
                        id: '${FILE_PICK_SCROLL_FROM_ID}'
                      direction: UP
            - runFlow:
                when:
                  true: ${FILE_PICK_SCROLL_FROM_ID === ''}
                commands:
                  - swipe:
                      from:
                        point: '50%,75%'
                      direction: UP
                  - swipe:
                      from:
                        point: '50%,75%'
                      direction: UP
      - tapOn:
          point: '${FILE_PICK_POINT}'

- runFlow:
    when:
      true: ${FILE_ROW_ID_MATCH !== '' && FILE_SEARCH_QUERY === '' && FILE_PICK_POINT === ''}
    commands:
      - scrollUntilVisible:
          element:
            id: '${FILE_ROW_ID_MATCH}'
          direction: DOWN
          timeout: 15000
          speed: 20
          visibilityPercentage: 50
          centerElement: true
      - tapOn:
          id: '${FILE_ROW_ID_MATCH}'

- runFlow:
    when:
      true: ${FILE_ROW_ID_MATCH === '' && FILE_SEARCH_QUERY === '' && FILE_PICK_POINT === ''}
    commands:
      - scrollUntilVisible:
          element:
            text: '${FILE_NAME_MATCH}'
          direction: DOWN
          timeout: 15000
          speed: 20
          visibilityPercentage: 50
          centerElement: true
      - tapOn:
          text: '${FILE_NAME_MATCH}'

- runFlow:
    when:
      true: ${EXPECT_OPEN_AFTER_FILE_TAP === 'true'}
    commands:
      - extendedWaitUntil:
          visible: 'Open'
          timeout: 5000
      - tapOn: 'Open'

- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'

appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: 'TransactionInfo.Page'
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: 'TransactionActionsMenu.TriggerButton'
    timeout: 20000
- tapOn:
    id: 'TransactionActionsMenu.TriggerButton'
- extendedWaitUntil:
    visible:
      id: 'TransactionActionsMenu.DeleteButton'

- tapOn:
    id: 'TransactionActionsMenu.DeleteButton'
- waitForAnimationToEnd
- runFlow: confirm-delete-dialog.flow.yaml

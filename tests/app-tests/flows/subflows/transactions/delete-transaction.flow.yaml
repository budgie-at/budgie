appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: 'TransactionInfo.Page'
    timeout: 20000
- scrollUntilVisible:
    element:
      id: 'TransactionActionsMenu.DeleteButton'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'TransactionActionsMenu.DeleteButton'
- runFlow: confirm-delete-dialog.flow.yaml

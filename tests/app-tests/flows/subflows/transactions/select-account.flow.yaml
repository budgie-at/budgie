appId: ${APP_ID}
---
- evalScript: ${output.accountAlreadySelected = false}
- runFlow:
      when:
          visible: ${ACCOUNT_NAME}
      commands:
          - evalScript: ${output.accountAlreadySelected = true}
- runFlow:
      when:
          true: ${!output.accountAlreadySelected}
      commands:
          - retry:
                maxRetries: 3
                commands:
                    - tapOn:
                          id: 'TransactionForm.AccountSelector'
                    - extendedWaitUntil:
                          visible:
                              id: 'AccountPickerBottomSheet.Input'
                          timeout: 3000
          - runFlow:
                file: ../shared/select-account-by-search.flow.yaml
                env:
                    ACCOUNT_NAME: ${ACCOUNT_NAME}

appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: 'TransactionForm.CommentInput'
    timeout: 10000
- tapOn:
    id: 'TransactionForm.CommentInput'
- extendedWaitUntil:
    visible:
      id: 'NoteInput.Input'
    timeout: 5000
- tapOn:
    id: 'NoteInput.Input'
- inputText: ${COMMENT}
- tapOn:
    id: 'NoteInput.SubmitButton'
- extendedWaitUntil:
    notVisible:
      id: 'NoteInput.Input'
    timeout: 5000
- waitForAnimationToEnd

appId: ${APP_ID}
---
- tapOn:
    id: 'TransactionForm.CommentInput'
- waitForAnimationToEnd

- runFlow:
    when:
      notVisible:
        id: 'NoteInput.Input'
    commands:
      - tapOn:
          point: '50%,50%'
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'NoteInput.Input'
    timeout: 5000
- tapOn:
    id: 'NoteInput.Input'
- inputText: ${COMMENT}
- tapOn:
    point: '90%,57%'

appId: ${APP_ID}
---
- tapOn:
    id: 'TransactionForm.CommentInput'
- extendedWaitUntil:
    visible:
      id: 'NoteInput.Input'
    timeout: 5000
- tapOn:
    id: 'NoteInput.Input'
    point: '95%,90%'
- eraseText: 255
- inputText: ${COMMENT}
- tapOn:
    id: 'NoteInput.SubmitButton'
- extendedWaitUntil:
    notVisible:
      id: 'NoteInput.Input'
    timeout: 5000

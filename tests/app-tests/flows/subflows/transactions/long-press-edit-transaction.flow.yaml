appId: ${APP_ID}
---
- runFlow:
      file: long-press-transaction-action.flow.yaml
      env:
          TRANSACTION_CARD_ID: ${TRANSACTION_CARD_ID}
          ACTION_BUTTON_ID: 'TransactionContextMenu.EditButton'
- extendedWaitUntil:
      visible:
          id: 'TransactionInfo.EditButton.Label'
      timeout: 10000
- tapOn:
      id: 'TransactionInfo.EditButton.Label'

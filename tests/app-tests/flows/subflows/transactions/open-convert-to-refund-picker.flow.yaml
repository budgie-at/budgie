appId: ${APP_ID}
env:
    TRANSACTION_ID: ${TRANSACTION_ID}
    CANDIDATE_ROW_ID: ${CANDIDATE_ROW_ID}
---
- runFlow:
      file: ../navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://transactions/${TRANSACTION_ID}/income'

- extendedWaitUntil:
      visible:
          id: 'TransactionInfo.Page'
      timeout: 15000

- scrollUntilVisible:
    element:
      id: 'TransactionInfo.ConvertButton'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
      id: 'TransactionInfo.ConvertButton'
- extendedWaitUntil:
      visible:
          id: 'TransactionActionsMenu.ConvertToRefundButton'
      timeout: 5000

- tapOn:
      id: 'TransactionActionsMenu.ConvertToRefundButton'

- extendedWaitUntil:
      visible:
          id: '${CANDIDATE_ROW_ID}'
      timeout: 15000

appId: ${APP_ID}
env:
    TRANSACTION_ID: ${TRANSACTION_ID}
---
- runFlow:
      file: ../navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://transactions/${TRANSACTION_ID}/expense'

- extendedWaitUntil:
      visible:
          id: 'TransactionInfo.Page'
      timeout: 15000

- scrollUntilVisible:
    element:
      id: 'TransactionInfo.ConvertButton'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
      id: 'TransactionInfo.ConvertButton'
- tapOn:
      text: 'Pay in parts'

- extendedWaitUntil:
      visible:
          id: 'ConvertToInstallment.Page'
      timeout: 10000

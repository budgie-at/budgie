# Manual: Face ID enrolled and `notifyutil -p com.apple.BiometricKit_Sim.fingerTouch.match` posted repeatedly from the host
appId: ${APP_ID}
---
- runFlow:
      file: ../import/import-database-from-settings.flow.yaml
      env:
          FIXTURE_ROW_ID_MATCH: '17.db'

- runFlow: ../navigation/navigate-to-settings.flow.yaml

- runFlow:
      file: ../navigation/open-settings-card.flow.yaml
      env:
          CARD_ID: 'SettingsPage.AppLockCard'
          DESTINATION_ID: 'PinPage.Container'

- tapOn:
      id: 'PinPage.Digit.1'
- tapOn:
      id: 'PinPage.Digit.2'
- tapOn:
      id: 'PinPage.Digit.3'
- tapOn:
      id: 'PinPage.Digit.4'

- extendedWaitUntil:
      visible: 'Confirm PIN'
      timeout: 5000

- tapOn:
      id: 'PinPage.Digit.1'
- tapOn:
      id: 'PinPage.Digit.2'
- tapOn:
      id: 'PinPage.Digit.3'
- tapOn:
      id: 'PinPage.Digit.4'

- extendedWaitUntil:
      visible:
          id: 'PinPage.BiometricSetupSwitch'
      timeout: 8000

- tapOn:
      id: 'PinPage.ContinueButton'

- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
      timeout: 90000

- assertNotVisible:
      id: 'PinPage.Container'

- runFlow: ../navigation/navigate-to-settings.flow.yaml

- extendedWaitUntil:
      visible:
          id: 'SettingsPage.DataEncryption.State.On'
      timeout: 5000

- scrollUntilVisible:
      element:
          id: 'SettingsPage.AppLockBiometricSwitch'
      direction: DOWN
      centerElement: true

- pressKey: HOME
- launchApp:
      stopApp: false
- extendedWaitUntil:
      visible:
          id: 'SettingsPage.Container'
      timeout: 10000
- assertNotVisible:
      id: 'PinPage.Container'

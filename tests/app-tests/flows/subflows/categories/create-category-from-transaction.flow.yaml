appId: ${APP_ID}
---
- runFlow:
    file: ../shared/create-entity-from-transaction.flow.yaml
    env:
      SELECTOR_ID: 'TransactionForm.CategorySelector'
      PICKER_INPUT_ID: 'CategoryPickerBottomSheet.Input'
      ENTITY_NAME: ${CATEGORY_NAME}
      CREATE_BUTTON_ID: 'CategoryPickerBottomSheet.CreateButton'
      FORM_INPUT_ID: 'CategoryForm.Input'
      SUBMIT_BUTTON_ID: 'CategoryForm.Submit'

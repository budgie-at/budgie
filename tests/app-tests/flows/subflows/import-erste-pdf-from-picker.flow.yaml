appId: ${APP_ID}
env:
  PDF_NAME_MATCH: ${PDF_NAME_MATCH}
  PDF_SCROLL_UP: ${PDF_SCROLL_UP || 'false'}
  PDF_SCROLL_FROM_ID: ${PDF_SCROLL_FROM_ID || ''}
  PDF_ROW_ID_MATCH: ${PDF_ROW_ID_MATCH || ''}
  PROVIDER_NAME_MATCH: ${PROVIDER_NAME_MATCH || 'budgie( \\(.*\\))?'}
---
- extendedWaitUntil:
    visible:
      text: 'Select File|Datei auswählen'
    timeout: 10000

- tapOn:
    text: 'Select File|Datei auswählen'

- runFlow:
    file: select-file-from-app-provider.flow.yaml
    env:
      FILE_NAME_MATCH: ${PDF_NAME_MATCH}
      FILE_SCROLL_UP: ${PDF_SCROLL_UP}
      FILE_SCROLL_FROM_ID: ${PDF_SCROLL_FROM_ID}
      FILE_ROW_ID_MATCH: ${PDF_ROW_ID_MATCH}
      PROVIDER_NAME_MATCH: ${PROVIDER_NAME_MATCH}

- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            true: ${PDF_ROW_ID_MATCH !== ''}
          commands:
            - runFlow:
                when:
                  visible:
                    id: '${PDF_ROW_ID_MATCH}'
                commands:
                  - tapOn:
                      id: '${PDF_ROW_ID_MATCH}'
      - runFlow:
          when:
            true: ${PDF_ROW_ID_MATCH === ''}
          commands:
            - runFlow:
                when:
                  visible:
                    text: '${PDF_NAME_MATCH}'
                commands:
                  - tapOn:
                      text: '${PDF_NAME_MATCH}'
      - extendedWaitUntil:
          visible:
            id: 'SyncAccountSelection.Row.Erste_EUR'
          timeout: 5000

- tapOn:
    id: 'SyncAccountSelection.Row.Erste_EUR'

- extendedWaitUntil:
    visible:
      text: 'Start Sync|Synchronisation starten'
    timeout: 15000

- tapOn:
      text: 'Start Sync|Synchronisation starten'

- runFlow:
      when:
          visible: 'Already syncing|Synchronisiert bereits'
      commands:
          - tapOn:
                id: 'PageHeader.BackButton'

- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
      timeout: 30000

- waitForAnimationToEnd

appId: ${APP_ID}
env:
  HANDLE_DEV_CLIENT_STARTUP: ${HANDLE_DEV_CLIENT_STARTUP || 'false'}
---
- openLink: 'budgie://settings?anchor=clear-data'

- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'

- runFlow:
    when:
      notVisible:
        id: 'SettingsPage.ClearDataCard'
    commands:
      - tapOn:
          id: 'TabBar.Settings'
      - waitForAnimationToEnd
      - tapOn:
          id: 'TabBar.Settings'
      - extendedWaitUntil:
          visible:
            id: 'SettingsPage.Container'
          timeout: 10000
      - scrollUntilVisible:
          element:
            id: 'SettingsPage.ClearDataCard'
          direction: DOWN
          centerElement: true

- extendedWaitUntil:
    visible:
      id: 'SettingsPage.ClearDataCard'
    timeout: 15000

- waitForAnimationToEnd

- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: 'SettingsPage.ClearDataCard'
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: 'Delete data|Daten löschen'
          timeout: 5000

- runFlow:
    when:
      visible: 'Delete data|Daten löschen'
    commands:
      - tapOn:
          text: 'Delete data|Daten löschen'

- runFlow:
    file: relaunch-app.flow.yaml
    env:
      HANDLE_DEV_CLIENT_STARTUP: ${HANDLE_DEV_CLIENT_STARTUP}

- extendedWaitUntil:
    visible: 'No accounts yet|Noch keine Konten'
    timeout: 15000

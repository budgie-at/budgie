appId: ${APP_ID}
---

- tapOn:
    id: 'CreateAccount.Amount'
- eraseText: 100
- inputText: ${NEW_BALANCE}
- waitForAnimationToEnd
- assertVisible: ${NEW_BALANCE}

- tapOn: 'Account Settings'
- hideKeyboard
- tapOn:
    id: 'AccountForm.SubmitButton'

- extendedWaitUntil:
    visible:
      id: 'HomePage.TotalBalance'
    timeout: 10000

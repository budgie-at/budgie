appId: ${APP_ID}
---

- runFlow:
    file: open-account-details.flow.yaml
    env:
      ACCOUNT_NAME: ${ACCOUNT_NAME}

- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'TransactionCard.Badge.Adjustment'
    timeout: 10000
- assertVisible:
    id: 'TransactionCard.AdjustmentAmount.${INITIAL_AMOUNT}'

- runFlow:
    file: open-account-settings.flow.yaml
    env:
      ACCOUNT_NAME: ${ACCOUNT_NAME}

- runFlow:
    file: rename-account.flow.yaml
    env:
      UPDATED_ACCOUNT_NAME: ${UPDATED_ACCOUNT_NAME}

- runFlow:
    file: open-account-details.flow.yaml
    env:
      ACCOUNT_NAME: ${UPDATED_ACCOUNT_NAME}

- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'TransactionCard.AdjustmentAmount.${INITIAL_AMOUNT}'
    timeout: 10000

- runFlow:
    file: open-account-settings.flow.yaml
    env:
      ACCOUNT_NAME: ${UPDATED_ACCOUNT_NAME}

- runFlow:
    file: update-account-balance.flow.yaml
    env:
      NEW_BALANCE: ${INCREASE_TO}

- runFlow:
    file: open-account-details.flow.yaml
    env:
      ACCOUNT_NAME: ${UPDATED_ACCOUNT_NAME}

- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'TransactionCard.Badge.Adjustment'
    timeout: 10000
- assertVisible:
    id: 'TransactionCard.AdjustmentAmount.${INCREASE_DELTA}'

- runFlow:
    file: open-account-settings.flow.yaml
    env:
      ACCOUNT_NAME: ${UPDATED_ACCOUNT_NAME}

- runFlow:
    file: update-account-balance.flow.yaml
    env:
      NEW_BALANCE: ${DECREASE_TO}

- runFlow:
    file: open-account-details.flow.yaml
    env:
      ACCOUNT_NAME: ${UPDATED_ACCOUNT_NAME}

- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'TransactionCard.Badge.Adjustment'
    timeout: 10000
- assertVisible:
    id: 'TransactionCard.AdjustmentAmount.${INCREASE_DELTA}'
- assertVisible:
    id: 'TransactionCard.AdjustmentAmount.${DECREASE_DELTA}'

- runFlow: exit-account-details-to-home.flow.yaml

- runFlow:
    file: set-main-currency.flow.yaml
    env:
      CURRENCY_CODE: ${CURRENCY_CODE}

- extendedWaitUntil:
    visible:
      id: 'HomePage.NetWorthValue.${DECREASE_TO}'
    timeout: 10000
- assertVisible:
    id: 'AccountCard.${UPDATED_ACCOUNT_NAME}'

- runFlow:
    file: open-account-settings.flow.yaml
    env:
      ACCOUNT_NAME: ${UPDATED_ACCOUNT_NAME}

- scrollUntilVisible:
    element:
      id: 'AccountForm.ActiveTitle'
    direction: DOWN
- waitForAnimationToEnd
- assertVisible:
    id: 'AccountForm.ActiveTitle'
- tapOn:
    id: 'AccountForm.ActiveTitle'
- tapOn:
    id: 'AccountForm.SubmitButton'

- extendedWaitUntil:
    visible:
      id: 'HomePage.NetWorthValue.${DECREASE_TO}'
    timeout: 10000

- assertNotVisible:
    id: 'AccountCard.${UPDATED_ACCOUNT_NAME}'

- runFlow:
    file: open-inactive-accounts.flow.yaml

- extendedWaitUntil:
    visible:
      id: 'InactiveAccountCard.${UPDATED_ACCOUNT_NAME}'
    timeout: 10000
- tapOn:
    id: 'InactiveAccountCard.ActivateButton.${UPDATED_ACCOUNT_NAME}'
- tapOn: 'Activate'
- tapOn:
    id: 'TabBar.Home'

- extendedWaitUntil:
    visible:
      id: 'HomePage.NetWorthValue.${DECREASE_TO}'
    timeout: 10000

- scrollUntilVisible:
    element:
      id: 'AccountCard.${UPDATED_ACCOUNT_NAME}'
    direction: DOWN
    timeout: 15000

- runFlow:
    file: open-account-settings.flow.yaml
    env:
      ACCOUNT_NAME: ${UPDATED_ACCOUNT_NAME}

- scrollUntilVisible:
    element:
      id: 'AccountForm.IncludeInNetWorthTitle'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- assertVisible:
    id: 'AccountForm.IncludeInNetWorthTitle'
- tapOn:
    id: 'AccountForm.IncludeInNetWorthTitle'
- tapOn:
    id: 'AccountForm.SubmitButton'

- extendedWaitUntil:
    visible:
      id: 'HomePage.NetWorthValue.0'
    timeout: 10000

- scrollUntilVisible:
    element:
      id: 'AccountCard.${UPDATED_ACCOUNT_NAME}'
    direction: DOWN
    timeout: 15000

- runFlow:
    file: open-account-settings.flow.yaml
    env:
      ACCOUNT_NAME: ${UPDATED_ACCOUNT_NAME}

- scrollUntilVisible:
    element:
      id: 'AccountForm.IncludeInNetWorthTitle'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- assertVisible:
    id: 'AccountForm.IncludeInNetWorthTitle'
- tapOn:
    id: 'AccountForm.IncludeInNetWorthTitle'
- tapOn:
    id: 'AccountForm.SubmitButton'

- extendedWaitUntil:
    visible:
      id: 'HomePage.NetWorthValue.${DECREASE_TO}'
    timeout: 10000

- runFlow:
    file: open-account-settings.flow.yaml
    env:
      ACCOUNT_NAME: ${UPDATED_ACCOUNT_NAME}

- scrollUntilVisible:
    element:
      id: 'AccountDetails.ArchiveButton'
    direction: DOWN
- waitForAnimationToEnd
- tapOn:
    id: 'AccountDetails.ArchiveButton'
- tapOn: 'Archive'

- extendedWaitUntil:
    visible:
      id: 'HomePage.NetWorthValue.0'
    timeout: 10000

- assertNotVisible:
    id: 'AccountCard.${UPDATED_ACCOUNT_NAME}'

- runFlow:
    file: open-archived-accounts.flow.yaml

- extendedWaitUntil:
    visible:
      id: 'ArchivedAccountCard.${UPDATED_ACCOUNT_NAME}'
    timeout: 10000

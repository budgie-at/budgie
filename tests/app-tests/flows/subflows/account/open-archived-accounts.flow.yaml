appId: ${APP_ID}
---

- runFlow: ../navigate-to-settings.flow.yaml

- scrollUntilVisible:
    element:
      id: 'SettingsPage.ArchivedCard'
    direction: DOWN
    speed: 20
- tapOn:
    id: 'SettingsPage.ArchivedCard'
- extendedWaitUntil:
    visible:
      id: 'ArchivedAccountsPage.Container'
    timeout: 10000

appId: ${APP_ID}
---

- setPermissions:
    permissions:
      contacts: allow

- scrollUntilVisible:
    element:
      id: 'AccountForm.ContactSelector'
    direction: DOWN

- tapOn:
    id: 'AccountForm.ContactSelector'
- tapOn: 'Search contacts...'
- inputText: ${CONTACT_NAME}
- extendedWaitUntil:
    visible:
      id: 'AccountForm.ContactOption.${CONTACT_NAME_ID}'
    timeout: 10000
- tapOn:
    id: 'AccountForm.ContactOption.${CONTACT_NAME_ID}'
- assertVisible:
    id: 'AccountForm.SelectedContact.${CONTACT_NAME_ID}'

- scrollUntilVisible:
    element:
      id: 'AccountForm.ReturnDate'
    direction: DOWN

- tapOn:
    id: 'AccountForm.ReturnDate'
- extendedWaitUntil:
    visible: '${RETURN_DAY}'
    timeout: 10000
- tapOn: '${RETURN_DAY}'

- assertVisible: '${RETURN_DATE_LABEL}'

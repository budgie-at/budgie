appId: ${APP_ID}
---

- runFlow: ../navigate-to-settings.flow.yaml

- scrollUntilVisible:
    element:
      id: 'SettingsPage.InactiveCard'
    direction: DOWN
    speed: 20
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'SettingsPage.InactiveCard'
- extendedWaitUntil:
    visible:
      id: 'InactiveAccountsPage.Container'
    timeout: 10000

appId: ${APP_ID}
env:
  HANDLE_DEV_CLIENT_STARTUP: ${HANDLE_DEV_CLIENT_STARTUP || 'false'}
  USE_APP_OWNED_RESET: ${USE_APP_OWNED_RESET || 'false'}
  E2E_RUN_TOKEN: ${E2E_RUN_TOKEN || 'local'}
---

- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            true: ${USE_APP_OWNED_RESET === 'true'}
          commands:
            - launchApp:
                appId: ${APP_ID}
                clearState: false
                permissions:
                  contacts: allow
                  microphone: allow
                arguments:
                  e2eReset: true
                  e2eResetToken: '${MAESTRO_FILENAME}-${E2E_RUN_TOKEN}'
            - retry:
                maxRetries: 3
                commands:
                  - runFlow: handle-dev-client-startup.flow.yaml
                  - waitForAnimationToEnd

      - runFlow:
          when:
            true: ${USE_APP_OWNED_RESET !== 'true'}
          commands:
            - clearState
            - launchApp:
                permissions:
                  contacts: allow
                  microphone: allow
            - retry:
                maxRetries: 3
                commands:
                  - runFlow: handle-dev-client-startup.flow.yaml
                  - waitForAnimationToEnd

      - extendedWaitUntil:
          visible:
            id: 'HomePage.TotalBalance'
          timeout: 60000

- waitForAnimationToEnd

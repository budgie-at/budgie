appId: ${APP_ID}
env:
  HANDLE_DEV_CLIENT_STARTUP: ${HANDLE_DEV_CLIENT_STARTUP || 'false'}
  USE_APP_OWNED_RESET: ${USE_APP_OWNED_RESET || 'false'}
  E2E_RUN_TOKEN: ${E2E_RUN_TOKEN || 'local'}
---

- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            true: ${USE_APP_OWNED_RESET === 'true'}
          commands:
            - stopApp
            - openLink: 'budgie://?e2eReset=true&e2eResetToken=${MAESTRO_FILENAME}-${E2E_RUN_TOKEN}'
            - runFlow:
                when:
                  visible: 'Open'
                commands:
                  - tapOn: 'Open'

            - runFlow:
                when:
                  true: ${HANDLE_DEV_CLIENT_STARTUP === 'true'}
                file: handle-dev-client-startup.flow.yaml

      - runFlow:
          when:
            true: ${USE_APP_OWNED_RESET !== 'true'}
          commands:
            - clearState
            - launchApp

            - runFlow:
                when:
                  true: ${HANDLE_DEV_CLIENT_STARTUP === 'true'}
                file: handle-dev-client-startup.flow.yaml

      - extendedWaitUntil:
          visible:
            id: 'HomePage.TotalBalance'
          timeout: 60000

- waitForAnimationToEnd

appId: ${APP_ID}
---

- clearState
- launchApp:
    permissions:
      contacts: allow

- runFlow:
    when:
      visible:
        text: 'Open'
        enabled: true
    commands:
      - tapOn:
          point: '66%,53%'

- runFlow:
    when:
      visible: 'http://localhost:8081'
    commands:
      - tapOn: 'http://localhost:8081'

- runFlow:
    when:
      visible: '.*:8081.*'
    commands:
      - tapOn:
          text: '.*:8081.*'

- waitForAnimationToEnd

- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'

- waitForAnimationToEnd

- runFlow:
    when:
      visible: 'Close'
    commands:
      - tapOn: 'Close'

- extendedWaitUntil:
    visible: 'TOTAL BALANCE'
    timeout: 60000

appId: ${APP_ID}
---
- tapOn:
    id: 'TransactionForm.AccountSelector'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'AccountPickerBottomSheet.Input'
- tapOn:
    id: 'AccountPickerBottomSheet.Input'
- inputText: ${ACCOUNT_NAME}
- extendedWaitUntil:
    visible: ${ACCOUNT_NAME}
- tapOn:
    text: ${ACCOUNT_NAME}
    index: 1

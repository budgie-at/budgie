appId: ${APP_ID}
env:
  PDF_NAME_MATCH: ${PDF_NAME_MATCH}
  PDF_SCROLL_UP: ${PDF_SCROLL_UP || 'false'}
  PDF_SCROLL_FROM_ID: ${PDF_SCROLL_FROM_ID || ''}
  PDF_ROW_ID_MATCH: ${PDF_ROW_ID_MATCH || ''}
  PROVIDER_NAME_MATCH: ${PROVIDER_NAME_MATCH || 'budgie( \\(.*\\))?'}
---
- runFlow:
    file: select-file-from-app-provider.flow.yaml
    env:
      FILE_NAME_MATCH: ${PDF_NAME_MATCH}
      FILE_SCROLL_UP: ${PDF_SCROLL_UP}
      FILE_SCROLL_FROM_ID: ${PDF_SCROLL_FROM_ID}
      FILE_ROW_ID_MATCH: ${PDF_ROW_ID_MATCH}
      PROVIDER_NAME_MATCH: ${PROVIDER_NAME_MATCH}

- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            true: ${PDF_ROW_ID_MATCH !== ''}
          commands:
            - runFlow:
                when:
                  visible:
                    id: '${PDF_ROW_ID_MATCH}'
                commands:
                  - tapOn:
                      id: '${PDF_ROW_ID_MATCH}'
      - runFlow:
          when:
            true: ${PDF_ROW_ID_MATCH === ''}
          commands:
            - runFlow:
                when:
                  visible:
                    text: '${PDF_NAME_MATCH}'
                commands:
                  - tapOn:
                      text: '${PDF_NAME_MATCH}'
      - extendedWaitUntil:
          visible:
            id: 'HomePage.TotalBalance'
          timeout: 10000

- waitForAnimationToEnd

appId: ${APP_ID}
env:
  PDF_NAME_MATCH: ${PDF_NAME_MATCH}
  PDF_PICK_POINT: ${PDF_PICK_POINT || ''}
  PDF_PICK_SCROLL_UP: ${PDF_PICK_SCROLL_UP || 'false'}
  PDF_PICK_SCROLL_FROM_ID: ${PDF_PICK_SCROLL_FROM_ID || ''}
  PDF_ROW_ID_MATCH: ${PDF_ROW_ID_MATCH || ''}
  PDF_SEARCH_QUERY: ${PDF_SEARCH_QUERY || ''}
  PROVIDER_NAME_MATCH: ${PROVIDER_NAME_MATCH || 'budgie( \\(.*\\))?'}
---
- runFlow:
    file: select-file-from-app-provider.flow.yaml
    env:
      FILE_NAME_MATCH: ${PDF_NAME_MATCH}
      FILE_PICK_POINT: ${PDF_PICK_POINT}
      FILE_PICK_SCROLL_UP: ${PDF_PICK_SCROLL_UP}
      FILE_PICK_SCROLL_FROM_ID: ${PDF_PICK_SCROLL_FROM_ID}
      FILE_ROW_ID_MATCH: ${PDF_ROW_ID_MATCH}
      FILE_SEARCH_QUERY: ${PDF_SEARCH_QUERY}
      PROVIDER_NAME_MATCH: ${PROVIDER_NAME_MATCH}

- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            true: ${PDF_PICK_POINT !== ''}
          commands:
            - runFlow:
                when:
                  visible: 'Search|E2EFixtures'
                commands:
                  - runFlow:
                      when:
                        true: ${PDF_PICK_SCROLL_UP === 'true'}
                      commands:
                        - runFlow:
                            when:
                              true: ${PDF_PICK_SCROLL_FROM_ID !== ''}
                            commands:
                              - swipe:
                                  from:
                                    id: '${PDF_PICK_SCROLL_FROM_ID}'
                                  direction: UP
                              - swipe:
                                  from:
                                    id: '${PDF_PICK_SCROLL_FROM_ID}'
                                  direction: UP
                        - runFlow:
                            when:
                              true: ${PDF_PICK_SCROLL_FROM_ID === ''}
                            commands:
                              - swipe:
                                  from:
                                    point: '50%,75%'
                                  direction: UP
                              - swipe:
                                  from:
                                    point: '50%,75%'
                                  direction: UP
                  - tapOn:
                      point: '${PDF_PICK_POINT}'
      - runFlow:
          when:
            true: ${PDF_ROW_ID_MATCH !== ''}
          commands:
            - runFlow:
                when:
                  visible:
                    id: '${PDF_ROW_ID_MATCH}'
                commands:
                  - tapOn:
                      id: '${PDF_ROW_ID_MATCH}'
      - runFlow:
          when:
            true: ${PDF_ROW_ID_MATCH === ''}
          commands:
            - runFlow:
                when:
                  visible:
                    text: '${PDF_NAME_MATCH}'
                commands:
                  - tapOn:
                      text: '${PDF_NAME_MATCH}'
      - extendedWaitUntil:
          visible:
            id: 'HomePage.TotalBalance'
          timeout: 10000

- waitForAnimationToEnd

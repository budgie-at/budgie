appId: ${APP_ID}
env:
  FIXTURE_FILE: ${FIXTURE_FILE}
  FIXTURE_ROW_ID_MATCH: ${FIXTURE_ROW_ID_MATCH || ''}
  PROVIDER_NAME_MATCH: ${PROVIDER_NAME_MATCH || 'budgie( \\(.*\\))?'}
  HANDLE_DEV_CLIENT_STARTUP: ${HANDLE_DEV_CLIENT_STARTUP || 'false'}
---
- openLink: 'budgie://settings?anchor=data'
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'

- extendedWaitUntil:
    visible:
      id: 'SettingsPage.ImportDatabaseCard'
    timeout: 15000

- tapOn:
    id: 'SettingsPage.ImportDatabaseCard'

- runFlow:
    file: select-file-from-app-provider.flow.yaml
    env:
      FILE_NAME_MATCH: ${FIXTURE_FILE}
      FILE_ROW_ID_MATCH: ${FIXTURE_ROW_ID_MATCH}
      PROVIDER_NAME_MATCH: ${PROVIDER_NAME_MATCH}

- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'

- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            true: ${FIXTURE_ROW_ID_MATCH !== ''}
          commands:
            - runFlow:
                when:
                  visible:
                    id: '${FIXTURE_ROW_ID_MATCH}'
                commands:
                  - tapOn:
                      id: '${FIXTURE_ROW_ID_MATCH}'
      - runFlow:
          when:
            true: ${FIXTURE_ROW_ID_MATCH === ''}
          commands:
            - runFlow:
                when:
                  visible: '${FIXTURE_FILE}(, .*)?'
                commands:
                  - tapOn:
                      text: '${FIXTURE_FILE}(, .*)?'

- runFlow:
    when:
      visible: 'Importing a database will replace all current data.*|Beim Importieren einer Datenbank werden alle aktuellen Daten ersetzt.*'
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn:
                text: 'Import Database|Datenbank importieren'
                index: 1
            - waitForAnimationToEnd

- runFlow:
    file: relaunch-app.flow.yaml
    env:
      HANDLE_DEV_CLIENT_STARTUP: ${HANDLE_DEV_CLIENT_STARTUP}

appId: ${APP_ID}
---
- runFlow: navigate-to-settings.flow.yaml

- swipe:
    start: '50%,78%'
    end: '50%,28%'
    duration: 220
- waitForAnimationToEnd

- swipe:
    start: '50%,78%'
    end: '50%,28%'
    duration: 220
- waitForAnimationToEnd

- runFlow:
    when:
      notVisible:
        id: 'SettingsPage.ImportDatabaseCard'
    commands:
      - scrollUntilVisible:
          element:
            id: 'SettingsPage.ImportDatabaseCard'
          direction: DOWN
          speed: 60
          centerElement: true
- waitForAnimationToEnd
- assertVisible:
    id: 'SettingsPage.ImportDatabaseCard'
- tapOn:
    id: 'SettingsPage.ImportDatabaseCard'

- extendedWaitUntil:
    visible: 'Browse'
    timeout: 10000
    optional: true

- runFlow:
    when:
      visible: 'Browse'
    commands:
      - tapOn: 'Browse'
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible: 'E2E Fixtures'
    timeout: 5000
    optional: true

- runFlow:
    when:
      visible: 'On My iPhone'
    commands:
      - tapOn: 'On My iPhone'
      - waitForAnimationToEnd

- runFlow:
    when:
      visible: 'E2E Fixtures'
    commands:
      - tapOn: 'E2E Fixtures'
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible: '${FIXTURE_FILE_NAME}'
    timeout: 5000
    optional: true

- runFlow:
    when:
      notVisible: '${FIXTURE_FILE_NAME}'
    commands:
      - tapOn: 'Search'
      - inputText: ${FIXTURE_FILE_NAME}
      - hideKeyboard
      - extendedWaitUntil:
          visible: '${FIXTURE_FILE_NAME}'
          timeout: 15000

- tapOn:
    point: '18%,39%'

- runFlow:
    when:
      notVisible: 'Cancel'
    commands:
      - tapOn: '${FIXTURE_FILE_NAME}'

- extendedWaitUntil:
    visible: 'Cancel'
    timeout: 15000
- waitForAnimationToEnd
- tapOn:
    point: '50%,56%'

- runFlow:
    when:
      visible: 'Cancel'
    commands:
      - tapOn:
          point: '50%,56%'

- extendedWaitUntil:
    notVisible: 'Cancel'
    timeout: 15000

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'HomePage.TotalBalance'
    timeout: 15000
    optional: true

- runFlow:
    when:
      notVisible:
        id: 'HomePage.TotalBalance'
    file: relaunch-app.flow.yaml

- extendedWaitUntil:
    visible:
      id: 'HomePage.TotalBalance'
    timeout: 30000

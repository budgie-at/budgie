appId: ${APP_ID}
env:
  HANDLE_DEV_CLIENT_STARTUP: ${HANDLE_DEV_CLIENT_STARTUP || 'false'}
  FIXTURE_ID: ${FIXTURE_ID}
  E2E_RUN_TOKEN: ${E2E_RUN_TOKEN || 'local'}
---
- retry:
    maxRetries: 2
    commands:
      - stopApp

      - openLink: 'budgie://?e2eResetToken=${MAESTRO_FILENAME}-${FIXTURE_ID}-${E2E_RUN_TOKEN}&e2eImportFixture=${FIXTURE_ID}'

      - runFlow:
          when:
            visible: 'Open'
          commands:
            - tapOn: 'Open'

      - runFlow:
          when:
            true: ${HANDLE_DEV_CLIENT_STARTUP === 'true'}
          file: handle-dev-client-startup.flow.yaml

      - extendedWaitUntil:
          visible:
            id: 'HomePage.TotalBalance'
          timeout: 30000

- waitForAnimationToEnd

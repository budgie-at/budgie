appId: ${APP_ID}
env:
  HANDLE_DEV_CLIENT_STARTUP: ${HANDLE_DEV_CLIENT_STARTUP || 'false'}
  FIXTURE_ID: ${FIXTURE_ID}
  E2E_RUN_TOKEN: ${E2E_RUN_TOKEN || 'local'}
---
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          appId: ${APP_ID}
          clearState: false
          permissions:
            contacts: allow
            microphone: allow
          arguments:
            e2eResetToken: '${MAESTRO_FILENAME}-${FIXTURE_ID}-${E2E_RUN_TOKEN}'
            e2eImportFixture: '${FIXTURE_ID}'

      - retry:
          maxRetries: 3
          commands:
            - runFlow: handle-dev-client-startup.flow.yaml
            - waitForAnimationToEnd

      - extendedWaitUntil:
          visible:
            id: 'HomePage.TotalBalance'
          timeout: 30000

- waitForAnimationToEnd

appId: ${APP_ID}
---
- runFlow: navigate-to-settings.flow.yaml

- scrollUntilVisible:
    element:
      id: 'SettingsPage.ImportDatabaseCard'
    direction: DOWN
    speed: 20
    centerElement: true
- waitForAnimationToEnd
- assertVisible:
    id: 'SettingsPage.ImportDatabaseCard'
- tapOn:
    id: 'SettingsPage.ImportDatabaseCard'

- tapOn: 'Search'
- inputText: ${FIXTURE_QUERY}
- hideKeyboard
- extendedWaitUntil:
    visible: '${FIXTURE_FILE_NAME}'
    timeout: 15000
- tapOn:
    point: '18%,39%'

- extendedWaitUntil:
    visible: 'Cancel'
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    point: '50%,56%'

- runFlow:
    when:
      visible: 'Cancel'
    commands:
      - tapOn:
          point: '50%,56%'

- extendedWaitUntil:
    notVisible: 'Cancel'
    timeout: 15000

- runFlow: relaunch-app.flow.yaml

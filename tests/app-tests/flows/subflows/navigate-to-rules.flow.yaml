appId: ${APP_ID}
---

- openLink: 'budgie://settings?anchor=organization'

- extendedWaitUntil:
    visible:
      id: 'SettingsPage.Container'
    timeout: 15000

- waitForAnimationToEnd

- runFlow:
    file: navigation/open-settings-card.flow.yaml
    env:
      CARD_ID: SettingsPage.ManageRulesCard
      DESTINATION_ID: RulesPage.Page

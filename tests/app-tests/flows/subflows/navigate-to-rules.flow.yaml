appId: ${APP_ID}
---

- openLink: 'budgie://settings?anchor=organization'

- extendedWaitUntil:
    visible:
      id: 'SettingsPage.ManageRulesCard'
    timeout: 15000

- waitForAnimationToEnd

- tapOn:
    id: 'SettingsPage.ManageRulesCard'

- extendedWaitUntil:
    visible:
      id: 'RulesPage.Page'
    timeout: 15000

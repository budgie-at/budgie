appId: ${APP_ID}
---
- runFlow:
    file: navigation/navigate-to-settings.flow.yaml

- scrollUntilVisible:
    element:
      id: 'SettingsPage.ManageRulesCard'
    direction: DOWN
    speed: 20
- waitForAnimationToEnd
- assertVisible:
    id: 'SettingsPage.ManageRulesCard'
- tapOn:
    id: 'SettingsPage.ManageRulesCard'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.Page'

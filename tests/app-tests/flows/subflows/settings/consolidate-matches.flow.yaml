appId: ${APP_ID}
---
- runFlow:
      file: ../navigation/navigate-to-settings.flow.yaml

# Same iOS 26 AX-staleness class as the money-data upgrade card: settle the
# scroll-driven blur chrome before and re-query after scrolling, or the card
# renders while its testID stays missing from the stale snapshot.
- waitForAnimationToEnd

- scrollUntilVisible:
      element:
          id: 'SettingsPage.RecalculateBalancesCard'
      direction: DOWN
      centerElement: true
      waitToSettleTimeoutMs: 1000
- waitForAnimationToEnd
- extendedWaitUntil:
      visible:
          id: 'SettingsPage.RecalculateBalancesCard'
      timeout: 10000

- scrollUntilVisible:
      element:
          id: 'SettingsPage.ConsolidateTransfersCard'
      direction: UP
      centerElement: true
      waitToSettleTimeoutMs: 1000
- waitForAnimationToEnd
- extendedWaitUntil:
      visible:
          id: 'SettingsPage.ConsolidateTransfersCard'
      timeout: 3000

- tapOn:
      id: 'SettingsPage.ConsolidateTransfersCard'
- extendedWaitUntil:
      visible: '.*high-confidence transfer.*'
      timeout: 3000

- tapOn: 'Consolidate'

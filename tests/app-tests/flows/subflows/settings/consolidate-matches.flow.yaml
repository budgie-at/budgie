appId: ${APP_ID}
---
- runFlow:
      file: ../navigation/navigate-to-settings.flow.yaml

- scrollUntilVisible:
      element:
          id: 'SettingsPage.ConsolidateTransfersCard'
      direction: UP
      centerElement: true
      waitToSettleTimeoutMs: 1000
      optional: true

- runFlow:
      when:
          notVisible:
              id: 'SettingsPage.ConsolidateTransfersCard'
      commands:
          - scrollUntilVisible:
                element:
                    id: 'SettingsPage.ConsolidateTransfersCard'
                direction: DOWN
                centerElement: true
                waitToSettleTimeoutMs: 1000

- waitForAnimationToEnd
- extendedWaitUntil:
      visible:
          id: 'SettingsPage.ConsolidateTransfersCard'
      timeout: 3000

- retry:
      maxRetries: 3
      commands:
          - tapOn:
                id: 'SettingsPage.ConsolidateTransfersCard'

          - extendedWaitUntil:
                visible: '.*high-confidence transfer.*'
                timeout: 3000

- tapOn: 'Consolidate'

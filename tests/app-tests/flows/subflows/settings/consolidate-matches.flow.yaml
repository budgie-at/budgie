appId: ${APP_ID}
---
- runFlow:
      file: ../navigation/navigate-to-settings.flow.yaml

- scrollUntilVisible:
      element:
          id: 'SettingsPage.ConsolidateTransfersCard'
      direction: DOWN
      centerElement: true
      waitToSettleTimeoutMs: 1000
- tapOn:
      id: 'SettingsPage.ConsolidateTransfersCard'
      retryTapIfNoChange: true
- extendedWaitUntil:
      visible: '.*high-confidence transfer.*'
      timeout: 10000
- tapOn: 'Consolidate'

appId: ${APP_ID}
---
- runFlow:
      file: subflows/import/import-database-from-settings.flow.yaml
      env:
          FIXTURE_ROW_ID_MATCH: '13.db(, db)?'

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- runFlow:
      file: subflows/transactions/open-transaction-form.flow.yaml
      env:
          ACTION_ITEM_ID: 'ActionItem.Income'
          FORM_TITLE: 'New Income'

- tapOn:
      id: 'TransactionKeypad.Digit.0'
- tapOn:
      id: 'TransactionKeypad.Digit.3'
- tapOn:
      id: 'TransactionKeypad.Digit.0'

- runFlow:
      file: subflows/transactions/select-account.flow.yaml
      env:
          ACCOUNT_NAME: 'E2E Income Target'

- runFlow:
      file: subflows/categories/create-category-from-transaction.flow.yaml
      env:
          CATEGORY_NAME: 'E2E Income Convert Category'

- runFlow:
      file: subflows/transactions/enter-comment.flow.yaml
      env:
          COMMENT: 'E2E Convert Income'

- runFlow: subflows/transactions/submit-transaction-and-wait.flow.yaml

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.E2E_Convert_Income'
      timeout: 5000

- tapOn:
      id: 'TabBar.Home'
- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
- assertVisible:
      id: 'HomePage.NetWorthValue.230'
- assertVisible:
      id: 'AccountCard.Balance.E2E_Income_Target.130'
- assertVisible:
      id: 'AccountCard.Balance.E2E_Income_Source.100'

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- tapOn:
      id: 'TransactionCard.Label.E2E_Convert_Income'

- tapOn:
      id: 'TransactionActionsMenu.TriggerButton'
- extendedWaitUntil:
      visible:
          id: 'TransactionActionsMenu.ConvertToTransferButton'
- tapOn:
      id: 'TransactionActionsMenu.ConvertToTransferButton'

- extendedWaitUntil:
      visible:
          id: 'ConvertToTransfer.Page'

- tapOn:
      id: 'TransferForm.FromAccount'
- extendedWaitUntil:
      visible:
          id: 'AccountPickerBottomSheet.Input'
- runFlow:
      file: subflows/shared/select-account-from-native-picker.flow.yaml
      env:
          ACCOUNT_OPTION_ID: 'AccountPickerBottomSheet.Option.E2E Income Source'

- tapOn:
      id: 'TransactionForm.SubmitButton'
- runFlow: subflows/transactions/confirm-convert-to-transfer.flow.yaml

- extendedWaitUntil:
      visible:
          id: 'TransactionInfo.Page'
      timeout: 15000

- tapOn:
      id: 'PageHeader.BackButton'
- extendedWaitUntil:
      visible:
          id: 'TransactionsPage.Container'
      timeout: 10000
- assertNotVisible:
      id: 'HomePage.TotalBalance'

- assertVisible:
      id: 'TransactionCard.Label.E2E_Convert_Income'
- assertVisible:
      id: 'TransactionCard.FromAccount.E2E_Income_Source.Label'
- assertVisible:
      id: 'TransactionCard.ToAccount.E2E_Income_Target.Label'

- tapOn:
      id: 'TabBar.Home'
- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
- assertVisible:
      id: 'HomePage.NetWorthValue.200'
- assertVisible:
      id: 'AccountCard.Balance.E2E_Income_Target.130'
- assertVisible:
      id: 'AccountCard.Balance.E2E_Income_Source.70'

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- tapOn:
      id: 'TransactionCard.Label.E2E_Convert_Income'

- runFlow: subflows/transactions/delete-transaction.flow.yaml
- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- extendedWaitUntil:
      notVisible:
          id: 'TransactionCard.Label.E2E_Convert_Income'
      timeout: 10000

- extendedWaitUntil:
      visible:
          id: 'TabBar.Home'
      timeout: 10000

- tapOn:
      id: 'TabBar.Home'
- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
- assertVisible:
      id: 'HomePage.NetWorthValue.200'
- assertVisible:
      id: 'AccountCard.Balance.E2E_Income_Target.100'
- assertVisible:
      id: 'AccountCard.Balance.E2E_Income_Source.100'

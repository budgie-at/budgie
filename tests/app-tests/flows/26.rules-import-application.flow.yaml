appId: ${APP_ID}
---
- runFlow:
      file: setup/setup-rules-test.flow.yaml

- runFlow:
      file: subflows/navigate-to-rules.flow.yaml

- runFlow:
      file: subflows/rules/open-create-rule-form.flow.yaml

- tapOn:
      id: 'RuleForm.Condition.0.FieldSelector.Value'
- waitForAnimationToEnd
- tapOn:
      id: 'RuleForm.SelectorCard.COMMENT'
- waitForAnimationToEnd
- tapOn:
      id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Netflix'

- tapOn: Done

- tapOn:
      id: 'RuleForm.Action.0.TypeSelector'
- tapOn:
      id: 'RuleForm.SelectorCard.SET_CATEGORY'
- waitForAnimationToEnd

- scrollUntilVisible:
      element:
          id: 'RuleForm.Action.0.CategorySelector'
      direction: DOWN
      centerElement: true

- tapOn:
      id: 'RuleForm.Action.0.CategorySelector'
- runFlow:
      file: subflows/shared/select-category-by-search.flow.yaml
      env:
          CATEGORY_NAME: Groceries

- runFlow:
      file: subflows/rules/submit-rule-skip-existing.flow.yaml
- waitForAnimationToEnd

- assertVisible:
      id: 'RulesPage.RuleCard.0'

- runFlow:
      file: subflows/rules/open-create-rule-form.flow.yaml

- tapOn:
      id: 'RuleForm.Condition.0.FieldSelector.Value'
- waitForAnimationToEnd
- tapOn:
      id: 'RuleForm.SelectorCard.COMMENT'
- waitForAnimationToEnd
- tapOn:
      id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Starbucks'

- tapOn: Done

- tapOn:
      id: 'RuleForm.Action.0.TypeSelector'
- tapOn:
      id: 'RuleForm.SelectorCard.ADD_TAG'
- waitForAnimationToEnd

- tapOn:
      id: 'RuleForm.Action.0.TagSelector'
- waitForAnimationToEnd
- runFlow:
      file: subflows/shared/select-tag-by-search.flow.yaml
      env:
          TAG_NAME: Subscription

- runFlow:
      file: subflows/rules/submit-rule-skip-existing.flow.yaml
- waitForAnimationToEnd

- assertVisible:
      id: 'RulesPage.RuleCard.1'

- runFlow:
      file: subflows/import/import-test-transactions.flow.yaml
      env:
          CSV_DISPLAY_NAME: test16-rules-import

- tapOn:
      id: 'TabBar.Transactions'
- waitForAnimationToEnd

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Tag.Subscription'
      timeout: 10000

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Category.Groceries'
      timeout: 10000

- runFlow:
      file: subflows/navigate-to-rules.flow.yaml

- runFlow:
      file: subflows/rules/delete-first-rule.flow.yaml
- waitForAnimationToEnd

- runFlow:
      file: subflows/rules/delete-first-rule.flow.yaml

- assertVisible:
      id: 'RulesPage.EmptyState'

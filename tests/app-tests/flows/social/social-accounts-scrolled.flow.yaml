appId: ${APP_ID}
---
- runFlow:
      file: ../subflows/navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://'

- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
      timeout: 15000

- scrollUntilVisible:
      element:
          id: '^DebtAccountCardSummary[.]OutstandingAmount[.].+$'
      direction: DOWN
      speed: 20
      centerElement: true

- waitForAnimationToEnd

- takeScreenshot: scene

appId: ${APP_ID}
---

- runFlow: subflows/enter-app.flow.yaml

# Create category first (no modal dismiss, no black screen)
- runFlow:
    file: subflows/create-category.flow.yaml
    env:
      CATEGORY_NAME: 'E2E Txn Category'

# Create account second (modal dismiss → relaunch recovers to home)
- runFlow:
    file: subflows/create-account.flow.yaml
    env:
      ACCOUNT_NAME: 'E2E Txn Account'

# --- Create Expense ---

- runFlow: subflows/navigate-to-transactions.flow.yaml

- runFlow: subflows/open-action-menu.flow.yaml

- tapOn:
    text: 'Expense'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'New Expense'

- tapOn: '4'
- tapOn: '2'

- runFlow:
    file: subflows/select-account.flow.yaml
    env:
      ACCOUNT_NAME: 'E2E Txn Account'

- runFlow:
    file: subflows/select-category.flow.yaml
    env:
      CATEGORY_NAME: 'E2E Txn Category'

- runFlow:
    file: subflows/enter-comment.flow.yaml
    env:
      COMMENT: 'E2E Test Expense'

- tapOn:
    id: 'TransactionForm.SubmitButton'

- extendedWaitUntil:
    visible: 'Transactions'
    timeout: 15000

- assertVisible: 'E2E Test Expense'

# --- Edit Expense ---

- tapOn: 'E2E Test Expense'
- waitForAnimationToEnd

- runFlow:
    file: subflows/edit-comment.flow.yaml
    env:
      COMMENT: 'E2E Edited Expense'

- tapOn:
    id: 'TransactionForm.SubmitButton'

- extendedWaitUntil:
    visible: 'Transactions'
    timeout: 15000

- assertVisible: 'E2E Edited Expense'

# --- Delete Expense ---

- tapOn: 'E2E Edited Expense'
- waitForAnimationToEnd

- runFlow: subflows/delete-transaction.flow.yaml

- extendedWaitUntil:
    visible: 'Transactions'
    timeout: 15000

- assertNotVisible: 'E2E Edited Expense'

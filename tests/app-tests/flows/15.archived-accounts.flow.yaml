appId: ${APP_ID}
---

- runFlow: subflows/enter-app.flow.yaml

- runFlow:
    file: subflows/import-database-fixture.flow.yaml
    env:
      FIXTURE_ID: '15-archived-accounts'
- scrollUntilVisible:
    element:
      id: 'AccountCard.E2E Archive Account'
    direction: DOWN
    timeout: 30000

# --- Archive Account ---

- tapOn:
    id: 'AccountCard.E2E Archive Account'
- extendedWaitUntil:
    visible:
      id: 'AccountDetails.EditButton'
    timeout: 10000

- tapOn:
    id: 'AccountDetails.EditButton'
- extendedWaitUntil:
    visible:
      id: 'AccountForm.NameInput'
    timeout: 10000

- scrollUntilVisible:
    element:
      id: 'AccountDetails.ArchiveButton'
    direction: DOWN

- tapOn:
    id: 'AccountDetails.ArchiveButton'

- extendedWaitUntil:
    visible: 'Archive Account?'
    timeout: 10000

- tapOn:
    point: '68%,58%'

- extendedWaitUntil:
    notVisible: 'Archive Account?'
    timeout: 10000

- extendedWaitUntil:
    notVisible:
      id: 'AccountCard.E2E Archive Account'
    timeout: 10000
- assertNotVisible:
    id: 'AccountCard.E2E Archive Account'

# --- Navigate to Archived Accounts ---

- runFlow: subflows/account/open-archived-accounts.flow.yaml

# --- Verify Archived Account Visible ---

- assertVisible:
    id: 'ArchivedAccountCard.RestoreButton.E2E Archive Account'

# --- Restore Account ---

- tapOn:
    id: 'ArchivedAccountCard.RestoreButton.E2E Archive Account'

- extendedWaitUntil:
    visible: 'Restore Account?'
    timeout: 10000

- tapOn:
    point: '68%,58%'

- extendedWaitUntil:
    notVisible: 'Restore Account?'
    timeout: 10000

# --- Verify Account Back on Home ---

- tapOn:
    id: 'TabBar.Home'
- extendedWaitUntil:
    visible:
      id: 'HomePage.TotalBalance'

- scrollUntilVisible:
    element:
      id: 'AccountCard.E2E Archive Account'
    direction: DOWN
    timeout: 30000

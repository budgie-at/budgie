steps:
  - launch: com.vitalyiegorov.budgie.e2e
  - tool: open-url
    args:
      url: budgie://settings?anchor=data
  - tool: gesture-tap
    args:
      x: 0.684
      y: 0.542
  - when:
      visible: &a1
        text: Not Now
    steps:
      - tap: *a1
  - await:
      idle: true
  - when:
      hidden:
        id: SettingsPage.Container
    steps:
      - tool: open-url
        args:
          url: budgie://settings
      - tool: gesture-tap
        args:
          x: 0.684
          y: 0.542
      - await:
          idle: true
      - await:
          visible:
            id: SettingsPage.Container
          timeout: 15000
  - await:
      visible:
        id: SettingsPage.Container
      timeout: 15000
  - echo: Optional scroll probe for {"id":"SettingsPage.ImportDatabaseCard"}
  - when:
      hidden:
        id: SettingsPage.ImportDatabaseCard
    steps:
      - scroll-to:
          target:
            id: SettingsPage.ImportDatabaseCard
          direction: down
      - await:
          idle: true
  - await:
      visible:
        id: SettingsPage.ImportDatabaseCard
      timeout: 5000
  - tap:
      id: SettingsPage.ImportDatabaseCard
  - await:
      idle: true
  - await:
      visible:
        text: Cancel
      timeout: 15000
  - when:
      visible:
        text: Apple Account Verification
    steps:
      - tap:
          text: Not Now
      - await:
          idle: true
  - when:
      visible:
        text: No Results for .*
    steps:
      - when:
          visible: &a2
            text: Clear text
        steps:
          - tap: *a2
      - await:
          idle: true
  - when:
      hidden:
        id: 02.db
    steps:
      - when:
          visible:
            id: E2EFixtures, Folder
        steps:
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          visible:
            text: budgie \(E2E\), Actions Menu
        steps:
          - await:
              visible:
                id: E2EFixtures, Folder
              timeout: 3000
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          hidden:
            text: E2EFixtures, Actions Menu
        steps:
          - when:
              hidden:
                text: budgie \(E2E\), Actions Menu
            steps:
              - when:
                  visible: &a3
                    id: BackButton
                steps:
                  - tap: *a3
              - when:
                  visible: &a4
                    id: BackButton
                steps:
                  - tap: *a4
              - when:
                  visible: &a5
                    id: BackButton
                steps:
                  - tap: *a5
              - when:
                  visible: &a6
                    text: Browse
                steps:
                  - tap: *a6
              - tool: gesture-tap
                args:
                  x: 0.714
                  y: 0.944
              - await:
                  idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - when:
                      visible:
                        text: On My iPhone
                    steps:
                      - tap:
                          text: On My iPhone
                      - await:
                          idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - scroll-to:
                      target:
                        text: budgie \(E2E\)
                      direction: down
              - await:
                  visible:
                    text: budgie \(E2E\)
                  timeout: 3000
              - tap:
                  text: budgie \(E2E\)
              - await:
                  idle: true
              - await:
                  visible:
                    id: E2EFixtures, Folder
                  timeout: 3000
              - tap:
                  id: E2EFixtures, Folder
              - await:
                  idle: true
  - echo: Optional scroll probe for {"id":"02.db"}
  - when:
      hidden:
        id: 02.db
    steps:
      - scroll-to:
          target:
            text: 02.db
          direction: down
  - await:
      idle: true
  - when:
      visible:
        id: 02.db
    steps:
      - tap:
          id: 02.db
  - when:
      hidden:
        id: 02.db
    steps:
      - when:
          visible: &a7
            text: 02.db
        steps:
          - tap: *a7
  - await:
      idle: true
  - when:
      visible:
        text: Continue
    steps:
      - tap:
          text: Continue
      - await:
          idle: true
      - when:
          visible:
            id: 02.db
        steps:
          - tap:
              id: 02.db
      - when:
          hidden:
            id: 02.db
        steps:
          - when:
              visible: &a8
                text: 02.db
            steps:
              - tap: *a8
      - await:
          idle: true
  - when:
      visible:
        text: Open
    steps:
      - tap:
          text: Open
  - await:
      visible:
        text: Importing a database will replace all current data.*
      timeout: 3000
  - tap:
      text: Import Database
  - await:
      idle: true
  - await:
      visible:
        id: TabBar.Home
      timeout: 30000
  - tap:
      id: TabBar.Home
  - await:
      visible:
        id: HomePage.TotalBalance
      timeout: 30000
  - tap:
      id: TabBar.Home
  - await:
      idle: true
  - when:
      visible:
        text: No accounts yet
    steps:
      - tap:
          id: AccountsEmptyState.AddAccountButton
      - await:
          visible:
            id: CreateAccount.BANK
          timeout: 10000
  - when:
      hidden:
        id: CreateAccount.BANK
    steps:
      - when:
          visible:
            id: ActionButton
        steps:
          - tap:
              id: ActionButton
      - when:
          hidden:
            id: ActionButton
        steps:
          - await:
              visible:
                id: ActionButton
              timeout: 10000
          - tap:
              id: ActionButton
      - await:
          idle: true
      - await:
          visible:
            id: ActionItem.AddAccount.Label
          timeout: 10000
      - tap:
          id: ActionItem.AddAccount.Label
      - await:
          idle: true
  - await:
      visible:
        id: CreateAccount.BANK
      timeout: 10000
  - await:
      visible:
        id: CreateAccount.CRYPTO
      timeout: 3000
  - tap:
      id: CreateAccount.CRYPTO
  - await:
      idle: true
  - await:
      visible:
        id: AccountForm.NameInput
      timeout: 3000
  - tap:
      id: AccountForm.NameInput
  - tool: keyboard
    args:
      text: E2E Monero Ledger
  - scroll-to:
      target:
        id: AccountForm.CurrencySelector
      direction: down
  - tap:
      id: AccountForm.CurrencySelector
  - await:
      idle: true
  - await:
      visible:
        id: CurrencySelector.SearchInput
      timeout: 3000
  - tap:
      id: CurrencySelector.SearchInput

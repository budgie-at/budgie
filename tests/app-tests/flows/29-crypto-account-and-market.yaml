steps:
  - launch: com.vitalyiegorov.budgie.e2e
  - tool: open-url
    args:
      url: budgie://settings?anchor=data
  - tool: gesture-tap
    args:
      x: 0.684
      y: 0.542
  - when:
      visible: &a1
        text: Not Now
    steps:
      - tap: *a1
  - await:
      idle: true
  - when:
      hidden:
        id: SettingsPage.Container
    steps:
      - tool: open-url
        args:
          url: budgie://settings
      - tool: gesture-tap
        args:
          x: 0.684
          y: 0.542
      - await:
          idle: true
      - await:
          visible:
            id: SettingsPage.Container
          timeout: 15000
  - await:
      visible:
        id: SettingsPage.Container
      timeout: 15000
  - echo: Optional scroll probe for {"id":"SettingsPage.ImportDatabaseCard"}
  - when:
      hidden:
        id: SettingsPage.ImportDatabaseCard
    steps:
      - scroll-to:
          target:
            id: SettingsPage.ImportDatabaseCard
          direction: down
      - await:
          idle: true
  - await:
      visible:
        id: SettingsPage.ImportDatabaseCard
      timeout: 5000
  - tap:
      id: SettingsPage.ImportDatabaseCard
  - await:
      idle: true
  - await:
      visible:
        text: Cancel
      timeout: 15000
  - when:
      visible:
        text: Apple Account Verification
    steps:
      - tap:
          text: Not Now
      - await:
          idle: true
  - when:
      visible:
        text: No Results for .*
    steps:
      - when:
          visible: &a2
            text: Clear text
        steps:
          - tap: *a2
      - await:
          idle: true
  - when:
      hidden:
        id: 29.db
    steps:
      - when:
          visible:
            id: E2EFixtures, Folder
        steps:
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          visible:
            text: budgie \(E2E\), Actions Menu
        steps:
          - await:
              visible:
                id: E2EFixtures, Folder
              timeout: 3000
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          hidden:
            text: E2EFixtures, Actions Menu
        steps:
          - when:
              hidden:
                text: budgie \(E2E\), Actions Menu
            steps:
              - when:
                  visible: &a3
                    id: BackButton
                steps:
                  - tap: *a3
              - when:
                  visible: &a4
                    id: BackButton
                steps:
                  - tap: *a4
              - when:
                  visible: &a5
                    id: BackButton
                steps:
                  - tap: *a5
              - when:
                  visible: &a6
                    text: Browse
                steps:
                  - tap: *a6
              - await:
                  idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - when:
                      visible:
                        text: On My iPhone
                    steps:
                      - tap:
                          text: On My iPhone
                      - await:
                          idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - scroll-to:
                      target:
                        text: budgie \(E2E\)
                      direction: down
              - await:
                  visible:
                    text: budgie \(E2E\)
                  timeout: 3000
              - tap:
                  text: budgie \(E2E\)
              - await:
                  idle: true
              - await:
                  visible:
                    id: E2EFixtures, Folder
                  timeout: 3000
              - tap:
                  id: E2EFixtures, Folder
              - await:
                  idle: true
  - echo: Optional scroll probe for {"id":"29.db"}
  - when:
      hidden:
        id: 29.db
    steps:
      - scroll-to:
          target:
            text: 29.db
          direction: down
  - await:
      idle: true
  - when:
      visible:
        id: 29.db
    steps:
      - tap:
          id: 29.db
  - when:
      hidden:
        id: 29.db
    steps:
      - when:
          visible: &a7
            text: 29.db
        steps:
          - tap: *a7
  - await:
      idle: true
  - when:
      visible:
        text: Continue
    steps:
      - tap:
          text: Continue
      - await:
          idle: true
      - when:
          visible:
            id: 29.db
        steps:
          - tap:
              id: 29.db
      - when:
          hidden:
            id: 29.db
        steps:
          - when:
              visible: &a8
                text: 29.db
            steps:
              - tap: *a8
      - await:
          idle: true
  - when:
      visible:
        text: Open
    steps:
      - tap:
          text: Open
  - await:
      visible:
        text: Importing a database will replace all current data.*
      timeout: 3000
  - tap:
      text: Import Database
  - await:
      idle: true
  - await:
      visible:
        id: TabBar.Home
      timeout: 30000
  - tap:
      id: TabBar.Home
  - await:
      visible:
        id: HomePage.TotalBalance
      timeout: 30000
  - await:
      visible:
        id: CryptoGroup.Market.BTC
      timeout: 10000
  - assert:
      visible:
        id: CryptoGroup.Card.BTC
  - assert:
      visible:
        id: CryptoGroup.Container.BTC
  - assert:
      visible:
        id: NetWorthAssetChips
  - assert:
      visible:
        id: NetWorthAssetChips.Fiat
  - assert:
      visible:
        id: NetWorthAssetChips.Crypto
  - assert:
      visible:
        id: CryptoGroup.Balance.BTC
  - assert:
      visible:
        id: CryptoGroup.Value.BTC
  - assert:
      visible:
        id: CryptoGroup.Toggle.BTC
  - assert:
      visible:
        id: CryptoGroup.AccountCount.BTC
  - assert:
      visible:
        id: CryptoGroup.Rate.BTC
  - await:
      visible:
        id: CryptoGroup.Market.ETH
      timeout: 10000
  - assert:
      visible:
        id: CryptoGroup.Card.ETH
  - assert:
      visible:
        id: CryptoGroup.Container.ETH
  - assert:
      visible:
        id: CryptoGroup.Balance.ETH
  - assert:
      visible:
        id: CryptoGroup.Value.ETH
  - assert:
      visible:
        id: CryptoGroup.Toggle.ETH
  - assert:
      visible:
        id: CryptoGroup.AccountCount.ETH
  - assert:
      visible:
        id: CryptoGroup.Rate.ETH
  - tap:
      id: CryptoGroup.Toggle.BTC
  - await:
      idle: true
  - await:
      visible:
        id: AccountCard.E2E Crypto Vault
      timeout: 10000
  - await:
      visible:
        id: AccountCard.E2E Binance BTC
      timeout: 3000
  - assert:
      visible:
        id: AccountCard.Balance.E2E_Crypto_Vault.2_BTC
  - assert:
      visible:
        id: AccountCard.Balance.E2E_Binance_BTC.2_BTC
  - tap:
      id: CryptoGroup.Market.BTC
  - await:
      visible:
        id: CurrencyMarket.Header.BTC
      timeout: 10000
  - assert:
      visible:
        id: CurrencyMarket.Price.BTC
  - assert:
      visible:
        id: CurrencyMarket.Rate.BTC
  - assert:
      visible:
        id: CurrencyMarket.Sparkline.BTC
  - assert:
      visible:
        id: CurrencyMarket.Holdings.BTC
  - assert:
      visible:
        id: CurrencyMarket.Holdings.Balance.BTC
  - assert:
      visible:
        id: CurrencyMarket.Holdings.Value.BTC
  - assert:
      visible:
        id: CurrencyMarket.Holdings.AverageCost.BTC
  - assert:
      visible:
        id: CurrencyMarket.Holdings.CostBasis.BTC
  - assert:
      visible:
        id: CurrencyMarket.Holdings.UnrealizedProfit.BTC
  - assert:
      visible:
        text: 4 BTC
  - scroll-to:
      target:
        id: CurrencyMarket.MarketCap.BTC
      direction: down
  - assert:
      visible:
        id: CurrencyMarket.Volume.BTC
  - assert:
      visible:
        id: CurrencyMarket.Updated.BTC
  - tap:
      id: PageHeader.BackButton
  - await:
      visible:
        id: HomePage.TotalBalance
      timeout: 3000
  - tap:
      id: CryptoGroup.Toggle.BTC
  - await:
      idle: true
  - await:
      hidden:
        id: AccountCard.E2E Crypto Vault
      timeout: 5000
  - await:
      visible:
        id: CryptoGroup.Market.ETH
      timeout: 5000
  - await:
      idle: true
  - tap:
      id: CryptoGroup.Market.ETH
  - await:
      visible:
        id: CurrencyMarket.Header.ETH
      timeout: 10000
  - assert:
      visible:
        id: CurrencyMarket.Price.ETH
  - assert:
      visible:
        id: CurrencyMarket.Rate.ETH
  - assert:
      visible:
        id: CurrencyMarket.Sparkline.ETH
  - assert:
      visible:
        id: CurrencyMarket.Holdings.ETH
  - assert:
      visible:
        id: CurrencyMarket.Holdings.Balance.ETH
  - assert:
      visible:
        id: CurrencyMarket.Holdings.Value.ETH
  - assert:
      visible:
        text: 1 ETH
  - scroll-to:
      target:
        id: CurrencyMarket.MarketCap.ETH
      direction: down
  - assert:
      visible:
        id: CurrencyMarket.Volume.ETH
  - assert:
      visible:
        id: CurrencyMarket.Updated.ETH
  - tap:
      id: PageHeader.BackButton
  - await:
      visible:
        id: HomePage.TotalBalance
      timeout: 3000
  - when:
      hidden:
        id: AccountCard.E2E Crypto Vault
    steps:
      - tap:
          id: CryptoGroup.Toggle.BTC
      - await:
          idle: true
  - await:
      visible:
        id: AccountCard.E2E Crypto Vault
      timeout: 3000
  - scroll-to:
      target:
        id: AccountCard.Balance.E2E_Crypto_Vault.2_BTC
      direction: down
  - tap:
      id: AccountCard.Balance.E2E_Crypto_Vault.2_BTC
  - await:
      visible:
        id: AccountDetails.EditButton
      timeout: 10000
  - await:
      visible:
        id: TransactionCard.Badge.Adjustment
      timeout: 10000
  - assert:
      visible:
        id: TransactionCard.AdjustmentAmount.2
  - await:
      idle: true
  - echo: Native recovery attempt (migrated from retry, max 1)
  - when:
      hidden:
        id: ActionItem.Income.Label
    steps:
      - tap:
          id: ActionButton
  - await:
      visible:
        id: ActionItem.Income.Label
      timeout: 3000
  - await:
      idle: true
  - tap:
      id: ActionItem.Income.Label
  - await:
      visible:
        text: New Income
  - await:
      visible:
        id: TransactionKeypad.Digit.1
  - await:
      idle: true
  - tap:
      id: TransactionKeypad.Digit.1
  - tap:
      id: TransactionForm.CategorySelector.Title
  - await:
      visible:
        id: CategoryPickerBottomSheet.Input
  - tap:
      id: CategoryPickerBottomSheet.Input
  - tool: keyboard
    args:
      text: E2E Crypto Buy
  - tool: keyboard
    args:
      key: enter
  - await:
      idle: true
  - tap:
      id: CategoryPickerBottomSheet.CreateButton
  - await:
      idle: true
  - await:
      visible:
        id: CategoryForm.Input
  - tap:
      id: CategoryForm.Submit
  - await:
      hidden:
        id: CategoryForm.Input
  - await:
      visible:
        id: TransactionForm.CommentInput
      timeout: 10000
  - tap:
      id: TransactionForm.CommentInput
  - await:
      visible:
        id: NoteInput.Input
      timeout: 5000
  - tap:
      id: NoteInput.Input
  - tool: keyboard
    args:
      text: E2E Crypto Income
  - tap:
      id: NoteInput.SubmitButton
  - await:
      hidden:
        id: NoteInput.Input
      timeout: 5000
  - await:
      idle: true
  - tap:
      id: TransactionForm.SubmitButton
  - await:
      visible:
        id: AccountDetails.EditButton
      timeout: 10000
  - await:
      visible:
        id: TransactionCard.Label.E2E_Crypto_Income
      timeout: 10000
  - assert:
      visible:
        id: TransactionCard.Category.E2E_Crypto_Buy
  - assert:
      visible:
        id: TransactionCard.Account.E2E_Crypto_Vault.Label
  - tap:
      id: PageHeader.BackButton
  - await:
      visible:
        id: HomePage.TotalBalance
      timeout: 3000
  - tap:
      id: CryptoGroup.Market.BTC
  - await:
      visible:
        id: CurrencyMarket.Header.BTC
      timeout: 10000
  - assert:
      visible:
        text: 5 BTC
  - assert:
      visible:
        id: CurrencyMarket.Holdings.AverageCost.BTC
  - assert:
      visible:
        id: CurrencyMarket.Holdings.CostBasis.BTC
  - assert:
      visible:
        id: CurrencyMarket.Holdings.UnrealizedProfit.BTC

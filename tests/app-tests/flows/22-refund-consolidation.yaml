steps:
  - launch: com.vitalyiegorov.budgie.e2e
  - tool: open-url
    args:
      url: budgie://settings?anchor=data
  - tool: gesture-tap
    args:
      x: 0.684
      y: 0.542
  - when:
      visible: &a1
        text: Not Now
    steps:
      - tap: *a1
  - await:
      idle: true
  - when:
      hidden:
        id: SettingsPage.Container
    steps:
      - tool: open-url
        args:
          url: budgie://settings
      - tool: gesture-tap
        args:
          x: 0.684
          y: 0.542
      - await:
          idle: true
      - await:
          visible:
            id: SettingsPage.Container
          timeout: 15000
  - await:
      visible:
        id: SettingsPage.Container
      timeout: 15000
  - echo: Optional scroll probe for {"id":"SettingsPage.ImportDatabaseCard"}
  - when:
      hidden:
        id: SettingsPage.ImportDatabaseCard
    steps:
      - scroll-to:
          target:
            id: SettingsPage.ImportDatabaseCard
          direction: down
      - await:
          idle: true
  - await:
      visible:
        id: SettingsPage.ImportDatabaseCard
      timeout: 5000
  - tap:
      id: SettingsPage.ImportDatabaseCard
  - await:
      idle: true
  - await:
      visible:
        text: Cancel
      timeout: 15000
  - when:
      visible:
        text: Apple Account Verification
    steps:
      - tap:
          text: Not Now
      - await:
          idle: true
  - when:
      visible:
        text: No Results for .*
    steps:
      - when:
          visible: &a2
            text: Clear text
        steps:
          - tap: *a2
      - await:
          idle: true
  - when:
      hidden:
        id: 22.db
    steps:
      - when:
          visible:
            id: E2EFixtures, Folder
        steps:
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          visible:
            text: budgie \(E2E\), Actions Menu
        steps:
          - await:
              visible:
                id: E2EFixtures, Folder
              timeout: 3000
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          hidden:
            text: E2EFixtures, Actions Menu
        steps:
          - when:
              hidden:
                text: budgie \(E2E\), Actions Menu
            steps:
              - when:
                  visible: &a3
                    id: BackButton
                steps:
                  - tap: *a3
              - when:
                  visible: &a4
                    id: BackButton
                steps:
                  - tap: *a4
              - when:
                  visible: &a5
                    id: BackButton
                steps:
                  - tap: *a5
              - when:
                  visible: &a6
                    text: Browse
                steps:
                  - tap: *a6
              - await:
                  idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - when:
                      visible:
                        text: On My iPhone
                    steps:
                      - tap:
                          text: On My iPhone
                      - await:
                          idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - scroll-to:
                      target:
                        text: budgie \(E2E\)
                      direction: down
              - await:
                  visible:
                    text: budgie \(E2E\)
                  timeout: 3000
              - tap:
                  text: budgie \(E2E\)
              - await:
                  idle: true
              - await:
                  visible:
                    id: E2EFixtures, Folder
                  timeout: 3000
              - tap:
                  id: E2EFixtures, Folder
              - await:
                  idle: true
  - echo: Optional scroll probe for {"id":"22.db"}
  - when:
      hidden:
        id: 22.db
    steps:
      - scroll-to:
          target:
            text: 22.db
          direction: down
  - await:
      idle: true
  - when:
      visible:
        id: 22.db
    steps:
      - tap:
          id: 22.db
  - when:
      hidden:
        id: 22.db
    steps:
      - when:
          visible: &a7
            text: 22.db
        steps:
          - tap: *a7
  - await:
      idle: true
  - when:
      visible:
        text: Continue
    steps:
      - tap:
          text: Continue
      - await:
          idle: true
      - when:
          visible:
            id: 22.db
        steps:
          - tap:
              id: 22.db
      - when:
          hidden:
            id: 22.db
        steps:
          - when:
              visible: &a8
                text: 22.db
            steps:
              - tap: *a8
      - await:
          idle: true
  - when:
      visible:
        text: Open
    steps:
      - tap:
          text: Open
  - await:
      visible:
        text: Importing a database will replace all current data.*
      timeout: 3000
  - tap:
      text: Import Database
  - await:
      idle: true
  - await:
      visible:
        id: TabBar.Home
      timeout: 30000
  - tap:
      id: TabBar.Home
  - await:
      visible:
        id: HomePage.TotalBalance
      timeout: 30000
  - tool: open-url
    args:
      url: budgie://transactions/3/income
  - tool: gesture-tap
    args:
      x: 0.684
      y: 0.542
  - await:
      idle: true
  - await:
      visible:
        id: TransactionActionsMenu.TriggerButton
      timeout: 10000
  - tap:
      id: TransactionActionsMenu.TriggerButton
  - await:
      visible:
        id: TransactionActionsMenu.ConvertToRefundButton
      timeout: 3000
  - tap:
      id: TransactionActionsMenu.ConvertToRefundButton
  - await:
      visible:
        id: ConvertToRefund.Page
      timeout: 10000
  - assert:
      visible:
        id: ConvertToRefund.CandidateRow.2
  - tap:
      id: ConvertToRefund.CandidateRow.2
  - tap:
      id: ConvertToRefund.ConvertButton
  - await:
      idle: true
  - tap:
      text: Convert
  - await:
      idle: true
  - await:
      visible:
        id: TransactionInfo.Row.Consolidation
      timeout: 10000
  - tap:
      id: TransactionInfo.Row.Consolidation
  - await:
      visible:
        id: ConsolidationSourceModal.Row.0
      timeout: 10000
  - assert:
      visible:
        text: E2E Refund Partial, .*\+₴40
  - tap:
      id: ConsolidationSourceModal.RevertButton
  - await:
      visible:
        text: Revert consolidation?
      timeout: 10000
  - tap:
      text: Revert
  - await:
      hidden:
        text: Revert consolidation?
      timeout: 15000
  - tool: open-url
    args:
      url: budgie://transactions/3/income
  - tool: gesture-tap
    args:
      x: 0.684
      y: 0.542
  - await:
      idle: true
  - await:
      visible:
        id: TransactionActionsMenu.TriggerButton
      timeout: 10000
  - await:
      hidden:
        id: TransactionInfo.RefundedPill
      timeout: 10000
  - tap:
      id: TransactionActionsMenu.TriggerButton
  - await:
      visible:
        id: TransactionActionsMenu.ConvertToTransferButton
      timeout: 3000
  - assert:
      visible:
        id: TransactionActionsMenu.ConvertToRefundButton
  - tap:
      text: Close menu
  - tool: open-url
    args:
      url: budgie://transactions
  - tool: gesture-tap
    args:
      x: 0.684
      y: 0.542
  - await:
      idle: true
  - await:
      visible:
        id: TransactionsPage.Container
      timeout: 10000
  - scroll-to:
      target:
        id: TransactionCard.Label.E2E_Refund_Localized
      direction: down
  - assert:
      visible:
        id: TransactionCard.Label.E2E_Refund_Localized
  - scroll-to:
      target:
        id: TransactionCard.Label.E2E_Refund_Partial
      direction: down
  - assert:
      visible:
        id: TransactionCard.Label.E2E_Refund_Partial
  - scroll-to:
      target:
        id: TransactionCard.Label.E2E_Refund_Full
      direction: down
  - assert:
      visible:
        id: TransactionCard.Label.E2E_Refund_Full
  - scroll-to:
      target:
        id: TransactionCard.Label.E2E_Refund_Ambiguous
      direction: down
  - assert:
      visible:
        id: TransactionCard.Label.E2E_Refund_Ambiguous
  - long-press:
      id: TransactionCard.Label.E2E_Refund_Ambiguous
  - await:
      visible:
        id: TransactionContextMenu.ConvertToRefundButton
      timeout: 3000
  - tap:
      text: Close menu
  - tool: open-url
    args:
      url: budgie://settings
  - tool: gesture-tap
    args:
      x: 0.684
      y: 0.542
  - await:
      idle: true
  - await:
      visible:
        id: SettingsPage.Container
      timeout: 15000
  - await:
      idle: true
  - scroll-to:
      target:
        id: SettingsPage.MoneyDataUpgradeCard
      direction: down
  - await:
      idle: true
  - await:
      visible:
        id: SettingsPage.MoneyDataUpgradeCard
      timeout: 10000
  - tap:
      id: SettingsPage.MoneyDataUpgradeCard
  - await:
      visible:
        text: Value historical entries?
      timeout: 10000
  - tap:
      text: Value entries
  - await:
      visible:
        id: SettingsPage.MoneyDataUpgradeCard.Status.COMPLETE
      timeout: 30000
  - tool: open-url
    args:
      url: budgie://settings
  - tool: gesture-tap
    args:
      x: 0.684
      y: 0.542
  - await:
      idle: true
  - await:
      visible:
        id: SettingsPage.Container
      timeout: 15000
  - await:
      idle: true
  - scroll-to:
      target:
        id: SettingsPage.RecalculateBalancesCard
      direction: down
  - await:
      idle: true
  - await:
      visible:
        id: SettingsPage.RecalculateBalancesCard
      timeout: 10000
  - scroll-to:
      target:
        id: SettingsPage.ConsolidateTransfersCard
      direction: up
  - await:
      idle: true
  - await:
      visible:
        id: SettingsPage.ConsolidateTransfersCard
      timeout: 3000
  - tap:
      id: SettingsPage.ConsolidateTransfersCard
  - await:
      visible:
        text: .*high-confidence transfer.*
      timeout: 3000
  - tap:
      text: Consolidate
  - tool: open-url
    args:
      url: budgie://transactions
  - tool: gesture-tap
    args:
      x: 0.684
      y: 0.542
  - await:
      idle: true
  - await:
      visible:
        id: TransactionsPage.Container
      timeout: 10000
  - scroll-to:
      target:
        id: TransactionCard.Label.E2E_Refund_Localized
      direction: up
  - assert:
      visible:
        text: E2E Refund Localized, Refunded.*
  - assert:
      hidden:
        id: TransactionCard.Amount.10
  - assert:
      visible:
        id: TransactionCard.Label.E2E_Refund_Localized
  - scroll-to:
      target:
        id: TransactionCard.RefundedPill.4
      direction: down
  - assert:
      visible:
        id: TransactionCard.RefundedPill.4
  - assert:
      hidden:
        id: TransactionCard.Amount.3
  - assert:
      hidden:
        id: TransactionCard.Amount.5
  - scroll-to:
      target:
        id: TransactionCard.Label.E2E_Refund_Ambiguous
      direction: down
  - assert:
      visible:
        id: TransactionCard.Amount.8
  - assert:
      visible:
        id: TransactionCard.Label.E2E_Refund_Ambiguous
  - tool: open-url
    args:
      url: budgie://transactions/4/expense
  - tool: gesture-tap
    args:
      x: 0.684
      y: 0.542
  - await:
      idle: true
  - await:
      visible:
        id: TransactionInfo.Row.Consolidation
      timeout: 10000
  - tap:
      id: TransactionInfo.Row.Consolidation
  - await:
      visible:
        id: ConsolidationSourceModal.Row.0
      timeout: 10000
  - assert:
      visible:
        text: E2E Refund Full, .*\+₴55
  - tap:
      id: ConsolidationSourceModal.DoneButton
  - await:
      hidden:
        id: ConsolidationSourceModal.Row.0
      timeout: 5000
  - tool: open-url
    args:
      url: budgie://transactions/9/expense
  - tool: gesture-tap
    args:
      x: 0.684
      y: 0.542
  - await:
      idle: true
  - await:
      visible:
        id: TransactionInfo.Row.Consolidation
      timeout: 10000
  - tap:
      id: TransactionInfo.Row.Consolidation
  - await:
      visible:
        id: ConsolidationSourceModal.Row.0
      timeout: 10000
  - assert:
      visible:
        text: Скасування\. E2E Refund Localized, .*\+₴18
  - tap:
      id: ConsolidationSourceModal.DoneButton
  - await:
      hidden:
        id: ConsolidationSourceModal.Row.0
      timeout: 5000
  - tap:
      id: PageHeader.BackButton
  - tap:
      id: PageHeader.BackButton
  - tap:
      id: TabBar.Analytics
  - await:
      visible:
        id: AnalyticsPage.Container
      timeout: 10000
  - scroll-to:
      target:
        id: CategoryStatisticsCard.Amount.Restaurants_Cafes.80000000
      direction: down
  - assert:
      visible:
        id: CategoryStatisticsCard.Amount.Restaurants_Cafes.80000000

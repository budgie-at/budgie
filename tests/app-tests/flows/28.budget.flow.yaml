appId: ${APP_ID}
env:
    ACCOUNT_NAME: Rules Test Account
    CATEGORY_NAME: Rules Test Category
---

- runFlow:
    file: setup/setup-budget-test.flow.yaml

# --- Empty state when no budget ---

- openLink: 'budgie://budget'
- extendedWaitUntil:
    visible:
      id: 'BudgetWidget.EmptyState'
    timeout: 3000

# --- Create budget from empty state ---

- tapOn:
    id: 'BudgetWidget.EmptyState'
- extendedWaitUntil:
    visible: 'Create budget'
    timeout: 3000

- tapOn:
    id: 'BudgetSetup.OverallLimitInput'
- inputText: '1000'
- tapOn:
    id: 'BudgetSetup.SaveButton'

- extendedWaitUntil:
    visible:
      id: 'BudgetWidget.Card'
    timeout: 3000
- assertVisible:
    id: 'BudgetWidget.SpentLabel'
    text: '0.00 / 1000.00'

# --- Add an expense, widget updates ---

- runFlow:
    file: subflows/navigation/navigate-to-transactions.flow.yaml

- runFlow:
    file: subflows/transactions/open-transaction-form.flow.yaml
    env:
      ACTION_ITEM_ID: 'ActionItem.Expense'
      FORM_TITLE: 'New Expense'

- tapOn:
    id: 'TransactionKeypad.Digit.4'
- tapOn:
    id: 'TransactionKeypad.Digit.2'

- runFlow:
    file: subflows/transactions/select-account.flow.yaml
    env:
      ACCOUNT_NAME: ${ACCOUNT_NAME}

- tapOn:
    id: 'TransactionForm.CategorySelector'
- runFlow:
    file: subflows/shared/select-category-by-search.flow.yaml
    env:
      CATEGORY_NAME: ${CATEGORY_NAME}

- runFlow: subflows/transactions/submit-transaction-and-wait.flow.yaml

- tapOn:
    id: 'TabBar.Home'
- extendedWaitUntil:
    visible:
      id: 'BudgetWidget.SpentLabel'
      text: '42.00 / 1000.00'
    timeout: 3000

# --- Edit overall limit ---

- tapOn:
    id: 'BudgetWidget.Card'
- extendedWaitUntil:
    visible: 'Edit budget'
    timeout: 3000

- tapOn:
    id: 'BudgetSetup.OverallLimitInput'
    point: '95%,50%'
- eraseText: 10
- inputText: '1500'

- tapOn:
    id: 'BudgetSetup.SaveButton'

- extendedWaitUntil:
    visible:
      id: 'BudgetWidget.SpentLabel'
      text: '42.00 / 1500.00'
    timeout: 3000

# --- Cancel edit discards changes ---

- tapOn:
    id: 'BudgetWidget.Card'
- extendedWaitUntil:
    visible: 'Edit budget'
    timeout: 3000

- tapOn:
    id: 'BudgetSetup.OverallLimitInput'
    point: '95%,50%'
- eraseText: 10
- inputText: '9999'

- tapOn: 'Cancel'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'BudgetWidget.SpentLabel'
      text: '42.00 / 1500.00'
    timeout: 3000

# --- Add per-category limits via edit ---

- tapOn:
    id: 'BudgetWidget.Card'
- extendedWaitUntil:
    visible: 'Edit budget'
    timeout: 3000

- scrollUntilVisible:
    element:
      id: 'BudgetSetup.CategoryLimitAddButton'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'BudgetSetup.CategoryLimitAddButton'
- runFlow:
    file: subflows/shared/select-category-by-search.flow.yaml
    env:
      CATEGORY_NAME: ${CATEGORY_NAME}

- extendedWaitUntil:
    visible:
      id: 'BudgetSetup.CategoryLimit.0.Row'
    timeout: 3000

- tapOn:
    id: 'BudgetSetup.CategoryLimit.0.AmountInput'
- inputText: '200'

- scrollUntilVisible:
    element:
      id: 'BudgetSetup.CategoryLimitAddButton'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'BudgetSetup.CategoryLimitAddButton'
- runFlow:
    file: subflows/shared/select-category-by-search.flow.yaml
    env:
      CATEGORY_NAME: 'Groceries'

- extendedWaitUntil:
    visible:
      id: 'BudgetSetup.CategoryLimit.1.Row'
    timeout: 3000

- tapOn:
    id: 'BudgetSetup.CategoryLimit.1.AmountInput'
- inputText: '100'

- tapOn:
    id: 'BudgetSetup.SaveButton'

# --- Widget renders both category rows after save ---

- extendedWaitUntil:
    visible:
      id: 'BudgetWidget.CategoryRow.42'
    timeout: 3000
- assertVisible:
    id: 'BudgetWidget.CategoryRow.11'

# --- Remove the second category limit; widget updates ---

- tapOn:
    id: 'BudgetWidget.Card'
- extendedWaitUntil:
    visible: 'Edit budget'
    timeout: 3000

- scrollUntilVisible:
    element:
      id: 'BudgetSetup.CategoryLimit.0.Row'
    direction: DOWN
    centerElement: true

- swipe:
    from:
      id: 'BudgetSetup.CategoryLimit.0.Row'
    direction: LEFT
    duration: 300
- extendedWaitUntil:
    visible:
      id: 'DeletableRow.DeleteButton'
    timeout: 3000
- tapOn:
    id: 'DeletableRow.DeleteButton'
- tapOn: 'Remove'
- waitForAnimationToEnd

- tapOn:
    id: 'BudgetSetup.SaveButton'

- extendedWaitUntil:
    visible:
      id: 'BudgetWidget.CategoryRow.42'
    timeout: 3000
- assertNotVisible:
    id: 'BudgetWidget.CategoryRow.11'

# --- Push toggle: ON persists across save + reopen ---

- tapOn:
    id: 'BudgetWidget.Card'
- extendedWaitUntil:
    visible: 'Edit budget'
    timeout: 3000

- tapOn:
    id: 'BudgetSetup.PushToggle'
- waitForAnimationToEnd

- tapOn:
    id: 'BudgetSetup.SaveButton'

- extendedWaitUntil:
    visible:
      id: 'BudgetWidget.Card'
    timeout: 3000

- tapOn:
    id: 'BudgetWidget.Card'
- extendedWaitUntil:
    visible: 'Edit budget'
    timeout: 3000

- assertVisible:
    id: 'BudgetSetup.PushToggle'

# --- Push toggle: OFF persists across save + reopen ---

- tapOn:
    id: 'BudgetSetup.PushToggle'
- waitForAnimationToEnd

- tapOn:
    id: 'BudgetSetup.SaveButton'

- extendedWaitUntil:
    visible:
      id: 'BudgetWidget.Card'
    timeout: 3000

- tapOn:
    id: 'BudgetWidget.Card'
- extendedWaitUntil:
    visible: 'Edit budget'
    timeout: 3000

- assertVisible:
    id: 'BudgetSetup.PushToggle'

- tapOn: 'Cancel'
- waitForAnimationToEnd

# --- Widget toggle: edit form disables widget, re-enables it ---

- tapOn:
    id: 'BudgetWidget.Card'
- extendedWaitUntil:
    visible: 'Edit budget'
    timeout: 3000

- scrollUntilVisible:
    element:
      id: 'BudgetSetup.WidgetEnabledToggle'
    direction: DOWN
    centerElement: true

- tapOn:
    id: 'BudgetSetup.WidgetEnabledToggle'
- waitForAnimationToEnd
- tapOn:
    id: 'BudgetSetup.SaveButton'

- extendedWaitUntil:
    visible:
      id: 'TabBar.Home'
    timeout: 3000
- assertNotVisible:
    id: 'BudgetWidget.Card'
- assertNotVisible:
    id: 'BudgetWidget.EmptyState'

- openLink: 'budgie://budget'
- extendedWaitUntil:
    visible: 'Edit budget'
    timeout: 3000

- scrollUntilVisible:
    element:
      id: 'BudgetSetup.WidgetEnabledToggle'
    direction: DOWN
    centerElement: true

- tapOn:
    id: 'BudgetSetup.WidgetEnabledToggle'
- waitForAnimationToEnd
- tapOn:
    id: 'BudgetSetup.SaveButton'

- extendedWaitUntil:
    visible:
      id: 'BudgetWidget.Card'
    timeout: 3000

# --- Delete budget, cascade to category limits, revert to empty state ---

- tapOn:
    id: 'BudgetWidget.Card'
- extendedWaitUntil:
    visible: 'Edit budget'
    timeout: 3000

- scrollUntilVisible:
    element:
      id: 'BudgetSetup.DeleteButton'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'BudgetSetup.DeleteButton'
- extendedWaitUntil:
    visible: 'Delete budget?'
    timeout: 3000
- tapOn: 'Delete'

- extendedWaitUntil:
    visible:
      id: 'BudgetWidget.EmptyState'
    timeout: 5000

appId: ${APP_ID}
env:
    FIXTURE_ROW_ID_MATCH: 'sync-binance-error.db'
---
- runFlow:
      file: subflows/import/import-database-from-settings.flow.yaml
      env:
          FIXTURE_ROW_ID_MATCH: ${FIXTURE_ROW_ID_MATCH}

- runFlow:
      file: subflows/navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://account/90/update'

- extendedWaitUntil:
      visible:
          id: 'AccountForm.ScrollView'
      timeout: 10000

- scrollUntilVisible:
      element:
          id: 'AccountSyncCard.Warning'
      direction: DOWN
      timeout: 5000

- assertVisible:
      id: 'AccountSyncCard.Warning'
      text: 'Binance is not available in your region.*'
- assertVisible: 'Sync failed'
- assertNotVisible:
      id: 'AccountSyncCard.LastError'

- runFlow:
      file: subflows/navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://create-account/BINANCE'

- extendedWaitUntil:
      visible:
          id: 'CreateBinanceAccount.ScrollView'
      timeout: 10000

- scrollUntilVisible:
      element: 'Not synced: Auto-Invest.*'
      direction: DOWN
      timeout: 5000

appId: ${APP_ID}
---
- runFlow:
    file: subflows/import/import-database-fixture.flow.yaml
    env:
      FIXTURE_ID: '08-settings-navigation'

- runFlow: subflows/navigation/navigate-to-settings.flow.yaml

- scrollUntilVisible:
    element:
      id: 'SettingsPage.ScreenshotProtectionCard'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'SettingsPage.ScreenshotProtectionSwitch'

- launchApp:
    permissions:
      contacts: allow
      microphone: allow
- extendedWaitUntil:
    visible:
      id: 'HomePage.TotalBalance'
    timeout: 30000

- runFlow: subflows/navigation/navigate-to-settings.flow.yaml

- scrollUntilVisible:
    element:
      id: 'SettingsPage.ScreenshotProtectionSwitch'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- assertVisible:
    id: 'SettingsPage.ScreenshotProtectionSwitch'

- launchApp:
    permissions:
      contacts: allow
      microphone: allow
- extendedWaitUntil:
    visible:
      id: 'HomePage.TotalBalance'
    timeout: 30000

appId: ${APP_ID}
---
- runFlow:
    file: subflows/import/import-database-from-settings.flow.yaml
    env:
      FIXTURE_ROW_ID_MATCH: 'e2e-08-settings-navigation.db(, db)?'

- runFlow: subflows/navigation/navigate-to-settings.flow.yaml

- scrollUntilVisible:
    element:
      id: 'SettingsPage.ScreenshotProtectionCard'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'SettingsPage.ScreenshotProtectionSwitch'

- launchApp:
    permissions:
      contacts: allow
      microphone: allow
- extendedWaitUntil:
    visible:
      id: 'HomePage.TotalBalance'
    timeout: 3000

- runFlow: subflows/navigation/navigate-to-settings.flow.yaml

- scrollUntilVisible:
    element:
      id: 'SettingsPage.ScreenshotProtectionSwitch'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- assertVisible:
    id: 'SettingsPage.ScreenshotProtectionSwitch'

- launchApp:
    permissions:
      contacts: allow
      microphone: allow
- extendedWaitUntil:
    visible:
      id: 'HomePage.TotalBalance'
    timeout: 3000

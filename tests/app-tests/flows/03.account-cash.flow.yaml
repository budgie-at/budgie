appId: ${APP_ID}
---

- runFlow: subflows/enter-app.flow.yaml

- runFlow:
    file: subflows/account/create-cash-account.flow.yaml
    env:
      ACCOUNT_NAME: 'E2E Savings Account'
      CURRENCY_CODE: 'CAD'
      ACCOUNT_AMOUNT: '250'

- runFlow:
    file: subflows/account/exercise-liability-account.flow.yaml
    env:
      ACCOUNT_NAME: 'E2E Savings Account'
      CURRENCY_CODE: 'CAD'
      UPDATED_ACCOUNT_NAME: 'E2E Savings Account CAD'
      INITIAL_AMOUNT: '250'
      INCREASE_TO: '325'
      INCREASE_DELTA: '75'
      DECREASE_TO: '275'
      DECREASE_DELTA: '50'

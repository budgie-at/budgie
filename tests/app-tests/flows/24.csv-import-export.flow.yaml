appId: ${APP_ID}
---
- runFlow:
    commands:
      - launchApp:
          appId: ${APP_ID}
          clearState: false
          permissions:
            contacts: allow
            microphone: allow
          arguments:
            e2eReset: true
            e2eImportFixtureCsv: true
            e2eResetToken: '${MAESTRO_FILENAME}-${E2E_RUN_TOKEN}'
      - retry:
          maxRetries: 3
          commands:
            - runFlow: subflows/handle-dev-client-startup.flow.yaml
            - waitForAnimationToEnd
            - extendedWaitUntil:
                visible:
                  id: 'HomePage.TotalBalance'
                timeout: 30000

- runFlow: subflows/relaunch-app.flow.yaml

- assertVisible:
    id: 'HomePage.NetWorthValue.87_5'

- runFlow: subflows/navigate-to-settings.flow.yaml

- scrollUntilVisible:
    element:
      id: 'CsvPage.ExportCard'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'CsvPage.ExportCard'

- extendedWaitUntil:
    visible: 'Done'
    timeout: 10000

- launchApp:
    appId: ${APP_ID}
    clearState: false
    permissions:
      contacts: allow
      microphone: allow
    arguments:
      e2eReset: true
      e2eResetToken: '${MAESTRO_FILENAME}-${E2E_RUN_TOKEN}-export'
      e2eImportExportedCsv: true
- retry:
    maxRetries: 3
    commands:
      - runFlow: subflows/handle-dev-client-startup.flow.yaml
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'HomePage.TotalBalance'
    timeout: 30000

- runFlow: subflows/relaunch-app.flow.yaml

- assertVisible:
    id: 'HomePage.NetWorthValue.87_5'

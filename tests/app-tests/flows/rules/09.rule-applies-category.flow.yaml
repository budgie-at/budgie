appId: com.vitalyiegorov.budgie
---
# Test 09: Rule applies SET_CATEGORY action to existing transactions
# Creates an expense transaction, then creates a rule that matches it with "Apply to existing" enabled
# Verifies the transaction now shows the category

# First, create an expense transaction with title "Netflix" (no category)
- runFlow:
    file: ../shared/create-expense-transaction.flow.yaml
    env:
      TITLE: 'Netflix Subscription'
      AMOUNT: '15'

# Navigate to Rules page
- runFlow:
    file: ../shared/navigate-to-rules.flow.yaml

# Open the FAB menu
- tapOn:
    id: 'CreateTransactionTrigger'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.CreateButton'
    timeout: 3000
- waitForAnimationToEnd
# Tap the Rule action item
- tapOn:
    id: 'RulesPage.CreateButton'
- extendedWaitUntil:
    visible: 'Create Rule'
    timeout: 5000

# Configure condition: Title CONTAINS "Netflix"
- tapOn:
    id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Netflix'

# Configure action: SET_CATEGORY (default action)
- tapOn:
    id: 'RuleForm.Action.0.CategorySelector'
# Wait for bottom sheet to open
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000
# Tap on the first category (around 28% from top)
- tapOn:
    point: 50%, 28%
# Wait for bottom sheet to close
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 1500

# Enable "Apply to existing transactions"
- scrollUntilVisible:
    element:
      id: 'RuleForm.ApplyToExistingToggle'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'RuleForm.ApplyToExistingToggle'

# Submit the rule
- tapOn:
    id: 'RuleForm.Footer.SubmitButton'
# Wait for navigation back to Rules page
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000

# Verify rule was created
- assertVisible:
    id: 'RulesPage.RuleCard.0'

# Navigate to Transactions to verify the category was applied
- tapOn:
    id: 'TabBar.Transactions'
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000

# Verify the transaction now shows the category badge
- assertVisible:
    id: 'TransactionList.Card.1.CategoryBadge'

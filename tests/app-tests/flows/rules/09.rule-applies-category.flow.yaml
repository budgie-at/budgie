appId: ${APP_ID}
env:
  ACCOUNT_NAME: Rules Test Account
  CATEGORY_NAME: Rules Test Category
  ORIGINAL_CATEGORY_NAME: Test09 Original Category
  TAG_NAME: Rules Test Tag
---

- runFlow:
    file: ../setup/setup-rules-test.flow.yaml

- runFlow:
    file: ../subflows/create-category.flow.yaml
    env:
      CATEGORY_NAME: ${ORIGINAL_CATEGORY_NAME}

- runFlow:
    file: ../subflows/create-expense.flow.yaml
    env:
      DIGIT_1: '1'
      DIGIT_2: '5'
      ACCOUNT_NAME: ${ACCOUNT_NAME}
      CATEGORY_NAME: ${ORIGINAL_CATEGORY_NAME}
      COMMENT: 'Netflix Subscription'

- runFlow:
    file: ../subflows/navigate-to-rules.flow.yaml

- tapOn:
    id: 'ActionButton'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.CreateButton'
- waitForAnimationToEnd
- tapOn:
    id: 'RulesPage.CreateButton'
- extendedWaitUntil:
    visible: 'Create Rule'

- tapOn:
    id: 'RuleForm.Condition.0.FieldSelector'
- waitForAnimationToEnd
- tapOn: 'Comment'
- waitForAnimationToEnd
- tapOn:
    id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Netflix'

- tapOn: return

- tapOn:
    id: 'RuleForm.Action.0.CategorySelector'
- runFlow:
    file: ../shared/select-category-by-search.flow.yaml
    env:
      CATEGORY_NAME: ${CATEGORY_NAME}

- tapOn:
    id: 'RuleForm.Footer.SubmitButton'
- extendedWaitUntil:
    visible: 'Apply to existing transactions?'
    timeout: 10000
- tapOn: 'Apply'
- waitForAnimationToEnd

- assertVisible:
    id: 'RulesPage.RuleCard.0'

- tapOn:
    id: 'TabBar.Transactions'
- waitForAnimationToEnd

- swipe:
    direction: DOWN
    duration: 500
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'TransactionCard.Label.Netflix_Subscription'
- extendedWaitUntil:
    visible:
      id: 'TransactionCard.Category.Rules_Test_Category'

appId: ${APP_ID}
env:
  TEST_ID: '20'
  ACCOUNT_NAME: ${ACCOUNT_NAME || 'Test20 Account'}
  CATEGORY_NAME: ${CATEGORY_NAME || 'Test20 Category'}
  TAG_NAME: ${TAG_NAME || 'Test20 Tag'}
---

- runFlow:
    file: ../setup/setup-rules-test.flow.yaml
    env:
      TEST_ID: ${TEST_ID}
      ACCOUNT_NAME: ${ACCOUNT_NAME}
      CATEGORY_NAME: ${CATEGORY_NAME}
      TAG_NAME: ${TAG_NAME}

- runFlow:
    file: ../shared/navigate-to-rules.flow.yaml

- tapOn:
    id: 'ActionButton'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.CreateButton'
- waitForAnimationToEnd

- tapOn:
    id: 'RulesPage.CreateButton'
- extendedWaitUntil:
    visible: 'Create Rule'

- tapOn:
    id: 'RuleForm.Condition.0.FieldSelector'
- tapOn:
    id: RuleForm.SelectorCard.AMOUNT

- tapOn:
    id: 'RuleForm.Condition.0.OperatorSelector'
- tapOn:
    id: RuleForm.SelectorCard.BETWEEN

- tapOn:
    id: 'RuleForm.Condition.0.ValueInput'
- inputText: '10'

- tapOn:
    id: 'RuleForm.Condition.0.SecondaryValueInput'
- inputText: '100'

- scrollUntilVisible:
    element:
      id: 'RuleForm.Action.0.CategorySelector'
    direction: DOWN

- tapOn:
    id: 'RuleForm.Action.0.CategorySelector'
- runFlow:
    file: ../shared/select-category-by-search.flow.yaml
    env:
      CATEGORY_NAME: ${CATEGORY_NAME}

- tapOn:
    id: 'RuleForm.Footer.SubmitButton'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.Page'

- assertVisible:
    id: 'RulesPage.RuleCard.0'

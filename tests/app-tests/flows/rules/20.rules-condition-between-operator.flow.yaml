appId: ${APP_ID}
env:
  ACCOUNT_NAME: Rules Test Account
  CATEGORY_NAME: Rules Test Category
  TAG_NAME: Rules Test Tag
---

- runFlow:
    file: ../setup/setup-rules-test.flow.yaml

- runFlow:
    file: ../subflows/navigate-to-rules.flow.yaml

- tapOn:
    id: 'ActionButton'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.CreateButton'
- waitForAnimationToEnd

- tapOn:
    id: 'RulesPage.CreateButton'
- extendedWaitUntil:
    visible: 'Create Rule'

- tapOn:
    id: 'RuleForm.Condition.0.FieldSelector'
- tapOn:
    id: RuleForm.SelectorCard.AMOUNT
- waitForAnimationToEnd

- tapOn:
    id: 'RuleForm.Condition.0.OperatorSelector'
- tapOn:
    id: RuleForm.SelectorCard.BETWEEN
- waitForAnimationToEnd

- tapOn:
    id: 'RuleForm.Condition.0.ValueInput'
- inputText: '10'

- tapOn:
    text: 'Conditions'
- waitForAnimationToEnd

- tapOn:
    id: 'RuleForm.Condition.0.SecondaryValueInput'
- inputText: '100'

- tapOn:
    text: 'Actions'
- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      id: 'RuleForm.Action.0.CategorySelector'
    direction: DOWN
    centerElement: true

- tapOn:
    id: 'RuleForm.Action.0.CategorySelector'
- runFlow:
    file: ../shared/select-category-by-search.flow.yaml
    env:
      CATEGORY_NAME: ${CATEGORY_NAME}

- tapOn:
    id: 'RuleForm.Footer.SubmitButton'
- runFlow:
    when:
      visible: 'Apply to existing transactions?'
    commands:
      - tapOn: 'Skip'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.Page'

- assertVisible:
    id: 'RulesPage.RuleCard.0'

appId: ${APP_ID}
env:
  ACCOUNT_NAME: Rules Test Account
  CATEGORY_NAME: Rules Test Category
  TAG_NAME: Rules Test Tag
---

- runFlow:
    file: ../setup/setup-rules-test.flow.yaml

- runFlow:
    file: ../subflows/navigate-to-rules.flow.yaml

# Create first rule: Title CONTAINS "Test" → SET_CATEGORY
- tapOn:
    id: 'ActionButton'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.CreateButton'
- waitForAnimationToEnd

- tapOn:
    id: 'RulesPage.CreateButton'
- extendedWaitUntil:
    visible: 'Create Rule'

- tapOn:
    id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Test'

- tapOn: return

- tapOn:
    id: 'RuleForm.Action.0.CategorySelector'

- runFlow:
    file: ../shared/select-category-by-search.flow.yaml
    env:
      CATEGORY_NAME: ${CATEGORY_NAME}

- tapOn:
    id: 'RuleForm.Footer.SubmitButton'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.Page'

- assertVisible:
    id: 'RulesPage.RuleCard.0'

# Create second rule: Title CONTAINS "Other" → SET_CATEGORY (default)
- tapOn:
    id: 'ActionButton'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.CreateButton'
- waitForAnimationToEnd

- tapOn:
    id: 'RulesPage.CreateButton'
- extendedWaitUntil:
    visible: 'Create Rule'

- tapOn:
    id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Other'

- tapOn: return

# Assert the conflict warning is visible
- assertVisible: 'Some transactions may match multiple rules'

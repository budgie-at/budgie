appId: com.vitalyiegorov.budgie
---

- runFlow:
    file: ../shared/navigate-to-rules.flow.yaml

- assertVisible:
    id: 'RulesPage.RuleCard.0'

- swipe:
    from:
      id: 'RulesPage.RuleCard.0'
    direction: LEFT
    duration: 300

- tapOn:
    point: 90%, 50%

- tapOn:
    point: 75%, 53%

- assertVisible:
    id: 'RulesPage.Page'

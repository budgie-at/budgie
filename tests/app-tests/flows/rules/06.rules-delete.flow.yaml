appId: com.vitalyiegorov.budgie
---
# Test 06: Delete a rule
# Deletes the first rule using swipe to delete

# Navigate to Rules page
- runFlow:
    file: ../shared/navigate-to-rules.flow.yaml

# Count initial rules - we should have created 3 rules so far
- assertVisible:
    id: 'RulesPage.RuleCard.0'

# Swipe left on the first rule to reveal delete
- swipe:
    from:
      id: 'RulesPage.RuleCard.0'
    direction: LEFT
    duration: 300

# Tap delete button (appears after swipe)
# Wait for delete action to appear
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 1000
# Tap delete at the right side of the row
- tapOn:
    point: 90%, 50%

# Wait for confirmation alert and tap Delete
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 1500
# Tap Delete button in native alert (usually around center-right of screen)
- tapOn:
    point: 75%, 53%

# Wait for deletion to complete
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000

# Verify rule list still loads (may have fewer rules)
- assertVisible:
    id: 'RulesPage.Page'

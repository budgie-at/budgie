appId: ${APP_ID}
---
# Test 14: Rule does NOT apply when conditions don't match
# Creates an expense transaction with "Spotify Premium" comment, then creates a rule
# that looks for "Netflix" in the comment. Verifies the rule is NOT applied since conditions don't match.

# First, create an expense transaction with comment "Spotify Premium" (no category)
- runFlow:
    file: ../shared/create-expense-transaction.flow.yaml
    env:
      TITLE: 'Spotify Premium'
      AMOUNT: '10'

# Navigate to Rules page
- runFlow:
    file: ../shared/navigate-to-rules.flow.yaml

# Create a new rule
- tapOn:
    text: 'Rule'
- extendedWaitUntil:
    visible: 'Create Rule'
    timeout: 3000

# Change field to Comment
- tapOn:
    id: 'RuleForm.Condition.0.FieldSelector'
- extendedWaitUntil:
    visible: 'Select Field'
    timeout: 3000
- tapOn:
    text: 'Comment'

# Configure condition: Comment CONTAINS "Netflix" (will NOT match "Spotify Premium")
- tapOn:
    id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Netflix'

# Configure action: SET_CATEGORY (default action)
- tapOn:
    id: 'RuleForm.Action.0.CategorySelector'
- extendedWaitUntil:
    visible: 'Select Category'
    timeout: 3000

# Select Test Category
- tapOn:
    text: 'Test Category'

# Enable "Apply to existing transactions"
- scrollUntilVisible:
    element:
      id: 'RuleForm.ApplyToExistingToggle'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'RuleForm.ApplyToExistingToggle'

# Submit the rule
- tapOn:
    text: 'Create Rule'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.Page'
    timeout: 5000

# Navigate to Transactions to verify the category was NOT applied
- tapOn:
    id: 'TabBar.Transactions'
- extendedWaitUntil:
    visible: 'Transactions'
    timeout: 3000

# Verify the transaction still shows "Unknown" (no category) since conditions didn't match
- assertVisible:
    text: 'Spotify Premium'
- assertVisible:
    text: 'Unknown'

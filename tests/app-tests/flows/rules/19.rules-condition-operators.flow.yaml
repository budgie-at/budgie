appId: ${APP_ID}
env:
  ACCOUNT_NAME: Rules Test Account
  CATEGORY_NAME: Rules Test Category
  TAG_NAME: Rules Test Tag
---

- runFlow:
    file: ../setup/setup-rules-test.flow.yaml

- runFlow:
    file: ../subflows/navigate-to-rules.flow.yaml

# Rule 1: Title EQUALS operator
- tapOn:
    id: 'ActionButton'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.CreateButton'
- waitForAnimationToEnd
- tapOn:
    id: 'RulesPage.CreateButton'
- extendedWaitUntil:
    visible: 'Create Rule'

- tapOn:
    id: 'RuleForm.Condition.0.OperatorSelector'
- tapOn:
    id: RuleForm.SelectorCard.EQUALS
- waitForAnimationToEnd

- tapOn:
    id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Exact Match'

- tapOn: return

- tapOn:
    id: 'RuleForm.Action.0.CategorySelector'
- runFlow:
    file: ../shared/select-category-by-search.flow.yaml
    env:
      CATEGORY_NAME: ${CATEGORY_NAME}

- tapOn:
    id: 'RuleForm.Footer.SubmitButton'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.Page'

- assertVisible:
    id: 'RulesPage.RuleCard.0'

# Rule 2: Comment NOT_CONTAINS operator
- tapOn:
    id: 'ActionButton'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.CreateButton'
- waitForAnimationToEnd
- tapOn:
    id: 'RulesPage.CreateButton'
- extendedWaitUntil:
    visible: 'Create Rule'

- tapOn:
    id: 'RuleForm.Condition.0.FieldSelector'
- tapOn:
    id: RuleForm.SelectorCard.COMMENT
- waitForAnimationToEnd

- tapOn:
    id: 'RuleForm.Condition.0.OperatorSelector'
- tapOn:
    id: RuleForm.SelectorCard.NOT_CONTAINS
- waitForAnimationToEnd

- tapOn:
    id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'exclude'

- tapOn: return

- scrollUntilVisible:
    element:
      id: 'RuleForm.Action.0.CategorySelector'
    direction: DOWN

- tapOn:
    id: 'RuleForm.Action.0.CategorySelector'
- runFlow:
    file: ../shared/select-category-by-search.flow.yaml
    env:
      CATEGORY_NAME: ${CATEGORY_NAME}

- tapOn:
    id: 'RuleForm.Footer.SubmitButton'
- runFlow:
    when:
      visible: 'Apply to existing transactions?'
    commands:
      - tapOn: 'Skip'
- waitForAnimationToEnd

- assertVisible:
    id: 'RulesPage.RuleCard.1'

# Rule 3: Amount LESS_THAN operator
- tapOn:
    id: 'ActionButton'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.CreateButton'
- waitForAnimationToEnd
- tapOn:
    id: 'RulesPage.CreateButton'
- extendedWaitUntil:
    visible: 'Create Rule'

- tapOn:
    id: 'RuleForm.Condition.0.FieldSelector'
- tapOn:
    id: RuleForm.SelectorCard.AMOUNT
- waitForAnimationToEnd

- tapOn:
    id: 'RuleForm.Condition.0.OperatorSelector'
- tapOn:
    id: RuleForm.SelectorCard.LESS_THAN
- waitForAnimationToEnd

- tapOn:
    id: 'RuleForm.Condition.0.ValueInput'
- inputText: '50'

- scrollUntilVisible:
    element:
      id: 'RuleForm.Action.0.CategorySelector'
    direction: DOWN

- tapOn:
    id: 'RuleForm.Action.0.CategorySelector'
- runFlow:
    file: ../shared/select-category-by-search.flow.yaml
    env:
      CATEGORY_NAME: ${CATEGORY_NAME}

- tapOn:
    id: 'RuleForm.Footer.SubmitButton'
- runFlow:
    when:
      visible: 'Apply to existing transactions?'
    commands:
      - tapOn: 'Skip'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.Page'

- assertVisible:
    id: 'RulesPage.RuleCard.2'

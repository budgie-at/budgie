appId: com.vitalyiegorov.budgie
---
# Test 08: Test different field types for conditions
# Creates a rule using Amount field with GREATER_THAN operator

# Navigate to Rules page
- runFlow:
    file: ../shared/navigate-to-rules.flow.yaml

# Open the FAB menu
- tapOn:
    id: 'CreateTransactionTrigger'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.CreateButton'
    timeout: 3000
- waitForAnimationToEnd
# Tap the Rule action item
- tapOn:
    id: 'RulesPage.CreateButton'
- extendedWaitUntil:
    visible: 'Create Rule'
    timeout: 5000

# Change field to Amount
- tapOn:
    id: 'RuleForm.Condition.0.FieldSelector'
# Wait for bottom sheet to open
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000
# Tap on Amount (around 38% from top - second item after Title)
- tapOn:
    point: 50%, 38%
# Swipe down to dismiss the field selector bottom sheet (it doesn't auto-close)
- swipe:
    start: 50%, 50%
    end: 50%, 90%
    duration: 300
# Wait for bottom sheet to close
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 1500

# Change operator to Greater Than
- tapOn:
    id: 'RuleForm.Condition.0.OperatorSelector'
# Wait for bottom sheet to open
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000
# Tap on Greater Than (around 38% from top - second item)
- tapOn:
    point: 50%, 38%
# Swipe down to dismiss the operator bottom sheet (it doesn't auto-close)
- swipe:
    start: 50%, 50%
    end: 50%, 90%
    duration: 300
# Wait for bottom sheet to close
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 1500

# Enter amount value
- tapOn:
    id: 'RuleForm.Condition.0.ValueInput'
- inputText: '100'

# Select category for action
- tapOn:
    id: 'RuleForm.Action.0.CategorySelector'
# Wait for bottom sheet to open
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000
# Tap on the first category (around 28% from top)
- tapOn:
    point: 50%, 28%
# Wait for bottom sheet to close
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 1500

# Submit the rule
- tapOn:
    id: 'RuleForm.Footer.SubmitButton'
# Wait for navigation back to Rules page
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000

# Verify rule was created
- assertVisible:
    id: 'RulesPage.RuleCard.0'

appId: com.vitalyiegorov.budgie
---

- runFlow:
    file: ../shared/navigate-to-rules.flow.yaml

- tapOn:
    id: 'CreateTransactionTrigger'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.CreateButton'
    timeout: 3000
- waitForAnimationToEnd
- tapOn:
    id: 'RulesPage.CreateButton'
- extendedWaitUntil:
    visible: 'Create Rule'
    timeout: 5000

- tapOn:
    id: 'RuleForm.Condition.0.FieldSelector'
- tapOn:
    id: RuleForm.SelectorCard.AMOUNT

- tapOn:
    id: 'RuleForm.Condition.0.OperatorSelector'
- tapOn:
    id: RuleForm.SelectorCard.GREATER_THAN

- tapOn:
    id: 'RuleForm.Condition.0.ValueInput'
- inputText: '100'

- tapOn:
    id: RuleForm.Action.0.TypeSelector
- tapOn:
    id: RuleForm.SelectorCard.SET_CATEGORY

- tapOn:
    id: RuleForm.Action.0.CategorySelector
- tapOn:
    id: CategoryPickerBottomSheet.Input
- inputText: 'Groceries'
- tapOn:
    text: 'Groceries'
    index: 1

- tapOn:
    id: 'RuleForm.Footer.SubmitButton'

- assertVisible:
    id: 'RulesPage.RuleCard.0'

- assertVisible: 1, If all of:, |, Title contains "Netflix Updated", |, Title contains "Premium", Then:, |, set category to Car & Fuel

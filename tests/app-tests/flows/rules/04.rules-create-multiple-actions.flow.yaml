appId: ${APP_ID}
---
# Test 04: Create a rule with multiple actions
# Creates a rule: Title CONTAINS "Amazon" -> SET_CATEGORY + ADD_TAG

# Navigate to Rules page
- runFlow:
    file: ../shared/navigate-to-rules.flow.yaml

# Tap the create action button
- tapOn:
    text: 'Rule'
- extendedWaitUntil:
    visible: 'Create Rule'
    timeout: 3000

# First condition: Title contains "Amazon"
- tapOn:
    id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Amazon'

# First action: Select category
- tapOn:
    id: 'RuleForm.Action.0.CategorySelector'
- extendedWaitUntil:
    visible: 'Select Category'
    timeout: 3000
- tapOn:
    text: 'Test Category'

# Add second action
- tapOn:
    id: 'RuleForm.ActionSection.AddButton'

# Second action: Change type to ADD_TAG
- tapOn:
    id: 'RuleForm.Action.1.TypeSelector'
- extendedWaitUntil:
    visible: 'Select Action Type'
    timeout: 3000
- tapOn:
    text: 'Add Tag'

# Select tag for second action
- tapOn:
    id: 'RuleForm.Action.1.TagSelector'
- extendedWaitUntil:
    visible: 'Select Tag'
    timeout: 3000
- tapOn:
    text: 'Test Tag'

# Submit the rule
- tapOn:
    text: 'Create Rule'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.Page'
    timeout: 5000

# Verify rule was created
- assertVisible:
    text: 'Amazon'

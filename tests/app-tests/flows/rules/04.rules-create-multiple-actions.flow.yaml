appId: ${APP_ID}
env:
  TEST_ID: '04'
  ACCOUNT_NAME: Test04 Account
  CATEGORY_NAME: Test04 Category
  TAG_NAME: Test04 Tag
---
# Test 04: Create a rule with multiple actions
# Creates a rule: Title CONTAINS "Amazon" -> SET_CATEGORY + ADD_TAG

# Setup - creates account, category, tag with unique names
- runFlow:
    file: ../setup/setup-rules-test.flow.yaml
    env:
      TEST_ID: ${TEST_ID}
      ACCOUNT_NAME: ${ACCOUNT_NAME}
      CATEGORY_NAME: ${CATEGORY_NAME}
      TAG_NAME: ${TAG_NAME}

# Navigate to Rules page
- runFlow:
    file: ../shared/navigate-to-rules.flow.yaml

# Open FAB and tap Create Rule
- tapOn:
    id: 'CreateTransactionTrigger'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.CreateButton'
    timeout: 3000
- waitForAnimationToEnd
- tapOn:
    id: 'RulesPage.CreateButton'
- extendedWaitUntil:
    visible: 'Create Rule'
    timeout: 5000

# Enter condition value
- tapOn:
    id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Amazon'

# Select category for first action using search
- tapOn:
    id: 'RuleForm.Action.0.CategorySelector'
- runFlow:
    file: ../shared/select-category-by-search.flow.yaml
    env:
      CATEGORY_NAME: ${CATEGORY_NAME}

# Add second action
- scrollUntilVisible:
    element:
      id: 'RuleForm.ActionSection.AddButton'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'RuleForm.ActionSection.AddButton'

# Change second action type to ADD_TAG
- scrollUntilVisible:
    element:
      id: 'RuleForm.Action.1.TypeSelector'
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn:
    id: 'RuleForm.Action.1.TypeSelector'
- tapOn:
    id: 'RuleForm.SelectorCard.ADD_TAG'
- waitForAnimationToEnd

# Select tag for second action using search
- tapOn:
    id: 'RuleForm.Action.1.TagSelector'
- runFlow:
    file: ../shared/select-tag-by-search.flow.yaml
    env:
      TAG_NAME: ${TAG_NAME}

# Submit the rule
- tapOn:
    id: 'RuleForm.Footer.SubmitButton'
- waitForAnimationToEnd

# Verify rule was created
- assertVisible:
    id: 'RulesPage.RuleCard.0'

appId: ${APP_ID}
env:
  TEST_ID: '11'
  ACCOUNT_NAME: Test11 Account
  CATEGORY_NAME: Test11 Category
  ORIGINAL_CATEGORY_NAME: Test11 Original
  TAG_NAME: Test11 Tag
---

- runFlow:
    file: ../setup/setup-rules-test.flow.yaml
    env:
      TEST_ID: ${TEST_ID}
      ACCOUNT_NAME: ${ACCOUNT_NAME}
      CATEGORY_NAME: ${CATEGORY_NAME}
      TAG_NAME: ${TAG_NAME}

- runFlow:
    file: ../setup/create-category.flow.yaml
    env:
      CATEGORY_NAME: ${ORIGINAL_CATEGORY_NAME}

- tapOn:
    id: 'TabBar.Transactions'
- extendedWaitUntil:
    visible: 'Transactions'

- tapOn:
    id: 'ActionButton'
- extendedWaitUntil:
    visible:
      id: 'ActionItem.0'
- waitForAnimationToEnd

- tapOn:
    text: 'Expense'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'New Expense'

- tapOn:
    id: 'TransactionForm.AmountInput'
- inputText: '50'

- tapOn:
    id: 'TransactionForm.AccountSelector'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'TransactionForm.AccountSearchInput'
- tapOn:
    id: 'TransactionForm.AccountSearchInput'
- inputText: ${ACCOUNT_NAME}
- extendedWaitUntil:
    visible:
      id: 'TransactionForm.Account'
- tapOn:
    id: 'TransactionForm.Account'


- tapOn: 'Select category'
- runFlow:
    file: ../shared/select-category-by-search.flow.yaml
    env:
      CATEGORY_NAME: ${ORIGINAL_CATEGORY_NAME}

- swipe:
    from:
      id: 'TransactionForm.CategorySelector'
    direction: UP

- tapOn: 'Add a note...'
- inputText: 'Amazon Purchase'

- tapOn: 'Add Expense'

- extendedWaitUntil:
    visible: 'Transactions'

- runFlow:
    file: ../shared/navigate-to-rules.flow.yaml

- tapOn:
    id: 'ActionButton'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.CreateButton'
- waitForAnimationToEnd
- tapOn:
    id: 'RulesPage.CreateButton'
- extendedWaitUntil:
    visible: 'Create Rule'

- tapOn:
    id: 'RuleForm.Condition.0.FieldSelector'
- waitForAnimationToEnd
- tapOn: 'Comment'
- waitForAnimationToEnd
- tapOn:
    id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Amazon'

- tapOn:
    id: 'RuleForm.Action.0.CategorySelector'
- runFlow:
    file: ../shared/select-category-by-search.flow.yaml
    env:
      CATEGORY_NAME: ${CATEGORY_NAME}

- scrollUntilVisible:
    element:
      id: 'RuleForm.ActionSection.AddButton'
    direction: DOWN
- tapOn:
    id: 'RuleForm.ActionSection.AddButton'

- scrollUntilVisible:
    element:
      id: 'RuleForm.Action.1.TypeSelector'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'RuleForm.Action.1.TypeSelector'
- tapOn:
    id: 'RuleForm.SelectorCard.ADD_TAG'
- waitForAnimationToEnd

- tapOn:
    id: 'RuleForm.Action.1.TagSelector'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: ${TAG_NAME}
- tapOn: ${TAG_NAME}

- tapOn:
    id: 'RuleForm.Footer.SubmitButton'
- extendedWaitUntil:
    visible: 'Apply to existing transactions?'
    timeout: 10000
- tapOn: 'Apply'
- waitForAnimationToEnd

- assertVisible:
    id: 'RulesPage.RuleCard.0'
- assertVisible: 1, If all of:, |, Comment contains "Amazon", Then:, |, set category to Test11 Category, |, add tag Test11 Tag

- tapOn:
    id: 'TabBar.Transactions'
- waitForAnimationToEnd

- swipe:
    direction: DOWN
    duration: 500
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'TransactionList.Card.1.CategoryBadge'
- extendedWaitUntil:
    visible:
      id: 'TransactionList.Card.1.Tag'

- tapOn:
    id: 'TransactionList.Card.1'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: ${CATEGORY_NAME}

- assertNotVisible: ${ORIGINAL_CATEGORY_NAME}

- extendedWaitUntil:
    visible: ${TAG_NAME}


appId: ${APP_ID}
---
# Test 11: Rule applies multiple actions (SET_CATEGORY + ADD_TAG) to existing transactions
# Creates an expense transaction, then creates a rule with 2 actions
# Verifies both category and tag are applied

# First, create an expense transaction with title "Amazon"
- runFlow:
    file: ../shared/create-expense-transaction.flow.yaml
    env:
      TITLE: 'Amazon Purchase'
      AMOUNT: '50'

# Navigate to Rules page
- runFlow:
    file: ../shared/navigate-to-rules.flow.yaml

# Create a new rule
- tapOn:
    text: 'Rule'
- extendedWaitUntil:
    visible: 'Create Rule'
    timeout: 3000

# Configure condition: Title CONTAINS "Amazon"
- tapOn:
    id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Amazon'

# Configure first action: SET_CATEGORY (default)
- tapOn:
    id: 'RuleForm.Action.0.CategorySelector'
- extendedWaitUntil:
    visible: 'Select Category'
    timeout: 3000
- tapOn:
    text: 'Test Category'

# Add second action
- scrollUntilVisible:
    element:
      id: 'RuleForm.ActionSection.AddButton'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'RuleForm.ActionSection.AddButton'

# Configure second action: ADD_TAG
- tapOn:
    id: 'RuleForm.Action.1.TypeSelector'
- extendedWaitUntil:
    visible: 'Add Tag'
    timeout: 3000
- tapOn:
    text: 'Add Tag'

# Select tag
- tapOn:
    id: 'RuleForm.Action.1.TagSelector'
- extendedWaitUntil:
    visible: 'Select Tag'
    timeout: 3000
- tapOn:
    text: 'Test Tag'

# Enable "Apply to existing transactions"
- scrollUntilVisible:
    element:
      id: 'RuleForm.ApplyToExistingToggle'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'RuleForm.ApplyToExistingToggle'

# Submit the rule
- tapOn:
    text: 'Create Rule'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.Page'
    timeout: 5000

# Navigate to Transactions to verify both category and tag were applied
- tapOn:
    id: 'TabBar.Transactions'
- extendedWaitUntil:
    visible: 'Transactions'
    timeout: 3000

# Verify the transaction shows both "Test Category" and "Test Tag"
- assertVisible:
    text: 'Test Category'
- assertVisible:
    text: 'Test Tag'

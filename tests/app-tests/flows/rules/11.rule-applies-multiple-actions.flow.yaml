appId: ${APP_ID}
env:
  ACCOUNT_NAME: Rules Test Account
  CATEGORY_NAME: Rules Test Category
  ORIGINAL_CATEGORY_NAME: Test11 Original
  TAG_NAME: Rules Test Tag
---

- runFlow:
    file: ../setup/setup-rules-test.flow.yaml

- runFlow:
    file: ../subflows/create-category.flow.yaml
    env:
      CATEGORY_NAME: ${ORIGINAL_CATEGORY_NAME}

- runFlow:
    file: ../subflows/create-expense.flow.yaml
    env:
      DIGIT_1: '5'
      DIGIT_2: '0'
      ACCOUNT_NAME: ${ACCOUNT_NAME}
      CATEGORY_NAME: ${ORIGINAL_CATEGORY_NAME}
      COMMENT: 'Amazon Purchase'

- runFlow:
    file: ../subflows/navigate-to-rules.flow.yaml

- tapOn:
    id: 'ActionButton'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.CreateButton'
- waitForAnimationToEnd
- tapOn:
    id: 'RulesPage.CreateButton'
- extendedWaitUntil:
    visible: 'Create Rule'

- tapOn:
    id: 'RuleForm.Condition.0.FieldSelector'
- waitForAnimationToEnd
- tapOn: 'Comment'
- waitForAnimationToEnd
- tapOn:
    id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Amazon'

- tapOn: return

- tapOn:
    id: 'RuleForm.Action.0.CategorySelector'
- runFlow:
    file: ../shared/select-category-by-search.flow.yaml
    env:
      CATEGORY_NAME: ${CATEGORY_NAME}

- scrollUntilVisible:
    element:
      id: 'RuleForm.ActionSection.AddButton'
    direction: DOWN
- tapOn:
    id: 'RuleForm.ActionSection.AddButton'

- scrollUntilVisible:
    element:
      id: 'RuleForm.Action.1.TypeSelector'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'RuleForm.Action.1.TypeSelector'
- tapOn:
    id: 'RuleForm.SelectorCard.ADD_TAG'
- swipe:
    start: 50%, 50%
    end: 50%, 90%
- waitForAnimationToEnd

- tapOn:
    id: 'RuleForm.Action.1.TagSelector'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: ${TAG_NAME}
- tapOn: ${TAG_NAME}

- tapOn:
    id: 'RuleForm.Footer.SubmitButton'
- extendedWaitUntil:
    visible: 'Apply to existing transactions?'
    timeout: 10000
- tapOn: 'Apply'
- waitForAnimationToEnd

- assertVisible:
    id: 'RulesPage.RuleCard.0'
- assertVisible:
    id: 'RulesPage.RuleCard.0.Conditions'
- assertVisible:
    id: 'RulesPage.RuleCard.0.Actions'

- tapOn:
    id: 'TabBar.Transactions'
- waitForAnimationToEnd

- swipe:
    direction: DOWN
    duration: 500
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'TransactionCard.Category.Rules_Test_Category'
- extendedWaitUntil:
    visible:
      id: 'TransactionCard.Tag.Rules_Test_Tag'

- extendedWaitUntil:
    visible:
      id: 'TransactionCard.Label.Amazon_Purchase'

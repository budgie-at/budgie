appId: ${APP_ID}
env:
  TEST_ID: '11'
  ACCOUNT_NAME: Test11 Account
  CATEGORY_NAME: Test11 Category
  TAG_NAME: Test11 Tag
---
# Test 11: Rule applies multiple actions (SET_CATEGORY + ADD_TAG) to new transactions
# Creates a rule with 2 actions and verifies both are applied

# Setup - creates account, category, tag with unique names
- runFlow:
    file: ../setup/setup-rules-test.flow.yaml
    env:
      TEST_ID: ${TEST_ID}
      ACCOUNT_NAME: ${ACCOUNT_NAME}
      CATEGORY_NAME: ${CATEGORY_NAME}
      TAG_NAME: ${TAG_NAME}

# Navigate to Rules page
- runFlow:
    file: ../shared/navigate-to-rules.flow.yaml

# Open FAB and tap Create Rule
- tapOn:
    id: 'CreateTransactionTrigger'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.CreateButton'
    timeout: 3000
- waitForAnimationToEnd
- tapOn:
    id: 'RulesPage.CreateButton'
- extendedWaitUntil:
    visible: 'Create Rule'
    timeout: 5000

# Configure condition: Title CONTAINS "Amazon"
- tapOn:
    id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Amazon'

# Configure first action: SET_CATEGORY
- tapOn:
    id: 'RuleForm.Action.0.CategorySelector'
- runFlow:
    file: ../shared/select-category-by-search.flow.yaml
    env:
      CATEGORY_NAME: ${CATEGORY_NAME}

# Add second action
- scrollUntilVisible:
    element:
      id: 'RuleForm.ActionSection.AddButton'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'RuleForm.ActionSection.AddButton'

# Configure second action: ADD_TAG
- scrollUntilVisible:
    element:
      id: 'RuleForm.Action.1.TypeSelector'
    direction: DOWN
    timeout: 5000
    centerElement: true
- tapOn:
    id: 'RuleForm.Action.1.TypeSelector'
- tapOn:
    id: 'RuleForm.SelectorCard.ADD_TAG'
- waitForAnimationToEnd

# Select tag for second action
- tapOn:
    id: 'RuleForm.Action.1.TagSelector'
- runFlow:
    file: ../shared/select-tag-by-search.flow.yaml
    env:
      TAG_NAME: ${TAG_NAME}

# Submit the rule
- tapOn:
    id: 'RuleForm.Footer.SubmitButton'
- waitForAnimationToEnd

# Verify rule was created
- assertVisible:
    id: 'RulesPage.RuleCard.0'

# Now create a transaction that matches the rule
- runFlow:
    file: ../shared/create-expense-transaction.flow.yaml
    env:
      TITLE: 'Amazon Purchase'
      AMOUNT: '50'
      ACCOUNT_NAME: ${ACCOUNT_NAME}
      CATEGORY_NAME: ${CATEGORY_NAME}

# The rule should have auto-applied both category and tag
# Verify the transaction shows both indicators
# Note: Index 1 because index 0 is the section header (e.g., "JAN 2026")
- assertVisible:
    id: 'TransactionList.Card.1.CategoryBadge'
- assertVisible:
    id: 'TransactionList.Card.1.Tag'

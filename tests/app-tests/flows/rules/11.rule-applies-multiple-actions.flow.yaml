appId: com.vitalyiegorov.budgie
---
# Test 11: Rule applies multiple actions (SET_CATEGORY + ADD_TAG) to existing transactions
# Creates an expense transaction, then creates a rule with 2 actions
# Verifies both category and tag are applied

# First, create an expense transaction with title "Amazon"
- runFlow:
    file: ../shared/create-expense-transaction.flow.yaml
    env:
      TITLE: 'Amazon Purchase'
      AMOUNT: '50'

# Navigate to Rules page
- runFlow:
    file: ../shared/navigate-to-rules.flow.yaml

# Open the FAB menu
- tapOn:
    id: 'CreateTransactionTrigger'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.CreateButton'
    timeout: 3000
- waitForAnimationToEnd
# Tap the Rule action item
- tapOn:
    id: 'RulesPage.CreateButton'
- extendedWaitUntil:
    visible: 'Create Rule'
    timeout: 5000

# Configure condition: Title CONTAINS "Amazon"
- tapOn:
    id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Amazon'

# Configure first action: SET_CATEGORY (default)
- tapOn:
    id: 'RuleForm.Action.0.CategorySelector'
# Wait for bottom sheet to open
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000
# Tap on the first category (around 28% from top)
- tapOn:
    point: 50%, 28%
# Wait for bottom sheet to close
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 1500

# Add second action
- scrollUntilVisible:
    element:
      id: 'RuleForm.ActionSection.AddButton'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'RuleForm.ActionSection.AddButton'

# Configure second action: ADD_TAG
- tapOn:
    id: 'RuleForm.Action.1.TypeSelector'
# Wait for bottom sheet to open
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000
# Tap on Add Tag (second item in action type list, around 38% from top)
- tapOn:
    point: 50%, 38%
# Wait for bottom sheet to close
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 1500

# Select tag
- tapOn:
    id: 'RuleForm.Action.1.TagSelector'
# Wait for bottom sheet to open
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000
# Tap on the first tag (around 28% from top)
- tapOn:
    point: 50%, 28%
# Wait for bottom sheet to close
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 1500

# Enable "Apply to existing transactions"
- scrollUntilVisible:
    element:
      id: 'RuleForm.ApplyToExistingToggle'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'RuleForm.ApplyToExistingToggle'

# Submit the rule
- tapOn:
    id: 'RuleForm.Footer.SubmitButton'
# Wait for navigation back to Rules page
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000

# Verify rule was created
- assertVisible:
    id: 'RulesPage.RuleCard.0'

# Navigate to Transactions to verify both category and tag were applied
- tapOn:
    id: 'TabBar.Transactions'
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000

# Verify the transaction shows both category and tag indicators
- assertVisible:
    id: 'TransactionList.Card.1.CategoryBadge'
- assertVisible:
    id: 'TransactionList.Card.1.Tag'

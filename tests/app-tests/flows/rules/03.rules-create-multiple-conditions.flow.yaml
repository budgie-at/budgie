appId: com.vitalyiegorov.budgie
---
# Test 03: Create a rule with multiple conditions
# Creates a rule: Title CONTAINS "Spotify" AND Comment CONTAINS "Premium"

# Navigate to Rules page
- runFlow:
    file: ../shared/navigate-to-rules.flow.yaml

# Open the FAB menu
- tapOn:
    id: 'CreateTransactionTrigger'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.CreateButton'
    timeout: 3000
- waitForAnimationToEnd
# Tap the Rule action item
- tapOn:
    id: 'RulesPage.CreateButton'
- extendedWaitUntil:
    visible: 'Create Rule'
    timeout: 5000

# First condition: Title contains "Spotify"
- tapOn:
    id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Spotify'

# Add second condition
- tapOn:
    id: 'RuleForm.ConditionSection.AddButton'

# Second condition: Change field to Comment
- tapOn:
    id: 'RuleForm.Condition.1.FieldSelector'
# Wait for bottom sheet to open
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000
# Tap on Comment (3rd item in field list: Title, Amount, Comment - around 78% from top)
- tapOn:
    point: 50%, 78%
# Swipe down to dismiss the field selector bottom sheet
- swipe:
    start: 50%, 80%
    end: 50%, 95%
    duration: 300
# Wait for bottom sheet to close
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 1500

# Enter value for second condition
- tapOn:
    id: 'RuleForm.Condition.1.ValueInput'
- inputText: 'Premium'

# Match type selector should now be visible (2 conditions)
# Verify Match All is visible (default)
- assertVisible:
    text: 'Match All'

# Scroll down to see the Actions section
- scrollUntilVisible:
    element:
      id: 'RuleForm.Action.0.CategorySelector'
    direction: DOWN
    timeout: 5000

# Select category for action
- tapOn:
    id: 'RuleForm.Action.0.CategorySelector'
# Wait for bottom sheet to open
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000
# Tap on the first category (bottom sheet items start around 75-80% from top)
- tapOn:
    point: 50%, 78%
# Swipe down to dismiss the category bottom sheet
- swipe:
    start: 50%, 80%
    end: 50%, 95%
    duration: 300
# Wait for bottom sheet to close
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 1500

# Submit the rule
- tapOn:
    id: 'RuleForm.Footer.SubmitButton'
# Wait for navigation back to Rules page
- extendedWaitUntil:
    visible:
      id: 'RulesPage.Page'
    timeout: 10000

# Verify rule was created
- assertVisible:
    id: 'RulesPage.RuleCard.0'

appId: com.vitalyiegorov.budgie
---

- runFlow:
    file: ../shared/navigate-to-rules.flow.yaml

- tapOn:
    id: 'CreateTransactionTrigger'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.CreateButton'
    timeout: 3000
- waitForAnimationToEnd
- tapOn:
    id: 'RulesPage.CreateButton'
- extendedWaitUntil:
    visible: 'Create Rule'
    timeout: 5000

- tapOn:
    id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Spotify'

- tapOn:
    id: 'RuleForm.ConditionSection.AddButton'

- tapOn:
    id: 'RuleForm.Condition.1.FieldSelector'
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000
- tapOn:
    point: 50%, 78%
- swipe:
    start: 50%, 80%
    end: 50%, 95%
    duration: 300
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 1500

- tapOn:
    id: 'RuleForm.Condition.1.ValueInput'
- inputText: 'Premium'

- assertVisible:
    text: 'Match All'

- scrollUntilVisible:
    element:
      id: 'RuleForm.Action.0.CategorySelector'
    direction: DOWN
    timeout: 5000

- tapOn:
    id: 'RuleForm.Action.0.CategorySelector'
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000
- tapOn:
    point: 50%, 78%
- swipe:
    start: 50%, 80%
    end: 50%, 95%
    duration: 300
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 1500

- tapOn:
    id: 'RuleForm.Footer.SubmitButton'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.Page'
    timeout: 10000

- assertVisible:
    id: 'RulesPage.RuleCard.0'

appId: ${APP_ID}
---
# Test 10: Rule applies ADD_TAG action to existing transactions
# Creates an expense transaction, then creates a rule that matches it with ADD_TAG action
# Verifies the transaction now shows the tag

# First, create an expense transaction with title "Starbucks"
- runFlow:
    file: ../shared/create-expense-transaction.flow.yaml
    env:
      TITLE: 'Starbucks Coffee'
      AMOUNT: '5'

# Navigate to Rules page
- runFlow:
    file: ../shared/navigate-to-rules.flow.yaml

# Create a new rule
- tapOn:
    text: 'Rule'
- extendedWaitUntil:
    visible: 'Create Rule'
    timeout: 3000

# Configure condition: Title CONTAINS "Starbucks"
- tapOn:
    id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Starbucks'

# Change action type to ADD_TAG
- tapOn:
    id: 'RuleForm.Action.0.TypeSelector'
- extendedWaitUntil:
    visible: 'Add Tag'
    timeout: 3000
- tapOn:
    text: 'Add Tag'

# Select tag
- tapOn:
    id: 'RuleForm.Action.0.TagSelector'
- extendedWaitUntil:
    visible: 'Select Tag'
    timeout: 3000
- tapOn:
    text: 'Test Tag'

# Enable "Apply to existing transactions"
- scrollUntilVisible:
    element:
      id: 'RuleForm.ApplyToExistingToggle'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'RuleForm.ApplyToExistingToggle'

# Submit the rule
- tapOn:
    text: 'Create Rule'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.Page'
    timeout: 5000

# Navigate to Transactions to verify the tag was applied
- tapOn:
    id: 'TabBar.Transactions'
- extendedWaitUntil:
    visible: 'Transactions'
    timeout: 3000

# Verify the transaction now shows "Test Tag"
- assertVisible:
    id: 'TransactionList.Card.1.Tag'
- assertVisible:
    text: 'Test Tag'

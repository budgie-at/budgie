appId: com.vitalyiegorov.budgie
---
# Test 15: Suggested rule flow applies category to matching imported transactions
#
# IMPORTANT: This test requires CSV import which needs manual setup:
# 1. Push test-transactions.csv to simulator before running:
#    xcrun simctl addmedia booted tests/app-tests/fixtures/test-transactions.csv
# 2. The app must have access to the file via Files app/DocumentPicker
#
# The suggested rule feature ONLY appears for external/imported transactions
# (externalSource !== MANUAL), so this test uses CSV import.
#
# Alternatively, run this test manually or skip if CSV import automation is not set up.

# Launch app fresh to ensure clean state
- launchApp

# Navigate to Settings to import CSV
- tapOn:
    id: 'TabBar.Settings'
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000

# Scroll to Import CSV and tap
- scrollUntilVisible:
    element:
      id: 'Settings.ImportCsvCard'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'Settings.ImportCsvCard'

# Wait for file picker - tap on test CSV file
# Use coordinate tap since file picker is system UI
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 3000
# Tap on first file in file picker (around center of screen)
- tapOn:
    point: 50%, 50%

# Wait for import screen, select Budgie preset
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 3000
- tapOn:
    id: 'ImportScreen.PresetChip.Budgie'

# Start import
- tapOn:
    id: 'ImportScreen.SubmitButton'
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 5000

# Navigate to Transactions
- tapOn:
    id: 'TabBar.Transactions'
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000

# Open first imported transaction (most recent)
- tapOn:
    id: 'TransactionList.Card.1'
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000

# Change category using coordinate tap on category selector
- tapOn:
    id: 'TransactionForm.CategorySelector'
# Wait for bottom sheet to open
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000
# Tap on the first category (around 28% from top)
- tapOn:
    point: 50%, 28%
# Wait for bottom sheet to close
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 1500

# "Add Rule" button should appear for imported transaction
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 1000
# Look for Add Rule button
- tapOn:
    id: 'SuggestRule.AddRuleButton'

# Wait for suggested rule bottom sheet
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000

# Select "Comment" condition (if available)
- tapOn:
    id: 'SuggestRule.ConditionChip.COMMENT'

# Enable "Apply to existing transactions"
- tapOn:
    id: 'SuggestRule.ApplyToExistingToggle'

# Create the rule
- tapOn:
    id: 'SuggestRule.CreateRuleButton'

# Wait for rule creation
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000

# Save the transaction
- tapOn:
    id: 'TransactionForm.SubmitButton'
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000

# Verify we're back on transactions list
- assertVisible:
    id: 'TransactionList.Card.1'

appId: ${APP_ID}
env:
  TEST_ID: '25'
  CATEGORY_NAME: Groceries
  CSV_DISPLAY_NAME: test25-duplicate-rule
---

- runFlow:
    file: ../shared/enter-app.flow.yaml

- runFlow:
    file: ../shared/import-test-transactions.flow.yaml
    env:
      CSV_DISPLAY_NAME: ${CSV_DISPLAY_NAME}

- tapOn:
    id: 'TabBar.Transactions'
- waitForAnimationToEnd

- swipe:
    direction: DOWN
    duration: 500
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'TransactionList.Card.1'
    timeout: 10000
- tapOn:
    id: 'TransactionList.Card.1'
- waitForAnimationToEnd

# Change category to trigger suggest pill
- tapOn:
    id: 'TransactionForm.CategorySelector'
- waitForAnimationToEnd
- runFlow:
    file: ../shared/select-category-by-search.flow.yaml
    env:
      CATEGORY_NAME: ${CATEGORY_NAME}

- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'SuggestRule.Pill'
    timeout: 10000

# Create the first rule
- tapOn:
    id: 'SuggestRule.Pill'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'SuggestRule.Modal'
    timeout: 10000

- tapOn:
    id: 'SuggestRule.CreateRuleButton'
- waitForAnimationToEnd

- runFlow:
    when:
      visible: 'Apply to existing transactions?'
    commands:
      - tapOn: 'Skip'
- waitForAnimationToEnd

# Tap the pill again to trigger duplicate rule alert
- extendedWaitUntil:
    visible:
      id: 'SuggestRule.Pill'
    timeout: 10000

- tapOn:
    id: 'SuggestRule.Pill'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: 'Duplicate rule'
    timeout: 10000

- tapOn: 'Cancel'
- waitForAnimationToEnd

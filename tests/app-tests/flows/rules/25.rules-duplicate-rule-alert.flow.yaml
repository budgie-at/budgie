appId: ${APP_ID}
env:
  CATEGORY_NAME: Groceries
  CSV_DISPLAY_NAME: test25-duplicate-rule
---

- runFlow:
    file: ../subflows/enter-app.flow.yaml

- runFlow:
    file: ../shared/import-test-transactions.flow.yaml
    env:
      CSV_DISPLAY_NAME: ${CSV_DISPLAY_NAME}

- tapOn:
    id: 'TabBar.Transactions'
- waitForAnimationToEnd

- swipe:
    direction: DOWN
    duration: 500
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'TransactionCard.Label.Test25_Duplicate_Check'
    timeout: 10000
- tapOn:
    id: 'TransactionCard.Label.Test25_Duplicate_Check'
- waitForAnimationToEnd

# Change category to trigger suggest card
- tapOn:
    id: 'TransactionForm.CategorySelector'
- waitForAnimationToEnd
- runFlow:
    file: ../shared/select-category-by-search.flow.yaml
    env:
      CATEGORY_NAME: ${CATEGORY_NAME}

- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'SuggestRule.Card'
    timeout: 10000

# Create the rule via the inline card
- tapOn:
    id: 'SuggestRule.CreateRuleButton'

- extendedWaitUntil:
    notVisible:
      id: 'SuggestRule.Card'
    timeout: 10000

- tapOn:
    id: 'PageHeader.BackButton'
- waitForAnimationToEnd

# Verify rule was created by navigating to rules page
- runFlow:
    file: ../subflows/navigate-to-rules.flow.yaml

- extendedWaitUntil:
    visible:
      id: 'RulesPage.RuleCard.0'
    timeout: 10000

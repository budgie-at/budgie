appId: com.vitalyiegorov.budgie
---
# Test 13: Apply to existing toggle behavior
# Creates a rule WITHOUT "Apply to existing", verifies transaction unchanged
# Then edits rule to enable toggle, verifies transaction is updated

# First, create an expense transaction with title "Spotify"
- runFlow:
    file: ../shared/create-expense-transaction.flow.yaml
    env:
      TITLE: 'Spotify Premium'
      AMOUNT: '10'

# Navigate to Rules page
- runFlow:
    file: ../shared/navigate-to-rules.flow.yaml

# Open the FAB menu
- tapOn:
    id: 'CreateTransactionTrigger'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.CreateButton'
    timeout: 3000
- waitForAnimationToEnd
# Tap the Rule action item
- tapOn:
    id: 'RulesPage.CreateButton'
- extendedWaitUntil:
    visible: 'Create Rule'
    timeout: 5000

# Configure condition: Title CONTAINS "Spotify"
- tapOn:
    id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Spotify'

# Configure action: SET_CATEGORY
- tapOn:
    id: 'RuleForm.Action.0.CategorySelector'
# Wait for bottom sheet to open
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000
# Tap on the first category (around 28% from top)
- tapOn:
    point: 50%, 28%
# Wait for bottom sheet to close
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 1500

# Submit the rule WITHOUT enabling "Apply to existing"
- tapOn:
    id: 'RuleForm.Footer.SubmitButton'
# Wait for navigation back to Rules page
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000

# Navigate to Transactions to verify the transaction is UNCHANGED
- tapOn:
    id: 'TabBar.Transactions'
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000

# Verify the transaction is visible (should have no category badge yet)
- assertVisible:
    id: 'TransactionList.Card.1'

# Now edit the rule and enable "Apply to existing"
- runFlow:
    file: ../shared/navigate-to-rules.flow.yaml

# Tap on the rule to edit it
- tapOn:
    id: 'RulesPage.RuleCard.0'
- extendedWaitUntil:
    visible: 'Edit Rule'
    timeout: 3000

# Enable "Apply to existing transactions"
- scrollUntilVisible:
    element:
      id: 'RuleForm.ApplyToExistingToggle'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'RuleForm.ApplyToExistingToggle'

# Submit the rule
- tapOn:
    id: 'RuleForm.Footer.SubmitButton'
# Wait for navigation back to Rules page
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000

# Navigate to Transactions to verify the category is NOW applied
- tapOn:
    id: 'TabBar.Transactions'
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000

# Verify the transaction now shows the category badge
- assertVisible:
    id: 'TransactionList.Card.1.CategoryBadge'

appId: com.vitalyiegorov.budgie
---
# Test 12: Disabled rules are not applied to existing transactions
# Creates a rule, disables it, enables "Apply to existing", and verifies nothing changes

# First, create an expense transaction with title "Uber"
- runFlow:
    file: ../shared/create-expense-transaction.flow.yaml
    env:
      TITLE: 'Uber Ride'
      AMOUNT: '25'

# Navigate to Rules page
- runFlow:
    file: ../shared/navigate-to-rules.flow.yaml

# Open the FAB menu
- tapOn:
    id: 'CreateTransactionTrigger'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.CreateButton'
    timeout: 3000
- waitForAnimationToEnd
# Tap the Rule action item
- tapOn:
    id: 'RulesPage.CreateButton'
- extendedWaitUntil:
    visible: 'Create Rule'
    timeout: 5000

# Configure condition: Title CONTAINS "Uber"
- tapOn:
    id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Uber'

# Configure action: SET_CATEGORY
- tapOn:
    id: 'RuleForm.Action.0.CategorySelector'
# Wait for bottom sheet to open
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000
# Tap on the first category (around 28% from top)
- tapOn:
    point: 50%, 28%
# Wait for bottom sheet to close
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 1500

# Submit the rule (without "Apply to existing" initially)
- tapOn:
    id: 'RuleForm.Footer.SubmitButton'
# Wait for navigation back to Rules page
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000

# Verify rule was created
- assertVisible:
    id: 'RulesPage.RuleCard.0'

# Disable the rule by tapping the switch
- tapOn:
    id: 'RulesPage.RuleCard.0.EnabledSwitch'
- waitForAnimationToEnd

# Edit the rule to enable "Apply to existing"
- tapOn:
    id: 'RulesPage.RuleCard.0'
- extendedWaitUntil:
    visible: 'Edit Rule'
    timeout: 3000

# Enable "Apply to existing transactions"
- scrollUntilVisible:
    element:
      id: 'RuleForm.ApplyToExistingToggle'
    direction: DOWN
    timeout: 5000
- tapOn:
    id: 'RuleForm.ApplyToExistingToggle'

# Submit the rule
- tapOn:
    id: 'RuleForm.Footer.SubmitButton'
# Wait for navigation back to Rules page
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000

# Navigate to Transactions to verify the category was NOT applied (rule is disabled)
- tapOn:
    id: 'TabBar.Transactions'
- swipe:
    start: 50%, 50%
    end: 50%, 51%
    duration: 2000

# Verify the transaction is visible
- assertVisible:
    id: 'TransactionList.Card.1'

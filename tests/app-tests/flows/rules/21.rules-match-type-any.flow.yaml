appId: ${APP_ID}
env:
  TEST_ID: '21'
  ACCOUNT_NAME: ${ACCOUNT_NAME || 'Test21 Account'}
  CATEGORY_NAME: ${CATEGORY_NAME || 'Test21 Category'}
  ORIGINAL_CATEGORY_NAME: ${ORIGINAL_CATEGORY_NAME || 'Test21 Original Category'}
  TAG_NAME: ${TAG_NAME || 'Test21 Tag'}
---

- runFlow:
    file: ../setup/setup-rules-test.flow.yaml
    env:
      TEST_ID: ${TEST_ID}
      ACCOUNT_NAME: ${ACCOUNT_NAME}
      CATEGORY_NAME: ${CATEGORY_NAME}
      TAG_NAME: ${TAG_NAME}

- runFlow:
    file: ../setup/create-category.flow.yaml
    env:
      CATEGORY_NAME: ${ORIGINAL_CATEGORY_NAME}

- runFlow:
    file: ../shared/create-expense-transaction.flow.yaml
    env:
      TITLE: 'Spotify Premium'
      AMOUNT: '15'
      ACCOUNT_NAME: ${ACCOUNT_NAME}
      CATEGORY_NAME: ${ORIGINAL_CATEGORY_NAME}

- runFlow:
    file: ../shared/navigate-to-rules.flow.yaml

- tapOn:
    id: 'ActionButton'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.CreateButton'
- waitForAnimationToEnd

- tapOn:
    id: 'RulesPage.CreateButton'
- extendedWaitUntil:
    visible: 'Create Rule'

- tapOn:
    id: 'RuleForm.Condition.0.ValueInput'
- inputText: 'Netflix'

- tapOn:
    id: 'RuleForm.ConditionSection.AddButton'

- tapOn:
    id: 'RuleForm.Condition.1.FieldSelector'
- tapOn: 'Comment'

- tapOn:
    id: 'RuleForm.Condition.1.ValueInput'
- inputText: 'Spotify'

- tapOn: return

- assertVisible:
    text: 'Match All'

- tapOn:
    id: 'RuleForm.ConditionMatchType'
- waitForAnimationToEnd

- assertVisible:
    text: 'Match Any'

- scrollUntilVisible:
    element:
      id: 'RuleForm.Action.0.CategorySelector'
    direction: DOWN

- tapOn:
    id: 'RuleForm.Action.0.CategorySelector'

- runFlow:
    file: ../shared/select-category-by-search.flow.yaml
    env:
      CATEGORY_NAME: ${CATEGORY_NAME}

- tapOn:
    id: 'RuleForm.Footer.SubmitButton'
- extendedWaitUntil:
    visible: 'Apply to existing transactions?'
    timeout: 10000
- tapOn: 'Apply'
- waitForAnimationToEnd

- assertVisible:
    id: 'RulesPage.RuleCard.0'

- tapOn:
    id: 'TabBar.Transactions'
- waitForAnimationToEnd

- swipe:
    direction: DOWN
    duration: 500
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'TransactionList.Card.1'
- tapOn:
    id: 'TransactionList.Card.1'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: ${CATEGORY_NAME}
- assertNotVisible: ${ORIGINAL_CATEGORY_NAME}

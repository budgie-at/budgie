appId: ${APP_ID}
env:
  TEST_ID: '18'
  ACCOUNT_NAME: ${ACCOUNT_NAME || 'Test18 Account'}
  CATEGORY_NAME: ${CATEGORY_NAME || 'Test18 Category'}
  TAG_NAME: ${TAG_NAME || 'Test18 Tag'}
---

- runFlow:
    file: ../setup/setup-rules-test.flow.yaml
    env:
      TEST_ID: ${TEST_ID}
      ACCOUNT_NAME: ${ACCOUNT_NAME}
      CATEGORY_NAME: ${CATEGORY_NAME}
      TAG_NAME: ${TAG_NAME}

- runFlow:
    file: ../shared/navigate-to-rules.flow.yaml

- tapOn:
    id: 'ActionButton'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.CreateButton'
- waitForAnimationToEnd

- tapOn:
    id: 'RulesPage.CreateButton'
- extendedWaitUntil:
    visible: 'Create Rule'

- tapOn:
    id: 'RuleForm.Condition.0.FieldSelector'
- tapOn:
    id: RuleForm.SelectorCard.ACCOUNT_ID

- waitForAnimationToEnd
- tapOn:
    id: 'RuleForm.Condition.0.AccountSelector'
- runFlow:
    file: ../shared/select-account-by-search.flow.yaml
    env:
      ACCOUNT_NAME: ${ACCOUNT_NAME}

- tapOn:
    id: 'RuleForm.ConditionSection.AddButton'

- tapOn:
    id: 'RuleForm.Condition.1.FieldSelector'
- tapOn:
    id: RuleForm.SelectorCard.TRANSACTION_TYPE

- waitForAnimationToEnd
- tapOn:
    id: 'RuleForm.Condition.1.TransactionTypeSelector'
- tapOn: 'Expense'

- scrollUntilVisible:
    element:
      id: 'RuleForm.Action.0.CategorySelector'
    direction: DOWN

- tapOn:
    id: 'RuleForm.Action.0.CategorySelector'
- runFlow:
    file: ../shared/select-category-by-search.flow.yaml
    env:
      CATEGORY_NAME: ${CATEGORY_NAME}

- tapOn:
    id: 'RuleForm.Footer.SubmitButton'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.Page'

- assertVisible:
    id: 'RulesPage.RuleCard.0'

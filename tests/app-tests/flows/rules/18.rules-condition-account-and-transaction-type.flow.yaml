appId: ${APP_ID}
env:
  ACCOUNT_NAME: Rules Test Account
  CATEGORY_NAME: Rules Test Category
  TAG_NAME: Rules Test Tag
---

- runFlow:
    file: ../setup/setup-rules-test.flow.yaml

- runFlow:
    file: ../subflows/navigate-to-rules.flow.yaml

- tapOn:
    id: 'ActionButton'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.CreateButton'
- waitForAnimationToEnd

- tapOn:
    id: 'RulesPage.CreateButton'
- extendedWaitUntil:
    visible: 'Create Rule'

- tapOn:
    id: 'RuleForm.Condition.0.FieldSelector'
- tapOn:
    id: RuleForm.SelectorCard.ACCOUNT_ID
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'RuleForm.Condition.0.ValueInput'
- tapOn:
    id: 'RuleForm.Condition.0.ValueInput'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'AccountPickerBottomSheet.Input'
- tapOn:
    id: 'AccountPickerBottomSheet.Input'
- inputText: ${ACCOUNT_NAME}
- extendedWaitUntil:
    visible:
      id: 'AccountPickerBottomSheet.Option.${ACCOUNT_NAME}'
- tapOn:
    id: 'AccountPickerBottomSheet.Option.${ACCOUNT_NAME}'
- extendedWaitUntil:
    notVisible:
      id: 'AccountPickerBottomSheet.Input'
- waitForAnimationToEnd

- tapOn:
    id: 'RuleForm.ConditionSection.AddButton'

- tapOn:
    id: 'RuleForm.Condition.1.FieldSelector'
- tapOn:
    id: RuleForm.SelectorCard.TRANSACTION_TYPE
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'RuleForm.Condition.1.ValueInput'
- tapOn:
    id: 'RuleForm.Condition.1.ValueInput'
- tapOn: 'Expense'
- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      id: 'RuleForm.Action.0.CategorySelector'
    direction: DOWN
    centerElement: true

- tapOn:
    id: 'RuleForm.Action.0.CategorySelector'
- runFlow:
    file: ../shared/select-category-by-search.flow.yaml
    env:
      CATEGORY_NAME: ${CATEGORY_NAME}

- tapOn:
    id: 'RuleForm.Footer.SubmitButton'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.Page'

- assertVisible:
    id: 'RulesPage.RuleCard.0'

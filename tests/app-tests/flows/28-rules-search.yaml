steps:
  - launch: com.vitalyiegorov.budgie.e2e
  - tool: open-url
    args:
      url: budgie://settings?anchor=data
  - tap:
      text: Not Now
  - await:
      idle: true
  - when:
      hidden:
        id: SettingsPage.Container
    steps:
      - tool: open-url
        args:
          url: budgie://settings
      - await:
          idle: true
      - await:
          visible:
            id: SettingsPage.Container
          timeout: 15000
  - await:
      visible:
        id: SettingsPage.Container
      timeout: 15000
  - scroll-to:
      target:
        id: SettingsPage.ImportDatabaseCard
      direction: up
  - when:
      hidden:
        id: SettingsPage.ImportDatabaseCard
    steps:
      - scroll-to:
          target:
            id: SettingsPage.ImportDatabaseCard
          direction: down
      - await:
          idle: true
  - await:
      visible:
        id: SettingsPage.ImportDatabaseCard
      timeout: 5000
  - tap:
      id: SettingsPage.ImportDatabaseCard
  - await:
      idle: true
  - await:
      visible:
        text: Cancel
      timeout: 15000
  - when:
      visible:
        text: Apple Account Verification
    steps:
      - tap:
          text: Not Now
      - await:
          idle: true
  - when:
      visible:
        text: No Results for .*
    steps:
      - tap:
          text: Clear text
      - await:
          idle: true
  - when:
      hidden:
        id: 25.db
    steps:
      - when:
          visible:
            id: E2EFixtures, Folder
        steps:
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          visible:
            text: budgie \(E2E\), Actions Menu
        steps:
          - await:
              visible:
                id: E2EFixtures, Folder
              timeout: 3000
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          hidden:
            text: E2EFixtures, Actions Menu
        steps:
          - when:
              hidden:
                text: budgie \(E2E\), Actions Menu
            steps:
              - tap:
                  id: BackButton
              - tap:
                  id: BackButton
              - tap:
                  id: BackButton
              - tap:
                  text: Browse
              - await:
                  idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - when:
                      visible:
                        text: On My iPhone
                    steps:
                      - tap:
                          text: On My iPhone
                      - await:
                          idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - scroll-to:
                      target:
                        text: budgie \(E2E\)
                      direction: down
              - await:
                  visible:
                    text: budgie \(E2E\)
                  timeout: 3000
              - tap:
                  text: budgie \(E2E\)
              - await:
                  idle: true
              - await:
                  visible:
                    id: E2EFixtures, Folder
                  timeout: 3000
              - tap:
                  id: E2EFixtures, Folder
              - await:
                  idle: true
  - scroll-to:
      target:
        id: 25.db
      direction: down
  - when:
      hidden:
        id: 25.db
    steps:
      - scroll-to:
          target:
            text: 25.db
          direction: down
  - await:
      idle: true
  - when:
      visible:
        id: 25.db
    steps:
      - tap:
          id: 25.db
  - when:
      hidden:
        id: 25.db
    steps:
      - tap:
          text: 25.db
  - await:
      idle: true
  - when:
      visible:
        text: Continue
    steps:
      - tap:
          text: Continue
      - await:
          idle: true
      - when:
          visible:
            id: 25.db
        steps:
          - tap:
              id: 25.db
      - when:
          hidden:
            id: 25.db
        steps:
          - tap:
              text: 25.db
      - await:
          idle: true
  - when:
      visible:
        text: Open
    steps:
      - tap:
          text: Open
  - await:
      visible:
        text: Importing a database will replace all current data.*
      timeout: 3000
  - tap:
      text: Import Database
  - await:
      idle: true
  - await:
      visible:
        id: TabBar.Home
      timeout: 30000
  - tap:
      id: TabBar.Home
  - await:
      visible:
        id: HomePage.TotalBalance
      timeout: 30000
  - echo: App process stop requested; the following launch performs a clean restart.
  - launch: com.vitalyiegorov.budgie.e2e
  - await:
      visible:
        id: TabBar.Home
      timeout: 30000
  - tool: open-url
    args:
      url: budgie://settings/rules
  - await:
      idle: true
  - await:
      visible:
        id: RulesPage.Page
      timeout: 15000
  - tap:
      id: ActionButton
  - await:
      visible:
        id: RulesPage.CreateButton.Label
  - await:
      idle: true
  - tap:
      id: RulesPage.CreateButton.Label
  - await:
      visible:
        text: Create Rule
  - tap:
      id: RuleForm.Condition.0.ValueInput
  - tool: keyboard
    args:
      text: Toolsense
  - tap:
      text: Done
  - await:
      idle: true
  - tap:
      id: RuleForm.Action.0.CategorySelector
  - await:
      visible:
        id: CategoryPickerBottomSheet.Input
      timeout: 2000
  - when:
      hidden:
        id: CategoryPickerBottomSheet.Input
    steps:
      - tap:
          id: RuleForm.Action.0.CategorySelector.Value
      - await:
          visible:
            id: CategoryPickerBottomSheet.Input
          timeout: 5000
  - await:
      idle: true
  - await:
      visible:
        id: CategoryPickerBottomSheet.Input
  - tap:
      id: CategoryPickerBottomSheet.Input
  - await:
      idle: true
  - tool: keyboard
    args:
      text: Rules Test Category
  - tap:
      text: Done
  - await:
      visible:
        id: CategoryPickerBottomSheet.Card.Rules Test Category.Label
  - await:
      idle: true
  - tap:
      id: CategoryPickerBottomSheet.Card.Rules Test Category.Label
  - await:
      idle: true
  - await:
      hidden:
        id: CategoryPickerBottomSheet.Input
      timeout: 5000
  - tap:
      id: RuleForm.Footer.SubmitButton
  - when:
      visible:
        text: Apply to existing transactions?
    steps:
      - tap:
          text: Skip
  - await:
      visible:
        id: RulesPage.Page
  - assert:
      visible:
        id: RulesPage.RuleCard.0
  - assert:
      visible:
        id: RulesPage.RuleCardConditions.0
  - assert:
      visible:
        id: RulesPage.RuleCardActions.0
  - tap:
      id: ActionButton
  - await:
      visible:
        id: RulesPage.CreateButton.Label
  - await:
      idle: true
  - tap:
      id: RulesPage.CreateButton.Label
  - await:
      visible:
        text: Create Rule
  - tap:
      id: RuleForm.Condition.0.ValueInput
  - tool: keyboard
    args:
      text: Tango office loan service new salary entry
  - tap:
      text: Done
  - await:
      idle: true
  - tap:
      id: RuleForm.Action.0.CategorySelector
  - await:
      visible:
        id: CategoryPickerBottomSheet.Input
      timeout: 2000
  - when:
      hidden:
        id: CategoryPickerBottomSheet.Input
    steps:
      - tap:
          id: RuleForm.Action.0.CategorySelector.Value
      - await:
          visible:
            id: CategoryPickerBottomSheet.Input
          timeout: 5000
  - await:
      idle: true
  - await:
      visible:
        id: CategoryPickerBottomSheet.Input
  - tap:
      id: CategoryPickerBottomSheet.Input
  - await:
      idle: true
  - tool: keyboard
    args:
      text: Rules Test Category
  - tap:
      text: Done
  - await:
      visible:
        id: CategoryPickerBottomSheet.Card.Rules Test Category.Label
  - await:
      idle: true
  - tap:
      id: CategoryPickerBottomSheet.Card.Rules Test Category.Label
  - await:
      idle: true
  - await:
      hidden:
        id: CategoryPickerBottomSheet.Input
      timeout: 5000
  - tap:
      id: RuleForm.Footer.SubmitButton
  - when:
      visible:
        text: Apply to existing transactions?
    steps:
      - tap:
          text: Skip
  - await:
      visible:
        id: RulesPage.Page
  - assert:
      visible:
        id: RulesPage.RuleCard.0
  - assert:
      visible:
        id: RulesPage.RuleCard.1
  - tap:
      id: RulesPage.SearchInput
  - tool: keyboard
    args:
      text: Toolsense
  - assert:
      visible:
        id: RulesPage.RuleCard.0
  - assert:
      visible:
        id: RulesPage.RuleCardConditions.0
  - assert:
      hidden:
        id: RulesPage.RuleCard.1
  - tool: keyboard
    args:
      text: Rules Test Category
  - assert:
      visible:
        id: RulesPage.RuleCard.0
  - assert:
      visible:
        id: RulesPage.RuleCardActions.0
  - assert:
      visible:
        id: RulesPage.RuleCard.1
  - tool: keyboard
    args:
      text: MissingRuleSearch
  - assert:
      visible:
        id: RulesPage.EmptyState
  - assert:
      visible:
        text: No Results
  - assert:
      visible:
        text: Try a different search term
  - assert:
      visible:
        id: RulesPage.RuleCard.0
  - tap:
      id: RulesPage.RuleCardActions.0
  - await:
      visible:
        text: Edit Rule
      timeout: 5000
  - tap:
      id: RuleForm.Footer.DeleteButton.Label
  - await:
      visible:
        text: Delete
      timeout: 3000
  - tap:
      text: Delete
  - await:
      visible:
        id: RulesPage.Page
      timeout: 5000
  - tap:
      id: RulesPage.RuleCardActions.0
  - await:
      visible:
        text: Edit Rule
      timeout: 5000
  - tap:
      id: RuleForm.Footer.DeleteButton.Label
  - await:
      visible:
        text: Delete
      timeout: 3000
  - tap:
      text: Delete
  - await:
      visible:
        id: RulesPage.Page
      timeout: 5000
  - assert:
      visible:
        id: RulesPage.EmptyState

appId: ${APP_ID}
---

- runFlow: subflows/enter-app.flow.yaml

- runFlow:
    file: subflows/import-database-fixture.flow.yaml
    env:
      FIXTURE_ID: '12-cross-currency-transfer-transaction'

# --- Create Cross-Currency Transfer ---

- runFlow: subflows/navigate-to-transactions.flow.yaml

- tapOn:
    id: 'ActionButton'
- extendedWaitUntil:
    visible:
      id: 'ActionItem.Transfer'
- waitForAnimationToEnd

- tapOn:
    id: 'ActionItem.Transfer'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'New Transfer'

- tapOn: '7'
- tapOn: '5'

- tapOn:
    id: 'TransferForm.FromAccount'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'AccountPickerBottomSheet.Input'
- tapOn:
    id: 'AccountPickerBottomSheet.Input'
- inputText: 'E2E Txn Account'
- extendedWaitUntil:
    visible:
      id: 'AccountPickerBottomSheet.Option.E2E Txn Account'
- tapOn:
    id: 'AccountPickerBottomSheet.Option.E2E Txn Account'
- extendedWaitUntil:
    notVisible:
      id: 'AccountPickerBottomSheet.Input'

- tapOn:
    id: 'TransferForm.ToAccount'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'AccountPickerBottomSheet.Input'
- tapOn:
    id: 'AccountPickerBottomSheet.Input'
- inputText: 'E2E Foreign Account'
- extendedWaitUntil:
    visible:
      id: 'AccountPickerBottomSheet.Option.E2E Foreign Account'
- tapOn:
    id: 'AccountPickerBottomSheet.Option.E2E Foreign Account'
- extendedWaitUntil:
    notVisible:
      id: 'AccountPickerBottomSheet.Input'

- extendedWaitUntil:
    visible:
      id: 'TransferForm.ConversionRow'

- runFlow:
    file: subflows/enter-comment.flow.yaml
    env:
      COMMENT: 'E2E Cross Currency Transfer'

- tapOn:
    id: 'TransactionForm.SubmitButton'

- extendedWaitUntil:
    visible: 'Transactions'

- assertVisible:
    id: 'TransactionCard.Label.E2E_Cross_Currency_Transfer'

# --- Delete Cross-Currency Transfer ---

- tapOn:
    id: 'TransactionCard.Label.E2E_Cross_Currency_Transfer'
- waitForAnimationToEnd

- runFlow: subflows/delete-transaction.flow.yaml
- runFlow: subflows/navigate-to-transactions.flow.yaml

- assertNotVisible:
    id: 'TransactionCard.Label.E2E_Cross_Currency_Transfer'

appId: ${APP_ID}
---

- runFlow: subflows/enter-app.flow.yaml

# --- Fresh App: Home Empty State ---

- assertVisible:

    id: 'HomePage.TotalBalance'

# --- Transactions Tab Empty State ---

- runFlow: subflows/navigate-to-transactions.flow.yaml

# --- Analytics Tab Renders ---

- runFlow: subflows/navigate-to-analytics.flow.yaml

# --- Settings Tab Renders ---

- runFlow: subflows/navigate-to-settings.flow.yaml

# --- Rules Empty State ---

- scrollUntilVisible:
    element:
      id: 'SettingsPage.ManageRulesCard'
    direction: DOWN
    speed: 20
- waitForAnimationToEnd
- assertVisible:
    id: 'SettingsPage.ManageRulesCard'
- tapOn:
    id: 'SettingsPage.ManageRulesCard'
- extendedWaitUntil:
    visible:
      id: 'RulesPage.Page'
- assertVisible:
    id: 'RulesPage.EmptyState'
- assertVisible:
    text: 'No Rules Yet'
- assertVisible:
    text: 'Create rules to automatically categorize and tag your bank transactions'

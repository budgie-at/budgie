appId: ${APP_ID}
---

- runFlow: subflows/enter-app.flow.yaml

# --- Fresh App: Home Empty State ---

- assertVisible: 'TOTAL BALANCE'

# --- Transactions Tab Empty State ---

- tapOn:
    id: 'TabBar.Transactions'
- extendedWaitUntil:
    visible:
      id: 'TransactionsPage.Container'

# --- Analytics Tab Renders ---

- tapOn:
    id: 'TabBar.Analytics'
- extendedWaitUntil:
    visible:
      id: 'AnalyticsPage.Container'

# --- Settings Tab Renders ---

- tapOn:
    id: 'TabBar.Settings'
- extendedWaitUntil:
    visible:
      id: 'SettingsPage.Container'

steps:
  - launch: com.vitalyiegorov.budgie.e2e
  - tool: open-url
    args:
      url: budgie://settings?anchor=data
  - tap:
      text: Not Now
  - await:
      idle: true
  - when:
      hidden:
        id: SettingsPage.Container
    steps:
      - tool: open-url
        args:
          url: budgie://settings
      - await:
          idle: true
      - await:
          visible:
            id: SettingsPage.Container
          timeout: 15000
  - await:
      visible:
        id: SettingsPage.Container
      timeout: 15000
  - scroll-to:
      target:
        id: SettingsPage.ImportDatabaseCard
      direction: up
  - when:
      hidden:
        id: SettingsPage.ImportDatabaseCard
    steps:
      - scroll-to:
          target:
            id: SettingsPage.ImportDatabaseCard
          direction: down
      - await:
          idle: true
  - await:
      visible:
        id: SettingsPage.ImportDatabaseCard
      timeout: 5000
  - tap:
      id: SettingsPage.ImportDatabaseCard
  - await:
      idle: true
  - await:
      visible:
        text: Cancel
      timeout: 15000
  - when:
      visible:
        text: Apple Account Verification
    steps:
      - tap:
          text: Not Now
      - await:
          idle: true
  - when:
      visible:
        text: No Results for .*
    steps:
      - tap:
          text: Clear text
      - await:
          idle: true
  - when:
      hidden:
        id: 35-debt-migration-repair.db(, db)?
    steps:
      - when:
          visible:
            id: E2EFixtures, Folder
        steps:
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          visible:
            text: budgie \(E2E\), Actions Menu
        steps:
          - await:
              visible:
                id: E2EFixtures, Folder
              timeout: 3000
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          hidden:
            text: E2EFixtures, Actions Menu
        steps:
          - when:
              hidden:
                text: budgie \(E2E\), Actions Menu
            steps:
              - tap:
                  id: BackButton
              - tap:
                  id: BackButton
              - tap:
                  id: BackButton
              - tap:
                  text: Browse
              - await:
                  idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - when:
                      visible:
                        text: On My iPhone
                    steps:
                      - tap:
                          text: On My iPhone
                      - await:
                          idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - scroll-to:
                      target:
                        text: budgie \(E2E\)
                      direction: down
              - await:
                  visible:
                    text: budgie \(E2E\)
                  timeout: 3000
              - tap:
                  text: budgie \(E2E\)
              - await:
                  idle: true
              - await:
                  visible:
                    id: E2EFixtures, Folder
                  timeout: 3000
              - tap:
                  id: E2EFixtures, Folder
              - await:
                  idle: true
  - scroll-to:
      target:
        id: 35-debt-migration-repair.db(, db)?
      direction: down
  - when:
      hidden:
        id: 35-debt-migration-repair.db(, db)?
    steps:
      - scroll-to:
          target:
            text: 35-debt-migration-repair.db(, db)?
          direction: down
  - await:
      idle: true
  - when:
      visible:
        id: 35-debt-migration-repair.db(, db)?
    steps:
      - tap:
          id: 35-debt-migration-repair.db(, db)?
  - when:
      hidden:
        id: 35-debt-migration-repair.db(, db)?
    steps:
      - tap:
          text: 35-debt-migration-repair.db(, db)?
  - await:
      idle: true
  - when:
      visible:
        text: Continue
    steps:
      - tap:
          text: Continue
      - await:
          idle: true
      - when:
          visible:
            id: 35-debt-migration-repair.db(, db)?
        steps:
          - tap:
              id: 35-debt-migration-repair.db(, db)?
      - when:
          hidden:
            id: 35-debt-migration-repair.db(, db)?
        steps:
          - tap:
              text: 35-debt-migration-repair.db(, db)?
      - await:
          idle: true
  - when:
      visible:
        text: Open
    steps:
      - tap:
          text: Open
  - await:
      visible:
        text: Importing a database will replace all current data.*
      timeout: 3000
  - tap:
      text: Import Database
  - await:
      idle: true
  - await:
      visible:
        id: TabBar.Home
      timeout: 30000
  - tap:
      id: TabBar.Home
  - await:
      visible:
        id: HomePage.TotalBalance
      timeout: 30000
  - scroll-to:
      target:
        id: AccountCard.USD borrowed debt
      direction: down
  - await:
      idle: true
  - assert:
      visible:
        id: DebtAccountCardSummary.OutstandingAmount.USD_borrowed_debt.36934
  - assert:
      visible:
        id: DebtAccountCardSummary.PaidAmount.USD_borrowed_debt.8066
  - assert:
      visible:
        id: DebtAccountCardSummary.TotalAmount.USD_borrowed_debt.45000
  - scroll-to:
      target:
        id: AccountCard.USD borrowed debt
      direction: down
  - await:
      idle: true
  - tap:
      id: AccountCard.USD borrowed debt
  - await:
      visible:
        id: AccountDetails.Page
      timeout: 10000
  - assert:
      visible:
        id: DebtAccountBalance.OutstandingAmount.36934
  - assert:
      visible:
        id: DebtAccountBalance.PaidAmount.8066
  - assert:
      visible:
        id: DebtAccountBalance.TotalAmount.45000
  - assert:
      visible:
        id: DebtAccountBalance.Percentage.17_92
  - assert:
      visible:
        text: 7 transactions
  - scroll-to:
      target:
        id: TransactionCard.Label.USD_debt_repayment_7
      direction: down
  - scroll-to:
      target:
        id: TransactionCard.Label.USD_debt_repayment_6
      direction: down
  - scroll-to:
      target:
        id: TransactionCard.Label.USD_debt_repayment_5
      direction: down
  - scroll-to:
      target:
        id: TransactionCard.Label.USD_debt_repayment_4
      direction: down
  - scroll-to:
      target:
        id: TransactionCard.Label.USD_debt_repayment_3
      direction: down
  - scroll-to:
      target:
        id: TransactionCard.Label.USD_debt_repayment_2
      direction: down
  - scroll-to:
      target:
        id: TransactionCard.Label.USD_debt_repayment_1
      direction: down
  - assert:
      visible:
        id: TransactionCard.Amount.1001
        text: (?s).*₴29,000.*→.*[$]684.*
  - assert:
      visible:
        id: TransactionCard.EntryCategoryAmount.Housing_Utilities.29000
  - assert:
      visible:
        id: TransactionCard.Label.USD_debt_repayment_1
        text: (?s).*Housing & Utilities.*₴29,000.*₴29,000.*→.*[$]684.*
  - assert:
      hidden:
        id: TransactionCard.EntryCategoryAmount.Housing_Utilities.29000
  - assert:
      hidden:
        id: TransactionCard.EntryCategoryAmount.Housing_Utilities.684
  - assert:
      hidden:
        text: Housing & Utilities €29,000
  - assert:
      hidden:
        text: Housing & Utilities €684
  - tap:
      id: PageHeader.BackButton
  - await:
      visible:
        id: HomePage.TotalBalance
      timeout: 10000
  - scroll-to:
      target:
        id: DebtAccountCardSummary.OutstandingAmount.USD_borrowed_debt.36934
      direction: down

appId: ${APP_ID}
---

# 1. Import seed
- runFlow:
    file: subflows/import/import-database-from-settings.flow.yaml
    env:
      FIXTURE_ROW_ID_MATCH: '21.db(, db)?'
      FILE_PICKER_INITIAL_SCROLL_SHIFT: 'DOUBLE_DOWN'
- extendedWaitUntil:
    visible:
      id: 'HomePage.TotalBalance'
    timeout: 10000

# 2. Sanity: source EXPENSEs/INCOMEs visible
- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml
- assertVisible:
    id: 'TransactionCard.Label.E2E_Consolidation_P1_Out'
- assertVisible:
    id: 'TransactionCard.Label.E2E_Consolidation_P1_In'
- assertVisible:
    id: 'TransactionCard.Label.E2E_Consolidation_P2_Out'
- assertVisible:
    id: 'TransactionCard.Label.E2E_Consolidation_P2_In'
- assertVisible:
    id: 'TransactionCard.Label.E2E_Consolidation_Untouched'
- scrollUntilVisible:
    element:
      id: 'TransactionCard.Label.E2E_Consolidation_ATM_Out'
    direction: DOWN
- assertVisible:
    id: 'TransactionCard.Label.E2E_Consolidation_ATM_Out'

# 3. Consolidate matches
- runFlow: subflows/settings/consolidate-matches.flow.yaml

# 4. Verify canonicals exist on the transactions list
- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml
- assertVisible:
    id: 'TransactionCard.Label.E2E_Consolidation_P1_Out'
- extendedWaitUntil:
    visible:
      id: 'TransactionCard.FromAccount.E2E_Consolidation_A'
    timeout: 60000
- assertVisible:
    id: 'TransactionCard.FromAccount.E2E_Consolidation_A'
- assertVisible:
    id: 'TransactionCard.ToAccount.E2E_Consolidation_B'
- assertVisible:
    id: 'TransactionCard.Label.E2E_Consolidation_P2_Out'
- assertVisible:
    id: 'TransactionCard.FromAccount.E2E_Consolidation_USD'
- assertVisible:
    id: 'TransactionCard.ToAccount.E2E_Consolidation_EUR'
- assertVisible:
    id: 'TransactionCard.Label.E2E_Consolidation_ATM_Out'
- assertVisible:
    id: 'TransactionCard.FromAccount.E2E_Consolidation_Card'
- assertVisible:
    id: 'TransactionCard.ToAccount.E2E_Consolidation_Cash'

# 5. INCOME-side source titles are now hidden (consolidationParent != NULL)
- assertNotVisible:
    id: 'TransactionCard.Label.E2E_Consolidation_P1_In'
- assertNotVisible:
    id: 'TransactionCard.Label.E2E_Consolidation_P2_In'

# 6. Untouched survives
- assertVisible:
    id: 'TransactionCard.Label.E2E_Consolidation_Untouched'

# 7. Open canonical 1 -> Sources sheet -> Revert -> source rows restored
- scrollUntilVisible:
    element:
      id: 'TransactionCard.Label.E2E_Consolidation_P1_Out'
    direction: UP
    centerElement: true
- tapOn:
    id: 'TransactionCard.Label.E2E_Consolidation_P1_Out'
- extendedWaitUntil:
    visible:
      id: 'TransactionFieldIcon.Sources'
    timeout: 10000
- tapOn:
    id: 'TransactionFieldIcon.Sources'
- extendedWaitUntil:
    visible:
      id: 'ConsolidationSourceModal.Row.0'
    timeout: 10000
- assertVisible:
    id: 'ConsolidationSourceModal.Row.1'
- assertVisible:
    text: '.*E2E Consolidation P1 Out.*'
- assertVisible:
    text: '.*\+₴200.*'
- assertVisible:
    text: '.*E2E Consolidation P1 In.*'
- assertVisible:
    text: '.*-₴200.*'
- assertVisible:
    id: 'ConsolidationSourceModal.RevertButton'
- tapOn:
    id: 'ConsolidationSourceModal.RevertButton'
- runFlow: subflows/transactions/confirm-revert-consolidation.flow.yaml
- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml
- extendedWaitUntil:
    visible:
      id: 'TransactionCard.Label.E2E_Consolidation_P1_In'
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: 'TransactionCard.FromAccount.E2E_Consolidation_A'
    timeout: 5000

# 8. Detail actions menu on canonical 2 replaces Delete with Revert
- scrollUntilVisible:
    element:
      id: 'TransactionCard.Label.E2E_Consolidation_P2_Out'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'TransactionCard.Label.E2E_Consolidation_P2_Out'
- extendedWaitUntil:
    visible:
      id: 'TransactionActionsMenu.TriggerButton'
    timeout: 10000
- tapOn:
    id: 'TransactionActionsMenu.TriggerButton'
- extendedWaitUntil:
    visible:
      id: 'TransactionActionsMenu.RevertButton'
    timeout: 3000
- assertNotVisible:
    id: 'TransactionActionsMenu.DeleteButton'
- tapOn:
    id: 'TransactionActionsMenu.RevertButton'
- runFlow: subflows/transactions/confirm-revert-consolidation.flow.yaml
- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml
- extendedWaitUntil:
    visible:
      id: 'TransactionCard.Label.E2E_Consolidation_P2_In'
    timeout: 10000
- assertNotVisible:
    id: 'TransactionCard.FromAccount.E2E_Consolidation_USD'

# 9. Long-press menu on the ATM canonical replaces Delete with Revert
- scrollUntilVisible:
    element:
      id: 'TransactionCard.Label.E2E_Consolidation_ATM_Out'
    direction: DOWN
    centerElement: true
- longPressOn:
    id: 'TransactionCard.Label.E2E_Consolidation_ATM_Out'
- extendedWaitUntil:
    visible:
      id: 'TransactionContextMenu.RevertButton'
    timeout: 10000
- assertNotVisible:
    id: 'TransactionContextMenu.DeleteButton'
- tapOn:
    id: 'TransactionContextMenu.RevertButton'
- runFlow: subflows/transactions/confirm-revert-consolidation.flow.yaml
- extendedWaitUntil:
    visible:
      id: 'TransactionCard.Label.E2E_Consolidation_ATM_Out'
    timeout: 10000
- assertNotVisible:
    id: 'TransactionCard.FromAccount.E2E_Consolidation_Card'
- assertNotVisible:
    id: 'TransactionCard.ToAccount.E2E_Consolidation_Cash'

# 10. Final balance assertions show generated cash withdrawal entries are gone
- tapOn:
    id: 'TabBar.Home'
- extendedWaitUntil:
    visible:
      id: 'HomePage.TotalBalance'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'AccountCard.Balance.E2E_Consolidation_Cash.0'
    direction: DOWN
- assertVisible:
    id: 'AccountCard.Balance.E2E_Consolidation_Cash.0'
- scrollUntilVisible:
    element:
      id: 'AccountCard.Balance.E2E_Consolidation_A.750'
    direction: DOWN
- assertVisible:
    id: 'AccountCard.Balance.E2E_Consolidation_A.750'
- assertVisible:
    id: 'AccountCard.Balance.E2E_Consolidation_B.200'
- assertVisible:
    id: 'AccountCard.Balance.E2E_Consolidation_Untouched.0'

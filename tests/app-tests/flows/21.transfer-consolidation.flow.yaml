appId: ${APP_ID}
---

# 1. Import seed
- runFlow:
    file: subflows/import/import-database-from-settings.flow.yaml
    env:
      FIXTURE_ROW_ID_MATCH: '21.db(, db)?'
      FILE_PICKER_INITIAL_SCROLL_SHIFT: 'DOUBLE_DOWN'
- extendedWaitUntil:
    visible:
      id: 'HomePage.TotalBalance'
    timeout: 10000

# 2. Sanity: source EXPENSEs/INCOMEs visible
- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml
- assertVisible:
    id: 'TransactionCard.Label.E2E_Consolidation_P1_Out'
- assertVisible:
    id: 'TransactionCard.Label.E2E_Consolidation_P1_In'
- assertVisible:
    id: 'TransactionCard.Label.E2E_Consolidation_P2_Out'
- assertVisible:
    id: 'TransactionCard.Label.E2E_Consolidation_P2_In'
- assertVisible:
    id: 'TransactionCard.Label.E2E_Consolidation_Untouched'
- scrollUntilVisible:
    element:
      id: 'TransactionCard.Label.E2E_Consolidation_ATM_Out'
    direction: DOWN
- assertVisible:
    id: 'TransactionCard.Label.E2E_Consolidation_ATM_Out'

# 3. Trigger consolidation from Settings
- runFlow: subflows/navigation/navigate-to-settings.flow.yaml
- scrollUntilVisible:
    element:
      id: 'SettingsPage.ConsolidateTransfersCard'
    direction: DOWN
- tapOn:
    id: 'SettingsPage.ConsolidateTransfersCard'
- extendedWaitUntil:
    visible: 'Consolidate Transfers'
    timeout: 10000
- tapOn: 'Consolidate'

# 4. Wait for the success toast
- extendedWaitUntil:
    visible: 'Transfers consolidated'
    timeout: 10000

# 5. Verify canonicals exist on the transactions list
- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml
- assertVisible:
    id: 'TransactionCard.Label.E2E_Consolidation_P1_Out'
- assertVisible:
    id: 'TransactionCard.FromAccount.E2E_Consolidation_A'
- assertVisible:
    id: 'TransactionCard.ToAccount.E2E_Consolidation_B'
- assertVisible:
    id: 'TransactionCard.Label.E2E_Consolidation_P2_Out'
- assertVisible:
    id: 'TransactionCard.FromAccount.E2E_Consolidation_USD'
- assertVisible:
    id: 'TransactionCard.ToAccount.E2E_Consolidation_EUR'
- assertVisible:
    id: 'TransactionCard.Label.E2E_Consolidation_ATM_Out'
- assertVisible:
    id: 'TransactionCard.FromAccount.E2E_Consolidation_Card'
- assertVisible:
    id: 'TransactionCard.ToAccount.E2E_Consolidation_Cash'

# 6. INCOME-side source titles are now hidden (consolidationParent != NULL)
- assertNotVisible:
    id: 'TransactionCard.Label.E2E_Consolidation_P1_In'
- assertNotVisible:
    id: 'TransactionCard.Label.E2E_Consolidation_P2_In'

# 7. Untouched survives
- assertVisible:
    id: 'TransactionCard.Label.E2E_Consolidation_Untouched'

# 8. Open canonical 1 -> Sources sheet -> Revert -> source rows restored
- scrollUntilVisible:
    element:
      id: 'TransactionCard.Label.E2E_Consolidation_P1_Out'
    direction: UP
- tapOn:
    id: 'TransactionCard.Label.E2E_Consolidation_P1_Out'
- extendedWaitUntil:
    visible:
      id: 'TransactionFieldIcon.Sources'
    timeout: 10000
- tapOn:
    id: 'TransactionFieldIcon.Sources'
- extendedWaitUntil:
    visible:
      id: 'ConsolidationSourceModal.Row.0'
    timeout: 10000
- assertVisible:
    id: 'ConsolidationSourceModal.Row.1'
- assertVisible:
    id: 'ConsolidationSourceModal.RowTitle.0.E2E_Consolidation_P1_Out'
- assertVisible:
    id: 'ConsolidationSourceModal.RowAmount.0.CREDIT.200000000'
- assertVisible:
    id: 'ConsolidationSourceModal.RowTitle.1.E2E_Consolidation_P1_In'
- assertVisible:
    id: 'ConsolidationSourceModal.RowAmount.1.DEBIT.200000000'
- assertVisible:
    id: 'ConsolidationSourceModal.RevertButton'
- tapOn:
    id: 'ConsolidationSourceModal.RevertButton'
- runFlow: subflows/transactions/confirm-revert-consolidation.flow.yaml
- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml
- extendedWaitUntil:
    visible:
      id: 'TransactionCard.Label.E2E_Consolidation_P1_In'
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: 'TransactionCard.FromAccount.E2E_Consolidation_A'
    timeout: 5000

# 9. Detail actions menu on canonical 2 replaces Delete with Revert
- scrollUntilVisible:
    element:
      id: 'TransactionCard.Label.E2E_Consolidation_P2_Out'
    direction: DOWN
- tapOn:
    id: 'TransactionCard.Label.E2E_Consolidation_P2_Out'
- extendedWaitUntil:
    visible:
      id: 'TransactionActionsMenu.TriggerButton'
    timeout: 10000
- tapOn:
    id: 'TransactionActionsMenu.TriggerButton'
- extendedWaitUntil:
    visible:
      id: 'TransactionActionsMenu.RevertButton'
    timeout: 3000
- assertNotVisible:
    id: 'TransactionActionsMenu.DeleteButton'
- tapOn:
    id: 'TransactionActionsMenu.RevertButton'
- runFlow: subflows/transactions/confirm-revert-consolidation.flow.yaml
- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml
- extendedWaitUntil:
    visible:
      id: 'TransactionCard.Label.E2E_Consolidation_P2_In'
    timeout: 10000
- assertNotVisible:
    id: 'TransactionCard.FromAccount.E2E_Consolidation_USD'

# 10. Long-press menu on the ATM canonical replaces Delete with Revert
- scrollUntilVisible:
    element:
      id: 'TransactionCard.Label.E2E_Consolidation_ATM_Out'
    direction: DOWN
- longPressOn:
    id: 'TransactionCard.Label.E2E_Consolidation_ATM_Out'
- extendedWaitUntil:
    visible:
      id: 'TransactionContextMenu.RevertButton'
    timeout: 10000
- assertNotVisible:
    id: 'TransactionContextMenu.DeleteButton'
- tapOn:
    id: 'TransactionContextMenu.RevertButton'
- runFlow: subflows/transactions/confirm-revert-consolidation.flow.yaml
- extendedWaitUntil:
    visible:
      id: 'TransactionCard.Label.E2E_Consolidation_ATM_Out'
    timeout: 10000
- assertNotVisible:
    id: 'TransactionCard.FromAccount.E2E_Consolidation_Card'
- assertNotVisible:
    id: 'TransactionCard.ToAccount.E2E_Consolidation_Cash'

# 11. Final balance assertions show generated cash withdrawal entries are gone
- tapOn:
    id: 'TabBar.Home'
- extendedWaitUntil:
    visible:
      id: 'HomePage.TotalBalance'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'AccountCard.Balance.E2E_Consolidation_Cash.0'
    direction: DOWN
- assertVisible:
    id: 'AccountCard.Balance.E2E_Consolidation_Cash.0'
- scrollUntilVisible:
    element:
      id: 'AccountCard.Balance.E2E_Consolidation_A.750'
    direction: DOWN
- assertVisible:
    id: 'AccountCard.Balance.E2E_Consolidation_A.750'
- assertVisible:
    id: 'AccountCard.Balance.E2E_Consolidation_B.200'
- assertVisible:
    id: 'AccountCard.Balance.E2E_Consolidation_Untouched.0'

appId: ${APP_ID}
---

- runFlow: subflows/enter-app.flow.yaml

# --- Create Account ---

- tapOn:
    id: 'ActionButton'
- extendedWaitUntil:
    visible:
      id: 'ActionItem.0'
- waitForAnimationToEnd

- tapOn:
    text: 'Account'
- extendedWaitUntil:
    visible: 'New Account'

- tapOn:
    id: 'CreateAccount.CASH'
- extendedWaitUntil:
    visible: 'ACCOUNT NAME & ICON'

- tapOn:
    id: 'AccountForm.NameInput'
- inputText: 'E2E Account'

- tapOn:
    id: 'CreateAccount.Amount'
- inputText: '500'

- tapOn:
    id: 'AccountForm.SubmitButton'

- runFlow: subflows/relaunch-app.flow.yaml
- assertVisible: 'E2E Account.*'

# --- Edit Account ---

- tapOn: 'E2E Account.*'
- extendedWaitUntil:
    visible:
      id: 'AccountDetails.EditButton'
    timeout: 10000

- tapOn:
    id: 'AccountDetails.EditButton'
- extendedWaitUntil:
    visible:
      id: 'AccountForm.NameInput'
    timeout: 10000

- tapOn:
    id: 'AccountForm.NameInput'
- eraseText: 50
- inputText: 'E2E Edited Account'

- tapOn:
    id: 'AccountForm.SubmitButton'

- runFlow: subflows/relaunch-app.flow.yaml
- assertVisible: 'E2E Edited Account.*'

# --- Archive Account ---

- tapOn: 'E2E Edited Account.*'
- extendedWaitUntil:
    visible:
      id: 'AccountDetails.EditButton'
    timeout: 10000

- tapOn:
    id: 'AccountDetails.EditButton'
- extendedWaitUntil:
    visible:
      id: 'AccountForm.NameInput'
    timeout: 10000

- scrollUntilVisible:
    element:
      id: 'AccountDetails.ArchiveButton'
    direction: DOWN

- tapOn:
    id: 'AccountDetails.ArchiveButton'

- tapOn: 'Archive'

- runFlow: subflows/relaunch-app.flow.yaml
- assertNotVisible: 'E2E Edited Account.*'

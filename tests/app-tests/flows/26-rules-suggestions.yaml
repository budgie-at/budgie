steps:
  - launch: com.vitalyiegorov.budgie.e2e
  - tool: open-url
    args:
      url: budgie://settings?anchor=data
  - when:
      visible:
        text: Open in .*
    steps:
      - tap:
          text: Open
      - await:
          idle: true
  - when:
      visible: &a1
        text: Not Now
    steps:
      - tap: *a1
  - await:
      idle: true
  - when:
      hidden:
        id: SettingsPage.Container
    steps:
      - tool: open-url
        args:
          url: budgie://settings
      - when:
          visible:
            text: Open in .*
        steps:
          - tap:
              text: Open
          - await:
              idle: true
      - await:
          idle: true
      - await:
          visible:
            id: SettingsPage.Container
          timeout: 15000
  - await:
      visible:
        id: SettingsPage.Container
      timeout: 15000
  - echo: Optional scroll probe for {"id":"SettingsPage.ImportDatabaseCard"}
  - when:
      hidden:
        id: SettingsPage.ImportDatabaseCard
    steps:
      - scroll-to:
          target:
            id: SettingsPage.ImportDatabaseCard
          direction: down
      - await:
          idle: true
  - await:
      visible:
        id: SettingsPage.ImportDatabaseCard
      timeout: 5000
  - tap:
      id: SettingsPage.ImportDatabaseCard
  - await:
      idle: true
  - await:
      visible:
        text: Cancel
      timeout: 15000
  - when:
      visible:
        text: Apple Account Verification
    steps:
      - tap:
          text: Not Now
      - await:
          idle: true
  - when:
      visible:
        text: No Results for .*
    steps:
      - when:
          visible: &a2
            text: Clear text
        steps:
          - tap: *a2
      - await:
          idle: true
  - when:
      hidden:
        id: 25.db
    steps:
      - when:
          visible:
            id: E2EFixtures, Folder
        steps:
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          visible:
            text: budgie \(E2E\), Actions Menu
        steps:
          - await:
              visible:
                id: E2EFixtures, Folder
              timeout: 3000
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          hidden:
            text: E2EFixtures, Actions Menu
        steps:
          - when:
              hidden:
                text: budgie \(E2E\), Actions Menu
            steps:
              - when:
                  visible: &a3
                    id: BackButton
                steps:
                  - tap: *a3
              - when:
                  visible: &a4
                    id: BackButton
                steps:
                  - tap: *a4
              - when:
                  visible: &a5
                    id: BackButton
                steps:
                  - tap: *a5
              - when:
                  visible: &a6
                    text: Browse
                steps:
                  - tap: *a6
              - await:
                  idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - when:
                      visible:
                        text: On My iPhone
                    steps:
                      - tap:
                          text: On My iPhone
                      - await:
                          idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - scroll-to:
                      target:
                        text: budgie \(E2E\)
                      direction: down
              - await:
                  visible:
                    text: budgie \(E2E\)
                  timeout: 3000
              - tap:
                  text: budgie \(E2E\)
              - await:
                  idle: true
              - await:
                  visible:
                    id: E2EFixtures, Folder
                  timeout: 3000
              - tap:
                  id: E2EFixtures, Folder
              - await:
                  idle: true
  - echo: Optional scroll probe for {"id":"25.db"}
  - when:
      hidden:
        id: 25.db
    steps:
      - scroll-to:
          target:
            text: 25.db
          direction: down
  - await:
      idle: true
  - when:
      visible:
        id: 25.db
    steps:
      - tap:
          id: 25.db
  - when:
      hidden:
        id: 25.db
    steps:
      - when:
          visible: &a7
            text: 25.db
        steps:
          - tap: *a7
  - await:
      idle: true
  - when:
      visible:
        text: Continue
    steps:
      - tap:
          text: Continue
      - await:
          idle: true
      - when:
          visible:
            id: 25.db
        steps:
          - tap:
              id: 25.db
      - when:
          hidden:
            id: 25.db
        steps:
          - when:
              visible: &a8
                text: 25.db
            steps:
              - tap: *a8
      - await:
          idle: true
  - when:
      visible:
        text: Open
    steps:
      - tap:
          text: Open
  - await:
      visible:
        text: Importing a database will replace all current data.*
      timeout: 3000
  - tap:
      text: Import Database
  - await:
      idle: true
  - await:
      visible:
        id: TabBar.Home
      timeout: 30000
  - tap:
      id: TabBar.Home
  - await:
      visible:
        id: HomePage.TotalBalance
      timeout: 30000
  - echo: App process stop requested; the following launch performs a clean restart.
  - launch: com.vitalyiegorov.budgie.e2e
  - await:
      visible:
        id: TabBar.Home
      timeout: 30000
  - tool: open-url
    args:
      url: budgie://settings/import?fileUri=file:///tmp/budgie-e2e-fixtures/test15-suggested-rule.csv
  - when:
      visible:
        text: Open in .*
    steps:
      - tap:
          text: Open
      - await:
          idle: true
  - await:
      idle: true
  - await:
      visible:
        id: ImportScreen.PresetChip.Budgie
      timeout: 10000
  - tap:
      text: Budgie
  - await:
      visible:
        text: Preset applied. Adjust columns below if needed.
      timeout: 10000
  - await:
      visible:
        id: CsvPage.StartImportButton.Label
        text: Start Import
      timeout: 10000
  - tap:
      id: CsvPage.StartImportButton.Label
  - await:
      hidden:
        id: ImportScreen.PresetChip.Budgie
      timeout: 60000
  - tool: open-url
    args:
      url: budgie://transactions
  - when:
      visible:
        text: Open in .*

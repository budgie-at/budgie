appId: ${APP_ID}
---

- runFlow:
    file: setup/setup-multi-currency-budget.flow.yaml

- openLink: 'budgie://budget'
- extendedWaitUntil:
    visible:
      id: 'BudgetWidget.EmptyState'
    timeout: 3000

- tapOn:
    id: 'BudgetWidget.EmptyState'
- runFlow:
    file: subflows/budget/choose-empty-canvas.flow.yaml

- tapOn:
    id: 'BudgetSetup.OverallLimitInput'
- inputText: '200'
- tapOn:
    id: 'BudgetSetup.CategoryLimitsHeader'
- waitForAnimationToEnd
- tapOn:
    id: 'BudgetSetup.SaveButton'

- extendedWaitUntil:
    visible:
      id: 'BudgetWidget.Card'
    timeout: 3000
- assertVisible:
    id: 'BudgetWidget.SpentLabel'
    text: '€137 / €200'

- tapOn:
    id: 'BudgetWidget.Card'
- extendedWaitUntil:
    visible: 'Budget details'
    timeout: 3000
- assertVisible:
    id: 'BudgetDetails.SpentLabel'
    text: '€137 / €200'

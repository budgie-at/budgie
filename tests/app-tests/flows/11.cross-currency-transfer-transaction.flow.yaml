appId: ${APP_ID}
---
- runFlow:
      file: subflows/import/import-database-from-settings.flow.yaml
      env:
          FIXTURE_ROW_ID_MATCH: '11.db'

# --- Create Cross-Currency Transfer ---

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- runFlow:
      file: subflows/transactions/open-transaction-form.flow.yaml
      env:
          ACTION_ITEM_ID: 'ActionItem.Transfer'
          FORM_TITLE: 'New Transfer'

- tapOn:
      id: 'TransactionKeypad.Digit.7'
- tapOn:
      id: 'TransactionKeypad.Digit.5'

- tapOn:
      id: 'TransferForm.FromAccount'
- extendedWaitUntil:
      visible:
          id: 'AccountPickerBottomSheet.Input'
- tapOn:
      id: 'AccountPickerBottomSheet.Input'
- inputText: 'E2E Txn Account'
- tapOn: Done
- waitForAnimationToEnd
- extendedWaitUntil:
      visible:
          id: 'AccountPickerBottomSheet.Option.E2E Txn Account'
- tapOn:
      id: 'AccountPickerBottomSheet.Option.E2E Txn Account'
- extendedWaitUntil:
      notVisible:
          id: 'AccountPickerBottomSheet.Input'

- tapOn:
      id: 'TransferForm.ToAccount'
- extendedWaitUntil:
      visible:
          id: 'AccountPickerBottomSheet.Input'
- tapOn:
      id: 'AccountPickerBottomSheet.Input'
- inputText: 'E2E Foreign Account'
- tapOn: Done
- waitForAnimationToEnd
- extendedWaitUntil:
      visible:
          id: 'AccountPickerBottomSheet.Option.E2E Foreign Account'
- tapOn:
      id: 'AccountPickerBottomSheet.Option.E2E Foreign Account'
- extendedWaitUntil:
      notVisible:
          id: 'AccountPickerBottomSheet.Input'

- extendedWaitUntil:
      visible:
          id: 'TransferForm.ConversionRow'

- runFlow:
      file: subflows/transactions/enter-comment.flow.yaml
      env:
          COMMENT: 'E2E Cross Currency Transfer'

- runFlow: subflows/transactions/submit-transaction-and-wait.flow.yaml

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.E2E_Cross_Currency_Transfer'
      timeout: 5000

- tapOn:
      id: 'TabBar.Home'
- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
- assertVisible:
      id: 'AccountCard.Balance.E2E_Txn_Account.25'
- assertVisible:
      id: 'AccountCard.Balance.E2E_Foreign_Account.165'

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

# --- Edit Cross-Currency Transfer ---

- tapOn:
      id: 'TransactionCard.Label.E2E_Cross_Currency_Transfer'
- extendedWaitUntil:
      visible:
          id: 'TransactionInfo.Page'
      timeout: 5000
- assertVisible:
      id: 'TransactionInfo.Row.FromAccount'
- assertVisible:
      id: 'TransactionInfo.Row.ToAccount'
- assertVisible:
      id: 'TransactionInfo.Row.ExchangeRate'
- tapOn:
      id: 'TransactionInfo.EditButton.Label'

- extendedWaitUntil:
      visible:
          id: 'TransferForm.ConversionRow'
      timeout: 5000
- longPressOn:
      id: 'TransactionKeypad.Backspace'
- tapOn:
      id: 'TransactionKeypad.Digit.5'
- tapOn:
      id: 'TransactionKeypad.Digit.0'

- tapOn:
      id: 'TransactionForm.SubmitButton'
- extendedWaitUntil:
      visible:
          id: 'TransactionInfo.Page'
      timeout: 15000
- assertVisible:
      id: 'TransactionInfo.Row.ExchangeRate'
- tapOn:
      id: 'PageHeader.BackButton'

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.E2E_Cross_Currency_Transfer'
      timeout: 5000

- tapOn:
      id: 'TabBar.Home'
- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
- assertVisible:
      id: 'AccountCard.Balance.E2E_Txn_Account.50'
- assertVisible:
      id: 'AccountCard.Balance.E2E_Foreign_Account.150'

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

# --- Delete Cross-Currency Transfer ---

- tapOn:
      id: 'TransactionCard.Label.E2E_Cross_Currency_Transfer'
- extendedWaitUntil:
      visible:
          id: 'TransactionInfo.Page'
      timeout: 5000

- runFlow: subflows/transactions/delete-transaction.flow.yaml
- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- assertNotVisible:
      id: 'TransactionCard.Label.E2E_Cross_Currency_Transfer'

- tapOn:
      id: 'TabBar.Home'
- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
- assertVisible:
      id: 'AccountCard.Balance.E2E_Txn_Account.100'
- assertVisible:
      id: 'AccountCard.Balance.E2E_Foreign_Account.100'

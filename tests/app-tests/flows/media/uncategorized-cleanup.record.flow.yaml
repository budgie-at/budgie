appId: ${APP_ID}
env:
    LOCALE: ${LOCALE || 'en'}
    APPEARANCE: ${APPEARANCE || 'light'}
    CLIP_ID: 'uncategorized-cleanup'
---
# clip: uncategorized-cleanup | target length: 5s | poster scene: uncategorized-transactions-1 | seed: uncategorized
# script: Transactions -> account filter -> the missing-category pill -> the cleanup list
- startRecording: '${CLIP_ID}-${LOCALE}-${APPEARANCE}'

- runFlow:
      file: uncategorized-cleanup-page.flow.yaml
      env:
          IS_COMPOSED: 'true'

- waitForAnimationToEnd

- stopRecording

appId: ${APP_ID}
env:
    SCENE_ID: ${SCENE_ID || 'data-export-1'}
    IS_COMPOSED: ${IS_COMPOSED || 'false'}
    SHARE_SHEET_LABEL: ${SHARE_SHEET_LABEL || 'Save to Files'}
---
# Settings -> Data -> Export CSV, held on the OS share sheet carrying the generated
# file. SHARE_SHEET_LABEL is a native iOS string, so it is parameterised for the
# non-English cells of the capture matrix.
#
# FOLLOW-UP: the export date-range selector and column list carry no stable testID,
# so the range cannot be switched before the sheet opens. Blocked on app-side
# selectors:
#   ExportCsvSelector.{RangePicker,RangeOption,ColumnList}
#       -> export/components/export-csv
- runFlow:
      file: ../subflows/navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://settings?anchor=data'

- extendedWaitUntil:
      visible:
          id: 'SettingsPage.Container'
      timeout: 15000

- scrollUntilVisible:
      element:
          id: 'CsvPage.ExportCard'
      direction: DOWN
      centerElement: true
      waitToSettleTimeoutMs: 1000
- waitForAnimationToEnd

- tapOn:
      id: 'CsvPage.ExportCard'
      retryTapIfNoChange: true

- extendedWaitUntil:
      visible: '${SHARE_SHEET_LABEL}'
      timeout: 15000

# Capture-mode switch. Run on its own as a still scene the flow ends in the single
# takeScreenshot mobile-ci requires per flow cell. Callers that compose it - the
# record wrappers and the continuation scene flows - pass IS_COMPOSED='true', so a
# composed cell still emits exactly one screenshot, and a recording emits none.
- runFlow:
      when:
          true: ${IS_COMPOSED != 'true'}
      commands:
          - takeScreenshot: ${SCENE_ID}

appId: ${APP_ID}
env:
    LOCALE: ${LOCALE || 'en'}
    APPEARANCE: ${APPEARANCE || 'light'}
    CLIP_ID: 'quick-expense-entry'
---
# clip: quick-expense-entry | target length: 5s | poster scene: expense-tracking-1 | seed: showcase
# script: tap + on Home -> the quick-entry sheet rises -> amount -> Save -> the row lands
- startRecording: '${CLIP_ID}-${LOCALE}-${APPEARANCE}'

- runFlow:
      file: ../subflows/navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://'

- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
      timeout: 15000

- runFlow: ../subflows/transactions/open-action-menu.flow.yaml

- tapOn:
      id: 'ActionItem.Expense.Label'

- extendedWaitUntil:
      visible:
          id: 'TransactionForm.Page'
      timeout: 10000

- tapOn:
      id: 'TransactionKeypad.Digit.1'
- tapOn:
      id: 'TransactionKeypad.Digit.2'
- tapOn:
      id: 'TransactionKeypad.Digit.4'
- tapOn:
      id: 'TransactionKeypad.Digit.0'

- tapOn:
      id: 'TransactionForm.SubmitButton'
      enabled: true
      retryTapIfNoChange: true

- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
      timeout: 15000

- waitForAnimationToEnd

- stopRecording

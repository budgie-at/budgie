appId: ${APP_ID}
env:
    SCENE_ID: ${SCENE_ID || 'date-filter-presets-1'}
    IS_COMPOSED: ${IS_COMPOSED || 'false'}
    DATE_PERIOD: ${DATE_PERIOD || 'LAST_MONTH'}
---
# Transactions -> date pill -> preset list -> apply one preset. The preset ids come
# straight from DatePeriodEnum, so they are locale-independent.
- runFlow:
      file: ../subflows/navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://transactions'

- extendedWaitUntil:
      visible:
          id: 'TransactionsPage.Container'
      timeout: 15000

- tapOn:
      id: 'TransactionFilters.DateChip'

- extendedWaitUntil:
      visible:
          id: 'TransactionFilters.DatePeriod.${DATE_PERIOD}'
      timeout: 5000

- tapOn:
      id: 'TransactionFilters.DatePeriod.${DATE_PERIOD}'
- tapOn:
      id: 'TransactionFilters.DateApplyButton'

- extendedWaitUntil:
      visible:
          id: 'TransactionFilters.DateChipActive'
      timeout: 5000

# Capture-mode switch. Run on its own as a still scene the flow ends in the single
# takeScreenshot mobile-ci requires per flow cell. Callers that compose it - the
# record wrappers and the continuation scene flows - pass IS_COMPOSED='true', so a
# composed cell still emits exactly one screenshot, and a recording emits none.
- runFlow:
      when:
          true: ${IS_COMPOSED != 'true'}
      commands:
          - takeScreenshot: ${SCENE_ID}

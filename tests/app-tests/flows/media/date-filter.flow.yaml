appId: ${APP_ID}
env:
    DATE_PERIOD: ${DATE_PERIOD || 'LAST_MONTH'}
---
# Transactions -> date pill -> preset list -> apply one preset. The preset ids come
# straight from DatePeriodEnum, so they are locale-independent.
- runFlow:
      file: ../subflows/navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://transactions'

- extendedWaitUntil:
      visible:
          id: 'TransactionsPage.Container'
      timeout: 15000

- tapOn:
      id: 'TransactionFilters.DateChip'

- extendedWaitUntil:
      visible:
          id: 'TransactionFilters.DatePeriod.${DATE_PERIOD}'
      timeout: 5000

- tapOn:
      id: 'TransactionFilters.DatePeriod.${DATE_PERIOD}'
- tapOn:
      id: 'TransactionFilters.DateApplyButton'

- extendedWaitUntil:
      visible:
          id: 'TransactionFilters.DateChipActive'
      timeout: 5000

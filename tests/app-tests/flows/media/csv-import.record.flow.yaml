appId: ${APP_ID}
env:
    LOCALE: ${LOCALE || 'en'}
    APPEARANCE: ${APPEARANCE || 'light'}
    CLIP_ID: 'csv-import'
---
# clip: csv-import | target length: 8s | poster scene: csv-import-2 | seed: import-presets + CSV fixture
# script: Import -> CSV -> pick the fixture -> preset applied -> preview ready to import
- startRecording: '${CLIP_ID}-${LOCALE}-${APPEARANCE}'

- runFlow:
      file: csv-column-mapper.flow.yaml
      env:
          IS_COMPOSED: 'true'

- waitForAnimationToEnd

- stopRecording

appId: ${APP_ID}
env:
    LOCALE: ${LOCALE || 'en'}
    APPEARANCE: ${APPEARANCE || 'light'}
    CLIP_ID: 'split-transaction'
---
# clip: split-transaction | target length: 6s | poster scene: split-transactions-1 | seed: split-transaction
# script: split an expense -> add rows -> the remaining pill counts down to zero -> Done
- startRecording: '${CLIP_ID}-${LOCALE}-${APPEARANCE}'

- runFlow:
      file: split-entries.flow.yaml
      env:
          IS_COMPOSED: 'true'

- waitForAnimationToEnd

- stopRecording

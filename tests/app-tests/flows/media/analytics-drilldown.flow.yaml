appId: ${APP_ID}
env:
    SCENE_ID: ${SCENE_ID || 'spending-analytics-2'}
    IS_COMPOSED: ${IS_COMPOSED || 'false'}
    CATEGORY_STATISTICS_ID: ${CATEGORY_STATISTICS_ID || 'CategoryStatisticsCard.Groceries'}
---
# Statistics -> Categories -> tap a slice row -> the drill-down transaction list.
# CATEGORY_STATISTICS_ID is title-derived, so the non-English cells pass the
# translated id from the locale overlay.
- runFlow:
      file: ../subflows/navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://analytics'

- extendedWaitUntil:
      visible:
          id: 'AnalyticsPage.Tab.Categories'
      timeout: 15000

- extendedWaitUntil:
      visible:
          id: '${CATEGORY_STATISTICS_ID}'
      timeout: 10000

- tapOn:
      id: '${CATEGORY_STATISTICS_ID}'

- extendedWaitUntil:
      visible:
          id: 'PageHeader.BackButton'
      timeout: 10000

# Capture-mode switch. Run on its own as a still scene the flow ends in the single
# takeScreenshot mobile-ci requires per flow cell. Callers that compose it - the
# record wrappers and the continuation scene flows - pass IS_COMPOSED='true', so a
# composed cell still emits exactly one screenshot, and a recording emits none.
- runFlow:
      when:
          true: ${IS_COMPOSED != 'true'}
      commands:
          - takeScreenshot: ${SCENE_ID}

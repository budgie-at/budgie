appId: ${APP_ID}
env:
    SCENE_ID: ${SCENE_ID || 'erste-bank-pdf-import-1'}
    IS_COMPOSED: ${IS_COMPOSED || 'false'}
    PDF_ROW_ID_MATCH: ${PDF_ROW_ID_MATCH || 'erste-statement-008, pdf'}
---
# Erste statement import: new account -> Erste provider -> pick the fixture PDF ->
# parsed preview -> imported account visible on Home.
- runFlow: ../subflows/accounts/open-new-account.flow.yaml

- scrollUntilVisible:
      element:
          id: 'CreateAccount.ERSTE'
      direction: DOWN
      timeout: 10000
      visibilityPercentage: 80
      speed: 20

- waitForAnimationToEnd

- tapOn:
      id: 'CreateAccount.ERSTE'

- runFlow:
      file: ../subflows/import/import-erste-pdf-from-picker.flow.yaml
      env:
          PDF_ROW_ID_MATCH: ${PDF_ROW_ID_MATCH}

# Capture-mode switch. Run on its own as a still scene the flow ends in the single
# takeScreenshot mobile-ci requires per flow cell. Callers that compose it - the
# record wrappers and the continuation scene flows - pass IS_COMPOSED='true', so a
# composed cell still emits exactly one screenshot, and a recording emits none.
- runFlow:
      when:
          true: ${IS_COMPOSED != 'true'}
      commands:
          - takeScreenshot: ${SCENE_ID}

appId: ${APP_ID}
env:
    SCENE_ID: ${SCENE_ID || 'voice-transaction-entry-1'}
    IS_COMPOSED: ${IS_COMPOSED || 'false'}
---
# Opens the AI voice-entry surface from the Home create menu.
#
# FOLLOW-UP: the voice controls carry no stable testID, so this flow stops at the
# create menu rather than hand-building coordinates. Blocked on app-side selectors:
#   CreateTransactionMenuSelector.AiButton
#       -> transaction/components/create-transaction-menu/create-transaction-menu.selector.ts
#   VoiceInputOverlaySelector.{Container,RecordButton,Waveform,Transcript}
#       -> ai/component/voice-input-overlay
#   VoiceReviewSelector.{Page,Amount,Category,Account,SaveButton}
#       -> app/voice-review.tsx
- runFlow:
      file: ../subflows/navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://'

- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
      timeout: 15000

- runFlow: ../subflows/transactions/open-action-menu.flow.yaml

# Capture-mode switch. Run on its own as a still scene the flow ends in the single
# takeScreenshot mobile-ci requires per flow cell. Callers that compose it - the
# record wrappers and the continuation scene flows - pass IS_COMPOSED='true', so a
# composed cell still emits exactly one screenshot, and a recording emits none.
- runFlow:
      when:
          true: ${IS_COMPOSED != 'true'}
      commands:
          - takeScreenshot: ${SCENE_ID}

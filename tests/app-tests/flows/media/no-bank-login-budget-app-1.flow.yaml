appId: ${APP_ID}
---
- runFlow:
      file: ../subflows/navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://'

- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
      timeout: 15000

- runFlow: ../subflows/accounts/open-new-account.flow.yaml

- tapOn:
      id: 'CreateAccount.MONOBANK'

- extendedWaitUntil:
      visible:
          id: 'CreateMonobankAccount.ScrollView'
      timeout: 15000

- waitForAnimationToEnd

- takeScreenshot: scene

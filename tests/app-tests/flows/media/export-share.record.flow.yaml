appId: ${APP_ID}
env:
    LOCALE: ${LOCALE || 'en'}
    APPEARANCE: ${APPEARANCE || 'light'}
    CLIP_ID: 'export-share'
---
# clip: export-share | target length: 5s | poster scene: data-export-1 | seed: showcase
# script: Settings -> Data -> Export CSV -> the OS share sheet rises with the file
- startRecording: '${CLIP_ID}-${LOCALE}-${APPEARANCE}'

- runFlow:
      file: export-share.flow.yaml
      env:
          IS_COMPOSED: 'true'

- waitForAnimationToEnd

- stopRecording

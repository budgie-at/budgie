appId: ${APP_ID}
env:
    SCENE_ID: ${SCENE_ID || 'recurring-payments-calendar-1'}
    IS_COMPOSED: ${IS_COMPOSED || 'false'}
---
# Transactions -> Recurring, held on the month grid with its marked days and the
# upcoming forecast list below. The tab is local component state, not a route param,
# so it cannot be deep-linked and has to be tapped. Opening a marked day is the
# continuation scene, recurring-day-detail.flow.yaml.
- runFlow:
      file: ../subflows/navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://transactions'

- extendedWaitUntil:
      visible:
          id: 'TransactionsPage.Container'
      timeout: 15000

- tapOn:
      id: 'TransactionsPage.Tab.Recurring'

- extendedWaitUntil:
      visible:
          id: 'RecurringCalendar.Container'
      timeout: 10000

- scrollUntilVisible:
      element:
          id: 'RecurringCalendar.UpcomingHeader'
      direction: DOWN
      centerElement: true
      waitToSettleTimeoutMs: 1000
- waitForAnimationToEnd

# Capture-mode switch. Run on its own as a still scene the flow ends in the single
# takeScreenshot mobile-ci requires per flow cell. Callers that compose it - the
# record wrappers and the continuation scene flows - pass IS_COMPOSED='true', so a
# composed cell still emits exactly one screenshot, and a recording emits none.
- runFlow:
      when:
          true: ${IS_COMPOSED != 'true'}
      commands:
          - takeScreenshot: ${SCENE_ID}

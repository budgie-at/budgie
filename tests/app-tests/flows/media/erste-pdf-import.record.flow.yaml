appId: ${APP_ID}
env:
    LOCALE: ${LOCALE || 'en'}
    APPEARANCE: ${APPEARANCE || 'light'}
    CLIP_ID: 'erste-pdf-import'
---
# clip: erste-pdf-import | target length: 7s | poster scene: erste-bank-pdf-import-1 | seed: Erste PDF fixture
# script: Import -> Erste PDF -> parsing -> the parsed preview builds -> import
- startRecording: '${CLIP_ID}-${LOCALE}-${APPEARANCE}'

- runFlow:
      file: erste-pdf-preview.flow.yaml
      env:
          IS_COMPOSED: 'true'

- waitForAnimationToEnd

- stopRecording

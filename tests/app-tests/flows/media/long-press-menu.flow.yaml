appId: ${APP_ID}
env:
    TRANSACTION_ID: ${TRANSACTION_ID || '103'}
---
# Transactions -> long-press a card -> the context menu animates open anchored to
# it -> Convert to Transfer -> the counter-account picker.
- runFlow:
      file: ../subflows/navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://transactions'

- extendedWaitUntil:
      visible:
          id: 'TransactionsPage.Container'
      timeout: 15000

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.${TRANSACTION_ID}'
      timeout: 10000

- runFlow:
      file: ../subflows/transactions/long-press-convert-to-transfer.flow.yaml
      env:
          TRANSACTION_CARD_ID: 'TransactionCard.${TRANSACTION_ID}'

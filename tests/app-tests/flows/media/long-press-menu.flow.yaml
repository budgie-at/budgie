appId: ${APP_ID}
env:
    SCENE_ID: ${SCENE_ID || 'transaction-long-press-menu-1'}
    IS_COMPOSED: ${IS_COMPOSED || 'false'}
    TRANSACTION_ID: ${TRANSACTION_ID || '103'}
---
# Transactions -> long-press a card -> the context menu animates open anchored to it,
# list dimmed behind. Tapping through to the counter-account picker is the
# continuation scene, convert-to-transfer-picker.flow.yaml.
- runFlow:
      file: ../subflows/navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://transactions'

- extendedWaitUntil:
      visible:
          id: 'TransactionsPage.Container'
      timeout: 15000

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.${TRANSACTION_ID}'
      timeout: 10000

- longPressOn:
      id: 'TransactionCard.${TRANSACTION_ID}'

- extendedWaitUntil:
      visible:
          id: 'TransactionContextMenu.ConvertToTransferButton'
      timeout: 10000

# Capture-mode switch. Run on its own as a still scene the flow ends in the single
# takeScreenshot mobile-ci requires per flow cell. Callers that compose it - the
# record wrappers and the continuation scene flows - pass IS_COMPOSED='true', so a
# composed cell still emits exactly one screenshot, and a recording emits none.
- runFlow:
      when:
          true: ${IS_COMPOSED != 'true'}
      commands:
          - takeScreenshot: ${SCENE_ID}

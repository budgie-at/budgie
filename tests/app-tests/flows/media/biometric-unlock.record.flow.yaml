appId: ${APP_ID}
env:
    LOCALE: ${LOCALE || 'en'}
    APPEARANCE: ${APPEARANCE || 'light'}
    CLIP_ID: 'biometric-unlock'
---
# clip: biometric-unlock | target length: 3s | poster scene: biometric-authentication-1 | seed: security-locked
# script: cold open -> lock screen -> the biometric sheet -> match -> Home reveals balances
- startRecording: '${CLIP_ID}-${LOCALE}-${APPEARANCE}'

- extendedWaitUntil:
      visible:
          id: 'PinPage.Container'
      timeout: 30000

- tapOn:
      id: 'PinPage.BiometricButton'

- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
      timeout: 15000

- waitForAnimationToEnd

- stopRecording

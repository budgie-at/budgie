appId: ${APP_ID}
---
- runFlow:
      file: ../subflows/navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://transactions/9001/expense/edit'

- extendedWaitUntil:
      visible:
          id: 'TransactionForm.CategorySelector.Title'
      timeout: 15000

- tapOn:
      id: 'TransactionForm.CategorySelector.Title'

- extendedWaitUntil:
      visible:
          id: 'CategoryPickerBottomSheet.Input'
      timeout: 10000

- tapOn:
      id: 'CategoryPickerBottomSheet.Input'

- inputText: 'restaurants'

- extendedWaitUntil:
      visible:
          id: '^CategoryPickerBottomSheet[.]Card[.].+[.]Label$'
      timeout: 10000

- tapOn:
      id: '^CategoryPickerBottomSheet[.]Card[.].+[.]Label$'
      index: 0

- extendedWaitUntil:
      visible:
          id: 'SuggestRule.Card'
      timeout: 15000

- waitForAnimationToEnd

- takeScreenshot: scene

- waitForAnimationToEnd

- extendedWaitUntil:
      visible:
          id: 'ImportScreen.PresetChip.Budgie'
      timeout: 15000

- tapOn:
      id: 'ImportScreen.PresetChip.Budgie'

- waitForAnimationToEnd

- takeScreenshot: scene

appId: ${APP_ID}
---
- runFlow:
      file: ../subflows/import/open-csv-import-picker.flow.yaml

- runFlow:
      file: ../subflows/import/select-file-from-app-provider.flow.yaml
      env:
          FILE_ROW_ID_MATCH: 'e2e-budgie-import(, csv)?'

- extendedWaitUntil:
      visible:
          id: 'ImportScreen.PresetChip.Budgie'
      timeout: 15000

- tapOn:
      id: 'ImportScreen.PresetChip.Budgie'

- waitForAnimationToEnd

- takeScreenshot: scene

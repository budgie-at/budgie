appId: ${APP_ID}
---
- openLink: 'budgie://import-csv?fileUri=file://${APP_DATA_CONTAINER}/Documents/E2EFixtures/e2e-budgie-import.csv'

- waitForAnimationToEnd

- extendedWaitUntil:
      visible:
          id: 'ImportPresetPickerSelector.Toggle'
      timeout: 15000

- tapOn:
      id: 'ImportPresetPickerSelector.Toggle'

- tapOn:
      id: 'ImportScreen.PresetChip.Budgie'

- waitForAnimationToEnd

- assertVisible:
      text: 'Import [0-9]+ transactions?'

- takeScreenshot: scene

appId: ${APP_ID}
env:
    SCENE_ID: ${SCENE_ID || 'privatbank-import-1'}
    IS_COMPOSED: ${IS_COMPOSED || 'false'}
    XLSX_ROW_ID_MATCH: ${XLSX_ROW_ID_MATCH || 'e2e-privatbank-import(, xlsx)?'}
---
# PrivatBank XLSX import: new account -> PrivatBank provider -> pick the fixture
# XLSX -> parsed preview with MCC-mapped rows -> imported account visible on Home.
- runFlow: ../subflows/accounts/open-new-account.flow.yaml

- scrollUntilVisible:
      element:
          id: 'CreateAccount.PRIVATBANK'
      direction: DOWN
      timeout: 10000
      visibilityPercentage: 80
      speed: 20

- waitForAnimationToEnd

- tapOn:
      id: 'CreateAccount.PRIVATBANK'

- runFlow:
      file: ../subflows/import/import-privatbank-xlsx-from-picker.flow.yaml
      env:
          XLSX_ROW_ID_MATCH: ${XLSX_ROW_ID_MATCH}

# Capture-mode switch. Run on its own as a still scene the flow ends in the single
# takeScreenshot mobile-ci requires per flow cell. Callers that compose it - the
# record wrappers and the continuation scene flows - pass IS_COMPOSED='true', so a
# composed cell still emits exactly one screenshot, and a recording emits none.
- runFlow:
      when:
          true: ${IS_COMPOSED != 'true'}
      commands:
          - takeScreenshot: ${SCENE_ID}

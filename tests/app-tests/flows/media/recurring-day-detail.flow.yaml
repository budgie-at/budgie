appId: ${APP_ID}
env:
    IS_COMPOSED: ${IS_COMPOSED || 'false'}
    SCENE_ID: ${SCENE_ID || 'recurring-payments-calendar-2'}
    RECURRING_DAY: ${RECURRING_DAY || 'Today'}
---
# The calendar day detail sheet for a marked day: the subscription, its cadence,
# average amount and last-seen date. Continues transactions-recurring-tab.flow.yaml,
# which holds on the month grid itself.
- runFlow:
      file: transactions-recurring-tab.flow.yaml
      env:
          IS_COMPOSED: 'true'

- tapOn:
      id: 'RecurringCalendar.Day.${RECURRING_DAY}'

- extendedWaitUntil:
      visible:
          id: 'RecurringCalendar.SelectedDayHeader'
      timeout: 10000

# Continuation scene. mobile-ci collects exactly one takeScreenshot per flow cell, so
# the state this flow adds on top of transactions-recurring-tab.flow.yaml is its own
# scene rather than a second screenshot in that flow.
- runFlow:
      when:
          true: ${IS_COMPOSED != 'true'}
      commands:
          - takeScreenshot: ${SCENE_ID}

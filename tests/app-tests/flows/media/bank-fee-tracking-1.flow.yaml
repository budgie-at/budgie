appId: ${APP_ID}
---
- runFlow:
      file: ../subflows/navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://transactions/2300/transfer'

- extendedWaitUntil:
      visible:
          id: 'TransactionInfo.Page'
      timeout: 15000

- scrollUntilVisible:
    element:
      id: 'TransactionInfo.Row.Fee'
    direction: DOWN
    centerElement: true
- extendedWaitUntil:
      visible:
          id: 'TransactionInfo.Row.Fee'
      timeout: 5000

- tapOn:
      id: 'TransactionInfo.Row.Fee'

- extendedWaitUntil:
      visible:
          id: 'SplitEntryRow.Amount.0'
      timeout: 10000

- waitForAnimationToEnd

- takeScreenshot: scene

appId: ${APP_ID}
---
- runFlow:
      file: ../subflows/navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://transactions/202/income'

- extendedWaitUntil:
      visible:
          id: 'TransactionInfo.Page'
      timeout: 15000

- scrollUntilVisible:
    element:
      id: 'TransactionInfo.ConvertButton'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
      id: 'TransactionInfo.ConvertButton'
- tapOn:
      text: 'Attach debt'

- extendedWaitUntil:
      visible:
          id: 'AccountPickerBottomSheet.Input'
      timeout: 10000

- waitForAnimationToEnd

- takeScreenshot: scene

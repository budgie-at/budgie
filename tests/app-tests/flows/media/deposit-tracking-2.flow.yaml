appId: ${APP_ID}
---
- runFlow:
      file: ../subflows/navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://account/8/details'

- extendedWaitUntil:
      visible:
          id: 'AccountDetails.ActionsButton'
      timeout: 15000

- tapOn:
      id: 'AccountDetails.ActionsButton'

- extendedWaitUntil:
      visible:
          id: 'AccountDetails.CloseDepositButton'
      timeout: 5000

- waitForAnimationToEnd

- takeScreenshot: scene

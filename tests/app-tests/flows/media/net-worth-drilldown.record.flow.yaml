appId: ${APP_ID}
env:
    LOCALE: ${LOCALE || 'en'}
    APPEARANCE: ${APPEARANCE || 'light'}
    CLIP_ID: 'net-worth-drilldown'
---
# clip: net-worth-drilldown | target length: 4s | poster scene: net-worth-tracker-1 | seed: net-worth-full
# script: Home at rest -> scroll -> header collapses -> tap the total -> per-currency legs
- startRecording: '${CLIP_ID}-${LOCALE}-${APPEARANCE}'

- runFlow:
      file: net-worth-drilldown.flow.yaml
      env:
          IS_COMPOSED: 'true'

- waitForAnimationToEnd

- stopRecording

appId: ${APP_ID}
env:
    SCENE_ID: ${SCENE_ID || 'multi-language-app-1'}
    IS_COMPOSED: ${IS_COMPOSED || 'false'}
    TARGET_LOCALE: ${TARGET_LOCALE || 'uk'}
---
# Settings -> General -> Language -> pick another locale. The whole UI re-renders in
# place, no relaunch.
- runFlow: ../subflows/navigation/navigate-to-settings.flow.yaml

- runFlow:
      file: ../subflows/navigation/open-settings-card.flow.yaml
      env:
          CARD_ID: 'SettingsPage.LanguageCard'
          DESTINATION_ID: 'LanguageSelector.SearchInput'

- tapOn:
      id: 'LanguageSelector.Option.${TARGET_LOCALE}'

- extendedWaitUntil:
      notVisible:
          id: 'LanguageSelector.SearchInput'
      timeout: 5000

- extendedWaitUntil:
      visible:
          id: 'SettingsPage.LanguageCard.${TARGET_LOCALE}'
      timeout: 10000

# Capture-mode switch. Run on its own as a still scene the flow ends in the single
# takeScreenshot mobile-ci requires per flow cell. Callers that compose it - the
# record wrappers and the continuation scene flows - pass IS_COMPOSED='true', so a
# composed cell still emits exactly one screenshot, and a recording emits none.
- runFlow:
      when:
          true: ${IS_COMPOSED != 'true'}
      commands:
          - takeScreenshot: ${SCENE_ID}

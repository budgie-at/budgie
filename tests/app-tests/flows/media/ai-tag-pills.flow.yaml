appId: ${APP_ID}
env:
    SCENE_ID: ${SCENE_ID || 'ai-tag-suggestions-1'}
    IS_COMPOSED: ${IS_COMPOSED || 'false'}
    CATEGORY_NAME: ${CATEGORY_NAME || 'Groceries'}
---
# Expense form after a category is picked, holding on the suggested tag pills.
#
# FOLLOW-UP: the tag suggestion pills carry no stable testID, so the flow cannot tap
# one. Blocked on app-side selectors:
#   SuggestionPillSelector.Pill -> transaction/components/tag-suggestion-row
- runFlow:
      file: ../subflows/navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://create-transaction/expense'

- extendedWaitUntil:
      visible:
          id: 'TransactionForm.Page'
      timeout: 15000

- tapOn:
      id: 'TransactionForm.CategorySelector'
- extendedWaitUntil:
      visible:
          id: 'CategoryPickerBottomSheet.Input'
      timeout: 5000
- tapOn:
      id: 'CategoryPickerBottomSheet.Input'
- inputText: ${CATEGORY_NAME}
- pressKey: enter
- extendedWaitUntil:
      visible:
          id: 'CategoryPickerBottomSheet.Card.${CATEGORY_NAME}'
      timeout: 15000
- tapOn:
      id: 'CategoryPickerBottomSheet.Card.${CATEGORY_NAME}'
      retryTapIfNoChange: true

- extendedWaitUntil:
      notVisible:
          id: 'CategoryPickerBottomSheet.Input'
      timeout: 5000

# Capture-mode switch. Run on its own as a still scene the flow ends in the single
# takeScreenshot mobile-ci requires per flow cell. Callers that compose it - the
# record wrappers and the continuation scene flows - pass IS_COMPOSED='true', so a
# composed cell still emits exactly one screenshot, and a recording emits none.
- runFlow:
      when:
          true: ${IS_COMPOSED != 'true'}
      commands:
          - takeScreenshot: ${SCENE_ID}

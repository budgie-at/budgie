appId: ${APP_ID}
env:
    SCENE_ID: ${SCENE_ID || 'custom-categories-2'}
    IS_COMPOSED: ${IS_COMPOSED || 'false'}
    CATEGORY_NAME: ${CATEGORY_NAME || 'Groceries'}
---
# Settings -> Organization -> Categories -> open one category and expand the icon
# picker grid, which is the frame the custom-categories scene and the neutral
# icon-grid crop are taken from.
- runFlow:
      file: ../subflows/navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://settings/categories'

- extendedWaitUntil:
      visible:
          id: 'CategoryPage.SearchInput'
      timeout: 15000

- tapOn:
      id: 'CategoryPage.SearchInput'
- inputText: ${CATEGORY_NAME}
- pressKey: enter
- waitForAnimationToEnd

- extendedWaitUntil:
      visible:
          id: 'CategoryCard.${CATEGORY_NAME}'
      timeout: 10000
- tapOn:
      id: 'CategoryCard.${CATEGORY_NAME}'

- extendedWaitUntil:
      visible:
          id: 'CategoryForm.IconTrigger'
      timeout: 10000
- tapOn:
      id: 'CategoryForm.IconTrigger'

- extendedWaitUntil:
      visible:
          id: 'IconSelector.SearchInput'
      timeout: 10000

# Capture-mode switch. Run on its own as a still scene the flow ends in the single
# takeScreenshot mobile-ci requires per flow cell. Callers that compose it - the
# record wrappers and the continuation scene flows - pass IS_COMPOSED='true', so a
# composed cell still emits exactly one screenshot, and a recording emits none.
- runFlow:
      when:
          true: ${IS_COMPOSED != 'true'}
      commands:
          - takeScreenshot: ${SCENE_ID}

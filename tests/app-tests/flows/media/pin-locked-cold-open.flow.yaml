appId: ${APP_ID}
env:
    SCENE_ID: ${SCENE_ID || 'pin-app-lock-1'}
    IS_COMPOSED: ${IS_COMPOSED || 'false'}
    PIN_DIGIT_ONE: ${PIN_DIGIT_ONE || '1'}
    PIN_DIGIT_TWO: ${PIN_DIGIT_TWO || '2'}
    PIN_DIGIT_THREE: ${PIN_DIGIT_THREE || '3'}
    PIN_DIGIT_FOUR: ${PIN_DIGIT_FOUR || '4'}
---
# Lock screen on the cold open the capture runner already produces (it terminates
# and relaunches the app per cell), then the four keypad digits and the unlock.
#
# No launchApp here on purpose: the runner owns the cold start, the flow only
# drives the keypad.
- extendedWaitUntil:
      visible:
          id: 'PinPage.Container'
      timeout: 30000

- tapOn:
      id: 'PinPage.Digit.${PIN_DIGIT_ONE}'
- tapOn:
      id: 'PinPage.Digit.${PIN_DIGIT_TWO}'
- tapOn:
      id: 'PinPage.Digit.${PIN_DIGIT_THREE}'
- tapOn:
      id: 'PinPage.Digit.${PIN_DIGIT_FOUR}'

- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
      timeout: 15000

# Capture-mode switch. Run on its own as a still scene the flow ends in the single
# takeScreenshot mobile-ci requires per flow cell. Callers that compose it - the
# record wrappers and the continuation scene flows - pass IS_COMPOSED='true', so a
# composed cell still emits exactly one screenshot, and a recording emits none.
- runFlow:
      when:
          true: ${IS_COMPOSED != 'true'}
      commands:
          - takeScreenshot: ${SCENE_ID}

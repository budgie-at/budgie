appId: ${APP_ID}
---
- runFlow:
      file: ../../subflows/navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://'

- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
      timeout: 15000

- runFlow: ../../subflows/transactions/open-action-menu.flow.yaml

- tapOn:
      id: 'ActionItem.AiButton'

- extendedWaitUntil:
      visible:
          id: 'VoiceInputOverlay.RecordButton'
      timeout: 60000

- waitForAnimationToEnd

- takeScreenshot: scene

appId: ${APP_ID}
env:
    MERCHANT_TITLE: ${MERCHANT_TITLE || 'Whole Foods Market'}
---
# Expense form with a merchant title typed in, holding on the moment the on-device
# category / tag / comment suggestion pills render.
#
# FOLLOW-UP: the suggestion pills carry no stable testID, so the flow cannot accept
# one. Blocked on app-side selectors:
#   SuggestionPillSelector.{Row,Pill}
#       -> transaction/components/suggestion-pill, transaction/components/suggestion-row
- runFlow:
      file: ../subflows/navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://create-transaction/expense'

- extendedWaitUntil:
      visible:
          id: 'TransactionForm.Page'
      timeout: 15000

- tapOn:
      id: 'TransactionForm.CommentInput'
- inputText: ${MERCHANT_TITLE}
- pressKey: enter

- waitForAnimationToEnd

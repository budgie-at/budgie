appId: ${APP_ID}
---
- runFlow:
      file: ../subflows/navigation/open-deep-link.flow.yaml
      env:
          DEEP_LINK: 'budgie://'

- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
      timeout: 15000

- takeScreenshot: poster

- startRecording: clip

- runFlow: ../subflows/transactions/open-action-menu.flow.yaml

- waitForAnimationToEnd

- stopRecording

appId: ${APP_ID}
env:
    IS_COMPOSED: ${IS_COMPOSED || 'false'}
    SCENE_ID: ${SCENE_ID || 'convert-to-transfer-1'}
---
# The counter-account picker opened from the long-press menu, with the dual-amount
# row below it. Continues long-press-menu.flow.yaml, which holds on the menu itself.
- runFlow:
      file: long-press-menu.flow.yaml
      env:
          IS_COMPOSED: 'true'

- tapOn:
      id: 'TransactionContextMenu.ConvertToTransferButton'

- waitForAnimationToEnd

- extendedWaitUntil:
      visible:
          id: 'ConvertToTransfer.Page'
      timeout: 10000

# Continuation scene. mobile-ci collects exactly one takeScreenshot per flow cell, so
# the state this flow adds on top of long-press-menu.flow.yaml is its own
# scene rather than a second screenshot in that flow.
- runFlow:
      when:
          true: ${IS_COMPOSED != 'true'}
      commands:
          - takeScreenshot: ${SCENE_ID}

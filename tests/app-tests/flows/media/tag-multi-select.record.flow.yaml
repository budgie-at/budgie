appId: ${APP_ID}
env:
    LOCALE: ${LOCALE || 'en'}
    APPEARANCE: ${APPEARANCE || 'light'}
    CLIP_ID: 'tag-multi-select'
---
# clip: tag-multi-select | target length: 5s | poster scene: transaction-tags-1 | seed: tags-rich
# script: open a transaction -> tag selector -> three tags picked -> chips land on the card
- startRecording: '${CLIP_ID}-${LOCALE}-${APPEARANCE}'

- runFlow: tags-selector-open.flow.yaml

- waitForAnimationToEnd

- stopRecording

appId: ${APP_ID}
---
- runFlow:
      file: ../subflows/transactions/open-convert-to-refund-picker.flow.yaml
      env:
          TRANSACTION_ID: '2200'
          CANDIDATE_ROW_ID: 'ConvertToRefund.CandidateRow.157'

- tapOn:
      id: 'ConvertToRefund.CandidateRow.157'

- extendedWaitUntil:
      visible:
          id: 'ConvertToRefund.ConvertButton'
          enabled: true
      timeout: 5000

- waitForAnimationToEnd

- takeScreenshot: scene

appId: ${APP_ID}
env:
    LOCALE: ${LOCALE || 'en'}
    APPEARANCE: ${APPEARANCE || 'light'}
    CLIP_ID: 'resync-window'
---
# clip: resync-window | target length: 5s | poster scene: bank-resync-window-1 | seed: bank-sync-connected
# script: Account detail -> Re-sync -> the window picker -> the diff preview
- startRecording: '${CLIP_ID}-${LOCALE}-${APPEARANCE}'

- runFlow: resync-window-picker.flow.yaml

- waitForAnimationToEnd

- stopRecording

appId: ${APP_ID}
---

- runFlow:
    file: setup/setup-multi-currency-budget.flow.yaml

- openLink: 'budgie://budget'
- extendedWaitUntil:
    visible:
      id: 'BudgetWidget.EmptyState'
    timeout: 3000

- tapOn:
    id: 'BudgetWidget.EmptyState'
- extendedWaitUntil:
    visible: 'Create budget'
    timeout: 3000

- tapOn:
    id: 'BudgetSetup.OverallLimitInput'
- inputText: '200'
- tapOn:
    id: 'BudgetSetup.CategoryLimitsHeader'
- waitForAnimationToEnd
- tapOn:
    id: 'BudgetSetup.SaveButton'

- extendedWaitUntil:
    visible:
      id: 'BudgetWidget.Card'
    timeout: 3000
- assertVisible:
    id: 'BudgetWidget.SpentLabel'
    text: '136.21 / 200.00'

- tapOn:
    id: 'BudgetWidget.Card'
- extendedWaitUntil:
    visible:
      id: 'BudgetSetup.SpentLabel'
    timeout: 3000
- assertVisible:
    id: 'BudgetSetup.SpentLabel'
    text: '136.21 / 200.00'

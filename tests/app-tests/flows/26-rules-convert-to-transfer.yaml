steps:
  - launch: com.vitalyiegorov.budgie.e2e
  - tool: open-url
    args:
      url: budgie://settings?anchor=data
  - when:
      visible: &a1
        text: Not Now
    steps:
      - tap: *a1
  - await:
      idle: true
  - when:
      hidden:
        id: SettingsPage.Container
    steps:
      - tool: open-url
        args:
          url: budgie://settings
      - await:
          idle: true
      - await:
          visible:
            id: SettingsPage.Container
          timeout: 15000
  - await:
      visible:
        id: SettingsPage.Container
      timeout: 15000
  - echo: Optional scroll probe for {"id":"SettingsPage.ImportDatabaseCard"}
  - when:
      hidden:
        id: SettingsPage.ImportDatabaseCard
    steps:
      - scroll-to:
          target:
            id: SettingsPage.ImportDatabaseCard
          direction: down
      - await:
          idle: true
  - await:
      visible:
        id: SettingsPage.ImportDatabaseCard
      timeout: 5000
  - tap:
      id: SettingsPage.ImportDatabaseCard
  - await:
      idle: true
  - await:
      visible:
        text: Cancel
      timeout: 15000
  - when:
      visible:
        text: Apple Account Verification
    steps:
      - tap:
          text: Not Now
      - await:
          idle: true
  - when:
      visible:
        text: No Results for .*
    steps:
      - when:
          visible: &a2
            text: Clear text
        steps:
          - tap: *a2
      - await:
          idle: true
  - when:
      hidden:
        id: 25.db
    steps:
      - when:
          visible:
            id: E2EFixtures, Folder
        steps:
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          visible:
            text: budgie \(E2E\), Actions Menu
        steps:
          - await:
              visible:
                id: E2EFixtures, Folder
              timeout: 3000
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          hidden:
            text: E2EFixtures, Actions Menu
        steps:
          - when:
              hidden:
                text: budgie \(E2E\), Actions Menu
            steps:
              - when:
                  visible: &a3
                    id: BackButton
                steps:
                  - tap: *a3
              - when:
                  visible: &a4
                    id: BackButton
                steps:
                  - tap: *a4
              - when:
                  visible: &a5
                    id: BackButton
                steps:
                  - tap: *a5
              - when:
                  visible: &a6
                    text: Browse
                steps:
                  - tap: *a6
              - await:
                  idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - when:
                      visible:
                        text: On My iPhone
                    steps:
                      - tap:
                          text: On My iPhone
                      - await:
                          idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - scroll-to:
                      target:
                        text: budgie \(E2E\)
                      direction: down
              - await:
                  visible:
                    text: budgie \(E2E\)
                  timeout: 3000
              - tap:
                  text: budgie \(E2E\)
              - await:
                  idle: true
              - await:
                  visible:
                    id: E2EFixtures, Folder
                  timeout: 3000
              - tap:
                  id: E2EFixtures, Folder
              - await:
                  idle: true
  - echo: Optional scroll probe for {"id":"25.db"}
  - when:
      hidden:
        id: 25.db
    steps:
      - scroll-to:
          target:
            text: 25.db
          direction: down
  - await:
      idle: true
  - when:
      visible:
        id: 25.db
    steps:
      - tap:
          id: 25.db
  - when:
      hidden:
        id: 25.db
    steps:
      - when:
          visible: &a7
            text: 25.db
        steps:
          - tap: *a7
  - await:
      idle: true
  - when:
      visible:
        text: Continue
    steps:
      - tap:
          text: Continue
      - await:
          idle: true
      - when:
          visible:
            id: 25.db
        steps:
          - tap:
              id: 25.db
      - when:
          hidden:
            id: 25.db
        steps:
          - when:
              visible: &a8
                text: 25.db
            steps:
              - tap: *a8
      - await:
          idle: true
  - when:
      visible:
        text: Open
    steps:
      - tap:
          text: Open
  - await:
      visible:
        text: Importing a database will replace all current data.*
      timeout: 3000
  - tap:
      text: Import Database
  - await:
      idle: true
  - await:
      visible:
        id: TabBar.Home
      timeout: 30000
  - tap:
      id: TabBar.Home
  - await:
      visible:
        id: HomePage.TotalBalance
      timeout: 30000
  - echo: App process stop requested; the following launch performs a clean restart.
  - launch: com.vitalyiegorov.budgie.e2e
  - await:
      visible:
        id: TabBar.Home
      timeout: 30000
  - tool: open-url
    args:
      url: budgie://transactions
  - await:
      idle: true
  - await:
      visible:
        id: TransactionsPage.Container
      timeout: 10000
  - await:
      idle: true
  - echo: Native recovery attempt (migrated from retry, max 1)
  - when:
      hidden:
        id: ActionItem.Expense.Label
    steps:
      - tap:
          id: ActionButton
  - await:
      visible:
        id: ActionItem.Expense.Label
      timeout: 3000
  - await:
      idle: true
  - tap:
      id: ActionItem.Expense.Label
  - await:
      visible:
        text: New Expense
  - await:
      visible:
        id: TransactionKeypad.Digit.1
  - await:
      idle: true
  - when:
      hidden:
        text: Rules Test Account
    steps:
      - echo: Native recovery attempt (migrated from retry, max 3)
      - tap:
          id: TransactionForm.AccountSelector
      - await:
          visible:
            id: AccountPickerBottomSheet.Input
          timeout: 3000
      - tap:
          id: AccountPickerBottomSheet.Input
      - tool: keyboard
        args:
          text: Rules Test Account
      - tap:
          text: Done
      - await:
          idle: true
      - await:
          visible:
            id: AccountPickerBottomSheet.Option.Rules Test Account
      - tap:
          id: AccountPickerBottomSheet.Option.Rules Test Account
      - await:
          idle: true
      - await:
          hidden:
            id: AccountPickerBottomSheet.Input
      - await:
          idle: true
  - echo: Native recovery attempt (migrated from retry, max 3)
  - tap:
      id: TransactionForm.CategorySelector
  - await:
      visible:
        id: CategoryPickerBottomSheet.Input
      timeout: 3000
  - await:
      idle: true
  - await:
      visible:
        id: CategoryPickerBottomSheet.Input
  - tap:
      id: CategoryPickerBottomSheet.Input
  - await:
      idle: true
  - tool: keyboard
    args:
      text: Rules Test Category
  - tap:
      text: Done
  - await:
      visible:
        id: CategoryPickerBottomSheet.Card.Rules Test Category.Label
  - await:
      idle: true
  - tap:
      id: CategoryPickerBottomSheet.Card.Rules Test Category.Label
  - await:
      idle: true
  - await:
      hidden:
        id: CategoryPickerBottomSheet.Input
      timeout: 5000
  - scroll-to:
      target:
        id: TransactionForm.CommentInput
      direction: down
  - await:
      visible:
        id: TransactionForm.CommentInput
      timeout: 10000
  - tap:
      id: TransactionForm.CommentInput
  - await:
      visible:
        id: NoteInput.Input
      timeout: 5000
  - tap:
      id: NoteInput.Input
  - tool: keyboard
    args:
      text: Auto Transfer
  - tap:
      id: NoteInput.SubmitButton
  - await:
      hidden:
        id: NoteInput.Input
      timeout: 5000
  - await:
      idle: true
  - await:
      visible:
        id: TransactionKeypad.Digit.1
  - await:
      idle: true
  - echo: Native recovery attempt (migrated from retry, max 3)
  - long-press:
      id: TransactionKeypad.Backspace
  - tap:
      id: TransactionKeypad.Digit.1
  - tap:
      id: TransactionKeypad.Digit.0
  - await:
      visible:
        text: ^.* 10$
      timeout: 1000
  - tap:
      id: TransactionForm.SubmitButton
  - await:
      visible:
        id: TransactionsPage.Container
      timeout: 60000
  - tool: open-url
    args:
      url: budgie://settings/rules
  - await:
      idle: true
  - await:
      visible:
        id: RulesPage.Page
      timeout: 15000
  - tap:
      id: ActionButton
  - await:
      visible:
        id: RulesPage.CreateButton.Label
  - await:
      idle: true
  - tap:
      id: RulesPage.CreateButton.Label
  - await:
      visible:
        text: Create Rule
  - tap:
      id: RuleForm.Condition.0.FieldSelector.Value
  - tap:
      id: RuleForm.SelectorCard.COMMENT
  - await:
      idle: true
  - tap:
      id: RuleForm.Condition.0.ValueInput
  - tool: keyboard
    args:
      text: Auto Transfer
  - tap:
      text: Done
  - await:
      idle: true
  - tap:
      id: RuleForm.Action.0.TypeSelector
  - await:
      visible:
        id: RuleForm.SelectorCard.CONVERT_TO_TRANSFER
  - tap:
      id: RuleForm.SelectorCard.CONVERT_TO_TRANSFER
  - await:
      idle: true
  - scroll-to:
      target:
        id: RuleForm.Action.0.AccountSelector
      direction: down
  - tap:
      id: RuleForm.Action.0.AccountSelector
  - await:
      idle: true
  - await:
      visible:
        id: AccountPickerBottomSheet.Input
  - tap:
      id: AccountPickerBottomSheet.Input
  - tool: keyboard
    args:
      text: Test22 Destination
  - await:
      visible:
        id: AccountPickerBottomSheet.Option.Test22 Destination
  - tap:
      id: AccountPickerBottomSheet.Option.Test22 Destination
  - await:
      hidden:
        id: AccountPickerBottomSheet.Input
  - await:
      idle: true
  - tap:
      id: RuleForm.Footer.SubmitButton
  - await:
      visible:
        text: Apply to existing transactions?
      timeout: 10000
  - tap:
      text: Apply
  - await:
      idle: true
  - await:
      visible:
        id: RulesPage.Page
      timeout: 10000
  - await:
      visible:
        id: RulesPage.Page
  - assert:
      visible:
        id: RulesPage.RuleCard.0
  - assert:
      visible:
        id: RulesPage.RuleCardActions.0
  - assert:
      visible:
        id: RulesPage.RuleCard.0
        text: .*Transfer → Test22 Destination.*
  - tool: open-url
    args:
      url: budgie://transactions/9/transfer
  - await:
      idle: true
  - await:
      visible:
        id: TransactionInfo.Page
      timeout: 10000
  - assert:
      hidden:
        id: TransactionInfo.Row.Note
  - assert:
      visible:
        id: TransactionInfo.Row.FromAccount
  - assert:
      visible:
        id: TransactionInfo.Row.ToAccount
  - tap:
      id: TransactionInfo.EditButton.Label
  - await:
      visible:
        text: Edit Transfer
      timeout: 10000
  - assert:
      visible:
        text: "Note: Auto Transfer"
  - assert:
      visible:
        id: TransferForm.SelectedFromAccount.Rules Test Account
  - assert:
      visible:
        id: TransferForm.SelectedToAccount.Test22 Destination

appId: ${APP_ID}
---

- runFlow: subflows/relaunch-app.flow.yaml

- runFlow:
    file: subflows/import-database-fixture.flow.yaml
    env:
      FIXTURE_ID: '13-balance-verification'

- tapOn:
    id: 'TabBar.Home'
- extendedWaitUntil:
    visible:
      id: 'HomePage.TotalBalance'
- assertVisible:
    id: 'HomePage.TotalBalance'
- assertVisible:
    id: 'HomePage.NetWorthValue.100'
- assertVisible:
    id: 'AccountCard.Balance.E2E_Balance_Account.100'

# --- Create Expense of $42 ---

- runFlow: subflows/navigate-to-transactions.flow.yaml

- runFlow: subflows/open-action-menu.flow.yaml

- tapOn:
    id: 'ActionItem.Expense'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'New Expense'

- tapOn: '4'
- tapOn: '2'

- runFlow:
    file: subflows/select-account.flow.yaml
    env:
      ACCOUNT_NAME: 'E2E Balance Account'

- runFlow:
    file: subflows/select-category.flow.yaml
    env:
      CATEGORY_NAME: 'E2E Balance Category'

- runFlow:
    file: subflows/enter-comment.flow.yaml
    env:
      COMMENT: 'E2E Balance Expense'

- tapOn:
    id: 'TransactionForm.SubmitButton'

- extendedWaitUntil:
    visible: 'Transactions'

- extendedWaitUntil:
    visible:
      id: 'TransactionCard.Label.E2E_Balance_Expense'
    timeout: 15000

# --- Verify Balance Area After Expense ---

- tapOn:
    id: 'TabBar.Home'
- extendedWaitUntil:
    visible:
      id: 'HomePage.TotalBalance'

- assertVisible:
    id: 'HomePage.TotalBalance'
- assertVisible:
    id: 'HomePage.NetWorthValue.58'
- assertVisible:
    id: 'AccountCard.Balance.E2E_Balance_Account.58'

# --- Create Income of $100 ---

- runFlow: subflows/navigate-to-transactions.flow.yaml

- tapOn:
    id: 'ActionButton'
- extendedWaitUntil:
    visible:
      id: 'ActionItem.Income'
- waitForAnimationToEnd

- tapOn:
    id: 'ActionItem.Income'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'New Income'

- tapOn: '1'
- tapOn: '0'
- tapOn: '0'

- runFlow:
    file: subflows/select-account.flow.yaml
    env:
      ACCOUNT_NAME: 'E2E Balance Account'

- runFlow:
    file: subflows/select-category.flow.yaml
    env:
      CATEGORY_NAME: 'E2E Balance Category'

- runFlow:
    file: subflows/enter-comment.flow.yaml
    env:
      COMMENT: 'E2E Balance Income'

- tapOn:
    id: 'TransactionForm.SubmitButton'

- extendedWaitUntil:
    visible: 'Transactions'

- extendedWaitUntil:
    visible:
      id: 'TransactionCard.Label.E2E_Balance_Income'
    timeout: 15000

# --- Verify Balance Area After Income ---

- tapOn:
    id: 'TabBar.Home'
- extendedWaitUntil:
    visible:
      id: 'HomePage.TotalBalance'

- assertVisible:
    id: 'HomePage.TotalBalance'
- assertVisible:
    id: 'HomePage.NetWorthValue.158'
- assertVisible:
    id: 'AccountCard.Balance.E2E_Balance_Account.158'

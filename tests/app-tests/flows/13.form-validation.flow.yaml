appId: ${APP_ID}
---

- runFlow: subflows/enter-app.flow.yaml

# --- Setup: Create Account ---

- runFlow:
    file: subflows/create-account.flow.yaml
    env:
      ACCOUNT_NAME: 'E2E Validation Account'

- runFlow:
    file: subflows/create-category.flow.yaml
    env:
      CATEGORY_NAME: 'E2E Validation Category'

# --- Open Create Expense Form ---

- runFlow: subflows/navigate-to-transactions.flow.yaml

- runFlow: subflows/open-action-menu.flow.yaml

- tapOn:
    text: 'Expense'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'New Expense'

# --- Verify Submit Button Exists Without Amount ---

- assertVisible:
    id: 'TransactionForm.SubmitButton'

# --- Enter Amount and Fill Form ---

- tapOn: '4'
- tapOn: '2'

- runFlow:
    file: subflows/select-account.flow.yaml
    env:
      ACCOUNT_NAME: 'E2E Validation Account'

- runFlow:
    file: subflows/select-category.flow.yaml
    env:
      CATEGORY_NAME: 'E2E Validation Category'

# --- Submit Valid Form ---

- tapOn:
    id: 'TransactionForm.SubmitButton'

- extendedWaitUntil:
    visible: 'Transactions'

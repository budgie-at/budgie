appId: ${APP_ID}
---
- runFlow:
      file: subflows/import/import-database-from-settings.flow.yaml
      env:
          FIXTURE_ROW_ID_MATCH: '35-debt-migration-repair.db(, db)?'

- scrollUntilVisible:
      element:
          id: 'AccountCard.USD borrowed debt'
      direction: DOWN
      visibilityPercentage: 40
- waitForAnimationToEnd

- assertVisible:
      id: 'DebtAccountCardSummary.OutstandingAmount.USD_borrowed_debt.36934'
- assertVisible:
      id: 'DebtAccountCardSummary.PaidAmount.USD_borrowed_debt.8066'
- assertVisible:
      id: 'DebtAccountCardSummary.TotalAmount.USD_borrowed_debt.45000'

- runFlow:
      file: subflows/accounts/open-account-details.flow.yaml
      env:
          ACCOUNT_NAME: 'USD borrowed debt'

- assertVisible:
      id: 'DebtAccountBalance.OutstandingAmount.36934'
- assertVisible:
      id: 'DebtAccountBalance.PaidAmount.8066'
- assertVisible:
      id: 'DebtAccountBalance.TotalAmount.45000'
- assertVisible:
      id: 'DebtAccountBalance.Percentage.17_92'
- assertVisible: '7 transactions'

- scrollUntilVisible:
      element:
          id: 'TransactionCard.Label.USD_debt_repayment_7'
      direction: DOWN
- scrollUntilVisible:
      element:
          id: 'TransactionCard.Label.USD_debt_repayment_6'
      direction: DOWN
- scrollUntilVisible:
      element:
          id: 'TransactionCard.Label.USD_debt_repayment_5'
      direction: DOWN
- scrollUntilVisible:
      element:
          id: 'TransactionCard.Label.USD_debt_repayment_4'
      direction: DOWN
- scrollUntilVisible:
      element:
          id: 'TransactionCard.Label.USD_debt_repayment_3'
      direction: DOWN
- scrollUntilVisible:
      element:
          id: 'TransactionCard.Label.USD_debt_repayment_2'
      direction: DOWN
- scrollUntilVisible:
      element:
          id: 'TransactionCard.Label.USD_debt_repayment_1'
      direction: DOWN

- assertVisible:
      id: 'TransactionCard.Amount.1001'
      text: '(?s).*₴29,000.*→.*[$]684.*'
- assertVisible:
      id: 'TransactionCard.EntryCategoryAmount.Housing_Utilities.29000'
- assertVisible:
      id: 'TransactionCard.Label.USD_debt_repayment_1'
      text: '(?s).*Housing & Utilities.*₴29,000.*₴29,000.*→.*[$]684.*'
- assertNotVisible:
      id: 'TransactionCard.EntryCategoryAmount.Housing_Utilities.29000'
      index: 1
- assertNotVisible:
      id: 'TransactionCard.EntryCategoryAmount.Housing_Utilities.684'
- assertNotVisible: 'Housing & Utilities €29,000'
- assertNotVisible: 'Housing & Utilities €684'

- runFlow: subflows/accounts/exit-account-details-to-home.flow.yaml

- scrollUntilVisible:
      element:
          id: 'DebtAccountCardSummary.OutstandingAmount.USD_borrowed_debt.36934'
      direction: DOWN

appId: ${APP_ID}
---
- runFlow:
      file: subflows/import/import-database-from-settings.flow.yaml
      env:
          FIXTURE_ROW_ID_MATCH: '12.db(, db)?'

- extendedWaitUntil:
      visible:
          id: 'HomePage.TotalBalance'
      timeout: 10000

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- runFlow:
      file: subflows/transactions/open-transaction-form.flow.yaml
      env:
          ACTION_ITEM_ID: 'ActionItem.Expense'
          FORM_TITLE: 'New Expense'

- tapOn:
      id: 'TransactionKeypad.Digit.3'
- tapOn:
      id: 'TransactionKeypad.Digit.0'

- runFlow:
      file: subflows/transactions/select-account.flow.yaml
      env:
          ACCOUNT_NAME: 'E2E Expense Source'

- runFlow:
      file: subflows/categories/create-category-from-transaction.flow.yaml
      env:
          CATEGORY_NAME: 'E2E Installment Category'

- waitForAnimationToEnd
- scrollUntilVisible:
      element:
          id: 'TransactionForm.CommentInput'
      direction: DOWN
      centerElement: true

- runFlow:
      file: subflows/transactions/enter-comment.flow.yaml
      env:
          COMMENT: 'E2E Installment Expense'

- runFlow: subflows/transactions/submit-transaction-and-wait.flow.yaml

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.E2E_Installment_Expense'
      timeout: 5000

- tapOn:
      id: 'TransactionCard.Label.E2E_Installment_Expense'

- tapOn:
      id: 'TransactionActionsMenu.TriggerButton'
- extendedWaitUntil:
      visible:
          id: 'TransactionActionsMenu.ConvertToInstallmentButton'
- tapOn:
      id: 'TransactionActionsMenu.ConvertToInstallmentButton'

- extendedWaitUntil:
      visible:
          id: 'ConvertToInstallment.Page'
      timeout: 10000
- assertVisible:
      id: 'ConvertToInstallment.TotalButton'
      text: '.*90.*'
- assertVisible:
      id: 'ConvertToInstallment.PartsLabel'
      text: '3 × .*30.*'

- tapOn:
      id: 'ConvertToInstallment.CreateButton'

- extendedWaitUntil:
      visible:
          id: 'InstallmentPlanScheduleSummary.Progress.1_3'
      timeout: 10000

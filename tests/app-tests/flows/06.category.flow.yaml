appId: ${APP_ID}
---

- runFlow: subflows/enter-app.flow.yaml

- runFlow: subflows/navigate-to-settings.flow.yaml

- scrollUntilVisible:
    element:
      id: 'SettingsPage.ManageCategoriesCard'
    direction: DOWN
    speed: 20
    centerElement: true
- waitForAnimationToEnd
- assertVisible:
    id: 'SettingsPage.ManageCategoriesCard'
- tapOn:
    id: 'SettingsPage.ManageCategoriesCard'
- extendedWaitUntil:
    visible:
      id: 'CategoryPage.SearchInput'
    timeout: 10000

# --- Create Primary Category With Icon ---

- tapOn:
    id: 'ActionButton'
- waitForAnimationToEnd

- tapOn: 'Category'
- waitForAnimationToEnd

- tapOn:
    id: 'CategoryForm.IconTrigger'
- tapOn:
    id: 'IconSelector.SearchInput'
- inputText: 'bike'
- tapOn:
    id: 'IconSelector.Icon.Bike'

- tapOn:
    id: 'CategoryForm.Input'
- inputText: 'E2E Category Primary'
- tapOn: 'Create Category'
- tapOn:
    id: 'CategoryForm.Submit'

- assertVisible:
    id: 'CategoryCard.E2E Category Primary'
- assertVisible:
    id: 'CategoryCard.Icon.E2E Category Primary.Bike'

# --- Create Second Category For Search ---

- tapOn:
    id: 'ActionButton'
- waitForAnimationToEnd

- tapOn: 'Category'
- waitForAnimationToEnd

- tapOn:
    id: 'CategoryForm.IconTrigger'
- tapOn:
    id: 'IconSelector.SearchInput'
- inputText: 'home'
- tapOn:
    id: 'IconSelector.Icon.Home'

- tapOn:
    id: 'CategoryForm.Input'
- inputText: 'E2E Category Search'
- tapOn: 'Create Category'
- tapOn:
    id: 'CategoryForm.Submit'

- assertVisible:
    id: 'CategoryCard.E2E Category Search'
- assertVisible:
    id: 'CategoryCard.Icon.E2E Category Search.Home'

# --- Search And Open Result ---

- tapOn:
    id: 'CategoryPage.SearchInput'
- inputText: 'Search'

- assertVisible:
    id: 'CategoryCard.E2E Category Search'
- assertNotVisible:
    id: 'CategoryCard.E2E Category Primary'

- tapOn:
    id: 'CategoryCard.E2E Category Search'
- waitForAnimationToEnd

- assertVisible: 'E2E Category Search.*'
- tapOn:
    id: 'CategoryForm.Merge'
- tapOn:
    id: 'CategoryPickerBottomSheet.Input'
- inputText: 'Primary'
- extendedWaitUntil:
    visible:
      id: 'CategoryPickerBottomSheet.Card.E2E Category Primary'
    timeout: 10000
- tapOn:
    id: 'CategoryPickerBottomSheet.Card.E2E Category Primary'

- assertNotVisible:
    id: 'CategoryCard.E2E Category Search'

- tapOn:
    id: 'CategoryPage.SearchInput'
- eraseText: 50

- assertVisible:
    id: 'CategoryCard.E2E Category Primary'
- assertNotVisible:
    id: 'CategoryCard.E2E Category Search'

# --- Edit Primary Category Text + Icon ---

- tapOn:
    id: 'CategoryCard.E2E Category Primary'
- waitForAnimationToEnd

- tapOn:
    id: 'CategoryForm.IconTrigger'
- tapOn:
    id: 'IconSelector.SearchInput'
- inputText: 'heart'
- tapOn:
    id: 'IconSelector.Icon.Heart'

- tapOn:
    id: 'CategoryForm.Input'
- eraseText: 80
- inputText: 'E2E Category Updated'
- tapOn: 'Edit Category'
- tapOn:
    id: 'CategoryForm.Submit'

- assertVisible:
    id: 'CategoryCard.E2E Category Updated'
- assertVisible:
    id: 'CategoryCard.Icon.E2E Category Updated.Heart'
- assertNotVisible:
    id: 'CategoryCard.E2E Category Primary'

- swipe:
    from:
      id: 'CategoryCard.E2E Category Updated'
    direction: LEFT
- extendedWaitUntil:
    visible:
      id: 'DeletableRow.DeleteButton'
    timeout: 10000
- tapOn:
    id: 'DeletableRow.DeleteButton'
- tapOn: 'Delete'
- waitForAnimationToEnd

- assertNotVisible:
    id: 'CategoryCard.E2E Category Updated'

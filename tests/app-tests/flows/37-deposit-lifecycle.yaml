steps:
  - launch: com.vitalyiegorov.budgie.e2e
  - tool: open-url
    args:
      url: budgie://settings?anchor=data
  - tap:
      text: Not Now
  - await:
      idle: true
  - when:
      hidden:
        id: SettingsPage.Container
    steps:
      - tool: open-url
        args:
          url: budgie://settings
      - await:
          idle: true
      - await:
          visible:
            id: SettingsPage.Container
          timeout: 15000
  - await:
      visible:
        id: SettingsPage.Container
      timeout: 15000
  - scroll-to:
      target:
        id: SettingsPage.ImportDatabaseCard
      direction: up
  - when:
      hidden:
        id: SettingsPage.ImportDatabaseCard
    steps:
      - scroll-to:
          target:
            id: SettingsPage.ImportDatabaseCard
          direction: down
      - await:
          idle: true
  - await:
      visible:
        id: SettingsPage.ImportDatabaseCard
      timeout: 5000
  - tap:
      id: SettingsPage.ImportDatabaseCard
  - await:
      idle: true
  - await:
      visible:
        text: Cancel
      timeout: 15000
  - when:
      visible:
        text: Apple Account Verification
    steps:
      - tap:
          text: Not Now
      - await:
          idle: true
  - when:
      visible:
        text: No Results for .*
    steps:
      - tap:
          text: Clear text
      - await:
          idle: true
  - when:
      hidden:
        id: 12.db(, db)?
    steps:
      - when:
          visible:
            id: E2EFixtures, Folder
        steps:
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          visible:
            text: budgie \(E2E\), Actions Menu
        steps:
          - await:
              visible:
                id: E2EFixtures, Folder
              timeout: 3000
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          hidden:
            text: E2EFixtures, Actions Menu
        steps:
          - when:
              hidden:
                text: budgie \(E2E\), Actions Menu
            steps:
              - tap:
                  id: BackButton
              - tap:
                  id: BackButton
              - tap:
                  id: BackButton
              - tap:
                  text: Browse
              - await:
                  idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - when:
                      visible:
                        text: On My iPhone
                    steps:
                      - tap:
                          text: On My iPhone
                      - await:
                          idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - scroll-to:
                      target:
                        text: budgie \(E2E\)
                      direction: down
              - await:
                  visible:
                    text: budgie \(E2E\)
                  timeout: 3000
              - tap:
                  text: budgie \(E2E\)
              - await:
                  idle: true
              - await:
                  visible:
                    id: E2EFixtures, Folder
                  timeout: 3000
              - tap:
                  id: E2EFixtures, Folder
              - await:
                  idle: true
  - scroll-to:
      target:
        id: 12.db(, db)?
      direction: down
  - when:
      hidden:
        id: 12.db(, db)?
    steps:
      - scroll-to:
          target:
            text: 12.db(, db)?
          direction: down
  - await:
      idle: true
  - when:
      visible:
        id: 12.db(, db)?
    steps:
      - tap:
          id: 12.db(, db)?
  - when:
      hidden:
        id: 12.db(, db)?
    steps:
      - tap:
          text: 12.db(, db)?
  - await:
      idle: true
  - when:
      visible:
        text: Continue
    steps:
      - tap:
          text: Continue
      - await:
          idle: true
      - when:
          visible:
            id: 12.db(, db)?
        steps:
          - tap:
              id: 12.db(, db)?
      - when:
          hidden:
            id: 12.db(, db)?
        steps:
          - tap:
              text: 12.db(, db)?
      - await:
          idle: true
  - when:
      visible:
        text: Open
    steps:
      - tap:
          text: Open
  - await:
      visible:
        text: Importing a database will replace all current data.*
      timeout: 3000
  - tap:
      text: Import Database
  - await:
      idle: true
  - await:
      visible:
        id: TabBar.Home
      timeout: 30000
  - tap:
      id: TabBar.Home
  - await:
      visible:
        id: HomePage.TotalBalance
      timeout: 30000
  - tap:
      id: TabBar.Home
  - await:
      idle: true
  - when:
      visible:
        text: No accounts yet
    steps:
      - tap:
          id: AccountsEmptyState.AddAccountButton
      - await:
          visible:
            id: CreateAccount.BANK
          timeout: 10000
  - when:
      hidden:
        id: CreateAccount.BANK
    steps:
      - when:
          visible:
            id: ActionButton
        steps:
          - tap:
              id: ActionButton
      - when:
          hidden:
            id: ActionButton
        steps:
          - await:
              visible:
                id: ActionButton
              timeout: 10000
          - tap:
              id: ActionButton
      - await:
          idle: true
      - await:
          visible:
            id: ActionItem.AddAccount.Label
          timeout: 10000
      - tap:
          id: ActionItem.AddAccount.Label
      - await:
          idle: true
  - await:
      visible:
        id: CreateAccount.BANK
      timeout: 10000
  - tap:
      id: CreateAccount.DEPOSIT
  - await:
      idle: true
  - await:
      visible:
        id: AccountForm.NameInput
      timeout: 3000
  - tap:
      id: CreateAccount.Amount

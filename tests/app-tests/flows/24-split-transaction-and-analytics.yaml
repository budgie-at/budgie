        id: CategoryPickerBottomSheet.Input
  - tap:
      id: SplitEntries.ConfirmButton
  - tap:
      id: TransactionForm.SubmitButton
  - await:
      idle: true
  - when:
      visible:
        id: TransactionInfo.Page
    steps:
      - tap:
          id: PageHeader.BackButton
      - await:
          idle: true
  - await:
      visible:
        id: TransactionsPage.Container
      timeout: 15000
  - await:
      visible:
        id: TransactionCard.Label.E2E_Split_Expense
      timeout: 5000
  - assert:
      visible:
        id: TransactionCard.EntryCategoryAmount.Groceries.20
  - assert:
      visible:
        id: TransactionCard.EntryCategoryAmount.Restaurants_Cafes.25
  - tap:
      id: TabBar.Home
  - await:

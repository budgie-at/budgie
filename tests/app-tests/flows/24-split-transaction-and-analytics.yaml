steps:
  - launch: com.vitalyiegorov.budgie.e2e
  - tool: open-url
    args:
      url: budgie://settings?anchor=data
  - when:
      visible: &a1
        text: Not Now
    steps:
      - tap: *a1
  - await:
      idle: true
  - when:
      hidden:
        id: SettingsPage.Container
    steps:
      - tool: open-url
        args:
          url: budgie://settings
      - await:
          idle: true
      - await:
          visible:
            id: SettingsPage.Container
          timeout: 15000
  - await:
      visible:
        id: SettingsPage.Container
      timeout: 15000
  - echo: Optional scroll probe for {"id":"SettingsPage.ImportDatabaseCard"}
  - when:
      hidden:
        id: SettingsPage.ImportDatabaseCard
    steps:
      - scroll-to:
          target:
            id: SettingsPage.ImportDatabaseCard
          direction: down
      - await:
          idle: true
  - await:
      visible:
        id: SettingsPage.ImportDatabaseCard
      timeout: 5000
  - tap:
      id: SettingsPage.ImportDatabaseCard
  - await:
      idle: true
  - await:
      visible:
        text: Cancel
      timeout: 15000
  - when:
      visible:
        text: Apple Account Verification
    steps:
      - tap:
          text: Not Now
      - await:
          idle: true
  - when:
      visible:
        text: No Results for .*
    steps:
      - when:
          visible: &a2
            text: Clear text
        steps:
          - tap: *a2
      - await:
          idle: true
  - when:
      hidden:
        id: 08.db
    steps:
      - when:
          visible:
            id: E2EFixtures, Folder
        steps:
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          visible:
            text: budgie \(E2E\), Actions Menu
        steps:
          - await:
              visible:
                id: E2EFixtures, Folder
              timeout: 3000
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          hidden:
            text: E2EFixtures, Actions Menu
        steps:
          - when:
              hidden:
                text: budgie \(E2E\), Actions Menu
            steps:
              - when:
                  visible: &a3
                    id: BackButton
                steps:
                  - tap: *a3
              - when:
                  visible: &a4
                    id: BackButton
                steps:
                  - tap: *a4
              - when:
                  visible: &a5
                    id: BackButton
                steps:
                  - tap: *a5
              - when:
                  visible: &a6
                    text: Browse
                steps:
                  - tap: *a6
              - await:
                  idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - when:
                      visible:
                        text: On My iPhone
                    steps:
                      - tap:
                          text: On My iPhone
                      - await:
                          idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - scroll-to:
                      target:
                        text: budgie \(E2E\)
                      direction: down
              - await:
                  visible:
                    text: budgie \(E2E\)
                  timeout: 3000
              - tap:
                  text: budgie \(E2E\)
              - await:
                  idle: true
              - await:
                  visible:
                    id: E2EFixtures, Folder
                  timeout: 3000
              - tap:
                  id: E2EFixtures, Folder
              - await:
                  idle: true
  - echo: Optional scroll probe for {"id":"08.db"}
  - when:
      hidden:
        id: 08.db
    steps:
      - scroll-to:
          target:
            text: 08.db
          direction: down
  - await:
      idle: true
  - when:
      visible:
        id: 08.db
    steps:
      - tap:
          id: 08.db
  - when:
      hidden:
        id: 08.db
    steps:
      - when:
          visible: &a7
            text: 08.db
        steps:
          - tap: *a7
  - await:
      idle: true
  - when:
      visible:
        text: Continue
    steps:
      - tap:
          text: Continue
      - await:
          idle: true
      - when:
          visible:
            id: 08.db
        steps:
          - tap:
              id: 08.db
      - when:
          hidden:
            id: 08.db
        steps:
          - when:
              visible: &a8
                text: 08.db
            steps:
              - tap: *a8
      - await:
          idle: true
  - when:
      visible:
        text: Open
    steps:
      - tap:
          text: Open
  - await:
      visible:
        text: Importing a database will replace all current data.*
      timeout: 3000
  - tap:
      text: Import Database
  - await:
      idle: true
  - await:
      visible:
        id: TabBar.Home
      timeout: 30000
  - tap:
      id: TabBar.Home
  - await:
      visible:
        id: HomePage.TotalBalance
      timeout: 30000
  - tool: open-url
    args:
      url: budgie://transactions
  - await:
      idle: true
  - await:
      visible:
        id: TransactionsPage.Container
      timeout: 10000
  - await:
      idle: true
  - echo: Native recovery attempt (migrated from retry, max 1)
  - when:
      hidden:
        id: ActionItem.Expense.Label
    steps:
      - tap:
          id: ActionButton
  - await:
      visible:
        id: ActionItem.Expense.Label
      timeout: 3000
  - await:
      idle: true
  - tap:
      id: ActionItem.Expense.Label
  - await:
      visible:
        text: New Expense
  - await:
      visible:
        id: TransactionKeypad.Digit.1
  - await:
      idle: true
  - tap:
      id: TransactionKeypad.Digit.4
  - tap:
      id: TransactionKeypad.Digit.5
  - when:
      hidden:
        text: E2E Txn Account
    steps:
      - echo: Native recovery attempt (migrated from retry, max 3)
      - tap:
          id: TransactionForm.AccountSelector
      - await:
          visible:
            id: AccountPickerBottomSheet.Input
          timeout: 3000
      - tap:
          id: AccountPickerBottomSheet.Input
      - tool: keyboard
        args:
          text: E2E Txn Account
      - tap:
          text: Done
      - await:
          idle: true
      - await:
          visible:
            id: AccountPickerBottomSheet.Option.E2E Txn Account
      - tap:
          id: AccountPickerBottomSheet.Option.E2E Txn Account
      - await:
          idle: true
      - await:
          hidden:
            id: AccountPickerBottomSheet.Input
      - await:
          idle: true
  - await:
      visible:
        id: TransactionForm.CommentInput
      timeout: 10000
  - tap:
      id: TransactionForm.CommentInput
  - await:
      visible:
        id: NoteInput.Input
      timeout: 5000
  - tap:
      id: NoteInput.Input
  - tool: keyboard
    args:
      text: E2E Split Expense
  - tap:
      id: NoteInput.SubmitButton
  - await:
      hidden:
        id: NoteInput.Input
      timeout: 5000
  - await:
      idle: true
  - tap:
      id: TransactionFieldIcon.Split
  - await:
      visible:
        id: SplitEntryRow.Amount.0
  - tap:
      id: SplitEntryRow.Amount.0
  - tool: keyboard
    args:
      text: "20"
  - tap:
      id: SplitEntryRow.Category.0
  - await:
      visible:
        id: CategoryPickerBottomSheet.Input
  - tap:
      id: CategoryPickerBottomSheet.Input
  - tool: keyboard
    args:
      text: Groceries
  - tap:
      text: Done
  - await:
      idle: true
  - await:
      visible:
        id: CategoryPickerBottomSheet.Card.Groceries.Label
      timeout: 15000
  - tap:
      id: CategoryPickerBottomSheet.Card.Groceries.Label
  - await:
      hidden:
        id: CategoryPickerBottomSheet.Input
  - tap:
      id: SplitEntries.AddItemButton
  - await:
      visible:
        id: SplitEntryRow.Amount.1
  - tap:
      id: SplitEntryRow.Amount.1
  - tool: keyboard
    args:
      text: "25"
  - tap:
      id: SplitEntryRow.Category.1
  - await:
      visible:
        id: CategoryPickerBottomSheet.Input
  - tap:
      id: CategoryPickerBottomSheet.Input
  - tool: keyboard
    args:
      text: Restaurants & Cafes
  - tap:
      text: Done
  - await:
      idle: true
  - await:
      visible:
        id: CategoryPickerBottomSheet.Card.Restaurants & Cafes.Label
      timeout: 15000
  - tap:

steps:
  - launch: com.vitalyiegorov.budgie.e2e
  - tool: open-url
    args:
      url: budgie://settings?anchor=data
  - tap:
      text: Not Now
  - await:
      idle: true
  - when:
      hidden:
        id: SettingsPage.Container
    steps:
      - tool: open-url
        args:
          url: budgie://settings
      - await:
          idle: true
      - await:
          visible:
            id: SettingsPage.Container
          timeout: 15000
  - await:
      visible:
        id: SettingsPage.Container
      timeout: 15000
  - scroll-to:
      target:
        id: SettingsPage.ImportDatabaseCard
      direction: up
  - when:
      hidden:
        id: SettingsPage.ImportDatabaseCard
    steps:
      - scroll-to:
          target:
            id: SettingsPage.ImportDatabaseCard
          direction: down
      - await:
          idle: true
  - await:
      visible:
        id: SettingsPage.ImportDatabaseCard
      timeout: 5000
  - tap:
      id: SettingsPage.ImportDatabaseCard
  - await:
      idle: true
  - await:
      visible:
        text: Cancel
      timeout: 15000
  - when:
      visible:
        text: Apple Account Verification
    steps:
      - tap:
          text: Not Now
      - await:
          idle: true
  - when:
      visible:
        text: No Results for .*
    steps:
      - tap:
          text: Clear text
      - await:
          idle: true
  - when:
      hidden:
        id: 31-transaction-info.db
    steps:
      - when:
          visible:
            id: E2EFixtures, Folder
        steps:
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          visible:
            text: budgie \(E2E\), Actions Menu
        steps:
          - await:
              visible:
                id: E2EFixtures, Folder
              timeout: 3000
          - tap:
              id: E2EFixtures, Folder
          - await:
              idle: true
      - when:
          hidden:
            text: E2EFixtures, Actions Menu
        steps:
          - when:
              hidden:
                text: budgie \(E2E\), Actions Menu
            steps:
              - tap:
                  id: BackButton
              - tap:
                  id: BackButton
              - tap:
                  id: BackButton
              - tap:
                  text: Browse
              - await:
                  idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - when:
                      visible:
                        text: On My iPhone
                    steps:
                      - tap:
                          text: On My iPhone
                      - await:
                          idle: true
              - when:
                  hidden:
                    text: budgie \(E2E\)
                steps:
                  - scroll-to:
                      target:
                        text: budgie \(E2E\)
                      direction: down
              - await:
                  visible:
                    text: budgie \(E2E\)
                  timeout: 3000
              - tap:
                  text: budgie \(E2E\)
              - await:
                  idle: true
              - await:
                  visible:
                    id: E2EFixtures, Folder
                  timeout: 3000
              - tap:
                  id: E2EFixtures, Folder
              - await:
                  idle: true
  - scroll-to:
      target:
        id: 31-transaction-info.db
      direction: down
  - when:
      hidden:
        id: 31-transaction-info.db
    steps:
      - scroll-to:
          target:
            text: 31-transaction-info.db
          direction: down
  - await:
      idle: true
  - when:
      visible:
        id: 31-transaction-info.db
    steps:
      - tap:
          id: 31-transaction-info.db
  - when:
      hidden:
        id: 31-transaction-info.db
    steps:
      - tap:
          text: 31-transaction-info.db
  - await:
      idle: true
  - when:
      visible:
        text: Continue
    steps:
      - tap:
          text: Continue
      - await:
          idle: true
      - when:
          visible:
            id: 31-transaction-info.db
        steps:
          - tap:
              id: 31-transaction-info.db
      - when:
          hidden:
            id: 31-transaction-info.db
        steps:
          - tap:
              text: 31-transaction-info.db
      - await:
          idle: true
  - when:
      visible:
        text: Open
    steps:
      - tap:
          text: Open
  - await:
      visible:
        text: Importing a database will replace all current data.*
      timeout: 3000
  - tap:
      text: Import Database
  - await:
      idle: true
  - await:
      visible:
        id: TabBar.Home
      timeout: 30000
  - tap:
      id: TabBar.Home
  - await:
      visible:
        id: HomePage.TotalBalance
      timeout: 30000
  - tool: open-url
    args:
      url: budgie://transactions
  - await:
      idle: true
  - await:
      visible:
        id: TransactionsPage.Container
      timeout: 10000
  - tap:
      id: TransactionCard.Label.E2E_Similar_Expense
  - await:
      visible:
        id: TransactionInfo.Page
      timeout: 5000
  - assert:
      visible:
        id: TransactionInfo.Row.Account
  - assert:
      visible:
        id: TransactionInfo.Row.Category
  - assert:
      visible:
        id: TransactionInfo.Row.Tags
  - assert:
      hidden:
        id: TransactionInfo.Row.Source
  - assert:
      hidden:
        id: TransactionInfo.SimilarCard
  - tap:
      id: PageHeader.BackButton
  - tool: open-url
    args:
      url: budgie://transactions
  - await:
      idle: true
  - await:
      visible:
        id: TransactionsPage.Container
      timeout: 10000
  - await:
      idle: true
  - echo: Native recovery attempt (migrated from retry, max 1)
  - when:
      hidden:
        id: ActionItem.Expense.Label
    steps:
      - tap:
          id: ActionButton
  - await:
      visible:
        id: ActionItem.Expense.Label
      timeout: 3000
  - await:
      idle: true
  - tap:
      id: ActionItem.Expense.Label
  - await:
      visible:
        text: New Expense
  - await:
      visible:
        id: TransactionKeypad.Digit.1
  - await:
      idle: true
  - when:
      hidden:
        text: E2E Txn Account
    steps:
      - echo: Native recovery attempt (migrated from retry, max 3)
      - tap:
          id: TransactionForm.AccountSelector
      - await:
          visible:
            id: AccountPickerBottomSheet.Input
          timeout: 3000
      - tap:
          id: AccountPickerBottomSheet.Input
      - tool: keyboard
        args:
          text: E2E Txn Account
      - tap:
          text: Done
      - await:
          idle: true
      - await:
          visible:
            id: AccountPickerBottomSheet.Option.E2E Txn Account
      - tap:
          id: AccountPickerBottomSheet.Option.E2E Txn Account
      - await:
          idle: true
      - await:
          hidden:
            id: AccountPickerBottomSheet.Input
      - await:
          idle: true
  - echo: Native recovery attempt (migrated from retry, max 3)
  - tap:
      id: TransactionForm.CategorySelector
  - await:
      visible:
        id: CategoryPickerBottomSheet.Input
      timeout: 3000
  - await:
      idle: true
  - await:
      visible:
        id: CategoryPickerBottomSheet.Input
  - tap:
      id: CategoryPickerBottomSheet.Input
  - await:
      idle: true
  - tool: keyboard
    args:
      text: E2E Info Category
  - tap:
      text: Done
  - await:
      visible:
        id: CategoryPickerBottomSheet.Card.E2E Info Category.Label
  - await:
      idle: true
  - tap:
      id: CategoryPickerBottomSheet.Card.E2E Info Category.Label
  - await:
      idle: true
  - await:
      hidden:
        id: CategoryPickerBottomSheet.Input
      timeout: 5000
  - scroll-to:
      target:
        id: TransactionForm.CommentInput
      direction: down
  - await:
      visible:
        id: TransactionForm.CommentInput
      timeout: 10000
  - tap:
      id: TransactionForm.CommentInput
  - await:
      visible:
        id: NoteInput.Input
      timeout: 5000
  - tap:
      id: NoteInput.Input
  - tool: keyboard
    args:
      text: E2E Similar Expense
  - tap:
      id: NoteInput.SubmitButton
  - await:
      hidden:
        id: NoteInput.Input
      timeout: 5000
  - await:
      idle: true
  - await:
      visible:
        id: TransactionKeypad.Digit.1
  - await:
      idle: true
  - echo: Native recovery attempt (migrated from retry, max 3)
  - long-press:
      id: TransactionKeypad.Backspace
  - tap:
      id: TransactionKeypad.Digit.1
  - tap:
      id: TransactionKeypad.Digit.0
  - await:
      visible:
        text: ^.* 10$
      timeout: 1000
  - tap:
      id: TransactionForm.SubmitButton
  - await:
      visible:
        id: TransactionsPage.Container
      timeout: 60000
  - tap:
      id: TransactionCard.Label.E2E_Similar_Expense
  - await:
      visible:
        text: Similar transactions
      timeout: 10000
  - assert:
      visible:
        text: 2 similar transactions
  - assert:
      visible:
        text: Total
  - assert:
      visible:
        text: $20
  - assert:
      visible:
        text: Average
  - assert:
      visible:
        text: $10
  - scroll-to:
      target:
        id: TransactionInfo.SimilarBar.5
      direction: down
  - assert:
      visible:
        id: TransactionInfo.SimilarBar.0
  - assert:
      visible:
        id: TransactionInfo.SimilarBar.1
  - assert:
      visible:
        id: TransactionInfo.SimilarBar.2
  - assert:
      visible:
        id: TransactionInfo.SimilarBar.3
  - assert:
      visible:
        id: TransactionInfo.SimilarBar.4
  - assert:
      visible:
        id: TransactionInfo.SimilarBar.5
  - assert:
      hidden:
        id: TransactionInfo.Row.Source

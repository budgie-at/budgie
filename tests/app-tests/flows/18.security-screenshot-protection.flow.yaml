appId: ${APP_ID}
---
- runFlow:
    file: subflows/import/import-database-from-settings.flow.yaml
    env:
      FIXTURE_ROW_ID_MATCH: '18.db(, db)?'

- runFlow: subflows/navigation/navigate-to-settings.flow.yaml

- scrollUntilVisible:
    element:
      id: 'SettingsPage.ScreenshotProtectionCard'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'SettingsPage.ScreenshotProtectionSwitch'

- tapOn:
    id: 'TabBar.Home'
- extendedWaitUntil:
    visible:
      id: 'HomePage.TotalBalance'
    timeout: 10000

- runFlow:
    file: subflows/navigation/relaunch-app-and-wait.flow.yaml
    env:
      DESTINATION_ID: 'HomePage.TotalBalance'

- runFlow: subflows/navigation/navigate-to-settings.flow.yaml

- scrollUntilVisible:
    element:
      id: 'SettingsPage.ScreenshotProtectionSwitch'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- assertVisible:
    id: 'SettingsPage.ScreenshotProtectionSwitch'

- tapOn:
    id: 'TabBar.Home'
- extendedWaitUntil:
    visible:
      id: 'HomePage.TotalBalance'
    timeout: 10000

- runFlow:
    file: subflows/navigation/relaunch-app-and-wait.flow.yaml
    env:
      DESTINATION_ID: 'HomePage.TotalBalance'

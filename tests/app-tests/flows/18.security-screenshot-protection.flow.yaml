appId: ${APP_ID}
---
- runFlow:
    file: subflows/import/import-database-from-settings.flow.yaml
    env:
      FIXTURE_ROW_ID_MATCH: '18.db'

- runFlow:
    file: subflows/navigation/open-deep-link.flow.yaml
    env:
      DEEP_LINK: 'budgie://settings?anchor=security'

- extendedWaitUntil:
    visible:
      id: 'SettingsPage.Container'
    timeout: 15000

- scrollUntilVisible:
    element:
      id: 'SettingsPage.ScreenshotProtectionCard'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'SettingsPage.ScreenshotProtectionSwitch'

- tapOn:
    id: 'TabBar.Home'
- extendedWaitUntil:
    visible:
      id: 'HomePage.TotalBalance'
    timeout: 10000

- runFlow:
    file: subflows/navigation/open-deep-link.flow.yaml
    env:
      DEEP_LINK: 'budgie://settings?anchor=security'

- extendedWaitUntil:
    visible:
      id: 'SettingsPage.Container'
    timeout: 15000

- scrollUntilVisible:
    element:
      id: 'SettingsPage.ScreenshotProtectionSwitch'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- assertVisible:
    id: 'SettingsPage.ScreenshotProtectionSwitch'

- tapOn:
    id: 'TabBar.Home'
- extendedWaitUntil:
    visible:
      id: 'HomePage.TotalBalance'
    timeout: 10000

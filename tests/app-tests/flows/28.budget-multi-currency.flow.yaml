appId: ${APP_ID}
---

# Fixture: two accounts (E2E Txn Account = USD, E2E Foreign Account = EUR),
# exchange_rates has USD→EUR = 0.863, one 100 USD expense + one 50 EUR expense,
# settings.default_instrument_id = 2 (EUR), no pre-existing budget.
# Test creates a budget with overall limit 200 EUR via UI, then verifies FX math.
# FX math: 100 USD × 0.863 = 86.30 EUR + 50 EUR = 136.30 EUR spent.

- runFlow:
    file: setup/setup-multi-currency-budget.flow.yaml

# --- Create budget via UI: overall limit 200 EUR ---

- openLink: 'budgie://budget'
- extendedWaitUntil:
    visible:
      id: 'BudgetWidget.EmptyState'
    timeout: 3000

- tapOn:
    id: 'BudgetWidget.EmptyState'
- extendedWaitUntil:
    visible: 'Create budget'
    timeout: 3000

- tapOn:
    id: 'BudgetSetup.OverallLimitInput'
- inputText: '200'
- tapOn: 'Use last day of month'
- waitForAnimationToEnd
- tapOn:
    id: 'BudgetSetup.SaveButton'

# --- AC-8: Widget reflects FX-converted spent total ---

- extendedWaitUntil:
    visible:
      id: 'BudgetWidget.Card'
    timeout: 3000
- assertVisible:
    id: 'BudgetWidget.SpentLabel'
    text: '136.21 / 200.00'

# --- Detail screen renders the same converted total ---

- tapOn:
    id: 'BudgetWidget.Card'
- extendedWaitUntil:
    visible:
      id: 'BudgetDetail.SpentLabel'
    timeout: 3000
- assertVisible:
    id: 'BudgetDetail.SpentLabel'
    text: '136.21 / 200.00'

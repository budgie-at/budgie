appId: ${APP_ID}
---

- runFlow: subflows/relaunch-app.flow.yaml

- runFlow:
    file: subflows/import-database-fixture.flow.yaml
    env:
      FIXTURE_ID: '19-transactions-filters'

- runFlow: subflows/navigate-to-transactions.flow.yaml

- assertVisible:
    id: 'TransactionCard.Label.E2E_Filter_Expense'
- assertVisible:
    id: 'TransactionCard.Label.E2E_Filter_Income'
- assertVisible:
    id: 'TransactionCard.Label.E2E_Filter_Transfer'

- tapOn:
    id: 'TransactionFilters.TypeChip'
- tapOn:
    id: 'TransactionFilters.TypeOption.EXPENSE'
- tapOn:
    id: 'TransactionFilters.TypeApplyButton'

- assertVisible:
    id: 'TransactionCard.Label.E2E_Filter_Expense'
- assertNotVisible:
    id: 'TransactionCard.Label.E2E_Filter_Income'
- assertNotVisible:
    id: 'TransactionCard.Label.E2E_Filter_Transfer'

- tapOn:
    id: 'TransactionFilters.TypeChip'
- tapOn:
    id: 'TransactionFilters.TypeOption.EXPENSE'
- tapOn:
    id: 'TransactionFilters.TypeApplyButton'

- runFlow:
    file: subflows/apply-category-filter.flow.yaml
    env:
      CATEGORY_NAME: 'E2E Filter Income Category'

- assertVisible:
    id: 'TransactionCard.Label.E2E_Filter_Income'
- assertNotVisible:
    id: 'TransactionCard.Label.E2E_Filter_Expense'
- assertNotVisible:
    id: 'TransactionCard.Label.E2E_Filter_Transfer'

- runFlow:
    file: subflows/apply-category-filter.flow.yaml
    env:
      CATEGORY_NAME: 'E2E Filter Income Category'

- scrollUntilVisible:
    element:
      id: 'TransactionFilters.TagChip'
    direction: RIGHT
    speed: 20
- tapOn:
    id: 'TransactionFilters.TagChip'
- extendedWaitUntil:
    visible:
      id: 'TransactionFilters.TagSearchInput'
    timeout: 5000
- tapOn:
    id: 'TransactionFilters.TagSearchInput'
- inputText: 'Expense Tag'
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: 'TransactionFilters.TagOption.E2E Filter Expense Tag'
    timeout: 5000
- tapOn:
    id: 'TransactionFilters.TagOption.E2E Filter Expense Tag'
- tapOn:
    id: 'TransactionFilters.TagApplyButton'

- assertVisible:
    id: 'TransactionCard.Label.E2E_Filter_Expense'
- assertNotVisible:
    id: 'TransactionCard.Label.E2E_Filter_Income'
- assertNotVisible:
    id: 'TransactionCard.Label.E2E_Filter_Transfer'

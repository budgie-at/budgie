appId: ${APP_ID}
---

- runFlow:
    file: subflows/import/import-database-from-settings.flow.yaml
    env:
      FIXTURE_ROW_ID_MATCH: '02.db(, db)?'

- runFlow:
    file: subflows/accounts/create-liability-account.flow.yaml
    env:
      ACCOUNT_TYPE_ID: 'CreateAccount.CASH'
      ACCOUNT_SCREEN_TITLE: 'Savings Account'
      ACCOUNT_NAME: 'E2E Savings Account'
      CURRENCY_CODE: 'CAD'
      ACCOUNT_AMOUNT: '250'

- runFlow:
    file: subflows/accounts/open-account-details.flow.yaml
    env:
      ACCOUNT_NAME: 'E2E Savings Account'

- extendedWaitUntil:
    visible:
      id: 'TransactionCard.Badge.Adjustment'
    timeout: 10000

- assertVisible:
    id: 'TransactionCard.AdjustmentAmount.250'

- runFlow: subflows/accounts/exit-account-details-to-home.flow.yaml

- assertVisible:
    id: 'AccountCard.E2E Savings Account'

appId: ${APP_ID}
---

- runFlow: subflows/enter-app.flow.yaml

- runFlow: subflows/navigate-to-settings.flow.yaml

- scrollUntilVisible:
    element:
      id: 'SettingsPage.ManageTagsCard'
    direction: DOWN
    speed: 20
    centerElement: true
- waitForAnimationToEnd
- assertVisible:
    id: 'SettingsPage.ManageTagsCard'
- tapOn:
    id: 'SettingsPage.ManageTagsCard'
- extendedWaitUntil:
    visible:
      id: 'TagPage.SearchInput'
    timeout: 10000

# --- Create Primary Tag ---

- tapOn:
    id: 'ActionButton'
- waitForAnimationToEnd

- tapOn: 'Tag'
- waitForAnimationToEnd

- tapOn:
    id: 'TagForm.Input'
- inputText: 'E2E Tag Primary'
- tapOn: 'Create Tag'
- tapOn:
    id: 'TagForm.Submit'

- assertVisible:
    id: 'TagCard.E2E Tag Primary'

# --- Create Second Tag For Search ---

- tapOn:
    id: 'ActionButton'
- waitForAnimationToEnd

- tapOn: 'Tag'
- waitForAnimationToEnd

- tapOn:
    id: 'TagForm.Input'
- inputText: 'E2E Tag Search'
- tapOn: 'Create Tag'
- tapOn:
    id: 'TagForm.Submit'

- assertVisible:
    id: 'TagCard.E2E Tag Search'

# --- Search And Open Result ---

- tapOn:
    id: 'TagPage.SearchInput'
- inputText: 'Search'

- assertVisible:
    id: 'TagCard.E2E Tag Search'
- assertNotVisible:
    id: 'TagCard.E2E Tag Primary'

- tapOn:
    id: 'TagCard.E2E Tag Search'
- waitForAnimationToEnd

- assertVisible: 'E2E Tag Search.*'
- tapOn:
    id: 'TagForm.Merge'
- tapOn:
    id: 'TagPickerBottomSheet.Input'
- inputText: 'Primary'
- extendedWaitUntil:
    visible:
      id: 'TagPickerBottomSheet.Card.E2E Tag Primary'
    timeout: 10000
- tapOn:
    id: 'TagPickerBottomSheet.Card.E2E Tag Primary'

- assertNotVisible:
    id: 'TagCard.E2E Tag Search'

- tapOn:
    id: 'TagPage.SearchInput'
- eraseText: 50

- assertVisible:
    id: 'TagCard.E2E Tag Primary'
- assertNotVisible:
    id: 'TagCard.E2E Tag Search'

# --- Edit Primary Tag ---

- tapOn:
    id: 'TagCard.E2E Tag Primary'
- waitForAnimationToEnd

- tapOn:
    id: 'TagForm.Input'
- eraseText: 80
- inputText: 'E2E Tag Updated'
- tapOn: 'Edit Tag'
- tapOn:
    id: 'TagForm.Submit'

- assertVisible:
    id: 'TagCard.E2E Tag Updated'
- assertNotVisible:
    id: 'TagCard.E2E Tag Primary'

- swipe:
    from:
      id: 'TagCard.E2E Tag Updated'
    direction: LEFT
- extendedWaitUntil:
    visible:
      id: 'DeletableRow.DeleteButton'
    timeout: 10000
- tapOn:
    id: 'DeletableRow.DeleteButton'
- tapOn: 'Delete'
- extendedWaitUntil:
    notVisible:
      id: 'TagCard.E2E Tag Updated'
    timeout: 10000

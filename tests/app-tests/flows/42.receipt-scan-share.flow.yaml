appId: ${APP_ID}
env:
    E2E_FIXTURES_URI: ${E2E_FIXTURES_URI}
    FIXTURE_ROW_ID_MATCH: '42-receipt-scan.db'
    FILE_ROW_ID_MATCH: 'receipt-e2e, pdf'
---
- runFlow:
      file: subflows/import/import-database-from-settings.flow.yaml
      env:
          FIXTURE_ROW_ID_MATCH: ${FIXTURE_ROW_ID_MATCH}
- openLink: ${E2E_FIXTURES_URI.replace('file://', 'shareddocuments://')}
- scrollUntilVisible:
      element:
          id: ${FILE_ROW_ID_MATCH}
      timeout: 20000
- longPressOn:
      id: ${FILE_ROW_ID_MATCH}
- tapOn:
      text: 'Share'
      below:
          id: 'BackButton'
- extendedWaitUntil:
      visible:
          text: 'budgie \(E2E\)'
          below:
              id: 'BackButton'
      timeout: 5000
- tapOn:
      text: 'budgie \(E2E\)'
      below:
          id: 'BackButton'
- extendedWaitUntil:
      visible:
          id: 'TransactionForm.SubmitButton'
      timeout: 30000
- runFlow:
      file: subflows/categories/create-category-from-transaction.flow.yaml
      env:
          CATEGORY_NAME: 'E2E Receipt Category'
- tapOn:
      id: 'TransactionForm.SubmitButton'
- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml
- tapOn:
      text: 'Ihr Labor.*'
- extendedWaitUntil:
      visible:
          id: 'TransactionInfo.Row.Receipt'
      timeout: 5000
- assertVisible: '2026-0042'
- tapOn:
      id: 'PageHeader.BackButton'
- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml
- extendedWaitUntil:
      visible:
          id: 'TransactionCard.ReceiptMarker.4242'
      timeout: 5000

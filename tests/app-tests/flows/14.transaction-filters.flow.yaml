appId: ${APP_ID}
---
- runFlow:
      file: subflows/import/import-database-from-settings.flow.yaml
      env:
          FIXTURE_ROW_ID_MATCH: '14.db(, db)?'

- runFlow: subflows/navigation/navigate-to-settings.flow.yaml
- scrollUntilVisible:
      element:
          id: 'SettingsPage.MoneyDataUpgradeCard'
      direction: DOWN
- tapOn:
      id: 'SettingsPage.MoneyDataUpgradeCard'
- extendedWaitUntil:
      visible: 'Upgrade money data?'
      timeout: 10000
- tapOn: 'Upgrade'
- extendedWaitUntil:
      visible:
          id: 'SettingsPage.MoneyDataUpgradeCard.PrimaryAction.COMPLETE'
      timeout: 30000

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Expense'
- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Income'
- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Transfer'

- tapOn:
      id: 'TransactionFilters.TypeChip'
- tapOn:
      id: 'TransactionFilters.TypeOption.EXPENSE'
- tapOn:
      id: 'TransactionFilters.TypeApplyButton'

- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Expense'
- assertNotVisible:
      id: 'TransactionCard.Label.E2E_Filter_Income'
- assertNotVisible:
      id: 'TransactionCard.Label.E2E_Filter_Transfer'

- tapOn:
      id: 'TransactionFilters.TypeChip'
- tapOn:
      id: 'TransactionFilters.TypeOption.EXPENSE'
- tapOn:
      id: 'TransactionFilters.TypeApplyButton'

- tapOn:
      id: 'TransactionFilters.TypeChip'
- tapOn:
      id: 'TransactionFilters.TypeOption.INCOME'
- tapOn:
      id: 'TransactionFilters.TypeApplyButton'

- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Income'
- assertNotVisible:
      id: 'TransactionCard.Label.E2E_Filter_Expense'
- assertNotVisible:
      id: 'TransactionCard.Label.E2E_Filter_Transfer'
- extendedWaitUntil:
      visible:
          id: 'UncategorizedTransactionsPill.Button'
- assertVisible: '1 missing category'
- tapOn:
      id: 'UncategorizedTransactionsPill.Button'
- extendedWaitUntil:
      visible: 'Missing categories'
- assertVisible: 'Income'
- assertVisible:
      id: 'TransactionCard.Label.E2E_Uncategorized_Income'
- assertNotVisible:
      id: 'TransactionCard.Label.E2E_Filter_Income'
- tapOn:
      id: 'PageHeader.BackButton'
- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.E2E_Filter_Income'

- tapOn:
      id: 'TransactionFilters.TypeChip'
- tapOn:
      id: 'TransactionFilters.TypeOption.INCOME'
- tapOn:
      id: 'TransactionFilters.TypeApplyButton'

- swipe:
      from:
          id: 'TransactionFilters.DateChip'
      direction: LEFT
- extendedWaitUntil:
      visible:
          id: 'TransactionFilters.AccountChip'
      timeout: 5000
- tapOn:
      id: 'TransactionFilters.AccountChip'
- extendedWaitUntil:
      visible:
          id: 'TransactionFilters.AccountGroupToggle.CASH'
      timeout: 5000
- tapOn:
      id: 'TransactionFilters.AccountGroupToggle.CASH'
- extendedWaitUntil:
      visible:
          id: 'TransactionFilters.AccountOption.E2E Filter Cash A'
      timeout: 5000
- tapOn:
      id: 'TransactionFilters.AccountOption.E2E Filter Cash A'
- extendedWaitUntil:
      visible:
          id: 'TransactionFilters.AccountOptionSelected.E2E Filter Cash A'
      timeout: 5000
- tapOn:
      id: 'TransactionFilters.AccountApplyButton'

- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Expense'
- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Transfer'
- assertNotVisible:
      id: 'TransactionCard.Label.E2E_Filter_Income'

- tapOn:
      id: 'TransactionFilters.ClearAllButton'

- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Expense'
- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Income'
- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Transfer'

- runFlow:
      file: subflows/categories/apply-category-filter.flow.yaml
      env:
          CATEGORY_NAME: 'E2E Filter Income Category'

- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Income'
- assertNotVisible:
      id: 'TransactionCard.Label.E2E_Filter_Expense'
- assertNotVisible:
      id: 'TransactionCard.Label.E2E_Filter_Transfer'

- runFlow:
      file: subflows/categories/apply-category-filter.flow.yaml
      env:
          CATEGORY_NAME: 'E2E Filter Income Category'

- scrollUntilVisible:
      element:
          id: 'TransactionFilters.TagChip'
      direction: RIGHT
      speed: 20
- tapOn:
      id: 'TransactionFilters.TagChip'
- extendedWaitUntil:
      visible:
          id: 'TransactionFilters.TagSearchInput'
      timeout: 5000
- tapOn:
      id: 'TransactionFilters.TagSearchInput'
- inputText: 'Expense Tag'
- pressKey: Enter
- extendedWaitUntil:
      visible:
          id: 'TransactionFilters.TagOption.E2E Filter Expense Tag'
      timeout: 5000
- tapOn:
      id: 'TransactionFilters.TagOption.E2E Filter Expense Tag'
- tapOn:
      id: 'TransactionFilters.TagApplyButton'

- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Expense'
- assertNotVisible:
      id: 'TransactionCard.Label.E2E_Filter_Income'
- assertNotVisible:
      id: 'TransactionCard.Label.E2E_Filter_Transfer'

- scrollUntilVisible:
      element:
          id: 'TransactionFilters.ClearAllButton'
      direction: LEFT
      speed: 20
- tapOn:
      id: 'TransactionFilters.ClearAllButton'

- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Expense'
- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Income'
- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Transfer'

# --- Date Filter and Analytics Drilldown ---

- runFlow:
      file: subflows/transactions/open-transaction-form.flow.yaml
      env:
          ACTION_ITEM_ID: 'ActionItem.Expense'
          FORM_TITLE: 'New Expense'

- tapOn:
      id: 'TransactionKeypad.Digit.5'

- runFlow:
      file: subflows/transactions/select-account.flow.yaml
      env:
          ACCOUNT_NAME: 'E2E Filter Cash A'

- runFlow:
      file: subflows/categories/select-category.flow.yaml
      env:
          CATEGORY_NAME: 'E2E Filter Expense Category'

- runFlow:
      file: subflows/transactions/select-existing-tag.flow.yaml
      env:
          TAG_NAME: 'E2E Filter Expense Tag'

- runFlow:
      file: subflows/transactions/enter-comment.flow.yaml
      env:
          COMMENT: 'E2E Date Today Expense'

- runFlow: subflows/transactions/submit-transaction-and-wait.flow.yaml

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.E2E_Date_Today_Expense'
      timeout: 5000

- scrollUntilVisible:
      element:
          id: 'TransactionFilters.DateChip'
      direction: LEFT
      speed: 20
- tapOn:
      id: 'TransactionFilters.DateChip'
- tapOn:
      id: 'TransactionFilters.DatePeriod.TODAY'
- tapOn:
      id: 'TransactionFilters.DateApplyButton'

- assertVisible:
      id: 'TransactionCard.Label.E2E_Date_Today_Expense'
- assertNotVisible:
      id: 'TransactionCard.Label.E2E_Filter_Expense'
- assertNotVisible:
      id: 'TransactionCard.Label.E2E_Filter_Income'
- assertNotVisible:
      id: 'TransactionCard.Label.E2E_Filter_Transfer'

- tapOn:
      id: 'TransactionFilters.ClearAllButton'

- assertVisible:
      id: 'TransactionCard.Label.E2E_Date_Today_Expense'
- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Expense'
- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Income'
- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Transfer'

- tapOn:
      id: 'TabBar.Analytics'
- extendedWaitUntil:
      visible:
          id: 'AnalyticsPage.Container'
      timeout: 5000
- tapOn:
      id: 'TransactionFilters.DateChipActive'
- tapOn:
      id: 'TransactionFilters.DatePeriod.TODAY'
- tapOn:
      id: 'TransactionFilters.DateApplyButton'
- assertVisible:
      id: 'TransactionAnalyticsCard.Amount.Spent.5'
- assertVisible:
      id: 'CategoryStatisticsCard.Amount.E2E_Filter_Expense_Category.5000000'

- tapOn:
      id: 'CategoryStatisticsCard.E2E_Filter_Expense_Category'
- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.E2E_Date_Today_Expense'
      timeout: 5000
- tapOn:
      id: 'PageHeader.BackButton'
- extendedWaitUntil:
      visible:
          id: 'AnalyticsPage.Container'

- tapOn:
      id: 'AnalyticsPage.Tab.Tags'
- assertVisible:
      id: 'TagStatisticsCard.Amount.E2E_Filter_Expense_Tag.5000000'

- tapOn:
      id: 'TagStatisticsCard.E2E_Filter_Expense_Tag'
- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.E2E_Date_Today_Expense'
      timeout: 5000
- tapOn:
      id: 'PageHeader.BackButton'
- extendedWaitUntil:
      visible:
          id: 'AnalyticsPage.Container'

- tapOn:
      id: 'AnalyticsPage.Tab.Categories'
- tapOn:
      id: 'TransactionFilters.ClearAllButton'
- assertVisible:
      id: 'TransactionAnalyticsCard.Amount.Spent.40'
- assertVisible:
      id: 'CategoryStatisticsCard.Amount.E2E_Filter_Expense_Category.40000000'
- tapOn:
      id: 'CategoryStatisticsCard.E2E_Filter_Expense_Category'
- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.E2E_Historical_UAH_2026'
      timeout: 5000
- scrollUntilVisible:
      element:
          id: 'TransactionCard.Label.E2E_Historical_UAH_2011'
      direction: DOWN
      speed: 20

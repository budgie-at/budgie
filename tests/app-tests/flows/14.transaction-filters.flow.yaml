appId: ${APP_ID}
---
- runFlow:
      file: subflows/import/import-database-from-settings.flow.yaml
      env:
          FIXTURE_ROW_ID_MATCH: '14.db'

- runFlow: subflows/settings/run-money-data-upgrade.flow.yaml

- runFlow: subflows/navigation/navigate-to-transactions.flow.yaml

- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Expense'
- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Income'
- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Transfer'
- assertVisible:
      id: 'TransactionCard.Label.E2E_Missing_Rate_Expense'

# Total transaction counter reflects all visible transactions when no filter is applied
- assertVisible: '7 transactions'

- tapOn:
      id: 'TransactionFilters.TypeChip'
- tapOn:
      id: 'TransactionFilters.TypeOption.EXPENSE'
- tapOn:
      id: 'TransactionFilters.TypeApplyButton'

- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Expense'
- assertVisible:
      id: 'TransactionCard.Label.E2E_Missing_Rate_Expense'
- assertNotVisible:
      id: 'TransactionCard.Label.E2E_Filter_Income'
- assertNotVisible:
      id: 'TransactionCard.Label.E2E_Filter_Transfer'

# Counter is filter-aware: the expense type matches the seeded expense, the missing-rate expense, and the two historical UAH expenses
- assertVisible: '4 transactions'

- tapOn:
      id: 'TransactionFilters.TypeChip'
- tapOn:
      id: 'TransactionFilters.TypeOption.EXPENSE'
- tapOn:
      id: 'TransactionFilters.TypeApplyButton'

- tapOn:
      id: 'TransactionFilters.TypeChip'
- tapOn:
      id: 'TransactionFilters.TypeOption.INCOME'
- tapOn:
      id: 'TransactionFilters.TypeApplyButton'

- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Income'
- assertNotVisible:
      id: 'TransactionCard.Label.E2E_Filter_Expense'
- assertNotVisible:
      id: 'TransactionCard.Label.E2E_Filter_Transfer'
- extendedWaitUntil:
      visible:
          id: 'UncategorizedTransactionsPill.Button'
- assertVisible: '1 missing category'
- tapOn:
      id: 'UncategorizedTransactionsPill.Button'
- extendedWaitUntil:
      visible: 'Missing categories'
- assertVisible: 'Income'
- assertVisible:
      id: 'TransactionCard.Label.E2E_Uncategorized_Income'
- assertNotVisible:
      id: 'TransactionCard.Label.E2E_Filter_Income'
- tapOn:
      id: 'PageHeader.BackButton'
- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.E2E_Filter_Income'

- tapOn:
      id: 'TransactionFilters.TypeChip'
- tapOn:
      id: 'TransactionFilters.TypeOption.INCOME'
- tapOn:
      id: 'TransactionFilters.TypeApplyButton'

- swipe:
      from:
          id: 'TransactionFilters.CategoryChip'
      direction: LEFT
      duration: 500
- assertVisible:
      id: 'TransactionFilters.AccountChip'
- tapOn:
      id: 'TransactionFilters.AccountChip'
- extendedWaitUntil:
      visible:
          id: 'TransactionFilters.AccountGroupToggle.CASH'
      timeout: 5000
- tapOn:
      id: 'TransactionFilters.AccountGroupToggle.CASH'
- extendedWaitUntil:
      visible:
          id: 'TransactionFilters.AccountOption.E2E Filter Cash A'
      timeout: 5000
- tapOn:
      id: 'TransactionFilters.AccountOption.E2E Filter Cash A'
- extendedWaitUntil:
      visible:
          id: 'TransactionFilters.AccountApplyButton'
      timeout: 5000
- assertVisible:
      id: 'TransactionFilters.AccountApplyButton'
      text: 'Show 1 account'
- tapOn:
      id: 'TransactionFilters.AccountApplyButton'

- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Expense'
- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Transfer'
- assertNotVisible:
      id: 'TransactionCard.Label.E2E_Filter_Income'

# Counter respects the account filter (matches the per-account total shown on the account screen)
- assertVisible: '2 transactions'

- swipe:
      from:
          id: 'TransactionFilters.AmountChip'
      direction: RIGHT
      duration: 500
- assertVisible:
      id: 'TransactionFilters.ClearAllButton'
- tapOn:
      id: 'TransactionFilters.ClearAllButton'

- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Expense'
- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Income'
- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Transfer'
- assertVisible:
      id: 'TransactionCard.Label.E2E_Missing_Rate_Expense'

- runFlow:
      file: subflows/categories/apply-category-filter.flow.yaml
      env:
          CATEGORY_NAME: 'E2E Filter Income Category'

- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Income'
- assertNotVisible:
      id: 'TransactionCard.Label.E2E_Filter_Expense'
- assertNotVisible:
      id: 'TransactionCard.Label.E2E_Filter_Transfer'

- swipe:
      from:
          id: 'TransactionFilters.AmountChip'
      direction: LEFT
      duration: 500
- assertVisible:
      id: 'TransactionFilters.CategoryChip'
- runFlow:
      file: subflows/categories/apply-category-filter.flow.yaml
      env:
          CATEGORY_NAME: 'E2E Filter Income Category'

- scrollUntilVisible:
      element:
          id: 'TransactionFilters.TagChip'
      direction: RIGHT
      speed: 20
- tapOn:
      id: 'TransactionFilters.TagChip'
- extendedWaitUntil:
      visible:
          id: 'TransactionFilters.TagSearchInput'
      timeout: 5000
- tapOn:
      id: 'TransactionFilters.TagSearchInput'
- inputText: 'Expense Tag'
- pressKey: enter
- extendedWaitUntil:
      visible:
          id: 'TagPickerBottomSheet.Card.E2E Filter Expense Tag'
      timeout: 5000
- tapOn:
      id: 'TagPickerBottomSheet.Card.E2E Filter Expense Tag'
- tapOn:
      id: 'TransactionFilters.TagApplyButton'

- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Expense'
- assertNotVisible:
      id: 'TransactionCard.Label.E2E_Filter_Income'
- assertNotVisible:
      id: 'TransactionCard.Label.E2E_Filter_Transfer'

# Counter uses the singular form for a single match (only the seeded expense carries this tag)
- assertVisible: '1 transaction'

- swipe:
      from:
          id: 'TransactionFilters.AmountChip'
      direction: RIGHT
      duration: 500
- assertVisible:
      id: 'TransactionFilters.ClearAllButton'
- tapOn:
      id: 'TransactionFilters.ClearAllButton'

- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Expense'
- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Income'
- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Transfer'

# --- Date Filter and Analytics Drilldown ---

- runFlow:
      file: subflows/transactions/open-transaction-form.flow.yaml
      env:
          ACTION_ITEM_ID: 'ActionItem.Expense'
          FORM_TITLE: 'New Expense'

- tapOn:
      id: 'TransactionKeypad.Digit.5'

- runFlow:
      file: subflows/transactions/select-account.flow.yaml
      env:
          ACCOUNT_NAME: 'E2E Filter Cash A'

- runFlow:
      file: subflows/categories/select-category.flow.yaml
      env:
          CATEGORY_NAME: 'E2E Filter Expense Category'

- runFlow:
      file: subflows/transactions/select-existing-tag.flow.yaml
      env:
          TAG_NAME: 'E2E Filter Expense Tag'

- runFlow:
      file: subflows/transactions/enter-comment.flow.yaml
      env:
          COMMENT: 'E2E Date Today Expense'

- runFlow: subflows/transactions/submit-transaction-and-wait.flow.yaml

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.E2E_Date_Today_Expense'
      timeout: 5000

- scrollUntilVisible:
      element:
          id: 'TransactionFilters.DateChip'
      direction: LEFT
      speed: 20
- tapOn:
      id: 'TransactionFilters.DateChip'
- tapOn:
      id: 'TransactionFilters.DatePeriod.TODAY'
- tapOn:
      id: 'TransactionFilters.DateApplyButton'

- assertVisible:
      id: 'TransactionCard.Label.E2E_Date_Today_Expense'
- assertNotVisible:
      id: 'TransactionCard.Label.E2E_Filter_Expense'
- assertNotVisible:
      id: 'TransactionCard.Label.E2E_Filter_Income'
- assertNotVisible:
      id: 'TransactionCard.Label.E2E_Filter_Transfer'

- tapOn:
      id: 'TransactionFilters.ClearAllButton'

- assertVisible:
      id: 'TransactionCard.Label.E2E_Date_Today_Expense'
- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Expense'
- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Income'
- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Transfer'

- tapOn:
      id: 'TabBar.Analytics'
- extendedWaitUntil:
      visible:
          id: 'AnalyticsPage.Container'
      timeout: 5000
- tapOn:
      id: 'TransactionFilters.DateChipActive'
- tapOn:
      id: 'TransactionFilters.DatePeriod.TODAY'
- tapOn:
      id: 'TransactionFilters.DateApplyButton'
- assertVisible:
      id: 'TransactionAnalyticsCard.Amount.Spent.5'
- assertVisible:
      id: 'CategoryStatisticsCard.Amount.E2E_Filter_Expense_Category.5000000'

- tapOn:
      id: 'CategoryStatisticsCard.E2E_Filter_Expense_Category'
- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.E2E_Date_Today_Expense'
      timeout: 5000
- tapOn:
      id: 'PageHeader.BackButton'
- extendedWaitUntil:
      visible:
          id: 'AnalyticsPage.Container'

- tapOn:
      id: 'AnalyticsPage.Tab.Tags'
- assertVisible:
      id: 'TagStatisticsCard.Amount.E2E_Filter_Expense_Tag.5000000'

- tapOn:
      id: 'TagStatisticsCard.E2E_Filter_Expense_Tag'
- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.E2E_Date_Today_Expense'
      timeout: 5000
- tapOn:
      id: 'PageHeader.BackButton'
- extendedWaitUntil:
      visible:
          id: 'AnalyticsPage.Container'

- tapOn:
      id: 'AnalyticsPage.Tab.Categories'
- tapOn:
      id: 'TransactionFilters.ClearAllButton'
- assertVisible:
      id: 'TransactionAnalyticsCard.Amount.Spent.40'
- assertVisible:
      id: 'CategoryStatisticsCard.Amount.E2E_Filter_Expense_Category.40000000'
- assertNotVisible:
      id: 'CategoryStatisticsCard.Amount.E2E_Missing_Rate_Category.15000000000'
- tapOn:
      id: 'CategoryStatisticsCard.E2E_Filter_Expense_Category'
- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.E2E_Historical_UAH_2026'
      timeout: 5000
- scrollUntilVisible:
      element:
          id: 'TransactionCard.Label.E2E_Historical_UAH_2011'
      direction: DOWN
      speed: 20
- tapOn:
      id: 'PageHeader.BackButton'
- extendedWaitUntil:
      visible:
          id: 'AnalyticsPage.Container'

# --- Transaction counter on the account detail screen ---

- tapOn:
      id: 'TabBar.Home'
- runFlow:
      file: subflows/accounts/open-account-details.flow.yaml
      env:
          ACCOUNT_NAME: 'E2E Filter Cash A'

- extendedWaitUntil:
      visible:
          id: 'TransactionCard.Label.E2E_Filter_Expense'
      timeout: 5000

# Counter on the account screen reflects only this account's transactions
# (original expense + transfer + the expense created earlier in this flow)
- assertVisible: '3 transactions'

- tapOn:
      id: 'TransactionFilters.TypeChip'
- tapOn:
      id: 'TransactionFilters.TypeOption.EXPENSE'
- tapOn:
      id: 'TransactionFilters.TypeApplyButton'

- assertVisible:
      id: 'TransactionCard.Label.E2E_Filter_Expense'
- assertNotVisible:
      id: 'TransactionCard.Label.E2E_Filter_Transfer'

# Counter on the account screen also respects an applied filter
- assertVisible: '2 transactions'

name: Setup workspace
description: pnpm, Node, the package manager cache and a frozen install. Run after actions/checkout.

inputs:
    node-version:
        description: Node version to install.
        default: 22.22.2
    skip-llama-postinstall:
        description: Skip the llama.rn native artifact download during install.
        default: 'false'
    cache-node-modules:
        description: Cache every workspace node_modules and skip the install on an exact key hit.
        default: 'false'

outputs:
    cache-hit:
        description: Whether the package manager cache restored an exact-key entry.
        value: ${{ steps.pm-cache.outputs.cache-hit }}
    cache-key:
        description: The package manager cache key.
        value: ${{ steps.pm-cache.outputs.cache-key }}
    path:
        description: The package manager store path for actions/cache/save.
        value: ${{ steps.pm-cache.outputs.path }}

runs:
    using: composite
    steps:
        - name: Setup pnpm
          uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

        - name: Setup Node
          uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
          with:
              node-version: ${{ inputs.node-version }}

        - name: Resolve node_modules cache key
          id: nm-key
          if: inputs.cache-node-modules == 'true'
          shell: bash
          env:
              LLAMA_SKIP: ${{ inputs.skip-llama-postinstall }}
              LOCK_HASH: ${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'scripts/after-install.cjs', 'patches/**') }}
              RUNNER_OS_NAME: ${{ runner.os }}
              RUNNER_ARCH_NAME: ${{ runner.arch }}
          run: echo "key=node-modules-v1-${RUNNER_OS_NAME}-${RUNNER_ARCH_NAME}-node$(node --version)-pnpm$(pnpm --version)-llama${LLAMA_SKIP}-${LOCK_HASH}" >> "$GITHUB_OUTPUT"

        - name: Restore node_modules
          id: nm-cache
          if: inputs.cache-node-modules == 'true'
          uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: |
                  node_modules
                  packages/*/node_modules
                  tests/*/node_modules
              key: ${{ steps.nm-key.outputs.key }}

        - name: Restore package manager cache
          id: pm-cache
          if: steps.nm-cache.outputs.cache-hit != 'true'
          uses: rnw-community/mobile-ci/actions/node-pm-cache@6573897f76180036df9d44017b07161a431f36b5 # v4.18.0
          with:
              package-manager: pnpm

        - name: Install dependencies
          if: steps.nm-cache.outputs.cache-hit != 'true'
          shell: bash
          env:
              RNLLAMA_SKIP_POSTINSTALL: ${{ inputs.skip-llama-postinstall == 'true' && '1' || '' }}
          run: pnpm install --frozen-lockfile

        - name: Save node_modules
          if: inputs.cache-node-modules == 'true' && steps.nm-cache.outputs.cache-hit != 'true'
          uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          timeout-minutes: 10
          continue-on-error: true
          with:
              path: |
                  node_modules
                  packages/*/node_modules
                  tests/*/node_modules
              key: ${{ steps.nm-key.outputs.key }}

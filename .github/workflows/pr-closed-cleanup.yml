name: PR closed cleanup

on:
    pull_request:
        types: [closed]

permissions:
    contents: read

jobs:
    cleanup:
        name: Cancel the closed PR's runs and delete its OTA previews
        # contents: write lets mobile-ci's delete-ota-previews job remove the
        # closed PR's expo-ota-preview releases and tags
        # (<prefix>-<app-scope>-pr-<number>-<sha>); the prefix must match the
        # release-tag-prefix pr.yml passes to expo-ota-preview.yml.
        permissions:
            actions: write
            contents: write
        uses: rnw-community/mobile-ci/.github/workflows/pr-closed-cleanup-reusable.yml@f90309c791283d6e2dd1e35eb2ae6c5aee2151cd # v4.7.0
        with:
            control-runner-labels: '["self-hosted","trf-linux-amd64-2x4"]'
            ota-preview-cleanup-runner-labels: '["self-hosted","trf-linux-amd64-2x4"]'
            ota-preview-release-tag-prefix: ota-pr${{ github.event.pull_request.number }}

name: Seed iOS native app cache

on:
    workflow_dispatch:
    push:
        branches: [main]

concurrency:
    group: ios-native-cache-main
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    seed:
        name: Seed native cache
        permissions:
            contents: read
        uses: rnw-community/mobile-ci/.github/workflows/seed-native-cache.yml@a62c341fd959d317db5b99345011c3c9a07861f4 # TEMP: rnw-community/mobile-ci#99 head — repin to v1.10.0 once released
        with:
            ios-runner-labels: '["self-hosted","macOS","ARM64","macos-builder"]'
            ios-targets: >-
                [{"name":"e2e","appDir":"packages/app","workspace":"budgieE2E.xcworkspace","scheme":"budgieE2E",
                "prebuildCommand":"npx expo prebuild -p ios --clean --no-install"}]
            android-targets: '[]'
            ios-cache-profile: ios-e2e-budgie-v2
            build-env: |
                APP_VARIANT=e2e
                EXPO_PUBLIC_AI_DISABLE=true
                EXPO_PUBLIC_LOGGING_DISABLE=true
            install-command: pnpm install --frozen-lockfile
            build-command: pnpm exec turbo build --filter=@budgie/contracts --filter=@budgie/ai --filter=@budgie/bank-sync --filter=@budgie/consolidation --filter=@budgie/budget
            rct-use-prebuilt-rncore: true
            rct-use-rn-dep: true
            expo-use-precompiled-modules: true

name: Deploy production
env:
  EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
  EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
  GH_TOKEN: ${{ secrets.PUSH_TO_PROTECTED_TOKEN }}

concurrency:
  group: deploy-production
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Publish a release
    runs-on: [self-hosted, linux-tiered, linux-medium]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: true
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - name: Setup Git user
        run: |
          git config user.name "Vitalii Yehorov"
          git config user.email "vitalyiegorov@gmail.com"
          git remote rm origin
          git remote add origin https://vitalyiegorov:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git fetch --force --prune --tags --unshallow origin +refs/heads/main:refs/remotes/origin/main || \
            git fetch --force --prune --tags origin +refs/heads/main:refs/remotes/origin/main
          git switch main
          git branch --set-upstream-to=origin/main main

      - name: Verify release branch
        run: |
          if [ "$(git branch --show-current)" != "main" ]; then
            echo "Release must run on the main branch, not a detached HEAD."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Lingui catalogs
        run: pnpm i18n:sync

      - name: Commit Lingui catalog changes
        run: |
          if git diff --quiet HEAD -- packages/app/src/i18n/locales packages/landing/src/i18n/locales; then
            echo "Lingui catalogs are up to date."
            exit 0
          fi

          git add packages/app/src/i18n/locales packages/landing/src/i18n/locales
          git commit -m "chore: sync lingui catalogs [skip ci]"
          git push origin HEAD:main

      - name: Publish a release
        run: pnpm release

      - name: Push changes
        uses: ad-m/github-push-action@v1.3.0
        with:
          github_token: ${{ secrets.PUSH_TO_PROTECTED_TOKEN }}

  eas-update:
    name: EAS Update
    needs: release
    # Expo's Hermes compiler package ships an x86-64 Linux host binary.
    # Keep the export on the hosted x86-64 image and off the ARM64 fleet.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets. Learn more: https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi

      - name: Verify x86-64 Hermes host
        run: test "$(uname -m)" = 'x86_64'

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install

      - name: Build internal workspace packages
        run: pnpm exec turbo build --filter=@budgie/contracts --filter=@budgie/ai --filter=@budgie/sync --filter=@budgie/consolidation --filter=@budgie/budget

      - name: Publish update
        working-directory: packages/app
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          pnpm exec expo export --output-dir dist --dump-assetmap --platform ios --platform android
          eas update --skip-bundler --input-dir dist --channel production --auto --message "${COMMIT_MSG}"

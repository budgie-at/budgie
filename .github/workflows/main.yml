name: Deploy production
env:
  EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
  EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
  GH_TOKEN: ${{ secrets.PUSH_TO_PROTECTED_TOKEN }}

concurrency:
  group: deploy-production
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: Publish a release
    runs-on: [self-hosted, linux-portable-2x4]
    timeout-minutes: 30
    # Every write (catalog commit, lerna's version commit, tags and GitHub
    # release) authenticates with PUSH_TO_PROTECTED_TOKEN, not github.token.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: true
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: pnpm

      - name: Setup Git user
        run: |
          git config user.name "Vitalii Yehorov"
          git config user.email "vitalyiegorov@gmail.com"
          git remote rm origin
          git remote add origin "https://vitalyiegorov:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --force --prune --tags --unshallow origin +refs/heads/main:refs/remotes/origin/main || \
            git fetch --force --prune --tags origin +refs/heads/main:refs/remotes/origin/main
          git switch main
          git branch --set-upstream-to=origin/main main

      - name: Verify release branch
        run: |
          if [ "$(git branch --show-current)" != "main" ]; then
            echo "Release must run on the main branch, not a detached HEAD."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Lingui catalogs
        run: pnpm i18n:sync

      - name: Commit Lingui catalog changes
        run: |
          if git diff --quiet HEAD -- packages/app/src/i18n/locales packages/landing/src/i18n/locales; then
            echo "Lingui catalogs are up to date."
            exit 0
          fi

          git add packages/app/src/i18n/locales packages/landing/src/i18n/locales
          git commit -m "chore: sync lingui catalogs [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              break
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/main."
            git pull --rebase origin main
          done
          exit 1

      # main can move while this job installs (a later merge queued behind this
      # run): lerna then exits 0 with EBEHIND and publishes nothing, and the old
      # trailing push failed non-fast-forward (run 38763789695). Rebase onto the
      # current tip first so this run releases everything merged so far.
      - name: Rebase onto the latest main
        run: git pull --rebase origin main

      # lerna publish commits the version bump, tags, and pushes both itself
      # (git push --follow-tags --atomic), so no separate push step is needed.
      - name: Publish a release
        run: pnpm release

      - name: Verify the release reached origin
        run: |
          git fetch origin main
          if [ -n "$(git rev-list origin/main..HEAD)" ]; then
            echo "::error::Local main has commits origin/main does not; lerna did not push the release."
            git log --oneline origin/main..HEAD
            exit 1
          fi

  eas-update:
    name: EAS Update
    needs: release
    runs-on: [self-hosted, trf-linux-amd64-4x8]
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      APP_VARIANT: production
    steps:
      - name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets. Learn more: https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi

      - name: Verify x86-64 Hermes host
        run: test "$(uname -m)" = 'x86_64'

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: pnpm

      - name: Setup EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9.0.0
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build internal workspace packages
        run: pnpm exec turbo build --filter='@budgie/*'

      - name: Assert AI is enabled
        run: bash .github/scripts/assert-ai-enabled.sh

      - name: Publish update
        working-directory: packages/app
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          pnpm exec expo export --output-dir dist --dump-assetmap --platform ios --platform android
          eas update --skip-bundler --input-dir dist --channel production --auto --message "${COMMIT_MSG}"

name: Deploy production
env:
  EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
  EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
  GH_TOKEN: ${{ secrets.PUSH_TO_PROTECTED_TOKEN }}

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Publish a release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: yarn

      - name: Setup Git user
        run: |
          git config user.name "Vitalii Yehorov"
          git config user.email "vitalyiegorov@gmail.com"
          git remote rm origin
          git remote add origin https://vitalyiegorov:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git fetch
          git branch --set-upstream-to=origin/main main

      - name: Install dependencies
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: true
        run: yarn install

      - name: Publish a release
        run: yarn release

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.PUSH_TO_PROTECTED_TOKEN }}

  eas-update:
    name: EAS Update
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets. Learn more: https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: yarn

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install

      - name: Build internal workspace packages
        run: yarn turbo build --filter=@budgie/contracts --filter=@budgie/ai --filter=@budgie/bank-sync

      - name: Publish update
        working-directory: packages/app
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          eas update --channel production --auto --message "${COMMIT_MSG}"

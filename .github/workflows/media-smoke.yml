name: Media smoke

on:
    pull_request:
        paths:
            - 'tests/app-tests/flows/media/**'
            - 'tests/app-tests/fixtures/screenshots/**'
            - 'tests/app-tests/scripts/seed-screenshot-scene.sh'
            - 'tests/app-tests/scripts/capture-store-screenshots.sh'
            - '.github/landing-media.config.json'
            - '.github/workflows/media-smoke.yml'
    schedule:
        - cron: '0 3 * * *'

concurrency:
    group: media-smoke-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    media-flows:
        name: Landing media flows
        # A reusable workflow can only narrow the token it is given; see pr.yml.
        permissions:
            contents: read
            packages: write
            actions: read
        uses: rnw-community/mobile-ci/.github/workflows/ios-maestro.yml@c45b9b0e1cc8e841a9d1f1df5f8a9acaa422ce19 # v4.3.1
        with:
            build-runner-labels: '["self-hosted","macOS","ARM64","macos-maestro"]'
            test-runner-labels: '["self-hosted","macOS","ARM64","macos-maestro"]'
            targets: >-
                [{"name":"e2e","appDir":"packages/app","workspace":"budgieE2E.xcworkspace","scheme":"budgieE2E",
                "appId":"com.vitalyiegorov.budgie.e2e","prebuildCommand":"npx expo prebuild -p ios --clean --no-install"}]
            build-env: |
                APP_VARIANT=e2e
                EXPO_PUBLIC_AI_DISABLE=true
                EXPO_PUBLIC_LOGGING_DISABLE=true
            # mobile-ci v3.3.0 gates pull requests on turbo even when target-packages
            # is empty (it derives @budgie-at/app from targets[].appDir), and the media
            # flows, fixtures and scripts this workflow triggers on live in
            # @budgie-at/app-tests, which the app does not depend on. Without app-tests
            # here a media-only pull request would skip the very smoke it triggered.
            target-packages: |
                @budgie-at/app
                @budgie-at/app-tests
            # turbo attributes no change outside a workspace package, so the two
            # .github files in `paths` would otherwise skip the smoke they trigger.
            trigger-paths: |
                .github/workflows/media-smoke.yml
                .github/landing-media.config.json
            flows-dir: tests/app-tests/flows/media
            shard-count: 1
            maestro-config: tests/app-tests/config.yaml
            pre-run-flow: tests/app-tests/flows/setup/prime-deep-links.flow.yaml
            pre-flow-command: SCENE="${FLOW_NAME%.flow.yaml}" LOCALE=en APPEARANCE=dark bash tests/app-tests/scripts/seed-screenshot-scene.sh
            flow-retries: '0'
            maestro-version: '2.8.0'
            simulator-device: iPhone 17 Pro
            simulator-requires: push,universal-links
            # Measured on #1182: 41 scenarios need ~26.5 min end to end (~3.3 min
            # of job setup + ~23 min of flows), so the old 25-minute cap cancelled
            # a shard whose every flow was passing. 40 leaves real headroom.
            test-timeout-minutes: 40
            install-command: pnpm install --frozen-lockfile
            package-manager: pnpm
            build-command: pnpm exec turbo build --filter='@budgie/*'
            rct-use-prebuilt-rncore: true
            rct-use-rn-dep: true
            expo-use-precompiled-modules: true
            fingerprint-env: |
                APP_VARIANT=e2e
                EXPO_PUBLIC_AI_DISABLE=true
                EXPO_PUBLIC_LOGGING_DISABLE=true
            repack-env: |
                APP_VARIANT=e2e
                EXPO_PUBLIC_AI_DISABLE=true
                EXPO_PUBLIC_LOGGING_DISABLE=true
            expect-config: |
                extra.appVariant=e2e
                extra.aiEnabled=false
                extra.loggingEnabled=false

name: Media smoke

on:
    pull_request:
        paths:
            - 'e2e/media/**'
            - 'e2e/media.config.ts'
            - 'e2e/support/**'
            - 'e2e/package-lock.json'
            - 'tests/app-tests/fixtures/screenshots/**'
            - 'tests/app-tests/scripts/seed-screenshot-scene.sh'
            - 'tests/app-tests/scripts/capture-store-screenshots.sh'
            - '.github/landing-media.config.json'
            - '.github/workflows/media-smoke.yml'
    schedule:
        - cron: '0 3 * * *'

concurrency:
    group: media-smoke-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    media-flows:
        name: Landing media flows
        # A reusable workflow can only narrow the token it is given; see pr.yml.
        permissions:
            contents: read
            packages: write
            actions: read
        uses: rnw-community/mobile-ci/.github/workflows/ios-maestro.yml@156be7db9b16530281c808aa74c4b1953aaecddb # v4.11.2
        with:
            control-runner-labels: '["self-hosted","linux-portable-2x4"]'
            # A native build still runs on macOS when this commit's native key has no published base.
            build-runner-labels: '["self-hosted","macOS","ARM64","macos-maestro"]'
            targets: >-
                [{"name":"e2e","appDir":"packages/app","workspace":"budgieE2E.xcworkspace","scheme":"budgieE2E",
                "appId":"com.vitalyiegorov.budgie.e2e","prebuildCommand":"npx expo prebuild -p ios --clean --no-install"}]
            build-env: |
                APP_VARIANT=e2e
                EXPO_PUBLIC_AI_DISABLE=true
                EXPO_PUBLIC_LOGGING_DISABLE=true
            # The media scenes live in the e2e project (e2e/media, e2e/support/media), outside
            # every workspace package turbo sees; @budgie-at/app-tests holds the scene fixtures
            # and the seed script the capture builds each scene's database with.
            target-packages: |
                @budgie-at/app
                @budgie-at/app-tests
            # turbo attributes no change outside a workspace package, so these would otherwise
            # skip the smoke they trigger.
            trigger-paths: |
                .github/workflows/media-smoke.yml
                .github/landing-media.config.json
                e2e/media/**
                e2e/media.config.ts
                e2e/support/**
                e2e/package-lock.json
            # Every capture scene the e2e build can drive (support/media/scenes.ts; the AI-build
            # and credential-bound ones are left out), once, in en/dark on an iPhone 17 Pro, seeded
            # by seed-screenshot-scene.sh as the store and landing captures are. media.config.ts is
            # its own e2e config, so the PR suite (e2e.config.ts, tests/) never collects these. The
            # captures land in e2e/.e2e/media/raw/ios/iphone-17-pro/en/dark/<scene>.png and ship
            # in the e2e-ios-e2e report artifact.
            test-framework: e2e
            e2e-dir: e2e
            e2e-command: npx e2e run --config media.config.ts --target ios
            e2e-runner-labels: '["self-hosted","linux-portable-4x8"]'
            e2e-workers: '4'
            e2e-retries: '1'
            e2e-timeout-minutes: 45
            simlock-url: https://simlock.vitaliiyehorov.dev
            install-command: pnpm install --frozen-lockfile
            package-manager: pnpm
            build-command: pnpm exec turbo build --filter='@budgie/*'
            rct-use-prebuilt-rncore: true
            rct-use-rn-dep: true
            expo-use-precompiled-modules: true
            fingerprint-env: |
                APP_VARIANT=e2e
                EXPO_PUBLIC_AI_DISABLE=true
                EXPO_PUBLIC_LOGGING_DISABLE=true
            repack-env: |
                APP_VARIANT=e2e
                EXPO_PUBLIC_AI_DISABLE=true
                EXPO_PUBLIC_LOGGING_DISABLE=true
            expect-config: |
                extra.appVariant=e2e
                extra.aiEnabled=false
                extra.loggingEnabled=false
        secrets:
            simlock-token: ${{ secrets.SIMLOCK_TOKEN }}

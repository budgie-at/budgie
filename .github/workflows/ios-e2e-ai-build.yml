name: Build iOS e2e AI app

on:
    workflow_dispatch:

concurrency:
    group: ios-e2e-ai-build-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        name: AI capture build
        # A reusable workflow can only narrow the token it is given; see pr.yml.
        permissions:
            contents: read
            packages: write
            actions: read
        uses: rnw-community/mobile-ci/.github/workflows/ios-maestro.yml@5ecd3974800ea70a3ee93eab363daa1994c56b09 # feat/ios-e2e-simlock
        with:
            control-runner-labels: '["self-hosted","linux-portable-2x4"]'
            build-runner-labels: '["self-hosted","macOS","ARM64","macos-maestro"]'
            # The smoke for the AI build: voice-transaction-entry-1 (e2e/support/media/scenes.ts),
            # which waits up to ten minutes for the on-device model to make the AI action
            # enabled, then opens voice entry: what this build adds over the e2e lanes. Run from
            # Linux against the Mac Studio simlock farm, captured to e2e/.e2e/media in the report.
            test-framework: e2e
            e2e-dir: e2e
            e2e-command: SCREENSHOT_SCENES=voice-transaction-entry-1 npx e2e run --config media.config.ts --target ios
            e2e-runner-labels: '["self-hosted","linux-portable-4x8"]'
            e2e-workers: '1'
            e2e-retries: '1'
            e2e-timeout-minutes: 45
            simlock-url: https://simlock.vitaliiyehorov.dev
            build-timeout-minutes: 120
            install-command: pnpm install --frozen-lockfile
            package-manager: pnpm
            build-command: pnpm exec turbo build --filter='@budgie/*'
            rct-use-prebuilt-rncore: true
            rct-use-rn-dep: true
            expo-use-precompiled-modules: true
            # This lane builds the AI-enabled app, so its native surface differs
            # from every other lane: app.config.js only adds the llama.rn and
            # react-native-audio-api config plugins when EXPO_PUBLIC_AI_DISABLE
            # is unset. fingerprint-env therefore mirrors this job's own
            # build-env and nothing else, giving this lane its own native key -
            # sharing the e2e lanes' fingerprint-env would repack the
            # AI-disabled base and test an app with no AI native code at all.
            fingerprint-env: |
                APP_VARIANT=e2e
                EXPO_PUBLIC_LOGGING_DISABLE=true
            repack-env: |
                APP_VARIANT=e2e
                EXPO_PUBLIC_LOGGING_DISABLE=true
            expect-config: |
                extra.appVariant=e2e
                extra.aiEnabled=true
                extra.loggingEnabled=false
        secrets:
            simlock-token: ${{ secrets.SIMLOCK_TOKEN }}

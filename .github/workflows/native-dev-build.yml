name: Build Development build

on:
  workflow_dispatch:

concurrency:
  group: ios-dev-prerelease
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dev-release:
    name: iOS development build and release
    permissions:
      contents: write
    uses: rnw-community/mobile-ci/.github/workflows/native-dev-release.yml@v1.11.0 # v1.11.0
    with:
      enable-ios: true
      enable-android: false
      ios-runner-labels: '["self-hosted","macOS","ARM64","macos-tartelet"]'
      app-dir: packages/app
      build-profile: development
      tag-prefix: dev
      keep-releases: '5'
      asc-key-path: asc_api_key.p8
      install-command: pnpm install --frozen-lockfile
      publish-env: |
        EXPO_NO_TELEMETRY=1
        APP_VARIANT=development
        EXPO_APPLE_TEAM_TYPE=INDIVIDUAL
        EXPO_APPLE_TEAM_ID=3R8589YV24
        EXPO_USE_PRECOMPILED_MODULES=1
        RCT_USE_PREBUILT_RNCORE=1
        RCT_USE_RN_DEP=1
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_API_KEY: ${{ secrets.EXPO_IOS_ASC_API_KEY }}
      ASC_KEY_ID: ${{ secrets.EXPO_IOS_ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.EXPO_IOS_ASC_ISSUER_ID }}

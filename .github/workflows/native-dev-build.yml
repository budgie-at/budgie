name: Build Development build

on:
  workflow_dispatch:

concurrency:
  group: ios-dev-prerelease
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  assert-ai:
    name: Assert AI is enabled
    runs-on: [self-hosted, linux-portable-2x4]
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      APP_VARIANT: development
      EAS_BUILD_PROFILE: development
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert AI is enabled
        run: bash .github/scripts/assert-ai-enabled.sh

  dev-release:
    name: iOS development build and release
    needs: assert-ai
    permissions:
      contents: write
    uses: rnw-community/mobile-ci/.github/workflows/native-dev-release.yml@b9502c1c3ea1c933485b3e657b47574072ed7ddf # v3.3.1
    with:
      enable-ios: true
      enable-android: false
      ios-runner-labels: '["self-hosted","macOS","ARM64","macos-tartelet"]'
      app-dir: packages/app
      build-profile: development
      tag-prefix: dev
      keep-releases: '5'
      asc-key-path: asc_api_key.p8
      install-command: pnpm install --frozen-lockfile
      package-manager: pnpm
      publish-env: |
        EXPO_NO_TELEMETRY=1
        APP_VARIANT=development
        EXPO_APPLE_TEAM_TYPE=INDIVIDUAL
        EXPO_APPLE_TEAM_ID=3R8589YV24
        EXPO_USE_PRECOMPILED_MODULES=1
        RCT_USE_PREBUILT_RNCORE=1
        RCT_USE_RN_DEP=1
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_API_KEY: ${{ secrets.EXPO_IOS_ASC_API_KEY }}
      ASC_KEY_ID: ${{ secrets.EXPO_IOS_ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.EXPO_IOS_ASC_ISSUER_ID }}

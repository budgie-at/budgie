name: Store screenshots

# App-shaped config (ios-target, capture manifest/scenes, build env, cache
# profile, upload command, ASC dedupe settings, ...) lives in
# .github/store-screenshots.config.json and is loaded via config-path. Only the
# inputs mobile-ci cannot load from that file stay here: the plan-time runner
# labels, the keys outside its allowed-keys allowlist, and the dispatch-driven
# upload gate.
on:
    workflow_dispatch:
        inputs:
            platforms:
                description: Platforms to capture
                type: choice
                options:
                    - ios,android
                    - ios
                    - android
                default: ios,android
            upload:
                description: Upload captured screenshots to App Store Connect and Google Play
                type: boolean
                default: false

concurrency:
    group: store-screenshots-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    screenshots:
        name: Capture and upload store screenshots
        if: contains(inputs.platforms, 'ios')
        # A reusable workflow can only narrow the token it is given; see pr.yml.
        permissions:
            contents: read
            packages: write
            actions: read
        concurrency:
            group: ios-simulator-farm
            queue: max
            cancel-in-progress: false
        uses: rnw-community/mobile-ci/.github/workflows/store-screenshots.yml@e502251644979fb3b08795e0bc67fc72a204cac0 # v4.12.3
        with:
            control-runner-labels: '["self-hosted","linux-portable-2x4"]'
            config-path: .github/store-screenshots.config.json
            package-manager: pnpm
            install-cache-paths: |
                node_modules/.pnpm/llama.rn@*/node_modules/llama.rn/android/src/main/jniLibs
                node_modules/.pnpm/llama.rn@*/node_modules/llama.rn/ios/rnllama.xcframework
            install-cache-key: llama.rn-0.13.0-rc.7-react-native-0.88.1
            expo-use-precompiled-modules: true
            # Not loadable from config-path (outside its allowed-keys list), and
            # byte-identical to pr.yml / media-smoke.yml / ios-native-cache.yml:
            # the four e2e lanes have to agree on one native key or none of them
            # ever finds the base the warm-up published.
            fingerprint-env: |
                APP_VARIANT=e2e
                EXPO_PUBLIC_AI_DISABLE=true
                EXPO_PUBLIC_LOGGING_DISABLE=true
            repack-env: |
                APP_VARIANT=e2e
                EXPO_PUBLIC_AI_DISABLE=true
                EXPO_PUBLIC_LOGGING_DISABLE=true
            expect-config: |
                extra.appVariant=e2e
                extra.aiEnabled=false
                extra.loggingEnabled=false
            build-runner-labels: '["self-hosted","macOS","ARM64","macos-maestro"]'
            # The iOS cells are captured by the e2e project's media capture (e2e/media.config.ts,
            # e2e/support/media) from Linux against the Mac Studio simlock farm, one job per
            # manifest device; it seeds every cell itself (seed-screenshot-scene.sh) and handles
            # iOS's one-per-install "Open in budgie?" prompt, so no prime scene is needed.
            test-framework: e2e
            e2e-dir: e2e
            e2e-command: npx e2e run --config media.config.ts --target ios
            e2e-runner-labels: '["self-hosted","linux-portable-4x8"]'
            e2e-workers: '4'
            e2e-retries: '1'
            simlock-url: https://simlock.vitaliiyehorov.dev
            upload-runner-labels: '["self-hosted","macOS","ARM64","macos-maestro"]'
            upload-screenshots: ${{ inputs.upload }}
        secrets:
            ASC_API_KEY: ${{ secrets.EXPO_IOS_ASC_API_KEY }}
            ASC_KEY_ID: ${{ secrets.EXPO_IOS_ASC_KEY_ID }}
            ASC_ISSUER_ID: ${{ secrets.EXPO_IOS_ASC_ISSUER_ID }}
            simlock-token: ${{ secrets.SIMLOCK_TOKEN }}

    android-screenshots:
        name: Capture and upload Google Play screenshots
        if: contains(inputs.platforms, 'android')
        permissions:
            contents: read
            packages: write
            actions: read
        concurrency:
            group: android-store-screenshots
            queue: max
            cancel-in-progress: false
        uses: rnw-community/mobile-ci/.github/workflows/store-screenshots.yml@e502251644979fb3b08795e0bc67fc72a204cac0 # v4.12.3
        with:
            control-runner-labels: '["self-hosted","linux-portable-2x4"]'
            config-path: .github/store-screenshots-android.config.json
            package-manager: pnpm
            install-cache-paths: |
                node_modules/.pnpm/llama.rn@*/node_modules/llama.rn/android/src/main/jniLibs
                node_modules/.pnpm/llama.rn@*/node_modules/llama.rn/ios/rnllama.xcframework
            install-cache-key: llama.rn-0.13.0-rc.7-react-native-0.88.1
            fingerprint-env: |
                APP_VARIANT=e2e
                EXPO_PUBLIC_AI_DISABLE=true
                EXPO_PUBLIC_LOGGING_DISABLE=true
            repack-env: |
                APP_VARIANT=e2e
                EXPO_PUBLIC_AI_DISABLE=true
                EXPO_PUBLIC_LOGGING_DISABLE=true
            expect-config: |
                extra.appVariant=e2e
                extra.aiEnabled=false
                extra.loggingEnabled=false
            android-build-runner-labels: '["self-hosted","trf-linux-amd64-4x8"]'
            android-build-timeout-minutes: 120
            android-capture-runner-labels: '["self-hosted","trf-linux-amd64-4x8"]'
            android-capture-timeout-minutes: 120
            post-capture-command: |
                if ! command -v magick >/dev/null; then
                    curl -fsSL -o "$RUNNER_TEMP/imagemagick.AppImage" https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-35/ImageMagick-7.1.2-35-gcc-x86_64.AppImage
                    chmod +x "$RUNNER_TEMP/imagemagick.AppImage"
                    (cd "$RUNNER_TEMP" && ./imagemagick.AppImage --appimage-extract >/dev/null)
                    mkdir -p "$RUNNER_TEMP/bin"
                    ln -sf "$RUNNER_TEMP/squashfs-root/AppRun" "$RUNNER_TEMP/bin/magick"
                    export PATH="$RUNNER_TEMP/bin:$PATH"
                fi
                for locale in en-US fr-FR uk de-DE es-ES; do
                    SCREENSHOTS_RAW_DIR="$SCREENSHOTS_OUTPUT_DIR/raw" PLAY_SCREENSHOTS_DIR="$SCREENSHOTS_OUTPUT_DIR/raw/play" \
                        bash packages/app/fastlane/screenshots/design/compose-screenshots.sh "$locale" dark --device "$DEVICE_SLUG"
                done
            upload-runner-labels: '["ubuntu-latest"]'
            upload-screenshots: ${{ inputs.upload }}
        secrets:
            EAS_EXTRA_ENV: |
                GOOGLE_SERVICE_ACCOUNT_JSON<<GOOGLE_SERVICE_ACCOUNT_JSON_EOF
                ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
                GOOGLE_SERVICE_ACCOUNT_JSON_EOF

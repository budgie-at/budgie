name: Landing IndexNow

on:
  # After each production deploy, changed URLs only: a full submit per deploy made crawlers refetch
  # every page right after the deploy emptied the ISR cache. Manual dispatch submits the full sitemap.
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-indexnow
  cancel-in-progress: false

jobs:
  submit:
    name: Submit IndexNow
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: [self-hosted, linux-portable-2x4]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'deployment_status'
        with:
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 2
          sparse-checkout: .github
      - name: Submit canonical URLs to IndexNow
        run: |
          url=https://budgie.at/api/indexnow
          if [ "${{ github.event_name }}" = "deployment_status" ]; then
            url="$url?since=$(TZ=UTC git log -1 --date=format-local:%Y-%m-%d --format=%cd HEAD^)T00:00:00Z"
          fi
          echo "POST $url"
          for attempt in 1 2 3; do
            echo "Attempt $attempt"
            if curl --fail --silent --show-error --max-time 30 -o /tmp/out.json -X POST "$url" \
              -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}"; then
              cat /tmp/out.json
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 60
            fi
          done
          cat /tmp/out.json 2>/dev/null || true
          exit 1

name: Landing IndexNow

on:
  # Daily, changed URLs only: a full submit after every deploy made crawlers refetch every page
  # right after the deploy emptied the ISR cache. Manual dispatch submits the full sitemap.
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-indexnow
  cancel-in-progress: false

jobs:
  submit:
    name: Submit IndexNow
    runs-on: [self-hosted, linux-portable-2x4]
    timeout-minutes: 10
    steps:
      - name: Submit canonical URLs to IndexNow
        run: |
          url=https://budgie.at/api/indexnow
          if [ "${{ github.event_name }}" = "schedule" ]; then
            url="$url?since=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          fi
          echo "POST $url"
          for attempt in 1 2 3; do
            echo "Attempt $attempt"
            if curl --fail --silent --show-error --max-time 30 -o /tmp/out.json -X POST "$url" \
              -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}"; then
              cat /tmp/out.json
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 60
            fi
          done
          cat /tmp/out.json 2>/dev/null || true
          exit 1

# Submits the uploaded iOS build for App Review and promotes the Play internal build to production; dry run by default.
name: Release to the stores

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Stores to release to'
        type: choice
        options:
          - ios,android
          - ios
          - android
        default: ios,android
      dry_run:
        description: 'Only print the plan; change nothing in App Store Connect'
        type: boolean
        default: true
      ios_version:
        description: 'iOS marketing version to submit (empty reads packages/app/package.json; set it when the last native build predates later version bumps)'
        type: string
        default: ''
      android_rollout:
        description: 'Google Play rollout fraction (1 completes the release)'
        type: string
        default: '1'

permissions:
  contents: read

concurrency:
  group: budgie-store-release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    permissions:
      contents: read
    uses: rnw-community/mobile-ci/.github/workflows/store-release.yml@9a151735055f5ab661650523ad7c6375ae007bef # v4.12.0
    with:
      control-runner-labels: '["self-hosted","linux-portable-2x4"]'
      platforms: ${{ inputs.platforms }}
      dry-run: ${{ inputs.dry_run }}
      version-file: packages/app/package.json
      ios-app-id: '6757147597'
      ios-release-type: MANUAL
      ios-version: ${{ inputs.ios_version }}
      android-package: com.vitaliiyehorov.budgie
      android-from-track: internal
      android-to-track: production
      android-rollout: ${{ inputs.android_rollout }}
    secrets:
      ASC_API_KEY: ${{ secrets.EXPO_IOS_ASC_API_KEY }}
      ASC_KEY_ID: ${{ secrets.EXPO_IOS_ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.EXPO_IOS_ASC_ISSUER_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

name: Pull Request
env:
  MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
  TURBO_TEAM: vitalyiegorov
  TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  PR_TITLE: ${{ github.event.pull_request.title }}
  MAESTRO_CLI_NO_ANALYTICS: false
  RCT_USE_PREBUILT_RNCORE: 1
  RCT_USE_RN_DEP: 1

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on: pull_request

jobs:
  code-quality:
    name: Code quality checks
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Lint the PR Title
        run: echo "${{env.PR_TITLE}}" | node_modules/.bin/commitlint

      - name: Typescript checks
        run: yarn turbo ts

      - name: ESLint checks
        run: yarn turbo lint

      - name: Deadcode detection
        run: yarn turbo deadcode

      - name: Copy/Paste detection
        run: yarn turbo cpd

      - name: Unit tests
        run: yarn test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3

  eas-deploy:
    name: EAS Deploy
    needs: code-quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write
      issues: write
    outputs:
      deployment_url: ${{ steps.deploy-web.outputs.deployment_url }}
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project."
            echo "Learn more: https://docs.expo.dev/eas/github-actions"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install

      - name: Build internal workspace packages
        run: yarn turbo build --filter=@budgie/contracts --filter=@budgie/ai --filter=@budgie/bank-sync

      - name: Create preview
        id: create-preview
        working-directory: packages/app
        env:
          APP_VARIANT: development
          USE_CCACHE: "1"
        run: |
          eas update --channel development --message "PR #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}"

      - name: Build web app
        working-directory: packages/app
        run: npx expo export --platform web

      - name: Deploy web app
        id: deploy-web
        working-directory: packages/app
        run: |
          result="$(eas deploy --non-interactive --json)"
          echo "$result"

          # Extract the URL from the deployment result
          url=$(echo "$result" | jq -r '.url // empty')
          if [ -n "$url" ]; then
            echo "deployment_url=$url" >> $GITHUB_OUTPUT
            echo "## 🚀 Web App Deployment" >> $GITHUB_STEP_SUMMARY
            echo "Your PR has been deployed and is available at: [$url]($url)" \
              >> $GITHUB_STEP_SUMMARY
          fi

      - name: Create deployment environment
        if: steps.deploy-web.outputs.deployment_url
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentUrl = '${{ steps.deploy-web.outputs.deployment_url }}';

            // Create deployment
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
              environment: 'preview',
              description: 'PR Preview Deployment',
              auto_merge: false,
              required_contexts: []
            });

            // Create deployment status
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: deploymentUrl,
              description: 'Web app deployed successfully'
            });

      - name: Comment deployment URL on PR
        if: steps.deploy-web.outputs.deployment_url
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentUrl = '${{ steps.deploy-web.outputs.deployment_url }}';
            const prNumber = context.payload.pull_request.number;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const existingComment = comments.data.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('🚀 Preview Deployment')
            );

            const commentBody = '## 🚀 Preview Deployment\n\n' +
              'Your PR has been deployed! You can test the changes at:\n\n' +
              '🌐 **[Open Preview App](' + deploymentUrl + ')**\n\n' +
              'This deployment will be automatically updated with new commits.';

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
            }


  e2e-ios:
    needs: [code-quality]
    name: E2E Tests on iOS
    runs-on: ${{ vars.IOS_RUNNER || 'macos-15' }}
    timeout-minutes: 90
    env:
      APP_VARIANT: e2e
      EXPO_PUBLIC_AI_DISABLE: "true"
      IOS_DERIVED_DATA: ${{ github.workspace }}/.ci-cache/DerivedData/budgie-e2e
      USE_CCACHE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ci-cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 2G
      CCACHE_NOHASHDIR: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Runner diagnostics
        run: |
          whoami
          uname -m
          hostname
          ls -1 /Applications | grep -i Xcode || true
          which pod || true
          pod --version || true
          which ccache || true
          ccache --version || true
          xcode-select -p || true
          xcodebuild -version || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Apply E2E autolinking excludes
        working-directory: packages/app
        run: |
          node <<'NODE'
          const fs = require('fs');
          const packageJsonPath = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(packageJsonPath, 'utf8'));

          packageJson.expo ??= {};
          packageJson.expo.autolinking ??= {};
          packageJson.expo.autolinking.exclude = [
            'expo-dev-client',
            'expo-dev-launcher',
            'expo-dev-menu',
            'expo-dev-menu-interface'
          ];

          fs.writeFileSync(packageJsonPath, `${JSON.stringify(packageJson, null, 4)}\n`);
          console.log('Applied expo.autolinking.exclude for e2e build');
          NODE

      - name: Build internal workspace packages
        run: yarn turbo build --filter=@budgie/contracts --filter=@budgie/ai --filter=@budgie/bank-sync

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Select Xcode 26.3
        run: |
          if [ -d /Applications/Xcode_26.3.app ]; then
            XCODE_APP=/Applications/Xcode_26.3.app
          elif [ -d /Applications/Xcode.app ]; then
            XCODE_APP=/Applications/Xcode.app
          else
            echo "::error::Xcode 26.3 is not installed on this runner."
            ls -1 /Applications | grep -i Xcode || true
            exit 1
          fi

          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          echo "Using Xcode at $XCODE_APP"
          xcode-select -p || true
          xcodebuild -version

      - name: Ensure CocoaPods is installed
        run: |
          if command -v pod >/dev/null 2>&1; then
            echo "CocoaPods $(pod --version) found"
          else
            echo "::warning::CocoaPods not found — installing via gem --user-install"
            RUBY_VER=$(ruby -e 'puts RUBY_VERSION')
            echo "Ruby version: $RUBY_VER"
            # Ruby < 3.0 needs pinned ffi version (ffi >= 1.17.4 requires Ruby 3.0+)
            if ruby -e 'exit(Gem::Version.new(RUBY_VERSION) < Gem::Version.new("3.0.0") ? 0 : 1)'; then
              gem install ffi -v 1.17.3 --user-install --no-document
            fi
            gem install cocoapods --user-install --no-document
            GEM_BIN="$(ruby -r rubygems -e 'puts Gem.user_dir')/bin"
            echo "$GEM_BIN" >> "$GITHUB_PATH"
            export PATH="$GEM_BIN:$PATH"
            echo "Installed CocoaPods $(pod --version)"
          fi

      - name: Ensure ccache is available
        id: setup-ccache
        run: |
          if command -v ccache >/dev/null 2>&1; then
            echo "ccache found: $(ccache --version | head -1)"
          elif command -v brew >/dev/null 2>&1 && [ -w "$(brew --prefix)/Cellar" ] 2>/dev/null; then
            echo "::warning::ccache not found — installing via brew"
            brew install ccache
          else
            echo "::warning::ccache unavailable and brew not writable — building without compiler cache"
            echo "USE_CCACHE=0" >> "$GITHUB_ENV"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Restore CocoaPods cache
        uses: actions/cache/restore@v4
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: pods-${{ runner.os }}-xcode26_3-${{ hashFiles('yarn.lock', 'packages/app/package.json', 'packages/app/app.config.js', 'packages/app/ios/Podfile.properties.json') }}
          restore-keys: |
            pods-${{ runner.os }}-xcode26_3-
            pods-${{ runner.os }}-

      - name: Setup ccache
        if: steps.setup-ccache.outputs.available != 'false'
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --zero-stats || true

      - name: Restore ccache
        if: steps.setup-ccache.outputs.available != 'false'
        uses: actions/cache/restore@v4
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-xcode26_3-e2e-${{ hashFiles('yarn.lock', 'packages/app/package.json', 'packages/app/app.config.js', 'packages/app/ios/Podfile.properties.json') }}
          restore-keys: |
            ccache-${{ runner.os }}-xcode26_3-e2e-
            ccache-${{ runner.os }}-

      - name: Expo Prebuild
        working-directory: packages/app
        env:
          RCT_USE_PREBUILT_RNCORE: "1"
          RCT_USE_RN_DEP: "1"
        run: |
          mkdir -p "$IOS_DERIVED_DATA"
          npx expo prebuild -p ios

      - name: Sync CocoaPods for E2E excludes
        working-directory: packages/app/ios
        run: |
          APP_VARIANT=e2e pod install

          if grep -En "expo-dev-client|expo-dev-launcher|expo-dev-menu|expo-dev-menu-interface" Podfile.lock Pods/Manifest.lock; then
            echo "::error::E2E iOS pod graph still includes Expo dev client pods."
            exit 1
          fi

      - name: Restore Xcode DerivedData cache
        continue-on-error: true
        run: |
          # Use script-based cache restore with hard timeout to avoid
          # actions/cache/restore@v4 hanging when GitHub Cache API is slow.
          echo "Skipping DerivedData cache restore (actions/cache hangs on large caches)."
          echo "The build will use ccache to speed up recompilation instead."

      - name: Shutdown stale simulators
        run: xcrun simctl shutdown all || true

      - name: Start iOS Simulator
        uses: futureware-tech/simulator-action@v4
        with:
          model: 'iPhone 17 Pro'

      - name: Capture simulator UDID
        run: |
          BOOTED_UDIDS="$(
            xcrun simctl list devices booted |
              sed -n 's/.*(\([A-F0-9-]\{36\}\)) (Booted).*/\1/p'
          )"

          BOOTED_COUNT="$(printf '%s\n' "$BOOTED_UDIDS" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$BOOTED_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly 1 booted simulator, found $BOOTED_COUNT."
            xcrun simctl list devices booted
            exit 1
          fi

          SIMULATOR_UDID="$(printf '%s\n' "$BOOTED_UDIDS" | sed -n '1p')"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          echo "Using simulator UDID: $SIMULATOR_UDID"
          xcrun simctl list devices booted

      - name: Pre-copy vec.xcframework for ExpoSQLite
        run: |
          XCFW_DIR="$IOS_DERIVED_DATA/Build/Products/Release-iphonesimulator/XCFrameworkIntermediates/ExpoSQLite"
          mkdir -p "$XCFW_DIR"
          cp -R node_modules/expo-sqlite/ios/vec.xcframework/ios-arm64-simulator/vec.framework "$XCFW_DIR/"

      - name: Build app
        working-directory: packages/app
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(echo "$WORKSPACE" | sed 's/.xcworkspace//')
          echo "Building workspace: $WORKSPACE, scheme: $SCHEME"
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath "$IOS_DERIVED_DATA" \
            -destination "id=$SIMULATOR_UDID" \
            -jobs $(sysctl -n hw.ncpu) \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            EXCLUDED_ARCHS=x86_64

      - name: Install app on Simulator
        run: |
          APP_PATH=$(find "$IOS_DERIVED_DATA" -name "*.app" -path "*Release-iphonesimulator*" | head -1)
          echo "Installing app from: $APP_PATH"
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"

      - name: Install Maestro
        run: |
          export MAESTRO_VERSION=2.3.0; curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Prepare iOS E2E artifact directories
        run: |
          mkdir -p tests/app-tests/artifacts/maestro
          mkdir -p tests/app-tests/artifacts/simulator
          mkdir -p tests/app-tests/artifacts/diagnostics

      - name: Start iOS Simulator log capture
        run: |
          ARTIFACT_DIR="$GITHUB_WORKSPACE/tests/app-tests/artifacts/simulator"
          xcrun simctl spawn "$SIMULATOR_UDID" log stream --style compact --level debug > "$ARTIFACT_DIR/simulator.log" 2>&1 &
          echo $! > "$ARTIFACT_DIR/simulator-log.pid"

      - name: Start iOS Simulator video recording
        run: |
          ARTIFACT_DIR="$GITHUB_WORKSPACE/tests/app-tests/artifacts/simulator"
          xcrun simctl io "$SIMULATOR_UDID" recordVideo "$ARTIFACT_DIR/simulator.mov" > "$ARTIFACT_DIR/record-video.log" 2>&1 &
          echo $! > "$ARTIFACT_DIR/record-video.pid"

      - name: Run Maestro UI tests
        working-directory: tests/app-tests
        shell: bash
        run: |
          set -euo pipefail
          sh ./scripts/setup-ios-simulator.sh "$SIMULATOR_UDID" com.vitalyiegorov.budgie.e2e
          sh ./scripts/run-maestro-suite.sh com.vitalyiegorov.budgie.e2e \
            --format junit \
            --output ./artifacts/maestro/report.xml \
            --debug-output ./artifacts/maestro \
            --test-output-dir ./artifacts/maestro \
            2>&1 | tee ./artifacts/maestro/maestro-console.log

      - name: Stop iOS Simulator captures
        if: always()
        run: |
          ARTIFACT_DIR="$GITHUB_WORKSPACE/tests/app-tests/artifacts/simulator"
          DIAGNOSTIC_DIR="$GITHUB_WORKSPACE/tests/app-tests/artifacts/diagnostics"
          xcrun simctl io "$SIMULATOR_UDID" screenshot "$ARTIFACT_DIR/final-screen.png" || true

          if [ -f "$ARTIFACT_DIR/record-video.pid" ]; then
            kill -INT "$(cat "$ARTIFACT_DIR/record-video.pid")" || true
            sleep 5
          fi

          if [ -f "$ARTIFACT_DIR/simulator-log.pid" ]; then
            kill "$(cat "$ARTIFACT_DIR/simulator-log.pid")" || true
          fi

          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f \
            \( -name 'budgieE2E*' -o -name 'budgie*' -o -name 'JetsamEvent*' \) \
            -exec cp {} "$DIAGNOSTIC_DIR/" \; || true

      - name: Upload Maestro artifacts (report, logs, videos, screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios-artifacts
          include-hidden-files: true
          path: |
            tests/app-tests/artifacts/maestro/**
            tests/app-tests/.maestro/**
          if-no-files-found: warn

      - name: Upload iOS simulator crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios-simulator-failure-artifacts
          include-hidden-files: true
          path: |
            tests/app-tests/artifacts/simulator/**
            tests/app-tests/artifacts/diagnostics/**
          if-no-files-found: warn

      - name: Save CocoaPods cache
        if: always()
        uses: actions/cache/save@v4
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: pods-${{ runner.os }}-xcode26_3-${{ hashFiles('yarn.lock', 'packages/app/package.json', 'packages/app/app.config.js', 'packages/app/ios/Podfile.properties.json') }}

      - name: Save ccache
        if: always() && steps.setup-ccache.outputs.available != 'false'
        uses: actions/cache/save@v4
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-xcode26_3-e2e-${{ hashFiles('yarn.lock', 'packages/app/package.json', 'packages/app/app.config.js', 'packages/app/ios/Podfile.properties.json') }}

      # DerivedData cache save disabled — actions/cache/save@v4 hangs
      # when uploading large caches during GitHub Cache API slowdowns.
      # ccache handles incremental build speedups instead.

  e2e-android:
    if: false
    needs: [code-quality, eas-deploy]
    name: E2E Tests on Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: |
          yarn install

      - name: Apply E2E autolinking excludes
        working-directory: packages/app
        run: |
          node <<'NODE'
          const fs = require('fs');
          const packageJsonPath = 'package.json';
          const packageJson = JSON.parse(fs.readFileSync(packageJsonPath, 'utf8'));

          packageJson.expo ??= {};
          packageJson.expo.autolinking ??= {};
          packageJson.expo.autolinking.exclude = [
            'expo-dev-client',
            'expo-dev-launcher',
            'expo-dev-menu',
            'expo-dev-menu-interface'
          ];

          fs.writeFileSync(packageJsonPath, `${JSON.stringify(packageJson, null, 4)}\n`);
          console.log('Applied expo.autolinking.exclude for e2e build');
          NODE

      - name: Expo Prebuild
        working-directory: packages/app
        run: npx expo prebuild -p android --clean

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('packages/app/android/**/*.gradle*', 'packages/app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34

      - name: Build app
        working-directory: packages/app
        run: |
          eas build --profile=e2e --platform android --non-interactive --local --output app.android.apk

      - name: Install Maestro
        run: |
          export MAESTRO_VERSION=2.3.0; curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Сreate AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          channel: canary
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Start emulator and run Maestro tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          channel: canary
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: tests/app-tests
          script: |
            cd ../../packages/app && eas build:run --platform android --path app.android.apk
            sh ./scripts/run-maestro-suite.sh com.vitaliiyehorov.budgie.e2e --config config.yaml --format junit --output ./report.xml --debug-output ./ && killall -INT crashpad_handler

      - name: Upload Maestro artifacts (report, logs, videos, screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-artifacts
          include-hidden-files: true
          path: |
            tests/app-tests/.maestro/**
            tests/app-tests/*.mp4

name: Pull Request
env:
    TURBO_TEAM: vitalyiegorov
    TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    PR_NUMBER: ${{ github.event.pull_request.number }}

concurrency:
    group: pr-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on: pull_request

permissions:
    contents: read

jobs:
    detect-mobile-impact:
        name: Detect mobile impact
        runs-on: [self-hosted, linux-portable-2x4]
        timeout-minutes: 15
        permissions:
            contents: read
            pull-requests: read
        outputs:
            mobile: ${{ steps.gate.outputs.mobile }}
        steps:
            - name: Compute mobile-impact gate
              id: gate
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  script: |
                      let mobile = true;

                      try {
                        const files = await github.paginate(github.rest.pulls.listFiles, {
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          pull_number: context.issue.number,
                          per_page: 100,
                        });
                        const mobileSuiteExempt = files.length > 0 && files.every(({ filename }) =>
                          filename.startsWith('packages/landing/') ||
                          filename.startsWith('docs/') ||
                          filename.endsWith('.md') ||
                          filename === 'LICENSE' ||
                          filename === '.gitattributes' ||
                          filename === '.gitignore' ||
                          filename === '.editorconfig' ||
                          filename === '.github/CODEOWNERS' ||
                          filename === '.github/dependabot.yml' ||
                          filename.startsWith('tests/app-tests/flows/media/') ||
                          filename.startsWith('tests/app-tests/fixtures/screenshots/') ||
                          filename.startsWith('packages/app/fastlane/') ||
                          filename === '.github/landing-media.config.json' ||
                          filename === '.github/store-screenshots.config.json' ||
                          filename === 'tests/app-tests/scripts/seed-screenshot-scene.sh' ||
                          filename === 'tests/app-tests/scripts/capture-store-screenshots.sh' ||
                          (filename.startsWith('tests/app-tests/scripts/') &&
                            (/^test-|media|compose/.test(filename.slice('tests/app-tests/scripts/'.length))))
                        );
                        mobile = !mobileSuiteExempt;
                        core.info(`Inspected ${files.length} changed files; mobile affected: ${mobile}`);
                      } catch (error) {
                        core.warning(`Could not inspect PR files; defaulting to mobile=true: ${error.message}`);
                      }

                      core.setOutput('mobile', mobile ? 'true' : 'false');

    code-quality:
        name: Code quality checks
        # GitHub-hosted (public repo: 4 vCPU / 16 GiB, no queue). The monorepo
        # typecheck + type-aware oxlint + build need more than the fleet's 4 GiB
        # 2x4 pool, and the 4x8 pool is the KVM pool Android e2e queues on.
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
            pull-requests: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22.22.1
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lingui catalogs are up to date
              run: pnpm i18n:check

            - name: Read current PR title
              id: current-pr
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  script: |
                      const { data } = await github.rest.pulls.get({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        pull_number: context.issue.number,
                      });
                      core.setOutput('title', data.title);

            - name: Lint the PR Title
              env:
                  PR_TITLE: ${{ steps.current-pr.outputs.title }}
              run: printf '%s\n' "$PR_TITLE" | node_modules/.bin/commitlint

            - name: Formatting checks
              run: pnpm format:check

            - name: Typescript checks
              run: pnpm ts

            - name: Effect diagnostics
              run: pnpm effect:check

            - name: Maestro selector checks
              run: pnpm --filter @budgie-at/app-tests selectors:check

            - name: Lint checks
              run: pnpm lint

            - name: Deadcode detection
              run: pnpm deadcode

            - name: Copy/Paste detection
              run: pnpm cpd

            - name: Build
              run: pnpm build

            - name: Unit tests
              run: pnpm test

            - name: Verify generated files are committed
              run: git diff --exit-code

    e2e-script-tests:
        name: E2E script self-tests
        runs-on: [self-hosted, linux-portable-2x4]
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22.22.1

            - name: Install sqlite3 and ruby
              timeout-minutes: 3
              run: |
                  if command -v sqlite3 && command -v ruby; then exit 0; fi
                  for _ in 1 2 3; do
                    timeout 90 sudo apt-get -o Acquire::Retries=3 update -qq \
                      && timeout 90 sudo apt-get install -y --no-install-recommends sqlite3 ruby \
                      && exit 0
                    sleep 5
                  done
                  exit 1

            - name: Store metadata budgets
              run: bash .github/scripts/check-store-metadata.sh

            - name: Run E2E script self-tests
              run: |
                  set -euo pipefail
                  for t in tests/app-tests/scripts/test-*.sh; do
                    echo "== $t"
                    bash "$t"
                  done

    assert-ai-ota:
        if: needs.detect-mobile-impact.outputs.mobile == 'true'
        needs: [detect-mobile-impact]
        name: Assert AI is enabled (OTA preview)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22.22.1
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Assert AI is enabled
              run: bash .github/scripts/assert-ai-enabled.sh

    ota-preview:
        if: needs.detect-mobile-impact.outputs.mobile == 'true'
        needs: [detect-mobile-impact, assert-ai-ota]
        name: OTA preview
        permissions:
            contents: write
            pull-requests: write
        uses: rnw-community/mobile-ci/.github/workflows/expo-ota-preview.yml@b9502c1c3ea1c933485b3e657b47574072ed7ddf # v3.3.1
        with:
            app-dir: packages/app
            scheme: budgie
            platforms: ios,android
            package-manager: pnpm
            install-command: pnpm install --frozen-lockfile
            runner-labels: '["self-hosted","trf-linux-amd64-4x8"]'
            build-command: pnpm exec turbo build --filter='@budgie/*'
            release-tag-prefix: ota-pr${{ github.event.pull_request.number }}
            prune-keep: '100'

    fingerprint-guard:
        if: needs.detect-mobile-impact.outputs.mobile == 'true'
        needs: [detect-mobile-impact]
        name: Native runtime fingerprint
        permissions:
            contents: read
            pull-requests: read
        uses: rnw-community/mobile-ci/.github/workflows/expo-fingerprint-guard.yml@b9502c1c3ea1c933485b3e657b47574072ed7ddf # v3.3.1
        with:
            working-directory: packages/app
            platforms: ios,android
            app-env: |
                APP_VARIANT=production
            package-manager: pnpm
            install-command: pnpm install --frozen-lockfile
            runner-labels: '["self-hosted","linux-portable-4x8"]'
            node-version: 22.22.1

    ios-maestro:
        if: needs.detect-mobile-impact.outputs.mobile == 'true'
        needs: [detect-mobile-impact, code-quality]
        name: iOS Maestro E2E
        # A reusable workflow can only narrow the token it is given: the base
        # binary every pull request repacks is fetched (packages) and published
        # (packages: write, default-branch runs) by mobile-ci's plan/build jobs,
        # and this repository's default workflow token permission is read.
        permissions:
            contents: read
            packages: write
            actions: read
        uses: rnw-community/mobile-ci/.github/workflows/ios-maestro.yml@b9502c1c3ea1c933485b3e657b47574072ed7ddf # v3.3.1
        with:
            build-runner-labels: '["self-hosted","macOS","ARM64","macos-builder","trf-budgie-builder-2"]'
            test-runner-labels: '["self-hosted","macOS","ARM64","macos-maestro"]'
            # Gate on the turbo graph as well as detect-mobile-impact's path
            # list: iOS Maestro runs only when the app, its workspace
            # dependencies or the Maestro suite changed.
            turbo-version: 2.11.5
            target-packages: |
                @budgie-at/app
                @budgie-at/app-tests
            # This file wires the e2e job, and turbo never sees it: a change here
            # runs the suite rather than skipping it.
            trigger-paths: .github/workflows/pr.yml
            targets: >-
                [{"name":"e2e","appDir":"packages/app","workspace":"budgieE2E.xcworkspace","scheme":"budgieE2E",
                "appId":"com.vitalyiegorov.budgie.e2e","prebuildCommand":"npx expo prebuild -p ios --clean --no-install"}]
            build-env: |
                APP_VARIANT=e2e
                EXPO_PUBLIC_AI_DISABLE=true
                EXPO_PUBLIC_LOGGING_DISABLE=true
            flows-dir: tests/app-tests/flows
            shard-count: 2
            shard-manifest-dir: tests/app-tests/shards
            maestro-config: tests/app-tests/config.yaml
            pre-run-flow: tests/app-tests/flows/setup/prime-deep-links.flow.yaml
            flow-recovery-flow: tests/app-tests/flows/setup/recover-after-failed-flow.flow.yaml
            pre-test-command: bash tests/app-tests/scripts/setup-ios-e2e-fixtures.sh "$SIMULATOR_UDID" "$APP_ID"
            pre-flow-command: bash tests/app-tests/scripts/seed-flow-fixture.sh
            flow-retries: '1'
            simulator-device: iPhone 17 Pro
            simulator-reduce-motion: 'true'
            simulator-requires: push,universal-links
            test-timeout-minutes: 110
            install-command: pnpm install --frozen-lockfile
            package-manager: pnpm
            build-command: pnpm exec turbo build --filter='@budgie/*'
            rct-use-prebuilt-rncore: true
            rct-use-rn-dep: true
            expo-use-precompiled-modules: true
            fingerprint-env: |
                APP_VARIANT=e2e
                EXPO_PUBLIC_AI_DISABLE=true
                EXPO_PUBLIC_LOGGING_DISABLE=true
            repack-env: |
                APP_VARIANT=e2e
                EXPO_PUBLIC_AI_DISABLE=true
                EXPO_PUBLIC_LOGGING_DISABLE=true
            expect-config: |
                extra.appVariant=e2e
                extra.aiEnabled=false
                extra.loggingEnabled=false

    store-screenshots-gallery:
        name: Store screenshots gallery
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: [self-hosted, linux-portable-2x4]
        timeout-minutes: 10
        permissions:
            pull-requests: write
        steps:
            - name: Post or update the screenshot gallery comment
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  script: |
                      const marker = '<!-- budgie-store-screenshots-gallery -->';
                      const screenshotPathPattern = /^packages\/app\/fastlane\/screenshots\/variants\/.*\.png$/i;
                      const orderedLocales = ['en-US', 'fr-FR', 'uk', 'de-DE', 'es-ES'];
                      const maxImages = 40;

                      const files = await github.paginate(github.rest.pulls.listFiles, {
                        ...context.repo,
                        pull_number: context.issue.number,
                        per_page: 100,
                      });
                      const screenshots = files
                        .filter(file => file.status !== 'removed')
                        .map(file => file.filename)
                        .filter(filename => screenshotPathPattern.test(filename));

                      const comments = await github.paginate(github.rest.issues.listComments, {
                        ...context.repo,
                        issue_number: context.issue.number,
                        per_page: 100,
                      });
                      const existingComment = comments.find(comment => comment.body?.startsWith(marker));

                      if (screenshots.length === 0) {
                        if (existingComment) {
                          await github.rest.issues.deleteComment({ ...context.repo, comment_id: existingComment.id });
                          core.info('No store screenshot changes left in this PR; removed the stale gallery comment.');
                          return;
                        }
                        core.info('No store screenshot changes in this PR; skipping the gallery comment.');
                        return;
                      }

                      const headSha = context.payload.pull_request.head.sha;
                      const groups = new Map();
                      const iPadDirectories = new Set();

                      for (const path of screenshots) {
                        const segments = path.split('/');
                        const variantsIndex = segments.indexOf('variants');
                        const appearance = segments[variantsIndex + 1] === 'dark' ? 'dark' : 'light';
                        const locale = segments[variantsIndex + 3];

                        if (/ipad/i.test(path)) {
                          iPadDirectories.add(segments.slice(0, -1).join('/'));
                          continue;
                        }
                        const key = `${appearance} ${locale}`;
                        if (!groups.has(key)) {
                          groups.set(key, []);
                        }
                        groups.get(key).push(path);
                      }

                      const localesPresent = new Set([...groups.keys()].map(key => key.split(' ')[1]));
                      const extraLocales = [...localesPresent].filter(locale => !orderedLocales.includes(locale)).sort();
                      const displayLocales = [...orderedLocales, ...extraLocales];

                      const lines = [marker, '### Store screenshots (iPhone)', ''];
                      let shown = 0;

                      for (const appearance of ['light', 'dark']) {
                        const localesForAppearance = displayLocales.filter(locale => groups.has(`${appearance} ${locale}`));
                        if (localesForAppearance.length === 0) {
                          continue;
                        }
                        lines.push(`#### ${appearance === 'light' ? 'Light' : 'Dark'}`, '');
                        lines.push(`| ${localesForAppearance.join(' | ')} |`);
                        lines.push(`| ${localesForAppearance.map(() => '---').join(' | ')} |`);
                        const row = localesForAppearance.map(locale => {
                          const paths = groups.get(`${appearance} ${locale}`) ?? [];
                          return paths
                            .filter(() => {
                              if (shown >= maxImages) {
                                return false;
                              }
                              shown += 1;
                              return true;
                            })
                            .map(path => `<img width="180" src="https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${headSha}/${path}">`)
                            .join('<br>');
                        });
                        lines.push(`| ${row.join(' | ')} |`, '');
                      }

                      if (shown >= maxImages) {
                        lines.push(`_Showing the first ${maxImages} screenshots; see the full diff for the rest._`, '');
                      }
                      if (iPadDirectories.size > 0) {
                        lines.push('iPad sets:', '');
                        for (const directory of [...iPadDirectories].sort()) {
                          lines.push(`- [\`${directory}\`](https://github.com/${context.repo.owner}/${context.repo.repo}/tree/${headSha}/${directory})`);
                        }
                        lines.push('');
                      }

                      const body = lines.join('\n');

                      if (existingComment) {
                        await github.rest.issues.updateComment({ ...context.repo, comment_id: existingComment.id, body });
                      } else {
                        await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
                      }

    lint-workflows:
        name: Lint workflows
        # Catches workflow files GitHub would reject at startup (e.g. a key
        # duplicated by two merged PRs) before they reach main.
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Run actionlint
              shell: bash
              env:
                  ACTIONLINT_VERSION: 1.7.12
                  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
              run: |
                  set -euo pipefail
                  dir="$(mktemp -d)"
                  archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  curl -fsSL --retry 3 -o "$dir/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
                  echo "${ACTIONLINT_SHA256}  $dir/$archive" | sha256sum -c -
                  tar -xzf "$dir/$archive" -C "$dir" actionlint
                  "$dir/actionlint" -color

    required-ci:
        name: Required CI
        # The single check to mark required: it waits for every job above and
        # fails if any of them failed or was cancelled. A skipped job (mobile
        # impact gate off, fork PR) counts as passing. always(), not
        # !cancelled(): a cancelled run must still run this job and fail it,
        # because GitHub treats a skipped required check as passing.
        if: ${{ always() }}
        needs:
            - detect-mobile-impact
            - lint-workflows
            - code-quality
            - e2e-script-tests
            - assert-ai-ota
            - ota-preview
            - fingerprint-guard
            - ios-maestro
            - store-screenshots-gallery
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions: {}
        steps:
            - name: Check every required job succeeded or was skipped
              env:
                  NEEDS_JSON: ${{ toJSON(needs) }}
              run: |
                  set -euo pipefail
                  printf '%s' "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
                  failed="$(printf '%s' "$NEEDS_JSON" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')"
                  if [ -n "$failed" ]; then
                    echo "::error::Required jobs did not succeed: $failed"
                    exit 1
                  fi

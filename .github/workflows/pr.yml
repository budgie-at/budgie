name: Pull Request
env:
  MAESTRO_DRIVER_STARTUP_TIMEOUT: "120000"
  TURBO_TEAM: vitalyiegorov
  TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  PR_TITLE: ${{ github.event.pull_request.title }}
  MAESTRO_CLI_NO_ANALYTICS: false
  RCT_USE_PREBUILT_RNCORE: 1
  RCT_USE_RN_DEP: 1

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on: pull_request

jobs:
  code-quality:
    name: Code quality checks
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Lint the PR Title
        run: echo "${{env.PR_TITLE}}" | node_modules/.bin/commitlint

      - name: Typescript checks
        run: yarn turbo ts

      - name: ESLint checks
        run: yarn turbo lint

      - name: Deadcode detection
        run: yarn turbo deadcode

      - name: Copy/Paste detection
        run: yarn turbo cpd

      - name: Unit tests
        run: yarn test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3

  eas-deploy:
    name: EAS Deploy
    needs: code-quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write
      issues: write
    outputs:
      deployment_url: ${{ steps.deploy-web.outputs.deployment_url }}
      projectId: ${{ steps.create-preview.outputs.projectId }}
      iosGroupId: ${{ steps.create-preview.outputs.iosGroupId }}
      androidGroupId: ${{ steps.create-preview.outputs.androidGroupId }}
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project."
            echo "Learn more: https://docs.expo.dev/eas/github-actions"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install

      - name: Create preview
        id: create-preview
        working-directory: packages/app
        run: |
          eas update --channel development --message "PR #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}"

      - name: Build web app
        working-directory: packages/app
        run: npx expo export --platform web

      - name: Deploy web app
        id: deploy-web
        working-directory: packages/app
        run: |
          result="$(eas deploy --non-interactive --json)"
          echo "$result"

          # Extract the URL from the deployment result
          url=$(echo "$result" | jq -r '.url // empty')
          if [ -n "$url" ]; then
            echo "deployment_url=$url" >> $GITHUB_OUTPUT
            echo "## 🚀 Web App Deployment" >> $GITHUB_STEP_SUMMARY
            echo "Your PR has been deployed and is available at: [$url]($url)" \
              >> $GITHUB_STEP_SUMMARY
          fi

      - name: Create deployment environment
        if: steps.deploy-web.outputs.deployment_url
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentUrl = '${{ steps.deploy-web.outputs.deployment_url }}';

            // Create deployment
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
              environment: 'preview',
              description: 'PR Preview Deployment',
              auto_merge: false,
              required_contexts: []
            });

            // Create deployment status
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: deploymentUrl,
              description: 'Web app deployed successfully'
            });

      - name: Comment deployment URL on PR
        if: steps.deploy-web.outputs.deployment_url
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentUrl = '${{ steps.deploy-web.outputs.deployment_url }}';
            const prNumber = context.payload.pull_request.number;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const existingComment = comments.data.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('🚀 Preview Deployment')
            );

            const commentBody = '## 🚀 Preview Deployment\n\n' +
              'Your PR has been deployed! You can test the changes at:\n\n' +
              '🌐 **[Open Preview App](' + deploymentUrl + ')**\n\n' +
              'This deployment will be automatically updated with new commits.';

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
            }


  e2e-ios:
    needs: [code-quality]
    name: E2E Tests on iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Restore CocoaPods cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: pods-${{ runner.os }}-${{ hashFiles('packages/app/package.json') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Expo Prebuild
        working-directory: packages/app
        env:
          APP_VARIANT: preview
          RCT_USE_PREBUILT_RNCORE: "1"
          RCT_USE_RN_DEP: "1"
        run: npx expo prebuild -p ios

      - name: Restore Xcode DerivedData cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('packages/app/ios/Podfile.lock') }}
          restore-keys: deriveddata-${{ runner.os }}-

      - name: Start iOS Simulator
        uses: futureware-tech/simulator-action@v4
        with:
          model: 'iPhone 16 Pro'

      - name: Pre-copy vec.xcframework for ExpoSQLite
        run: |
          XCFW_DIR=~/Library/Developer/Xcode/DerivedData/Build/Products/Release-iphonesimulator/XCFrameworkIntermediates/ExpoSQLite
          mkdir -p "$XCFW_DIR"
          cp -R node_modules/expo-sqlite/ios/vec.xcframework/ios-arm64-simulator/vec.framework "$XCFW_DIR/"

      - name: Build app
        working-directory: packages/app
        env:
          APP_VARIANT: preview
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(echo "$WORKSPACE" | sed 's/.xcworkspace//')
          echo "Building workspace: $WORKSPACE, scheme: $SCHEME"
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -jobs $(sysctl -n hw.ncpu) \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Install app on Simulator
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -path "*Release-iphonesimulator*" | head -1)
          echo "Installing app from: $APP_PATH"
          xcrun simctl install booted "$APP_PATH"

      - name: Install Maestro
        run: |
          export MAESTRO_VERSION=2.0.3; curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run Maestro UI tests
        working-directory: tests/app-tests
        run: |
          sh ./scripts/setup-ios-simulator.sh
          maestro test flows -e APP_ID=com.vitalyiegorov.budgie.preview --format junit --config config.yaml --debug-output ./

      - name: Upload Maestro artifacts (report, logs, videos, screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios-artifacts
          include-hidden-files: true
          path: |
            tests/app-tests/.maestro/**
            tests/app-tests/*.mp4

      - name: Save CocoaPods cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: pods-${{ runner.os }}-${{ hashFiles('packages/app/package.json') }}

      - name: Save Xcode DerivedData cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('packages/app/ios/Podfile.lock') }}

  e2e-android:
    if: false
    needs: [code-quality, eas-deploy]
    name: E2E Tests on Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: |
          yarn install

      - name: Expo Prebuild
        working-directory: packages/app
        run: npx expo prebuild -p android --clean

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('packages/app/android/**/*.gradle*', 'packages/app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34

      - name: Build app
        working-directory: packages/app
        run: |
          eas build --profile=e2e --platform android --non-interactive --local --output app.android.apk

      - name: Install Maestro
        run: |
          export MAESTRO_VERSION=2.0.3; curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Сreate AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          channel: canary
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Start emulator and run Maestro tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          channel: canary
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: tests/app-tests
          script: |
            cd ../../packages/app && eas build:run --platform android --path app.android.apk
            maestro test flows -e APP_ID=com.vitaliiyehorov.budgie.preview --config config.yaml --format junit --output ./report.xml --debug-output ./ && killall -INT crashpad_handler

      - name: Upload Maestro artifacts (report, logs, videos, screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-artifacts
          include-hidden-files: true
          path: |
            tests/app-tests/.maestro/**
            tests/app-tests/*.mp4

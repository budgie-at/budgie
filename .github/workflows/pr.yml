name: Pull Request
env:
    MAESTRO_DRIVER_STARTUP_TIMEOUT: '120000'
    TURBO_TEAM: vitalyiegorov
    TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    PR_NUMBER: ${{ github.event.pull_request.number }}
    PR_TITLE: ${{ github.event.pull_request.title }}
    MAESTRO_CLI_NO_ANALYTICS: 'true'
    MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
    MAESTRO_VERSION: '2.6.1'
    EAS_CLI_VERSION: '20.5.1'
    EXPO_REPACK_VERSION: '0.7.2'
    RCT_USE_PREBUILT_RNCORE: 1
    RCT_USE_RN_DEP: 1

concurrency:
    group: pr-${{ github.event.pull_request.number }}
    cancel-in-progress: true

on: pull_request

jobs:
    detect-mobile-impact:
        name: Detect mobile impact
        runs-on: [self-hosted, linux-tiered, linux-medium]
        timeout-minutes: 15
        permissions:
            contents: read
            pull-requests: read
        outputs:
            mobile: ${{ steps.gate.outputs.mobile }}
        steps:
            - name: Compute mobile-impact gate
              id: gate
              uses: actions/github-script@v8
              with:
                  script: |
                      let mobile = true;

                      try {
                        const files = await github.paginate(github.rest.pulls.listFiles, {
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          pull_number: context.issue.number,
                          per_page: 100,
                        });
                        const landingOnly = files.length > 0 && files.every(({ filename }) =>
                          filename.startsWith('packages/landing/') ||
                          filename.startsWith('docs/') ||
                          filename === 'README.md' ||
                          filename === 'LICENSE'
                        );
                        mobile = !landingOnly;
                        core.info(`Inspected ${files.length} changed files; mobile affected: ${mobile}`);
                      } catch (error) {
                        core.warning(`Could not inspect PR files; defaulting to mobile=true: ${error.message}`);
                      }

                      core.setOutput('mobile', mobile ? 'true' : 'false');

    code-quality:
        name: Code quality checks
        runs-on: [self-hosted, linux-tiered, linux-large]
        timeout-minutes: 60
        permissions:
            contents: read
        outputs:
            coverage-artifact-id: ${{ steps.upload-coverage.outputs.artifact-id }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 22.22.1

            - name: Install dependencies
              run: yarn install --immutable

            - name: Lingui catalogs are up to date
              run: yarn i18n:check

            - name: Lint the PR Title
              # Dependabot titles carry the 'deps' scope, which config-lerna-scopes
              # rejects because it only accepts workspace package names.
              if: github.actor != 'dependabot[bot]'
              run: printf '%s\n' "$PR_TITLE" | node_modules/.bin/commitlint

            - name: Formatting checks
              run: yarn format:check

            - name: Typescript checks
              run: yarn ts

            - name: Maestro selector checks
              run: yarn workspace @budgie-at/app-tests selectors:check

            - name: Lint checks
              run: yarn lint

            - name: Deadcode detection
              run: yarn deadcode

            - name: Copy/Paste detection
              run: yarn cpd

            - name: Build
              run: yarn build

            - name: Unit tests
              run: yarn test:coverage

            - name: Verify generated files are committed
              run: git diff --exit-code

            - name: Upload coverage artifact
              id: upload-coverage
              uses: actions/upload-artifact@v6
              with:
                  name: coverage-reports
                  path: |
                      **/coverage/**
                      !**/node_modules/**
                  if-no-files-found: ignore
                  retention-days: 1

    codecov:
        if: ${{ needs.code-quality.outputs.coverage-artifact-id != '' }}
        needs: [code-quality]
        name: Upload coverage reports
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5
              with:
                  persist-credentials: false

            - name: Download coverage artifact
              uses: actions/download-artifact@v6
              with:
                  name: coverage-reports
                  path: coverage-reports

            - name: Upload coverage reports to Codecov
              uses: codecov/codecov-action@v5
              with:
                  directory: coverage-reports
                  use_oidc: true

    eas-update-preview:
        # Dependabot-triggered runs are never given repository secrets, so
        # EXPO_TOKEN arrives empty and the preview export can only ever fail.
        if: needs.detect-mobile-impact.outputs.mobile == 'true' && github.actor != 'dependabot[bot]'
        needs: [detect-mobile-impact]
        name: EAS Update Preview
        # Expo's Hermes compiler package ships an x86-64 Linux host binary.
        # Keep this export on the hosted x86-64 image and reserve the Mac mini
        # for the native iOS build and simulator stages below.
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        permissions:
            contents: read
        steps:
            - name: Check for EXPO_TOKEN
              run: |
                  if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
                    echo "You must provide an EXPO_TOKEN secret linked to this project."
                    echo "Learn more: https://docs.expo.dev/eas/github-actions"
                    exit 1
                  fi

            - name: Verify x86-64 Hermes host
              run: test "$(uname -m)" = 'x86_64'

            - name: Checkout repository
              uses: actions/checkout@v5
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 22.x

            - name: Setup EAS
              uses: expo/expo-github-action@v9
              with:
                  eas-version: ${{ env.EAS_CLI_VERSION }}
                  token: ${{ secrets.EXPO_TOKEN }}

            - name: Install dependencies
              run: yarn install

            - name: Build internal workspace packages
              run: yarn turbo build --filter=@budgie/contracts --filter=@budgie/ai --filter=@budgie/bank-sync --filter=@budgie/consolidation --filter=@budgie/budget

            - name: Create preview
              id: create-preview
              working-directory: packages/app
              env:
                  APP_VARIANT: development
                  USE_CCACHE: '1'
              run: |
                  yarn expo export --output-dir dist --dump-assetmap --platform ios --platform android
                  eas update --skip-bundler --input-dir dist --channel development --message "PR #$PR_NUMBER - $PR_TITLE"

    build-ios-e2e-app:
        if: needs.detect-mobile-impact.outputs.mobile == 'true'
        needs: [detect-mobile-impact, code-quality]
        name: Build iOS E2E app
        runs-on: [self-hosted, macOS, ARM64, macos-builder]
        timeout-minutes: 120
        permissions:
            contents: read
        env:
            APP_VARIANT: e2e
            EXPO_PUBLIC_AI_DISABLE: 'true'
            EXPO_PUBLIC_LOGGING_DISABLE: 'true'
            EXPO_USE_PRECOMPILED_MODULES: '1'
            RCT_USE_PREBUILT_RNCORE: '1'
            RCT_USE_RN_DEP: '1'
            IOS_DERIVED_DATA: ${{ github.workspace }}/.ci-cache/DerivedData/budgie-e2e
            USE_CCACHE: '1'
            CCACHE_DIR: ${{ github.workspace }}/.ci-cache/ccache
            CCACHE_BASEDIR: ${{ github.workspace }}
            CCACHE_COMPRESS: 'true'
            CCACHE_MAXSIZE: 2G
            CCACHE_NOHASHDIR: 'true'
        steps:
            - uses: actions/checkout@v5
              with:
                  persist-credentials: false

            - name: E2E script self-tests
              run: |
                  set -euo pipefail
                  for t in tests/app-tests/scripts/test-*.sh; do
                    echo "== $t"
                    bash "$t"
                  done

            - name: Setup macOS toolchain PATH
              shell: bash
              run: |
                  echo "$HOME/.rbenv/shims" >> "$GITHUB_PATH"
                  echo '/opt/homebrew/bin' >> "$GITHUB_PATH"
                  echo '/opt/homebrew/sbin' >> "$GITHUB_PATH"

            - name: Runner diagnostics
              run: |
                  whoami
                  uname -m
                  hostname
                  ls -1 /Applications | grep -i Xcode || true
                  which pod || true
                  pod --version || true
                  which ccache || true
                  ccache --version || true
                  xcode-select -p || true
                  xcodebuild -version || true

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 22.x

            - name: Install dependencies
              run: yarn install

            - name: Build internal workspace packages
              run: yarn turbo build --filter=@budgie/contracts --filter=@budgie/ai --filter=@budgie/bank-sync --filter=@budgie/consolidation --filter=@budgie/budget

            - name: Setup EAS
              uses: expo/expo-github-action@v9
              with:
                  eas-version: ${{ env.EAS_CLI_VERSION }}
                  token: ${{ secrets.EXPO_TOKEN }}

            - name: Generate native fingerprint
              id: fingerprint
              working-directory: packages/app
              shell: bash
              run: |
                  set -euo pipefail
                  eas fingerprint:generate \
                    --build-profile e2e \
                    --platform ios \
                    --json \
                    --non-interactive > "$RUNNER_TEMP/ios-fingerprint.json"
                  hash=$(jq -er '.hash' "$RUNNER_TEMP/ios-fingerprint.json")
                  echo "hash=$hash" >> "$GITHUB_OUTPUT"
                  echo "Native fingerprint: $hash"

            - name: Restore fingerprinted native app
              id: native-app-cache
              uses: actions/cache/restore@v5
              with:
                  path: .ci-cache/ios-native-app
                  key: ios-native-v1-budgie-e2e-${{ runner.os }}-arm64-xcode26_4_1-17E202-${{ steps.fingerprint.outputs.hash }}

            - name: Repack cached native app
              id: repack
              if: steps.native-app-cache.outputs.cache-hit == 'true'
              continue-on-error: true
              working-directory: packages/app
              shell: bash
              run: |
                  set -euo pipefail
                  output_app="$GITHUB_WORKSPACE/.ci-artifacts/repacked/Budgie.app"
                  mkdir -p "$(dirname "$output_app")"
                  source_app=$(find "$GITHUB_WORKSPACE/.ci-cache/ios-native-app" -maxdepth 1 -name '*.app' -print -quit)
                  test -n "$source_app"
                  npx --yes "@expo/repack-app@$EXPO_REPACK_VERSION" . \
                    --platform ios \
                    --source-app "$source_app" \
                    --output "$output_app" \
                    --embed-bundle-assets
                  test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$output_app/Info.plist")" = 'com.vitalyiegorov.budgie.e2e'
                  ! /usr/libexec/PlistBuddy -c 'Print :DEV_CLIENT_DEFAULT_LAUNCHER_URL' "$output_app/Info.plist" >/dev/null 2>&1
                  find "$output_app" -name 'main.jsbundle' -type f -print -quit | grep -q .

            - name: Plan native build
              id: native-plan
              shell: bash
              run: |
                  if [ "${{ steps.native-app-cache.outputs.cache-hit }}" != 'true' ] || \
                     [ "${{ steps.repack.outcome }}" != 'success' ]; then
                    echo 'required=true' >> "$GITHUB_OUTPUT"
                    if [ "${{ steps.native-app-cache.outputs.cache-hit }}" = 'true' ]; then
                      echo '::warning::Repack failed validation; falling back to a full native build.'
                    fi
                  else
                    echo 'required=false' >> "$GITHUB_OUTPUT"
                  fi

            - name: Select Xcode 26.4.1
              if: steps.native-plan.outputs.required == 'true'
              run: |
                  XCODE_APP=/Applications/Xcode_26.4.1.app
                  if [ ! -d "$XCODE_APP" ]; then
                    echo "::error::Xcode 26.4.1 is not installed on this runner."
                    exit 1
                  fi

                  echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
                  echo "Using Xcode at $XCODE_APP"
                  xcode_version=$("$XCODE_APP/Contents/Developer/usr/bin/xcodebuild" -version)
                  printf '%s\n' "$xcode_version"
                  grep -qx 'Xcode 26.4.1' <<< "$xcode_version"
                  grep -qx 'Build version 17E202' <<< "$xcode_version"

            - name: Restore CocoaPods cache
              if: steps.native-plan.outputs.required == 'true'
              uses: actions/cache/restore@v5
              with:
                  path: |
                      ~/Library/Caches/CocoaPods
                      ~/.cocoapods
                  key: pods-${{ runner.os }}-xcode26_4_1-${{ hashFiles('yarn.lock', 'packages/app/package.json', 'packages/app/app.config.js', 'packages/app/ios/Podfile.properties.json') }}
                  restore-keys: |
                      pods-${{ runner.os }}-xcode26_4_1-
                      pods-${{ runner.os }}-

            - name: Setup ccache
              if: steps.native-plan.outputs.required == 'true'
              run: |
                  mkdir -p "$CCACHE_DIR" "$IOS_DERIVED_DATA"
                  if ! command -v ccache >/dev/null; then
                    command -v brew >/dev/null || {
                      echo "::error::ccache is not installed and Homebrew is unavailable."
                      exit 1
                    }
                    brew list ccache >/dev/null 2>&1 || brew install ccache
                  fi
                  command -v ccache
                  ccache --version
                  ccache --zero-stats || true
                  if command -v brew >/dev/null; then
                    echo "$(brew --prefix ccache)/libexec" >> "$GITHUB_PATH"
                  fi

            - name: Restore ccache
              if: steps.native-plan.outputs.required == 'true'
              uses: actions/cache/restore@v5
              with:
                  path: ${{ env.CCACHE_DIR }}
                  key: ccache-${{ runner.os }}-xcode26_4_1-e2e-${{ hashFiles('yarn.lock', 'packages/app/package.json', 'packages/app/app.config.js', 'packages/app/ios/Podfile.properties.json') }}
                  restore-keys: |
                      ccache-${{ runner.os }}-xcode26_4_1-e2e-
                      ccache-${{ runner.os }}-

            - name: Expo Prebuild
              if: steps.native-plan.outputs.required == 'true'
              working-directory: packages/app
              env:
                  APP_VARIANT: e2e
                  EXPO_PUBLIC_AI_DISABLE: 'true'
              run: npx expo prebuild -p ios --clean --no-install

            - name: Sync CocoaPods
              if: steps.native-plan.outputs.required == 'true'
              working-directory: packages/app/ios
              env:
                  APP_VARIANT: e2e
                  EXPO_PUBLIC_AI_DISABLE: 'true'
              run: |
                  command -v pod
                  pod --version
                  pod install

            - name: Build native Release base
              if: steps.native-plan.outputs.required == 'true'
              working-directory: packages/app
              env:
                  APP_VARIANT: e2e
                  EXPO_PUBLIC_AI_DISABLE: 'true'
              run: |
                  cd ios
                  WORKSPACE=$(ls -d *.xcworkspace | head -1)
                  SCHEME=$(echo "$WORKSPACE" | sed 's/.xcworkspace//')
                  echo "Building workspace: $WORKSPACE, scheme: $SCHEME"
                  xcodebuild build \
                    -workspace "$WORKSPACE" \
                    -scheme "$SCHEME" \
                    -sdk iphonesimulator \
                    -configuration Release \
                    -derivedDataPath "$IOS_DERIVED_DATA" \
                    -destination "generic/platform=iOS Simulator" \
                    -jobs 5 \
                    CODE_SIGN_IDENTITY="-" \
                    AD_HOC_CODE_SIGNING_ALLOWED=YES \
                    PROVISIONING_PROFILE_SPECIFIER="" \
                    COMPILER_INDEX_STORE_ENABLE=NO \
                    ONLY_ACTIVE_ARCH=YES \
                    ARCHS=arm64 \
                    EXCLUDED_ARCHS=x86_64

            - name: Package native base
              if: steps.native-plan.outputs.required == 'true'
              run: |
                  set -euo pipefail
                  APP_PATH=$(find "$IOS_DERIVED_DATA" -name "*.app" -path "*Release-iphonesimulator*" | head -1)
                  if [ -z "$APP_PATH" ]; then
                    echo "::error::Built iOS app bundle was not found in $IOS_DERIVED_DATA."
                    find "$IOS_DERIVED_DATA" -maxdepth 6 -name "*.app" || true
                    exit 1
                  fi
                  test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = 'com.vitalyiegorov.budgie.e2e'
                  if /usr/libexec/PlistBuddy -c 'Print :DEV_CLIENT_DEFAULT_LAUNCHER_URL' "$APP_PATH/Info.plist" >/dev/null 2>&1; then
                    echo '::error::Native E2E base unexpectedly contains a development-client launch URL.'
                    exit 1
                  fi
                  find "$APP_PATH" -name 'main.jsbundle' -type f -print -quit | grep -q .

                  ARTIFACT_DIR="$GITHUB_WORKSPACE/.ci-cache/ios-native-app"
                  mkdir -p "$ARTIFACT_DIR"
                  ditto "$APP_PATH" "$ARTIFACT_DIR/Base.app"

            - name: Save fingerprinted native app
              if: steps.native-app-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v5
              with:
                  path: .ci-cache/ios-native-app
                  key: ios-native-v1-budgie-e2e-${{ runner.os }}-arm64-xcode26_4_1-17E202-${{ steps.fingerprint.outputs.hash }}

            - name: Validate and package current app
              shell: bash
              run: |
                  set -euo pipefail
                  if [ "${{ steps.repack.outcome }}" = 'success' ]; then
                    APP_PATH="$GITHUB_WORKSPACE/.ci-artifacts/repacked/Budgie.app"
                  else
                    APP_PATH=$(find "$IOS_DERIVED_DATA" -name '*.app' -path '*Release-iphonesimulator*' -print -quit)
                  fi
                  test -d "$APP_PATH"
                  test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = 'com.vitalyiegorov.budgie.e2e'
                  if /usr/libexec/PlistBuddy -c 'Print :DEV_CLIENT_DEFAULT_LAUNCHER_URL' "$APP_PATH/Info.plist" >/dev/null 2>&1; then
                    echo '::error::E2E app unexpectedly contains a development-client launch URL.'
                    exit 1
                  fi
                  find "$APP_PATH" -name 'main.jsbundle' -type f -print -quit | grep -q .
                  ARTIFACT_DIR="$GITHUB_WORKSPACE/.ci-artifacts/ios-e2e-app"
                  APP_BUNDLE_NAME=$(basename "$APP_PATH")
                  mkdir -p "$ARTIFACT_DIR"
                  tar -C "$(dirname "$APP_PATH")" -czf "$ARTIFACT_DIR/$APP_BUNDLE_NAME.tar.gz" "$APP_BUNDLE_NAME"

            - name: Upload iOS E2E app artifact
              uses: actions/upload-artifact@v6
              with:
                  name: ios-e2e-app
                  path: .ci-artifacts/ios-e2e-app/*.tar.gz
                  if-no-files-found: error
                  compression-level: 0
                  retention-days: 3

    e2e-ios:
        if: needs.detect-mobile-impact.outputs.mobile == 'true'
        needs: [detect-mobile-impact, build-ios-e2e-app]
        name: E2E Tests on iOS (shard ${{ matrix.shard }}/2)
        runs-on: [self-hosted, macOS, ARM64, macos-maestro]
        timeout-minutes: 90
        strategy:
            fail-fast: false
            max-parallel: 2
            matrix:
                shard: [1, 2]
        permissions:
            contents: read
        env:
            APP_VARIANT: e2e
            EXPO_PUBLIC_AI_DISABLE: 'true'
        steps:
            - uses: actions/checkout@v5
              with:
                  persist-credentials: false

            - name: Select Xcode 26.4.1
              run: |
                  XCODE_APP=/Applications/Xcode_26.4.1.app
                  if [ ! -d "$XCODE_APP" ]; then
                    echo "::error::Xcode 26.4.1 is not installed on this runner."
                    exit 1
                  fi

                  echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
                  echo "Using Xcode at $XCODE_APP"
                  xcode-select -p || true
                  xcodebuild -version

            - name: Shutdown stale simulators
              run: xcrun simctl shutdown all || true

            - name: Start the iOS Simulator
              shell: bash
              run: |
                  set -euo pipefail
                  simulator_selection="$(
                    xcrun simctl list devices available -j |
                      node -e '
                        let input = "";
                        process.stdin.on("data", chunk => input += chunk);
                        process.stdin.on("end", () => {
                          const deviceType = "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro";
                          const inventory = JSON.parse(input).devices;
                          const candidates = Object.entries(inventory)
                            .map(([runtime, devices]) => [
                              runtime,
                              devices.filter(device =>
                                device.isAvailable !== false &&
                                device.name === "iPhone 17 Pro" &&
                                device.deviceTypeIdentifier === deviceType
                              ),
                            ])
                            .filter(([, devices]) => devices.length > 0)
                            .sort(([left], [right]) =>
                              right.localeCompare(left, undefined, { numeric: true })
                            );
                          if (candidates.length === 0) return;
                          const [runtime, devices] = candidates[0];
                          process.stdout.write([runtime, ...devices.slice(0, 2).map(device => device.udid)].join("\n"));
                        });
                      '
                  )"
                  SIMULATOR_RUNTIME="$(printf '%s\n' "$simulator_selection" | sed -n '1p')"
                  SIMULATOR_UDID="$(printf '%s\n' "$simulator_selection" | sed -n '2p')"

                  if [ -z "$SIMULATOR_RUNTIME" ] || [ -z "$SIMULATOR_UDID" ]; then
                    echo "::error::No available iPhone 17 Pro simulator was found."
                    xcrun simctl list devices available
                    exit 1
                  fi
                  echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"

                  boot_simulator() {
                    local simulator_udid="$1"
                    local attempt

                    for attempt in 1 2 3; do
                      echo "Booting simulator $simulator_udid (attempt $attempt/3)"
                      xcrun simctl boot "$simulator_udid" 2>/dev/null || true
                      if xcrun simctl bootstatus "$simulator_udid" -b; then
                        return 0
                      fi
                      xcrun simctl shutdown "$simulator_udid" 2>/dev/null || true
                    done

                    echo "::error::Simulator $simulator_udid did not finish booting after 3 attempts."
                    return 1
                  }

                  boot_simulator "$SIMULATOR_UDID"

                  echo "Simulator UDID: $SIMULATOR_UDID"
                  xcrun simctl list devices booted

            - name: Download iOS E2E app artifact
              uses: actions/download-artifact@v6
              with:
                  name: ios-e2e-app
                  path: .ci-artifacts/ios-e2e-app

            - name: Extract iOS E2E app artifact
              run: |
                  APP_ARCHIVE=$(find "$GITHUB_WORKSPACE/.ci-artifacts/ios-e2e-app" -name "*.tar.gz" | head -1)
                  if [ -z "$APP_ARCHIVE" ]; then
                    echo "::error::iOS E2E app artifact was not downloaded."
                    find "$GITHUB_WORKSPACE/.ci-artifacts/ios-e2e-app" -maxdepth 3 -type f || true
                    exit 1
                  fi

                  APP_DIR="$GITHUB_WORKSPACE/.ci-artifacts/ios-e2e-app/extracted"
                  mkdir -p "$APP_DIR"
                  tar -xzf "$APP_ARCHIVE" -C "$APP_DIR"
                  APP_PATH=$(find "$APP_DIR" -maxdepth 2 -name "*.app" | head -1)

                  if [ -z "$APP_PATH" ]; then
                    echo "::error::Extracted iOS app bundle was not found."
                    find "$APP_DIR" -maxdepth 4 -type f || true
                    exit 1
                  fi

                  echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

            - name: Install app on the Simulator
              shell: bash
              run: |
                  set -euo pipefail
                  echo "Installing app from: $APP_PATH"
                  xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"

            - name: Install Maestro
              run: |
                  maestro_bin="$HOME/.maestro/bin/maestro"
                  installed_version="$(
                    MAESTRO_CLI_NO_ANALYTICS=true \
                      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED=true \
                      "$maestro_bin" --version 2>/dev/null | tail -n 1 | tr -d '\r' || true
                  )"
                  if [ ! -x "$maestro_bin" ] || [ "$installed_version" != "$MAESTRO_VERSION" ]; then
                    curl -fsSL "https://get.maestro.mobile.dev" | env MAESTRO_VERSION="$MAESTRO_VERSION" bash
                  fi
                  echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
                  test "$(MAESTRO_CLI_NO_ANALYTICS=true MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED=true "$maestro_bin" --version 2>&1 | tail -n 1 | tr -d '\r')" = "$MAESTRO_VERSION"

            - name: Prepare iOS E2E artifact directories
              run: |
                  mkdir -p tests/app-tests/artifacts/maestro
                  mkdir -p tests/app-tests/artifacts/simulator
                  mkdir -p tests/app-tests/artifacts/diagnostics


            - name: Run Maestro UI tests
              timeout-minutes: 75
              working-directory: tests/app-tests
              shell: bash
              env:
                  JAVA_TOOL_OPTIONS: -Djava.awt.headless=true -Xmx1024m
                  MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'
              run: |
                  ./scripts/run-ios-maestro-shard.sh \
                    com.vitalyiegorov.budgie.e2e \
                    "${{ matrix.shard }}"

            - name: Publish Maestro timing summary
              if: always()
              working-directory: tests/app-tests
              shell: bash
              run: |
                  set -euo pipefail
                  {
                    for timing_file in ./artifacts/maestro/shard-*/flow-timings.tsv; do
                      if [ ! -f "$timing_file" ]; then
                        continue
                      fi

                      shard_name="$(basename "$(dirname "$timing_file")")"
                      echo "### Maestro flow timings: $shard_name"
                      echo
                      echo '| Flow | Status | Attempts | Seconds |'
                      echo '| --- | --- | ---: | ---: |'
                      tail -n +2 "$timing_file" |
                        sort -t $'\t' -k5,5nr |
                        awk -F '\t' '{ printf "| `%s` | %s | %s | %s |\n", $2, $3, $4, $5 }'
                      echo
                    done
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Collect iOS Simulator failure diagnostics
              if: failure()
              timeout-minutes: 2
              run: |
                  ARTIFACT_DIR="$GITHUB_WORKSPACE/tests/app-tests/artifacts/simulator"
                  DIAGNOSTIC_DIR="$GITHUB_WORKSPACE/tests/app-tests/artifacts/diagnostics"

                  collect_simulator_diagnostics() {
                    local shard_label="$1"
                    local simulator_udid="$2"
                    local shard_dir="$ARTIFACT_DIR/$shard_label"

                    mkdir -p "$shard_dir"

                    xcrun simctl io "$simulator_udid" screenshot "$shard_dir/final-screen.png" || true
                    xcrun simctl spawn "$simulator_udid" log show \
                      --last 90m --style compact --info --debug \
                      > "$shard_dir/simulator.log" 2>&1 || true
                    tail -n 20000 "$shard_dir/simulator.log" \
                      > "$shard_dir/simulator.log.tail" || true
                    mv "$shard_dir/simulator.log.tail" "$shard_dir/simulator.log" || true
                  }

                  collect_simulator_diagnostics "shard-${{ matrix.shard }}" "$SIMULATOR_UDID"

                  find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f \
                    \( -name 'budgieE2E*' -o -name 'budgie*' -o -name 'JetsamEvent*' \) \
                    -exec cp {} "$DIAGNOSTIC_DIR/" \; || true

            - name: Upload Maestro artifacts (report, logs, screenshots)
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: maestro-ios-artifacts-shard-${{ matrix.shard }}
                  include-hidden-files: true
                  path: |
                      tests/app-tests/artifacts/maestro/**
                  if-no-files-found: warn
                  retention-days: 7

            - name: Upload iOS simulator crash artifacts
              if: failure()
              uses: actions/upload-artifact@v6
              with:
                  name: maestro-ios-simulator-failure-artifacts-shard-${{ matrix.shard }}
                  include-hidden-files: true
                  path: |
                      tests/app-tests/artifacts/simulator/**
                      tests/app-tests/artifacts/diagnostics/**
                  retention-days: 7
                  if-no-files-found: warn

            - name: Shutdown the iOS Simulator
              if: always()
              run: xcrun simctl shutdown "${SIMULATOR_UDID:-unavailable}" || true

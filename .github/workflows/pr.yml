name: Pull Request
env:
    TURBO_TEAM: vitalyiegorov
    TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    PR_NUMBER: ${{ github.event.pull_request.number }}
    PR_TITLE: ${{ github.event.pull_request.title }}
    EAS_CLI_VERSION: '20.5.1'

concurrency:
    group: pr-${{ github.event.pull_request.number }}
    cancel-in-progress: true

on: pull_request

jobs:
    detect-mobile-impact:
        name: Detect mobile impact
        runs-on: [self-hosted, linux-tiered, linux-medium]
        timeout-minutes: 15
        permissions:
            contents: read
            pull-requests: read
        outputs:
            mobile: ${{ steps.gate.outputs.mobile }}
        steps:
            - name: Compute mobile-impact gate
              id: gate
              uses: actions/github-script@v8
              with:
                  script: |
                      let mobile = true;

                      try {
                        const files = await github.paginate(github.rest.pulls.listFiles, {
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          pull_number: context.issue.number,
                          per_page: 100,
                        });
                        const landingOnly = files.length > 0 && files.every(({ filename }) =>
                          filename.startsWith('packages/landing/') ||
                          filename.startsWith('docs/') ||
                          filename === 'README.md' ||
                          filename === 'LICENSE'
                        );
                        mobile = !landingOnly;
                        core.info(`Inspected ${files.length} changed files; mobile affected: ${mobile}`);
                      } catch (error) {
                        core.warning(`Could not inspect PR files; defaulting to mobile=true: ${error.message}`);
                      }

                      core.setOutput('mobile', mobile ? 'true' : 'false');

    code-quality:
        name: Code quality checks
        runs-on: [self-hosted, linux-tiered, linux-large]
        timeout-minutes: 60
        permissions:
            contents: read
        outputs:
            coverage-artifact-id: ${{ steps.upload-coverage.outputs.artifact-id }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 22.22.1

            - name: Install dependencies
              run: yarn install --immutable

            - name: Lingui catalogs are up to date
              run: yarn i18n:check

            - name: Lint the PR Title
              run: printf '%s\n' "$PR_TITLE" | node_modules/.bin/commitlint

            - name: Formatting checks
              run: yarn format:check

            - name: Typescript checks
              run: yarn ts

            - name: Maestro selector checks
              run: yarn workspace @budgie-at/app-tests selectors:check

            - name: Lint checks
              run: yarn lint

            - name: Deadcode detection
              run: yarn deadcode

            - name: Copy/Paste detection
              run: yarn cpd

            - name: Build
              run: yarn build

            - name: Unit tests
              run: yarn test:coverage

            - name: Verify generated files are committed
              run: git diff --exit-code

            - name: Upload coverage artifact
              id: upload-coverage
              uses: actions/upload-artifact@v6
              with:
                  name: coverage-reports
                  path: |
                      **/coverage/**
                      !**/node_modules/**
                  if-no-files-found: ignore
                  retention-days: 1

    codecov:
        if: ${{ needs.code-quality.outputs.coverage-artifact-id != '' }}
        needs: [code-quality]
        name: Upload coverage reports
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5
              with:
                  persist-credentials: false

            - name: Download coverage artifact
              uses: actions/download-artifact@v6
              with:
                  name: coverage-reports
                  path: coverage-reports

            - name: Upload coverage reports to Codecov
              uses: codecov/codecov-action@v5
              with:
                  directory: coverage-reports
                  use_oidc: true

    eas-update-preview:
        if: needs.detect-mobile-impact.outputs.mobile == 'true'
        needs: [detect-mobile-impact]
        name: EAS Update Preview
        # Expo's Hermes compiler package ships an x86-64 Linux host binary.
        # Keep this export on the hosted x86-64 image and reserve the Mac mini
        # for the native iOS build and simulator stages below.
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        permissions:
            contents: read
        steps:
            - name: Check for EXPO_TOKEN
              run: |
                  if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
                    echo "You must provide an EXPO_TOKEN secret linked to this project."
                    echo "Learn more: https://docs.expo.dev/eas/github-actions"
                    exit 1
                  fi

            - name: Verify x86-64 Hermes host
              run: test "$(uname -m)" = 'x86_64'

            - name: Checkout repository
              uses: actions/checkout@v5
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 22.x

            - name: Setup EAS
              uses: expo/expo-github-action@v9
              with:
                  eas-version: ${{ env.EAS_CLI_VERSION }}
                  token: ${{ secrets.EXPO_TOKEN }}

            - name: Install dependencies
              run: yarn install

            - name: Build internal workspace packages
              run: yarn turbo build --filter=@budgie/contracts --filter=@budgie/ai --filter=@budgie/bank-sync --filter=@budgie/consolidation --filter=@budgie/budget

            - name: Create preview
              id: create-preview
              working-directory: packages/app
              env:
                  APP_VARIANT: development
                  USE_CCACHE: '1'
              run: |
                  yarn expo export --output-dir dist --dump-assetmap --platform ios --platform android
                  eas update --skip-bundler --input-dir dist --channel development --message "PR #$PR_NUMBER - $PR_TITLE"

    ios-maestro:
        if: needs.detect-mobile-impact.outputs.mobile == 'true'
        needs: [detect-mobile-impact, code-quality]
        name: iOS Maestro E2E
        uses: rnw-community/mobile-ci/.github/workflows/ios-maestro.yml@5290e87d744aa745dcaea7f53ba1b9a6b724d7d8 # main
        with:
            runner-labels: '["self-hosted","macOS","ARM64","macos-maestro"]'
            targets: >-
                [{"name":"e2e","appDir":"packages/app","workspace":"budgieE2E.xcworkspace","scheme":"budgieE2E",
                "appId":"com.vitalyiegorov.budgie.e2e","prebuildCommand":"APP_VARIANT=e2e EXPO_PUBLIC_AI_DISABLE=true EXPO_PUBLIC_LOGGING_DISABLE=true npx expo prebuild -p ios --clean --no-install && echo APP_VARIANT=e2e >> $GITHUB_ENV && echo EXPO_PUBLIC_AI_DISABLE=true >> $GITHUB_ENV && echo EXPO_PUBLIC_LOGGING_DISABLE=true >> $GITHUB_ENV"}]
            flows-dir: tests/app-tests/flows
            shard-count: 2
            maestro-version: '2.6.1'
            cache-profile: ios-e2e-budgie
            build-command: yarn turbo build --filter=@budgie/contracts --filter=@budgie/ai --filter=@budgie/bank-sync --filter=@budgie/consolidation --filter=@budgie/budget
            rct-use-prebuilt-rncore: true
            rct-use-rn-dep: true
            expo-use-precompiled-modules: true

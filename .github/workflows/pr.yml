name: Pull Request
env:
    TURBO_TEAM: vitalyiegorov
    TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    PR_NUMBER: ${{ github.event.pull_request.number }}

concurrency:
    group: pr-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on: pull_request

permissions:
    contents: read

jobs:
    detect-mobile-impact:
        name: Detect mobile impact
        runs-on: [self-hosted, linux-portable-2x4]
        timeout-minutes: 15
        permissions:
            contents: read
            pull-requests: read
        outputs:
            mobile: ${{ steps.gate.outputs.mobile }}
            e2e-scripts: ${{ steps.gate.outputs.e2e-scripts }}
        steps:
            - name: Compute mobile-impact gate
              id: gate
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  script: |
                      let mobile = true;
                      let e2eScripts = true;

                      try {
                        const files = await github.paginate(github.rest.pulls.listFiles, {
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          pull_number: context.issue.number,
                          per_page: 100,
                        });
                        const mobileSuiteExempt = files.length > 0 && files.every(({ filename }) =>
                          filename.startsWith('packages/landing/') ||
                          filename.startsWith('docs/') ||
                          filename.endsWith('.md') ||
                          filename === 'LICENSE' ||
                          filename === '.gitattributes' ||
                          filename === '.gitignore' ||
                          filename === '.editorconfig' ||
                          filename === '.github/CODEOWNERS' ||
                          filename === '.github/dependabot.yml' ||
                          filename.startsWith('e2e/media/') ||
                          filename.startsWith('e2e/support/media/') ||
                          filename === 'e2e/media.config.ts' ||
                          filename.startsWith('tests/app-tests/fixtures/screenshots/') ||
                          filename.startsWith('packages/app/fastlane/') ||
                          filename === '.github/landing-media.config.json' ||
                          filename === '.github/store-screenshots.config.json' ||
                          filename === 'tests/app-tests/scripts/seed-screenshot-scene.sh' ||
                          filename === 'tests/app-tests/scripts/capture-store-screenshots.sh' ||
                          (filename.startsWith('tests/app-tests/scripts/') &&
                            (/^test-|media|compose/.test(filename.slice('tests/app-tests/scripts/'.length))))
                        );
                        mobile = !mobileSuiteExempt;
                        e2eScripts = files.length === 0 || files.some(({ filename }) =>
                          /^(e2e|scripts|tests\/app-tests|packages\/app\/fastlane|packages\/app\/assets\/fonts)\//.test(filename) ||
                          /^packages\/app\/src\/.*\.selector\.ts$/.test(filename) ||
                          /^\.github\/(scripts\/|actions\/|workflows\/pr\.yml$|(landing-media|store-screenshots)\.config\.json$)/.test(filename)
                        );
                        core.info(`Inspected ${files.length} changed files; mobile affected: ${mobile}; e2e scripts affected: ${e2eScripts}`);
                      } catch (error) {
                        core.warning(`Could not inspect PR files; defaulting to mobile=true: ${error.message}`);
                      }

                      core.setOutput('mobile', mobile ? 'true' : 'false');
                      core.setOutput('e2e-scripts', e2eScripts ? 'true' : 'false');

    code-quality:
        name: Code quality checks
        # The monorepo typecheck + type-aware oxlint + build need more than the
        # 4 GiB 2x4 shape.
        runs-on: [self-hosted, linux-portable-4x8]
        timeout-minutes: 60
        permissions:
            contents: read
            pull-requests: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  filter: blob:none
                  sparse-checkout-cone-mode: false
                  sparse-checkout: |
                      /*
                      !/packages/app/fastlane/screenshots/**/*.png
                      !/tests/app-tests/fixtures/*.db

            - uses: ./.github/actions/setup
              with:
                  skip-llama-postinstall: 'true'

            - name: Lingui catalogs are up to date
              run: pnpm i18n:check

            - name: Read current PR title
              id: current-pr
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  script: |
                      const { data } = await github.rest.pulls.get({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        pull_number: context.issue.number,
                      });
                      core.setOutput('title', data.title);

            - name: Lint the PR Title
              env:
                  PR_TITLE: ${{ steps.current-pr.outputs.title }}
              run: printf '%s\n' "$PR_TITLE" | node_modules/.bin/commitlint

            - name: Formatting checks
              run: pnpm format:check

            - name: Typescript checks
              run: pnpm ts

            - name: Lint checks
              run: pnpm lint && pnpm test:lint

            - name: Deadcode detection
              run: pnpm deadcode

            - name: Copy/Paste detection
              run: pnpm cpd

            - name: Build
              run: pnpm build

            - name: Verify generated files are committed
              run: git diff --exit-code

    unit-tests:
        name: Unit tests (${{ matrix.suite }})
        runs-on: [self-hosted, linux-portable-4x8]
        strategy:
            fail-fast: false
            matrix:
                include:
                    - suite: packages
                      filters: --filter=!@budgie-at/sync-tests --filter=!@budgie-at/consolidation-tests
                    - suite: sync 1/3
                      filters: --filter=@budgie-at/sync-tests
                      args: -- --shard=1/3
                    - suite: sync 2/3
                      filters: --filter=@budgie-at/sync-tests
                      args: -- --shard=2/3
                    - suite: sync 3/3
                      filters: --filter=@budgie-at/sync-tests
                      args: -- --shard=3/3
                    - suite: consolidation
                      filters: --filter=@budgie-at/consolidation-tests
        timeout-minutes: 45
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  filter: blob:none
                  sparse-checkout-cone-mode: false
                  sparse-checkout: |
                      /*
                      !/packages/app/fastlane/screenshots/**/*.png
                      !/tests/app-tests/fixtures/*.db

            - uses: ./.github/actions/setup
              with:
                  skip-llama-postinstall: 'true'

            - name: Unit tests
              run: pnpm test --concurrency=2 ${{ matrix.filters }} ${{ matrix.args }}

    e2e-script-tests:
        if: needs.detect-mobile-impact.outputs.e2e-scripts == 'true'
        needs: [detect-mobile-impact]
        name: E2E script self-tests
        runs-on: [self-hosted, linux-portable-2x4]
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22.22.2

            - name: Install sqlite3 and ruby
              timeout-minutes: 3
              run: |
                  if command -v sqlite3 && command -v ruby; then exit 0; fi
                  for _ in 1 2 3; do
                    timeout 90 sudo apt-get -o Acquire::Retries=3 update -qq \
                      && timeout 90 sudo apt-get install -y --no-install-recommends sqlite3 ruby \
                      && exit 0
                    sleep 5
                  done
                  exit 1

            - name: Store metadata budgets
              run: bash .github/scripts/check-store-metadata.sh

            - name: Run E2E script self-tests
              run: |
                  set -euo pipefail
                  for t in tests/app-tests/scripts/test-*.sh; do
                    echo "== $t"
                    bash "$t"
                  done

            - name: Typecheck the e2e project
              working-directory: e2e
              run: npm ci && npm run simlock:install && npm run ts

    assert-ai-ota:
        if: needs.detect-mobile-impact.outputs.mobile == 'true'
        needs: [detect-mobile-impact]
        name: Assert AI is enabled (OTA preview)
        permissions:
            contents: read
        uses: ./.github/workflows/assert-ai.yml

    ota-preview:
        if: needs.detect-mobile-impact.outputs.mobile == 'true'
        needs: [detect-mobile-impact, assert-ai-ota]
        name: OTA preview
        permissions:
            contents: write
            pull-requests: write
        uses: rnw-community/mobile-ci/.github/workflows/expo-ota-preview.yml@9a151735055f5ab661650523ad7c6375ae007bef # v4.12.0
        with:
            app-dir: packages/app
            scheme: budgie
            platforms: ios,android
            package-manager: pnpm
            install-command: pnpm install --frozen-lockfile
            install-cache-paths: |
                node_modules/.pnpm/llama.rn@*/node_modules/llama.rn/android/src/main/jniLibs
                node_modules/.pnpm/llama.rn@*/node_modules/llama.rn/ios/rnllama.xcframework
            install-cache-key: llama.rn-0.13.0-rc.7-react-native-0.88.1
            runner-labels: '["self-hosted","trf-linux-amd64-4x8"]'
            build-command: pnpm exec turbo build --filter='@budgie/*'
            release-tag-prefix: ota-pr${{ github.event.pull_request.number }}
            prune-keep: '100'

    fingerprint-guard:
        if: needs.detect-mobile-impact.outputs.mobile == 'true'
        needs: [detect-mobile-impact]
        name: Native runtime fingerprint
        permissions:
            contents: read
            pull-requests: read
        uses: rnw-community/mobile-ci/.github/workflows/expo-fingerprint-guard.yml@9a151735055f5ab661650523ad7c6375ae007bef # v4.12.0
        with:
            working-directory: packages/app
            platforms: ios
            app-env: |
                APP_VARIANT=production
            package-manager: pnpm
            install-command: pnpm install --frozen-lockfile
            install-cache-paths: |
                node_modules/.pnpm/llama.rn@*/node_modules/llama.rn/android/src/main/jniLibs
                node_modules/.pnpm/llama.rn@*/node_modules/llama.rn/ios/rnllama.xcframework
            install-cache-key: llama.rn-0.13.0-rc.7-react-native-0.88.1
            runner-labels: '["self-hosted","linux-portable-4x8"]'
            node-version: 22.22.2

    ios-e2e:
        if: needs.detect-mobile-impact.outputs.mobile == 'true'
        # Starts beside code-quality rather than after it: Required CI still
        # fails the PR when either fails.
        needs: [detect-mobile-impact]
        name: iOS E2E
        # A reusable workflow can only narrow the token it is given: the base
        # binary every pull request repacks is fetched (packages) and published
        # (packages: write, default-branch runs) by mobile-ci's plan/build jobs,
        # and this repository's default workflow token permission is read.
        permissions:
            contents: read
            packages: write
            actions: read
        concurrency:
            group: ios-simulator-farm
            queue: max
            cancel-in-progress: false
        uses: rnw-community/mobile-ci/.github/workflows/ios-maestro.yml@9a151735055f5ab661650523ad7c6375ae007bef # v4.12.0
        with:
            control-runner-labels: '["self-hosted","linux-portable-2x4"]'
            build-runner-labels: '["self-hosted","macOS","ARM64","macos-maestro"]'
            # Gate on the turbo graph as well as detect-mobile-impact's path
            # list: iOS E2E runs only when the app, its workspace
            # dependencies or the e2e suite changed.
            turbo-version: 2.11.5
            target-packages: |
                @budgie-at/app
                @budgie-at/app-tests
            # This file wires the e2e job, and turbo never sees it: a change here
            # runs the suite rather than skipping it.
            trigger-paths: .github/workflows/pr.yml,e2e/**
            targets: >-
                [{"name":"e2e","appDir":"packages/app","workspace":"budgieE2E.xcworkspace","scheme":"budgieE2E",
                "appId":"com.vitalyiegorov.budgie.e2e","prebuildCommand":"npx expo prebuild -p ios --clean --no-install"}]
            build-env: |
                APP_VARIANT=e2e
                EXPO_PUBLIC_AI_DISABLE=true
                EXPO_PUBLIC_LOGGING_DISABLE=true
            install-command: pnpm install --frozen-lockfile
            install-cache-paths: |
                node_modules/.pnpm/llama.rn@*/node_modules/llama.rn/android/src/main/jniLibs
                node_modules/.pnpm/llama.rn@*/node_modules/llama.rn/ios/rnllama.xcframework
            install-cache-key: llama.rn-0.13.0-rc.7-react-native-0.88.1
            package-manager: pnpm
            build-command: pnpm exec turbo build --filter='@budgie/*'
            rct-use-prebuilt-rncore: true
            rct-use-rn-dep: true
            expo-use-precompiled-modules: true
            fingerprint-env: |
                APP_VARIANT=e2e
                EXPO_PUBLIC_AI_DISABLE=true
                EXPO_PUBLIC_LOGGING_DISABLE=true
            repack-env: |
                APP_VARIANT=e2e
                EXPO_PUBLIC_AI_DISABLE=true
                EXPO_PUBLIC_LOGGING_DISABLE=true
            expect-config: |
                extra.appVariant=e2e
                extra.aiEnabled=false
                extra.loggingEnabled=false
            # The e2e suite (e2e/), run from Linux against the Mac Studio simlock
            # farm: no macOS test runner is used.
            test-framework: e2e
            e2e-dir: e2e
            e2e-runner-labels: '["self-hosted","linux-portable-4x8"]'
            e2e-workers: '10'
            e2e-retries: '1'
            e2e-timeout-minutes: 45
            # The public gateway, not the LAN address: only one Linux host shares the farm's LAN,
            # and the tunnel costs nothing measurable (10 flows: 4m12s public, 4m03s-4m25s LAN).
            simlock-url: https://simlock.vitaliiyehorov.dev
        secrets:
            simlock-token: ${{ secrets.SIMLOCK_TOKEN }}

    android-e2e:
        if: needs.detect-mobile-impact.outputs.mobile == 'true'
        needs: [detect-mobile-impact]
        name: Android E2E
        permissions:
            contents: read
            packages: write
            actions: read
        concurrency:
            group: android-emulator-farm
            queue: max
            cancel-in-progress: false
        uses: rnw-community/mobile-ci/.github/workflows/android-maestro.yml@9a151735055f5ab661650523ad7c6375ae007bef # v4.12.0
        with:
            control-runner-labels: '["self-hosted","linux-portable-2x4"]'
            turbo-version: 2.11.5
            target-packages: |
                @budgie-at/app
                @budgie-at/app-tests
            trigger-paths: .github/workflows/pr.yml,e2e/**
            targets: >-
                [{"name":"e2e","appDir":"packages/app","appId":"com.vitaliiyehorov.budgie.e2e",
                "prebuildCommand":"npx expo prebuild -p android --clean --no-install"}]
            android-abis: arm64-v8a
            gradle-args: -x lint -x lintVitalAnalyzeRelease -x lintAnalyzeRelease
            build-timeout-minutes: 120
            build-env: |
                APP_VARIANT=e2e
                EXPO_PUBLIC_AI_DISABLE=true
                EXPO_PUBLIC_LOGGING_DISABLE=true
            install-command: pnpm install --frozen-lockfile
            install-cache-paths: |
                node_modules/.pnpm/llama.rn@*/node_modules/llama.rn/android/src/main/jniLibs
                node_modules/.pnpm/llama.rn@*/node_modules/llama.rn/ios/rnllama.xcframework
            install-cache-key: llama.rn-0.13.0-rc.7-react-native-0.88.1
            package-manager: pnpm
            build-command: pnpm exec turbo build --filter='@budgie/*'
            fingerprint-env: |
                APP_VARIANT=e2e
                EXPO_PUBLIC_AI_DISABLE=true
                EXPO_PUBLIC_LOGGING_DISABLE=true
            repack-env: |
                APP_VARIANT=e2e
                EXPO_PUBLIC_AI_DISABLE=true
                EXPO_PUBLIC_LOGGING_DISABLE=true
            expect-config: |
                extra.appVariant=e2e
                extra.aiEnabled=false
                extra.loggingEnabled=false
            test-framework: e2e
            e2e-dir: e2e
            e2e-runner-labels: '["self-hosted","linux-portable-4x8"]'
            e2e-workers: '3'
            e2e-retries: '1'
            e2e-timeout-minutes: 60
            simlock-url: https://simlock.vitaliiyehorov.dev
        secrets:
            simlock-token: ${{ secrets.SIMLOCK_TOKEN }}

    store-screenshots-gallery:
        name: Store screenshots gallery
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: [self-hosted, linux-portable-2x4]
        timeout-minutes: 10
        permissions:
            pull-requests: write
        steps:
            - name: Post or update the screenshot gallery comment
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  script: |
                      const marker = '<!-- budgie-store-screenshots-gallery -->';
                      const screenshotPathPattern = /^packages\/app\/fastlane\/screenshots\/variants\/.*\.png$/i;
                      const orderedLocales = ['en-US', 'fr-FR', 'uk', 'de-DE', 'es-ES'];
                      const maxImages = 40;

                      const files = await github.paginate(github.rest.pulls.listFiles, {
                        ...context.repo,
                        pull_number: context.issue.number,
                        per_page: 100,
                      });
                      const screenshots = files
                        .filter(file => file.status !== 'removed')
                        .map(file => file.filename)
                        .filter(filename => screenshotPathPattern.test(filename));

                      const comments = await github.paginate(github.rest.issues.listComments, {
                        ...context.repo,
                        issue_number: context.issue.number,
                        per_page: 100,
                      });
                      const existingComment = comments.find(comment => comment.body?.startsWith(marker));

                      if (screenshots.length === 0) {
                        if (existingComment) {
                          await github.rest.issues.deleteComment({ ...context.repo, comment_id: existingComment.id });
                          core.info('No store screenshot changes left in this PR; removed the stale gallery comment.');
                          return;
                        }
                        core.info('No store screenshot changes in this PR; skipping the gallery comment.');
                        return;
                      }

                      const headSha = context.payload.pull_request.head.sha;
                      const groups = new Map();
                      const iPadDirectories = new Set();

                      for (const path of screenshots) {
                        const segments = path.split('/');
                        const variantsIndex = segments.indexOf('variants');
                        const appearance = segments[variantsIndex + 1] === 'dark' ? 'dark' : 'light';
                        const locale = segments[variantsIndex + 3];

                        if (/ipad/i.test(path)) {
                          iPadDirectories.add(segments.slice(0, -1).join('/'));
                          continue;
                        }
                        const key = `${appearance} ${locale}`;
                        if (!groups.has(key)) {
                          groups.set(key, []);
                        }
                        groups.get(key).push(path);
                      }

                      const localesPresent = new Set([...groups.keys()].map(key => key.split(' ')[1]));
                      const extraLocales = [...localesPresent].filter(locale => !orderedLocales.includes(locale)).sort();
                      const displayLocales = [...orderedLocales, ...extraLocales];

                      const lines = [marker, '### Store screenshots (iPhone)', ''];
                      let shown = 0;

                      for (const appearance of ['light', 'dark']) {
                        const localesForAppearance = displayLocales.filter(locale => groups.has(`${appearance} ${locale}`));
                        if (localesForAppearance.length === 0) {
                          continue;
                        }
                        lines.push(`#### ${appearance === 'light' ? 'Light' : 'Dark'}`, '');
                        lines.push(`| ${localesForAppearance.join(' | ')} |`);
                        lines.push(`| ${localesForAppearance.map(() => '---').join(' | ')} |`);
                        const row = localesForAppearance.map(locale => {
                          const paths = groups.get(`${appearance} ${locale}`) ?? [];
                          return paths
                            .filter(() => {
                              if (shown >= maxImages) {
                                return false;
                              }
                              shown += 1;
                              return true;
                            })
                            .map(path => `<img width="180" src="https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${headSha}/${path}">`)
                            .join('<br>');
                        });
                        lines.push(`| ${row.join(' | ')} |`, '');
                      }

                      if (shown >= maxImages) {
                        lines.push(`_Showing the first ${maxImages} screenshots; see the full diff for the rest._`, '');
                      }
                      if (iPadDirectories.size > 0) {
                        lines.push('iPad sets:', '');
                        for (const directory of [...iPadDirectories].sort()) {
                          lines.push(`- [\`${directory}\`](https://github.com/${context.repo.owner}/${context.repo.repo}/tree/${headSha}/${directory})`);
                        }
                        lines.push('');
                      }

                      const body = lines.join('\n');

                      if (existingComment) {
                        await github.rest.issues.updateComment({ ...context.repo, comment_id: existingComment.id, body });
                      } else {
                        await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
                      }

    lint-workflows:
        name: Lint workflows
        # Catches workflow files GitHub would reject at startup (e.g. a key
        # duplicated by two merged PRs) before they reach main.
        runs-on: [self-hosted, linux-portable-2x4]
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  filter: blob:none
                  sparse-checkout: .github

            - name: Run actionlint
              shell: bash
              env:
                  ACTIONLINT_VERSION: 1.7.12
                  # linux-portable is served by amd64 hosts and arm64 VMs, so pin both.
                  ACTIONLINT_SHA256_AMD64: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
                  ACTIONLINT_SHA256_ARM64: 325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6
              run: |
                  set -euo pipefail
                  case "$(uname -m)" in
                    x86_64) arch=amd64; sha256="$ACTIONLINT_SHA256_AMD64" ;;
                    aarch64 | arm64) arch=arm64; sha256="$ACTIONLINT_SHA256_ARM64" ;;
                    *) echo "::error::No pinned actionlint build for architecture '$(uname -m)'."; exit 1 ;;
                  esac
                  dir="$(mktemp -d)"
                  archive="actionlint_${ACTIONLINT_VERSION}_linux_${arch}.tar.gz"
                  curl -fsSL --retry 3 -o "$dir/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
                  echo "${sha256}  $dir/$archive" | sha256sum -c -
                  tar -xzf "$dir/$archive" -C "$dir" actionlint
                  "$dir/actionlint" -color

    required-ci:
        name: Required CI
        # The single check to mark required: it waits for every job above and
        # fails if any of them failed or was cancelled. A skipped job (mobile
        # impact gate off, fork PR) counts as passing. always(), not
        # !cancelled(): a cancelled run must still run this job and fail it,
        # because GitHub treats a skipped required check as passing.
        if: ${{ always() }}
        needs:
            - detect-mobile-impact
            - lint-workflows
            - code-quality
            - unit-tests
            - e2e-script-tests
            - assert-ai-ota
            - ota-preview
            - fingerprint-guard
            - ios-e2e
            - store-screenshots-gallery
        runs-on: [self-hosted, linux-portable-2x4]
        timeout-minutes: 5
        permissions: {}
        steps:
            - name: Check every required job succeeded or was skipped
              env:
                  NEEDS_JSON: ${{ toJSON(needs) }}
              run: |
                  set -euo pipefail
                  printf '%s' "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
                  failed="$(printf '%s' "$NEEDS_JSON" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')"
                  if [ -n "$failed" ]; then
                    echo "::error::Required jobs did not succeed: $failed"
                    exit 1
                  fi

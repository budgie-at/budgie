name: Pull Request
env:
    MAESTRO_DRIVER_STARTUP_TIMEOUT: '120000'
    TURBO_TEAM: vitalyiegorov
    TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    PR_NUMBER: ${{ github.event.pull_request.number }}
    PR_TITLE: ${{ github.event.pull_request.title }}
    MAESTRO_CLI_NO_ANALYTICS: 'true'
    MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
    MAESTRO_VERSION: '2.6.1'
    EAS_CLI_VERSION: '20.5.1'
    EXPO_REPACK_VERSION: '0.7.2'
    RCT_USE_PREBUILT_RNCORE: 1
    RCT_USE_RN_DEP: 1

concurrency:
    group: pr-${{ github.event.pull_request.number }}
    cancel-in-progress: true

on: pull_request

jobs:
    detect-mobile-impact:
        name: Detect mobile impact
        runs-on: [self-hosted, linux-tiered, linux-medium]
        timeout-minutes: 15
        permissions:
            contents: read
        outputs:
            mobile: ${{ steps.gate.outputs.mobile }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 22.x

            - name: Install dependencies
              run: yarn install

            - name: Compute mobile-impact gate
              id: gate
              run: |
                  MOBILE=true

                  if ! command -v jq >/dev/null 2>&1; then
                    echo "::warning::jq is not available on this runner; defaulting to mobile=true"
                    echo "mobile=$MOBILE" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  BASE_SHA="${{ github.event.pull_request.base.sha }}"

                  if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
                    git fetch --no-tags --depth=1 origin "$BASE_SHA" || true
                  fi

                  if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
                    echo "::warning::Could not fetch PR base $BASE_SHA; defaulting to mobile=true"
                    echo "mobile=$MOBILE" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  echo "PR base: $BASE_SHA"

                  TURBO_EXIT=0
                  TURBO_OUTPUT="$(yarn turbo query affected --packages --base "$BASE_SHA" --no-update-notifier 2>turbo-query.log)" || TURBO_EXIT=$?

                  if [ "$TURBO_EXIT" -ne 0 ]; then
                    echo "::warning::yarn turbo query affected failed; defaulting to mobile=true"
                    cat turbo-query.log || true
                    MOBILE=true
                  elif echo "$TURBO_OUTPUT" | jq -e '.data.affectedPackages.items[] | select(.name == "@budgie-at/app")' >/dev/null 2>&1; then
                    MOBILE=true
                  else
                    MOBILE=false
                  fi

                  if [ "$MOBILE" = "false" ]; then
                    if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(tests/app-tests/|\.github/workflows/pr\.yml$)'; then
                      MOBILE=true
                    fi
                  fi

                  echo "Mobile affected: $MOBILE"
                  echo "mobile=$MOBILE" >> "$GITHUB_OUTPUT"

    code-quality:
        name: Code quality checks
        runs-on: [self-hosted, linux-tiered, linux-large]
        timeout-minutes: 90
        permissions:
            contents: read
            id-token: write
            pull-requests: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 22.22.1

            - name: Install dependencies
              run: yarn install --immutable

            - name: Lingui catalogs are up to date
              run: yarn i18n:check

            - name: Lint the PR Title
              run: printf '%s\n' "$PR_TITLE" | node_modules/.bin/commitlint

            - name: Formatting checks
              run: yarn format:check

            - name: Typescript checks
              run: yarn ts

            - name: Maestro selector checks
              run: yarn workspace @budgie-at/app-tests selectors:check

            - name: Lint checks
              run: yarn lint

            - name: Deadcode detection
              run: yarn deadcode

            - name: Copy/Paste detection
              run: yarn cpd

            - name: Build
              run: yarn build

            - name: Unit tests
              run: yarn test:coverage

            - name: Verify generated files are committed
              run: git diff --exit-code

            - name: Benchmark baseline and current toolchains
              shell: bash
              env:
                  CURRENT_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  set -euo pipefail
                  BASELINE_SHA=1f07afc9205b25bfcbc4d2d03e12311e5896cedf
                  [[ "$CURRENT_SHA" =~ ^[0-9a-f]{40}$ ]]
                  BENCH_ROOT=$(mktemp -d "$RUNNER_TEMP/oxc-bench.XXXXXX")
                  baseline="$BENCH_ROOT/baseline"
                  current="$BENCH_ROOT/current"
                  artifacts="$GITHUB_WORKSPACE/.ci-artifacts/oxc-toolchain"
                  cleanup() {
                      original_status=$?
                      set +e
                      git worktree remove --force "$baseline" >/dev/null 2>&1 || true
                      git worktree remove --force "$current" >/dev/null 2>&1 || true
                      git worktree prune >/dev/null 2>&1 || true
                      rm -rf "$BENCH_ROOT"
                      return "$original_status"
                  }
                  trap cleanup EXIT
                  trap 'exit 130' INT
                  trap 'exit 143' TERM
                  git worktree prune
                  git cat-file -e "$BASELINE_SHA^{commit}"
                  if ! git cat-file -e "$CURRENT_SHA^{commit}" 2>/dev/null; then
                      git fetch --no-tags origin "$CURRENT_SHA"
                  fi
                  git cat-file -e "$CURRENT_SHA^{commit}"
                  git worktree add --detach "$baseline" "$BASELINE_SHA"
                  git worktree add --detach "$current" "$CURRENT_SHA"
                  rm -rf "$artifacts"
                  mkdir -p "$artifacts"
                  assert_turbo_summaries() {
                      output=$1 expected=$2
                      node - "$output" "$expected" <<'NODE'
                  const fs = require('node:fs');
                  const output = fs.readFileSync(process.argv[2], 'utf8');
                  const expected = process.argv[3].split(',').map(pair => pair.split(':').map(Number));
                  const tasks = [...output.matchAll(/Tasks:\s+(\d+) successful,\s+(\d+) total/g)].map(match => [Number(match[1]), Number(match[2])]);
                  const cached = [...output.matchAll(/Cached:\s+(\d+) cached,\s+(\d+) total/g)].map(match => [Number(match[1]), Number(match[2])]);
                  if (tasks.length !== expected.length || cached.length !== expected.length) process.exit(1);
                  expected.forEach(([total, cachedCount], index) => {
                      if (tasks[index][0] !== total || tasks[index][1] !== total || cached[index][0] !== cachedCount || cached[index][1] !== total) process.exit(1);
                  });
                  NODE
                  }
                  prepare_checkout() {
                      checkout=$1
                      (
                          cd "$checkout"
                          unset TURBO_API TURBO_TEAM TURBO_TOKEN TURBO_REMOTE_CACHE_SIGNATURE_KEY
                          corepack enable
                          test "$(yarn --version)" = 4.17.1
                          yarn install --immutable
                          yarn build
                      )
                  }
                  run_sample() {
                      revision=$1 checkout=$2 workload=$3 sample=$4 cache_policy=$5 command=$6 expected=$7
                      cache_dir="$BENCH_ROOT/cache/$revision/$workload"
                      sample_id="benchmark-${revision}-${workload}-${sample}"
                      stdout="$artifacts/${sample_id}.stdout"
                      time_output="$artifacts/${sample_id}.time.txt"
                      status_output="$artifacts/${sample_id}.status"
                      if [ "$cache_policy" = uncached ]; then
                          rm -rf "$cache_dir"
                          force=true
                      else
                          force=false
                      fi
                      set +e
                      (
                          cd "$checkout"
                          unset TURBO_API TURBO_TEAM TURBO_TOKEN TURBO_REMOTE_CACHE_SIGNATURE_KEY
                          if [ "$force" = true ]; then
                              /usr/bin/time -v -o "$time_output" env FORCE_COLOR=0 TURBO_UI=stream TURBO_CACHE=local:rw TURBO_CACHE_DIR="$cache_dir" TURBO_FORCE=true bash -o pipefail -c "$command"
                          else
                              /usr/bin/time -v -o "$time_output" env FORCE_COLOR=0 TURBO_UI=stream TURBO_CACHE=local:rw TURBO_CACHE_DIR="$cache_dir" bash -o pipefail -c "$command"
                          fi
                      ) > "$stdout" 2>&1
                      status=$?
                      set -e
                      printf '%s\n' "$status" > "$status_output"
                      test "$status" -eq 0
                      assert_turbo_summaries "$stdout" "$expected"
                  }
                  prime_cache() {
                      revision=$1 checkout=$2
                      cache_dir="$BENCH_ROOT/cache/$revision/cache-assisted-validation"
                      prime_output="$artifacts/prime-${revision}-cache-assisted-validation.stdout"
                      prime_status_output="$artifacts/prime-${revision}-cache-assisted-validation.status"
                      rm -rf "$cache_dir"
                      set +e
                      (
                          cd "$checkout"
                          unset TURBO_API TURBO_TEAM TURBO_TOKEN TURBO_REMOTE_CACHE_SIGNATURE_KEY TURBO_FORCE
                          env FORCE_COLOR=0 TURBO_UI=stream TURBO_CACHE=local:rw TURBO_CACHE_DIR="$cache_dir" bash -o pipefail -c 'yarn format && yarn ts && yarn lint && yarn deadcode && yarn cpd'
                      ) > "$prime_output" 2>&1
                      prime_status=$?
                      set -e
                      printf '%s\n' "$prime_status" > "$prime_status_output"
                      test "$prime_status" -eq 0
                      assert_turbo_summaries "$prime_output" '12:0,8:0'
                  }
                  measure_revision() {
                      revision=$1 checkout=$2
                      for sample in 1 2 3 4 5; do
                          run_sample "$revision" "$checkout" uncached-lint "$sample" uncached 'yarn lint' '8:0'
                          run_sample "$revision" "$checkout" uncached-validation "$sample" uncached 'yarn format && yarn ts && yarn lint && yarn deadcode && yarn cpd' '12:0,8:0'
                      done
                      prime_cache "$revision" "$checkout"
                      for sample in 1 2 3 4 5; do
                          run_sample "$revision" "$checkout" cache-assisted-validation "$sample" cache-assisted 'yarn format && yarn ts && yarn lint && yarn deadcode && yarn cpd' '12:12,8:8'
                      done
                  }
                  prepare_checkout "$baseline"
                  prepare_checkout "$current"
                  measure_revision baseline "$baseline"
                  measure_revision current "$current"
                  test "$(find "$artifacts" -type f -name 'benchmark-*.stdout' | wc -l | tr -d ' ')" = 30
                  test "$(find "$artifacts" -type f -name 'benchmark-*.time.txt' | wc -l | tr -d ' ')" = 30
                  test "$(find "$artifacts" -type f -name 'benchmark-*.status' | wc -l | tr -d ' ')" = 30
                  test "$(find "$artifacts" -type f -name 'prime-*.stdout' | wc -l | tr -d ' ')" = 2
                  test "$(find "$artifacts" -type f -name 'prime-*.status' | wc -l | tr -d ' ')" = 2
                  for stdout in "$artifacts"/benchmark-*.stdout; do
                      test -f "${stdout%.stdout}.time.txt"
                      test -f "${stdout%.stdout}.status"
                  done
                  for prime_stdout in "$artifacts"/prime-*.stdout; do
                      test -f "${prime_stdout%.stdout}.status"
                  done
                  BASELINE_SHA="$BASELINE_SHA" CURRENT_SHA="$CURRENT_SHA" ARTIFACTS="$artifacts" node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
                  const fs = require('node:fs');
                  const path = require('node:path');
                  const revisions = [['baseline', process.env.BASELINE_SHA], ['current', process.env.CURRENT_SHA]];
                  const workloads = [
                      ['uncached-lint', '`yarn lint`', 'remote disabled; unique local cache cleared before every sample; `TURBO_FORCE=true`'],
                      ['uncached-validation', '`yarn format && yarn ts && yarn lint && yarn deadcode && yarn cpd`', 'remote disabled; unique local cache cleared before every sample; `TURBO_FORCE=true`'],
                      ['cache-assisted-validation', '`yarn format && yarn ts && yarn lint && yarn deadcode && yarn cpd`', 'remote disabled; unique local cache primed once; measured local-cache hits']
                  ];
                  const parseElapsedSeconds = content => {
                      const match = content.match(/Elapsed \(wall clock\) time.*\):\s*([0-9:.]+)\s*$/m);
                      if (!match) throw new Error('Missing elapsed time');
                      return match[1].split(':').reduce((seconds, part) => seconds * 60 + Number(part), 0);
                  };
                  const parseMaximumRss = content => {
                      const match = content.match(/Maximum resident set size \(kbytes\):\s*(\d+)/);
                      if (!match) throw new Error('Missing maximum RSS');
                      return Number(match[1]);
                  };
                  const rows = [];
                  for (const [revision, sha] of revisions) {
                      for (const [workload, command, cachePolicy] of workloads) {
                          const elapsed = [];
                          const rss = [];
                          let successful = 0;
                          for (let sample = 1; sample <= 5; sample += 1) {
                              const prefix = path.join(process.env.ARTIFACTS, `benchmark-${revision}-${workload}-${sample}`);
                              const status = Number(fs.readFileSync(`${prefix}.status`, 'utf8').trim());
                              if (status === 0) successful += 1;
                              const metrics = fs.readFileSync(`${prefix}.time.txt`, 'utf8');
                              elapsed.push(parseElapsedSeconds(metrics));
                              rss.push(parseMaximumRss(metrics));
                          }
                          if (successful !== 5 || elapsed.length !== 5 || rss.length !== 5) throw new Error(`Incomplete samples for ${revision}/${workload}`);
                          const medianElapsed = elapsed.sort((left, right) => left - right)[2];
                          const medianRss = rss.sort((left, right) => left - right)[2];
                          rows.push(`| ${revision} (${sha}) | ${workload} | ${command} | ${cachePolicy} | ${successful}/5 successful | ${medianElapsed.toFixed(2)} s | ${(medianRss / 1024).toFixed(1)} MiB |`);
                      }
                  }
                  console.log('### Baseline/current toolchain benchmark');
                  console.log('');
                  console.log(`Node ${process.version}; Yarn 4.17.1; ${process.platform} ${process.arch}`);
                  console.log('');
                  console.log('| Revision | Workload | Command | Cache policy | Status | Median wall time | Median maximum observed child-process RSS |');
                  console.log('| --- | --- | --- | --- | --- | ---: | ---: |');
                  console.log(rows.join('\n'));
                  console.log('');
                  console.log('Memory values are GNU time maximum observed child-process RSS for the measured command, not aggregate process-tree RSS. Each median is sorted sample index 2 from exactly five successful samples. Lint runs global type-aware Oxlint followed by the eight-package ESLint fallback.');
                  NODE

            - name: Upload Oxc benchmark
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: oxc-toolchain-benchmark
                  path: .ci-artifacts/oxc-toolchain/
                  if-no-files-found: warn
                  include-hidden-files: true

            - name: Upload coverage reports to Codecov
              uses: codecov/codecov-action@v5
              with:
                  use_oidc: true

    eas-update-preview:
        if: needs.detect-mobile-impact.outputs.mobile == 'true'
        needs: [detect-mobile-impact]
        name: EAS Update Preview
        # Expo's Hermes compiler package ships an x86-64 Linux host binary.
        # Keep this export on the hosted x86-64 image and reserve the Mac mini
        # for the native iOS build and simulator stages below.
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        permissions:
            contents: read
        steps:
            - name: Check for EXPO_TOKEN
              run: |
                  if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
                    echo "You must provide an EXPO_TOKEN secret linked to this project."
                    echo "Learn more: https://docs.expo.dev/eas/github-actions"
                    exit 1
                  fi

            - name: Verify x86-64 Hermes host
              run: test "$(uname -m)" = 'x86_64'

            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 22.x

            - name: Setup EAS
              uses: expo/expo-github-action@v8
              with:
                  eas-version: ${{ env.EAS_CLI_VERSION }}
                  token: ${{ secrets.EXPO_TOKEN }}

            - name: Install dependencies
              run: yarn install

            - name: Build internal workspace packages
              run: yarn turbo build --filter=@budgie/contracts --filter=@budgie/ai --filter=@budgie/bank-sync --filter=@budgie/consolidation --filter=@budgie/budget

            - name: Create preview
              id: create-preview
              working-directory: packages/app
              env:
                  APP_VARIANT: development
                  USE_CCACHE: '1'
              run: |
                  yarn expo export --output-dir dist --dump-assetmap --platform ios --platform android
                  eas update --skip-bundler --input-dir dist --channel development --message "PR #$PR_NUMBER - $PR_TITLE"

    build-ios-e2e-app:
        if: needs.detect-mobile-impact.outputs.mobile == 'true'
        needs: [detect-mobile-impact, code-quality]
        name: Build iOS E2E app
        runs-on: [self-hosted, macOS, ARM64, macos-builder]
        timeout-minutes: 120
        permissions:
            contents: read
        env:
            APP_VARIANT: e2e
            EXPO_PUBLIC_AI_DISABLE: 'true'
            EXPO_PUBLIC_LOGGING_DISABLE: 'true'
            EXPO_USE_PRECOMPILED_MODULES: '1'
            RCT_USE_PREBUILT_RNCORE: '1'
            RCT_USE_RN_DEP: '1'
            IOS_DERIVED_DATA: ${{ github.workspace }}/.ci-cache/DerivedData/budgie-e2e
            USE_CCACHE: '1'
            CCACHE_DIR: ${{ github.workspace }}/.ci-cache/ccache
            CCACHE_BASEDIR: ${{ github.workspace }}
            CCACHE_COMPRESS: 'true'
            CCACHE_MAXSIZE: 2G
            CCACHE_NOHASHDIR: 'true'
        steps:
            - uses: actions/checkout@v5

            - name: Setup macOS toolchain PATH
              shell: bash
              run: |
                  echo "$HOME/.rbenv/shims" >> "$GITHUB_PATH"
                  echo '/opt/homebrew/bin' >> "$GITHUB_PATH"
                  echo '/opt/homebrew/sbin' >> "$GITHUB_PATH"

            - name: Runner diagnostics
              run: |
                  whoami
                  uname -m
                  hostname
                  ls -1 /Applications | grep -i Xcode || true
                  which pod || true
                  pod --version || true
                  which ccache || true
                  ccache --version || true
                  xcode-select -p || true
                  xcodebuild -version || true

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 22.x

            - name: Install dependencies
              run: yarn install

            - name: Build internal workspace packages
              run: yarn turbo build --filter=@budgie/contracts --filter=@budgie/ai --filter=@budgie/bank-sync --filter=@budgie/consolidation --filter=@budgie/budget

            - name: Setup EAS
              uses: expo/expo-github-action@v8
              with:
                  eas-version: ${{ env.EAS_CLI_VERSION }}
                  token: ${{ secrets.EXPO_TOKEN }}

            - name: Generate native fingerprint
              id: fingerprint
              working-directory: packages/app
              shell: bash
              run: |
                  set -euo pipefail
                  eas fingerprint:generate \
                    --build-profile e2e \
                    --platform ios \
                    --json \
                    --non-interactive > "$RUNNER_TEMP/ios-fingerprint.json"
                  hash=$(jq -er '.hash' "$RUNNER_TEMP/ios-fingerprint.json")
                  echo "hash=$hash" >> "$GITHUB_OUTPUT"
                  echo "Native fingerprint: $hash"

            - name: Restore fingerprinted native app
              id: native-app-cache
              uses: actions/cache/restore@v5
              with:
                  path: .ci-cache/ios-native-app
                  key: ios-native-v1-budgie-e2e-${{ runner.os }}-arm64-xcode26_4_1-17E202-${{ steps.fingerprint.outputs.hash }}

            - name: Repack cached native app
              id: repack
              if: steps.native-app-cache.outputs.cache-hit == 'true'
              continue-on-error: true
              working-directory: packages/app
              shell: bash
              run: |
                  set -euo pipefail
                  output_app="$GITHUB_WORKSPACE/.ci-artifacts/repacked/Budgie.app"
                  mkdir -p "$(dirname "$output_app")"
                  source_app=$(find "$GITHUB_WORKSPACE/.ci-cache/ios-native-app" -maxdepth 1 -name '*.app' -print -quit)
                  test -n "$source_app"
                  npx --yes "@expo/repack-app@$EXPO_REPACK_VERSION" . \
                    --platform ios \
                    --source-app "$source_app" \
                    --output "$output_app" \
                    --embed-bundle-assets
                  test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$output_app/Info.plist")" = 'com.vitalyiegorov.budgie.e2e'
                  ! /usr/libexec/PlistBuddy -c 'Print :DEV_CLIENT_DEFAULT_LAUNCHER_URL' "$output_app/Info.plist" >/dev/null 2>&1
                  find "$output_app" -name 'main.jsbundle' -type f -print -quit | grep -q .

            - name: Plan native build
              id: native-plan
              shell: bash
              run: |
                  if [ "${{ steps.native-app-cache.outputs.cache-hit }}" != 'true' ] || \
                     [ "${{ steps.repack.outcome }}" != 'success' ]; then
                    echo 'required=true' >> "$GITHUB_OUTPUT"
                    if [ "${{ steps.native-app-cache.outputs.cache-hit }}" = 'true' ]; then
                      echo '::warning::Repack failed validation; falling back to a full native build.'
                    fi
                  else
                    echo 'required=false' >> "$GITHUB_OUTPUT"
                  fi

            - name: Select Xcode 26.4.1
              if: steps.native-plan.outputs.required == 'true'
              run: |
                  XCODE_APP=/Applications/Xcode_26.4.1.app
                  if [ ! -d "$XCODE_APP" ]; then
                    echo "::error::Xcode 26.4.1 is not installed on this runner."
                    exit 1
                  fi

                  echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
                  echo "Using Xcode at $XCODE_APP"
                  xcode_version=$("$XCODE_APP/Contents/Developer/usr/bin/xcodebuild" -version)
                  printf '%s\n' "$xcode_version"
                  grep -qx 'Xcode 26.4.1' <<< "$xcode_version"
                  grep -qx 'Build version 17E202' <<< "$xcode_version"

            - name: Restore CocoaPods cache
              if: steps.native-plan.outputs.required == 'true'
              uses: actions/cache/restore@v5
              with:
                  path: |
                      ~/Library/Caches/CocoaPods
                      ~/.cocoapods
                  key: pods-${{ runner.os }}-xcode26_4_1-${{ hashFiles('yarn.lock', 'packages/app/package.json', 'packages/app/app.config.js', 'packages/app/ios/Podfile.properties.json') }}
                  restore-keys: |
                      pods-${{ runner.os }}-xcode26_4_1-
                      pods-${{ runner.os }}-

            - name: Setup ccache
              if: steps.native-plan.outputs.required == 'true'
              run: |
                  mkdir -p "$CCACHE_DIR" "$IOS_DERIVED_DATA"
                  if ! command -v ccache >/dev/null; then
                    command -v brew >/dev/null || {
                      echo "::error::ccache is not installed and Homebrew is unavailable."
                      exit 1
                    }
                    brew list ccache >/dev/null 2>&1 || brew install ccache
                  fi
                  command -v ccache
                  ccache --version
                  ccache --zero-stats || true
                  if command -v brew >/dev/null; then
                    echo "$(brew --prefix ccache)/libexec" >> "$GITHUB_PATH"
                  fi

            - name: Restore ccache
              if: steps.native-plan.outputs.required == 'true'
              uses: actions/cache/restore@v5
              with:
                  path: ${{ env.CCACHE_DIR }}
                  key: ccache-${{ runner.os }}-xcode26_4_1-e2e-${{ hashFiles('yarn.lock', 'packages/app/package.json', 'packages/app/app.config.js', 'packages/app/ios/Podfile.properties.json') }}
                  restore-keys: |
                      ccache-${{ runner.os }}-xcode26_4_1-e2e-
                      ccache-${{ runner.os }}-

            - name: Expo Prebuild
              if: steps.native-plan.outputs.required == 'true'
              working-directory: packages/app
              env:
                  APP_VARIANT: e2e
                  EXPO_PUBLIC_AI_DISABLE: 'true'
              run: npx expo prebuild -p ios --clean --no-install

            - name: Sync CocoaPods
              if: steps.native-plan.outputs.required == 'true'
              working-directory: packages/app/ios
              env:
                  APP_VARIANT: e2e
                  EXPO_PUBLIC_AI_DISABLE: 'true'
              run: |
                  command -v pod
                  pod --version
                  pod install

            - name: Build native Release base
              if: steps.native-plan.outputs.required == 'true'
              working-directory: packages/app
              env:
                  APP_VARIANT: e2e
                  EXPO_PUBLIC_AI_DISABLE: 'true'
              run: |
                  cd ios
                  WORKSPACE=$(ls -d *.xcworkspace | head -1)
                  SCHEME=$(echo "$WORKSPACE" | sed 's/.xcworkspace//')
                  echo "Building workspace: $WORKSPACE, scheme: $SCHEME"
                  xcodebuild build \
                    -workspace "$WORKSPACE" \
                    -scheme "$SCHEME" \
                    -sdk iphonesimulator \
                    -configuration Release \
                    -derivedDataPath "$IOS_DERIVED_DATA" \
                    -destination "generic/platform=iOS Simulator" \
                    -jobs 5 \
                    CODE_SIGN_IDENTITY="-" \
                    AD_HOC_CODE_SIGNING_ALLOWED=YES \
                    PROVISIONING_PROFILE_SPECIFIER="" \
                    COMPILER_INDEX_STORE_ENABLE=NO \
                    ONLY_ACTIVE_ARCH=YES \
                    ARCHS=arm64 \
                    EXCLUDED_ARCHS=x86_64

            - name: Package native base
              if: steps.native-plan.outputs.required == 'true'
              run: |
                  set -euo pipefail
                  APP_PATH=$(find "$IOS_DERIVED_DATA" -name "*.app" -path "*Release-iphonesimulator*" | head -1)
                  if [ -z "$APP_PATH" ]; then
                    echo "::error::Built iOS app bundle was not found in $IOS_DERIVED_DATA."
                    find "$IOS_DERIVED_DATA" -maxdepth 6 -name "*.app" || true
                    exit 1
                  fi
                  test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = 'com.vitalyiegorov.budgie.e2e'
                  if /usr/libexec/PlistBuddy -c 'Print :DEV_CLIENT_DEFAULT_LAUNCHER_URL' "$APP_PATH/Info.plist" >/dev/null 2>&1; then
                    echo '::error::Native E2E base unexpectedly contains a development-client launch URL.'
                    exit 1
                  fi
                  find "$APP_PATH" -name 'main.jsbundle' -type f -print -quit | grep -q .

                  ARTIFACT_DIR="$GITHUB_WORKSPACE/.ci-cache/ios-native-app"
                  mkdir -p "$ARTIFACT_DIR"
                  ditto "$APP_PATH" "$ARTIFACT_DIR/Base.app"

            - name: Save fingerprinted native app
              if: steps.native-app-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v5
              with:
                  path: .ci-cache/ios-native-app
                  key: ios-native-v1-budgie-e2e-${{ runner.os }}-arm64-xcode26_4_1-17E202-${{ steps.fingerprint.outputs.hash }}

            - name: Validate and package current app
              shell: bash
              run: |
                  set -euo pipefail
                  if [ "${{ steps.repack.outcome }}" = 'success' ]; then
                    APP_PATH="$GITHUB_WORKSPACE/.ci-artifacts/repacked/Budgie.app"
                  else
                    APP_PATH=$(find "$IOS_DERIVED_DATA" -name '*.app' -path '*Release-iphonesimulator*' -print -quit)
                  fi
                  test -d "$APP_PATH"
                  test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = 'com.vitalyiegorov.budgie.e2e'
                  if /usr/libexec/PlistBuddy -c 'Print :DEV_CLIENT_DEFAULT_LAUNCHER_URL' "$APP_PATH/Info.plist" >/dev/null 2>&1; then
                    echo '::error::E2E app unexpectedly contains a development-client launch URL.'
                    exit 1
                  fi
                  find "$APP_PATH" -name 'main.jsbundle' -type f -print -quit | grep -q .
                  ARTIFACT_DIR="$GITHUB_WORKSPACE/.ci-artifacts/ios-e2e-app"
                  APP_BUNDLE_NAME=$(basename "$APP_PATH")
                  mkdir -p "$ARTIFACT_DIR"
                  tar -C "$(dirname "$APP_PATH")" -czf "$ARTIFACT_DIR/$APP_BUNDLE_NAME.tar.gz" "$APP_BUNDLE_NAME"

            - name: Upload iOS E2E app artifact
              uses: actions/upload-artifact@v6
              with:
                  name: ios-e2e-app
                  path: .ci-artifacts/ios-e2e-app/*.tar.gz
                  if-no-files-found: error
                  compression-level: 0
                  retention-days: 3

    e2e-ios:
        if: needs.detect-mobile-impact.outputs.mobile == 'true'
        needs: [detect-mobile-impact, build-ios-e2e-app]
        name: E2E Tests on iOS (shard ${{ matrix.shard-number }}/2)
        runs-on: [self-hosted, macOS, ARM64, macos-maestro]
        timeout-minutes: 90
        strategy:
            fail-fast: false
            max-parallel: 2
            matrix:
                include:
                    - shard-index: 0
                      shard-number: 1
                    - shard-index: 1
                      shard-number: 2
        permissions:
            contents: read
        env:
            APP_VARIANT: e2e
            EXPO_PUBLIC_AI_DISABLE: 'true'
        steps:
            - uses: actions/checkout@v5

            - name: Select Xcode 26.4.1
              run: |
                  XCODE_APP=/Applications/Xcode_26.4.1.app
                  if [ ! -d "$XCODE_APP" ]; then
                    echo "::error::Xcode 26.4.1 is not installed on this runner."
                    exit 1
                  fi

                  echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
                  echo "Using Xcode at $XCODE_APP"
                  xcode-select -p || true
                  xcodebuild -version

            - name: Shutdown stale simulators
              run: xcrun simctl shutdown all || true

            - name: Start iOS Simulator
              shell: bash
              run: |
                  set -euo pipefail
                  SIMULATOR_UDID="$(
                    xcrun simctl list devices available |
                      sed -n '/iPhone 17 Pro (/ { s/.*(\([A-F0-9-]\{36\}\)).*/\1/; p; q; }'
                  )"

                  if [ -z "$SIMULATOR_UDID" ]; then
                    echo "::error::No available iPhone 17 Pro simulator was found."
                    xcrun simctl list devices available
                    exit 1
                  fi

                  booted=false
                  for attempt in 1 2 3; do
                    echo "Booting simulator $SIMULATOR_UDID (attempt $attempt/3)"
                    xcrun simctl boot "$SIMULATOR_UDID" 2>/dev/null || true
                    if xcrun simctl bootstatus "$SIMULATOR_UDID" -b; then
                      booted=true
                      break
                    fi
                    xcrun simctl shutdown "$SIMULATOR_UDID" 2>/dev/null || true
                  done

                  if [ "$booted" != true ]; then
                    echo "::error::Simulator did not finish booting after 3 attempts."
                    exit 1
                  fi

                  echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
                  echo "Using simulator UDID: $SIMULATOR_UDID"
                  xcrun simctl list devices booted

            - name: Download iOS E2E app artifact
              uses: actions/download-artifact@v6
              with:
                  name: ios-e2e-app
                  path: .ci-artifacts/ios-e2e-app

            - name: Extract iOS E2E app artifact
              run: |
                  APP_ARCHIVE=$(find "$GITHUB_WORKSPACE/.ci-artifacts/ios-e2e-app" -name "*.tar.gz" | head -1)
                  if [ -z "$APP_ARCHIVE" ]; then
                    echo "::error::iOS E2E app artifact was not downloaded."
                    find "$GITHUB_WORKSPACE/.ci-artifacts/ios-e2e-app" -maxdepth 3 -type f || true
                    exit 1
                  fi

                  APP_DIR="$GITHUB_WORKSPACE/.ci-artifacts/ios-e2e-app/extracted"
                  mkdir -p "$APP_DIR"
                  tar -xzf "$APP_ARCHIVE" -C "$APP_DIR"
                  APP_PATH=$(find "$APP_DIR" -maxdepth 2 -name "*.app" | head -1)

                  if [ -z "$APP_PATH" ]; then
                    echo "::error::Extracted iOS app bundle was not found."
                    find "$APP_DIR" -maxdepth 4 -type f || true
                    exit 1
                  fi

                  echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

            - name: Install app on Simulator
              run: |
                  echo "Installing app from: $APP_PATH"
                  xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"

            - name: Install Maestro
              run: |
                  maestro_bin="$HOME/.maestro/bin/maestro"
                  installed_version="$(
                    MAESTRO_CLI_NO_ANALYTICS=true \
                      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED=true \
                      "$maestro_bin" --version 2>/dev/null | tail -n 1 | tr -d '\r' || true
                  )"
                  if [ ! -x "$maestro_bin" ] || [ "$installed_version" != "$MAESTRO_VERSION" ]; then
                    curl -fsSL "https://get.maestro.mobile.dev" | env MAESTRO_VERSION="$MAESTRO_VERSION" bash
                  fi
                  echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
                  test "$(MAESTRO_CLI_NO_ANALYTICS=true MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED=true "$maestro_bin" --version 2>&1 | tail -n 1 | tr -d '\r')" = "$MAESTRO_VERSION"

            - name: Prepare iOS E2E artifact directories
              run: |
                  mkdir -p tests/app-tests/artifacts/maestro
                  mkdir -p tests/app-tests/artifacts/simulator
                  mkdir -p tests/app-tests/artifacts/diagnostics

            - name: Start iOS Simulator log capture
              run: |
                  ARTIFACT_DIR="$GITHUB_WORKSPACE/tests/app-tests/artifacts/simulator"
                  xcrun simctl spawn "$SIMULATOR_UDID" log stream --style compact --level default > "$ARTIFACT_DIR/simulator.log" 2>&1 &
                  echo $! > "$ARTIFACT_DIR/simulator-log.pid"

            - name: Run Maestro UI tests
              timeout-minutes: 75
              working-directory: tests/app-tests
              shell: bash
              env:
                  SHARD_INDEX: ${{ matrix.shard-index }}
              run: |
                  set -euo pipefail
                  all_flows=()
                  while IFS= read -r flow; do
                    all_flows+=("$flow")
                  done < <(find flows -maxdepth 1 -type f -name '*.flow.yaml' | sort)
                  selected=()
                  for index in "${!all_flows[@]}"; do
                    if (( index % 2 == SHARD_INDEX )); then
                      selected+=("${all_flows[$index]}")
                    fi
                  done
                  test "${#selected[@]}" -gt 0
                  printf 'Shard %s flows:\n%s\n' "$SHARD_INDEX" "${selected[*]}"
                  sh ./scripts/run-maestro-suite.sh com.vitalyiegorov.budgie.e2e \
                    --format junit \
                    --output ./artifacts/maestro/report.xml \
                    --debug-output ./artifacts/maestro \
                    --test-output-dir ./artifacts/maestro \
                    "${selected[@]}" \
                    2>&1 | tee ./artifacts/maestro/maestro-console.log

            - name: Stop iOS Simulator captures
              if: always()
              run: |
                  ARTIFACT_DIR="$GITHUB_WORKSPACE/tests/app-tests/artifacts/simulator"
                  DIAGNOSTIC_DIR="$GITHUB_WORKSPACE/tests/app-tests/artifacts/diagnostics"
                  xcrun simctl io "$SIMULATOR_UDID" screenshot "$ARTIFACT_DIR/final-screen.png" || true

                  if [ -f "$ARTIFACT_DIR/simulator-log.pid" ]; then
                    kill "$(cat "$ARTIFACT_DIR/simulator-log.pid")" || true
                  fi

                  if [ -f "$ARTIFACT_DIR/simulator.log" ]; then
                    tail -n 20000 "$ARTIFACT_DIR/simulator.log" > "$ARTIFACT_DIR/simulator.log.tail" || true
                    mv "$ARTIFACT_DIR/simulator.log.tail" "$ARTIFACT_DIR/simulator.log" || true
                  fi

                  find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f \
                    \( -name 'budgieE2E*' -o -name 'budgie*' -o -name 'JetsamEvent*' \) \
                    -exec cp {} "$DIAGNOSTIC_DIR/" \; || true

            - name: Upload Maestro artifacts (report, logs, screenshots)
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: maestro-ios-artifacts-shard-${{ matrix.shard-number }}
                  include-hidden-files: true
                  path: |
                      tests/app-tests/artifacts/maestro/**
                      tests/app-tests/.maestro/**
                  if-no-files-found: warn

            - name: Upload iOS simulator crash artifacts
              if: failure()
              uses: actions/upload-artifact@v6
              with:
                  name: maestro-ios-simulator-failure-artifacts-shard-${{ matrix.shard-number }}
                  include-hidden-files: true
                  path: |
                      tests/app-tests/artifacts/simulator/**
                      tests/app-tests/artifacts/diagnostics/**
                  if-no-files-found: warn

            - name: Shutdown iOS Simulator
              if: always()
              run: |
                  if [ -n "${SIMULATOR_UDID:-}" ]; then
                    xcrun simctl shutdown "$SIMULATOR_UDID" || true
                  fi

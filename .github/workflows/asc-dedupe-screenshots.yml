name: Dedupe App Store screenshots

on:
    workflow_dispatch:
    workflow_run:
        workflows: [Build and Publish to Stores]
        types: [completed]

permissions:
    contents: read

jobs:
    dedupe:
        name: Delete duplicate App Store screenshots
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
        runs-on: [self-hosted, trf-linux-amd64-2x4]
        timeout-minutes: 15
        steps:
            - name: Write ASC API key
              env:
                  ASC_API_KEY: ${{ secrets.EXPO_IOS_ASC_API_KEY }}
              run: |
                  set -euo pipefail
                  key_path="$RUNNER_TEMP/asc-dedupe/asc_api_key.p8"
                  mkdir -p "$(dirname "$key_path")"
                  printf '%s' "$ASC_API_KEY" > "$key_path"
                  chmod 600 "$key_path"
                  echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

            - name: Dedupe screenshots
              uses: rnw-community/mobile-ci/actions/asc-dedupe-screenshots@443067982b184fe16ceef20a8ff2e36d5af286b6 # v4.6.0
              with:
                  app-id: com.vitalyiegorov.budgie
                  asc-key-path: ${{ env.ASC_KEY_PATH }}
                  asc-key-id: ${{ secrets.EXPO_IOS_ASC_KEY_ID }}
                  asc-issuer-id: ${{ secrets.EXPO_IOS_ASC_ISSUER_ID }}
                  # A manual maintenance dispatch with no version in flight is a no-op;
                  # after a publish run the version must exist, so that stays an error.
                  missing-version: ${{ github.event_name == 'workflow_dispatch' && 'skip' || 'error' }}

            - name: Remove ASC key
              if: always()
              run: rm -f "$RUNNER_TEMP/asc-dedupe/asc_api_key.p8"

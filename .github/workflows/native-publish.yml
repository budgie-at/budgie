name: Build and Publish to Stores

on:
  workflow_dispatch:
    inputs:
      push_screenshots:
        description: 'Also upload the committed store screenshots'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  assert-ai:
    permissions:
      contents: read
    uses: ./.github/workflows/assert-ai.yml
    with:
      app-variant: production
      eas-build-profile: production
      runner-labels: '["self-hosted","linux-portable-4x8"]'

  publish:
    name: iOS build and publish
    needs: assert-ai
    permissions:
      contents: read
    uses: rnw-community/mobile-ci/.github/workflows/native-publish.yml@9a151735055f5ab661650523ad7c6375ae007bef # v4.12.0
    with:
      control-runner-labels: '["self-hosted","linux-portable-2x4"]'
      lint-runner-labels: '["self-hosted","trf-linux-amd64-4x8"]'
      enable-ios: true
      enable-android: false
      ios-runner-labels: '["self-hosted","macOS","ARM64","macos-maestro"]'
      app-dir: packages/app
      build-profile: production
      submit-profile: production
      asc-key-path: asc_api_key.p8
      google-key-path: google-service-account.json
      install-command: pnpm install --frozen-lockfile
      install-cache-paths: |
          node_modules/.pnpm/llama.rn@*/node_modules/llama.rn/android/src/main/jniLibs
          node_modules/.pnpm/llama.rn@*/node_modules/llama.rn/ios/rnllama.xcframework
      install-cache-key: llama.rn-0.13.0-rc.7-react-native-0.88.1
      package-manager: pnpm
      publish-env: |
        EXPO_NO_TELEMETRY=1
        APP_VARIANT=production
        EXPO_APPLE_TEAM_TYPE=INDIVIDUAL
        EXPO_APPLE_TEAM_ID=3R8589YV24
        EXPO_USE_PRECOMPILED_MODULES=1
        RCT_USE_PREBUILT_RNCORE=1
        RCT_USE_RN_DEP=1
        PUSH_SCREENSHOTS=${{ inputs.push_screenshots }}
      ios-pre-submit-command: |
        export PATH="$HOME/.rbenv/shims:/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        fastlane store_preflight
      ios-post-submit-command: |
        export PATH="$HOME/.rbenv/shims:/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        pnpm store:notes -- --check
        fastlane ios ios_metadata
        if [ "$PUSH_SCREENSHOTS" = 'true' ]; then
          fastlane ios ios_screenshots
        fi
      android-pre-submit-command: |
        export PATH="$HOME/.rbenv/shims:/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        fastlane store_preflight
      android-post-submit-command: |
        export PATH="$HOME/.rbenv/shims:/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        pnpm store:notes -- --check
        fastlane android android_metadata
        if [ "$PUSH_SCREENSHOTS" = 'true' ]; then
          fastlane android android_screenshots
        fi
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_API_KEY: ${{ secrets.EXPO_IOS_ASC_API_KEY }}
      ASC_KEY_ID: ${{ secrets.EXPO_IOS_ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.EXPO_IOS_ASC_ISSUER_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      EAS_EXTRA_ENV: ASC_REVIEW_CONTACT_PHONE=${{ secrets.ASC_REVIEW_CONTACT_PHONE }}

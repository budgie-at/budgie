name: Build and Publish to Stores

on:
  workflow_dispatch:
    inputs:
      push_screenshots:
        description: 'Also upload the committed store screenshots'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  assert-ai:
    name: Assert AI is enabled
    runs-on: [self-hosted, trf-linux-amd64-4x8]
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      APP_VARIANT: production
      EAS_BUILD_PROFILE: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2

      - name: Restore package manager cache
        uses: rnw-community/mobile-ci/actions/node-pm-cache@f90309c791283d6e2dd1e35eb2ae6c5aee2151cd # v4.7.0
        with:
          package-manager: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert AI is enabled
        run: bash .github/scripts/assert-ai-enabled.sh

  publish:
    name: iOS build and publish
    needs: assert-ai
    permissions:
      contents: read
    uses: rnw-community/mobile-ci/.github/workflows/native-publish.yml@f90309c791283d6e2dd1e35eb2ae6c5aee2151cd # v4.7.0
    with:
      control-runner-labels: '["self-hosted","trf-linux-amd64-2x4"]'
      lint-runner-labels: '["self-hosted","trf-linux-amd64-4x8"]'
      enable-ios: true
      enable-android: false
      ios-runner-labels: '["self-hosted","macOS","ARM64","macos-maestro"]'
      app-dir: packages/app
      build-profile: production
      submit-profile: production
      asc-key-path: asc_api_key.p8
      google-key-path: google-service-account.json
      install-command: pnpm install --frozen-lockfile
      package-manager: pnpm
      publish-env: |
        EXPO_NO_TELEMETRY=1
        APP_VARIANT=production
        EXPO_APPLE_TEAM_TYPE=INDIVIDUAL
        EXPO_APPLE_TEAM_ID=3R8589YV24
        EXPO_USE_PRECOMPILED_MODULES=1
        RCT_USE_PREBUILT_RNCORE=1
        RCT_USE_RN_DEP=1
        PUSH_SCREENSHOTS=${{ inputs.push_screenshots }}
      ios-pre-submit-command: |
        export PATH="$HOME/.rbenv/shims:/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        fastlane store_preflight
      ios-post-submit-command: |
        export PATH="$HOME/.rbenv/shims:/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        pnpm store:notes -- --check
        fastlane ios ios_metadata
        if [ "$PUSH_SCREENSHOTS" = 'true' ]; then
          fastlane ios ios_screenshots
        fi
      android-pre-submit-command: |
        export PATH="$HOME/.rbenv/shims:/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        fastlane store_preflight
      android-post-submit-command: |
        export PATH="$HOME/.rbenv/shims:/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"
        pnpm store:notes -- --check
        fastlane android android_metadata
        if [ "$PUSH_SCREENSHOTS" = 'true' ]; then
          fastlane android android_screenshots
        fi
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_API_KEY: ${{ secrets.EXPO_IOS_ASC_API_KEY }}
      ASC_KEY_ID: ${{ secrets.EXPO_IOS_ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.EXPO_IOS_ASC_ISSUER_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      EAS_EXTRA_ENV: ASC_REVIEW_CONTACT_PHONE=${{ secrets.ASC_REVIEW_CONTACT_PHONE }}
